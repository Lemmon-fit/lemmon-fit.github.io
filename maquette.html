  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 6, unite: \"min\", last: \"6 min\", remp: \"Échauffement articulaire\", lines: [\n        \"Règle la selle : jambe presque tendue en bas de pédalage, genou jamais bloqué.\",\n        \"Allure modérée, tu dois pouvoir tenir une conversation.\",\n        \"But : monter la température, pas fatiguer les jambes avant la séance.\" ] },\n      { nom: \"Développé couché barre\", mat: \"Barre, banc plat, supports\", muscle: \"Pectoraux\", n: 4, kg: 40, reps: 8, last: \"40 kg × 8\", remp: \"Développé couché haltères\", lines: [\n        \"Omoplates serrées et plaquées dans le banc, pieds ancrés au sol.\",\n        \"La barre descend au niveau des tétons, pas sur la gorge, et frôle le torse.\",\n        \"Coudes à 45° du buste, jamais écartés à 90°.\",\n        \"Erreur fréquente : rebondir sur la poitrine. Marque un temps d'arrêt en bas.\" ] },\n      { nom: \"Développé militaire barre\", mat: \"Barre, supports à hauteur de poitrine\", muscle: \"Épaules\", n: 4, kg: 25, reps: 8, last: \"25 kg × 7\", remp: \"Développé militaire haltères\", lines: [\n        \"Barre posée sur le haut de la poitrine, mains un peu plus larges que les épaules.\",\n        \"Rentre légèrement la tête en arrière au passage de la barre, puis reviens sous elle.\",\n        \"Fessiers et abdos serrés pour verrouiller le bassin.\",\n        \"Erreur fréquente : cambrer le bas du dos pour finir la répétition. Réduis la charge.\" ] },\n      { nom: \"Écartés haltères\", mat: \"Deux haltères légers, banc plat\", muscle: \"Pectoraux\", n: 3, kg: 10, reps: 12, last: \"10 kg × 12\", remp: \"Écartés à la poulie\", lines: [\n        \"Coudes légèrement fléchis et FIGÉS pendant tout le mouvement : c'est un écarté, pas un développé.\",\n        \"Descends jusqu'à sentir l'étirement, sans forcer sur l'épaule.\",\n        \"Charge légère : le mouvement se sent, il ne se soulève pas.\" ] },\n      { nom: \"Dips assistés\", mat: \"Machine à dips assistés\", muscle: \"Triceps\", n: 3, kg: 20, reps: 10, last: \"20 kg × 9\", remp: \"Pompes déclinées\", lines: [\n        \"Buste presque vertical pour cibler les triceps, penché pour les pectoraux.\",\n        \"Descends jusqu'à ce que les coudes forment un angle droit, pas plus bas.\",\n        \"Épaules basses, ne remonte pas les trapèzes vers les oreilles.\" ] },\n      { nom: \"Triceps à la corde\", mat: \"Poulie haute, corde\", muscle: \"Triceps\", n: 3, kg: 15, reps: 14, last: \"15 kg × 14\", remp: \"Extensions nuque haltère\", lines: [\n        \"Coudes collés au buste et immobiles : seuls les avant-bras bougent.\",\n        \"Écarte les deux brins de la corde en fin d'extension.\",\n        \"Contrôle la remontée, ne laisse pas la charge tirer le bras.\" ] },\n      { nom: \"Gainage abdo\", mat: \"Aucun matériel, un tapis si le sol est dur\", muscle: \"Ceinture\", n: 3, kg: 0, reps: 40, unite: \"s\", last: \"40 s\", remp: \"Planche latérale\", lines: [\n        \"Appui sur les avant-bras, coudes sous les épaules, corps en ligne droite.\",\n        \"Serre les fessiers et rentre légèrement le bassin : le bas du dos ne creuse pas.\",\n        \"Respire normalement, ne bloque pas.\",\n        \"Erreur fréquente : fessiers en l'air. Mieux vaut 20 secondes correctes que 60 mal tenues.\" ] }\n    ]},\n    { code: \"PULL\", sub: \"Dos / Biceps\", exos: [\n      { nom: \"Warm-up vélo\", mat: \"Vélo droit, cardio\", muscle: \"Échauffement\", n: 1, kg: 0, reps: 6, unite: \"min\", last: \"6 min\", remp: \"Échauffement articulaire\", lines: [\n        \"Règle la selle : jambe presque tendue en bas de pédalage, genou jamais bloqué.\",\n        \"Allure modérée, tu dois pouvoir tenir une conversation.\",\n        \"But : monter la température, pas fatiguer le dos avant la séance.\" ] },\n      { nom: \"Tirage poitrine (lat pulldown)\", mat: \"Poulie haute, barre large\", muscle: \"Dos\", n: 4, kg: 45, reps: 9, last: \"45 kg × 9\", remp: \"Traction assistée élastique\", lines: [\n        \"Cales à cuisses bien serrées pour ne pas décoller du siège.\",\n        \"Amène la barre au haut de la poitrine, pas derrière la nuque.\",\n        \"Erreur fréquente : tirer avec les bras. Pense à ramener les coudes vers les hanches.\" ] },\n      { nom: \"Pull-ups ou tirage assisté\", mat: \"Barre de traction, ou machine assistée\", muscle: \"Dos\", n: 3, kg: 15, reps: 8, last: \"15 kg × 8\", remp: \"Tirage vertical élastique\", lines: [\n        \"Traction stricte si tu peux, sinon machine assistée avec un contrepoids qui te laisse finir la série.\",\n        \"Monte jusqu'à ce que le menton passe la barre.\",\n        \"Descends bras presque tendus : la demi-amplitude ne construit pas grand-chose.\" ] },\n      { nom: \"Rowing haltère un bras\", mat: \"Un haltère, un banc ou une chaise\", muscle: \"Dos\", n: 4, kg: 22, reps: 11, last: \"22 kg × 11\", remp: \"Tirage horizontal (seated row)\", lines: [\n        \"Main et genou opposés en appui, dos plat et parallèle au sol.\",\n        \"Tire le coude vers la hanche, pas vers l'épaule.\",\n        \"Ne fais pas tourner le buste pour gagner de l'amplitude.\",\n        \"Erreur fréquente : dos arrondi. Regarde le sol un mètre devant toi.\" ] },\n      { nom: \"Biceps curl haltères\", mat: \"Deux haltères\", muscle: \"Biceps\", n: 3, kg: 12, reps: 11, last: \"12 kg × 11\", remp: \"Curl à la poulie basse\", lines: [\n        \"Coudes collés au buste pendant toute la montée.\",\n        \"Contrôle la descente sur environ trois secondes.\",\n        \"Ne balance pas le buste : si tu dois t'aider, la charge est trop lourde.\" ] },\n      { nom: \"Curl concentration\", mat: \"Un haltère, assis\", muscle: \"Biceps\", n: 2, kg: 10, reps: 13, last: \"10 kg × 13\", remp: \"Curl marteau haltères\", lines: [\n        \"Coude calé contre l'intérieur de la cuisse, bras immobile.\",\n        \"Monte sans à-coup, marque un temps en haut.\",\n        \"Charge légère : c'est un exercice de fin de séance.\" ] },\n      { nom: \"Crunch décliné\", mat: \"Banc décliné\", muscle: \"Abdominaux\", n: 3, kg: 0, reps: 14, last: \"14 reps\", remp: \"Machine à abdominaux\", lines: [\n        \"Enroule la colonne, ne tire pas sur la nuque.\",\n        \"Souffle en montant, expire complètement en haut.\",\n        \"Descends sans relâcher complètement entre deux répétitions.\" ] }\n    ]},\n    { code: \"LEGS\", sub: \"Jambes, moteur de la perte\", exos: [\n      { nom: \"Warm-up stepper\", mat: \"Stepper ou escalier mécanique\", muscle: \"Échauffement\", n: 1, kg: 0, reps: 6, unite: \"min\", last: \"6 min\", remp: \"Warm-up vélo\", lines: [\n        \"Buste droit, ne t'appuie pas sur les poignées, elles servent juste à l'équilibre.\",\n        \"Cadence régulière plutôt que rapide.\",\n        \"But : chauffer les hanches et les genoux avant les charges.\" ] },\n      { nom: \"Leg press\", mat: \"Presse à cuisses\", muscle: \"Quadriceps\", n: 4, kg: 90, reps: 9, last: \"90 kg × 9\", remp: \"Squat barre\", lines: [\n        \"Pieds à largeur d'épaules au milieu du plateau, dos et bassin plaqués.\",\n        \"Ne verrouille pas les genoux en fin de poussée.\",\n        \"Descends jusqu'à 90° au genou, pas plus si le bassin décolle.\" ] },\n      { nom: \"Squat goblet\", mat: \"Un haltère ou une kettlebell\", muscle: \"Quadriceps\", n: 3, kg: 20, reps: 10, last: \"20 kg × 10\", remp: \"Fentes haltères\", lines: [\n        \"Haltère tenu verticalement contre la poitrine, coudes vers le bas.\",\n        \"Descends entre les talons, buste droit, genoux dans l'axe des pieds.\",\n        \"Pousse le sol avec tout le pied pour remonter.\" ] },\n      { nom: \"Extension quadriceps\", mat: \"Machine à extension de jambes\", muscle: \"Quadriceps\", n: 3, kg: 35, reps: 13, last: \"35 kg × 13\", remp: \"Squat bulgare\", lines: [\n        \"Règle le dossier pour que le genou soit dans l'axe de rotation.\",\n        \"Marque un temps d'arrêt en haut, jambe tendue sans à-coup.\",\n        \"Descends lentement : c'est là que le muscle travaille le plus.\" ] },\n      { nom: \"Machine abduction\", mat: \"Machine à abduction (écarter)\", muscle: \"Hanches\", n: 2, kg: 30, reps: 14, last: \"30 kg × 14\", remp: \"Abduction élastique\", lines: [\n        \"Dos plaqué au dossier, mains sur les poignées.\",\n        \"Écarte sans à-coup, reviens en contrôlant.\",\n        \"Amplitude confortable, pas maximale.\" ] },\n      { nom: \"Mollets debout\", mat: \"Machine à mollets, ou une marche\", muscle: \"Mollets\", n: 3, kg: 40, reps: 15, last: \"40 kg × 15\", remp: \"Mollets sur une marche\", lines: [\n        \"Monte le plus haut possible sur la pointe des pieds, marque une seconde.\",\n        \"Descends jusqu'à l'étirement complet du talon.\",\n        \"Genoux tendus mais pas verrouillés.\" ] }\n    ]},\n    { code: \"HIIT\", sub: \"Rameur Tabata + abdos\", exos: [\n      { nom: \"Warm-up marche\", mat: \"Tapis de marche\", muscle: \"Échauffement\", n: 1, kg: 0, reps: 4, unite: \"min\", last: \"4 min\", remp: \"Échauffement articulaire\", lines: [\n        \"Marche franche, sans pente au début.\",\n        \"Quatre minutes suffisent avant du HIIT : le but est de lancer la circulation.\" ] },\n      { nom: \"Rameur HIIT tabata\", mat: \"Rameur\", muscle: \"Cardio\", n: 8, kg: 0, reps: 20, unite: \"s\", last: \"20 s explosion\", remp: \"Vélo elliptique en intervalles\", lines: [\n        \"Ordre du mouvement : jambes, puis buste, puis bras. Retour dans l'ordre inverse.\",\n        \"20 secondes à fond, 40 secondes de récupération, sans descendre du rameur.\",\n        \"Si la puissance chute de plus d'un tiers, arrête la série.\" ] },\n      { nom: \"Machine crunch\", mat: \"Machine à abdominaux\", muscle: \"Abdominaux\", n: 3, kg: 25, reps: 15, last: \"25 kg × 15\", remp: \"Crunch décliné\", lines: [\n        \"Enroule le buste vers le bassin, la charge suit le mouvement.\",\n        \"Pas de traction sur la nuque ni sur les bras.\",\n        \"Souffle à fond en position basse.\" ] },\n      { nom: \"Relevés de genoux\", mat: \"Chaise romaine, ou barre de traction\", muscle: \"Abdominaux\", n: 3, kg: 0, reps: 13, last: \"13 reps\", remp: \"Relevés de jambes au sol\", lines: [\n        \"Épaules basses, dos plaqué au dossier.\",\n        \"Monte les genoux vers la poitrine en enroulant le bassin.\",\n        \"Erreur fréquente : balancer les jambes. Descends lentement.\" ] },\n      { nom: \"Planche latérale\", mat: \"Aucun matériel\", muscle: \"Ceinture\", n: 2, kg: 0, reps: 30, unite: \"s\", last: \"30 s / côté\", remp: \"Gainage abdo\", lines: [\n        \"Coude sous l'épaule, corps aligné de la cheville à la tête.\",\n        \"Bassin haut : ne laisse pas la hanche descendre vers le sol.\",\n        \"Même durée des deux côtés, même si un côté est plus faible.\" ] }\n    ]},\n    { code: \"FULL BODY\", sub: \"Consolidation légère\", exos: [\n      { nom: \"Warm-up vélo allongé\", mat: \"Vélo allongé (semi-couché)\", muscle: \"Échauffement\", n: 1, kg: 0, reps: 6, unite: \"min\", last: \"6 min\", remp: \"Warm-up vélo\", lines: [\n        \"Dossier réglé pour que les jambes soient presque tendues en fin de poussée.\",\n        \"Allure tranquille : c'est un échauffement, pas un travail cardio.\" ] },\n      { nom: \"Bench press léger\", mat: \"Barre, banc plat\", muscle: \"Pectoraux\", n: 3, kg: 30, reps: 10, last: \"30 kg × 10\", remp: \"Pompes\", lines: [\n        \"Même technique que le développé couché, avec une charge nettement allégée.\",\n        \"Séance de consolidation : on entretient le mouvement, on ne cherche pas le maximum.\",\n        \"Marque un temps d'arrêt en bas à chaque répétition.\" ] },\n      { nom: \"Tirage poitrine léger\", mat: \"Poulie haute, barre large\", muscle: \"Dos\", n: 3, kg: 32, reps: 12, last: \"32 kg × 12\", remp: \"Rowing élastique\", lines: [\n        \"Même technique que le tirage poitrine, avec une charge plus légère.\",\n        \"Cherche la sensation musculaire, pas la performance.\",\n        \"Retour complet bras tendus entre chaque répétition.\" ] },\n      { nom: \"Leg press léger\", mat: \"Presse à cuisses\", muscle: \"Jambes\", n: 3, kg: 60, reps: 12, last: \"60 kg × 12\", remp: \"Squat au poids de corps\", lines: [\n        \"Charge allégée, amplitude complète.\",\n        \"Dos et bassin plaqués contre le dossier.\",\n        \"Ne verrouille pas les genoux.\" ] },\n      { nom: \"Biceps curl léger\", mat: \"Deux haltères\", muscle: \"Biceps\", n: 2, kg: 8, reps: 12, last: \"8 kg × 12\", remp: \"Curl élastique\", lines: [\n        \"Coudes collés au buste, mouvement lent.\",\n        \"Descente contrôlée sur trois secondes.\",\n        \"Aucun balancier du buste.\" ] },\n      { nom: \"Abdo combo : crunch + relevés\", mat: \"Aucun matériel\", muscle: \"Abdominaux\", n: 2, kg: 0, reps: 12, last: \"12 reps\", remp: \"Gainage abdo\", lines: [\n        \"Un crunch, puis un relevé de jambes, sans poser les pieds.\",\n        \"Douze enchaînements par série.\",\n        \"Souffle à chaque montée.\" ] }\n    ]}\n  ];\n\n  REPAS = [\n    { h: \"07:30\", nom: \"Petit-déjeuner\", det: \"3 œufs, 60 g de flocons, une banane\", prot: 28, kcal: 520 },\n    { h: \"10:30\", nom: \"Collation\", det: \"Skyr 150 g, 20 g d'amandes\", prot: 20, kcal: 260 },\n    { h: \"12:45\", nom: \"Déjeuner\", det: \"Poulet 180 g, riz 200 g cuit, légumes verts\", prot: 45, kcal: 690 },\n    { h: \"16:30\", nom: \"Collation post-séance\", det: \"Whey 30 g, une banane\", prot: 25, kcal: 240 },\n    { h: \"19:45\", nom: \"Dîner\", det: \"Cabillaud 180 g, patate douce 200 g, salade\", prot: 38, kcal: 560 }\n  ];\n\n  SUPPS = [\n    { nom: \"Pure Whey 30 g\", quand: \"Après la séance, ou quand les protéines manquent\", macro: \"24 g · 114 kcal\" },\n    { nom: \"Créatine 5 g\", quand: \"Au choix, tous les jours y compris repos\", macro: \"0 g · 0 kcal\" },\n    { nom: \"Vitamine D\", quand: \"Le matin, d'octobre à mars\", macro: \"—\" }\n  ];\n\n  // GEAR_OPTIONS, reprises verbatim du code (13 machines, avec leur libellé et\n  // leur indication). Ordonnées par zone : haut du corps, bas du corps, abdos, cardio.\n  GEAR = [\n    { t: \"Poulies haute et basse\", s: \"tirages, triceps corde, écartés\" },\n    { t: \"Machine chest press\", s: \"développé poitrine assis\" },\n    { t: \"Machine développé épaules\", s: \"\" },\n    { t: \"Dips ou traction assistés\", s: \"machine à contrepoids\" },\n    { t: \"Presse à cuisses\", s: \"leg press\" },\n    { t: \"Extension quadriceps\", s: \"\" },\n    { t: \"Leg curl\", s: \"machine à ischio-jambiers\" },\n    { t: \"Abduction et adduction\", s: \"écarter, resserrer\" },\n    { t: \"Machine à mollets\", s: \"\" },\n    { t: \"Machine à abdominaux\", s: \"\" },\n    { t: \"Chaise romaine\", s: \"relevés de genoux suspendu\" },\n    { t: \"Banc décliné\", s: \"\" },\n    { t: \"Cardio de salle\", s: \"stepper, elliptique, vélo allongé\" }\n  ];\n\n  // Les 6 categories de materiel du generateur. Le poids du corps n'y est pas :\n  // il est toujours disponible, c'est ce qui garantit qu'un creneau trouve preneur.\n  EQUIP = [\n    { t: \"Machines de salle\", s: \"Poulies, presses, machines guidées\" },\n    { t: \"Barre et disques\", s: \"Barre olympique, supports ou cage\" },\n    { t: \"Haltères\", s: \"Paire réglable ou fixe\" },\n    { t: \"Barre de traction\", s: \"Fixée à une porte ou au mur\" },\n    { t: \"Élastiques\", s: \"Long, ou set de résistances\" },\n    { t: \"Cardio\", s: \"Tapis, rameur, vélo, elliptique\" }\n  ];\n\n  DUREES = [\n    { t: \"30 minutes\", s: \"4 exercices, séries courtes\" },\n    { t: \"45 minutes\", s: \"6 exercices, le format standard\" },\n    { t: \"60 minutes\", s: \"7 exercices, repos complets sur les barres\" },\n    { t: \"1 h 15\", s: \"8 exercices, volume élevé\" }\n  ];\n\n  // La ROTATION du programme. Les journees ne portent pas de jour : c'est\n  // l'etape Rythme qui les affecte, sinon une seance resterait proposee un jour\n  // que l'utilisateur vient de decocher.\n  OB = [\n    { nom: \"Toi\", titre: \"On commence par toi\", sous: \"Rien de tout ça ne quitte ton téléphone.\", type: \"champs\",\n      champs: [{ l: \"Prénom\", v: \"Olivier\" }, { l: \"Âge\", v: \"38 ans\" }, { l: \"Taille\", v: \"178 cm\" }] },\n    { nom: \"Poids\", titre: \"Où tu en es, où tu vas\", sous: \"Ces deux nombres calculent tes repères caloriques.\", type: \"champs\",\n      champs: [{ l: \"Poids actuel\", v: \"78,4 kg\" }, { l: \"Poids cible\", v: \"75,0 kg\" }] },\n    { nom: \"Objectif\", titre: \"Tu cherches quoi ?\", sous: \"Ça décide du déficit ou du surplus appliqué.\", type: \"chips\", single: \"obObjectif\",\n      chips: [{ t: \"Perdre du gras\", s: \"Déficit plafonné à 500 kcal\" },\n              { t: \"Maintenir\", s: \"Calories au niveau du maintien\" },\n              { t: \"Prendre du muscle\", s: \"Surplus plafonné à 400 kcal\" }] },\n    { nom: \"Pratique\", titre: \"Tu en es où avec la musculation ?\", sous: \"Ça fixe le volume de départ et la vitesse de progression.\", type: \"chips\", single: \"obPratique\",\n      chips: [{ t: \"Je débute\", s: \"Moins de 3 mois\" },\n              { t: \"Je reprends\", s: \"J'ai déjà pratiqué, arrêté depuis\" },\n              { t: \"Régulier\", s: \"6 mois et plus, sans coupure\" },\n              { t: \"Assidu\", s: \"2 ans et plus, je connais mes charges\" }] },\n    { nom: \"Rythme\", titre: \"Quels jours tu t'entraînes ?\", sous: \"Le nombre de jours entre aussi dans le calcul des calories.\", type: \"jours\" },\n    { nom: \"Durée\", titre: \"Combien de temps par séance ?\", sous: \"C'est ce qui fixe le nombre d'exercices et la longueur des repos. Réponds avec le temps que tu as vraiment, pas celui que tu voudrais avoir.\", type: \"duree\" },\n    { nom: \"Matériel\", titre: \"Tu t'entraînes où, avec quoi ?\", sous: \"Ça détermine les exercices que je te propose. Sois précis : c'est la réponse qui évite le plus d'erreurs.\", type: \"materiel\" },\n    { nom: \"Programme\", titre: \"Voilà ton programme\", sous: \"Une séance par jour coché. Déplie-les, et refuse ce qui ne te convient pas : je remplace tout de suite par un mouvement équivalent.\", type: \"programme\" },\n    { nom: \"Nutrition\", titre: \"Tes repères alimentaires\", sous: \"Estimés depuis ton poids et ton volume d'entraînement.\", type: \"recap\",\n      recap: [{ l: \"Maintien estimé\", v: \"2 800 kcal/j\" }, { l: \"Cible pour avancer\", v: \"2 340 kcal/j\" },\n              { l: \"Protéines\", v: \"135 g/j\" }, { l: \"Horizon 75 kg\", v: \"~11 semaines\" }],\n      note: \"Ce sont des repères, pas une prescription. Ils sortent d'une estimation à partir de ton poids et de ton volume d'entraînement, sans mesurer ton métabolisme. Ajuste-les d'après ce que fait la balance sur trois semaines.\" },\n    { nom: \"C'est parti\", titre: \"Tout est prêt\", sous: \"Tu peux revenir sur chaque réponse depuis Moi, à tout moment.\", type: \"recap\",\n      recap: [{ l: \"Profil\", v: \"Olivier · 38 ans\" }, { l: \"Objectif\", v: \"78,4 → 75 kg\" },\n              { l: \"Rythme\", v: \"@JOURS@\" }, { l: \"Programme\", v: \"@PROG@\" }],\n      note: \"Rien n'est envoyé nulle part. Pense à exporter ton journal de temps en temps depuis Moi › Profil : c'est la seule copie.\" }\n  ];\n\n  componentDidMount() {\n    // Premier lancement : logo, puis diagnostic. Une fois le diagnostic passé,\n    // `vu` reste vrai et le logo ne réapparaît plus.\n    this._s = setTimeout(() => {\n      this.setState(p => p.ecran === \"splash\" ? { ecran: p.vu ? \"jour\" : \"onb\" } : null);\n    }, 1700);\n    this._t = setInterval(() => {\n      const s = this.state;\n      if (s.ecran !== \"salle\") return;\n      if (s.phase === \"repos\") {\n        if (s.repos <= 1) this.setState({ phase: \"set\", repos: this.duree(), chrono: s.chrono + 1 });\n        else this.setState({ repos: s.repos - 1, chrono: s.chrono + 1 });\n      } else if (s.phase === \"set\") this.setState({ chrono: s.chrono + 1 });\n    }, 1000);\n  }\n  componentWillUnmount() { clearInterval(this._t); clearTimeout(this._s); }\n\n  duree() { return this.props.dureeRepos ?? 90; }\n  // Nombre d'exercices de TRAVAIL que la duree choisie laisse tenir,\n  // echauffement en plus. C'est la reponse de l'etape Duree qui decide.\n  nbTravail() { return [3, 5, 6, 7][this.state.obDuree]; }\n\n  // La seance effective : echauffement + N exercices de travail, chacun\n  // remplace par son equivalent s'il a ete refuse au diagnostic.\n  exosDe(idx) {\n    const S = this.SEANCES[idx];\n    const gardes = S.exos.filter((e, i) => i === 0 || i <= this.nbTravail());\n    return gardes.map((e, i) => {\n      const refuse = !!this.state.obRefus[S.code + \"-\" + S.exos.indexOf(e)];\n      if (!refuse) return e;\n      return Object.assign({}, e, { nom: e.remp, remplace: e.nom, mat: \"\", lines: [] });\n    });\n  }\n  exos() { return this.exosDe(this.state.seance); }\n  faitsOu() { return this.state.faits || this.exos().map(() => []); }\n  go(e) { return () => this.setState({ ecran: e, picker: false }); }\n  mmss(n) { const m = Math.floor(n / 60), s = n % 60; return m + \":\" + (s < 10 ? \"0\" : \"\") + s; }\n\n  ouvrir(i) {\n    const e = this.exos()[i];\n    const f = this.faitsOu();\n    const dernier = f[i].length ? f[i][f[i].length - 1] : null;\n    this.setState({ ecran: \"salle\", demarre: true, tIdx: i, phase: \"set\", faits: f,\n      kg: dernier ? dernier.kg : e.kg, reps: dernier ? dernier.reps : e.reps, tech: false });\n  }\n\n  choisirSeance(i) {\n    const ex = this.exosDe(i);\n    this.setState({ seance: i, picker: false, tIdx: 0, faits: ex.map(() => []),\n      kg: ex[0].kg, reps: ex[0].reps, phase: \"set\", chrono: 0, demarre: false, tech: false });\n  }\n\n  // Le passage d'un exercice au suivant ne se fait plus en silence : il ouvre\n  // l'ecran d'enchainement, ou le suivant est propose ET les autres restent\n  // accessibles. Sauter un exercice sans le voir etait le reproche principal.\n  valider = () => {\n    const s = this.state, ex = this.exos(), exo = ex[s.tIdx], f0 = this.faitsOu();\n    if (f0[s.tIdx].length >= exo.n) return;\n    const faits = f0.map(a => a.slice());\n    faits[s.tIdx].push({ kg: s.kg, reps: s.reps });\n    if (faits[s.tIdx].length >= exo.n) {\n      const reste = ex.some((e, i) => faits[i].length < e.n);\n      this.setState({ faits, finiIdx: s.tIdx, phase: reste ? \"transition\" : \"fin\" });\n    } else this.setState({ faits, phase: \"repos\", repos: this.duree() });\n  };\n\n  // Amorce un exemple coherent pour l'apercu : le premier exercice est\n  // reellement rempli, sinon l'ecran annonce « termine · 0 series ».\n  montrerTransition() {\n    const ex = this.exos();\n    const faits = this.faitsOu().map(a => a.slice());\n    if (faits[0].length < ex[0].n) {\n      faits[0] = Array.from({ length: ex[0].n }, () => ({ kg: ex[0].kg, reps: ex[0].reps }));\n    }\n    this.setState({ ecran: \"salle\", phase: \"transition\", demarre: true, faits, finiIdx: 0, tIdx: 0 });\n  }\n\n  reculerVers(i) {\n    const faits = this.faitsOu().map(a => a.slice());\n    const exo = this.exos()[i];\n    let kg = exo.kg, reps = exo.reps;\n    if (faits[i].length >= exo.n) { const d = faits[i].pop(); kg = d.kg; reps = d.reps; }\n    else if (faits[i].length) { const d = faits[i][faits[i].length - 1]; kg = d.kg; reps = d.reps; }\n    this.setState({ faits, tIdx: i, phase: \"set\", repos: this.duree(), kg, reps, tech: false });\n  }\n\n  exoPrecedent = () => {\n    const s = this.state;\n    if (s.phase === \"fin\" || s.phase === \"transition\") { this.reculerVers(s.finiIdx); return; }\n    this.reculerVers(s.tIdx === 0 ? 0 : s.tIdx - 1);\n  };\n\n  annuler = () => {\n    const s = this.state, faits = this.faitsOu().map(a => a.slice());\n    if (faits[s.tIdx].length) {\n      faits[s.tIdx].pop();\n      this.setState({ faits, phase: \"set\", repos: this.duree() });\n      return;\n    }\n    for (let i = s.tIdx - 1; i >= 0; i--) {\n      if (faits[i].length) {\n        const d = faits[i].pop();\n        this.setState({ faits, tIdx: i, phase: \"set\", repos: this.duree(), kg: d.kg, reps: d.reps, tech: false });\n        return;\n      }\n    }\n  };\n\n  promptProgramme(nJours, duree) {\n    return [\n      \"Tu es préparateur physique. Je suis en perte de gras, 78,4 kg pour\",\n      \"1,78 m, 38 ans, \" + nJours + \" séance\" + (nJours > 1 ? \"s\" : \"\") + \" par semaine en salle, \" + duree + \" par séance.\",\n      \"\",\n      \"== CE QUE J'AI FAIT SUR 4 SEMAINES ==\",\n      \"Développé couché barre : 37,5 → 42,5 kg, 4×8\",\n      \"Développé militaire barre : 25 kg, 4×7 (bloqué depuis 3 séances)\",\n      \"Rowing haltère un bras : 20 → 22 kg, 4×11\",\n      \"Leg press : 80 → 90 kg, 4×9\",\n      \"Volume hebdomadaire : 18,2 t, stable depuis 2 semaines.\",\n      \"\",\n      \"== MON MATÉRIEL ==\",\n      \"Salle : poulies haute et basse, chest press, dips assistés, presse à\",\n      \"cuisses, extension quadriceps, leg curl, abduction/adduction, mollets,\",\n      \"machine à abdominaux, chaise romaine, banc décliné, cardio de salle.\",\n      \"PAS de machine développé épaules. Barre olympique + cage, haltères\",\n      \"jusqu'à 24 kg, élastiques.\",\n      \"\",\n      \"== CE QUE JE VEUX SAVOIR ==\",\n      \"1. Mon programme est-il suffisant, ou trop simple pour mon niveau ?\",\n      \"   Est-il assez progressif, ou est-ce que je piétine ?\",\n      \"2. Qu'est-ce qui explique la stagnation du développé militaire ?\",\n      \"3. Quoi changer sur les 4 prochaines semaines ?\",\n      \"\",\n      \"Une ligne par changement, séparateur barre verticale :\",\n      \"exercice | nouvelle charge | séries × répétitions | pourquoi\",\n      \"N'invente pas d'exercice absent de mon matériel.\"\n    ].join(\"\\n\");\n  }\n\n  promptNutrition(nJours) {\n    return [\n      \"Tu es diététicien. Écris-moi le plan alimentaire d'UNE journée,\",\n      \"en français, pour un homme de 38 ans, 78,4 kg, 1,78 m, en perte\",\n      \"de gras avec \" + nJours + \" séance\" + (nJours > 1 ? \"s\" : \"\") + \" de musculation par semaine.\",\n      \"\",\n      \"== MES CIBLES, CALCULÉES PAR L'APPLI ==\",\n      \"2 340 kcal et 135 g de protéines pour la journée entière.\",\n      \"Mes compléments en apportent déjà 24 g et 114 kcal, et l'appli\",\n      \"les ajoutera elle-même : tes lignes doivent donc totaliser\",\n      \"environ 2 226 kcal et 111 g.\",\n      \"\",\n      \"== CONTRAINTES ==\",\n      \"Cinq prises : 07:30, 10:30, 12:45, 16:30, 19:45.\",\n      \"Pas de porc. Cuisine simple, moins de 20 min par repas.\",\n      \"\",\n      \"Une ligne par prise, exactement dans cette forme, séparateur\",\n      \"barre verticale :\",\n      \"repas | clé | ce que je mange, avec les quantités | protéines g | kcal\"\n    ].join(\"\\n\");\n  }\n\n  renderVals() {\n    const s = this.state, S = this.SEANCES[s.seance], ex = this.exos();\n    const exo = ex[s.tIdx] || ex[0], faits = this.faitsOu(), fCur = faits[s.tIdx] || [];\n    const bw = exo.kg === 0;\n    const totalFaits = faits.reduce((a, b) => a + b.length, 0);\n    const totalSets = ex.reduce((a, e) => a + e.n, 0);\n    const tonnage = faits.reduce((a, arr) => a + arr.reduce((x, y) => x + y.kg * y.reps, 0), 0);\n    const kgTxt = v => String(v).replace(\".\", \",\");\n    // reps / s / min : le warm-up se compte en minutes, le gainage en secondes.\n    const uCourt = e => e.unite === \"min\" ? \"min\" : e.unite === \"s\" ? \"s\" : \"reps\";\n    const uLong = e => e.unite === \"min\" ? \"Durée\" : e.unite === \"s\" ? \"Durée\" : \"Répétitions\";\n    const pas = e => e.unite === \"min\" ? 1 : e.unite === \"s\" ? 5 : 1;\n\n    const ecrans = [[\"jour\", \"Aujourd'hui\"], [\"salle\", \"Mode entraînement\"], [\"trans\", \"Enchaînement\"],\n      [\"nutri\", \"Nutrition\"], [\"histo\", \"Historique\"], [\"fiche\", \"Fiche exercice\"], [\"prog\", \"Progrès\"],\n      [\"moi\", \"Moi\"], [\"profil\", \"Moi › Profil\"], [\"exos\", \"Moi › Mes exercices\"],\n      [\"theme\", \"Moi › Apparence\"], [\"
