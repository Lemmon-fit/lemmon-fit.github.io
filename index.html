<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://api.mistral.ai; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LEMMON FIT">
<meta name="theme-color" content="#100f0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>LEMMON FIT</title>
<style>
  * { box-sizing: border-box; }
  button, input { -webkit-tap-highlight-color: transparent; }

  html, body { background: #100f0d; margin: 0; min-height: 100vh; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #ede6d3;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    overscroll-behavior-y: contain;
  }

  .container { max-width: 420px; margin: 0 auto; overflow-x: hidden; }

  /* Deux écrans : la séance d'un côté, tout le reste de l'autre.
     On ne rend QUE l'écran actif : garder les deux dans le DOM imposerait au
     conteneur la hauteur du plus grand, laissant un vide énorme sous le plus
     court. L'effet de glissement vient donc d'une animation d'entrée. */
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab {
    flex: 1; min-height: 46px; border-radius: 10px; background: transparent;
    border: 1.5px solid #8c8474 !important; color: #cfc6b3; font-size: 13px; font-weight: 700;
  }
  .tab-active { background: #f4d912; border-color: #f4d912 !important; color: #100f0d; }
  .swipe-hint { text-align: center; font-size: 11px; color: #8a8171; margin: -6px 0 14px; }

  @keyframes slideFromRight { from { transform: translateX(28px); opacity: 0.35; } to { transform: none; opacity: 1; } }
  @keyframes slideFromLeft  { from { transform: translateX(-28px); opacity: 0.35; } to { transform: none; opacity: 1; } }
  .page-from-right { animation: slideFromRight 0.22s ease-out; }
  .page-from-left  { animation: slideFromLeft 0.22s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .page-from-right, .page-from-left { animation: none; }
  }

  .brandmark { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .brandmark-icon { width: 22px; height: 22px; border-radius: 6px; }
  .brandmark-text { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; color: #cfc6b3; }
  .brandmark-text b { color: #f4d912; font-weight: 800; }

  #splash {
    position: fixed; inset: 0; background: #100f0d; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.4s ease;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  .splash-icon { width: 148px; height: 148px; }

  .banner {
    border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.4;
    margin-bottom: 16px; font-weight: 600;
  }
  .banner-error { background: rgba(193,104,95,0.15); border: 1px solid #c1685f; color: #f0b3ac; }
  .banner-ok { background: rgba(140,170,124,0.15); border: 1px solid #8caa7c; color: #cfe3c6; }
  .banner-info { background: rgba(74,158,255,0.12); border: 1px solid #4a9eff; color: #bcdcff; }
  .banner-warn { background: rgba(244,217,18,0.12); border: 1px solid #f4d912; color: #f2e58a; }
  .banner-btn {
    display: block; width: 100%; margin-top: 10px; min-height: 44px; border-radius: 8px;
    background: rgba(244,217,18,0.18); border: 1px solid #f4d912 !important;
    color: #f4d912; font-size: 13px; font-weight: 700;
  }

  .settings-card { border-color: #3a352c; }
  .backup-row { display: flex; gap: 8px; }
  .backup-btn {
    flex: 1; min-height: 48px; border-radius: 8px; border: 1.5px solid #8c8474 !important;
    background: transparent; color: #cfc6b3; font-size: 13px; font-weight: 600;
  }

  button { touch-action: manipulation; border: none; font-family: inherit; }

  .header { text-align: center; margin-bottom: 14px; }
  .header-date { font-size: 13px; color: #b3a890; text-transform: capitalize; margin-bottom: 4px; }
  .header-title { font-size: 30px; font-weight: 800; letter-spacing: 1px; margin: 0; color: #ede6d3; }
  .header-title-rest { color: #8caa7c; }
  .header-sub { font-size: 15px; color: #b3a890; margin-top: 4px; }
  .header-override { font-size: 12px; color: #f2e58a; margin-top: 7px; line-height: 1.4; }

  /* Ordre chronologique de gauche à droite : avant-hier, hier, aujourd'hui. */
  .day-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .day-btn {
    flex: 1; min-height: 44px; border-radius: 8px; border: 1.5px solid #8c8474 !important;
    background: transparent; color: #cfc6b3; font-size: 13px; font-weight: 600;
  }
  .day-btn-active { background: #f4d912; border-color: #f4d912 !important; color: #100f0d; }
  .day-date { width: 100%; margin-bottom: 14px; }
  .date-link {
    display: block; width: 100%; min-height: 40px; margin-bottom: 14px;
    background: transparent; color: #8a8171; font-size: 12px; text-decoration: underline;
    text-decoration-color: #4a4436;
  }
  .prog-toggle {
    width: 100%; min-height: 44px; background: transparent; border: 1px dashed #8c8474 !important;
    border-radius: 8px; color: #b3a890; font-size: 13px; font-weight: 600; margin-bottom: 10px;
  }
  .prog-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .prog-btn {
    flex: 1 1 auto; min-width: 74px; min-height: 46px; border-radius: 8px;
    border: 1.5px solid #8c8474 !important; background: transparent; color: #cfc6b3;
    font-size: 13px; font-weight: 700;
  }
  .prog-btn-active { background: #f4d912; border-color: #f4d912 !important; color: #100f0d; }

  .hero { text-align: center; margin-bottom: 20px; }
  .hero-flame-wrap { display: inline-flex; padding: 14px 22px; border-radius: 999px; }
  .glow-soft { box-shadow: 0 0 26px -4px var(--glow); }
  .glow-strong { box-shadow: 0 0 40px -2px var(--glow), 0 0 70px -10px var(--glow); }
  .hero-flame { display:flex; align-items:center; justify-content:center; gap: 8px; font-size: 28px; }
  .hero-number {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
    font-size: 44px; font-weight: 700; color: #ede6d3;
  }
  .hero-label { font-size: 13px; color: #b3a890; margin-top: 2px; }

  /* Grille par semaine. La barre de 20 carrés d'avant ne disait rien : elle
     répétait le streak affiché juste au-dessus, sans aucun repère de date, et
     devenait une barre pleine dès que ça se passait bien. Rangée en semaines
     avec les initiales des jours, le MOTIF des trous devient lisible : on voit
     qu'on saute toujours le vendredi. Ça, un compteur ne peut pas le dire. */
  /* Le nombre de colonnes vient du profil : il vaut le nombre de jours
     d'entrainement choisis, de 1 a 7. Il est donc pose en style en ligne. */
  .weekgrid {
    display: grid; grid-template-columns: 30px repeat(5, 1fr);
    gap: 5px; margin: 14px auto 0; max-width: 250px;
  }
  .wg-head, .wg-label {
    font-size: 10px; color: #a89e8a; text-align: center; line-height: 16px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .wg-label { text-align: right; padding-right: 3px; }
  .wg-cell { height: 17px; border-radius: 4px; }
  .wg-done { background: #f4d912; }
  .wg-miss { background: transparent; border: 1.5px solid #8c8474; }
  .wg-today { background: transparent; border: 1.5px solid #f4d912; box-shadow: inset 0 0 0 2px rgba(244,217,18,0.22); }
  .wg-today-done { background: #f4d912; box-shadow: 0 0 0 2px rgba(244,217,18,0.35); }
  .wg-future { background: transparent; border: 1.5px dashed #4a4436; }
  .wg-legend { display: flex; gap: 12px; justify-content: center; font-size: 10px; color: #8a8171; margin-top: 9px; flex-wrap: wrap; }
  .wg-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .wg-swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  .card { background: #24201b; border: 1px solid #3a352c; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card-title {
    font-size: 14px; font-weight: 700; color: #b3a890; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }

  .motivation-card { background: #2d2820; border-color: #4a4030; }
  .motivation-head { font-size: 20px; font-weight: 700; color: #ede6d3; margin-bottom: 6px; }
  .motivation-sub { font-size: 15px; color: #b3a890; line-height: 1.5; }

  .duration-pill {
    background: #3a352c; color: #d9cdb0; font-size: 11px; font-weight: 800;
    padding: 3px 8px; border-radius: 20px; margin-left: auto;
  }

  .last-session {
    font-size: 13px; color: #cfc6b3; background: #1e1a15; border-radius: 8px;
    padding: 9px 12px; margin-bottom: 12px; line-height: 1.4;
  }
  .last-session strong { color: #ede6d3; }
  .last-session-empty { color: #a89e8a; font-style: italic; }

  .detail-toggle {
    width: 100%; min-height: 48px; background: transparent; border: 1px dashed #8c8474 !important;
    border-radius: 8px; color: #b3a890; font-size: 13px; font-weight: 600; margin-bottom: 4px;
  }

  .exercise-list { list-style: none; margin: 12px 0 0; padding: 0; }
  .exercise-item { padding: 12px 0 14px 12px; border-bottom: 1px solid #3a352c; border-left: 3px solid transparent; }
  .exercise-item:last-child { border-bottom: none; }
  .exercise-item-top { display: flex; align-items: center; gap: 6px; }
  /* Le nom replie ou déplie l'exercice. Le « ? » vient juste après, collé au
     nom : posé en bout de ligne, on ne voyait plus à quoi il se rapportait. */
  .exercise-item-name {
    flex: 0 1 auto; text-align: left; background: transparent; padding: 4px 0; min-height: 44px;
    font-family: inherit; font-size: 14px; font-weight: 700; color: #ede6d3;
    display: flex; align-items: center; gap: 8px;
  }
  /* Chevron nettement visible : à 12 px il ne se lisait pas comme un bouton. */
  .exo-caret {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px;
    background: #3a352c; color: #f4d912;
    font-size: 13px; line-height: 22px; text-align: center;
  }
  .howto-btn {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid #8c8474 !important; background: transparent; color: #a89e8a;
    font-size: 13px; font-weight: 700; font-family: inherit;
  }
  .howto-btn[aria-expanded="true"] { border-color: #f4d912 !important; color: #f4d912; }
  .exercise-check-icon { margin-left: auto; }
  /* Replié : la ligne se tasse et se grise, pour que l'effet soit visible même
     sur un exercice court comme un échauffement. */
  .exercise-item-folded { padding-top: 6px; padding-bottom: 6px; opacity: 0.72; }
  .exercise-item-folded .exercise-item-name { min-height: 34px; font-weight: 600; }
  .exo-summary {
    font-size: 12px; color: #a89e8a; padding-left: 42px; margin-top: -4px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .exercise-item-detail { font-size: 13px; color: #b3a890; margin-top: 2px; }

  .howto {
    background: #1a1712; border: 1px solid #3a352c; border-radius: 8px;
    padding: 11px 12px; margin-top: 9px;
  }
  .howto-mat {
    font-size: 11px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
    color: #f4d912; margin-bottom: 7px;
  }
  .howto-list { margin: 0; padding-left: 17px; }
  .howto-list li { font-size: 13px; color: #cfc6b3; line-height: 1.45; margin-bottom: 5px; }
  .howto-video {
    display: block; text-align: center; margin-top: 10px; min-height: 44px; line-height: 44px;
    border-radius: 8px; border: 1px solid #4a9eff; background: rgba(74,158,255,0.14);
    color: #bcdcff; font-size: 13px; font-weight: 700; text-decoration: none;
  }
  .howto-note { font-size: 11px; color: #8a8171; margin-top: 8px; line-height: 1.4; }
  .exercise-item-done { border-left-color: #8caa7c; background: rgba(140,170,124,0.07); }
  .exercise-item-done .exercise-item-name { color: #cfe3c6; }
  .exercise-check-icon { color: #8caa7c; flex-shrink: 0; font-weight: 900; }

  /* Pastilles : seulement pour les exercices chronométrés, sans charge.
     Zone de frappe portée à 46 px par un pseudo-élément, écart suffisant pour
     que deux zones voisines ne se chevauchent pas. */
  .set-row { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; row-gap: 14px; margin-top: 12px; }
  .set-dot {
    position: relative;
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #8c8474; background: transparent;
    color: #cfc6b3; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .set-dot::after { content: ""; position: absolute; top: -8px; right: -8px; bottom: -8px; left: -8px; }
  .set-remaining { font-size: 12px; color: #a89e8a; }

  /* Saisie série par série : la charge peut monter ou descendre entre les séries. */
  .serie-table { margin-top: 10px; }
  .serie-line { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .serie-num {
    width: 20px; flex-shrink: 0; text-align: center;
    font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; font-weight: 700; color: #a89e8a;
  }
  .serie-line-filled .serie-num { color: #f4d912; }
  .serie-input {
    width: 74px; min-height: 46px; background: #100f0d; border: 1.5px solid #8c8474; border-radius: 8px;
    color: #ede6d3; font-size: 16px; padding: 0 8px; text-align: center;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .serie-input:focus { outline: 2px solid #f4d912; border-color: #f4d912; }
  .serie-unit { font-size: 12px; color: #a89e8a; flex-shrink: 0; }
  .serie-x { color: #a89e8a; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .serie-sub {
    font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; font-weight: 700;
    color: #f4d912; margin-left: auto; flex-shrink: 0;
  }

  .exo-compare {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    background: #1e1a15; border-radius: 8px; padding: 9px 11px; margin-top: 9px;
    font-size: 12px; color: #a89e8a;
  }
  .exo-compare b { color: #ede6d3; font-weight: 700; font-family: ui-monospace, "SF Mono", monospace; font-size: 14px; }
  .exo-today b { color: #f4d912; }
  .load-up { color: #8caa7c; font-weight: 700; }
  .load-down { color: #e08a80; font-weight: 700; }

  .tonnage-line {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    background: #1e1a15; border-radius: 8px; padding: 10px 12px; margin-top: 12px;
  }
  .tonnage-value { font-family: ui-monospace, "SF Mono", monospace; font-size: 19px; font-weight: 700; color: #f4d912; }
  .tonnage-label { font-size: 12px; color: #a89e8a; }

  .all-done-hint {
    background: rgba(140,170,124,0.14); border: 1px solid #8caa7c; color: #cfe3c6;
    font-size: 13px; font-weight: 600; padding: 10px 12px; border-radius: 8px; margin-top: 12px;
  }

  .nutrition-list { list-style: none; margin: 12px 0 0; padding: 0; }
  .nutrition-item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 12px 8px; min-height: 48px; border-radius: 6px;
    border: none; border-bottom: 1px solid #3a352c; border-left: 3px solid transparent;
    background: transparent; color: inherit; font-family: inherit;
  }
  .nutrition-list li:last-child .nutrition-item { border-bottom: none; }
  .nutrition-item-done { border-left-color: #8caa7c; background: rgba(140,170,124,0.07); }
  .nutrition-item-done .nutrition-item-name { color: #cfe3c6; }
  .nutrition-check-icon { color: #8caa7c; flex-shrink: 0; margin-left: auto; font-weight: 900; }
  .nutrition-time { font-family: ui-monospace, "SF Mono", monospace; font-size: 13px; font-weight: 700; color: #f4d912; min-width: 48px; }
  .nutrition-item-text { display: flex; flex-direction: column; flex: 1; }
  .nutrition-item-name { font-size: 14px; color: #ede6d3; }
  .nutrition-item-note { font-size: 12px; color: #a89e8a; margin-top: 1px; }

  .checkin-btn {
    width: 100%; min-height: 54px; border-radius: 10px; border: 1.5px solid #8c8474 !important; background: transparent;
    color: #ede6d3; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px;
  }
  .checkin-btn-active { background: #8caa7c; border-color: #8caa7c !important; color: #100f0d; }

  .field { margin-bottom: 14px; }
  .field-label { font-size: 14px; color: #b3a890; margin-bottom: 6px; display:block; }
  .weight-input {
    width: 100%; min-height: 50px; background: #100f0d; border: 1.5px solid #8c8474; border-radius: 10px;
    color: #ede6d3; font-size: 18px; padding: 0 14px; font-family: ui-monospace, "SF Mono", monospace;
  }
  .weight-input:focus { outline: 2px solid #f4d912; border-color: #f4d912; }
  .field-hint { font-size: 12px; color: #a89e8a; margin-top: 5px; }

  .level-row { display:flex; gap: 8px; }
  .level-btn {
    flex: 1; min-height: 48px; border-radius: 8px; border: 1.5px solid #8c8474 !important; background: transparent;
    color: #cfc6b3; font-size: 14px; font-weight: 600;
  }
  .level-btn-active { background: #f4d912; border-color: #f4d912 !important; color: #100f0d; }

  /* L'échelle verticale est en HTML, dans une gouttière à gauche : le SVG est en
     preserveAspectRatio="none", donc tout texte placé dedans serait étiré. */
  .chart-wrap { position: relative; padding-left: 32px; margin-top: 6px; }
  .weight-svg { width: 100%; height: 150px; display: block; }
  .chart-yaxis { position: absolute; left: 0; top: 0; width: 28px; height: 150px; }
  .chart-ytick {
    position: absolute; right: 0; transform: translateY(-50%);
    font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: #a89e8a;
    background: #24201b; padding: 0 2px; line-height: 1.1;
  }
  .chart-ytick-target { color: #8caa7c; font-weight: 700; }
  .chart-labels { display: flex; justify-content: space-between; font-size: 11px; color: #a89e8a; margin-top: 6px; padding-left: 32px; }
  .chart-labels b { color: #ede6d3; font-family: ui-monospace, "SF Mono", monospace; font-weight: 700; }
  .chart-target-label { color: #8caa7c; font-weight: 600; }
  .chart-modes { display: flex; gap: 6px; margin-bottom: 10px; }
  .chart-mode-btn {
    flex: 1; min-height: 44px; border-radius: 8px; border: 1.5px solid #8c8474 !important;
    background: transparent; color: #cfc6b3; font-size: 12px; font-weight: 600;
  }
  .chart-mode-active { background: #f4d912; border-color: #f4d912 !important; color: #100f0d; }
  .chart-legend { display: flex; gap: 14px; justify-content: center; font-size: 11px; color: #a89e8a; margin-top: 8px; flex-wrap: wrap; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

  .stat-grid { display: flex; gap: 10px; margin-bottom: 12px; }
  .stat-box { flex: 1; text-align: center; padding: 11px 6px; border-radius: 10px; background: #1e1a15; border: 1.5px solid #3a352c; }
  .stat-num { font-family: ui-monospace, "SF Mono", monospace; font-size: 18px; font-weight: 700; color: #f4d912; }
  .stat-label { font-size: 11px; color: #a89e8a; margin-top: 3px; line-height: 1.3; }

  .badges { display:flex; gap: 10px; }
  .badge { flex: 1; text-align: center; padding: 12px 6px; border-radius: 10px; border: 1.5px solid #8c8474; background: #1e1a15; }
  .badge-unlocked { border-color: #f4d912; background: rgba(232,183,74,0.14); }
  .badge-num { font-family: ui-monospace, "SF Mono", monospace; font-size: 18px; font-weight: 700; color: #d9cdb0; }
  .badge-unlocked .badge-num { color: #f4d912; }
  .badge-label { font-size: 12px; color: #cfc6b3; margin-top: 2px; font-weight: 600; }
  .total-line { text-align:center; font-size: 12px; color: #a89e8a; margin-top: 12px; line-height: 1.5; }

  .footer-row { text-align: center; margin-top: 8px; }
  .reset-btn { background: none; color: #8a8171; font-size: 12px; min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 5px; }
  .update-btn {
    background: rgba(74,158,255,0.14); border: 1px solid #4a9eff !important; color: #bcdcff;
    font-size: 12px; font-weight: 700; padding: 0 18px; min-height: 44px; border-radius: 22px;
    display: inline-flex; align-items: center; gap: 5px; margin-bottom: 10px;
  }
  .version-tag { font-size: 11px; color: #8a8171; margin-top: 8px; }

  button:active { transform: scale(0.96); filter: brightness(1.25); }
  .nutrition-item:active { background: rgba(244,217,18,0.10); }
  .set-dot:active { border-color: #f4d912; }

  input:focus, button:focus-visible { outline: 2px solid #f4d912; outline-offset: 2px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* --- Diagnostic de première utilisation ---------------------------------- */
  .ob-container { max-width: 460px; }
  .ob-dots { display: flex; gap: 5px; justify-content: center; margin-bottom: 10px; }
  .ob-dot { width: 22px; height: 4px; border-radius: 2px; background: #3a352c; }
  .ob-dot-past { background: #6b6455; }
  .ob-dot-on { background: #f4d912; }
  .ob-step-label {
    text-align: center; font-size: 11px; color: #8a8171; margin-bottom: 14px;
    text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700;
  }
  .ob-card { padding: 18px 16px; }
  .ob-lead { font-size: 15px; line-height: 1.5; color: #cfc6b3; margin: 0 0 16px; }
  .ob-lead b { color: #ede6d3; }

  .ob-row { display: flex; gap: 8px; }
  .ob-row-wrap { flex-wrap: wrap; }
  .ob-chip {
    flex: 1 1 auto; min-width: 88px; min-height: 48px; padding: 0 12px; border-radius: 9px;
    border: 1.5px solid #8c8474 !important; background: transparent; color: #cfc6b3;
    font-size: 13px; font-weight: 600; font-family: inherit;
  }
  .ob-chip-on { background: #f4d912; border-color: #f4d912 !important; color: #100f0d; font-weight: 700; }

  /* Sept jours sur une ligne : cases carrées, zone de frappe suffisante. */
  .ob-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .ob-day {
    min-height: 52px; border-radius: 9px; border: 1.5px solid #8c8474 !important;
    background: transparent; color: #cfc6b3; font-size: 12px; font-weight: 700; font-family: inherit;
  }
  .ob-day-on { background: #f4d912; border-color: #f4d912 !important; color: #100f0d; }

  .ob-equip-list { display: flex; flex-direction: column; gap: 8px; }
  .ob-equip {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    min-height: 58px; padding: 10px 12px; border-radius: 10px;
    border: 1.5px solid #8c8474 !important; background: transparent; font-family: inherit;
  }
  .ob-equip-on { border-color: #f4d912 !important; background: rgba(244,217,18,0.09); }
  .ob-equip-box {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid #8c8474;
    color: #100f0d; font-size: 14px; font-weight: 900; line-height: 22px; text-align: center;
  }
  .ob-equip-on .ob-equip-box { background: #f4d912; border-color: #f4d912; }
  .ob-equip-text { display: flex; flex-direction: column; gap: 2px; }
  .ob-equip-text b { font-size: 14px; color: #ede6d3; font-weight: 700; }
  .ob-equip-text span { font-size: 12px; color: #a89e8a; line-height: 1.35; }

  /* Sous-liste des machines : décalée et sur fond sombre pour qu'on voie qu'elle
     dépend de la case « salle de sport » juste au-dessus. */
  .ob-gear {
    margin-top: 16px; padding: 13px 12px 4px; border-radius: 10px;
    background: #1a1712; border: 1px solid #3a352c;
  }
  .ob-equip-sub { min-height: 52px; padding: 8px 11px; }
  .ob-equip-sub .ob-equip-text b { font-size: 13px; }
  .ob-equip-sub .ob-equip-box { width: 22px; height: 22px; line-height: 20px; font-size: 13px; }
  .ob-gear .ob-note { margin-bottom: 10px; }

  /* Affectation muscu / course, un bouton par jour choisi. */
  .ob-kinds { display: flex; flex-wrap: wrap; gap: 6px; }
  .ob-kind {
    flex: 1 1 auto; min-width: 62px; min-height: 54px; border-radius: 9px;
    border: 1.5px solid #8c8474 !important; background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-family: inherit;
  }
  .ob-kind-day { font-size: 13px; font-weight: 700; color: #ede6d3; }
  .ob-kind-what { font-size: 10px; color: #a89e8a; text-transform: uppercase; letter-spacing: 0.4px; }
  .ob-kind-run { border-color: #4a9eff !important; background: rgba(74,158,255,0.12); }
  .ob-kind-run .ob-kind-day { color: #bcdcff; }
  .ob-kind-run .ob-kind-what { color: #4a9eff; font-weight: 700; }

  .ob-sess { margin-bottom: 14px; }
  .ob-sess-head {
    display: flex; align-items: center; gap: 6px; font-size: 13px; color: #b3a890;
    padding-bottom: 6px; border-bottom: 1px solid #3a352c; margin-bottom: 4px;
  }
  .ob-sess-head b { color: #f4d912; text-transform: capitalize; }
  .ob-exo-list { list-style: none; margin: 0; padding: 0; }
  .ob-exo {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid #2c281f;
  }
  .ob-exo:last-child { border-bottom: none; }
  .ob-exo-text { display: flex; flex-direction: column; flex: 1; gap: 1px; }
  .ob-exo-text b { font-size: 13px; color: #ede6d3; font-weight: 600; }
  .ob-exo-text span { font-size: 11px; color: #8a8171; }
  .ob-exo-no {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid #6b6455 !important; background: transparent; color: #a89e8a;
    font-size: 13px; font-weight: 700; font-family: inherit;
  }
  .ob-exo-no:active { border-color: #e08a80 !important; color: #e08a80; }
  .ob-excluded { margin-top: 12px; padding-top: 12px; border-top: 1px solid #3a352c; }
  .ob-back-chip {
    display: inline-block; margin: 4px 5px 0 0; min-height: 38px; padding: 0 11px; border-radius: 19px;
    border: 1px solid #6b6455 !important; background: transparent; color: #a89e8a;
    font-size: 12px; font-family: inherit;
  }

  .ob-note {
    background: #1e1a15; border-left: 3px solid #f4d912; border-radius: 6px;
    padding: 10px 12px; font-size: 13px; color: #cfc6b3; line-height: 1.45; margin-top: 12px;
  }
  .ob-note b { color: #ede6d3; }
  .ob-warn {
    background: rgba(193,104,95,0.13); border: 1px solid #c1685f; border-radius: 8px;
    padding: 10px 12px; font-size: 12px; color: #f0b3ac; line-height: 1.45; margin-top: 12px;
  }
  .ob-warn-soft { background: rgba(140,132,116,0.10); border-color: #6b6455; color: #b3a890; }
  .ob-warn b { color: #ede6d3; }

  .ob-recap { background: #1e1a15; border-radius: 10px; padding: 4px 12px; margin-bottom: 12px; }
  .ob-recap-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid #2c281f; font-size: 13px; color: #a89e8a;
  }
  .ob-recap-row:last-child { border-bottom: none; }
  .ob-recap-row b { color: #ede6d3; font-weight: 700; text-align: right; }

  .ob-restore { margin-top: 18px; padding-top: 14px; border-top: 1px solid #3a352c; }
  .ob-restore-btn {
    width: 100%; min-height: 46px; border-radius: 8px; background: transparent;
    border: 1px dashed #8c8474 !important; color: #a89e8a; font-size: 13px; font-family: inherit;
  }

  .ob-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .ob-back {
    min-height: 50px; padding: 0 18px; border-radius: 10px; background: transparent;
    border: 1.5px solid #8c8474 !important; color: #cfc6b3; font-size: 14px; font-weight: 600;
  }
  .ob-next {
    flex: 1; min-height: 54px; border-radius: 10px; background: #f4d912; border: none;
    color: #100f0d; font-size: 15px; font-weight: 800;
  }
  .ob-next[disabled] { background: #3a352c; color: #7a7263; }
  .ob-safe { text-align: center; font-size: 11px; color: #8a8171; margin-top: 14px; line-height: 1.5; }

  /* --- Carte profil, dans Bilan & réglages --------------------------------- */
  .profile-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid #2c281f; font-size: 13px; color: #a89e8a;
  }
  .profile-row:last-of-type { border-bottom: none; }
  .profile-row b { color: #ede6d3; font-weight: 600; text-align: right; }
  .profile-btn {
    width: 100%; min-height: 48px; margin-top: 12px; border-radius: 8px;
    border: 1.5px solid #8c8474 !important; background: transparent; color: #cfc6b3;
    font-size: 13px; font-weight: 600;
  }
  .nutri-targets { display: flex; gap: 8px; margin-bottom: 10px; }
  .nutri-target {
    flex: 1; text-align: center; padding: 9px 4px; border-radius: 9px;
    background: #1e1a15; border: 1.5px solid #3a352c;
  }
  .nutri-target-num {
    font-family: ui-monospace, "SF Mono", monospace; font-size: 16px; font-weight: 700; color: #f4d912;
  }
  .nutri-target-label { font-size: 10px; color: #a89e8a; margin-top: 2px; line-height: 1.3; }
  /* --- Carte Analyse ------------------------------------------------------- */
  .ana-bloc { margin-top: 14px; }
  .ana-prop {
    background: #1e1a15; border-left: 3px solid #f4d912; border-radius: 8px;
    padding: 11px 12px; margin-bottom: 9px;
  }
  .ana-prop-texte { font-size: 14px; font-weight: 700; color: #ede6d3; }
  .ana-prop-raison { font-size: 12px; color: #a89e8a; line-height: 1.45; margin-top: 4px; }
  .ana-prop-actes { display: flex; gap: 8px; margin-top: 10px; }
  .ana-ok-btn {
    flex: 1; min-height: 44px; border-radius: 8px; border: none;
    background: #f4d912; color: #100f0d; font-size: 13px; font-weight: 800; font-family: inherit;
  }
  .ana-non-btn {
    flex: 1; min-height: 44px; border-radius: 8px; background: transparent;
    border: 1.5px solid #8c8474 !important; color: #a89e8a; font-size: 13px; font-family: inherit;
  }

  .ana-ligne {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid #2c281f;
  }
  .ana-ligne:last-child { border-bottom: none; }
  .ana-pastille {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; margin-top: 1px;
    font-size: 12px; font-weight: 900; line-height: 22px; text-align: center;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .ana-up   { background: rgba(140,170,124,0.22); color: #cfe3c6; }
  .ana-down { background: rgba(224,138,128,0.20); color: #e08a80; }
  .ana-warn { background: rgba(244,217,18,0.20); color: #f4d912; }
  .ana-flat { background: rgba(74,158,255,0.18); color: #bcdcff; }
  .ana-ok   { background: #2c281f; color: #8caa7c; }
  .ana-wait { background: #2c281f; color: #7a7263; }
  .ana-ligne-texte { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .ana-ligne-texte b { font-size: 13px; color: #ede6d3; font-weight: 700; }
  .ana-ligne-texte span { font-size: 12px; color: #a89e8a; line-height: 1.45; }

  /* --- Pont IA ------------------------------------------------------------- */
  .ia-note {
    font-size: 12px; color: #a89e8a; line-height: 1.5; margin: 10px 0 12px;
    padding: 10px 11px; background: #1a1713; border-radius: 8px;
  }
  .ia-note b { color: #ede6d3; }
  .ia-etape {
    font-size: 11px; font-weight: 800; color: #f4d912; letter-spacing: 0.04em;
    text-transform: uppercase; margin: 14px 0 6px;
  }
  .ia-zone {
    width: 100%; box-sizing: border-box; background: #100f0d; color: #cfc7b4;
    border: 1.5px solid #3a3428; border-radius: 8px; padding: 10px;
    font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; line-height: 1.5;
    -webkit-appearance: none; resize: vertical;
  }
  .ia-btn {
    width: 100%; min-height: 44px; margin-top: 8px; border-radius: 8px;
    border: 1.5px solid #8c8474; background: transparent; color: #ede6d3;
    font-size: 13px; font-weight: 700; font-family: inherit;
  }
  .ia-btn-fort {
    background: #f4d912; border-color: #f4d912 !important; color: #100f0d; font-weight: 800;
  }
  .ia-btn[disabled] { opacity: 0.55; }
  .ia-ou {
    text-align: center; font-size: 11px; color: #7a7263; margin: 12px 0 2px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .ia-select, .ia-input {
    width: 100%; box-sizing: border-box; min-height: 44px; background: #100f0d;
    color: #ede6d3; border: 1.5px solid #8c8474; border-radius: 8px; padding: 10px;
    font-size: 15px; font-family: inherit; -webkit-appearance: none;
  }
  .ia-input { font-family: ui-monospace, "SF Mono", monospace; font-size: 13px; }
  .ia-cle-masque {
    min-height: 44px; box-sizing: border-box; padding: 12px 10px; border-radius: 8px;
    background: #100f0d; border: 1.5px dashed #3a3428; color: #a89e8a;
    font-family: ui-monospace, "SF Mono", monospace; font-size: 13px; word-break: break-all;
  }
  .ia-cle-masque i { font-family: inherit; font-style: italic; color: #7a7263; }
  .ia-lien {
    display: block; width: 100%; min-height: 44px; margin-top: 8px; background: none;
    border: none; color: #f4d912; font-size: 13px; font-family: inherit; text-align: left;
    text-decoration: underline; padding: 0;
  }
  .ia-lien-danger { color: #e08a80; }
  .ia-cle-etat { font-size: 12px; color: #8caa7c; margin-top: 10px; }

  .ia-resultat { margin-top: 14px; }
  .ia-prop { border-left-color: #7fb3e8; }
  .ia-rejets {
    margin-top: 12px; padding: 10px 11px; background: #1a1713;
    border-left: 3px solid #8c8474; border-radius: 8px;
  }
  .ia-rejets ul { margin: 6px 0 0; padding-left: 18px; }
  .ia-rejets li { font-size: 12px; color: #a89e8a; line-height: 1.5; margin-bottom: 4px; }
  .ia-rejets-pourquoi { font-size: 11px; color: #7a7263; line-height: 1.45; margin-top: 8px; }

  .ana-jrn { font-size: 12px; color: #a89e8a; padding: 6px 0; line-height: 1.4; }
  .ana-jrn span {
    display: inline-block; min-width: 58px; color: #7a7263;
    font-family: ui-monospace, "SF Mono", monospace; font-size: 11px;
  }

  /* Charge visée, sur l'écran de séance. */
  .ana-cible {
    font-size: 12px; color: #a89e8a; margin-top: 9px;
    padding: 6px 10px; background: rgba(244,217,18,0.09);
    border-radius: 6px; display: inline-block;
  }
  .ana-cible b { color: #f4d912; font-family: ui-monospace, "SF Mono", monospace; font-size: 13px; }

  .nutri-disclaimer { font-size: 11px; color: #8a8171; margin-top: 10px; line-height: 1.45; }
</style>
</head>

  // --- Prescription affichée --------------------------------------------------
  function fmtRest(sec) {
    if (sec >= 60 && sec % 60 === 0) return (sec / 60) + " min";
    return sec + " sec";
  }
  function detailOf(ex) {
    if (ex.mins) return ex.mins + " min" + (ex.note ? " " + ex.note : "");
    if (ex.blockMins) return ex.dur + " × " + ex.sets + " séries (" + ex.blockMins + " min)";
    if (ex.dur) return ex.dur + " × " + ex.sets + " sets, repos " + fmtRest(ex.rest);
    return ex.reps + " reps × " + ex.sets + " sets, repos " + fmtRest(ex.rest);
  }
  // Un exercice n'accueille une charge que s'il se compte en répétitions.
  // Échauffements, gainages et blocs chronométrés n'en ont pas.
  function isLoadableEx(ex) { return !!ex.reps; }

  function repsBounds(reps) {
    var m = String(reps || "").match(/\d+/g);
    if (!m || !m.length) return { lo: 8, hi: 12 };
    var lo = parseInt(m[0], 10);
    var hi = m.length > 1 ? parseInt(m[1], 10) : lo;
    if (hi < lo) { var t = lo; lo = hi; hi = t; }
    return { lo: lo, hi: hi };
  }

  // Rend la phrase de prescription depuis les NOMBRES du plan. C'est elle qui
  // permet a un ajustement de se voir : changer les series ou le repos reecrit
  // le texte affiche, au lieu de laisser une phrase perimee a cote des chiffres.
  function detailFromPlan(e) {
    if (e.track !== "load") return e.detail;
    var r = (e.repsLo === e.repsHi) ? String(e.repsLo) : (e.repsLo + "-" + e.repsHi);
    return r + " reps \u00d7 " + e.sets + " sets, repos " + fmtRest(e.rest || 60);
  }

  // Coût en secondes. 40 s par série effective, plus les repos, plus 75 s de
  // transition d'un exercice à l'autre : trouver la machine, la régler, charger.
  // C'est cette transition, jamais comptée, qui faisait déborder les séances.
  var SET_SECONDS = 40, TRANSITION_SECONDS = 75;
  function costOf(ex, first) {
    var c;
    if (ex.mins) c = ex.mins * 60;
    else if (ex.blockMins) c = ex.blockMins * 60;
    else c = ex.sets * (SET_SECONDS + ex.rest);
    return c + (first ? 0 : TRANSITION_SECONDS);
  }
  function totalCost(list) {
    var t = 0, i;
    for (i = 0; i < list.length; i++) t += costOf(list[i], i === 0);
    return t;
  }

  // --- Découpes selon le nombre de jours --------------------------------------

  //            voisines ne proposent pas le même exercice

  function S(pat, prio, alt, fb) { return { pat: pat, prio: prio, alt: alt || 0, fb: fb || null }; }

  // La découpe suit le nombre de séances, pas les jours choisis. En dessous de
  // quatre séances, le full body bat toute découpe : chaque groupe est sollicité
  // à chaque fois, au lieu d'une fois par semaine.
  function splitFor(n) {
    if (n <= 1) return [TPL.fullA];
    if (n === 2) return [TPL.fullA, TPL.fullB];
    if (n === 3) return [TPL.fullA, TPL.fullB, TPL.fullC];
    if (n === 4) return [TPL.haut, TPL.bas, TPL.hautB, TPL.basB];
    if (n === 5) return [TPL.push, TPL.pull, TPL.legs, TPL.hiit, TPL.full];
    if (n === 6) return [TPL.push, TPL.pull, TPL.legs, TPL.haut, TPL.bas, TPL.hiit];
    return [TPL.push, TPL.pull, TPL.legs, TPL.haut, TPL.bas, TPL.hiit, TPL.cardio];

  // --- Remplissage d'un créneau ------------------------------------------------
  function candidatesFor(pat, avail, excluded, used) {
    var out = [], i, ex, j, ok;
    for (i = 0; i < CATALOG.length; i++) {
      ex = CATALOG[i];
      if (ex.pat !== pat) continue;
      if (excluded[ex.id]) continue;
      if (used[ex.id]) continue;
      ok = true;
      for (j = 0; j < ex.equip.length; j++) {
        if (!avail[ex.equip[j]]) { ok = false; break; }
      }
      if (ok) out.push(ex);
    }
    out.sort(function (a, b) { return a.rank - b.rank; });
    return out;
  }

  function pickForSlot(slot, avail, excluded, used) {
    var c = candidatesFor(slot.pat, avail, excluded, used);
    if (!c.length && slot.fb) c = candidatesFor(slot.fb, avail, excluded, used);
    if (!c.length) return null;
    return c[Math.min(slot.alt, c.length - 1)];
  }

  // --- Construction d'une séance ----------------------------------------------
  // On remplit tous les créneaux possibles, puis on TAILLE pour tenir dans le
  // temps annoncé : d'abord en retirant une série aux exercices de confort,
  // ensuite en supprimant les créneaux, du moins important au plus important.
  // Les créneaux de priorité 1 ne sont jamais touchés : une séance sans sa
  // poussée principale n'est plus la séance.
  function buildSession(tpl, profile) {
    var avail = { bw: true }, excluded = {}, used = {}, i, chosen = [], ex;
    for (i = 0; i < profile.equipment.length; i++) avail[profile.equipment[i]] = true;
    if (avail.mach) { for (i = 0; i < GYM_IMPLIES.length; i++) avail[GYM_IMPLIES[i]] = true; }
    for (i = 0; i < profile.excluded.length; i++) excluded[profile.excluded[i]] = true;

    // Machines déclarées absentes : on les verse dans les exclusions plutôt que
    // d'ajouter un filtre au sélecteur. Même effet, un seul chemin à tester.
    var noGear = {}, ng = profile.noGear || [];
    for (i = 0; i < ng.length; i++) noGear[ng[i]] = true;
    for (i = 0; i < CATALOG.length; i++) {
      if (CATALOG[i].gear && noGear[CATALOG[i].gear]) excluded[CATALOG[i].id] = true;
    }

    for (i = 0; i < tpl.slots.length; i++) {
      ex = pickForSlot(tpl.slots[i], avail, excluded, used);
      if (!ex) continue;                       // aucun candidat : créneau sauté
      used[ex.id] = true;
      // idx retient la place du créneau dans la séance : après une coupe puis un
      // repêchage, il permet de remettre l'exercice à sa position d'origine, et
      // non à la fin. L'ordre compte : les polyarticulaires passent avant les
      // isolations, on ne finit pas une séance par un soulevé de terre.
      chosen.push({ ex: ex, prio: tpl.slots[i].prio, sets: ex.sets || 1, idx: i });
    }

    var budget = profile.minutes * 60;
    function currentList() {
      return chosen.map(function (c) {
        var o = {}, k;
        for (k in c.ex) { if (has(c.ex, k)) o[k] = c.ex[k]; }
        o.sets = c.sets;
        return o;
      });
    }
    function cost() { return totalCost(currentList()); }

    var guard = 0;
    // 1. Alléger les exercices de confort avant d'en supprimer.
    while (cost() > budget && guard++ < 60) {
      var trimmed = false, j;
      for (j = chosen.length - 1; j >= 0; j--) {
        if (chosen[j].prio === 3 && chosen[j].sets > 2 && !chosen[j].ex.mins && !chosen[j].ex.blockMins) {
          chosen[j].sets--; trimmed = true; break;
        }
      }
      if (!trimmed) break;
    }
    // 2. Puis supprimer, du confort vers l'utile, en partant de la fin.
    var dropped = [];
    guard = 0;
    while (cost() > budget && guard++ < 60) {
      var cut = -1, p, j2;
      for (p = 3; p >= 2 && cut < 0; p--) {
        for (j2 = chosen.length - 1; j2 >= 0; j2--) {
          if (chosen[j2].prio === p) { cut = j2; break; }
        }
      }
      if (cut < 0) break;                      // il ne reste que l'essentiel
      dropped.push(chosen.splice(cut, 1)[0]);
    }

    // 3. Repêchage. Sans cette passe, une seule coupe trop chère laissait le
    //    temps restant inutilisé : mesuré sur un full body de 50 minutes, la
    //    séance tombait à 4 exercices pour 40 minutes, alors que le gainage
    //    retiré tenait largement dans les 10 minutes qui restaient. On remet
    //    donc les créneaux écartés, du plus important au moins important, tant
    //    qu'ils rentrent.
    dropped.sort(function (a, b) { return a.prio - b.prio; });
    var byIdx = function (a, b) { return a.idx - b.idx; };
    for (var r = 0; r < dropped.length; r++) {
      var backup = chosen.slice();
      chosen.push(dropped[r]);
      chosen.sort(byIdx);
      if (cost() > budget) chosen = backup;
    }

    // 4. Extension. Un créneau sans candidat est simplement sauté : personne
    //    n'a de machine à mollets dans son salon. Une séance pouvait donc finir
    //    très en dessous du temps annoncé — mesuré sans aucun matériel, un PULL
    //    tombait à trois exercices et vingt minutes pour soixante-quinze
    //    demandées. On rallonge alors ce qui reste, un tour de série à la fois,
    //    plafonné à deux séries de plus que la prescription et à six au total :
    //    remplir le temps ne doit pas transformer la séance en marathon.
    guard = 0;
    var etendu = true;
    while (etendu && guard++ < 40) {
      etendu = false;
      for (var xi = 0; xi < chosen.length; xi++) {
        var cx = chosen[xi];
        if (cx.ex.mins || cx.ex.blockMins) continue;      // bloc chronométré
        var plafond = Math.min((cx.ex.sets || 1) + 2, 6);
        if (cx.sets >= plafond) continue;
        cx.sets++;
        if (cost() > budget) cx.sets--; else etendu = true;
      }
    }

    var list = currentList();
    var mins = Math.round(totalCost(list) / 60 / 5) * 5;
    return {
      code: tpl.code,
      label: tpl.label,
      sub: tpl.sub,
      duration: "~" + mins + " min",
      // La taille s'arrête aux créneaux structurants : en dessous d'une
      // trentaine de minutes, une séance complète ne rentre tout simplement pas.
      // On l'annonce plutôt que de laisser croire qu'elle tient dans le temps
      // demandé, et plutôt que de livrer une séance amputée de sa poussée.
      over: mins > profile.minutes,
      exercises: list.map(function (o) {
        var b = repsBounds(o.reps);
        return { id: o.id, name: o.name, detail: detailOf(o), sets: o.sets,
                 load: isLoadableEx(o), track: isLoadableEx(o) ? "load" : "none",
                 rest: o.rest || 60, repsLo: b.lo, repsHi: b.hi };
                 // kgCible reste absent tant que l'utilisateur n'a pas trouve sa
                 // charge : on ne devine pas a sa place au premier jour.
      })
    };
  }

  // ===========================================================================
  // COURSE À PIED
  // ---------------------------------------------------------------------------
  // Une séance de course ne se compte pas en kilos. Les séries portent
  // { km, min } au lieu de { kg, reps } : même forme de stockage, donc aucune
  // migration de l'historique, mais une allure calculée à la place d'un tonnage.
  // ===========================================================================
  var DISCIPLINES = [
    { v: "muscu",  label: "Musculation",    hint: "charges, machines ou poids de corps" },
    { v: "course", label: "Course à pied",  hint: "uniquement courir" },
    { v: "mixte",  label: "Les deux",       hint: "certains jours en salle, d'autres en course" }
  ];

  // L'allure de base sert à convertir le temps annoncé en distance. Le plafond
  // évite de prescrire une sortie longue de dix kilomètres à quelqu'un qui n'a
  // jamais couru : c'est la blessure la plus banale du débutant.
  var RUN_LEVELS = [
    { v: "debut",    label: "Je débute",        hint: "jamais couru, ou très peu", pace: 8.0, maxKm: 6 },
    { v: "regulier", label: "Je cours déjà",    hint: "une à deux fois par semaine", pace: 6.5, maxKm: 13 },
    { v: "entraine", label: "Je suis entraîné", hint: "trois fois par semaine ou plus", pace: 5.5, maxKm: 22 }
  ];

  function runLevel(v) {
    var i;
    for (i = 0; i < RUN_LEVELS.length; i++) { if (RUN_LEVELS[i].v === v) return RUN_LEVELS[i]; }
    return RUN_LEVELS[0];
  }

  var RUN_TPL = {
    easy: { code: "run-easy", label: "ENDURANCE", sub: "Footing facile", pat: "run-easy", alt: 0 },
    recup: { code: "run-recup", label: "RÉCUPÉRATION", sub: "Footing très lent", pat: "run-easy", alt: 1 },
    long: { code: "run-long", label: "SORTIE LONGUE", sub: "La durée avant l'allure", pat: "run-long", alt: 0 },
    interv: { code: "run-int", label: "FRACTIONNÉ", sub: "Intervalles courts", pat: "run-int", alt: 0 },
    cotes: { code: "run-hill", label: "CÔTES", sub: "Puissance en montée", pat: "run-hill", alt: 0 },
    seuil: { code: "run-tempo", label: "SEUIL", sub: "Allure soutenue et régulière", pat: "run-tempo", alt: 0 }
  };

  // Répartition de la semaine. Règle tenue partout : une seule séance dure par
  // semaine en dessous de quatre sorties, deux au maximum au-delà, et le reste
  // en facile. C'est la distribution qui fait progresser sans casser.
  // Un débutant ne reçoit AUCUNE séance de qualité : il lui faut d'abord des
  // semaines d'endurance. Les créneaux durs retombent alors sur du facile.
  function runWeek(n, niveau) {
    var lvl = niveau === "entraine" ? 3 : (niveau === "regulier" ? 2 : 1);
    var dur = lvl >= 3 ? RUN_TPL.seuil : (lvl >= 2 ? RUN_TPL.interv : RUN_TPL.easy);
    var dur2 = lvl >= 2 ? RUN_TPL.cotes : RUN_TPL.easy;
    if (n <= 1) return [RUN_TPL.easy];
    if (n === 2) return [RUN_TPL.easy, RUN_TPL.long];
    if (n === 3) return [RUN_TPL.easy, dur, RUN_TPL.long];
    if (n === 4) return [RUN_TPL.easy, dur, RUN_TPL.recup, RUN_TPL.long];
    if (n === 5) return [RUN_TPL.easy, dur, RUN_TPL.recup, dur2, RUN_TPL.long];
    if (n === 6) return [RUN_TPL.easy, dur, RUN_TPL.recup, dur2, RUN_TPL.easy, RUN_TPL.long];
    return [RUN_TPL.easy, dur, RUN_TPL.recup, dur2, RUN_TPL.easy, RUN_TPL.recup, RUN_TPL.long];
  }

  function pickRun(pat, alt, avail) {
    var c = [], i, ex, j, ok;
    for (i = 0; i < CATALOG.length; i++) {
      ex = CATALOG[i];
      if (ex.pat !== pat) continue;
      ok = true;
      for (j = 0; j < ex.equip.length; j++) { if (!avail[ex.equip[j]]) ok = false; }
      if (ok) c.push(ex);
    }
    c.sort(function (a, b) { return a.rank - b.rank; });
    if (!c.length) return null;
    return c[Math.min(alt, c.length - 1)];
  }

  function frKm(km) {
    return frDec(String(Math.round(km * 10) / 10));
  }

  // Une séance de course : échauffement, le bloc principal, retour au calme,
  // et de la mobilité s'il reste du temps. La DISTANCE du bloc principal se
  // déduit du temps restant et de l'allure, jamais l'inverse : c'est le temps
  // que l'utilisateur a annoncé, pas le kilométrage.
  function buildRunSession(tpl, profile) {
    var niv = runLevel(profile.runLevel);
    var avail = { bw: true }, i;
    for (i = 0; i < profile.equipment.length; i++) avail[profile.equipment[i]] = true;
    if (avail.mach) { for (i = 0; i < GYM_IMPLIES.length; i++) avail[GYM_IMPLIES[i]] = true; }

    var chauffe = pickRun("run-warm", 0, avail);
    var calme = pickRun("run-cool", 0, avail);
    var mob = pickRun("run-mob", 0, avail);
    var bloc = pickRun(tpl.pat, tpl.alt, avail);
    if (!bloc) bloc = pickRun("run-easy", 0, avail);

    // L'echauffement depend du type de seance, pas d'un forfait. Un footing
    // facile commence lentement : les premieres minutes SONT l'echauffement, et
    // lui imposer huit minutes de plus revenait a passer dix-neuf minutes a ne
    // pas courir sur une seance de quarante. Un fractionne, lui, se prepare
    // vraiment, sinon c'est le claquage.
    var dur = (tpl.pat === "run-int" || tpl.pat === "run-tempo" || tpl.pat === "run-hill");
    var minChauffe = dur ? 8 : 4;
    var minCalme = dur ? 6 : 4;
    if (chauffe) {
      chauffe = { id: chauffe.id, name: chauffe.name, mins: minChauffe,
                  note: dur ? "marche puis trot" : "marche rapide" };
    }
    if (calme) calme = { id: calme.id, name: calme.name, mins: minCalme, note: "trot puis marche" };

    var minutes = profile.minutes;
    var fixe = (chauffe ? chauffe.mins : 0) + (calme ? calme.mins : 0);
    var dispo = minutes - fixe;
    // La mobilite n'est ajoutee que s'il reste franchement de quoi courir
    // apres : sur une seance courte, elle mangeait un kilometre pour rien.
    var avecMob = false;
    if (mob && dispo - mob.mins >= 22) { dispo -= mob.mins; avecMob = true; }
    if (dispo < 8) dispo = 8;                       // il faut bien courir un peu

    var allure = niv.pace * (bloc.pace || 1);
    var km = dispo / allure;
    var plafond = niv.maxKm * (bloc.plafond || 1);
    if (km > plafond) km = plafond;
    km = Math.round(km * 2) / 2;                    // au demi-kilomètre
    if (km < 1) km = 1;

    var reel = Math.round(fixe + km * allure + (avecMob ? mob.mins : 0));
    var exos = [];
    if (chauffe) {
      exos.push({ id: chauffe.id, name: chauffe.name, detail: detailOf(chauffe), sets: 1, load: false, track: "none" });
    }
    var texte;
    if (bloc.pat === "run-int") {
      texte = "8 × 30 s vite / 30 s trot, environ " + frKm(km) + " km en tout";
    } else if (bloc.pat === "run-hill") {
      texte = "6 à 8 montées, environ " + frKm(km) + " km en tout";
    } else {
      texte = frKm(km) + " km, allure ~" + frDec(String(Math.round(allure * 10) / 10)) + " min/km";
    }
    exos.push({ id: bloc.id, name: bloc.name, detail: texte, sets: 1, load: false, track: "run", cible: km });
    if (calme) {
      exos.push({ id: calme.id, name: calme.name, detail: detailOf(calme), sets: 1, load: false, track: "none" });
    }
    if (avecMob) {
      exos.push({ id: mob.id, name: mob.name, detail: detailOf(mob), sets: 1, load: false, track: "none" });
    }

    return {
      code: tpl.code,
      label: tpl.label,
      sub: tpl.sub,
      duration: "~" + (Math.round(reel / 5) * 5) + " min",
      over: reel > minutes + 3,
      course: true,
      exercises: exos
    };
  }

  // Discipline d'un jour donné. En mode mixte, chaque jour choisi porte son
  // étiquette ; en mode simple, tous les jours suivent la discipline unique.
  function kindOfDay(profile, dow) {
    if (profile.discipline === "course") return "course";
    if (profile.discipline === "muscu") return "muscu";
    return (profile.dayKinds && profile.dayKinds[dow] === "course") ? "course" : "muscu";
  }

  // Le programme est indexé par jour de la semaine, mais avec DIMANCHE = 7 et
  // non 0. getDay() rend 0 le dimanche, or tout le code existant teste la clé de
  // programme par sa vérité (« if (!progKey) », « progKey ? ... »). Une séance
  // du dimanche aurait donc été traitée comme inexistante : pas d'exercices
  // affichés, tonnage compté à zéro. Décaler la clé règle le problème à la
  // source plutôt que de corriger une dizaine de tests un par un.
  function dayKey(dow) { return dow === 0 ? 7 : dow; }

  function buildPlan(profile) {
    // Tri sur la CLÉ et non sur getDay(), pour que la semaine commence le lundi :
    // sinon un profil « mardi, jeudi, dimanche » attribuerait la première séance
    // au dimanche, qui vaut 0.
    var days = profile.days.slice().sort(function (a, b) { return dayKey(a) - dayKey(b); });

    // Les deux disciplines sont réparties d'abord, puis chacune reçoit sa propre
    // découpe. Une semaine de trois séances de muscu et deux de course, ce n'est
    // pas une semaine de cinq : c'est un full body A/B/C d'un côté et une
    // endurance plus une sortie longue de l'autre.
    var joursMuscu = [], joursCourse = [], i;
    for (i = 0; i < days.length; i++) {
      if (kindOfDay(profile, days[i]) === "course") joursCourse.push(days[i]);
      else joursMuscu.push(days[i]);
    }
    var tplsM = joursMuscu.length ? splitFor(joursMuscu.length) : [];
    var tplsC = joursCourse.length ? runWeek(joursCourse.length, profile.runLevel) : [];

    var plan = {};
    for (i = 0; i < joursMuscu.length; i++) plan[dayKey(joursMuscu[i])] = buildSession(tplsM[i], profile);
    for (i = 0; i < joursCourse.length; i++) plan[dayKey(joursCourse[i])] = buildRunSession(tplsC[i], profile);
    return plan;
  }

  // ===========================================================================
  // NUTRITION
  // ---------------------------------------------------------------------------
  // Des REPÈRES, pas une prescription. L'estimation part du poids et du volume
  // d'entraînement, sans prétendre à la précision d'un calcul de métabolisme :
  // annoncer « 1 847 kcal » donnerait une fausse impression d'exactitude.
  // Un plancher empêche de descendre à un niveau qui ne relève plus d'une appli.
  // ===========================================================================
  // Plafond du nombre de prises d'un plan nutrition. Il sert AUSSI à valider les
  // prises cochées dans le journal : celles-ci doivent être bornées par une
  // constante et non par la longueur de la liste du moment, sinon raccourcir son
  // plan effacerait rétroactivement les cases cochées des mois précédents.
  var MAX_NUTRI_ITEMS = 20;

  var SUPPS = [
    { v: "creatine", label: "Créatine monohydrate", note: "3 à 5 g par jour, tous les jours, séance ou pas",
      why: "Le complément le mieux documenté pour la force et le volume d'entraînement." },
    { v: "whey", label: "Protéine en poudre", note: "une dose de 25 à 30 g",
      why: "Aucune vertu magique : c'est un moyen commode d'atteindre ses protéines quand un repas ne suffit pas." },
    { v: "vitd", label: "Vitamine D", note: "surtout d'octobre à mars",
      why: "Carence fréquente sous nos latitudes en hiver. Un dosage sanguin vaut mieux qu'une supplémentation à l'aveugle." },
    { v: "omega3", label: "Oméga 3", note: "si tu manges peu de poisson gras",
      why: "Utile en complément d'une alimentation pauvre en poisson, pas en remplacement." },
    { v: "cafeine", label: "Caféine avant séance", note: "un café 30 min avant suffit",
      why: "Efficace sur la performance. À éviter en fin de journée, le sommeil compte plus." }
  ];

  function nutritionTargets(profile) {
    var w = profile.startWeight, target = profile.targetWeight;
    var days = profile.days.length;
    // Facteur d'activité grossier mais honnête : 28 kcal/kg au repos relatif,
    // plus une unité par séance hebdomadaire.
    var maintain = Math.round(w * (28 + days) / 10) * 10;
    var losing = target < w;
    var gaining = target > w;
    var deficit = losing ? Math.min(500, Math.round(maintain * 0.2)) : 0;
    // Surplus de 15 %, plafonné à 400 kcal. Au-delà, la part de gras prise
    // augmente sans que le muscle suive : le corps ne construit pas plus vite
    // parce qu'on mange plus. 400 kcal par jour valent environ 0,35 kg par
    // semaine, ce qui est déjà un rythme soutenu.
    var surplus = gaining ? Math.min(400, Math.round(maintain * 0.15)) : 0;
    var floor = profile.sex === "f" ? 1400 : 1600;
    var kcal = Math.max(floor, maintain - deficit + surplus);
    var flooded = losing && (maintain - deficit) < floor;
    // Protéines calées sur le poids le PLUS BAS des deux. En perte c'est la
    // cible : les caler sur le poids actuel gonfle inutilement quand il reste
    // beaucoup à perdre. En prise c'est le poids actuel, pour la raison
    // symétrique — viser les protéines d'un corps qu'on n'a pas encore.
    var prot = Math.round((Math.min(w, target) * 1.8) / 5) * 5;
    // Horizon dans les DEUX sens. 7 700 kcal valent environ un kilo.
    var ecartKcal = losing ? deficit : surplus;
    var weeks = ecartKcal > 0
      ? Math.ceil((Math.abs(w - target) * 7700) / (ecartKcal * 7)) : null;
    return {
      maintain: maintain, kcal: kcal,
      deficit: maintain - kcal,          // négatif en prise de masse
      surplus: kcal - maintain,          // négatif en perte de poids
      prot: prot, floored: flooded, weeks: weeks,
      losing: losing, gaining: gaining
    };
  }

  function buildNutrition(profile) {
    var t = nutritionTargets(profile);
    var n = profile.nutri || {};
    var meals = n.meals || 3;
    var perMeal = Math.round(t.prot / (meals + (n.snack ? 1 : 0)) / 5) * 5;
    var list = [], supps = {}, i;
    for (i = 0; i < (n.supps || []).length; i++) supps[n.supps[i]] = true;

    if (n.breakfast) {
      list.push({ time: "7h30", item: n.cook ? "Petit-déj protéiné (œufs, yaourt grec)" : "Petit-déj protéiné (yaourt grec, fromage blanc)",
                  note: perMeal + " g prot" });
    } else {
      list.push({ time: "10h", item: "Première prise de la journée", note: perMeal + " g prot, même légère" });
    }
    if (supps.creatine) {
      list.push({ time: "Au choix", item: "Créatine 3-5 g", note: "tous les jours, y compris sans séance" });
    }
    if (supps.whey) {
      list.push({ time: "Après séance", item: "Protéine en poudre 25-30 g", note: "les jours d'entraînement" });
    }
    list.push({ time: "13h", item: n.cook ? "Déjeuner : protéine + légumes + féculent" : "Déjeuner : salade composée avec une source de protéines",
                note: perMeal + " g prot" });
    if (n.snack) {
      list.push({ time: "16h", item: "Collation", note: perMeal + " g prot" });
    }
    if (meals >= 4) {
      list.push({ time: "17h30", item: "Petite prise avant la séance", note: "un fruit, ou une tranche de pain complet" });
    }
    list.push({ time: "19h30", item: n.cook ? "Dîner : poisson ou viande + légumes" : "Dîner : protéine simple + légumes prêts à l'emploi",
                note: perMeal + " g prot" });
    if (supps.vitd) list.push({ time: "Au dîner", item: "Vitamine D", note: "avec un repas gras, elle s'absorbe mieux" });
    if (supps.omega3) list.push({ time: "Au dîner", item: "Oméga 3", note: "si peu de poisson gras dans la semaine" });
    if (supps.cafeine) list.push({ time: "Avant séance", item: "Café", note: "30 min avant, pas après 16h" });
    return list;
  }

  // ===========================================================================
  // PROFIL
  // ---------------------------------------------------------------------------
  // Il vit dans SETTINGS_KEY, jamais dans STORAGE_KEY : le journal et la
  // configuration restent deux objets séparés, précisément pour qu'un
  // rediagnostic ne puisse pas toucher à l'historique.
  // Le plan est FIGÉ à la génération, pas recalculé à chaque lancement. Sans ça,
  // une future version du générateur changerait le programme sous les pieds de
  // l'utilisateur et détacherait son historique des exercices affichés.
  // ===========================================================================
  var PROFILE_VERSION = 1;

  function defaultProfile() {
    return {
      v: PROFILE_VERSION,
      done: false,
      name: "",
      sex: "h",
      startWeight: 80,
      targetWeight: 75,
      minutes: 45,
      discipline: "muscu",     // "muscu" | "course" | "mixte"
      runLevel: "debut",       // niveau de course, sert à calibrer les distances
      dayKinds: {},            // en mode mixte : jour de la semaine -> discipline
      days: [1, 3, 5],
      equipment: [],
      noGear: [],          // familles de machines ABSENTES de la salle
      excluded: [],
      nutri: { meals: 3, breakfast: true, snack: true, cook: true, alcohol: "parfois", supps: [] },
      plan: null,
      nutriPlan: null,
      dechargeLe: null,        // date de la derniere semaine d'allegement
      journal: [],             // ajustements successifs du programme
      createdAt: null
    };
  }

  // Profil d'origine : le programme et la nutrition de la v1.3.0, à l'identique.
  // Il ne sert que si un journal existe déjà sans profil enregistré, c'est-à-dire
  // à la toute première ouverture d'une version qui connaît le diagnostic. Sans
  // lui, un historique existant se retrouverait devant un écran de bienvenue.
  var LEGACY_NUTRITION = [
    { time: "7h30", item: "Petit-déj (œufs / yaourt grec)", note: "20-25g prot" },
    { time: "13h", item: "Pure Whey 30g + Créatine 5g", note: "post-entraînement" },
    { time: "13h30", item: "Salade poulet + œuf + cheddar", note: "40g prot" },
    { time: "16h", item: "Macro Munch bar", note: "20g prot" },
    { time: "19h30", item: "Dîner (poisson / viande)", note: "40g prot" }
  ];
  var LEGACY_PLAN = {
    1: { code: "push", label: "PUSH", sub: "Poitrine / Épaules / Triceps", duration: "~42 min", exercises: [
      { id: "warm-up-velo", name: "Warm-up vélo", detail: "6 min modéré", sets: 1, load: false },
      { id: "developpe-couche-halteres", name: "Développé couché haltères", detail: "8-10 reps × 4 sets, repos 90 sec", sets: 4, load: true },
      { id: "developpe-militaire-halteres", name: "Développé militaire haltères", detail: "8-10 reps × 3 sets, repos 90 sec", sets: 3, load: true },
      { id: "ecartes-halteres", name: "Écartés haltères", detail: "10-12 reps × 3 sets, repos 60 sec", sets: 3, load: true },
      { id: "dips-assistes", name: "Dips assistés", detail: "8-10 reps × 3 sets, repos 75 sec", sets: 3, load: true },
      { id: "triceps-corde", name: "Triceps corde", detail: "12-15 reps × 3 sets, repos 60 sec", sets: 3, load: true },
      { id: "gainage-abdo", name: "Gainage abdo", detail: "30-45 sec × 3 sets, repos 45 sec", sets: 3, load: false }
    ]},
    2: { code: "pull", label: "PULL", sub: "Dos / Biceps", duration: "~40 min", exercises: [
