    if (!countKeys(PROGRAM)) return raw;

    var pk = cleanProg(raw.prog);
    if (pk === null) {
      var dow = dayKey(dateFromKey(dateKey).getDay());
      pk = PROGRAM[dow] ? dow : null;
    }
    var exos = (pk !== null && PROGRAM[pk]) ? PROGRAM[pk].exercises : [];

    function idOf(key) {
      if (EXERCISE_IDS[key]) return key;
      if (/^\d+$/.test(key)) {
        var i = parseInt(key, 10);
        if (exos[i]) return exos[i].id;
      }
      return null;
    }

    var sets = {}, k, id, i;

    if (raw.exSets && typeof raw.exSets === "object") {
      for (k in raw.exSets) {
        if (!has(raw.exSets, k)) continue;
        id = idOf(k);
        var n = parseInt(raw.exSets[k], 10);
        if (!id || !(n > 0)) continue;
        sets[id] = [];
        for (i = 0; i < n && i < MAX_SETS; i++) sets[id].push({});
      }
    }
    if (raw.loads && typeof raw.loads === "object") {
      for (k in raw.loads) {
        if (!has(raw.loads, k)) continue;
        id = idOf(k);
        var src = raw.loads[k];
        if (!id || !src || typeof src !== "object") continue;
        if (!sets[id]) sets[id] = [{}];
        for (i = 0; i < sets[id].length; i++) {
          if (src.kg !== undefined) sets[id][i].kg = src.kg;
          if (src.reps !== undefined) sets[id][i].reps = src.reps;
        }
      }
    }

    delete raw.exSets;
    delete raw.loads;
    if (countKeys(sets)) raw.sets = sets;
    return raw;
  }

  function cleanLog(raw) {
    var out = {}, k, e;
    if (!raw || typeof raw !== "object") return out;
    for (k in raw) {
      if (!has(raw, k)) continue;
      if (!DATE_RE.test(k)) continue;   // écarte __proto__, constructor, etc.
      e = cleanEntry(migrateEntry(k, raw[k]));
      if (e) out[k] = e;
    }
    return out;
  }

  // --- État ------------------------------------------------------------------
  // editDate : la journée en cours de saisie, volontairement NON persistée.
  // editDatePinned dit si elle a été CHOISIE explicitement. Tant qu'elle ne l'est
  // pas, elle suit le jour réel : c'est ce qui règle le passage de minuit. Avant,
  // le retour à aujourd'hui dépendait de renderedDay, or le premier rendu après
  // minuit mettait renderedDay à jour en laissant editDate sur la veille, ce qui
  // désarmait le garde-fou et faisait écrire toute la journée sur le jour d'avant.
  var state = {
    log: {},
    editDate: todayKey(),
    editDatePinned: false,
    showExercises: true,
    showNutrition: true,
    showProgPicker: false,
    chartMode: "both",
    openExo: null,          // identifiant de l'exercice dont la fiche est ouverte
    exoFolded: {},          // exercices repliés, non persistés : tout est déplié au lancement
    showDatePicker: false,  // champ date replié par défaut, il ne sert qu'au rattrapage
    page: "seance",         // "seance" | "annexe"
    pageAnim: null,         // sens du glissement pour le prochain rendu
    storageOk: true,
    notice: null,
    ob: null,             // brouillon du diagnostic, non persisté
    showAnalyse: false,   // l'analyse ne se calcule qu'une fois la carte ouverte
    iaOuvert: false,      // pont IA replie par defaut : il ne sert pas tous les jours
    iaTexte: "",          // reponse collee, gardee le temps de la session
    iaRes: null,          // propositions retenues et ecartees apres validation
    iaOccupe: false,      // un appel direct est en cours
    avanceOuvert: false,  // carte des reglages avances, repliee par defaut
    iaCleVisible: false   // la cle est masquee tant qu'on ne la modifie pas
  };

  function loadLog() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      if (parsed && parsed.log && typeof parsed.log === "object") parsed = parsed.log;
      state.log = cleanLog(parsed);
      state.storageOk = true;
      // Si le nettoyage ou la migration ont changé quoi que ce soit, on réécrit
      // tout de suite : sinon les données rejetées resteraient en stockage.
      // On ne réécrit JAMAIS le journal tant que le programme n'est pas chargé :
      // ce qui vient d'être « nettoyé » l'aurait été contre un programme vide,
      // et la réécriture graverait la perte.
      if (raw && countKeys(PROGRAM) && JSON.stringify(state.log) !== raw) persist();
    } catch (e) {
      state.storageOk = false;
      state.log = {};
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.log));
      state.storageOk = true;
      return true;
    } catch (e) {
      state.storageOk = false;
      return false;
    }
  }

  function loadSettings() {
    try {
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (!s || typeof s !== "object") return;
      if (typeof s.showExercises === "boolean") state.showExercises = s.showExercises;
      if (typeof s.showNutrition === "boolean") state.showNutrition = s.showNutrition;
      if (s.chartMode === "both" || s.chartMode === "raw" || s.chartMode === "trend") {
        state.chartMode = s.chartMode;
      }
      if (s.profile) profile = cleanProfile(s.profile);
      // Reglages IA : valides a part, parce qu'ils vivent hors du profil et
      // echappent donc a cleanProfile. Sans cette ligne, un stockage abime
      // rendrait un objet inattendu et la carte des reglages planterait.
      iaReglages = cleanIaReglages(s.ia);
    } catch (e) { /* réglages illisibles : valeurs par défaut */ }
  }

  function persistSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        showExercises: state.showExercises,
        showNutrition: state.showNutrition,
        chartMode: state.chartMode,
        profile: profile,
        // Frere du profil, jamais dedans : buildPayload() exporte `profile`,
        // et une cle d'API n'a rien a faire dans un fichier fait pour etre
        // transmis. Elle ne suit donc pas la sauvegarde, volontairement.
        ia: iaReglages
      }));
    } catch (e) { state.storageOk = false; }
  }

  function updateEntry(patch) {
    var key = state.editDate;
    if (!DATE_RE.test(key)) return;
    var entry = {}, ek, k;
    var existing = state.log[key];
    if (existing) { for (ek in existing) { if (has(existing, ek)) entry[ek] = existing[ek]; } }
    for (k in patch) {
      if (!has(patch, k)) continue;
      if (patch[k] === null || patch[k] === undefined) delete entry[k];
      else entry[k] = patch[k];
    }
    var cleaned = cleanEntry(entry);
    if (cleaned) state.log[key] = cleaned;
    else delete state.log[key];
    persist();
  }

  function currentEntry() { return state.log[state.editDate] || {}; }

  // Programme effectué un jour donné : celui explicitement choisi, sinon celui du
  // jour de la semaine. Le week-end n'en a aucun par défaut.
  function progKeyFor(dateKey, entry) {
    if (entry && entry.prog && PROGRAM[entry.prog]) return entry.prog;
    var dow = dayKey(dateFromKey(dateKey).getDay());
    return PROGRAM[dow] ? dow : null;
  }

  // --- Séries et tonnage -----------------------------------------------------
  function setsOf(entry, exId) {
    var s = (entry && entry.sets) ? entry.sets[exId] : null;
    return isArray(s) ? s : [];
  }
  function setsDone(entry, exId) { return setsOf(entry, exId).length; }

  // Tonnage = somme des charge × répétitions, série par série. Exact, puisque la
  // charge est notée pour chaque série et non supposée constante.
  // Distance et duree parcourues sur un bloc de course, puis sur la journee.
  // Le pendant exact du tonnage, pour une discipline qui ne se compte pas en
  // kilos : sans ca l'ecran de progression d'un coureur afficherait « 0 kg ».
  function exerciseDistance(entry, exId) {
    var arr = setsOf(entry, exId), d = 0, i;
    for (i = 0; i < arr.length; i++) { if (arr[i] && arr[i].km) d += arr[i].km; }
    return d;
  }
  function exerciseMinutes(entry, exId) {
    var arr = setsOf(entry, exId), m = 0, i;
    for (i = 0; i < arr.length; i++) { if (arr[i] && arr[i].min) m += arr[i].min; }
    return m;
  }
  function sessionDistance(entry) {
    if (!entry || !entry.sets) return 0;
    var d = 0, k;
    for (k in entry.sets) { if (has(entry.sets, k)) d += exerciseDistance(entry, k); }
    return d;
  }
  // Allure au format francais : 5,4 min/km devient « 5'24 ».
  function frAllure(km, minutes) {
    if (!(km > 0) || !(minutes > 0)) return null;
    var parKm = minutes / km;
    var m = Math.floor(parKm);
    var s = Math.round((parKm - m) * 60);
    if (s === 60) { m++; s = 0; }
    return m + "'" + (s < 10 ? "0" : "") + s;
  }

  function exerciseTonnage(entry, exId) {
    var arr = setsOf(entry, exId), t = 0, i;
    for (i = 0; i < arr.length; i++) {
      if (arr[i] && arr[i].kg && arr[i].reps) t += arr[i].kg * arr[i].reps;
    }
    return t;
  }
  // On somme TOUTES les séries enregistrées ce jour-là, et non les seuls
  // exercices du programme du jour.
  //
  // L'ancienne version filtrait par le programme, en héritage du bug des
  // charges indexées par RANG : une série orpheline pouvait alors être du
  // tonnage fantôme attribué au mauvais exercice. Depuis l'indexation par
  // IDENTIFIANT, une série orpheline n'est plus une erreur d'attribution :
  // c'est un exercice réellement effectué, validé contre le catalogue.
  //
  // Le filtre était devenu nuisible. Il rendait invisible tout tonnage d'un
  // jour sans programme, et surtout, depuis que les jours d'entraînement sont
  // configurables, retirer un jour du profil aurait effacé le tonnage de
  // toutes les séances passées ce jour-là. Mesuré sur un historique de test :
  // 1 876 kg d'une séance libre du samedi manquaient au total.
  function sessionTonnage(dateKey, entry) {
    if (!entry || !entry.sets) return 0;
    var t = 0, k;
    for (k in entry.sets) { if (has(entry.sets, k)) t += exerciseTonnage(entry, k); }
    return t;
  }

  // Dernière fois que cet exercice a été chargé, en balayant JOUR PAR JOUR vers
  // l'arrière et en n'acceptant que les journées du MÊME programme. L'ancien pas
  // de 7 jours encodait l'hypothèse « même jour de semaine = même programme »,
  // que le choix de séance rend fausse.
  function lastTonnageFor(fromKey, exId, progKey) {
    var cursor = addDays(dateFromKey(fromKey), -1), i, k, e, t;
    for (i = 0; i < LOOKBACK_DAYS; i++) {
      k = fmt(cursor);
      e = state.log[k];
      if (e && progKeyFor(k, e) === progKey) {
        t = exerciseTonnage(e, exId);
        if (t > 0) return { date: k, tonnage: t, sets: setsDone(e, exId) };
      }
      cursor = addDays(cursor, -1);
    }
    return null;
  }

  // Dernière séance du MÊME programme. L'ancienne version s'arrêtait sur
  // n'importe quelle entrée non vide : une simple pesée faisait office de séance
  // de référence, le tonnage de comparaison valait 0 et l'appli annonçait
  // « premier repère » alors que dix séances étaient enregistrées.
  // Pendant de lastTonnageFor pour la course : la derniere fois qu'on a couru
  // ce meme bloc, avec sa distance et sa duree.
  function lastRunFor(fromKey, exId, progKey) {
    var cursor = addDays(dateFromKey(fromKey), -1), i, k, e, d;
    for (i = 0; i < LOOKBACK_DAYS; i++) {
      k = fmt(cursor);
      e = state.log[k];
      if (e && progKeyFor(k, e) === progKey) {
        d = exerciseDistance(e, exId);
        if (d > 0) return { date: k, km: d, min: exerciseMinutes(e, exId) };
      }
      cursor = addDays(cursor, -1);
    }
    return null;
  }

  function lastSessionKeyFor(fromKey, progKey) {
    if (!progKey) return null;
    var cursor = addDays(dateFromKey(fromKey), -1), i, k, e;
    for (i = 0; i < LOOKBACK_DAYS; i++) {
      k = fmt(cursor);
      e = state.log[k];
      if (e && progKeyFor(k, e) === progKey && (e.done || e.sets)) return k;
      cursor = addDays(cursor, -1);
    }
    return null;
  }

  // --- Moyenne mobile de poids ----------------------------------------------
  // Les pesées sont irrégulières : on moyenne sur une FENÊTRE DE DATES glissante,
  // pas sur un nombre de points, sinon deux pesées espacées de trois semaines
  // seraient traitées comme deux jours consécutifs.
  function weightTrend(series, windowDays) {
    var out = [], i, j, end, start, sum, n, d;
    for (i = 0; i < series.length; i++) {
      end = dateFromKey(series[i].date);
      start = addDays(end, -(windowDays - 1));
      sum = 0; n = 0;
      for (j = 0; j <= i; j++) {
        d = dateFromKey(series[j].date);
        if (d >= start && d <= end) { sum += series[j].poids; n++; }
      }
      out.push({ date: series[i].date, poids: sum / n });
    }
    return out;
  }

  // --- Phrase du jour --------------------------------------------------------
  // Le THÈME vient des données (streak, poids, tonnage, palier, reprise), la
  // FORMULATION est tirée d'après la date. Deux conséquences voulues : la phrase
  // ne bouge pas quand on tape dans l'appli au cours de la journée, et elle
  // change le lendemain même si rien d'autre n'a évolué. Surtout, pas de
  // Math.random : le texte sauterait à chaque re-rendu, donc à chaque tap.
  function dayHash(s) {
    var h = 2166136261, i;
    for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h >>> 0;
  }
  // ROTATION indexée sur le numéro du jour, et non hachage de la date. Un
  // hachage est bien réparti mais pas alterné : il produisait des séries de
  // quatre ou cinq jours sur la même formulation. Ici l'indice avance d'un cran
  // chaque jour, donc la phrase change forcément, et le décalage propre au thème
  // évite que tous les thèmes changent en même temps.
  function dayNumber(dateKey) {
    return Math.floor(dateFromKey(dateKey).getTime() / 86400000);
  }
  function pickForDay(list, dateKey, salt) {
    if (list.length < 2) return list[0];
    return list[(dayNumber(dateKey) + dayHash(salt)) % list.length];
  }

  function motivationFor(c) {
    var kgPerdus = frDec(Math.abs(c.weightDelta));
    // Le SENS visé se lit sur l'intention du profil (départ vers cible), pas sur
    // la variation constatée : deux semaines de stagnation ne changent pas
    // l'objectif que l'utilisateur s'est donné.
    var enPrise = !!(profile && profile.targetWeight > profile.startWeight);
    // Ce qui reste à parcourir, toujours positif, quel que soit le sens.
    var reste = c.toGo === null ? null : frDec(Math.max(0, Math.round(Math.abs(c.toGo) * 10) / 10));
    // « Ça avance » veut dire descendre en perte, monter en prise.
    var avance = enPrise ? (c.weightDelta > 0) : (c.weightDelta < 0);

    if (c.totalDone === 0) {
      return pickForDay([
        { head: "La première séance compte double.", sub: "Pas besoin de résultat visible aujourd'hui, juste de la présence. Le reste suit." },
        { head: "Tout commence par une séance.", sub: "Celle d'aujourd'hui n'a pas besoin d'être bonne. Elle a besoin d'exister." },
        { head: "Aucun historique, aucune dette.", sub: "Tu démarres à zéro et c'est confortable : il n'y a rien à rattraper." }
      ], c.dateKey, "start");
    }

    if (reste !== null && Math.abs(c.toGo) <= 2 && avance) {
      return pickForDay([
        { head: "Il te reste " + reste + " kg.", sub: "La dernière portion est la plus lente. Ne change rien à ce qui a marché jusqu'ici." },
        { head: "Objectif à " + reste + " kg.", sub: "À ce stade, c'est la régularité qui finit le travail, pas un coup d'accélérateur." },
        { head: "Plus que " + reste + " kg au compteur.", sub: "Tu as fait " + kgPerdus + " kg. Le plus dur est derrière." }
      ], c.dateKey, "endgame");
    }

    if (c.badgeHit) {
      return pickForDay([
        { head: "Palier " + c.totalDone + " séances franchi.", sub: "Ce n'est plus de la motivation, c'est devenu une habitude." },
        { head: c.totalDone + " séances au compteur.", sub: "Le chiffre importe moins que ce qu'il prouve : tu y retournes même les jours sans envie." },
        { head: "Cap des " + c.totalDone + " séances.", sub: "Personne ne t'a obligé à venir " + c.totalDone + " fois. C'est ça, le résultat." }
      ], c.dateKey, "badge");
    }

    // Le message le plus utile de tous : la balance ne bouge plus mais les
    // charges montent. Sans ça, c'est le moment classique où on abandonne.
    if (c.plateau && c.tonnageDiff > 0) {
      return pickForDay([
        { head: "La balance stagne, pas toi.", sub: "Ton poids n'a quasiment pas bougé en deux semaines, mais tu soulèves " + frNum(c.tonnageDiff) + " kg de plus que la dernière fois sur cette séance." },
        { head: "+" + frNum(c.tonnageDiff) + " kg soulevés, poids stable.", sub: "C'est le signe qu'il se passe quelque chose que la balance ne mesure pas. Continue." },
        { head: "Plateau sur la balance.", sub: "Le muscle est plus dense que la graisse : ton poids peut stagner pendant que ta composition change. Tes charges le disent." }
      ], c.dateKey, "plateau-up");
    }

    if (c.plateau && c.weightDelta < 0) {
      return pickForDay([
        { head: "Palier de poids.", sub: "Deux semaines sans bouger, c'est normal et ça finit toujours par repartir. Tu es à " + kgPerdus + " kg depuis le départ." },
        { head: "La balance fait une pause.", sub: "Un plateau n'est pas un arrêt. La seule erreur serait de lâcher la régularité maintenant." },
        { head: kgPerdus + " kg, et ça bloque un peu.", sub: "Regarde tes charges plutôt que la balance cette semaine : c'est là que la progression se voit." }
      ], c.dateKey, "plateau");
    }

    if (c.streak === 0 && c.isTrainingDay && !c.doneToday) {
      return pickForDay([
        { head: "Reprise en douceur.", sub: "Ta séance du jour t'attend. Une séance faite efface vite un jour manqué." },
        { head: "Un jour sauté, rien de cassé.", sub: "Tu as déjà " + c.totalDone + " séances derrière toi. Elles ne disparaissent pas." },
        { head: "On repart d'ici.", sub: "Le streak repart à un aujourd'hui. Le total, lui, reste à " + c.totalDone + "." }
      ], c.dateKey, "comeback");
    }

    if (c.tonnageDiff > 0) {
      return pickForDay([
        { head: "+" + frNum(c.tonnageDiff) + " kg soulevés.", sub: "Tu soulèves plus que la dernière fois sur cette séance. Ça, la balance ne le dit pas." },
        { head: "Séance plus lourde que la précédente.", sub: frNum(c.tonnageDiff) + " kg de plus au total. C'est la définition de la progression." },
        { head: "Les charges montent.", sub: "+" + frNum(c.tonnageDiff) + " kg sur cette séance. Note-les, elles serviront de repère la semaine prochaine." }
      ], c.dateKey, "tonnage");
    }

    if (c.streak >= 10) {
      return pickForDay([
        { head: c.streak + " séances d'affilée.", sub: "À ce stade, ce n'est plus la volonté qui te porte, c'est la régularité elle-même." },
        { head: c.streak + " jours sans en manquer un.", sub: "L'habitude est prise. Le vrai risque maintenant, c'est de vouloir en faire trop." },
        { head: "Série de " + c.streak + ".", sub: "Ton assiduité est à " + (c.attendance === null ? "un bon niveau" : c.attendance + " %") + ". Peu de gens tiennent ça." }
      ], c.dateKey, "streak-long");
    }

    if (c.streak >= 4) {
      return pickForDay([
        { head: c.streak + " séances d'affilée.", sub: "Le doute recule normalement autour de la 3e ou 4e semaine. Tu y es presque." },
        { head: "Série en cours : " + c.streak + ".", sub: "C'est la phase où ça demande encore un effort conscient. Elle ne dure pas." },
        { head: c.streak + " d'affilée, ça tient.", sub: "Ne cherche pas à accélérer. Cherche à ne pas casser la série." }
      ], c.dateKey, "streak-mid");
    }

    if (avance && enPrise) {
      return pickForDay([
        { head: "+" + kgPerdus + " kg depuis le départ.", sub: "La masse se construit lentement. Un chiffre qui monte doucement est exactement ce qu'on veut." },
        { head: kgPerdus + " kg de plus au compteur.", sub: reste !== null ? "Reste " + reste + " kg pour atteindre l'objectif." : "La pente est la bonne." },
        { head: "Le poids monte.", sub: "Vérifie que tes charges montent aussi : c'est ce qui distingue du muscle d'un simple surplus." }
      ], c.dateKey, "weight-prise");
    }

    if (avance) {
      return pickForDay([
        { head: kgPerdus + " kg depuis le départ.", sub: "Un chiffre qui bouge, même petit, est une preuve, pas une coïncidence." },
        { head: "-" + kgPerdus + " kg au compteur.", sub: reste !== null ? "Reste " + reste + " kg pour atteindre l'objectif." : "La pente est la bonne." },
        { head: "Le poids descend.", sub: kgPerdus + " kg de moins qu'au premier jour. Regarde la tendance, pas la pesée du matin." }
      ], c.dateKey, "weight");
    }

    if (!c.isTrainingDay) {
      return pickForDay([
        { head: "Jour de repos.", sub: "Aucune séance attendue. Te peser aujourd'hui lisse quand même la courbe." },
        { head: "Jour sans programme.", sub: "La récupération fait partie de l'entraînement, elle n'est pas une pause dans le travail." },
        { head: "Repos prévu.", sub: "Tu as " + c.totalDone + " séances derrière toi. Rien à prouver aujourd'hui." }
      ], c.dateKey, "weekend");
    }

    return pickForDay([
      { head: "Chaque séance compte.", sub: "Les premières semaines ne se voient pas dans le miroir, elles se voient dans le streak." },
      { head: c.totalDone + " séances faites.", sub: "Le résultat n'est pas dans la séance d'aujourd'hui, il est dans leur addition." },
      { head: "Présent, c'est déjà l'essentiel.", sub: "Une séance moyenne faite vaut mieux qu'une séance parfaite reportée." }
    ], c.dateKey, "default");
  }

  // --- Fiche technique d'un exercice ----------------------------------------
  // Volontairement AUCUN lien vidéo codé en dur : il est impossible de garantir
  // qu'un identifiant de vidéo pointe vraiment sur le bon exercice, et un mauvais
  // repère technique sur un mouvement chargé, c'est un risque de blessure. Le
  // bouton lance donc une recherche sur le NOM exact de l'exercice, ce qui rend
  // la correspondance certaine.
  function howtoHtml(ex) {
    // La fiche vit dans le catalogue, à côté du reste de l'exercice. Elle
    // occupait un objet HOWTO séparé, qu'il fallait tenir synchronisé à la main.
    var h = CAT_BY_ID[ex.id];
    var query = encodeURIComponent(ex.name + " technique musculation");
    var lines = h ? h.lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join("") : "";
    return '<div class="howto">' +
      (h ? '<div class="howto-mat">' + esc(h.mat) + '</div>' : "") +
      (lines ? '<ul class="howto-list">' + lines + '</ul>' : '<div class="howto-note">Pas de fiche pour cet exercice.</div>') +
      '<a class="howto-video" href="https://www.youtube.com/results?search_query=' + query + '"' +
        ' target="_blank" rel="noopener noreferrer">▶ Chercher une vidéo de cet exercice</a>' +
      '<div class="howto-note">Mémo écrit, pas l\'œil d\'un coach. Si un réglage de machine te fait douter, fais-toi montrer une fois sur place.</div>' +
    '</div>';
  }

  // --- Rendu -----------------------------------------------------------------
  var root = document.getElementById("root");
  var renderedDay = null;

  function render() {
    try {
      renderInner();
      renderedDay = todayKey();
    } catch (e) {
      renderFailure(e);
    }
  }

  function renderFailure(e) {
    var msg = e && e.message ? e.message : String(e);
    root.innerHTML =
      '<div class="container">' +
        '<div class="brandmark"><span class="brandmark-text">LEMMON<b>FIT</b></span></div>' +
        '<div class="banner banner-error">Affichage impossible : ' + esc(msg) + '.<br>' +
        'Tes données sont intactes. Exporte-les, puis réinitialise si l\'écran ne revient pas.</div>' +
        '<div class="backup-row">' +
          '<button type="button" class="backup-btn" data-action="export-data">⬇ Exporter</button>' +
          '<button type="button" class="backup-btn" data-action="reset">↺ Réinitialiser</button>' +
        '</div>' +
        '<div class="footer-row"><button type="button" class="update-btn" data-action="update-app">⟳ Mettre à jour l\'appli</button>' +
        '<div class="version-tag">v' + esc(APP_VERSION) + ' · ' + esc(APP_BUILD) + '</div></div>' +
      '</div>';
  }

  function renderInner() {
    // Tant qu'aucun programme n'existe, il n'y a rien a afficher d'autre que le
    // diagnostic : l'ecran de seance n'aurait aucun exercice a montrer.
    if (state.ob) { renderOnboarding(); return; }

    var activeId = document.activeElement ? document.activeElement.id : null;

    var tKey = todayKey();
    // Tant qu'aucune date n'a été choisie à la main, on colle au jour réel :
    // l'appli laissée ouverte toute la nuit basculera d'elle-même au premier
    // rendu, sans écrire sur la veille.
    if (!state.editDatePinned) state.editDate = tKey;
    if (!DATE_RE.test(state.editDate) || state.editDate > tKey) {
      state.editDate = tKey; state.editDatePinned = false;
    }
    var floorKey = fmt(addDays(new Date(), -MAX_BACKDAYS));
    if (state.editDate < floorKey) state.editDate = floorKey;

    var editKey = state.editDate;
    var isToday = editKey === tKey;
    var editDateObj = dateFromKey(editKey);
    var log = state.log;
    var entry = log[editKey] || {};
    var progKey = progKeyFor(editKey, entry);
    var program = progKey ? PROGRAM[progKey] : null;
    // Programme naturel du jour, et signalement d'une séance forcée à la main.
    var naturalDow = dayKey(editDateObj.getDay());
    // On compare le programme RÉELLEMENT affiché au programme naturel du jour.
    // Comparer entry.prog produisait une phrase tautologique — « séance choisie à
    // la main, le mercredi c'est normalement LEGS » alors que LEGS est affiché —
    // dès qu'un prog pointait vers un jour absent du plan, ce que la validation
    // de forme de cleanProg rend désormais possible.
    var overriddenProg = !!(entry.prog && PROGRAM[naturalDow] && progKey !== naturalDow);
    var accent = program ? ACCENT : ACCENT_REST;
    var entryNutri = entry.nutri || {};

    // --- Statistiques globales ---
    var allKeys = [], k0;
    for (k0 in log) { if (has(log, k0)) allKeys.push(k0); }
    allKeys.sort();
    var firstKey = allKeys.length ? allKeys[0] : null;

    // Le dénominateur de l'assiduité part de la première trace d'ENTRAÎNEMENT,
    // pas de la première entrée quelconque : une pesée faite trois semaines
    // avant la première séance faisait chuter le taux sans raison.
    var firstTrainKey = null, dk;
    for (var ai = 0; ai < allKeys.length; ai++) {
      var ek0 = log[allKeys[ai]];
      if (ek0 && (ek0.done || ek0.sets || ek0.prog)) { firstTrainKey = allKeys[ai]; break; }
    }

    var totalDone = 0, doneWeekdays = 0, totalTonnage = 0, totalKm = 0;
    for (dk in log) {
      if (!has(log, dk)) continue;
      var e0 = log[dk];
      if (e0 && e0.done) {
        totalDone++;
        if (isTrainingDay(dateFromKey(dk))) doneWeekdays++;
      }
      totalTonnage += sessionTonnage(dk, e0);
      totalKm += sessionDistance(e0);
    }

    var attendance = null;
    if (firstTrainKey) {
      var wd = 0, cur = dateFromKey(firstTrainKey), stop = dateFromKey(tKey);
      while (cur <= stop) { if (isTrainingDay(cur)) wd++; cur = addDays(cur, 1); }
      if (wd > 0) attendance = Math.min(100, Math.round((doneWeekdays / wd) * 100));
    }

    var currentStreak = 0;
    (function () {
      var cursor = new Date(), ck = fmt(cursor), i, dKey, e;
      if (isTrainingDay(cursor) && !(log[ck] && log[ck].done)) cursor = addDays(cursor, -1);
      for (i = 0; i < 400; i++) {
        dKey = fmt(cursor);
        if (firstKey && dKey < firstKey) break;
        if (isTrainingDay(cursor)) {
          e = log[dKey];
          if (e && e.done) currentStreak++; else break;
        }
        cursor = addDays(cursor, -1);
      }
    })();

    var weightSeries = [], wk;
    for (wk in log) {
      if (has(log, wk) && log[wk] && typeof log[wk].weight === "number") {
        weightSeries.push({ date: wk, poids: log[wk].weight });
      }
    }
    weightSeries.sort(function (a, b) { return a.date > b.date ? 1 : -1; });
    var trend = weightTrend(weightSeries, TREND_WINDOW_DAYS);
    var weightDelta = weightSeries.length
      ? +(weightSeries[weightSeries.length - 1].poids - START_WEIGHT).toFixed(1) : 0;

    // --- Séance du jour saisi ---
    var exerciseProgress = program ? program.exercises.map(function (ex) {
      var total = setsCountOf(ex);
      var done = Math.min(setsDone(entry, ex.id), MAX_SETS);
      return {
        ex: ex, total: total, done: done,
        isDone: done >= total,
        isPartial: done > 0 && done < total,
        loadable: ex.load === true,
        track: ex.track || (ex.load === true ? "load" : "none"),
        distance: exerciseDistance(entry, ex.id),
        tonnage: exerciseTonnage(entry, ex.id)
      };
    }) : [];
    var exercisesDoneCount = 0, totalExercises = exerciseProgress.length;
    for (var pi = 0; pi < exerciseProgress.length; pi++) {
      if (exerciseProgress[pi].isDone) exercisesDoneCount++;
    }
    var nutriDoneCount = 0;
    for (var ni = 0; ni < NUTRITION.length; ni++) { if (entryNutri[ni]) nutriDoneCount++; }
    var todayTonnage = sessionTonnage(editKey, entry);

    var lastKey = lastSessionKeyFor(editKey, progKey);
    var lastEntry = lastKey ? log[lastKey] : null;
    var lastTonnage = lastKey ? sessionTonnage(lastKey, lastEntry) : 0;
    var tonnageDiff = (todayTonnage > 0 && lastTonnage > 0)
      ? Math.round(todayTonnage - lastTonnage) : null;

    // Détection de plateau : on compare la tendance lissée d'aujourd'hui à celle
    // d'environ deux semaines avant. Sert au message le plus utile de tous, celui
    // qui explique une balance immobile alors que les charges montent.
    var trendNow = trend.length ? trend[trend.length - 1].poids : null;
    var trend14 = null;
    if (trend.length >= 2) {
      var refT = addDays(dateFromKey(trend[trend.length - 1].date), -14).getTime();
      var best = null, bi2, gap;
      for (bi2 = 0; bi2 < trend.length - 1; bi2++) {
        gap = Math.abs(dateFromKey(trend[bi2].date).getTime() - refT);
        if (best === null || gap < best.gap) best = { gap: gap, v: trend[bi2].poids };
      }
      // Comparaison refusée si le point de référence est trop loin de J-14.
      if (best && best.gap <= 6 * 86400000) trend14 = trendNow - best.v;
    }
    var badgeHit = false, bi;
    for (bi = 0; bi < BADGES.length; bi++) { if (BADGES[bi].n === totalDone) badgeHit = true; }

    var motivation = motivationFor({
      dateKey: tKey,
      totalDone: totalDone,
      streak: currentStreak,
      attendance: attendance,
      weightDelta: weightDelta,
      toGo: trendNow === null ? null : trendNow - TARGET_WEIGHT,
      plateau: trend14 !== null && Math.abs(trend14) < 0.4,
      tonnageDiff: tonnageDiff === null ? 0 : tonnageDiff,
      badgeHit: badgeHit,
      isTrainingDay: isTrainingDay(new Date()),
      doneToday: !!(log[tKey] && log[tKey].done)
    });

    // --- Bannières ---
    var bannersHtml = "";
    if (!state.storageOk) {
      bannersHtml += '<div class="banner banner-error">Stockage indisponible (navigation privée, ou mémoire pleine). Tes taps s\'affichent mais rien n\'est gardé : exporte tes données dès que possible.</div>';
    }
    if (state.notice) {
      bannersHtml += '<div class="banner banner-' + esc(state.notice.kind || "info") + '">' + esc(state.notice.text) + '</div>';
    }
    if (!isToday) {
      bannersHtml +=
        '<div class="banner banner-warn">Tu saisis la séance du <strong>' + esc(longDate(editKey)) + '</strong>, pas celle d\'aujourd\'hui.' +
          '<button type="button" class="banner-btn" data-action="goto-today">Revenir à aujourd\'hui</button>' +
        '</div>';
    }

    // --- En-tête, choix du jour, choix de la séance ---
    // Ordre chronologique : on lit de gauche à droite. Les boutons portent un
    // DÉCALAGE et non une date : une date calculée au rendu devient fausse après
    // minuit si la page reste ouverte.
    var quick = [
      { off: -2, label: "Avant-hier" },
      { off: -1, label: "Hier" },
      { off: 0, label: "Aujourd'hui" }
    ];
    var dayBtns = quick.map(function (q) {
      var kq = fmt(addDays(new Date(), q.off));
      var active = kq === editKey;
      return '<button type="button" class="day-btn ' + (active ? "day-btn-active" : "") + '"' +
        ' aria-pressed="' + (active ? "true" : "false") + '"' +
        ' data-action="set-edit-day" data-off="' + q.off + '">' + q.label + '</button>';
    }).join("");

    var progPickerHtml = "";
    if (state.showProgPicker || !program) {
      progPickerHtml = '<div class="prog-picker" role="group" aria-label="Choisir la séance effectuée">' +
        PROGRAM_ORDER.map(function (pk) {
          var active = progKey === pk;
          return '<button type="button" class="prog-btn ' + (active ? "prog-btn-active" : "") + '"' +
            ' aria-pressed="' + (active ? "true" : "false") + '"' +
            ' data-action="set-prog" data-prog="' + pk + '">' + esc(PROGRAM[pk].label) + '</button>';
        }).join("") + '</div>';
    }

    var showDateField = state.showDatePicker || !isToday;

    var headerHtml =
      '<header class="header">' +
        '<div class="header-date">' + esc(longDate(editKey)) + (isToday ? "" : " (rattrapage)") + '</div>' +
        (program
          ? '<h1 class="header-title" style="color:' + accent + '">' + esc(program.label) + '</h1>'
          : '<h1 class="header-title header-title-rest">REPOS</h1>') +
        '<div class="header-sub">' + (program ? esc(program.sub) : "Choisis une séance ci-dessous si tu en as fait une") + '</div>' +
        // Sans cette mention, rien ne signale qu'on regarde une séance forcée :
        // on voit PULL un mercredi et on croit à un bug de l'appli.
        (overriddenProg
          ? '<div class="header-override">Séance choisie à la main. Le ' + esc(weekdayName(editKey)) +
            ', c\'est normalement ' + esc(PROGRAM[naturalDow].label) + '.</div>'
          : "") +
      '</header>' +
      // « Changer de séance » juste sous le titre : c'est ce titre qu'il change,
      // les deux doivent se toucher.
      (program
        ? '<button type="button" class="prog-toggle" data-action="toggle-prog-picker" aria-expanded="' + (state.showProgPicker ? "true" : "false") + '">⇄ ' +
            (state.showProgPicker ? "Masquer le choix de séance" : "Changer de séance") + '</button>'
        : "") +
      progPickerHtml +
      '<div class="day-row">' + dayBtns + '</div>' +
      // Le champ date sert au RATTRAPAGE d'une séance oubliée, pas à changer le
      // jour courant, qui vient du téléphone. Rare, donc replié par défaut : il
      // n'a pas à occuper le haut de l'écran de séance en permanence. Il s'ouvre
      // tout seul dès qu'on n'est plus sur aujourd'hui, pour pouvoir ajuster.
      (showDateField
        ? '<input type="date" class="weight-input day-date" data-action="set-edit-date" max="' + tKey + '" min="' + floorKey + '" value="' + esc(editKey) + '" aria-label="Saisir une autre date">'
        : '<button type="button" class="date-link" data-action="toggle-date-picker">Saisir un autre jour…</button>');

    // --- Hero streak ---
    var glowCls = currentStreak >= 10 ? "glow-strong" : (currentStreak > 0 ? "glow-soft" : "");

    // Grille des 4 dernières semaines : une ligne par semaine, une colonne par
    // jour ouvré. Le motif des trous se lit d'un coup d'œil.
    // Une colonne par jour d'entrainement, dans l'ordre de la semaine. Les cles
    // de PROGRAM_ORDER valent deja 1 pour lundi a 7 pour dimanche, donc leur
    // ordre naturel est le bon et le decalage depuis lundi vaut cle - 1.
    var gridKeys = PROGRAM_ORDER.length ? PROGRAM_ORDER : [1, 2, 3, 4, 5];
    var nCols = gridKeys.length;
    var gridDone = 0, gridMiss = 0, missByDay = [], mzi;
    for (mzi = 0; mzi < nCols; mzi++) missByDay.push(0);
    var gridCells = '<span class="wg-head" aria-hidden="true"></span>' +
      gridKeys.map(function (pk2) {
        return '<span class="wg-head" aria-hidden="true">' + DAY_INITIALS[pk2 === 7 ? 0 : pk2] + '</span>';
      }).join("");
    var thisMonday = mondayOf(new Date());
    for (var wi = 3; wi >= 0; wi--) {
      var wMon = addDays(thisMonday, -wi * 7);
      gridCells += '<span class="wg-label" aria-hidden="true">' +
        wMon.getDate() + "/" + (wMon.getMonth() + 1) + '</span>';
      for (var dj = 0; dj < nCols; dj++) {
        var cd = addDays(wMon, gridKeys[dj] - 1), ck2 = fmt(cd);
        var isDone = !!(log[ck2] && log[ck2].done);
        var cls;
        if (ck2 > tKey) { cls = "wg-future"; }
        else if (ck2 === tKey) { cls = isDone ? "wg-today-done" : "wg-today"; if (isDone) gridDone++; }
        else if (isDone) { cls = "wg-done"; gridDone++; }
        else { cls = "wg-miss"; gridMiss++; missByDay[dj]++; }
        gridCells += '<span class="wg-cell ' + cls + '" aria-hidden="true"></span>';
      }
    }
    // Si un jour de la semaine ressort nettement, on le nomme : c'est la seule
    // information que le compteur de streak est incapable de donner.
    var worstDay = -1, worstCount = 0, sameMax = 0, mi;
    for (mi = 0; mi < nCols; mi++) {
      if (missByDay[mi] > worstCount) { worstCount = missByDay[mi]; worstDay = mi; sameMax = 1; }
      else if (missByDay[mi] === worstCount && worstCount > 0) { sameMax++; }
    }
    var gridNote = (worstCount >= 2 && sameMax === 1)
      ? '<div class="wg-legend"><span>Jour le plus manqué sur 4 semaines : <b style="color:#cfc6b3">le ' +
          DAY_FULL[gridKeys[worstDay] === 7 ? 0 : gridKeys[worstDay]] + '</b></span></div>'
      : '<div class="wg-legend">' +
          '<span><i class="wg-swatch" style="background:#f4d912"></i> faite</span>' +
          '<span><i class="wg-swatch" style="border:1.5px solid #8c8474"></i> manquée</span>' +
          '<span><i class="wg-swatch" style="border:1.5px dashed #4a4436"></i> à venir</span>' +
        '</div>';

    var heroHtml =
      '<section class="hero">' +
        '<div class="hero-flame-wrap ' + glowCls + '" style="--glow:' + ACCENT + '">' +
          '<div class="hero-flame"><span aria-hidden="true">🔥</span><span class="hero-number" style="' + (currentStreak === 0 ? "color:#a89e8a" : "") + '">' + currentStreak + '</span></div>' +
        '</div>' +
        '<div class="hero-label">séances d\'affilée, sur tes jours prévus</div>' +
        '<div class="weekgrid" role="img" style="grid-template-columns:30px repeat(' + nCols + ',1fr);max-width:' + (30 + nCols * 44) + 'px"' +
          ' aria-label="4 dernières semaines : ' + gridDone + ' séances faites, ' + gridMiss + ' manquées">' +
          gridCells +
        '</div>' +
        gridNote +
      '</section>';

    var motivationHtml =
      '<section class="card motivation-card">' +
        '<div class="motivation-head">' + esc(motivation.head) + '</div>' +
        '<div class="motivation-sub">' + esc(motivation.sub) + '</div>' +
      '</section>';

    function LEVELS_ROW(label, field, value) {
      var groupId = "level-" + field;
      var btns = LEVELS.map(function (l) {
        var active = value === l.v;
        return '<button type="button" class="level-btn ' + (active ? "level-btn-active" : "") + '"' +
          ' aria-pressed="' + (active ? "true" : "false") + '"' +
          ' data-action="set-level" data-field="' + field + '" data-val="' + l.v + '">' + esc(l.label) + '</button>';
      }).join("");
      return '<div class="field">' +
        '<div class="field-label" id="' + groupId + '">' + esc(label) + '</div>' +
        '<div class="level-row" role="group" aria-labelledby="' + groupId + '">' + btns + '</div></div>';
    }

    // --- Carte séance ---
    var seanceHtml = "";
    if (program) {
      var exListHtml = "";
      if (state.showExercises) {
        exListHtml = '<ol class="exercise-list">' + exerciseProgress.map(function (p, i) {
          var ex = p.ex;
          var itemCls = "exercise-item" + (p.isDone ? " exercise-item-done" : "");
          var borderStyle = (p.isPartial && !p.isDone) ? ' style="border-left-color:' + accent + '"' : "";
          var body = "";

          if (p.track === "run") {
            // Un bloc de course se note en une ligne : la distance et le temps.
            // L'allure en decoule et s'affiche a cote, c'est le chiffre que
            // regarde un coureur, comme le tonnage pour quelqu'un qui souleve.
            var s0 = setsOf(entry, ex.id)[0] || {};
            var allure = frAllure(s0.km, s0.min);
            body =
              '<div class="serie-table">' +
                '<div class="serie-line' + ((s0.km && s0.min) ? " serie-line-filled" : "") + '">' +
                  '<input id="km-' + ex.id + '" class="serie-input" type="text" inputmode="decimal" autocomplete="off"' +
                    ' placeholder="km" value="' + esc(s0.km != null ? frDec(s0.km) : "") + '"' +
                    ' data-action="set-km" data-ex="' + ex.id + '" data-set="0"' +
                    ' aria-label="Distance en kilomètres, ' + esc(ex.name) + '">' +
                  '<span class="serie-unit" aria-hidden="true">km</span>' +
                  '<span class="serie-x" aria-hidden="true">en</span>' +
                  '<input id="min-' + ex.id + '" class="serie-input" type="text" inputmode="numeric" autocomplete="off"' +
                    ' placeholder="min" value="' + esc(s0.min != null ? s0.min : "") + '"' +
                    ' data-action="set-min" data-ex="' + ex.id + '" data-set="0"' +
                    ' aria-label="Durée en minutes, ' + esc(ex.name) + '">' +
                  '<span class="serie-unit" aria-hidden="true">min</span>' +
                  (allure ? '<span class="serie-sub">' + esc(allure) + '/km</span>' : '') +
                '</div>' +
              '</div>';
            var pRun = lastRunFor(editKey, ex.id, progKey);
            var cmpRun = "";
            if (pRun && s0.km) {
              var dk = Math.round((s0.km - pRun.km) * 10) / 10;
              cmpRun = (dk === 0)
                ? '<span class="tonnage-label">même distance</span>'
                : (dk > 0 ? '<span class="load-up">+' + frDec(String(dk)) + ' km</span>'
                          : '<span class="load-down">-' + frDec(String(-dk)) + ' km</span>');
            }
            body +=
              '<div class="exo-compare">' +
                '<span class="exo-today">Aujourd\'hui <b>' + (s0.km ? frDec(String(s0.km)) + ' km' : '—') + '</b></span>' +
                (pRun
                  ? '<span>La dernière fois (' + esc(shortDate(pRun.date)) + ') <b>' + frDec(String(Math.round(pRun.km * 10) / 10)) + ' km</b></span>'
                  : '<span>Première sortie sur ce bloc</span>') +
                (cmpRun ? '<span>' + cmpRun + '</span>' : '') +
              '</div>';

          } else if (p.loadable) {
            // Une ligne par série : la charge peut monter ou descendre en cours
            // de séance, un seul couple pour tout l'exercice ne suffit pas.
            var arr = setsOf(entry, ex.id);
            var rows = Math.max(p.total, arr.length);
            var lines = "", si, s, sub;
            for (si = 0; si < rows; si++) {
              s = arr[si] || {};
              sub = (s.kg && s.reps) ? (s.kg * s.reps) : 0;
              lines +=
                '<div class="serie-line' + (sub > 0 ? " serie-line-filled" : "") + '">' +
                  '<span class="serie-num" aria-hidden="true">' + (si + 1) + '</span>' +
                  '<input id="kg-' + ex.id + '-' + si + '" class="serie-input" type="text" inputmode="decimal" autocomplete="off"' +
                    ' placeholder="kg" value="' + esc(s.kg != null ? frDec(s.kg) : "") + '"' +
                    ' data-action="set-kg" data-ex="' + ex.id + '" data-set="' + si + '"' +
                    ' aria-label="Série ' + (si + 1) + ', charge en kilos, ' + esc(ex.name) + '">' +
                  '<span class="serie-unit" aria-hidden="true">kg</span>' +
                  '<span class="serie-x" aria-hidden="true">×</span>' +
                  '<input id="reps-' + ex.id + '-' + si + '" class="serie-input" type="text" inputmode="numeric" autocomplete="off"' +
                    ' placeholder="reps" value="' + esc(s.reps != null ? s.reps : "") + '"' +
                    ' data-action="set-reps" data-ex="' + ex.id + '" data-set="' + si + '"' +
                    ' aria-label="Série ' + (si + 1) + ', répétitions, ' + esc(ex.name) + '">' +
                  (sub > 0 ? '<span class="serie-sub">' + frNum(sub) + ' kg</span>' : '') +
                '</div>';
            }
            body = (ex.kgCible
              ? '<div class="ana-cible">Charge vis\u00e9e : <b>' + frDec(String(ex.kgCible)) + ' kg</b></div>'
              : '') + '<div class="serie-table">' + lines + '</div>';

            // Comparaison en KILOS, exercice par exercice : c'est ce qui donne
            // envie de monter ou de réduire la charge à la série suivante. Un
            // pourcentage demande un calcul mental ; un écart en kilos se lit.
            var prev = lastTonnageFor(editKey, ex.id, progKey);
            var cmp = "";
            if (prev && p.tonnage > 0) {
              var d = Math.round(p.tonnage - prev.tonnage);
              cmp = (d === 0)
                ? '<span class="tonnage-label">à égalité</span>'
                : (d > 0 ? '<span class="load-up">+' + frNum(d) + ' kg</span>'
                         : '<span class="load-down">-' + frNum(-d) + ' kg</span>');
            }
            body +=
              '<div class="exo-compare">' +
                '<span class="exo-today">Aujourd\'hui <b>' + frNum(p.tonnage) + ' kg</b></span>' +
                (prev
                  ? '<span>La dernière fois (' + esc(shortDate(prev.date)) + ') <b>' + frNum(prev.tonnage) + ' kg</b></span>'
                  : '<span>Première fois sur cet exercice</span>') +
                (cmp ? '<span>' + cmp + '</span>' : '') +
              '</div>';

          } else {
            // Exercice chronométré : pas de charge, on garde les pastilles.
            var dotsHtml = "", di, filled, dotStyle, nextVal;
            for (di = 0; di < p.total; di++) {
              filled = di < p.done;
              dotStyle = filled ? ' style="background:' + accent + ';border-color:' + accent + ';color:#100f0d"' : "";
              nextVal = (di + 1 === p.done) ? di : di + 1;
              dotsHtml += '<button type="button" class="set-dot" data-action="set-sets" data-ex="' + ex.id + '" data-val="' + nextVal + '"' + dotStyle +
                ' aria-label="' + esc(ex.name) + ', série ' + (di + 1) + ' sur ' + p.total + (filled ? ", faite" : ", à faire") + '">' + (di + 1) + '</button>';
            }
            body = '<div class="set-row">' + dotsHtml +
              '<span class="set-remaining">' + p.done + '/' + p.total + (p.total > 1 ? " séries" : "") + '</span></div>';
          }

          // Deux commandes distinctes sur la ligne de titre : le nom replie ou
          // déplie l'exercice, le « ? » ouvre la fiche technique. Replié, il ne
          // reste qu'un résumé d'une ligne, ce qui raccourcit l'écran à mesure
          // que la séance avance.
          var howtoOpen = state.openExo === ex.id;
          var folded = state.exoFolded[ex.id] === true;
          return '<li class="' + itemCls + (folded ? " exercise-item-folded" : "") + '"' + borderStyle + '>' +
            '<div class="exercise-item-top">' +
              '<button type="button" class="exercise-item-name" data-action="toggle-exo" data-ex="' + ex.id + '"' +
                ' aria-expanded="' + (folded ? "false" : "true") + '">' +
                '<span class="exo-caret" aria-hidden="true">' + (folded ? "▸" : "▾") + '</span>' +
                (i + 1) + '. ' + esc(ex.name) +
              '</button>' +
              '<button type="button" class="howto-btn" data-action="toggle-howto" data-ex="' + ex.id + '"' +
                ' aria-expanded="' + (howtoOpen ? "true" : "false") + '"' +
                ' aria-label="Comment faire : ' + esc(ex.name) + '">' + (howtoOpen ? "×" : "?") + '</button>' +
              (p.isDone ? '<span class="exercise-check-icon" aria-hidden="true">✓</span>' : '') +
            '</div>' +
            (folded
              ? '<div class="exo-summary">' + p.done + '/' + p.total + (p.total > 1 ? " séries" : " série") +
                  (p.tonnage > 0 ? ' · ' + frNum(p.tonnage) + ' kg' : '') + '</div>'
              : '<div class="exercise-item-detail">' + esc(ex.detail) + '</div>' +
                (howtoOpen ? howtoHtml(ex) : "") +
                body
            ) +
          '</li>';
        }).join("") + '</ol>';
      }

      var allDoneHint = (totalExercises > 0 && exercisesDoneCount === totalExercises)
        ? '<div class="all-done-hint">Tous les exercices sont faits, pense à valider la séance ci-dessous.</div>' : "";

      var tonnageHtml = "";
      if (todayTonnage > 0) {
        var cmpTon;
        if (lastTonnage > 0) {
          var dTon = Math.round(todayTonnage - lastTonnage);
          cmpTon = (dTon === 0)
            ? "à égalité avec le " + esc(shortDate(lastKey))
            : (dTon > 0 ? '<span class="load-up">+' + frNum(dTon) + ' kg</span>'
                        : '<span class="load-down">-' + frNum(-dTon) + ' kg</span>') +
              " vs " + esc(shortDate(lastKey));
        } else {
          cmpTon = "premier repère sur cette séance";
        }
        tonnageHtml =
          '<div class="tonnage-line">' +
            '<span><span class="tonnage-value">' + frNum(todayTonnage) + ' kg</span>' +
            '<span class="tonnage-label"> soulevés en tout</span></span>' +
            '<span class="tonnage-label">' + cmpTon + '</span>' +
          '</div>';
      }

      var lastSessionHtml;
      if (lastEntry) {
        var lsParts = [], lbl;
        if (typeof lastEntry.weight === "number") lsParts.push(frDec(lastEntry.weight) + " kg");
        lbl = levelLabel(lastEntry.energy);   if (lbl) lsParts.push("énergie " + lbl.toLowerCase());
        lbl = levelLabel(lastEntry.sleep);    if (lbl) lsParts.push("sommeil " + lbl.toLowerCase());
        lbl = levelLabel(lastEntry.strength); if (lbl) lsParts.push("force " + lbl.toLowerCase());
        if (lastTonnage > 0) lsParts.push(frNum(lastTonnage) + " kg soulevés");
        lsParts.push(lastEntry.done ? "terminée ✓" : "non terminée");
        lastSessionHtml = '<div class="last-session"><strong>Dernière fois</strong> (' + esc(shortDate(lastKey)) + ') : ' + esc(lsParts.join(" · ")) + '</div>';
      } else {
        lastSessionHtml = '<div class="last-session last-session-empty">Première séance ' + esc(program.label) + ' enregistrée ici, rien à comparer encore.</div>';
      }

      seanceHtml =
        '<section class="card">' +
          '<div class="card-title">Séance ' + (isToday ? "du jour" : "du " + esc(shortDate(editKey))) +
            '<span class="duration-pill">' + esc(program.duration) + '</span></div>' +
          lastSessionHtml +
          '<button type="button" class="detail-toggle" data-action="toggle-exercises" aria-expanded="' + (state.showExercises ? "true" : "false") + '">' +
            (state.showExercises ? "Masquer" : "Voir le détail") + ' · ' + exercisesDoneCount + '/' + totalExercises + ' faits ' + (state.showExercises ? "▲" : "▼") +
          '</button>' +
          exListHtml + allDoneHint + tonnageHtml +
          '<div class="field" style="margin-top:16px">' +
            '<label class="field-label" for="weight-input">Poids du jour (kg)</label>' +
            '<input id="weight-input" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done"' +
              ' placeholder="ex. ' + START_WEIGHT + '" class="weight-input" data-action="set-weight"' +
              ' value="' + esc(entry.weight != null ? frDec(entry.weight) : "") + '">' +
            '<div class="field-hint">La virgule et le point marchent tous les deux.</div>' +
          '</div>' +
          LEVELS_ROW("Énergie", "energy", entry.energy) +
          LEVELS_ROW("Sommeil", "sleep", entry.sleep) +
          LEVELS_ROW("Force ressentie", "strength", entry.strength) +
          '<button type="button" class="checkin-btn ' + (entry.done ? "checkin-btn-active" : "") + '"' +
            ' style="' + (!entry.done ? "border-color:" + accent + ";color:" + accent : "") + '"' +
            ' data-action="toggle-done" aria-pressed="' + (entry.done ? "true" : "false") + '">✓ ' +
            (entry.done ? "Séance terminée" : "Valider la séance") + '</button>' +
        '</section>';
    } else {
      seanceHtml =
        '<section class="card">' +
          '<div class="card-title">Pesée du jour</div>' +
          '<div class="field">' +
            '<label class="field-label" for="weight-input">Poids du jour (kg)</label>' +
            '<input id="weight-input" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done"' +
              ' placeholder="ex. ' + START_WEIGHT + '" class="weight-input" data-action="set-weight"' +
              ' value="' + esc(entry.weight != null ? frDec(entry.weight) : "") + '">' +
            '<div class="field-hint">Se peser le week-end aussi lisse la courbe. Aucune séance n\'est attendue.</div>' +
          '</div>' +
        '</section>';
    }

    // --- Nutrition ---
    var nutriListHtml = "";
    if (state.showNutrition) {
      nutriListHtml = '<ul class="nutrition-list">' + NUTRITION.map(function (n, i) {
        var checked = !!entryNutri[i];
        return '<li>' +
          '<button type="button" class="nutrition-item ' + (checked ? "nutrition-item-done" : "") + '"' +
            ' data-action="toggle-nutri" data-n="' + i + '" aria-pressed="' + (checked ? "true" : "false") + '">' +
            '<span class="nutrition-time">' + esc(n.time) + '</span>' +
            '<span class="nutrition-item-text"><span class="nutrition-item-name">' + esc(n.item) + '</span>' +
              '<span class="nutrition-item-note">' + esc(n.note) + '</span></span>' +
            (checked ? '<span class="nutrition-check-icon" aria-hidden="true">✓</span>' : '') +
          '</button>' +
        '</li>';
      }).join("") + '</ul>';
    }
    // Les repères chiffrés sont recalculés à l'affichage et non figés dans le
    // profil : ils dépendent du poids de départ et du nombre de séances, qui
    // peuvent changer. Figés, ils deviendraient faux sans prévenir.
    var nutriTargetsHtml = "";
    if (profile) {
      var nt = nutritionTargets(profile);
      nutriTargetsHtml =
        '<div class="nutri-targets">' +
          '<div class="nutri-target"><div class="nutri-target-num">' + frNum(nt.kcal) + '</div>' +
            '<div class="nutri-target-label">kcal / jour<br>repère</div></div>' +
          '<div class="nutri-target"><div class="nutri-target-num">' + nt.prot + ' g</div>' +
            '<div class="nutri-target-label">protéines<br>par jour</div></div>' +
          (nt.deficit > 0

              '<div class="nutri-target-label">déficit<br>visé</div></div>'

          (nt.surplus > 0

            : '') +
        '</div>';
    }
    var nutritionHtml =
      '<section class="card">' +
        '<div class="card-title">Nutrition ' + (isToday ? "du jour" : "du " + esc(shortDate(editKey))) + '</div>' +
        nutriTargetsHtml +
        '<button type="button" class="detail-toggle" data-action="toggle-nutrition" aria-expanded="' + (state.showNutrition ? "true" : "false") + '">' +
          (state.showNutrition ? "Masquer" : "Voir les prises") + ' · ' + nutriDoneCount + '/' + NUTRITION.length + ' faites ' + (state.showNutrition ? "▲" : "▼") +
        '</button>' +
        nutriListHtml +
        (profile
          ? '<div class="nutri-disclaimer">Des repères estimés à partir de ton poids et de ton volume d\'entraînement, ' +
            'pas une prescription : aucun métabolisme n\'est mesuré ici. Ajuste d\'après ce que fait la balance sur trois semaines.</div>'
          : '') +
      '</section>';

    // --- Graphique de poids ---
    var chartHtml = "";
    if (weightSeries.length >= 2) {
      var w = 300, h = 150, padX = 10, padY = 16;
      var values = weightSeries.map(function (d) { return d.poids; });
      var bornes = [TARGET_WEIGHT, START_WEIGHT].concat(values);
      var yMin = Math.min.apply(null, bornes) - 2;
      var yMax = Math.max.apply(null, bornes) + 2;
      var ySpan = (yMax - yMin) || 1;
      var t0 = dateFromKey(weightSeries[0].date).getTime();
      var t1 = dateFromKey(weightSeries[weightSeries.length - 1].date).getTime();
      var tSpan = (t1 - t0) || 1;
      var showRaw = state.chartMode !== "trend";
      var showTrend = state.chartMode !== "raw";

      function xScale(key) { return padX + ((dateFromKey(key).getTime() - t0) / tSpan) * (w - padX * 2); }
      function yScale(v) { return h - padY - ((v - yMin) / ySpan) * (h - padY * 2); }
      function pathOf(list) {
        return list.map(function (d, i) {
          return (i === 0 ? "M" : "L") + xScale(d.date).toFixed(1) + "," + yScale(d.poids).toFixed(1);
        }).join(" ");
      }

      var targetY = yScale(TARGET_WEIGHT);
      var last = weightSeries[weightSeries.length - 1];
      var lastTrend = trend[trend.length - 1];
      var rawDotR = showTrend ? 2.6 : 3.4;
      var rawSvg = showRaw
        ? '<path d="' + pathOf(weightSeries) + '" fill="none" stroke="' + ACCENT + '" stroke-width="' + (showTrend ? 1.5 : 2.4) + '" opacity="' + (showTrend ? 0.75 : 1) + '" stroke-linejoin="round"/>' +
          weightSeries.map(function (d) {
            return '<circle cx="' + xScale(d.date).toFixed(1) + '" cy="' + yScale(d.poids).toFixed(1) + '" r="' + rawDotR + '" fill="' + ACCENT + '"/>';
          }).join("")
        : "";
      // Trait de tendance affiné : à 3,5 px il recouvrait entièrement les pesées.
      var trendSvg = showTrend
        ? '<path d="' + pathOf(trend) + '" fill="none" stroke="' + TREND_COLOR + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'
        : "";

      // Échelle verticale. Sans repère chiffré, une courbe ne dit rien : on ne
      // sait pas à quelle hauteur on est. Les valeurs sont en HTML et non dans
      // le SVG, parce que preserveAspectRatio="none" étire le dessin en largeur
      // et déformerait tout texte placé dedans. Les lignes horizontales, elles,
      // restent horizontales quel que soit l'étirement.
      var TICK_STEP = 5;
      var ticks = [], tv;
      for (tv = Math.ceil(yMin / TICK_STEP) * TICK_STEP; tv <= yMax; tv += TICK_STEP) ticks.push(tv);
      var gridSvg = ticks.map(function (v) {
        var y = yScale(v).toFixed(1);
        return '<line x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="#3a352c" stroke-width="1"/>';
      }).join("");
      var yLabels = ticks.map(function (v) {
        return '<span class="chart-ytick" style="top:' + ((yScale(v) / h) * 100).toFixed(2) + '%">' + v + '</span>';
      }).join("") +
        '<span class="chart-ytick chart-ytick-target" style="top:' + ((targetY / h) * 100).toFixed(2) + '%">' + TARGET_WEIGHT + '</span>';

      var modeBtns = CHART_MODES.map(function (m) {
        var active = state.chartMode === m.v;
        return '<button type="button" class="chart-mode-btn ' + (active ? "chart-mode-active" : "") + '"' +
          ' aria-pressed="' + (active ? "true" : "false") + '"' +
          ' data-action="set-chart-mode" data-mode="' + m.v + '">' + esc(m.label) + '</button>';
      }).join("");

      var legend = '<span class="chart-target-label">ligne verte : objectif ' + TARGET_WEIGHT + ' kg</span>';
      if (showRaw) legend = '<span><i class="legend-swatch" style="background:' + ACCENT + '"></i> pesées</span>' + legend;
      if (showTrend) legend = '<span><i class="legend-swatch" style="background:' + TREND_COLOR + '"></i> tendance ' + TREND_WINDOW_DAYS + ' j</span>' + legend;

      chartHtml =
        '<section class="card">' +
          '<div class="card-title">📉 Poids : ' + frDec(weightDelta <= 0 ? weightDelta : "+" + weightDelta) + ' kg depuis le départ</div>' +
          '<div class="chart-modes" role="group" aria-label="Ce qui est affiché sur la courbe">' + modeBtns + '</div>' +
          '<div class="chart-wrap">' +
            '<div class="chart-yaxis" aria-hidden="true">' + yLabels + '</div>' +
            '<svg viewBox="0 0 ' + w + ' ' + h + '" class="weight-svg" preserveAspectRatio="none" role="img"' +
              ' aria-label="Courbe de poids de ' + frDec(weightSeries[0].poids) + ' à ' + frDec(last.poids) +
              ' kg, tendance lissée à ' + frDec(lastTrend.poids.toFixed(1)) + ' kg, objectif ' + TARGET_WEIGHT + ' kg">' +
              gridSvg +
              '<line x1="0" y1="' + targetY.toFixed(1) + '" x2="' + w + '" y2="' + targetY.toFixed(1) + '" stroke="#8caa7c" stroke-dasharray="4 4" stroke-width="1.5"/>' +
              rawSvg + trendSvg +
            '</svg>' +
          '</div>' +
          // Dates ET poids aux deux bouts : c'est ce qui permet de lire un point.
          '<div class="chart-labels">' +
            '<span>' + esc(shortDate(weightSeries[0].date)) + ' · <b>' + frDec(weightSeries[0].poids) + ' kg</b></span>' +
            '<span>' + esc(shortDate(last.date)) + ' · <b>' + frDec(last.poids) + ' kg</b></span>' +
          '</div>' +
          '<div class="chart-legend">' + legend + '</div>' +
        '</section>';
    }

    // --- Progression ---
    var statHtml =
      '<div class="stat-grid">' +
        '<div class="stat-box"><div class="stat-num">' + totalDone + '</div><div class="stat-label">séances</div></div>' +
        '<div class="stat-box"><div class="stat-num">' + (attendance === null ? "-" : attendance + " %") + '</div><div class="stat-label">assiduité<br>jours prévus</div></div>' +
        // La troisieme case suit la discipline. Afficher « 0 kg soulevé » a un
        // coureur donnerait une appli cassee ; lui cacher ses kilometres aussi.
        (totalKm > 0 || (profile && profile.discipline === "course")
          ? '<div class="stat-box"><div class="stat-num">' + frDec(String(Math.round(totalKm * 10) / 10)) + ' km</div>' +
            '<div class="stat-label">parcourus<br>au total</div></div>'
          : '') +
        (totalTonnage > 0 || !(profile && profile.discipline === "course")
          ? '<div class="stat-box"><div class="stat-num">' + frPoids(totalTonnage) + '</div>' +
            '<div class="stat-label">soulevé<br>au total</div></div>'
          : '') +
      '</div>';

    var badgesHtml = BADGES.map(function (b) {
      var unlocked = totalDone >= b.n;
      return '<div class="badge ' + (unlocked ? "badge-unlocked" : "") + '">' +
        '<div class="badge-num">' + b.n + '×</div>' +
        '<div class="badge-label">' + esc(b.label) + '</div>' +
        '<span class="sr-only">' + (unlocked ? "palier atteint" : "pas encore atteint") + '</span></div>';
    }).join("");

    var badgesSectionHtml =
      '<section class="card">' +
        '<div class="card-title">🏆 Progression</div>' +
        statHtml +
        '<div class="badges">' + badgesHtml + '</div>' +
        '<div class="total-line">' +
          (firstKey ? "Depuis le " + esc(shortDate(firstKey)) : "Aucune séance enregistrée pour l'instant") +
        '</div>' +
      '</section>';

    // Sauvegarde descendue en bas : c'est de la maintenance, on y touche une fois
    // par mois. Elle occupait la première place uniquement parce qu'elle
    // partageait sa carte avec le mode test et la date de début, tous deux
    // supprimés depuis.
    var profileHtml = "";
    if (profile) {
      var pDays = [], pdi;
      for (pdi = 0; pdi < PROGRAM_ORDER.length; pdi++) {
        pDays.push(DAY_LABELS[PROGRAM_ORDER[pdi] === 7 ? 0 : PROGRAM_ORDER[pdi]]);
      }
      var pEquip = [], pei, peq;
      for (pei = 0; pei < EQUIP_OPTIONS.length; pei++) {
        if (profile.equipment.indexOf(EQUIP_OPTIONS[pei].v) >= 0) pEquip.push(EQUIP_OPTIONS[pei].label);
      }
      if (!pEquip.length) pEquip.push("Poids de corps");
      profileHtml =
        '<section class="card">' +
          '<div class="card-title">👤 Mon profil' + (profile.name ? ' · ' + esc(profile.name) : '') + '</div>' +
          '<div class="profile-row"><span>Objectif</span><b>' + frDec(profile.startWeight) + ' → ' + frDec(profile.targetWeight) + ' kg</b></div>' +
          '<div class="profile-row"><span>Jours</span><b>' + esc(pDays.join(", ")) + '</b></div>' +
          '<div class="profile-row"><span>Durée</span><b>' + profile.minutes + ' min par séance</b></div>' +
          '<div class="profile-row"><span>Matériel</span><b>' + esc(pEquip.join(", ")) + '</b></div>' +
          (profile.noGear && profile.noGear.length
            ? '<div class="profile-row"><span>Machines absentes</span><b>' + profile.noGear.length + ' famille' +
              (profile.noGear.length > 1 ? 's' : '') + '</b></div>' : '') +
          (profile.excluded.length
            ? '<div class="profile-row"><span>Exercices refusés</span><b>' + profile.excluded.length + '</b></div>' : '') +
          '<button type="button" class="profile-btn" data-action="redo-diagnostic">↻ Refaire le diagnostic</button>' +
          '<div class="nutri-disclaimer">Refaire le diagnostic reconstruit le programme et le plan nutrition. ' +
            'Ton historique de séances n\'est pas touché : il vit dans un autre emplacement.</div>' +
        '</section>';
    }

    var settingsHtml =
      '<section class="card settings-card">' +
        '<div class="card-title">Sauvegarde</div>' +
        '<div class="field" style="margin-bottom:0">' +
          '<div class="field-label" id="backup-label">' + countKeys(log) + ' jour(s) enregistré(s) sur cet appareil' +
            (profile && profile.done ? ', plus ton profil et ton programme' : '') + '</div>' +
          '<div class="backup-row">' +
            '<button type="button" class="backup-btn" data-action="export-data" aria-describedby="backup-label">⬇ Exporter</button>' +
            '<button type="button" class="backup-btn" data-action="import-data" aria-describedby="backup-label">⬆ Importer</button>' +
          '</div>' +
          '<input type="file" id="import-file-input" accept="application/json,.json" class="sr-only">' +
        '</div>' +
      '</section>';

    var footerHtml =
      '<div class="footer-row">' +
        '<button type="button" class="update-btn" data-action="update-app">⟳ Mettre à jour l\'appli</button><br>' +
        '<button type="button" class="reset-btn" data-action="reset">↺ Réinitialiser les données</button>' +
        '<div class="version-tag">v' + esc(APP_VERSION) + ' · ' + esc(APP_BUILD) + '</div>' +
      '</div>';

    // Deux écrans : FAIRE d'un côté, REGARDER de l'autre.
    // Entre deux séries on ne consulte ni son tonnage cumulé sur trois mois ni sa
    // courbe de poids : ce sont des objets de bilan, pas des outils de séance.
    // L'écran 1 reste donc court et opérationnel.
    var isAnnexe = state.page === "annexe";
    var tabsHtml =
      '<div class="tabs" role="tablist">' +
        '<button type="button" class="tab ' + (isAnnexe ? "" : "tab-active") + '" role="tab"' +
          ' aria-selected="' + (isAnnexe ? "false" : "true") + '" data-action="set-page" data-page="seance">Séance</button>' +
        '<button type="button" class="tab ' + (isAnnexe ? "tab-active" : "") + '" role="tab"' +
          ' aria-selected="' + (isAnnexe ? "true" : "false") + '" data-action="set-page" data-page="annexe">Bilan &amp; réglages</button>' +
      '</div>' +
      '<div class="swipe-hint">' + (isAnnexe ? "← glisse vers la droite pour revenir à la séance" : "glisse vers la gauche pour le bilan →") + '</div>';

    var pageHtml = isAnnexe
      ? (nutritionHtml + chartHtml + badgesSectionHtml + analyseHtml() + profileHtml +
         iaCleHtml() + settingsHtml + footerHtml)
      : (headerHtml + heroHtml + motivationHtml + seanceHtml);

    var animCls = state.pageAnim ? " page-from-" + state.pageAnim : "";
    state.pageAnim = null;   // l'animation ne joue qu'au changement d'écran

    root.innerHTML =
      '<div class="container">' +
        '<div class="brandmark"><img src="' + ICON_DATA_URI + '" alt="" class="brandmark-icon"><span class="brandmark-text">LEMMON<b>FIT</b></span></div>' +

  // ===========================================================================
  // DIAGNOSTIC DE PREMIÈRE UTILISATION
  // ---------------------------------------------------------------------------
  // Sept étapes, une question par écran. Le brouillon vit dans state.ob et n'est
  // écrit dans les réglages qu'à la validation finale : abandonner en cours de
  // route ne laisse rien derrière.
  // Le journal n'est JAMAIS touché, ni pendant, ni à la fin. Refaire le
  // diagnostic change le programme à venir, pas une seule séance passée.
  // ===========================================================================
  // Les etapes sont designees par leur NOM et non par leur rang : inserer
  // « Pratique » au milieu aurait sinon oblige a renumeroter chaque branche du
  // rendu, et une seule oubliee affiche la mauvaise question.
  var OB_STEPS = ["Toi", "Poids", "Pratique", "Rythme", "Matériel", "Programme", "Nutrition", "C'est parti"];
  var MINUTE_CHOICES = [30, 40, 50, 60, 75];
  var DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];   // la semaine française commence lundi

  function obStart(fromProfile) {
    var d = fromProfile ? cleanProfile(fromProfile) : defaultProfile();
    if (!d) d = defaultProfile();
    d.done = false;
    state.ob = { step: 0, draft: d, error: null, hasLog: countKeys(state.log) > 0 };
  }

  function obDraft() { return state.ob.draft; }

  // Programme d'aperçu, reconstruit à chaque rendu de l'étape 4 pour que le
  // remplacement d'un exercice refusé soit visible immédiatement.
  function obPreview() {
    try { return buildPlan(obDraft()); } catch (e) { return {}; }
  }

  function obCanAdvance(step) {
    var d = obDraft(), nom = OB_STEPS[step];
    if (nom === "Poids") return d.startWeight > 0 && d.targetWeight > 0;
    if (nom === "Rythme") return d.days.length >= 1;
    return true;
  }

  // Jours affectes a la course, dans l'ordre de la semaine.
  function obJoursCourse(d) {
    var out = [], i;
    for (i = 0; i < d.days.length; i++) {
      if (kindOfDay(d, d.days[i]) === "course") out.push(d.days[i]);
    }
    return out;
  }

  function obBtn(action, label, extra, active) {
    return '<button type="button" class="ob-chip' + (active ? " ob-chip-on" : "") + '"' +
      ' data-action="' + action + '"' + (extra || "") +
      ' aria-pressed="' + (active ? "true" : "false") + '">' + esc(label) + '</button>';
  }

  function renderOnboarding() {
    var d = obDraft(), step = state.ob.step, body = "", i;
    var etape = OB_STEPS[step];

    var dots = "";
    for (i = 0; i < OB_STEPS.length; i++) {
      dots += '<span class="ob-dot' + (i === step ? " ob-dot-on" : (i < step ? " ob-dot-past" : "")) + '"></span>';
    }

    if (etape === "Toi") {
      body =
        '<p class="ob-lead">Cette appli va construire un programme pour <b>toi</b> : ton objectif, ton temps, ton matériel. ' +

        '<div class="field">' +
          '<div class="field-label">Tu es…</div>' +
          '<div class="ob-row">' +
            obBtn("ob-sex", "Un homme", ' data-v="h"', d.sex === "h") +
            obBtn("ob-sex", "Une femme", ' data-v="f"', d.sex === "f") +
          '</div>' +
          '<div class="field-hint">Sert uniquement à fixer un plancher de calories cohérent dans le bilan nutrition.</div>' +
        '</div>' +
        // Sans cette porte de sortie, quelqu'un qui réinstalle l'appli ou change

        // vit dans l'écran de bilan, inaccessible tant qu'aucun programme

        '<div class="ob-restore">' +

            "J'ai déjà une sauvegarde à restaurer</button>" +
          '<input type="file" id="import-file-input" accept="application/json,.json" class="sr-only">' +
        '</div>';

    } else if (etape === "Poids") {
      var ecart = Math.round((d.startWeight - d.targetWeight) * 10) / 10;
      var warn = "";

        warn = '<div class="ob-warn">Un objectif sous 45 kg sort de ce qu\'une appli peut accompagner sereinement. Parles-en à un médecin avant de viser ça.</div>';
      } else if (ecart > d.startWeight * 0.3) {

      } else if (ecart < -d.startWeight * 0.25) {

      } else if (ecart < 0) {
        // Prise de masse : le rythme tenable est BIEN plus lent qu'en perte.
        // Annoncer les mêmes 0,5 à 0,75 kg par semaine serait promettre du
        // muscle là où la balance ne monterait que de gras et d'eau.
        var semP = Math.ceil(Math.abs(ecart) / 0.3);
        warn = '<div class="ob-note">' + frDec(Math.abs(ecart)) + ' kg à prendre. Le muscle se construit lentement : ' +
          'à un rythme tenable de 0,2 à 0,4 kg par semaine, compte <b>' +

    } else if (etape === "Pratique") {

      var mixHtml = "";

      body =

        mixHtml +
        (nb ? '<div class="ob-note"><b>' + nb + ' séance' + (nb > 1 ? "s" : "") + ' par semaine</b> de ' + d.minutes +

            : '<div class="ob-warn">Choisis au moins un jour pour continuer.</div>');

    } else if (etape === "Matériel") {
      var eqBtns = "";
      for (i = 0; i < EQUIP_OPTIONS.length; i++) {

        eqBtns +=

            '<span class="ob-equip-box" aria-hidden="true">' + (on ? "✓" : "") + '</span>' +

          gBtns +=
            '<button type="button" class="ob-equip ob-equip-sub' + (gOn ? " ob-equip-on" : "") + '"' +

              '<span class="ob-equip-box" aria-hidden="true">' + (gOn ? "✓" : "") + '</span>' +

            '<div class="ob-equip-list">' + gBtns + '</div>' +
            (nbAbs
              ? '<div class="ob-note">' + nbAbs + ' famille' + (nbAbs > 1 ? "s" : "") + ' écartée' + (nbAbs > 1 ? "s" : "") +

        '<p class="ob-lead">Tout est prêt' + (d.name ? ", " + esc(d.name) : "") + '. Voilà ton programme.</p>' +
        '<div class="ob-recap">' +
          '<div class="ob-recap-row"><span>Séances</span><b>' + nbS + ' par semaine</b></div>' +
          '<div class="ob-recap-row"><span>Jours</span><b>' + esc(dayNames.join(", ")) + '</b></div>' +
          '<div class="ob-recap-row"><span>Durée</span><b>' + d.minutes + ' min par séance</b></div>' +
          '<div class="ob-recap-row"><span>Objectif</span><b>' + frDec(d.startWeight) + ' → ' + frDec(d.targetWeight) + ' kg</b></div>' +
          (t.weeks ? '<div class="ob-recap-row"><span>Horizon</span><b>' + t.weeks + ' semaines environ</b></div>' : "") +
        '</div>' +
        '<div class="ob-recap">' +
          '<div class="ob-recap-row"><span>Maintien estimé</span><b>' + frNum(t.maintain) + ' kcal/j</b></div>' +
          '<div class="ob-recap-row"><span>Cible pour avancer</span><b>' + frNum(t.kcal) + ' kcal/j</b></div>' +
          '<div class="ob-recap-row"><span>Protéines</span><b>' + t.prot + ' g/j</b></div>' +
        '</div>' +
        (t.floored
          ? '<div class="ob-warn">Le déficit calculé descendait sous un plancher raisonnable : la cible a été relevée à ' + frNum(t.kcal) +
            ' kcal. Perdre plus vite que ça se fait avec un suivi, pas avec une appli.</div>'
          : '<div class="ob-warn ob-warn-soft">Ces chiffres sont des <b>repères</b>, pas une prescription. Ils sortent d\'une estimation à partir de ton poids ' +
            'et de ton volume d\'entraînement, sans mesurer ton métabolisme. Ajuste-les d\'après ce que fait la balance sur trois semaines.</div>');
    }

    var isLast = step === OB_STEPS.length - 1;
    var blocked = !obCanAdvance(step);
    var nav =
      '<div class="ob-nav">' +
        (step > 0 ? '<button type="button" class="ob-back" data-action="ob-back">Retour</button>' : '<span></span>') +
        '<button type="button" class="ob-next" data-action="' + (isLast ? "ob-finish" : "ob-next") + '"' +
          (blocked ? ' disabled' : '') + '>' + (isLast ? "Créer mon programme" : "Suivant") + '</button>' +
      '</div>';

    root.innerHTML =
      '<div class="container ob-container">' +
        '<div class="brandmark"><img src="' + ICON_DATA_URI + '" alt="" class="brandmark-icon">' +
          '<span class="brandmark-text">LEMMON<b>FIT</b></span></div>' +
        '<div class="ob-dots" aria-hidden="true">' + dots + '</div>' +
        '<div class="ob-step-label">Étape ' + (step + 1) + ' sur ' + OB_STEPS.length + ' · ' + esc(OB_STEPS[step]) + '</div>' +
        '<section class="card ob-card">' + body + '</section>' +
        nav +
        (state.ob.hasLog
          ? '<div class="ob-safe">Ton historique est intact : ce diagnostic ne touche qu\'au programme à venir.</div>'
          : '') +
      '</div>';
  }

  // Validation finale : c'est le seul endroit qui écrit le profil.
  function obFinish() {
    var d = obDraft();
    d.plan = buildPlan(d);
    d.nutriPlan = buildNutrition(d);
    d.done = true;
    d.legacy = false;
    if (!d.createdAt) d.createdAt = todayKey();
    var cleaned = cleanProfile(d);
    if (!cleaned || !cleaned.plan) {
      state.ob.error = "Le programme n'a pas pu être construit. Reviens en arrière et vérifie tes jours d'entraînement.";
      render();
      return;
    }
    profile = cleaned;
    applyProfile();
    persistSettings();
    state.ob = null;
    state.page = "seance";
    render();
    window.scrollTo(0, 0);
    notify("Programme créé. Bonne première séance" + (profile.name ? ", " + profile.name : "") + ".", "ok");
  }


  // ===========================================================================
  // MOTEUR D'ANALYSE
  // ---------------------------------------------------------------------------
  // Un constat CHIFFRÉ tiré du journal, puis des propositions d'ajustement. Tout
  // se calcule hors ligne, sans compte et sans réseau : la plus grande partie du
  // besoin « ajuste mon programme selon mes résultats » relève de l'arithmétique,
  // pas d'un modèle de langage.
  //
  // Les règles et leur provenance :
  //   MONTER LA CHARGE  règle des 2-pour-2 (NSCA) : dépasser la cible de deux
  //                     répétitions ou plus sur la dernière série, deux séances
  //                     de suite. Incrément de 2 à 10 %, conforme à la prise de
  //                     position de l'ACSM de 2009.
  //   BAISSER           répétitions sous le bas de la fourchette, deux séances
  //                     de suite.
  //   ÉCHEC             décroissance marquée des répétitions à l'intérieur d'une
  //                     même séance.
  //   ÉCOURTÉ           moins de séries que prescrit, trois séances de suite.
  //                     Trois, parce qu'une séance écourtée peut tout aussi bien
  //                     venir d'un manque de temps ou d'une machine occupée : les
  //                     données ne distinguent pas les deux causes.
  //   STAGNATION        1RM estimé (Epley) sans progrès sur trois séances.
  //                     ATTENTION : aucune définition validée du plateau n'existe
  //                     dans la littérature. Ce seuil est NOTRE convention, et
  //                     l'interface doit le dire.
  // ===========================================================================
  var ANA_MIN_SEANCES = 3;        // en dessous, on ne conclut rien
  var ANA_PROFONDEUR = 5;         // nombre de séances remontées par exercice
  var ANA_SEMAINES_DECHARGE = 6;  // au-delà, on suggère une décharge

  // Patterns du bas du corps : l'incrément de charge y est plus grossier, les
  // machines et barres ne se chargent pas au kilo près.
  var ANA_BAS = { knee: 1, hip: 1, "quad-iso": 1, "ham-iso": 1, calf: 1 };

  function epley(kg, reps) { return kg * (1 + reps / 30); }

  // Dernière série RENSEIGNÉE d'un exercice : c'est elle que la règle des 2-pour-2
  // regarde, pas la première.
  function derniereSerie(arr) {
    var i;
    for (i = arr.length - 1; i >= 0; i--) {
