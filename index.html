  // produit par un homme de 100 a 110 kg au maintien, 2 repas, sans petit-
  // dejeuner ni collation, qui cuisine : deux repas seulement, donc chacun porte
  // la moitie d'une journee et la composition part a six composants. Au-dessus
  // de 240 : ZERO sur les 4,5 millions — les 294 troncatures annoncees par
  // l'agent ne se produisent pas.
  //
  // 300 et non 240 : 240 ne laissait que 5 caracteres au-dessus du maximum reel,
  // soit moins d'un composant. Un aliment ajoute demain, ou un libelle rallonge,
  // et le generateur ecrivait une ligne que le stockage tronquait en silence.
  // 300 absorbe un septieme composant entier (« + 2 cuilleres a soupe d'huile
  // d'olive (20 g) » fait 43 caracteres). L'invariant est desormais tenu par un
  // banc — test_c_nutrition, section « borne de longueur » — qui rejoue le
  // balayage : c'est son absence qui avait laisse passer deux versions du defaut.
  var NUTRI_LIGNE_MAX = 300;    // ligne composee par le generateur de repas
  var NUTRI_ITEM_MAX = 90;      // texte libre saisi par l'utilisateur
  // MESUREE, PAS SUPPOSEE. Les notes de complements sont ECRITES PAR L'APPLI et
  // depassaient cette borne : elles repartaient tronquees au milieu d'un mot au
  // premier rechargement, sans que rien ne le dise. Longueurs relevees sur SUPPS
  // en v1.9.0 : creatine 76, whey 78, omega 3 108, vitamine D 37, cafeine 55.
  var NUTRI_NOTE_MAX = 160;     // idem pour .note
  var NUTRI_PROT_MAX = 300;     // g de proteines sur UNE prise
  var NUTRI_KCAL_MAX = 3000;    // kcal sur UNE prise

  // --- Seuils de l'avis ------------------------------------------------------
  // Chaque seuil porte sa raison. Sans elle, on ne saurait plus dans six mois
  // pourquoi c'est 25 et pas 30, et le premier qui trouve le message trop severe
  // le changera au hasard.
  var AV_PROT_BRUIT_G   = 5;    // en dessous, c'est le bruit de l'estimation :
                                // un oeuf pese 6 g de proteines, une portion
                                // evaluee a l'oeil se trompe de cet ordre.
  var AV_PROT_BRUIT_PCT = 0.15; // 15 % d'un repas a 40 g valent 6 g : meme bruit.
  var AV_PROT_GRAVE_PCT = 0.30; // au-dela de 30 % perdus sur la prise, ce n'est
                                // plus un ajustement, c'est un autre repas.
  var AV_PROT_ABSURDE_PCT = 0.60;  // seuil « n'importe quoi » demande.
  var AV_PROT_ABSURDE_G   = 15;    // ... mais garde par un plancher absolu :
                                // perdre 60 % d'une ligne a 8 g, c'est 5 g. Rien.
  var AV_KCAL_BRUIT     = 100;  // 100 kcal font 4 % d'une journee a 2 500 : c'est
                                // sous la barre d'erreur du repere lui-meme.
  var AV_KCAL_BRUIT_PCT = 0.20;
  var AV_KCAL_NOTABLE   = 150;  // au-dela, l'ecart merite d'etre dit.

  var AV_JOUR_PROT_SAVOIR = 10; // g manquants sur la JOURNEE avant de le dire
  var AV_JOUR_PROT_ALERTE = 25; // ~20 % d'une cible a 130 g, soit la part d'un
                                // repas entier : la synthese de la journee en
                                // patit reellement.
  var AV_JOUR_PROT_GRAVE  = 40; // « vraiment n'importe quoi » : un tiers de la
                                // cible, un repas complet de proteines absent.
  var AV_JOUR_KCAL_PCT_SAVOIR = 0.10;
  var AV_JOUR_KCAL_PCT_ALERTE = 0.20;
  var AV_PROT_PLAFOND_GKG = 2.2;  // au-dela, aucun benefice supplementaire
                                  // documente sur la masse musculaire.
  // Marge en dessous de laquelle le PLAN LUI-MEME est trop pres du plancher
  // calorique pour qu'on impute le franchissement a un remplacement. 5 % d'une
  // cible a 1 600 kcal font 80 kcal, soit l'ordre de grandeur d'une portion
  // servable : c'est le bruit du generateur, pas une decision de l'utilisateur.
  // Voir la garde du plancher dans nutriAvis pour ce que ce chiffre repare.
  var AV_PLANCHER_MARGE_PCT = 0.05;

  var AV_OK = 0, AV_SAVOIR = 1, AV_ALERTE = 2;   // ordonnes : on garde le max

  // --- Gravite d'une JOURNEE, isolee ------------------------------------------
  // Sortie en fonction plutot qu'ecrite dans nutriAvis, pour une raison de fond
  // decouverte au banc : l'avis doit juger CE QUE LA CORRECTION CHANGE, pas
  // l'etat du plan.
  //
  // Le premier jet declenchait la regle des calories du jour sur le total ABSOLU
  // apres remplacement. Mesure sur un plan realiste : le plan genere totalisait
  // 2 000 kcal pour 2 570 visees — l'ecart normal d'un plan qui ne chiffre pas
  // les legumes a volonte, l'huile de cuisson ni les boissons. Consequence :
  // TOUTE correction, meme rigoureusement equivalente (46 g / 620 kcal remplaces
  // par 44 g / 600 kcal), recevait « Attention : la journee est 23 % en dessous ».
  // Une alerte vraie sur le fond, imputee au mauvais responsable, et qui se
  // serait declenchee a chaque fois jusqu'a ce que plus personne ne la lise.
  //
  // On compare donc AVANT et APRES, et une regle de journee ne parle QUE si le
  // remplacement AGGRAVE la situation. L'etat de fond du plan, lui, est dit en
  // permanence par nutriBilanPlan sur la carte : c'est sa place, pas ici.
  function avJourProt(total, cible) {
    if (cible === null) return AV_OK;
    var manque = cible - total;
    if (manque >= AV_JOUR_PROT_ALERTE) return AV_ALERTE;
    if (manque >= AV_JOUR_PROT_SAVOIR) return AV_SAVOIR;
    return AV_OK;
  }
  function avJourKcal(total, cible, plancher) {
    if (cible === null || !(total > 0)) return AV_OK;
    if (total < plancher) return AV_ALERTE;
    var r = Math.abs(total - cible) / cible;
    if (r >= AV_JOUR_KCAL_PCT_ALERTE) return AV_ALERTE;
    if (r >= AV_JOUR_KCAL_PCT_SAVOIR) return AV_SAVOIR;
    return AV_OK;
  }

  // --- Nettoyage d'une correction --------------------------------------------
  // Rend un objet PROPRE ou null. Appele AVANT l'ecriture en memoire, et de
  // nouveau par cleanProfile au rechargement : les deux passent par ici, donc ce
  // qui s'affiche apres correction est exactement ce qui reviendra apres un
  // redemarrage. Sans ce double passage, l'ecran montrerait un champ que le
  // rechargement effacerait, et le bug serait invisible pendant des semaines.
  function cleanNutriCorr(raw) {
    if (!raw || typeof raw !== "object") return null;
    // LA BORNE SUIT LA SOURCE. Elle est donc calculee AVANT le decoupage, et
    // c'est le seul ordre qui marche : `src` etait lu vingt lignes plus bas,
    // apres que `item` avait deja ete coupe.
    //
    // CE QUE CE DEFAUT COUTAIT, MESURE sur le livrable, chemin reel (profil
    // h / 82 kg / cible 76 / 3 repas, ligne du diner) : les CINQ remplacants
    // proposes faisaient 138 a 156 caracteres et etaient enregistres a 90,
    // parenthese jamais fermee — « ... + 4 tranches de pain complet ( ». Sur un
    // balayage de tous les profils, 4 988 remplacants sur 9 121 (54,7 %). Le
    // texte coupe partait dans profile.nutriPlan[i].corr.item, s'affichait sur
    // la carte et sortait dans la sauvegarde JSON par buildPayload().
    //
    // La cause n'etait pas la valeur 90, c'etait de n'avoir qu'UNE borne pour
    // DEUX origines. Les remplacants sont composes par le MEME generateur que
    // les propositions du plan, qui disposent de NUTRI_LIGNE_MAX ; les couper a
    // la borne du champ « Autre chose » revenait a juger la sortie du
    // generateur a l'aune de ce qu'un pouce peut taper sur un telephone.
    //
    // POURQUOI SE FIER A `src`. Il est normalise ICI, deux lignes avant d'etre
    // utilise, et c'est la valeur normalisee — jamais raw.src — qui choisit la
    // borne ET qui part en stockage : ce qui est range « table » a donc
    // toujours ete borne a 240, ce qui est range « libre » toujours a 90, sans
    // cas intermediaire possible. Les trois chemins d'ecriture le posent
    // (remplacant et aliment+quantite en « table », champ libre en « libre »),
    // et le champ libre porte maxlength="90" cote UI : la saisie manuelle reste
    // bornee par l'ecran avant meme d'arriver ici.
    var src = raw.src === "libre" ? "libre" : "table";
    var max = (src === "libre") ? NUTRI_ITEM_MAX : NUTRI_LIGNE_MAX;
    // Les blancs sont ECRASES, pas seulement remplaces : un retour a la ligne
    // suivi d'un espace donnait « Kebab  poulet », visible a l'ecran.
    var item = String(raw.item == null ? "" : raw.item)
      .replace(/\s+/g, " ")
      .replace(/^ +| +$/g, "")
      .slice(0, max);
    // Le SEUL refus. Ce n'est pas un veto nutritionnel : sans texte, il n'y a
    // rien a enregistrer, et une ligne vide effacerait la proposition d'origine
    // a l'ecran sans rien mettre a la place.
    if (item.length < 2) return null;
    var p = cleanNumber(raw.prot, 0, NUTRI_PROT_MAX, 0);
    var k = cleanNumber(raw.kcal, 0, NUTRI_KCAL_MAX, 0);
    // ESTIMER CE QU'ON SAIT LIRE, ET SEULEMENT CE QU'ON N'A PAS DÉJÀ.
    //
    // C'est le seul endroit où un texte libre devient des nombres : tout le
    // reste du fichier — l'avis, les totaux du jour, le bilan du plan, le frein
    // sur les charges — passe par cleanNutriCorr, et un seul entonnoir garantit
    // qu'ils voient tous la même estimation. La lecture est déterministe (elle
    // ne dépend que du texte), donc une correction relue depuis le stockage
    // retrouve exactement la même valeur : rien ne dérive au rechargement.
    //
    // CE QUE L'UTILISATEUR A DIT GAGNE TOUJOURS. L'ordre de grandeur tapé au
    // pouce n'est pas écrasé — on ne remplit que les champs restés à null. Et
    // quand la lecture échoue, `prot` RESTE null : c'est la valeur qui dit
    // « non chiffré », que nutriTotaux compte comme une inconnue déclarée et
    // jamais comme un zéro. Compter zéro ferait plonger la journée et
    // déclencherait des alertes fabriquées sur du vide.
    if (src === "libre" && (p === null || k === null)) {
      var lu = alimentLireLibre(item);
      if (lu.reconnu) {
        if (p === null) p = cleanNumber(lu.prot, 0, NUTRI_PROT_MAX, 1);
        if (k === null) k = cleanNumber(lu.kcal, 0, NUTRI_KCAL_MAX, 0);
      }
    }
    return {
      item: item,
      note: String(raw.note == null ? "" : raw.note)
        .replace(/\s+/g, " ").replace(/^ +| +$/g, "").slice(0, NUTRI_NOTE_MAX),
      // « table » : compose depuis la table d'aliments, donc chiffre.
      // « libre » : saisi a la main, chiffre seulement si l'utilisateur l'a dit.
      // La MEME variable que celle qui a choisi la borne d'`item` : stocker une
      // valeur et border avec une autre rouvrirait la porte qu'on vient de
      // fermer.
      src: src,
      // null est une VALEUR, pas un oubli : elle dit « non chiffre ». L'avis et
      // les totaux du jour la traitent comme une inconnue declaree, jamais comme
      // un zero — compter 0 g ferait mentir la journee vers le bas.
      prot: p,
      kcal: k,
      le: (typeof raw.le === "string" && DATE_RE.test(raw.le)) ? raw.le : null
    };
  }

  // --- Lecture d'une prise ---------------------------------------------------
  // Valeurs EFFECTIVES d'une ligne : la correction si elle existe, sinon la
  // proposition. Tout le reste du fichier passe par ici, personne ne relit
  // `corr` directement — c'est ce qui garantit que corriger et revenir en
  // arriere n'ont pas deux chemins de calcul differents.
  function nutriEffectif(n) {
    if (!n) return { item: "", note: "", prot: null, kcal: null, corrige: false };
    if (n.corr) {
      return { item: n.corr.item, note: n.corr.note, prot: n.corr.prot,
               kcal: n.corr.kcal, corrige: true };
    }
    return { item: n.item || "", note: n.note || "",
             prot: (typeof n.prot === "number" ? n.prot : null),
             kcal: (typeof n.kcal === "number" ? n.kcal : null),
             corrige: false };
  }

  // --- Totaux du plan --------------------------------------------------------
  // JAMAIS stockes, recalcules a chaque appel — meme regle que les pastilles
  // chiffrees : figes, ils deviendraient faux des le premier changement de poids
  // ou de correction, sans prevenir.
  //
  // `inconnues` compte les lignes non chiffrees. Ce n'est pas un detail
  // d'affichage : une journee qui contient une inconnue ne permet AUCUNE
  // conclusion, et rien en aval n'a le droit de faire comme si elle valait zero.
  function nutriTotaux(list, sauf) {
    var t = { prot: 0, kcal: 0, inconnues: 0, lignes: 0 }, i, e;
    if (!isArray(list)) return t;
    for (i = 0; i < list.length; i++) {
      if (sauf === i) continue;
      e = nutriEffectif(list[i]);
      if (!e.item) continue;
      t.lignes++;
      if (e.prot === null) t.inconnues++; else t.prot += e.prot;
      if (e.kcal !== null) t.kcal += e.kcal;
    }
    return t;
  }

  // --- L'AVIS ----------------------------------------------------------------
  // Compare un remplacement a la proposition qu'il remplace, au niveau de la
  // PRISE puis au niveau de la JOURNEE, et rend le verdict le plus severe des
  // regles qui se declenchent.
  //
  // Les deux niveaux sont necessaires. Perdre 16 g de proteines sur un dejeuner
  // n'a pas le meme sens selon que la journee reste a 128 g pour 130 visees ou
  // qu'elle tombe a 95 : la meme correction merite deux phrases differentes.
  //
  // Rend { niveau, texte, points, absurde, apres } :
  //   niveau  0 ca passe / 1 a savoir / 2 attention
  //   texte   LA phrase a afficher (la plus severe)
  //   points  toutes les remarques, de la plus severe a la moins
  //   absurde true si l'une des conditions « vraiment n'importe quoi » a joue
  //   apres   totaux de la journee APRES le remplacement
  function nutriAvis(list, index, corr, prof) {
    var res = { niveau: AV_OK, texte: "", points: [], absurde: false, apres: null,
                aveu: "" };
    if (!isArray(list) || !list[index]) return res;
    var base = list[index] || {};
    var prot0 = typeof base.prot === "number" ? base.prot : null;
    var kcal0 = typeof base.kcal === "number" ? base.kcal : null;
    var prot1 = corr ? corr.prot : null;
    var kcal1 = corr ? corr.kcal : null;

    // `tete` : à sévérité ÉGALE, cette remarque passe devant les autres.
    // L'écran n'en affichait que les deux premiers points, du temps du tiroir de
  // correction (retire en v1.12.0), et le
    // tri ne regardait que la sévérité : à égalité, c'est l'ordre d'écriture qui
    // décidait, donc les protéines (blocs 2 et 5) passaient toujours devant les
    // calories (bloc 6). Mesure sur 17 614 franchissements du plancher : la
    // phrase « la journée passerait sous 1 600 kcal » tombait au rang 2 ou plus
    // — donc n'était JAMAIS affichée — dans 10 294 cas. Elle était écrite, elle
    // était juste, et personne ne la lisait.
    // `aveu` : cette remarque ne parle pas de la journée, elle parle de ce que
    // l'appli n'a pas su lire. Elle sort donc du classement et prend une place
    // fixe à l'écran — un « je ne sais pas » qui se fait doubler par une
    // remarque sur les calories ne vaut pas mieux qu'un silence.
    function dire(niveau, texte, absurde, tete, aveu) {
      if (aveu) res.aveu = texte;
      else res.points.push({ niveau: niveau, texte: texte, tete: tete ? 1 : 0 });
      if (niveau > res.niveau) res.niveau = niveau;
      if (absurde) res.absurde = true;
    }

    // -- Journee reconstituee : tout le plan SAUF la ligne visee, plus le
    //    remplacement. On ne touche pas au tableau reel, on additionne a cote.
    var reste = nutriTotaux(list, index);
    var apres = {
      prot: reste.prot + (prot1 === null ? 0 : prot1),
      kcal: reste.kcal + (kcal1 === null ? 0 : kcal1),
      inconnues: reste.inconnues + (prot1 === null ? 1 : 0)
    };
    // ... et la meme journee AVANT le remplacement, qui sert de reference : sans
    // elle on impute a la correction un ecart qui existait deja.
    var avant = nutriTotaux(list, -1);
    res.apres = apres;
    res.avant = avant;

    var nt = prof ? nutritionTargets(prof) : null;
    var cible = nt ? nt.prot : null;
    var cibleKcal = nt ? nt.kcal : null;
    // Meme reserve que dans nutriBilanPlan : quand nutritionTargets a DEJA borne
    // la cible au plancher, le plancher n'est plus un garde-fou, c'est la cible
    // elle-meme, et l'ecart d'arrondi d'une correction n'a pas a se voir
    // reprocher de « passer sous 1 600 kcal » a 41 kcal pres.
    var plancher = (nt && nt.floored) ? 0 : ((prof && prof.sex === "f") ? 1400 : 1600);
    // ... ET LA MEME RESERVE VAUT QUAND `floored` EST FAUX. Le drapeau ne dit
    // qu'une chose : la CIBLE a ete relevee au plancher. Il ne dit rien du cas
    // ou la cible passe librement au-dessus mais ou le PLAN ENGENDRE, lui,
    // atterrit a quelques kcal du plancher. L'alerte rouge sortait alors sur des
    // remplacants PROPOSES PAR L'APPLI SUR LE MEME ECRAN.
    //
    // MESURE, 78 902 remplacants maison sur 1 024 profils : 375 declenchements
    // (0,48 %), 50 profils touches, et dans 234 de ces cas la carte affichait AU
    // MEME INSTANT « Le plan couvre la cible en protéines ». Cas type,
    // h/45 kg/2 repas/maintien, creneau « dej » : la prise passe de 29 a 40 g de
    // proteines — elle en GAGNE onze — et de 789 a 762 kcal ; le plan total va
    // de 1 614 a 1 587 pour une cible de 1 600 et `floored` a false. Le plan
    // genere tenait 14 kcal au-dessus du plancher : TOUT echange equivalent le
    // franchit, et l'appli condamnait donc sa propre proposition.
    //
    // La regle du plancher existe pour dire « tu descends trop bas ». Elle n'a
    // rien a dire quand le plan y etait deja. On la neutralise dans ce cas, et
    // la regle en POURCENTAGE prend le relais sans changer de verdict : elle
    // compare au meme repere et parle des le premier ecart reel.
    //
    // ELLE N'EST PAS RENDUE MUETTE LA OU ELLE A RAISON : la garde ne regarde pas
    // le remplacement, elle regarde l'ETAT DU PLAN AVANT. Un plan a 2 350 kcal
    // pour une cible a 2 400 est a 750 kcal du plancher, donc tres au-dela de la
    // marge : une correction qui le fait tomber a 1 550 declenche l'alerte comme
    // avant.
    if (plancher && cibleKcal !== null && avant.kcal > 0 &&
        (avant.kcal - plancher) < cibleKcal * AV_PLANCHER_MARGE_PCT) plancher = 0;

    // === 1. INCOHERENCES DE SAISIE — « vraiment n'importe quoi », version
    //        arithmetique. Ces regles ne parlent pas de dietetique : elles
    //        constatent que deux nombres ne peuvent pas etre vrais ensemble.
    if (prot1 !== null && kcal1 !== null && prot1 * 4 > kcal1 + 60) {
      dire(AV_ALERTE, "Ces deux chiffres ne tiennent pas ensemble : " + frDec(prot1) +
        " g de protéines, c'est déjà " + frNum(prot1 * 4) + " kcal. Vérifie la quantité.", true);
    }
    if (prot1 !== null && prot1 >= 120) {
      dire(AV_ALERTE, "120 g de protéines sur une seule prise, c'est plus qu'une journée entière. " +
        "Vérifie la quantité.", true);
    }
    if (kcal1 !== null && kcal1 >= 1800) {
      dire(AV_ALERTE, "Près de 2 000 kcal sur une seule prise : c'est une journée dans une assiette. " +
        "Vérifie la quantité.", true);
    }

    // === 2. NIVEAU DE LA PRISE — protéines.
    if (prot0 !== null && prot1 !== null) {
      var dP = prot1 - prot0;
      var rP = prot0 > 0 ? (dP / prot0) : 0;
      var perdu = -dP;
      if (perdu >= AV_PROT_ABSURDE_G && prot0 > 0 && rP <= -AV_PROT_ABSURDE_PCT) {
        dire(AV_ALERTE, "Attention : ce remplacement enlève " + frDec(Math.round(perdu * 10) / 10) +
          " g de protéines, soit " + Math.round(-rP * 100) + " % de ce que la prise devait apporter. " +
          "Il en reste " + frDec(prot1) + " g.", true);
      } else if (perdu > AV_PROT_BRUIT_G && rP < -AV_PROT_BRUIT_PCT) {
        dire(rP <= -AV_PROT_GRAVE_PCT ? AV_ALERTE : AV_SAVOIR,
          (rP <= -AV_PROT_GRAVE_PCT ? "Attention : " : "À savoir : ") + "cette prise passe de " +
          frDec(prot0) + " à " + frDec(prot1) + " g de protéines.");
      } else if (dP >= AV_PROT_BRUIT_G && rP > AV_PROT_BRUIT_PCT) {
        dire(AV_OK, "Tu gagnes " + Math.round(dP) + " g de protéines sur cette prise.");
      }
    }

    // === 3. NIVEAU DE LA PRISE — calories, lues DANS LE SENS DE L'OBJECTIF.
    //        Ajouter 250 kcal n'a pas le meme sens en perte et en prise de
    //        masse : c'est le meme chiffre et l'inverse du meme probleme.
    if (kcal0 !== null && kcal1 !== null) {
      var dK = kcal1 - kcal0;
      var rK = kcal0 > 0 ? (dK / kcal0) : 0;
      var gros = Math.abs(dK) > AV_KCAL_BRUIT && Math.abs(rK) > AV_KCAL_BRUIT_PCT;
      if (gros && Math.abs(dK) >= AV_KCAL_NOTABLE) {
        if (dK > 0 && nt && nt.losing) {
          dire(AV_SAVOIR, "À savoir : +" + frNum(dK) + " kcal sur cette prise. " +
            "Répété tous les jours, ça rogne le déficit.");
        } else if (dK < 0 && nt && nt.gaining) {
          dire(AV_SAVOIR, "À savoir : " + frNum(dK) + " kcal sur cette prise. " +
            "En prise de masse, c'est le sens inverse de ce que tu cherches.");
        } else {
          dire(AV_OK, (dK > 0 ? "+" : "") + frNum(dK) + " kcal par rapport à la proposition.");
        }
      }
    }

    // === 3 bis. CE QUI EST ÉCRIT, PAS SEULEMENT CE QUI EST CHIFFRÉ.
    //
    //        LE DÉFAUT QUE CETTE RÈGLE FERME. L'avis ne comparait que deux
    //        nombres — celui de la ligne remplacée et celui du pouce. Le TEXTE
    //        n'était lu par personne, si bien que « une pomme », « un carré de
    //        chocolat », « 3 pizzas » et « un yaourt nature » recevaient le
    //        même « Ça passe » mot pour mot. L'appli affirmait avoir jugé une
    //        saisie qu'elle n'avait pas regardée.
    //
    //        DEUX CHOSES SE DISENT ICI, et une seule à la fois suffit à rendre
    //        l'écran honnête :
    //          - une quantité déraisonnable d'un aliment reconnu est une
    //            ALERTE, marquée `absurde` comme les incohérences de saisie du
    //            bloc 1 : le bouton devient « Enregistrer quand même », ce qui
    //            est exactement le geste voulu — l'appli prévient, elle ne
    //            décide pas de l'assiette ;
    //          - une saisie qu'on ne sait pas lire se DIT, au lieu de passer
    //            pour jugée.
    //
    //        Les quantités absurdes qui se voient au CHIFFRE — 3 pizzas, c'est
    //        2 730 kcal — sont déjà attrapées par le bloc 1, qui parle de kcal
    //        et de grammes sans rien savoir des aliments. Cette règle-ci
    //        attrape celles qui ne se voient qu'au NOM : 500 g de kiwi ne pèsent
    //        que 300 kcal et ne déclenchent aucun seuil arithmétique, alors que
    //        ce sont six kiwis d'affilée.
    var lecture = (corr && corr.src === "libre") ? alimentLireLibre(corr.item) : null;
    if (lecture && lecture.exces) {
      dire(AV_ALERTE, "« " + lecture.exces.al.nom + " » en " + frNum(lecture.exces.g) +
        " g, c'est environ " + Math.round(lecture.exces.fois) +
        " fois une portion courante. Vérifie la quantité.", true);
    }

    // === 4. UNE CORRECTION NON CHIFFREE NE SE JUGE PAS.
    //        « Je ne sais pas » n'est pas « c'est insuffisant ». Compter la
    //        ligne pour zero ferait plonger la journee et declencherait des
    //        alertes fabriquees de toutes pieces. On le dit, et on s'arrete la
    //        pour tout ce qui touche a la journee.
    //
    //        LA PHRASE DIT MAINTENANT LA CONSÉQUENCE. « Impossible de comparer »
    //        décrivait l'embarras de l'appli ; ce qui intéresse celui qui tape,
    //        c'est que sa prise ne comptera pas dans le bilan du jour. C'est la
    //        seule sortie honnête quand on n'a rien reconnu — se taire est
    //        acceptable, approuver ne l'est pas.
    var chiffre = (prot1 !== null);
    if (!chiffre) {
      dire(AV_SAVOIR, "Je ne sais pas estimer ça : cette prise ne sera pas comptée " +
        "dans ton bilan du jour" +
        (cible !== null ? " (" + cible + " g de protéines visés)." : "."),
        false, false, true);
    } else if (lecture && !lecture.reconnu) {
      // UN ORDRE DE GRANDEUR NE VAUT PAS UNE LECTURE, et c'est le dernier trou
      // par lequel « Ça passe » revenait. Mesure sur le chemin exact du relevé —
      // ligne du petit-déjeuner, ordre « Moyen · ~25 g » — après la première
      // écriture de ce correctif : « azertyuiop » ressortait VERT, avec « l'écart
      // avec la proposition reste dans le bruit de l'estimation ». L'appli
      // comparait deux nombres de protéines, ce qui est vrai, et le présentait
      // comme un jugement sur la prise, ce qui ne l'est pas : elle n'avait
      // toujours pas lu les mots.
      //
      // On garde le chiffre de l'utilisateur — c'est le sien, il sait ce qu'il a
      // mangé — et on dit exactement ce qu'on ignore. Les calories, elles,
      // restent hors du bilan : `kcal` est resté null, et l'écran doit le dire
      // plutôt que de laisser croire à un total complet.
      dire(AV_SAVOIR, "Je ne sais pas lire cette prise : je m'en tiens aux " +
        frDec(prot1) + " g que tu as indiqués, et ses calories ne comptent pas dans le bilan.",
        false, false, true);
    }

    // === 5. NIVEAU DE LA JOURNEE — proteines. C'est le juge de paix : une prise
    //        allegee ne coute rien si le reste de la journee couvre la cible.
    //        Et la regle ne parle QUE si le remplacement DEGRADE la journee.
    if (chiffre && cible !== null && apres.inconnues === 0) {
      var nvAv = avJourProt(avant.prot, cible);
      var nvAp = avJourProt(apres.prot, cible);
      var manque = cible - apres.prot;
      if (nvAp > nvAv) {
        if (manque >= AV_JOUR_PROT_GRAVE) {
          dire(AV_ALERTE, "Attention : la journée descendrait à " + Math.round(apres.prot) +
            " g de protéines pour " + cible + " g visés. C'est le genre d'écart qui bloque la progression.", true);
        } else if (nvAp === AV_ALERTE) {
          dire(AV_ALERTE, "Attention : la journée tombe à " + Math.round(apres.prot) +
            " g de protéines pour " + cible + " g visés.");
        } else {
          dire(AV_SAVOIR, "À savoir : la journée passe à " + Math.round(apres.prot) +
            " g de protéines, un peu sous les " + cible + " g visés.");
        }
      }
      // Plafond haut. Jamais une alerte : trop de proteines chez quelqu'un en
      // bonne sante, c'est de l'argent perdu, pas un danger. On le dit une fois,
      // sans dramatiser, et seulement si c'est CE remplacement qui fait passer
      // la barre.
      var poids = prof ? prof.startWeight : 0;
      var plafond = AV_PROT_PLAFOND_GKG * poids;
      if (poids > 0 && apres.prot > plafond && avant.prot <= plafond) {
        dire(AV_SAVOIR, "À savoir : au-delà de 2,2 g de protéines par kilo, rien ne montre " +
          "que le muscle en profite davantage.");
      }
    }

    // === 6. NIVEAU DE LA JOURNEE — calories. Meme regle de degradation...
    //        ... SAUF POUR LE PLANCHER ABSOLU, qui est un FAIT et non un cran
    //        sur une echelle.
    //
    //        CE QUE LA REGLE DE DEGRADATION NE POUVAIT PAS DIRE. Elle compare
    //        deux NIVEAUX. Quand la journee est deja a -21 % de sa cible, elle
    //        vaut deja ALERTE ; le remplacement la fait tomber sous 1 600 kcal,
    //        elle vaut toujours ALERTE, et `kAp > kAv` est faux. Le fait le plus
    //        grave que l'appli connaisse ne sortait donc pas.
    //
    //        MESURE, 196 608 combinaisons (6 144 profils x chaque ligne du plan
    //        x 8 remplacants) : 18 160 franchissent le plancher, 546 le font en
    //        silence. Cas type, h/90 kg, 2 repas, cible 3 460 : plan a 2 721
    //        kcal, on remplace le diner par une pomme, la journee tombe a 1 304
    //        et rien ne parle de calories.
    //
    //        LES DEUX FAITS TIENNENT DANS UNE PHRASE. C'est un `else if` : le
    //        bloc 6 n'ecrit jamais plus d'une remarque, donc une journee deja
    //        signalee ne recoit pas un second bandeau rouge — et elle ne tait
    //        plus un fait plus grave que celui qu'elle annonce.
    if (kcal1 !== null && cibleKcal !== null) {
      var kAv = avJourKcal(avant.kcal, cibleKcal, plancher);
      var kAp = avJourKcal(apres.kcal, cibleKcal, plancher);
      // Le remplacement FAIT FRANCHIR le plancher : la journee etait au-dessus,
      // elle passe dessous. C'est bien CE remplacement qu'on impute, jamais un
      // plan qui y etait deja — la garde de marge plus haut s'en occupe.
      var franchit = plancher > 0 && avant.kcal >= plancher && apres.kcal < plancher;
      if (kAp > kAv) {
        var ecart = apres.kcal - cibleKcal;
        var rJ = ecart / cibleKcal;
        if (apres.kcal < plancher) {
          dire(AV_ALERTE, "Attention : la journée passerait sous " + frNum(plancher) +
            " kcal. En dessous, la fatigue arrive avant les résultats.", true, true);
        } else if (kAp === AV_ALERTE) {
          dire(AV_ALERTE, "Attention : la journée passe à " + frNum(apres.kcal) + " kcal pour " +
            frNum(cibleKcal) + " visées, soit " + Math.round(Math.abs(rJ) * 100) + " % " +
            (ecart > 0 ? "au-dessus" : "en dessous") + ".");
        } else {
          dire(AV_SAVOIR, "À savoir : la journée passe à " + frNum(apres.kcal) + " kcal pour " +
            frNum(cibleKcal) + " visées.");
        }
      } else if (franchit) {
        // LES DEUX FAITS, EN UNE PHRASE. La journée était déjà signalée — sinon
        // `kAp > kAv` aurait joué — et elle franchit maintenant le plancher.
        // Empiler un second rouge ferait deux fois le même écran ; se taire
        // laisserait passer le plus grave des deux.
        //
        // Le SENS de l'écart d'avant est CALCULÉ, pas supposé. Les 546 cas
        // mesurés sont tous « en dessous » ; l'écrire en dur mentirait le jour
        // où l'autre sens apparaît, et une branche pour un cas qui ne se produit
        // jamais serait du code mort qu'aucun banc ne pourrait tenir.
        var rAv = (avant.kcal - cibleKcal) / cibleKcal;
        dire(AV_ALERTE, "Attention : la journée était déjà " +
          Math.round(Math.abs(rAv) * 100) + " % " +
          (rAv > 0 ? "au-dessus" : "en dessous") + " des " + frNum(cibleKcal) +
          " kcal visées, et ce remplacement la ferait passer sous " +
          frNum(plancher) + " kcal. En dessous, la fatigue arrive avant les résultats.",
          true, true);
      }
    }

    // La phrase affichee est la PLUS SEVERE. Les autres restent disponibles dans
    // `points` pour l'ecran de detail : afficher cinq remarques d'un coup sur un
    // telephone, c'est n'en faire lire aucune.
    res.points.sort(function (a, b) { return (b.niveau - a.niveau) || (b.tete - a.tete); });
    // Le repli « Ça passe » ne sort que si l'appli a VRAIMENT lu la prise. Quand
    // l'aveu est la seule chose à dire, c'est lui la phrase principale : dire
    // « ça passe » d'une saisie qu'on n'a pas su lire est l'affirmation que ce
    // module s'interdit.
    res.texte = res.points.length
      ? res.points[0].texte
      : (res.aveu || "Ça passe : l'écart avec la proposition reste dans le bruit de l'estimation.");
    return res;
  }

  // --- Bilan du plan, pour le reste de l'appli --------------------------------
  // C'est le point d'accroche du frein sur les charges (brique 5) et de la carte
  // nutrition. On ne conclut RIEN tant qu'une ligne n'est pas chiffree : « je ne
  // sais pas » n'est pas « c'est insuffisant ».
  // LES CALORIES SE DISENT AUSSI. Le premier jet calculait cibleKcal et ne s'en
  // servait jamais : sur 33 600 profils, AUCUN bilan ne mentionnait les
  // calories. Un plan pouvait donc annoncer « couvre la cible en protéines » en
  // depassant son repere calorique de 14 % — 3 263 kcal proposees pour 2 850
  // affichees juste au-dessus, sur le meme ecran. Le plafond proteique que
  // l'appli documente elle-meme (AV_PROT_PLAFOND_GKG) n'etait pas teste non plus
  // sur le total du plan, alors qu'il l'est sur chaque correction.
  //
  // Meme discipline que nutriAvis : on collecte des remarques, on garde la PLUS
  // SEVERE pour la phrase affichee, et les autres restent dans `points` pour qui
  // veut le detail. Afficher trois phrases d'un coup sur un telephone, c'est
  // n'en faire lire aucune.
  // `liste` est le plan REELLEMENT AFFICHE — celui de la journee ouverte, dont
  // la composition varie avec la date. Sans lui, le bilan totaliserait la
  // proposition stockee pendant que l'ecran montre autre chose, et les deux
  // chiffres se contrediraient a dix lignes d'ecart. Absent, on retombe sur le
  // plan stocke : les appelants qui n'ont pas de journee sous la main — le pont
  // IA, un banc — gardent le comportement d'avant.
  function nutriBilanPlan(prof, liste) {
    var out = { prot: 0, kcal: 0, cible: null, cibleKcal: null,
                manqueProt: 0, inconnues: 0, corrigees: 0, niveau: AV_OK, texte: "",
                points: [], niveauKcal: AV_OK, plafondProt: false };
    if (!prof) return out;
    // LA LISTE PEUT VENIR D'AILLEURS QUE DU PROFIL, et c'est tout l'interet de
    // ce parametre depuis la v1.14.0 : le plan ecrit par une IA est juge AVANT
    // d'etre accepte, donc avant d'exister dans le profil. Exiger
    // prof.nutriPlan rendait un bilan vide — un validateur muet, qui a l'air
    // d'approuver.
    var plan = isArray(liste) && liste.length
                 ? liste
                 : (isArray(prof.nutriPlan) ? prof.nutriPlan : null);
    if (!plan) return out;
    var t = nutriTotaux(plan, -1), i;
    out.prot = t.prot; out.kcal = t.kcal; out.inconnues = t.inconnues;
    for (i = 0; i < plan.length; i++) {
      if (plan[i] && plan[i].corr) out.corrigees++;
    }
    var nt = nutritionTargets(prof);
    out.cible = nt.prot; out.cibleKcal = nt.kcal;
    if (out.inconnues > 0) {
      out.texte = "Plan partiellement chiffré : " + out.inconnues + " prise" +
                  (out.inconnues > 1 ? "s" : "") + " sans estimation.";
      return out;                       // niveau reste AV_OK : on ne conclut pas
    }

    function dire(niveau, texte) {
      out.points.push({ niveau: niveau, texte: texte });
      if (niveau > out.niveau) out.niveau = niveau;
    }

    // --- Proteines du plan ---------------------------------------------------
    out.manqueProt = out.cible - out.prot;
    if (out.manqueProt >= AV_JOUR_PROT_ALERTE) {
      dire(AV_ALERTE, "Le plan apporte " + Math.round(out.prot) + " g de protéines pour " +
                      out.cible + " g visés.");
    } else if (out.manqueProt >= AV_JOUR_PROT_SAVOIR) {
      dire(AV_SAVOIR, "Le plan est un peu court en protéines : " + Math.round(out.prot) +
                      " g pour " + out.cible + " g visés.");
    }

    // --- Plafond proteique, sur le TOTAL du plan -----------------------------
    // Jamais une alerte : trop de proteines chez quelqu'un en bonne sante, c'est
    // de l'argent perdu, pas un danger. Meme phrase et meme niveau que la regle
    // jumelle de nutriAvis, pour que les deux ecrans ne se contredisent pas.
    var poids = prof.startWeight, plaf = AV_PROT_PLAFOND_GKG * poids;
    if (poids > 0 && out.prot > plaf) {
      out.plafondProt = true;
      dire(AV_SAVOIR, "Le plan propose " + Math.round(out.prot) + " g de protéines, soit plus de " +
                      "2,2 g par kilo. Au-delà, rien ne montre que le muscle en profite davantage.");
    }

    // --- Calories du plan ----------------------------------------------------
    // Le plancher est celui de nutriAvis, a l'identique : en dessous, la fatigue
    // arrive avant les resultats, et ca vaut pour un plan comme pour une
    // correction.
    //
    // SAUF QUAND LA CIBLE EST DEJA LE PLANCHER. nutritionTargets borne la cible
    // a ce meme plancher (`floored`) : comparer ensuite le total du plan au
    // plancher, c'est le comparer a sa propre cible avec un operateur strict.
    // Mesure : 41 kcal d'ecart d'arrondi suffisaient a declencher une ALERTE
    // rouge, et la severite dependait du poids de l'utilisateur au lieu de la
    // qualite du plan — deux profils avec la MEME erreur relative de -4 %
    // recevaient l'un une alerte, l'autre « le plan couvre la cible ». L'appli
    // accusait le plan qu'elle venait d'ecrire. Quand la cible EST le plancher,
    // seule la regle en POURCENTAGE parle, et elle dit la meme chose sans le
    // dramatiser.
    var plancher = nt.floored ? 0 : ((prof.sex === "f") ? 1400 : 1600);
    out.niveauKcal = avJourKcal(out.kcal, out.cibleKcal, plancher);
    if (out.niveauKcal > AV_OK && out.kcal > 0) {
      var ecart = out.kcal - out.cibleKcal;
      var pct = Math.round(Math.abs(ecart) / out.cibleKcal * 100);
      if (out.kcal < plancher) {
        dire(AV_ALERTE, "Le plan totalise " + frNum(out.kcal) + " kcal, sous le plancher de " +
                        frNum(plancher) + " kcal. En dessous, la fatigue arrive avant les résultats.");
      } else {
        dire(out.niveauKcal, "Le plan totalise " + frNum(out.kcal) + " kcal pour " +
                             frNum(out.cibleKcal) + " visées, soit " + pct + " % " +
                             (ecart > 0 ? "au-dessus" : "en dessous") + ".");
      }
    }

    if (!out.points.length) {
      out.texte = "Le plan couvre la cible en protéines.";
      return out;
    }
    out.points.sort(function (a, b) { return b.niveau - a.niveau; });
    out.texte = out.points[0].texte;
    return out;
  }

  // --- Ecriture --------------------------------------------------------------
  // Un seul chemin d'ecriture, un seul chemin de retour arriere. La correction
  // repasse par cleanNutriCorr avant d'entrer en memoire : ce que l'ecran montre
  // apres correction est donc EXACTEMENT ce que le rechargement rendra.
  // Rend null quand il n'y a rien a enregistrer, sinon { corr, ecrit }.
  //
  // `ecrit` n'est PAS un detail : quand localStorage refuse — mode prive iOS,
  // quota plein —, la correction vit en memoire et s'affiche, mais elle sera
  // perdue au rechargement. L'appli disait « c'est note » dans les deux cas.
  // Elle ne peut pas le savoir sans que persistSettings le lui dise, d'ou le
  // booleen remonte jusqu'ici puis jusqu'a la phrase affichee.
  function nutriCorriger(index, brut) {
    if (!profile || !isArray(profile.nutriPlan)) return null;
    var n = profile.nutriPlan[index];
    if (!n) return null;
    // UNE LIGNE DE COMPLEMENT NE SE CORRIGE PAS, et la regle vit ICI parce que
    // c'est ici qu'on ECRIT. Elle n'existait que dans le gabarit d'affichage :
    // nutriLigneHtml pose data-action="supp-fiche" au lieu du crayon quand
    // `n.supp` existe — verifie, il le fait —, mais nutriCorriger ne testait
    // jamais `n.supp`. Une protection qui ne vit que dans un gabarit protege
    // l'ecran, pas les donnees.
    //
    // MESURE avant ce refus, sur un plan h/82 kg/3 repas dont l'index 1 est la
    // creatine : nutriCorriger(1, { item: "3 portions de kebab (900 g)",
    // prot: 120, kcal: 2400 }) ECRIVAIT une `corr` sur la ligne « screatine ».
    // Elle survivait a cleanProfile, partait dans l'export JSON, nutriEffectif
    // la faisait passer DEVANT la posologie a l'ecran, et ses 120 g comptaient
    // dans le total qui alimente le frein sur les charges.
    //
    // Les deux chemins d'arrivee ne passent pas par le crayon, et c'est bien le
    // probleme : un stockage edite a la main, et le report de
    // nutriReporterCorrections sur une cle « s<id> » identique d'un plan a
    // l'autre. Aucun des deux ne regarde un gabarit.
    if (n.supp) return null;
    var corr = cleanNutriCorr(brut);
    if (!corr) return null;             // rien a enregistrer : on ne touche a rien
    if (!corr.le) corr.le = todayKey();
    n.corr = corr;
    // On garde la correction en memoire meme si l'ecriture echoue : elle est
    // juste a l'ecran, et la retirer ferait perdre a l'utilisateur une saisie
    // qu'il vient de faire. On le PREVIENT, on ne le corrige pas.
    var ecrit = persistSettings();
    applyProfile();
    return { corr: corr, ecrit: ecrit };
  }

  function nutriRetablir(index) {
    if (!profile || !isArray(profile.nutriPlan)) return false;
    var n = profile.nutriPlan[index];
    if (!n || !n.corr) return false;
    delete n.corr;
    persistSettings();
    applyProfile();
    return true;
  }

  function nutriToutRetablir() {
    if (!profile || !isArray(profile.nutriPlan)) return 0;
    var i, k = 0;
    for (i = 0; i < profile.nutriPlan.length; i++) {
      if (profile.nutriPlan[i] && profile.nutriPlan[i].corr) { delete profile.nutriPlan[i].corr; k++; }
    }
    if (k) { persistSettings(); applyProfile(); }
    return k;
  }

  // --- Report des corrections apres un rediagnostic ---------------------------
  // Un rediagnostic reconstruit nutriPlan de zero. Sans ce report, il effacerait
  // en silence tout ce que l'utilisateur a corrige — et ses corrections sont
  // justement ce qu'il y a de plus durable dans son plan : ce sont ses
  // habitudes, pas une sortie de generateur.
  //
  // L'appariement se fait par `key`, l'identite STABLE de la prise
  // (« petitdej », « dejeuner », « collation », « diner »...), jamais par la
  // position : le nombre de prises change avec le nombre de repas declares.
  //
  // IL FAUT AUSSI COMPTER CE QU'ON N'A PAS PU REPORTER. Un rediagnostic qui
  // passe de quatre repas a deux SUPPRIME des creneaux : les corrections qui y
  // vivaient n'ont plus de ligne d'accueil et disparaissent. Le comportement est
  // defendable — on ne va pas raccrocher « ce que je prends au gouter » a un
  // diner —, son SILENCE ne l'est pas : l'ecran promettait « ton historique est
  // intact » pendant que le travail de l'utilisateur partait. On rend donc le
  // compte, et l'appelant le dit.
  //
  // Rend { plan, reportees, perdues }. `plan` reste le tableau NOUVEAU, modifie
  // en place comme avant : les appelants qui n'ont besoin que de lui n'ont
  // qu'une propriete a lire.
  function nutriReporterCorrections(ancien, nouveau) {
    var res = { plan: nouveau, reportees: 0, perdues: 0 };
    if (!isArray(ancien) || !isArray(nouveau)) return res;
    var i, j, a, corr, place;
    for (i = 0; i < ancien.length; i++) {
      a = ancien[i];
      // Pas de correction sur cette ligne : il n'y a rien a reporter et rien a
      // compter. C'est le seul cas ou passer son tour est neutre.
      if (!a || !a.corr) continue;
      // UNE CORRECTION SANS `key` EST UNE CORRECTION PERDUE, et elle doit se
      // compter comme telle. Le `continue` couvrait les deux cas d'un coup et
      // sautait AVANT le compteur : la correction disparaissait sans etre
      // reportee, sans etre comptee, donc sans etre annoncee. Mesure sur un
      // profil migre depuis la v1.4.1, dont 100 % des lignes ont key === "" :
      // deux corrections en entree, « reportees = 0, perdues = 0 » en sortie,
      // et l'ecran promettait donc que rien n'avait ete perdu.
      //
      // Un compteur qui ne compte pas est un mensonge, pas une optimisation :
      // c'est lui qui alimente la phrase montree a l'utilisateur apres un
      // rediagnostic. Se taire ici, c'est lui affirmer que son travail est
      // intact au moment precis ou on vient de le jeter.
      if (!a.key) { res.perdues++; continue; }
      place = false;
      for (j = 0; j < nouveau.length; j++) {
        if (nouveau[j] && nouveau[j].key === a.key && !nouveau[j].corr) {
          corr = cleanNutriCorr(a.corr);
          if (corr) { nouveau[j].corr = corr; place = true; }
          break;
        }
      }
      if (place) res.reportees++; else res.perdues++;
    }
    return res;
  }


  // ===========================================================================
  // UN PLAN ANTERIEUR A LA v1.5.0, RECOMPOSE A LA LECTURE
  // ---------------------------------------------------------------------------
  // CE QUE CE BLOC REPARE. La v1.5.0 est une refonte de la nutrition : des
  // QUANTITES d'aliments, un editeur de correction, un avis, des fiches de
  // complements. Rien de tout cela n'atteignait quelqu'un qui montait depuis la
  // v1.4.1, et le constat a ete refait a la main sur le livrable :
  //
  //   - buildNutrition() n'est appele QU'A UN SEUL endroit, obFinish(). Le seul
  //     moyen d'obtenir la refonte etait donc de relancer « ↻ Refaire le
  //     diagnostic », et RIEN A L'ECRAN ne le disait ;
  //   - la carte affichait le texte de la v1.4.1 (« Déjeuner : protéine +
  //     légumes + féculent ») et, sous la liste, « Plan partiellement chiffré :
  //     6 prises sans estimation. » Total du plan : 0 g de proteines pour 135
  //     visees, parce qu'aucune ligne de la v1.4.1 ne porte le champ `prot` ;
  //   - les lignes de complement ayant perdu leur champ `supp`, elles recevaient
  //     le CRAYON de correction au lieu du bouton de fiche ;
  //   - et le fournisseur de remplacants du tiroir, ne trouvant aucune `key`,
  //     retombait sur le creneau
  //     « dej » : la ligne « Créatine 3-5 g » se voyait proposer « 1 filet de
  //     poulet + épinards + semoule ».
  //
  // LA SIGNATURE, ET POURQUOI ELLE EST SURE. On recompose quand le plan existe
  // mais qu'AUCUNE de ses lignes ne porte de `key`. Ce n'est pas une heuristique,
  // c'est une propriete mesuree des deux generateurs : sur 2 688 plans NATIFS
  // v1.5.0 couvrant tous les profils possibles (2 sexes, 7 poids, 2 a 5 repas,
  // avec et sans petit-dejeuner, avec et sans collation, cuisine ou non, 0 a 5
  // complements), soit 17 472 lignes, ZERO ligne native est sans `key` — chaque
  // repas porte sa cle de creneau, chaque complement porte « s » + son
  // identifiant. Et sur 192 plans v1.4.1, AUCUN ne porte de `key`, le champ
  // n'existant pas dans cette version. Les deux ensembles sont donc disjoints,
  // et le test ne peut ni rater un plan ancien ni toucher un plan neuf.
  //
  // ELLE EST AUSSI IDEMPOTENTE, sans avoir besoin d'un drapeau pour ca : le plan
  // recompose porte des `key` partout, donc il ne repond plus a la signature. La
  // migration ne peut pas se rejouer au chargement suivant.
  function nutriPlanAnterieur(plan) {
    if (!isArray(plan) || !plan.length) return false;
    var i;
    for (i = 0; i < plan.length; i++) {
      if (plan[i] && plan[i].key) return false;
    }
    return true;
  }

  // LE SECOND DETECTEUR, ET SANS LUI PERSONNE NE RECEVRAIT LE PLAN REDUIT.
  //
  // nutriPlanAnterieur ci-dessus reconnait un plan ANCIEN a un seul signe :
  // aucune de ses lignes ne porte de `key`. C'etait vrai des plans v1.4.1. Ca ne
  // l'est plus d'AUCUN plan produit depuis la v1.5.0 — mesure sur les plans
  // natifs : 17 472 lignes, ZERO sans `key`. Ce detecteur est donc
  // structurellement aveugle a tout ce que l'appli a genere pendant huit
  // versions, et il ne pouvait pas voir qu'un plan de repas doit maintenant
  // etre remplace.
  //
  // LA PROPRIETE CHOISIE EST DISJOINTE DE LA PREMIERE, a dessein : « ce plan
  // contient au moins une ligne qui n'est PAS un complement ». Elle est vraie de
  // 100 % des plans d'avant la v1.13.0 — ils portent tous des repas — et fausse
  // de 100 % des plans produits apres, qui n'ont que des complements. Elle est
  // donc IDEMPOTENTE : une fois la migration faite, elle ne se redeclenche
  // jamais, sans avoir besoin d'un drapeau de plus dans le profil.
  function nutriPlanReduitAMigrer(plan) {
    if (!isArray(plan) || !plan.length) return false;
    var i;
    for (i = 0; i < plan.length; i++) {
      if (plan[i] && !plan[i].supp) return true;
    }
    return false;
  }

  // --- La recomposition -------------------------------------------------------
  // POURQUOI nutriPlanLe EST LA PIECE MAITRESSE, et non un detail d'ecriture.
  // Les cases cochees du journal sont indexees par POSITION (entry.nutri =
  // { "0": true, "3": true }). Recomposer le plan decale ces positions : les
  // journees anterieures parleraient d'autres lignes que celles qu'on avait
  // montrees a l'utilisateur.
  //
  // C'est EXACTEMENT ce que nutriPlanLe existe pour dire, et le mecanisme est
  // deja en place et deja teste — nutriBilan ecarte les journees anterieures a
  // cette date au lieu de les mal lire, et render() les etiquette « Ce jour-là,
  // ton plan n'était pas celui-ci. Tu y avais coché N prises. » On ne cree donc
  // aucun mecanisme ici : on branche un cas sur celui qui existe, celui-la meme
  // qu'un rediagnostic emprunte depuis toujours.
  //
  // L'HISTORIQUE N'EST PAS PERDU, IL EST CORRECTEMENT DATE. Rien ici ne touche
  // au journal : il vit dans un AUTRE magasin (STORAGE_KEY, via cleanLog), que
  // cleanProfile ne lit ni n'ecrit. Les seances, les charges, les poids et les
  // cases cochees restent intacts, au caractere pres.
  //
  // IL FAUT ECRIRE LA MIGRATION SUR LE DISQUE, ET LE DEFAUT EST INSTRUCTIF.
  // cleanProfile ne fait que RENDRE un profil ; il n'ecrit rien, et c'est bien
  // ainsi. Sans ce drapeau, la migration ne vivait donc qu'en memoire : mesure
  // au banc, le deuxieme lancement relisait le plan v1.4.1 encore en stockage et
  // le migrait A NOUVEAU, avec la date du jour. `nutriPlanLe` avancait d'un jour
  // a CHAQUE ouverture — donc chaque journee, une fois passee, devenait « un
  // autre plan », le frein n'accumulait jamais la moindre journee lisible, et
  // l'historique de nutrition reculait indefiniment devant l'utilisateur.
  //
  // Le drapeau dit « quelque chose a change en memoire et n'est pas encore sur
  // le disque ». Il est leve ici et consomme par loadSettings, A LA FIN de son
  // travail : ecrire plus tot ecraserait les reglages que loadSettings n'a pas
  // encore lus — la cle d'API vit dans le meme blob et serait effacee.
  var nutriMigreAEcrire = false;

  // Rend { fait, reportees, perdues }. `fait` est faux quand il n'y avait rien a
  // migrer OU quand la recomposition n'a pas abouti — auquel cas on ne touche a
  // RIEN et l'utilisateur retrouve exactement l'ecran d'avant.
  function nutriMigrerPlan(p) {
    var res = { fait: false, reportees: 0, perdues: 0, cause: "" };
    if (!p) return res;

    // ⚠️ DEUX CAUSES, UN SEUL MECANISME — ET LA SECONDE N'ETAIT APPELEE PAR
    // PERSONNE JUSQU'ICI.
    //
    // nutriPlanReduitAMigrer a ete ecrit en v1.13.0, teste idempotent, et inscrit
    // dans la liste des survivants de la chaine. Il ne figurait qu'UNE fois dans
    // tout le livrable : sa propre definition. La reduction — trois versions de
    // travail — n'atteignait donc aucun telephone deja installe.
    //
    // MESURE sur le profil reel, plan produit par la v1.10.0, relu par la
    // v1.14.0 : 8 lignes dont 5 de REPAS, zero ligne sans `key`. Le premier
    // detecteur repond FAUX (il ne reconnait qu'un plan v1.4.1), le second repond
    // VRAI, et personne ne l'ecoutait. « Sandwich complet : 2 tranches de pain
    // complet (80 g) + 2 oeufs (110 g) + 1 tasse de cafe » restait a l'ecran.
    //
    // ⚠️ ET LE GARDE-FOU `!p.nutriPlanIA` N'EST PAS UNE PRECAUTION : un plan ecrit
    // par une IA porte des lignes de repas, donc le second detecteur repond VRAI
    // sur lui. Sans cette condition, le plan que l'utilisateur vient d'enregistrer
    // serait ECRASE par le plan de complements au lancement suivant, en silence.
    // C'est pourquoi le cablage du detecteur et le droit d'ecrire vivent dans la
    // meme version : separes, le premier detruit le second.
    var cause = "";
    if (nutriPlanAnterieur(p.nutriPlan)) cause = "v141";
    else if (!p.nutriPlanIA && nutriPlanReduitAMigrer(p.nutriPlan)) cause = "reduction";
    if (!cause) return res;
    // LE FILET. C'est le PREMIER lancement de la nouvelle version sur le
    // telephone de quelqu'un qui a ses vraies donnees dedans. buildNutrition
    // traverse la table d'aliments, le generateur de repas et les cibles ; un
    // profil ancien peut porter un champ dans un etat qu'on n'a pas prevu. Une
    // exception ici partirait de cleanProfile, donc de loadSettings, donc de
    // l'amorcage : ecran blanc, appli morte, donnees inaccessibles. On degrade
    // vers le plan d'avant, qui s'affichait deja correctement.
    var neuf = null;
    try { neuf = buildNutrition(p); } catch (e) { neuf = null; }
    // ⚠️ UN PLAN VIDE N'EST PLUS UN ECHEC, ET LE REFUS D'AVANT OUVRAIT UN TROU.
    //
    // La garde testait `!neuf.length` : elle refusait de migrer vers un plan sans
    // aucune ligne. C'etait juste jusqu'a la v1.12.0, ou un plan vide ne pouvait
    // venir que d'une construction ratee. Depuis la reduction, un plan vide est le
    // plan LEGITIME de qui ne coche aucun complement — cleanProfile le dit
    // explicitement, et `null` reste seul a signifier « jamais genere ».
    //
    // Consequence du refus : quelqu'un qui a un plan de repas et aucun complement
    // aurait garde ses assiettes pour toujours. Le detecteur aurait repondu vrai,
    // et cette ligne l'aurait renvoye. On ne garde donc que la protection qui
    // compte, celle contre l'exception et contre un retour d'un autre type.
    if (!isArray(neuf)) return res;
    // On passe quand meme par le report : un plan v1.4.1 ne porte aucune
    // correction — le champ n'existait pas —, donc il n'y a normalement rien a
    // reporter. Mais c'est le mecanisme qui SAIT compter ce qui ne peut pas
    // etre replace, et se passer de lui reviendrait a jeter en silence les
    // corrections d'un stockage bricole a la main. Le compte remonte jusqu'a la
    // carte.
    var rep = nutriReporterCorrections(p.nutriPlan, neuf);
    p.nutriPlan = rep.plan;
    // Les deux dates sont posees ENSEMBLE et ne peuvent pas diverger : la
    // premiere dit au reste de l'appli a partir de quand les cases se lisent, la
    // seconde dit a l'utilisateur qu'il s'est passe quelque chose.
    p.nutriPlanLe = todayKey();
    p.nutriMigreLe = todayKey();
    // La cause part avec les dates, et pour la meme raison : elle choisit le texte
    // affiche, et un texte qui se trompe de cause est pire qu'un silence.
    p.nutriMigreCause = cause;
    res.fait = true;
    res.cause = cause;
    res.reportees = rep.reportees;
    res.perdues = rep.perdues;
    nutriMigreAEcrire = true;
    return res;
  }

  // --- ET IL DOIT LE SAVOIR ---------------------------------------------------
  // Un plan nutrition qui change tout seul, sans un mot, est inquietant : la
  // premiere lecture possible est « l'appli a perdu mes donnees ». La carte dit
  // donc TROIS choses, dans cet ordre : ce qui a change, ce qu'il y gagne, et ce
  // qui n'a pas bouge. La troisieme est la plus importante des trois.
  //
  // Elle reste affichee tant qu'il ne l'a pas fermee — pas « jusqu'au prochain
  // rendu ». Un message qui disparait tout seul n'a pas ete lu, il a ete rate.
  function nutriMigreHtml() {
    if (!profile || !profile.nutriMigreLe) return "";
    // DEUX CAUSES, DEUX PREMIERES PHRASES, ET UNE SEULE FIN. Ce qui differe est
    // CE QUI A ETE RETIRE ; ce qui ne differe pas — et qui est le plus important
    // des trois paragraphes — est ce qui N'A PAS BOUGE.
    var quoi = profile.nutriMigreCause === "v141"
      ? 'Ton plan datait d\'une version ancienne de l\'appli. Il a été refait avec ' +
        'ce qu\'elle sait faire aujourd\'hui.'
      : 'Ton plan ne contient plus de repas : il porte désormais tes compléments ' +
        'et tes deux cibles chiffrées.';
    return '<div class="nutri-migre">' +
      '<div class="nutri-migre-t">Ton plan nutrition a été refait</div>' +
      '<div class="nutri-migre-c">' + quoi + '</div>' +
      '<div class="nutri-migre-c">' +
        'Ce qui reste est ce qu\'elle sait faire sans rien inventer : <b>quand et ' +
        'comment prendre tes compléments</b>, et <b>tes deux cibles chiffrées</b>. ' +
        'Pour un vrai plan alimentaire, ouvre <b>Plan alimentaire par une IA</b> ' +
        'juste en dessous : l\'appli prépare la demande, relit la réponse, écarte ' +
        'les portions aberrantes, et enregistre le plan s\'il tient debout.' +
      '</div>' +
      '<div class="nutri-migre-c">' +
        '<b>Tes séances, tes charges et tes pesées ne sont pas touchées.</b> ' +
        'Seules les cases de nutrition cochées <i>avant aujourd\'hui</i> ne se ' +
        'lisent plus en face de ce plan : elles désignaient les lignes de ' +
        'l\'ancien. Elles sont conservées, et les journées concernées le disent.' +
      '</div>' +
      '<div class="nutri-migre-actions">' +
        '<button type="button" class="btn-ghost" data-action="nutri-migre-vu">J\'ai compris</button>' +
      '</div></div>';
  }


  // ===========================================================================
  // L'EDITEUR DE CORRECTION
  // ---------------------------------------------------------------------------
  // Depliage SOUS la ligne, une seule ouverte a la fois — meme regle que les
  // fiches d'exercice (state.openExo) : sur un telephone, trois editeurs
  // deplies rendent la carte illisible.
  //
  // Trois chemins, ranges du moins couteux au plus couteux EN FRAPPE :
  //   1. Un remplacant tout fait      1 tape   (le cas courant)
  //   2. Un aliment + une quantite    2 tapes  (le cas precis)
  //   3. Du texte libre + un ordre de grandeur  1 saisie + 1 tape
  //
  // Le texte libre n'est PAS un aveu d'echec de la table : c'est ce qui empeche
  // l'appli de mentir. Sans lui, celui qui a mange un kebab doit cocher « poulet
  // + riz » ou ne rien cocher. Un suivi qui ne sait pas enregistrer la realite
  // se fait abandonner en trois semaines.
  // ===========================================================================

  // --- Gestes ----------------------------------------------------------------
  // Branches dans les delegues "click", "input" et "change" du livrable, a cote
  // de "toggle-nutri" : voir les tags nutri-gestes, nutri-input et nutri-change
  // de assemble150.py. Deux regles y sont recopiees telles quelles depuis les
  // lecons de set-weight et ob-name :
  //   - la saisie de texte libre ne declenche PAS de render(), sinon le clavier
  //     se referme a chaque frappe ; le rendu attend la sortie de champ ;
  //   - un ordre de grandeur choisi sans calories laisse `kcal` a null. On
  //     n'invente pas un total qui servirait ensuite a freiner un entrainement.

  // --- La LIGNE de la carte ---------------------------------------------------
  // Le bouton de correction ne peut PAS vivre dans le bouton de pointage :
  // <button> dans <button> est invalide, et le navigateur reconstruit le DOM
  // autrement — le clic partirait au mauvais endroit. La ligne devient donc une
  // rangee qui porte DEUX boutons cote a cote.
  //
  // La zone de pointage garde la quasi-totalite de la largeur : c'est le geste
  // fait tous les jours. Corriger est rare, 44 px lui suffisent.
  //
  // Une ligne de COMPLEMENT porte une fiche au lieu d'un crayon. Corriger « 3 g
  // de creatine » n'aurait aucun sens ; savoir quand, comment et combien en
  // prendre, si. C'est le meme bouton, a la meme place, avec le seul contenu qui
  // vaille pour cette ligne-la.
  function nutriLigneHtml(n, i, coche) {
    var e = nutriEffectif(n);
    var estSupp = !!n.supp;
    var ouvertSupp = estSupp && state.suppFiche === n.supp;
    return '<li>' +
      '<div class="nutrition-row">' +
        '<button type="button" class="nutrition-item ' + (coche ? "nutrition-item-done" : "") + '"' +
          ' data-action="toggle-nutri" data-n="' + i + '" aria-pressed="' + (coche ? "true" : "false") + '">' +
          '<span class="nutrition-time">' + esc(n.time) + '</span>' +
          '<span class="nutrition-item-text">' +
            '<span class="nutrition-item-name">' + esc(e.item) +
              (e.corrige ? '<span class="nutri-corrige" title="Corrigé par toi">·</span>' : '') + '</span>' +
            '<span class="nutrition-item-note">' + esc(e.note) + '</span></span>' +
          (coche ? '<span class="nutrition-check-icon" aria-hidden="true">✓</span>' : '') +
        '</button>' +
        (estSupp
          ? '<button type="button" class="nutri-edit-btn" data-action="supp-fiche" data-v="' + esc(n.supp) + '"' +
              ' aria-label="Fiche du complément" aria-expanded="' + (ouvertSupp ? "true" : "false") + '">' +
              '?</button>'
          : '') +
      '</div>' +
      (ouvertSupp ? suppFicheHtml(n.supp) : '') +
    '</li>';
  }

  // ===========================================================================
  // LE REPLIAGE DES CARTES
  // ---------------------------------------------------------------------------
  // Demande d'Olivier : « tous les blocs devraient pouvoir être repliés, ce serait
  // un vrai gain ». Le gain est le SCROLL — l'écran de bilan porte neuf cartes, et
  // on n'en consulte jamais neuf d'affilée.
  //
  // LE TITRE REPLIE, ET IL REMPLACE LES BASCULES INTERNES. Quatre cartes portaient
  // leur propre bouton d'ouverture qui n'existait QUE pour économiser du scroll —
  // « Voir les compléments », « Analyser mes séances », « Ouvrir le pont »,
  // « Clé API ». Les garder à côté du repliage donnerait deux niveaux, deux taps
  // pour atteindre le plan du jour, et deux états à comprendre par carte.
  //
  // ⚠️ LES GESTES DE CONTENU NE SONT PAS DES BASCULES DE SCROLL, et la confusion
  // se joue à une lettre : `toggle-nutrition` est l'économiseur qui sort,
  // `toggle-nutri` est le geste de COCHER une prise, fait tous les jours. Restent
  // aussi toggle-exo, toggle-howto, toggle-done et les deux sélecteurs.
  // ===========================================================================

  // LA LISTE EST CLOSE, et c'est ce qui protège le stockage : une clé inconnue lue
  // depuis des réglages abîmés n'entre pas dans l'état. Même discipline que
  // cleanProfile — tout ce qui vient du disque est validé contre ce qu'on attend.
  // « ianutri » et « avance » ont fusionne en « ia » en v1.19.0 : les trois morceaux
  // de l'assistant tiennent dans une seule carte. Une cle disparue de cette liste
  // n'est plus relue du stockage — la validation cle par cle de loadSettings s'en
  // charge — donc un etat de repliage perime ne peut pas survivre.
  var CARTES_REPLIABLES = ["nutrition", "ia", "poids", "progression",
                           "analyse", "profil", "apparence", "sauvegarde"];

  // FERMEES PAR DEFAUT : celles qu'on ouvre une fois puis plus jamais. Les autres
  // restent ouvertes — un bilan qui ne montre rien au premier regard n'est plus un
  // bilan, c'est un sommaire.
  // L'assistant est FERME par defaut : c'est un outil qu'on va chercher, pas une
  // information qu'on lit tous les jours. Son resume dit deja l'essentiel — s'il y a
  // une cle, et chez qui.
  var CARTES_FERMEES = { apparence: 1, ia: 1, sauvegarde: 1 };

  function carteOuverte(cle) {
    if (has(state.cartes, cle)) return !!state.cartes[cle];
    return !has(CARTES_FERMEES, cle);
  }

  // Rend l'ouverture de la carte ET son titre-bouton. `titre` arrive DÉJÀ échappé
  // par l'appelant — les titres existants portent leurs propres esc() et les
  // échapper deux fois afficherait « Mon profil · Olivier &#39; ».
  //
  // `resume` est facultatif, et il est la raison pour laquelle ce n'est pas juste
  // un chevron : replié, il reste lisible. « 4/9 pris », « Clé enregistrée ·
  // Anthropic », « 3 propositions » se lisent sans déplier.
  //
  // `classes` couvre le seul cas particulier du fichier, la carte de sauvegarde,
  // qui porte une classe de plus.
  function carteEntete(cle, titre, resume, classes) {
    var ouverte = carteOuverte(cle);
    return '<section class="card' + (classes ? " " + classes : "") +
             (ouverte ? "" : " card-replie") + '">' +
      '<button type="button" class="card-titre" data-action="replier"' +
        ' data-c="' + esc(cle) + '" aria-expanded="' + (ouverte ? "true" : "false") + '">' +
        '<span class="card-title">' + titre + '</span>' +
        (resume ? '<span class="card-resume">' + esc(resume) + '</span>' : '') +
        '<span class="card-chev" aria-hidden="true">' + (ouverte ? "▴" : "▾") + '</span>' +
      '</button>';
  }

  function notify(text, kind) {
    state.notice = { text: text, kind: kind || "info" };
    render();
    window.setTimeout(function () {
      if (state.notice && state.notice.text === text) { state.notice = null; render(); }
    }, 7000);
  }

  // --- Sauvegarde / restauration --------------------------------------------
  // Le profil part avec la sauvegarde. Sans lui, restaurer sur un autre
  // téléphone rendrait un historique orphelin : les séries sont indexées par
  // exercice, et sans le programme correspondant plus rien ne s'affiche.
  function buildPayload() {
    return JSON.stringify({
      app: "LEMMON FIT",
      version: APP_VERSION,
      exportedAt: new Date().toISOString(),
      profile: profile,
      log: state.log
    }, null, 2);
  }

  function exportData() {
    // Le profil vaut autant que le journal. Quelqu'un qui vient de finir le
    // diagnostic n'a aucune séance enregistrée, mais il a un programme, des
    // réglages et un plan nutrition : refuser l'export dans cet état le laissait
    // sans filet précisément au moment de l'installation, là où il en a le plus
    // besoin. La sauvegarde embarque le profil depuis buildPayload.
    var aProfil = !!(profile && profile.done);
    if (!countKeys(state.log) && !aProfil) { notify("Il n'y a encore rien à exporter.", "info"); return; }
    var payload = buildPayload();
    var filename = "lemmon-fit-sauvegarde-" + todayKey() + ".json";

    // Sur iPhone en mode « ajouté à l'écran d'accueil », un téléchargement par
    // <a download> ne produit rien, silencieusement. La feuille de partage iOS
    // est la seule voie fiable en standalone.
    if (window.File && navigator.share && navigator.canShare) {
      try {
        var file = new File([payload], filename, { type: "application/json" });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: filename })
            .then(function () { notify("Sauvegarde partagée. Range-la dans Fichiers, ou envoie-la-toi par mail.", "ok"); })
            .catch(function (err) {
              if (err && err.name === "AbortError") return;
              downloadFallback(payload, filename);
            });
          return;
        }
      } catch (e) { /* repli */ }
    }
    downloadFallback(payload, filename);
  }

  function downloadFallback(payload, filename) {
    try {
      var blob = new Blob([payload], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      notify("Sauvegarde générée : " + filename, "ok");
    } catch (e) {
      window.alert("Export impossible : " + (e && e.message ? e.message : e));
    }
  }

  function importPayload(text) {
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (err) {
      // On ne relaie pas le message du moteur : il est en anglais et il parle
      // de jetons et de positions. On garde seulement la position, si le moteur
      // en donne une — c'est la seule miette utile à qui ouvrirait le fichier.
      var brut = (err && err.message) ? String(err.message) : "";
      var mPos = /position\s+(\d+)/i.exec(brut);
      throw new Error("Ce fichier n'est pas une sauvegarde lisible : son contenu " +
        "est abîmé ou incomplet" +
        (mPos ? " (le texte devient illisible au caractère " + mPos[1] + ")" : "") +
        ". Reprends le fichier .json produit par l'appli, sans l'ouvrir ni le " +
        "modifier. Rien n'a été changé sur ce téléphone.");
    }
    if (!parsed || typeof parsed !== "object" || isArray(parsed)) {
      throw new Error("Ce fichier est lisible, mais ce n'est pas une sauvegarde " +
        "LEMMON FIT. Cherche le fichier .json que l'appli a produit depuis " +
        "l'écran Bilan. Rien n'a été changé sur ce téléphone.");
    }
    var incoming = (parsed && parsed.log && typeof parsed.log === "object") ? parsed.log : parsed;
    var brutProfil = (parsed && parsed.profile && typeof parsed.profile === "object")
      ? parsed.profile : null;
    if (brutProfil) brutProfil.done = true;
    var incomingProfile = brutProfil ? cleanProfile(brutProfil) : null;
    var withProfile = !!(incomingProfile && incomingProfile.plan);

    // Le profil du fichier est appliqué AVANT le nettoyage du journal qui
    // l'accompagne. cleanEntry valide « nutri » contre la liste de prises
    // active : nettoyer d'abord ferait perdre les prises cochées d'une
    // sauvegarde dont le plan nutrition diffère de celui du téléphone qui
    // reçoit. On restaure le profil précédent si l'import est abandonné.
    var profilPrecedent = profile, profilTemp = null;
    if (withProfile) { incomingProfile.done = true; profilTemp = incomingProfile; }
    // Une sauvegarde produite par une version ANTÉRIEURE au diagnostic ne porte
    // aucun profil : la v1.0.0 en ligne n'écrit que { app, version, exportedAt,
    // log }. Reçue sur une installation neuve, PROGRAM est vide et cleanLog
    // tourne à sec — les charges au format par rang ne peuvent être résolues, et
    // les prises de nutrition sont toutes écartées, faute de liste à valider.
    // On adopte donc le programme d'origine, exactement comme le démarrage.
    // Mesuré sans ce garde-fou : 1 794 kg de charges et 5 prises détruits, et
    // comme l'écran de diagnostic n'affiche pas les notifications, l'utilisateur
    // ne voit rien du tout et recommence.
    else if (!countKeys(PROGRAM)) { profilTemp = legacyProfile(); profilTemp.done = true; }
    function annuler() {
      if (!profilTemp) return;
      profile = profilPrecedent;
      applyProfile();
    }
    if (profilTemp) { profile = profilTemp; applyProfile(); }

    var cleaned = cleanLog(incoming);
    var n = countKeys(cleaned), k;

    // Un fichier sans aucune séance mais avec un profil est parfaitement
    // légitime : c'est la sauvegarde de quelqu'un qui vient d'installer l'appli
    // et de faire son diagnostic. Exiger une séance rendait cet export
    // impossible à relire, donc inutile.
    if (!n && !withProfile) {
      annuler();
      throw new Error("ce fichier ne contient ni séance ni profil");
    }
    var quoi = [];
    if (n) quoi.push(n + " jour(s) de séances");
    if (withProfile) quoi.push("un profil et son programme");
    if (!window.confirm("Importer " + quoi.join(" et ") + " ?" +
        (withProfile ? "\n\nLe profil et le programme du fichier remplaceront les tiens." : "") +
        (n ? "\n\nLes séances fusionnent avec les tiennes ; en cas de conflit sur une même date, le fichier importé gagne." : ""))) {
      annuler();
      return;
    }
    syncLogDepuisStockage();
    for (k in cleaned) { if (has(cleaned, k)) state.log[k] = cleaned[k]; }
    // Le journal EN PREMIER : si le stockage refuse d'écrire, mieux vaut ne pas
    // avoir remplacé le profil pour un journal qui n'a pas pu s'enregistrer.
    var ok = persist();
    if (profilTemp) {
      persistSettings();
      // Sortir du questionnaire est indispensable : garder le journal restauré
      // sans le programme qui va avec le rendrait illisible, et l'écran de
      // diagnostic n'affiche pas les notifications, donc rien ne signalerait
      // que l'import a réussi.
      if (state.ob) state.ob = null;
    }
    notify(ok ? ("Import terminé : " + quoi.join(" et ") + ".")
              : "Import affiché mais NON enregistré : le stockage refuse d'écrire.",
           ok ? "ok" : "error");
  }

  // ===========================================================================
  // « UNE VERSION PLUS RÉCENTE EXISTE » — LA SONDE ET SON BANDEAU
  // ---------------------------------------------------------------------------
  // CE QUE CE BLOC AJOUTE, ET CE QU'IL N'AJOUTE PAS. Il ne met rien à jour : tout
  // le mécanisme est déjà là, et il marche. sw.js est réseau d'abord, donc au
  // prochain lancement avec du réseau la version fraîche arrive d'elle-même ; le
  // bouton « ⟳ Mettre à jour l'appli » force le geste ; le nom du cache découle de
  // la version, donc l'ancien se purge tout seul. Ce bloc ajoute UNE chose : le
  // fait de le DIRE. Jusqu'ici il fallait aller chercher le bouton.
  //
  // TROIS CAS OÙ LE RÉSEAU-D'ABORD NE SUFFIT PAS, et c'est pour eux qu'on sonde :
  //   1. réseau lent — au-delà de NET_TIMEOUT_MS, sw.js sert le cache, donc
  //      l'ancien code tourne alors que le cache, lui, se rafraîchit derrière ;
  //   2. PWA iOS suspendue — reprise après plusieurs jours, elle peut redémarrer
  //      SANS renavigation, et l'ancien JavaScript reste en mémoire indéfiniment ;
  //   3. fenêtre du CDN — GitHub Pages sert max-age=600.
  //
  // ⚠️ AUCUNE NOTIFICATION SYSTÈME N'EST POSSIBLE ICI, et ce n'est pas un manque de
  // volonté : il faudrait du push, donc un serveur et une clé VAPID, alors que
  // l'appli est une page statique dont la CSP porte connect-src en liste CLOSE. Et
  // rien ne peut atteindre quelqu'un qui n'ouvre pas l'appli. C'est un bandeau DANS
  // l'appli, et il ne prétend pas être autre chose.
  // ===========================================================================

  // LA SONDE EST manifest.json, ET ELLE N'AJOUTE AUCUN FICHIER À DÉPLOYER.
  // 706 octets, déjà dans les cinq fichiers déposés, et il porte déjà « version ».
  // Un version.json séparé aurait fait un sixième fichier à glisser à la main,
  // donc une occasion de l'oublier — et une version qui diverge du triplet
  // (APP_VERSION, sw.js, manifeste) est exactement ce que ce triplet existe pour
  // empêcher.
  var MAJ_SONDE_FICHIER = "./manifest.json";

  // On ne sonde pas plus d'une fois par quart d'heure. Sans ce frein, quelqu'un qui
  // fait des allers-retours entre l'appli et son minuteur déclencherait une requête
  // à chaque retour — et la sonde est branchée sur visibilitychange, donc sur le
  // geste le plus fréquent de toute la séance.
  //
  // Le premier retour après plusieurs jours passe évidemment, ce qui est le cas
  // qu'on cherche à couvrir.
  var MAJ_SONDE_MS = 15 * 60 * 1000;
  var majDerniereSonde = 0;
  var majEnVol = false;

  // COMPARAISON ORDONNÉE, ET NUMÉRIQUE, JAMAIS UNE INÉGALITÉ DE CHAÎNES.
  //
  // « la version servie diffère de la mienne » est faux dans deux cas réels :
  // pendant la fenêtre du CDN on peut recevoir un manifeste PLUS ANCIEN, et un
  // retour en arrière volontaire en déploierait un aussi. Le bandeau annoncerait
  // alors une mise à jour vers le passé, et un tap ne le ferait pas disparaître.
  //
  // ⚠️ ET LA COMPARAISON DE CHAÎNES AURAIT MORDU SUR CE PROJET PRÉCIS : « 1.9.3 »
  // est SUPÉRIEUR à « 1.10.0 » quand on compare des chaînes, parce que « 9 » vient
  // après « 1 ». L'appli est justement passée de 1.9.3 à 1.10.0. On compare donc
  // nombre par nombre.
  //
  // Rend vrai seulement si `servie` est STRICTEMENT plus récente que `courante`.
  function majPlusRecente(servie, courante) {
    if (!/^\d+\.\d+\.\d+$/.test(String(servie))) return false;
    if (!/^\d+\.\d+\.\d+$/.test(String(courante))) return false;
    var a = String(servie).split("."), b = String(courante).split("."), i, x, y;
    for (i = 0; i < 3; i++) {
      x = parseInt(a[i], 10); y = parseInt(b[i], 10);
      if (x > y) return true;
      if (x < y) return false;
    }
    return false;                       // égales : il n'y a rien à annoncer
  }

  // La sonde. Ne rend rien : elle pose state.majDispo et redessine, ou elle se
  // taît. `force` saute le frein — le bouton de réglages s'en sert.
  //
  // ⚠️ « ?nocache= » N'EST PAS UN ORNEMENT. sw.js laisse passer ces requêtes sans
  // les intercepter (voir sa branche searchParams). Sans ce paramètre, la sonde
  // serait servie DEPUIS LE CACHE : elle réussirait hors-ligne, rendrait l'ancienne
  // version, et l'appli conclurait « tu es à jour » sans avoir joint le réseau.
  // C'est mot pour mot le défaut déjà payé sur updateApp, dont la sonde porte le
  // même paramètre pour la même raison.
  //
  // ⚠️ LE SILENCE EN CAS D'ÉCHEC EST UNE DÉCISION. Hors-ligne ne veut pas dire à
  // jour. Une sonde qui échoue ne dit RIEN : ni bandeau, ni notification. Le seul
  // appelant qui a le droit de parler est celui que l'utilisateur a déclenché
  // lui-même, et il le fait de son côté.
  function majSonder(force, onFini) {
    if (majEnVol) return;
    if (!window.fetch || !window.JSON) return;
    var t = new Date().getTime();
    if (!force && majDerniereSonde && (t - majDerniereSonde) < MAJ_SONDE_MS) return;
    majDerniereSonde = t;
    majEnVol = true;

    var url;
    try {
      url = new URL(MAJ_SONDE_FICHIER, window.location.href).href + "?nocache=" + t;
    } catch (e) { majEnVol = false; return; }

    function fini(neuve) {
      majEnVol = false;
      if (onFini) onFini(neuve);
    }

    window.fetch(url, { cache: "reload" }).then(function (r) {
      if (!r || !r.ok) throw new Error("réseau injoignable");
      return r.text();
    }).then(function (txt) {
      // Un portail Wi-Fi répond 200 avec sa propre page : JSON.parse échoue, et
      // l'échec est traité comme un échec de réseau. C'est la même précaution que
      // celle d'updateApp, qui vérifie la longueur et le titre du HTML.
      var j = JSON.parse(txt);
      var v = (j && typeof j.version === "string") ? j.version : "";
      if (majPlusRecente(v, APP_VERSION)) {
        state.majDispo = v;
        state.majVue = false;           // une version NEUVE se réannonce
        render();
        fini(v);
        return;
      }
      // Rien de plus récent : on efface un bandeau qui aurait survécu à une mise à
      // jour faite entre-temps par un autre chemin. Sans cette ligne, le bandeau
      // restait après que sw.js avait fait le travail tout seul.
      if (state.majDispo) { state.majDispo = null; render(); }
      fini(null);
    })["catch"](function () {
      fini(null);                       // SILENCE : voir le commentaire ci-dessus
    });
  }

  // Le bandeau. Il vit dans bannersHtml, avec les autres — pas dans une carte : ce
  // n'est pas une information qu'on va consulter, c'est une information qui doit
  // arriver.
  //
  // ⚠️ AUCUN RECHARGEMENT AUTOMATIQUE. Recharger sous les doigts de quelqu'un
  // effacerait la série qu'il est en train de taper — et l'appli est faite pour
  // être ouverte entre deux séries. Le bandeau porte un bouton, et c'est
  // l'utilisateur qui décide. Même règle que toutes les propositions de l'appli :
  // « Appliquer » à côté d'« Ignorer », jamais à la place.
  //
  // IL EST REFERMABLE, ET LE REFUS NE SURVIT PAS À LA SESSION. Persister « déjà
  // vu » cacherait le bandeau pour toujours à quelqu'un qui n'a pas mis à jour ;
  // ne pas le rendre refermable en ferait un bandeau qu'on apprend à ne plus voir.
  // Il revient donc au prochain lancement, tant que la version n'a pas bougé.
  function majBandeauHtml() {
    if (!state.majDispo || state.majVue) return "";
    return '<div class="banner banner-info">' +
      '<strong>Version ' + esc(state.majDispo) + ' disponible</strong> — tu es en ' +
      esc(APP_VERSION) + '. Tes séances, tes charges et tes pesées ne sont pas ' +
      'touchées par une mise à jour.' +
      '<button type="button" class="banner-btn" data-action="update-app">Mettre à jour</button>' +
      '<button type="button" class="banner-btn" data-action="maj-plus-tard">Plus tard</button>' +
    '</div>';
  }

  // --- Mise à jour ----------------------------------------------------------
  // On ne détruit JAMAIS le cache avant d'avoir la nouvelle version en main.
  //
  // Ce commentaire était là depuis la v1.1.0, et le code faisait le contraire :
