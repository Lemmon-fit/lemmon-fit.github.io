  // il téléchargeait le HTML frais, le JETAIT, purgeait tout le CacheStorage,
  // puis rechargeait en comptant sur un SECOND téléchargement pour tout
  // reconstruire. Entre la purge et ce second téléchargement, l'appli n'avait
  // plus rien : une coupure réseau à cet instant précis — le métro, un ascenseur,
  // le sous-sol de la salle — et l'écran affichait « LEMMON FIT est hors-ligne et
  // n'a rien en cache ». Une appli qui fonctionnait parfaitement hors-ligne
  // trente secondes plus tôt devenait inutilisable, les données intactes mais
  // plus aucun moyen de les voir. Reproduit en chargeant le vrai sw.js : cinq
  // entrées en cache avant le clic, zéro après, puis 503.
  //
  // On SÈME d'abord, on purge ENSUITE. Le HTML frais est déjà en main, il suffit
  // de l'écrire sous la clé que sw.js utilisera : cacheKey() retire la requête,
  // donc c'est exactement origin + pathname, la variable `base`. Entre les deux
  // opérations, le cache contient toujours une coquille servable.
  //
  // La sonde porte "?nocache=" : sw.js laisse passer ces requêtes sans y toucher,
  // sinon elle serait servie depuis le cache et réussirait même hors-ligne,
  // l'appli s'effaçant alors en croyant le réseau disponible.
  function updateApp() {
    var base = window.location.origin + window.location.pathname;
    var probe = base + "?nocache=" + Date.now();
    var fresh = base + "?v=" + Date.now();
    notify("Recherche d'une mise à jour…", "info");
    fetch(probe, { cache: "reload" })
      .then(function (r) {
        if (!r || !r.ok) throw new Error("réseau injoignable");
        return r.text();
      })
      .then(function (html) {
        // Un portail Wi-Fi répond 200 avec sa propre page : on vérifie qu'on a
        // bien récupéré l'appli avant de toucher au cache.
        if (html.length < 5000 || html.indexOf("LEMMON FIT") === -1) {
          throw new Error("réponse inattendue du réseau");
        }
        // Sans caches ni Response, on NE PURGE PAS : sw.js est réseau-d'abord et
        // cacheKey() range ?v= sous la même clé, donc le HTML frais écrasera
        // l'entrée de lui-même. Purger ne ferait que retirer le filet.
        if (!window.caches || !caches.keys || !window.Response) return null;
        // On sème dans le cache COURANT, pas dans un cache à part.
        //
        // Un cache transitoire séparé paraissait plus propre, et il était pire :
        // il ne s'auto-nettoyait que si un nouveau service worker s'activait,
        // donc jamais quand on tape « Mettre à jour » alors que rien de neuf
        // n'est déployé. Il survivait, et comme CacheStorage.match rend la
        // PREMIÈRE correspondance dans l'ordre de création, ce semis périmé
        // l'emportait ensuite sur le cache à jour à chaque repli hors-ligne.
        //
        // Le nom découle de la version, exactement comme dans sw.js : c'est le
        // cache que le service worker utilise déjà, donc rien de concurrent.
        var SEMIS = "lemmonfit-" + APP_VERSION;
        // sw.js précache DEUX clés de navigation : "./" et "./index.html".
        // cacheKey() ne retire que la requête, pas le nom de fichier, donc ce
        // sont bien deux entrées distinctes. En ne semant que sous celle qui est
        // ouverte, l'autre survivait à la purge avec l'ANCIENNE appli — et comme
        // déployer un index.html sans toucher au sw.js ne réinstalle rien,
        // addAll ne repassait jamais. Hors-ligne sur l'autre adresse, c'est la
        // vieille version qui se lançait.
        //
        // Les deux clés se dérivent du DOSSIER, jamais du chemin ouvert. Dérivées
        // de `base`, elles se confondaient dès que la page était ouverte SUR
        // "./index.html" — ce qui est justement le start_url du manifeste, donc
        // le cas de l'appli installée sur l'écran d'accueil : la clé "./" n'était
        // alors jamais resemée et gardait l'ancienne version. Passer par le
        // dossier couvre les deux sens, et évite d'écrire hors du périmètre de
        // l'appli si elle était un jour servie depuis un sous-dossier.
        var dossier = new URL("./", base).href;
        var cibles = [base];
        if (cibles.indexOf(dossier) === -1) cibles.push(dossier);
        if (cibles.indexOf(dossier + "index.html") === -1) cibles.push(dossier + "index.html");
        var repondre = function () {
          return new Response(html, {
            headers: { "Content-Type": "text/html; charset=utf-8" }
          });
        };
        return caches.open(SEMIS).then(function (cache) {
          return Promise.all(cibles.map(function (u) { return cache.put(u, repondre()); }));
        }).then(function () {
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) {
              return k === SEMIS ? null : caches.delete(k);
            }));
          });
        })["catch"](function () {
          // Le stockage a refusé d'écrire (quota, cache évincé). Ce n'est PAS
          // une raison d'abandonner : le HTML frais est en main, sw.js va au
          // réseau d'abord, et le rechargement suffit à mettre à jour l'appli.
          // Abandonner ici rendait le bouton définitivement inopérant en
          // accusant le réseau, qui n'y était pour rien.
          return null;
        });
      })
      .then(function () { window.location.replace(fresh); })
      .catch(function () {
        notify("Mise à jour impossible : réseau injoignable. L'appli reste utilisable telle quelle, tes données sont intactes.", "error");
      });
  }
  // --- Écriture des séries --------------------------------------------------
  function copySets(entry) {
    var out = {}, k, i, src;
    if (entry && entry.sets) {
      for (k in entry.sets) {
        if (!has(entry.sets, k)) continue;
        src = entry.sets[k];
        out[k] = [];
        for (i = 0; i < src.length; i++) {
          out[k].push({ kg: src[i].kg, reps: src[i].reps,
                        km: src[i].km, min: src[i].min });
        }
      }
    }
    return out;
  }

  // Nombre de séries d'un exercice sans charge (pastilles).
  function setSetsCount(exId, n) {
    var sets = copySets(currentEntry());
    if (n > 0) {
      var arr = sets[exId] || [];
      while (arr.length < n) arr.push({});
      arr.length = n;
      sets[exId] = arr;
    } else {
      delete sets[exId];
    }
    updateEntry({ sets: countKeys(sets) ? sets : null });
  }

  function writeSetField(exId, setIdx, field, rawValue) {
    var sets = copySets(currentEntry());
    var arr = sets[exId] || [];
    var raw = String(rawValue).replace(",", ".").trim();

    while (arr.length <= setIdx) arr.push({});

    if (raw === "") {
      delete arr[setIdx][field];
    } else {
      var v;
      if (field === "kg") v = cleanNumber(raw, MIN_KG, MAX_KG, 1);
      else if (field === "km") v = cleanNumber(raw, MIN_KM, MAX_KM, 2);
      else if (field === "min") v = cleanNumber(raw, MIN_MIN, MAX_MIN, 0);
      else v = cleanNumber(raw, MIN_REPS, MAX_REPS, 0);
      if (v === null) return false;   // saisie incomplète ou hors bornes
      arr[setIdx][field] = v;
    }

    // On retire les séries vides de fin, pour que le compteur reste juste.
    var lastFilled = -1, i;
    for (i = 0; i < arr.length; i++) {
      if (arr[i].kg !== undefined || arr[i].reps !== undefined ||
          arr[i].km !== undefined || arr[i].min !== undefined) lastFilled = i;
    }
    if (lastFilled >= 0) arr.length = lastFilled + 1; else arr.length = 0;

    if (arr.length) sets[exId] = arr; else delete sets[exId];
    updateEntry({ sets: countKeys(sets) ? sets : null });
    return true;
  }

  // --- Navigation entre les deux écrans -------------------------------------
  function setPage(page) {
    if (page !== "seance" && page !== "annexe") return;
    if (state.page === page) return;
    state.pageAnim = (page === "annexe") ? "right" : "left";
    state.page = page;
    state.openExo = null;         // on ne garde pas une fiche ouverte en fond
    render();
    allerEnHaut();
  }

  // Glissement horizontal. Conditions volontairement strictes : le geste doit
  // être franchement horizontal, sinon on volerait des défilements verticaux.
  // Un geste qui démarre dans un champ est ignoré, pour ne pas empêcher la
  // sélection de texte dans les cases de charge.
  var touch = null;
  root.addEventListener("touchstart", function (ev) {
    if (ev.touches.length !== 1) { touch = null; return; }
    var tag = ev.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { touch = null; return; }
    touch = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
  }, { passive: true });

  root.addEventListener("touchend", function (ev) {
    if (!touch || !ev.changedTouches || ev.changedTouches.length !== 1) { touch = null; return; }
    var dx = ev.changedTouches[0].clientX - touch.x;
    var dy = ev.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.abs(dx) < 60) return;                     // trop court pour être voulu
    if (Math.abs(dx) < Math.abs(dy) * 1.5) return;     // c'était un défilement
    setPage(dx < 0 ? "annexe" : "seance");             // vers la gauche = écran suivant
  }, { passive: true });

  // --- Délégation d'événements ----------------------------------------------
  root.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-action]");
    if (!t) return;
    var action = t.getAttribute("data-action");

    if (action === "allege-annuler") {
      if (profile && profile.allegeLe) {
        profile.allegeLe = null;
        persistSettings();
        notify("Séance complète rétablie.", "info");
      } else {
        render();
      }

    } else if (action === "ana-appliquer" || action === "ana-ignorer" || action === "ana-vu") {
      // L'analyse est RECALCULEE ici plutot que memorisee entre deux rendus :
      // l'indice du bouton doit designer la meme proposition qu'a l'affichage,
      // et rien n'a pu changer entre les deux sans passer par un rendu.
      var anaI = parseInt(t.getAttribute("data-i"), 10);
      var anaA = analyser();
      var anaP = anaA.propositions[anaI];
      if (anaP) {
        appliquerProposition(anaP, action === "ana-appliquer");
        applyProfile();
        notify(action === "ana-appliquer" ? "Programme ajust\u00e9." : "C'est not\u00e9, on n'y revient pas.",
               action === "ana-appliquer" ? "ok" : "info");
      } else {
        render();
      }

    } else if (action === "set-theme") {
      var thv = t.getAttribute("data-theme");
      if (thv === "sombre" || thv === "clair" || thv === "systeme") {
        state.theme = thv;
        persistSettings();
        appliqueTheme();
        render();
      }

    } else if (action === "toggle-avance") {
      // On relit le champ AVANT de replier. Sur iOS, un collage par le menu
      // systeme ne declenche pas toujours l'evenement input : la cle etait alors
      // a l'ecran mais pas dans iaReglages, et replier la carte la faisait
      // disparaitre sans un mot. La branche « Tester » relisait deja, pas
      // celles-ci.
      iaLireChamps();
      state.avanceOuvert = !state.avanceOuvert;
      state.iaCleVisible = false;   // on ne laisse pas la cle en clair derriere soi
      state.iaAvisCle = "";         // l'avis a ete lu, ou ne concerne plus rien
      persistSettings();
      render();

    } else if (action === "ia-cle-voir") {
      // En passant en saisie, le champ part VIDE : on ne remet pas la cle en
      // clair dans le DOM pour la modifier. Retaper est le prix de ne pas
      // l'exposer.
      //
      // Meme raison qu'au-dessus : « Masquer la cle » perdait une cle collee
      // sans evenement input.
      iaLireChamps();
      state.iaCleVisible = !state.iaCleVisible;
      persistSettings();
      render();

    } else if (action === "ia-cle-effacer") {
      if (window.confirm("Effacer la cl\u00e9 enregistr\u00e9e sur cet appareil ?")) {
        iaReglages.cle = "";
        state.iaCleVisible = false;
        persistSettings();
        notify("Cl\u00e9 effac\u00e9e.", "ok");
      }

    } else if (action === "ia-tester") {
      if (state.iaOccupe) return;          // pas deux appels en vol, pas deux factures
      iaLireChamps();
      persistSettings();
      if (!iaClePrete()) { notify("Saisis d'abord une cl\u00e9.", "info"); render(); return; }
      state.iaOccupe = true; render();
      iaAppelDirect("Reponds exactement : OK", function () {
        state.iaOccupe = false;
        // La cle repasse en masque une fois validee : elle n'a plus de raison
        // de rester en clair a l'ecran, et un telephone se pose sur une table.
        state.iaCleVisible = false;
        notify("Connexion \u00e9tablie. La cl\u00e9 fonctionne.", "ok");
      }, function (msg) {
        state.iaOccupe = false;
        notify(msg, "warn");
      });

    } else if (action === "ia-demander") {
      if (state.iaOccupe) return;
      state.iaOccupe = true; render();
      iaAppelDirect(iaPrompt(), function (texte) {
        state.iaOccupe = false;
        state.iaTexte = texte;
        state.iaRes = iaLire(texte);
        var n = state.iaRes.props.length;
        notify(n ? (n + " proposition" + (n > 1 ? "s" : "") + " \u00e0 examiner.")
                 : "Aucune proposition applicable.", n ? "ok" : "info");
      }, function (msg) {
        state.iaOccupe = false;
        notify(msg, "warn");
      });

    } else if (action === "toggle-ia") {
      state.iaOuvert = !state.iaOuvert; render();

    } else if (action === "toggle-ia-nutri") {
      state.iaNutriOuvert = !state.iaNutriOuvert; render();

    } else if (action === "toggle-avance") {
      // On relit les champs vivants avant de replier : sur iOS, un collage par le
      // menu systeme ne declenche pas toujours l'evenement input, et « Masquer »
      // perdrait une cle collee. Meme parade que les autres gestes qui touchent a
      // la cle.
      iaLireChamps();
      state.avanceOuvert = !state.avanceOuvert;
      persistSettings();
      render();

    } else if (action === "ia-nutri-ecrire") {
      var vEcr = state.iaNutriVal;
      var rEcr = nutriEcrirePlanIA(vEcr);
      if (rEcr.refus) {
        notify(rEcr.refus, "warn");
      } else {
        // La lecture affichee devient caduque : le plan qu'elle proposait EST
        // maintenant le plan. La garder a l'ecran laisserait croire qu'il reste
        // quelque chose a enregistrer, et un second clic reecrirait la meme chose
        // en reposant nutriPlanLe une fois de plus — donc en re-declarant
        // illisibles les journees d'hier, pour rien.
        state.iaNutriRes = null; state.iaNutriVal = null; state.iaNutriTexte = "";
        // On OUVRE la carte de nutrition : l'utilisateur doit voir le plan qu'il
        // vient d'enregistrer. C'est ce que faisait l'ancienne bascule « Voir les
        // complements », remplacee par le repliage de la carte en v1.17.0.
        //
        // ⚠️ Le nom de cet ancien champ d'etat n'est PAS ecrit ici, et ce n'est pas
        // une coquetterie : le garde-fou de fin de chaine refuse le build s'il
        // subsiste, y compris dans un commentaire. Il a mordu la, et c'est le meme
        // refus qui avait attrape des commentaires invoquant le frein retire en
        // v1.11.0. La raison survit au nom.
        state.cartes.nutrition = true;
        notify(rEcr.ecrit
                 ? ("Plan enregistr\u00e9 : " + rEcr.lignes + " prise" +
                    (rEcr.lignes > 1 ? "s" : "") + "." + obPhraseCorrections(rEcr))
                 : "Plan appliqu\u00e9 \u00e0 l'\u00e9cran, mais le stockage a refus\u00e9 : il sera perdu au rechargement.",
               rEcr.ecrit ? "ok" : "warn");
      }

    } else if (action === "nutri-plan-appli") {
      if (window.confirm("Revenir au plan de l'appli ?\n\nLe plan \u00e9crit par l'IA sera remplac\u00e9 par tes compl\u00e9ments et tes deux cibles.")) {
        var rRet = nutriRevenirPlanAppli();

    } else if (action === "ia-nutri-copier") {

        notify(action === "ia-appliquer" ? "Programme ajust\u00e9." : "C'est not\u00e9, on n'y revient pas.",

    } else if (action === "replier") {

    } else if (action === "toggle-exercises") {

    } else if (action === "set-page") {

    } else if (action === "toggle-prog-picker") {

    } else if (action === "toggle-date-picker") {

    } else if (action === "toggle-exo") {

      render();

    } else if (action === "toggle-howto") {

    } else if (action === "set-chart-span") {

    } else if (action === "set-chart-mode") {

    } else if (action === "set-edit-day") {

    } else if (action === "maj-plus-tard") {

      state.majVue = true; render();

    } else if (action === "set-prog") {

      // Rappuyer sur la séance déjà active l'annule : sans ça, le week-end, un

      updateEntry({ prog: (pk === natural || pk === cur) ? null : pk });

    } else if (action === "toggle-done") {

      var etaitFaite = !!currentEntry().done;

      if (!etaitFaite) {

        if (nReplies > 0) allerEnHaut();

    } else if (action === "nutri-migre-vu") {

      if (kinds[obdk] === "course") delete kinds[obdk]; else kinds[obdk] = "course";

    } else if (action === "ob-gear") {

      var obg = t.getAttribute("data-v"), glist = obDraft().noGear, gpos = glist.indexOf(obg);
      if (gpos >= 0) glist.splice(gpos, 1); else glist.push(obg);

      var obx = t.getAttribute("data-ex"), xlist = obDraft().excluded;

    } else if (action === "ob-supp") {
      var obs = t.getAttribute("data-v"), slist = obDraft().nutri.supps, spos = slist.indexOf(obs);
      if (spos >= 0) slist.splice(spos, 1); else slist.push(obs);

    } else if (action === "ob-finish") {

    } else if (action === "edit-profil") {

        allerEnHaut();

    } else if (action === "ob-annuler") {
      // Sortie SANS ecriture. Le brouillon est jete tel quel : rien n'a jamais
      // ete pose sur `profile`, obEcrire est le seul a le faire.
      if (profile && profile.done) {
        state.ob = null;
        state.page = "annexe";
        render();
        allerEnHaut();
      }

    } else if (action === "ob-enregistrer") {

      allerEnHaut();

      exportData();

    } else if (action === "import-data") {

      if (input) input.click();

    } else if (action === "reset") {
      var count = countKeys(state.log);
      if (!count) { notify("Il n'y a encore rien à effacer.", "info"); return; }
      if (!window.confirm("Effacer définitivement " + count + " jour(s) d'historique ?\n\nExporte d'abord, c'est irréversible.")) return;
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}

      state.editDate = todayKey();
      state.editDatePinned = false;
      notify("Historique effacé.", "info");
    }
  });

  root.addEventListener("input", function (ev) {
    var t = ev.target;
    var action = t.getAttribute && t.getAttribute("data-action");
    if (action === "ob-name") {
      obDraft().name = String(t.value).slice(0, 24);   // pas de render : le clavier se fermerait
      return;
    }
    if (action === "ob-weight" || action === "ob-target") {
      var obraw = String(t.value).replace(",", ".").trim();
      var obnum = cleanWeight(obraw);
      if (obnum !== null) obDraft()[action === "ob-weight" ? "startWeight" : "targetWeight"] = obnum;
      return;
    }
    if (action === "ia-saisie") {
      state.iaTexte = String(t.value).slice(0, 20000);
      return;
    }
    if (action === "ia-nutri-saisie") {
      // Pas de render() ici : le clavier se refermerait a chaque frappe. Meme
      // regle que « ia-saisie » juste au-dessus, et que set-weight plus bas.
      state.iaNutriTexte = String(t.value).slice(0, 20000);
      return;
    }
    if (action === "ia-cle-saisie" || action === "ia-modele-saisie") {
      iaLireChamps();
      return;
    }
    if (action === "set-weight") {
      // Pas de render() ici : ça refermerait le clavier à chaque frappe.
      var raw = String(t.value).replace(",", ".").trim();
      if (raw === "") { updateEntry({ weight: null }); return; }
      var num = cleanWeight(raw);
      if (num !== null) updateEntry({ weight: num });
    } else if (action === "set-kg" || action === "set-reps") {
      writeSetField(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-set"), 10),
                    action === "set-kg" ? "kg" : "reps", t.value);
    } else if (action === "set-km" || action === "set-min") {
      writeSetField(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-set"), 10),
                    action === "set-km" ? "km" : "min", t.value);
    }
  });

  root.addEventListener("change", function (ev) {
    var t = ev.target;
    var action = t.getAttribute && t.getAttribute("data-action");
    if (action === "set-edit-date") {
      // Bornes revalidées ici, et pas seulement via les attributs min/max, qui
      // ne bloquent pas une saisie au clavier.
      if (DATE_RE.test(t.value)) { state.editDate = t.value; state.editDatePinned = t.value !== todayKey(); }
      state.showProgPicker = false;
      render();
    } else if (action === "ob-weight" || action === "ob-target") {
      render();   // en sortie de champ seulement, pour rafraîchir l'estimation

    } else if (action === "ia-fournisseur") {
      iaChangerFournisseur(t.value);
      persistSettings();
      render();

    } else if (action === "ia-cle-saisie" || action === "ia-modele-saisie") {
      iaLireChamps();
      persistSettings();

    } else if (action === "set-weight") {
      render();
    } else if (action === "set-km" || action === "set-min") {
      var rawR = String(t.value).replace(",", ".").trim();
      if (rawR !== "") {
        var okR = (action === "set-km")
          ? cleanNumber(rawR, MIN_KM, MAX_KM, 2) !== null
          : cleanNumber(rawR, MIN_MIN, MAX_MIN, 0) !== null;
        if (!okR) {
          notify(action === "set-km"
            ? "Distance ignorée : elle doit être comprise entre " + frDec(String(MIN_KM)) + " et " + MAX_KM + " km."
            : "Durée ignorée : entre " + MIN_MIN + " et " + MAX_MIN + " minutes.", "error");
          return;
        }
      }
      render();

    } else if (action === "set-kg" || action === "set-reps") {
      // Une valeur hors bornes était effacée sans un mot en sortant du champ.
      var raw = String(t.value).replace(",", ".").trim();
      if (raw !== "") {
        var ok = (action === "set-kg")
          ? cleanNumber(raw, MIN_KG, MAX_KG, 1) !== null
          : cleanNumber(raw, MIN_REPS, MAX_REPS, 0) !== null;
        if (!ok) {
          notify(action === "set-kg"
            ? "Charge ignorée : elle doit être comprise entre " + frDec(MIN_KG) + " et " + MAX_KG + " kg."
            : "Répétitions ignorées : entre " + MIN_REPS + " et " + MAX_REPS + ".", "error");
          return;
        }
      }
      render();
    } else if (t.id === "import-file-input" && t.files && t.files[0]) {
      var reader = new FileReader();
      reader.onload = function () {
        try { importPayload(reader.result); }
        catch (e) { window.alert("Import impossible : " + (e && e.message ? e.message : e)); }
        t.value = "";
      };
      reader.onerror = function () { window.alert("Lecture du fichier impossible."); };
      reader.readAsText(t.files[0]);
    }
  });

  // --- Démarrage -------------------------------------------------------------
  // Le retrait du splash est programmé AVANT le premier rendu : si le rendu
  // échoue, le setTimeout doit exister quand même, sinon le splash reste affiché
  // pour toujours et il n'y a aucune issue en mode standalone.
  var splashEl = document.getElementById("splash");
  if (splashEl) {
    window.setTimeout(function () {
      splashEl.classList.add("hide");
      window.setTimeout(function () { splashEl.parentNode && splashEl.parentNode.removeChild(splashEl); }, 450);
    }, 900);
  }

  loadSettings();

  // ORDRE CRITIQUE : le profil doit être appliqué AVANT de charger le journal.
  //
  // cleanEntry valide « prog » contre PROGRAM et « nutri » contre NUTRITION, et
  // migrateEntry a besoin de PROGRAM pour convertir les anciens rangs
  // d'exercices en identifiants. Tant qu'applyProfile n'a pas tourné, ces deux
  // tableaux sont VIDES : tout est écarté. Et comme loadLog réécrit le résultat
  // dans le stockage quand il diffère de l'entrée, la perte est gravée.
  //
  // Mesuré avec l'ordre inverse, sur une journée au format v1.0.0 :
  // { done, prog, weight, energy, sleep, exSets, loads, nutri } ressortait
  // { done, weight, energy, sleep }. Charges, séance et prises détruites.
  amorcerProfil();

  loadLog();

  if (!(profile && profile.done)) obStart(profile);
  render();

  // iOS garde une PWA standalone suspendue plusieurs heures, voire plusieurs
  // jours : sans ça l'écran montrait le programme de la veille pendant que les
  // taps s'enregistraient à la date du jour.
  function refreshIfNewDay() {
    if (todayKey() === renderedDay) return;
    loadLog();
    render();
  }
  // AU REVEIL : la journee peut avoir change, et une version plus recente peut
  // avoir ete deployee. Les deux se verifient au meme moment et au meme endroit —
  // deux listes d'evenements auraient divergé.
  //
  // ⚠️ C'EST CE BRANCHEMENT QUI COUVRE LE CAS LE PLUS PROBABLE : une PWA iOS
  // ajoutee a l'ecran d'accueil, suspendue puis reprise apres plusieurs jours, peut
  // redemarrer SANS renavigation — donc sans que sw.js soit consulte, donc en
  // gardant son ancien JavaScript en memoire indefiniment. visibilitychange est le
  // seul signal qui arrive dans ce cas-la.
  function auReveil() {
    refreshIfNewDay();
    majSonder(false);
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) auReveil(); });
  window.addEventListener("pageshow", auReveil);
  window.addEventListener("focus", auReveil);

  appliqueTheme();
  try {
    var mqTheme = window.matchMedia("(prefers-color-scheme: light)");
    var suivreSysteme = function () {
      if (state.theme !== "systeme") return;
      appliqueTheme();
      render();
    };
    if (mqTheme.addEventListener) mqTheme.addEventListener("change", suivreSysteme);
    else if (mqTheme.addListener) mqTheme.addListener(suivreSysteme);
  } catch (e) { /* pas de matchMedia : le mode systeme restera sur sombre */ }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  // AU LANCEMENT AUSSI, et ce n'est PAS redondant avec le reseau-d'abord de sw.js.
  // Quand le reseau depasse NET_TIMEOUT_MS, sw.js sert le cache : le code qui TOURNE
  // est l'ancien, pendant que le telechargement de fond aboutit et rafraichit le
  // cache pour la prochaine fois. La sonde, elle, ne passe pas par sw.js — elle
  // porte « ?nocache= » — donc elle voit le reseau tel qu'il est.
  //
