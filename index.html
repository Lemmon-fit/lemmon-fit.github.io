  // -------------------------------------------------------------------------
  // ASSEMBLAGE
  // -------------------------------------------------------------------------
  // Ce que la journee prevoyait AVANT remplacement. Sert a nommer le bouton de
  // retour : « Revenir au cours du jour », « ... au running du jour ».
  function activitePrevue() {
    var d = deriver(), auj = jourIndexAujourdhui(), i, jr = null;
    for (i = 0; i < d.progJours.length; i++) { if (d.progJours[i].ji === auj) jr = d.progJours[i]; }
    if (!jr || !jr.acts.length) return null;
    return jr.acts[state.slotAuj < jr.acts.length ? state.slotAuj : 0];
  }

  function libelleActivitePrevue() {
    var a = activitePrevue();
    if (!a) return "programme";
    if (a.t === "cours") return "cours";
    if (a.t === "run") return "running";
    return "programme";
  }

  // L'ACTIVITE DE REMPLACEMENT DU JOUR.
  //
  // Elle n'est pas declaree au diagnostic : c'est un choix PONCTUEL, valable
  // pour aujourd'hui seulement, qui ne touche pas au programme de la semaine.
  // Un cours improvise n'a ni nom ni nature declares, d'ou les valeurs neutres.
  function actRemplacement(auj) {
    if (state.remplaceJour === "run") {
      return { t: "run", lieu: 0, ji: auj, k: 0, cle: auj + "-0", ponctuel: true };
    }
    if (state.remplaceJour === "cours") {
      return { t: "cours", nom: "Cours collectif", min: 60, nat: 1,
               ji: auj, k: 0, cle: auj + "-0", ponctuel: true };
    }
    return { t: "salle", si: state.seance, ji: auj, k: 0, cle: auj + "-0", ponctuel: true };
  }

  // REMPLACER L'ACTIVITE DU JOUR, DANS LES TROIS SENS.
  //
  // On ne pouvait echanger qu'un cours contre une seance de salle. L'inverse
  // n'existait pas, et le running non plus : declarer trois disciplines et
  // n'en laisser permuter qu'une etait arbitraire. Demande d'Olivier.
  function remplacerHtml(actuel) {
    var opts = [
      { t: "salle", l: "Une séance en salle" },
      { t: "cours", l: "Un cours collectif" },
      { t: "run",   l: "Un running" }
    ], h = "", i;
    h += '<section class="remp">';

    // LE RETOUR VIT ICI, PAS DANS LA CARTE DE SALLE.
    //
    // Il y etait, et il disparaissait des qu'on remplacait par un running ou un
    // cours : on tombait alors dans un ecran sans issue vers ce qui etait
    // prevu. Mesure avant de le corriger. Ici, il est sous TOUTES les cartes,
    // donc il existe quelle que soit la discipline de remplacement.
    if (state.remplaceJour) {
      h += '<button type="button" class="remp-retour" data-action="reprendre-prevu">' +
           "Revenir au " + esc(libelleActivitePrevue()) + " du jour</button>";
    }

    h += '<div class="remp-t">À la place, aujourd\'hui</div>';
    h += '<div class="remp-b">';
    for (i = 0; i < opts.length; i++) {
      if (opts[i].t === actuel) continue;
      h += '<button type="button" class="remp-x" data-action="remplacer-jour" data-t="' +
           opts[i].t + '">' + esc(opts[i].l) + "</button>";
    }
    return h + "</div></section>";
  }

  function actiteDuJour() {
    var d = deriver(), auj = jourIndexAujourdhui(), i, jr = null;
    for (i = 0; i < d.progJours.length; i++) { if (d.progJours[i].ji === auj) jr = d.progJours[i]; }

    // Le remplacement du jour prend la main sur ce qui etait prevu. Le drapeau
    // est necessaire : sans lui, la carte continuerait d'afficher l'activite
    // prevue, et on ne verrait pas ce qu'on vient de demander. Il retombe des
    // qu'on change de creneau ou de jour, parce que c'est un choix ponctuel.
    if (state.remplaceJour) {
      return { jour: jr, acts: jr ? jr.acts : [], act: actRemplacement(auj) };
    }

    if (!jr || jr.vide) return { jour: jr, acts: [], act: null };
    var idx = state.slotAuj < jr.acts.length ? state.slotAuj : 0;
    return { jour: jr, acts: jr.acts, act: jr.acts[idx] };
  }

  function jourHtml() {
    var ctx = contexteMotivation(), mot = motivation(ctx), du = actiteDuJour();
    var h = "", serie = ctx.streak;

    h += '<header class="jour-h">';
    h += '<div class="jour-d">' + esc(dateLongue(new Date())) + "</div>";
    h += '<div class="jour-r"><h1 class="ecran-titre">Aujourd\'hui</h1>' +
         '<div class="serie" aria-label="' + serie + ' séances validées cette semaine">' +
         '<span aria-hidden="true">🔥</span><span class="serie-n num">' + serie + "</span></div></div>";
    h += "</header>";

    h += bandeSemaineHtml();

    if (mot.head) {
      h += '<section class="motiv"><div class="motiv-h">' + esc(mot.head) + "</div>" +
           '<div class="motiv-s">' + esc(mot.sub) + "</div></section>";
    }

    h += selecteurCreneauHtml(du.acts);

    if (!du.act) h += carteReposHtml();
    else if (du.act.t === "salle") h += carteSalleHtml(du.act);
    else if (du.act.t === "cours") h += carteCoursHtml(du.act);
    else h += carteRunHtml(du.act);

    // LE BLOC DE REMPLACEMENT, COMMUN AUX TROIS DISCIPLINES. Il ne s'affiche
    // que s'il y a une activite a remplacer : un jour de repos propose deja de
    // prendre une seance d'avance, ce qui n'est pas un remplacement.
    if (du.act) h += remplacerHtml(du.act.t);

    h += resumeNutritionHtml();
    h += cartePoidsHtml();
    h += cartePeseeHtml();
    return h;
  }

  /* =========================================================================
     MODE ENTRAINEMENT, ENCHAINEMENT, FIN DE SEANCE
     -------------------------------------------------------------------------
     Plein ecran sombre, UN SEUL exercice visible. Quatre phases, portees par
     `state.phase` : "set" (on charge la barre), "repos" (le decompte tourne),
     "transition" (l'exercice est fini, on choisit le suivant) et "fin".
     ========================================================================= */

  var REPOS_DEFAUT = 90;

  function mmss(n) {
    var m = Math.floor(n / 60), s = n % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function exosCourants() { return exosDe(state.seance); }

  function faitsOu() {
    var ex, i, out;
    if (state.faits) return state.faits;
    ex = exosCourants();
    out = [];
    for (i = 0; i < ex.length; i++) out.push([]);
    return out;
  }

  function copierFaits(f) {
    var out = [], i;
    for (i = 0; i < f.length; i++) out.push(f[i].slice());
    return out;
  }

  // -------------------------------------------------------------------------
  // OUVRIR UN EXERCICE
  // -------------------------------------------------------------------------
  // Les steppers reprennent la DERNIERE serie faite sur cet exercice, sinon la
  // prescription. Repartir de zero a chaque ouverture obligerait a remonter la
  // charge a la main a chaque serie.
  function ouvrirExercice(i) {
    var ex = exosCourants(), e = ex[i], f = faitsOu();
    if (!e) return;
    var dernier = f[i] && f[i].length ? f[i][f[i].length - 1] : null;
    poser({
      ecran: "salle", demarre: true, tIdx: i, phase: "set", faits: f,
      kg: dernier ? dernier.kg : e.kg,
      reps: dernier ? dernier.reps : e.reps,
      tech: false, chrono: state.chrono || 0
    });
  }

  // -------------------------------------------------------------------------
  // VALIDER UNE SERIE
  // -------------------------------------------------------------------------
  // Quand l'exercice atteint son compte de series, on n'enchaine PAS en
  // silence : on ouvre l'ecran d'enchainement. Sauter un exercice sans l'avoir
  // vu etait le reproche principal du prototype.
  function validerSerie() {
    var ex = exosCourants(), exo = ex[state.tIdx], f0 = faitsOu(), faits, i, reste = false;
    if (!exo) return;
    if (f0[state.tIdx].length >= exo.n) return;

    faits = copierFaits(f0);
    faits[state.tIdx].push({ kg: state.kg, reps: state.reps });

    if (faits[state.tIdx].length >= exo.n) {
      for (i = 0; i < ex.length; i++) {
        if (faits[i].length < ex[i].n) { reste = true; break; }
      }
      poser({ faits: faits, finiIdx: state.tIdx,
              phase: reste ? "transition" : "fin",
              ecran: reste ? "trans" : "salle" });
    } else {
      // `reposTotal` retient la duree de DEPART du repos. L'anneau en a besoin
      // pour dessiner une proportion : sans elle, ajouter 30 s ferait remonter
      // l'arc au-dela du tour complet.
      // Le repos PROPRE A L'EXERCICE gagne quand il y en a un. Il vient d'un
      // changement accepte de l'assistant (« Repos porté à 2 min sur les
      // barres ») : l'appliquer sans que le decompte suive n'aurait rien
      // change de ce qu'on vit entre deux series.
      var r = exo.repos || state.repos || REPOS_DEFAUT;
      poser({ faits: faits, phase: "repos", repos: r, reposTotal: r });
    }
  }

  // -------------------------------------------------------------------------
  // LE CHRONO
  // -------------------------------------------------------------------------
  // Un seul intervalle pour toute l'appli, arme au demarrage. Il ne fait rien
  // hors du mode entrainement : le tester ici plutot que d'armer et desarmer
  // evite la classe de bugs ou deux intervalles se superposent.
  var _tic = null;

  function armerChrono() {
    if (_tic) return;
    _tic = window.setInterval(function () {
      if (state.ecran !== "salle" || !state.demarre) return;
      if (state.phase === "repos") {
        if (state.repos <= 1) {
          state.phase = "set";
          state.repos = REPOS_DEFAUT;
        } else {
          state.repos = state.repos - 1;
        }
        state.chrono = state.chrono + 1;
        rendre();
      } else if (state.phase === "set") {
        state.chrono = state.chrono + 1;
        majChrono();
      }
    }, 1000);
  }

  // Pendant une serie, SEUL le chiffre du chrono change. Reconstruire tout
  // l'ecran chaque seconde relancerait le rendu 3 600 fois par heure et
  // reprendrait le focus des champs. On touche donc le seul noeud concerne.
  function majChrono() {
    var n = document.getElementById("chrono-v");
    if (n) n.innerHTML = esc(mmss(state.chrono));
  }

  function stepper(action, val, unite, libelle) {
    return '<div class="st"><div class="st-l">' + esc(libelle) + "</div>" +
      '<div class="st-r">' +
      '<button type="button" class="st-b" data-action="' + action + '" data-d="-1"' +
      ' aria-label="Diminuer ' + esc(libelle) + '">−</button>' +
      '<div class="st-v num">' + esc(String(val).replace(".", ",")) +
      (unite ? '<span class="st-u">' + esc(unite) + "</span>" : "") + "</div>" +
      '<button type="button" class="st-b" data-action="' + action + '" data-d="1"' +
      ' aria-label="Augmenter ' + esc(libelle) + '">+</button></div></div>';
  }

  // Un nombre a la francaise : virgule decimale, jamais le point.
  function fmtNb(v) { return String(v).replace(".", ","); }

  // Les milliers separes par une espace, comme la maquette ecrit « 1 360 ».
  // Une espace INSECABLE : sans elle, « 1 360 kg » peut se couper en fin de
  // ligne et le 1 se retrouve seul au-dessus de 360.
  function millier(n) {
    var s = String(Math.abs(Math.round(n))), out = "", i, c = 0;
    for (i = s.length - 1; i >= 0; i--) {
      out = s.charAt(i) + out;
      c++;
      if (c % 3 === 0 && i > 0) out = " " + out;
    }
    return (n < 0 ? "-" : "") + out;
  }

  // Ce que vaut une serie, ecrit comme l'appli l'ecrit partout ailleurs. Un
  // exercice chronometre n'a pas de charge : « 6 min », et surtout pas
  // « 0 kg × 6 ».
  function libelleSerie(kg, reps, exo) {
    if (exo.unite === "min") return reps + " min";
    return fmtNb(kg) + " kg × " + reps;
  }

  // Avancement de la SEANCE ENTIERE, series faites sur series prevues. La
  // maquette en fait une barre fine sous l'en-tete : on sait ou l'on en est
  // sans avoir a compter les exercices restants.
  function avancementSeance() {
    var ex = exosCourants(), f = faitsOu(), i, faites = 0, prevues = 0;
    for (i = 0; i < ex.length; i++) {
      prevues += ex[i].n;
      faites += f[i] ? f[i].length : 0;
    }
    return prevues ? Math.round(faites * 100 / prevues) : 0;
  }

  // L'EN-TETE, PARTAGE PAR LES TROIS ECRANS DU MODE ENTRAINEMENT.
  //
  // La maquette y met quatre choses : la croix qui quitte, une fleche qui
  // revient a la liste des exercices, le rang de l'exercice dans la seance, et
  // le chrono. Dessous, une barre fine porte l'avancement.
  //
  // Le code de la seance (« PUSH ») n'y figure plus : il occupait la place du
  // rang, et c'est le rang qui dit ou l'on en est. Le code reste lisible sur
  // l'ecran d'ou l'on vient et sur celui de fin.
  function enteteSalleHtml(rang, total) {
    var h = '<div class="sa-haut">';
    h += '<button type="button" class="sa-rond" data-action="quitter-seance"' +
         ' aria-label="Quitter la séance">✕</button>';
    h += '<button type="button" class="sa-rond" data-action="aller-trans"' +
         ' aria-label="Revenir à la liste des exercices">‹</button>';
    h += '<div class="sa-pos">' +
         (rang > 0 ? 'Exercice <b class="num">' + rang + '</b> / <b class="num">' + total + "</b>" : "") +
         "</div>";
    h += '<div class="sa-chrono num" id="chrono-v">' + esc(mmss(state.chrono)) + "</div>";
    h += "</div>";
    h += '<div class="sa-barre"><span class="sa-barre-v" style="width:' +
         avancementSeance() + '%"></span></div>';
    // L'ENTETE OUVRE LE CORPS DE L'ECRAN, ET C'EST LUI QUI SE CENTRE.
    //
    // Les quatre ecrans du mode entrainement laissaient un grand vide en bas :
    // mesure a 375 x 812, 313 px sur le repos, 233 px sur la serie, 238 px sur
    // la fin de seance. Demande d'Olivier de les recentrer, les quatre, pour
    // qu'ils se ressemblent.
    //
    // Le centrage ne peut PAS etre pose sur `.salle` : la croix, la fleche, le
    // compteur d'exercice, le chrono et la barre d'avancement sont ses enfants
    // directs, ils descendraient avec le reste. D'ou ce conteneur, ouvert ici et
    // ferme par chacun des quatre ecrans : l'entete reste en haut, le corps se
    // centre dans ce qui reste.
    h += '<div class="sa-corps">';
    return h;
  }

  // L'ANNEAU DU REPOS. Il dit une PROPORTION avant de dire un chiffre : on voit
  // qu'il reste un quart du temps sans avoir lu « 0:22 ».
  //
  // Trace en SVG et pas en conic-gradient : le degrade conique n'est pas anime
  // et se rend mal sur les Safari un peu anciens, ce qui est exactement le parc
  // vise par une PWA iPhone.
  function anneauReposHtml() {
    var tot = state.reposTotal > 0 ? state.reposTotal : REPOS_DEFAUT;
    var reste = state.repos < 0 ? 0 : state.repos;
    var part = tot > 0 ? Math.min(1, reste / tot) : 0;
    var R = 78, C = 2 * Math.PI * R;
    var h = '<div class="sa-anneau">';
    h += '<svg viewBox="0 0 180 180" aria-hidden="true">';
    h += '<circle class="sa-anneau-fond" cx="90" cy="90" r="' + R + '"></circle>';
    h += '<circle class="sa-anneau-arc" cx="90" cy="90" r="' + R + '"' +
         ' stroke-dasharray="' + C.toFixed(1) + '"' +
         ' stroke-dashoffset="' + (C * (1 - part)).toFixed(1) + '"></circle>';
    h += "</svg>";
    h += '<div class="sa-anneau-c">' +
         '<div class="sa-anneau-v num">' + esc(mmss(reste)) + "</div>" +
         '<div class="sa-anneau-s">souffle</div></div>';
    return h + "</div>";
  }

  // ANNULER LA DERNIERE SERIE SAISIE. Elle n'existait pas : une valeur validee
  // par erreur restait dans le tonnage et dans l'historique sans aucun moyen de
  // la reprendre. On retire la derniere serie de l'exercice COURANT et on
  // repose les steppers sur ses valeurs, pour pouvoir la resaisir aussitot.
  function annulerSerie() {
    var f0 = faitsOu(), faits, d;
    if (!f0[state.tIdx] || !f0[state.tIdx].length) return;
    faits = copierFaits(f0);
    d = faits[state.tIdx].pop();
    poser({ faits: faits, phase: "set",
            kg: d ? d.kg : state.kg, reps: d ? d.reps : state.reps });
  }

  // -------------------------------------------------------------------------
  // L'ECRAN
  // -------------------------------------------------------------------------
  function salleHtml() {
    var ex = exosCourants(), exo = ex[state.tIdx], f = faitsOu(), i, d;
    // Cet ecran n'a pas d'entete, donc il ouvre son corps lui-meme : sans quoi
    // il serait le seul des cinq a ne pas se centrer.
    if (!exo) return '<div class="salle"><div class="sa-corps">' +
      '<p class="sa-vide">Aucun exercice.</p>' +
      '<button type="button" class="sa-quitter" data-action="quitter-seance">Quitter</button>' +
      "</div></div>";

    if (state.phase === "fin") return finHtml();

    var faites = f[state.tIdx] ? f[state.tIdx].length : 0;
    var h = '<div class="salle">';

    h += enteteSalleHtml(state.tIdx + 1, ex.length);

    // ---- LE REPOS A SON PROPRE ECRAN ----
    // Il ne s'ajoute plus sous la fiche de l'exercice : pendant le repos, il
    // n'y a qu'une chose a savoir, c'est le temps qui reste et ce qui vient
    // apres. Les trois boutons « −15 s / Passer / +15 s » deviennent les deux
    // de la maquette : allonger, ou repartir.
    if (state.phase === "repos") {
      h += '<div class="sa-repos-l">Repos</div>';
      h += anneauReposHtml();
      h += '<div class="sa-ensuite-l">Ensuite</div>';
      h += '<div class="sa-ensuite-n">' + esc(exo.nom) + "</div>";
      h += '<div class="sa-ensuite-d num">Série ' + (faites + 1) + " · " +
           esc(libelleSerie(state.kg, state.reps, exo)) + "</div>";
      h += '<div class="sa-repos-btns">';
      h += '<button type="button" class="sa-act" data-action="repos-regler" data-d="30">+ 30 s</button>';
      h += '<button type="button" class="sa-valider sa-valider-court"' +
           ' data-action="repos-passer">C\'est reparti</button>';
      h += "</div>";
      return h + "</div></div>";
    }

    // ---- LA SERIE ----
    h += '<div class="sa-muscle">' + esc(exo.muscle || "") + "</div>";
    h += '<div class="sa-exo">' + esc(exo.nom) + "</div>";
    h += '<div class="sa-mat">' + esc(exo.mat || "") + "</div>";

    // LES PASTILLES DE SERIE, une par serie prevue. Celles qui sont faites
    // portent leur valeur, les autres un tiret : on voit ce qui reste d'un coup
    // d'oeil, sans lire une phrase. Elles remplacent la rangee de jetons qui
    // vivait tout en bas de l'ecran, loin de la question qu'elle documentait.
    h += '<div class="sa-pastilles">';
    for (i = 0; i < exo.n; i++) {
      d = f[state.tIdx] ? f[state.tIdx][i] : null;
      h += '<div class="sa-past' + (d ? " sa-past-ok" : "") + '">' +
           '<span class="sa-past-r">S' + (i + 1) + "</span>" +
           '<span class="sa-past-v num">' +
           (d ? esc(exo.unite === "min" ? d.reps + " min" : fmtNb(d.kg) + "×" + d.reps) : "—") +
           "</span></div>";
    }
    h += "</div>";

    // LA CARTE DE SAISIE. La maquette enferme dans un meme cadre le rang de la
    // serie, ce qui a ete fait la derniere fois, les deux molettes et le bouton
    // de validation. Repartis a plat, ces quatre elements ne se lisaient pas
    // comme UNE question.
    h += '<div class="sa-carte">';
    h += '<div class="sa-carte-h">' +
         '<span class="sa-serie">Série <b class="num">' + (faites + 1) +
         '</b> sur <b class="num">' + exo.n + "</b></span>";
    if (exo.last) {
      h += '<span class="sa-dernier">Dernière fois : <span class="num">' +
           esc(exo.last) + "</span></span>";
    }
    h += "</div>";

    h += '<div class="sa-steppers">';
    h += stepper("kg-pas", state.kg, exo.unite === "min" ? "" : "kg", "Charge");
    h += stepper("reps-pas", state.reps, exo.unite ? exo.unite : "reps",
                 exo.unite === "min" ? "Durée" : "Répétitions");
    h += "</div>";

    // REPRENDRE LA SERIE PRECEDENTE, EN UN TOUCHER.
    //
    // Fonctionnalite de la v1.20.0, perdue au passage : la maquette n'a
    // aucun ecran de mode entrainement, donc elle ne pouvait pas la porter,
    // et je ne l'ai pas retrouvee tout seul. Signalee par Olivier a l'usage.
    //
    // LE BOUTON ANNONCE CE QU'IL VA ECRIRE. « 65 kg × 8 » plutot que
    // « Refaire » : on sait avant de toucher, et on ne decouvre pas la
    // valeur apres coup. Il n'existe JAMAIS sur la premiere serie, faute de
    // precedente a reprendre.
    //
    // Il ECRIT vraiment, par le meme chemin que la saisie a la main : le
    // tonnage, l'historique et la fiche d'exercice le comptent comme une
    // serie ordinaire, parce que c'en est une.
    if (faites > 0) {
      var prec = f[state.tIdx][faites - 1];
      h += '<button type="button" class="sa-reprendre" data-action="reprendre-serie">' +
           '<span class="sa-r-l">Comme la précédente</span>' +
           '<span class="sa-r-v num">' + esc(libelleSerie(prec.kg, prec.reps, exo)) +
           "</span></button>";
    }

    // LE BOUTON DE VALIDATION ANNONCE LUI AUSSI CE QU'IL ECRIT. « Valider
    // 40 kg × 8 » et non « Valider la série » : la valeur se lit avant le
    // geste, pas apres.
    h += '<button type="button" class="sa-valider" data-action="valider-serie">Valider ' +
         esc(libelleSerie(state.kg, state.reps, exo)) + "</button>";
    h += "</div>";

    // LES DEUX BOUTONS DU BAS.
    //
    // La maquette les pose cote a cote sous la carte de validation, et Olivier
    // a dit « Comment faire ? » non negociable. Ils remplacent le lien souligne
    // « Voir les autres exercices », qui se lisait comme du texte et pas comme
    // une action — le meme defaut qu'avait le bouton video de la fiche.
    //
    // « Changer d'exercice » mene a l'ecran d'enchainement, ou l'on choisit le
    // mouvement suivant. C'est l'action que portait le lien : elle change ce
    // qu'on fait maintenant, elle ne touche pas au programme.
    h += '<div class="sa-actions">';
    h += '<button type="button" class="sa-act' + (state.tech ? " sa-act-on" : "") + '"' +
         ' aria-expanded="' + (state.tech ? "true" : "false") + '"' +
         ' aria-controls="sa-tech" data-action="basculer-tech">Comment faire ?</button>';
    h += '<button type="button" class="sa-act" data-action="aller-trans">Changer d\'exercice</button>';
    h += "</div>";

    // LE MEMO, replie par defaut. Il sort des `lines` de l'exercice, les memes
    // que la fiche : une seule source, pas une seconde redaction a tenir.
    if (state.tech) {
      h += '<section class="sa-tech" id="sa-tech">';
      if (exo.lines && exo.lines.length) {
        for (var t = 0; t < exo.lines.length; t++) {
          h += '<div class="sa-tech-l"><span class="sa-tech-n" aria-hidden="true">' + (t + 1) +
               "</span><span>" + esc(exo.lines[t]) + "</span></div>";
        }
      } else {
        // Ce cas existe pour de vrai : un exercice refuse est remplace par son
        // equivalent, et le remplacant n'emporte pas les consignes de celui
        // qu'il remplace. On le dit, au lieu d'afficher un bloc vide.
        h += '<p class="sa-tech-vide">Pas de mémo écrit pour cet exercice.</p>';
      }
      h += '<a class="sa-tech-video" target="_blank" rel="noopener noreferrer" href="' +
           "https://www.youtube.com/results?search_query=" +
           encodeURIComponent(exo.nom + " technique musculation") +
           '"><span aria-hidden="true">▶</span> Voir une vidéo de ce mouvement</a>';
      h += "</section>";
    }

    // ANNULER, EN NOMMANT CE QUI SERA ANNULE. « Annuler la série 1 » et non
    // « Annuler la dernière série » : on sait laquelle part avant de toucher,
    // comme pour les deux autres boutons de cet ecran. Il n'apparait que s'il
    // y a quelque chose a annuler.
    if (faites > 0) {
      h += '<button type="button" class="sa-annuler" data-action="annuler-serie">' +
           "Annuler la série " + faites + "</button>";
    }

    return h + "</div></div>";
  }

  // ECRAN D'ENCHAINEMENT : le suivant est PROPOSE, les autres restent
  // accessibles en un toucher. C'est la reponse au reproche principal.
  function transHtml() {
    var ex = exosCourants(), f = faitsOu(), i, suivant = -1, e, n;
    for (i = 0; i < ex.length; i++) {
      if (f[i].length < ex[i].n && i !== state.finiIdx) { suivant = i; break; }
    }

    var reste = 0, fini = ex[state.finiIdx];
    for (i = 0; i < ex.length; i++) { if (f[i].length < ex[i].n) reste++; }

    var h = '<div class="salle">';
    h += enteteSalleHtml(state.finiIdx + 1, ex.length);

    // LE BLOC VERT. Il manquait entierement : l'ecran s'ouvrait sur « Fin de
    // l'exercice » en titre, ce qui annonce la suite au lieu de fermer ce qui
    // vient d'etre fait. La maquette accuse reception d'abord, en vert, avec le
    // nom de l'exercice et le nombre de series tenues.
    if (fini) {
      h += '<section class="tr-fait">' +
           '<span class="tr-fait-p" aria-hidden="true">✓</span>' +
           '<span class="tr-fait-c">' +
           '<span class="tr-fait-l">Exercice terminé</span>' +
           '<span class="tr-fait-n">' + esc(fini.nom) + "</span>" +
           '<span class="tr-fait-d num">' + f[state.finiIdx].length + " série" +
           (f[state.finiIdx].length > 1 ? "s" : "") + "</span></span></section>";
    }

    h += '<div class="tr-t">On enchaîne avec quoi ?</div>';
    h += '<p class="tr-s">' + (reste > 0
      ? "Il reste <b class=\"num\">" + reste + "</b> exercice" + (reste > 1 ? "s" : "") +
        " dans cette séance. Prends celui que la machine libre te permet."
      : "Tous les exercices sont faits. Tu peux terminer la séance.") + "</p>";

    if (suivant >= 0) {
      h += '<button type="button" class="tr-suivant" data-action="ouvrir-exo" data-i="' + suivant + '">' +
           '<span class="tr-s-l">Prévu ensuite</span>' +
           '<span class="tr-s-n">' + esc(ex[suivant].nom) + "</span>" +
           '<span class="tr-s-d num">' + esc(ex[suivant].n + " série" +
           (ex[suivant].n > 1 ? "s" : "") + " · " +
           libelleSerie(ex[suivant].kg, ex[suivant].reps, ex[suivant])) + "</span></button>";
    }

    // LA LISTE N'Y REMET PAS CELUI QUI EST DEJA PROPOSE AU-DESSUS. Le voir deux
    // fois a deux endroits ferait hesiter sur ce qui les distingue.
    h += '<div class="tr-autres-t">Ou prends-en un autre</div><ul class="tr-liste">';
    for (i = 0; i < ex.length; i++) {
      if (i === suivant) continue;
      e = ex[i];
      n = f[i].length;
      h += '<li><button type="button" class="tr-a' + (n >= e.n ? " tr-a-fini" : "") + '"' +
           ' data-action="ouvrir-exo" data-i="' + i + '">' +
           '<span class="tr-a-r num" aria-hidden="true">' + (i + 1) + "</span>" +
           '<span class="tr-a-c"><span class="tr-a-n">' + esc(e.nom) + "</span>" +
           '<span class="tr-a-d num">' + esc(e.n + " × " + e.reps +
           (e.unite ? " " + e.unite : (e.kg ? " " + fmtNb(e.kg) + " kg" : ""))) + "</span></span>" +
           '<span class="tr-a-e">' + (n >= e.n ? "✓ fait" : "") + "</span></button></li>";
    }
    h += "</ul>";
    h += '<button type="button" class="sa-quitter" data-action="finir-seance">Terminer la séance ici</button>';
    return h + "</div></div>";
  }

  function finHtml() {
    var ex = exosCourants(), f = faitsOu(), i, j, series = 0, tonnage = 0;
    for (i = 0; i < ex.length; i++) {
      series += f[i].length;
      for (j = 0; j < f[i].length; j++) {
        if (ex[i].unite !== "min") tonnage += f[i][j].kg * f[i][j].reps;
      }
    }
    var ctx = contexteMotivation(), mot = motivation(ctx);

    var h = '<div class="salle">';
    h += enteteSalleHtml(state.tIdx + 1, ex.length);

    // LA PASTILLE, PUIS LE TITRE. La maquette accuse reception par un rond
    // jaune avant d'ecrire quoi que ce soit : on sait que c'est fini avant
    // d'avoir lu. L'ecran s'ouvrait sur un titre seul.
    h += '<div class="fin-rond" aria-hidden="true">✓</div>';
    h += '<div class="fin-t">Séance bouclée</div>';
    h += '<p class="fin-s"><span class="num">' + series + "</span> série" +
         (series > 1 ? "s" : "") + " enregistrée" + (series > 1 ? "s" : "") +
         " sur la séance " + esc(SEANCES[state.seance].code) + ".</p>";

    if (mot.head) {
      h += '<div class="fin-motiv"><div class="motiv-h">' + esc(mot.head) + "</div>" +
           '<div class="motiv-s">' + esc(mot.sub) + "</div></div>";
    }

    // LES TROIS CHIFFRES, dans l'ordre de la maquette : le temps passe, ce qui
    // a ete souleve, et la serie de jours. Le nombre de series a quitte les
    // tuiles pour la phrase au-dessus, ou il se lit mieux.
    h += '<div class="fin-chiffres">' +
         '<div class="fin-c"><span class="fin-n num">' + esc(mmss(state.chrono)) +
         '</span><span class="fin-cl">durée</span></div>' +
         '<div class="fin-c"><span class="fin-n num">' + esc(millier(Math.round(tonnage))) +
         '</span><span class="fin-cl">kg soulevés</span></div>' +
         '<div class="fin-c"><span class="fin-n num">' + ctx.streak +
         ' <span aria-hidden="true">🔥</span></span><span class="fin-cl">jours d\'affilée</span></div>' +
         "</div>";

    // CE QUI A BOUGE. Le bloc manquait entierement.
    //
    // Il compare la charge la plus lourde tenue AUJOURD'HUI sur chaque exercice
    // a celle de la DERNIERE seance qui le portait, lue dans le journal. Rien
    // n'est invente : sans passe sur un mouvement, il n'a pas de ligne, et la
    // section disparait si rien n'a bouge. Un « + 0 kg » ne dirait rien.
    var bouges = [], meilleure, avant, k;
    for (i = 0; i < ex.length; i++) {
      if (!f[i].length || ex[i].unite === "min") continue;
      meilleure = 0;
      for (k = 0; k < f[i].length; k++) {
        if (f[i][k].kg > meilleure) meilleure = f[i][k].kg;
      }
      avant = seancesDeExercice(ex[i].nom, 1);
      if (!avant.length) continue;
      if (meilleure > avant[0].kg) {
        bouges.push({ nom: ex[i].nom, delta: meilleure - avant[0].kg });
      }
    }
    if (bouges.length) {
      h += '<div class="fin-bouge-t">Ce qui a bougé</div><ul class="fin-bouge">';
      for (i = 0; i < bouges.length; i++) {
        h += '<li><span class="fin-b-n">' + esc(bouges[i].nom) + "</span>" +
             '<span class="fin-b-v num">+ ' + esc(fmtNb(bouges[i].delta)) + " kg</span></li>";
      }
      h += "</ul>";
    }

    h += '<button type="button" class="sa-valider" data-action="enregistrer-seance">' +
         "Enregistrer la séance</button>";
    return h + "</div></div>";
  }

  // -------------------------------------------------------------------------
  // ENREGISTREMENT
  // -------------------------------------------------------------------------
  // UNE SEULE PORTE pour les trois disciplines. Valider un cours ou une sortie
  // fait EXACTEMENT ce que fait une seance de salle : ecrire actFaits, poser le
  // texte d'archive, et naviguer vers l'Historique. Trois chemins separes
  // auraient diverge des la premiere retouche, et deux disciplines sur trois
  // seraient restees invisibles dans la liste.
  // `enr` porte le detail de la seance ; `texte` est sa ligne d'archive.
  // UNE SEULE ECRITURE POUR LES TROIS DISCIPLINES : c'est ce qui garantit
  // qu'un cours et une sortie apparaissent dans l'Historique au meme titre
  // qu'une seance de salle, et pas seulement dans un bandeau qu'on ferme.
  function archiver(enr, texte) {
    var h = (state.hist || []).slice(), i, maj = {}, k;

    // Une meme date et un meme creneau ne peuvent porter qu'une seance : on
    // remplace au lieu d'empiler. Sans ca, valider deux fois de suite
    // comptabiliserait deux seances et fausserait tonnage comme assiduite.
    for (i = h.length - 1; i >= 0; i--) {
      if (h[i].d === enr.d && h[i].ji === enr.ji && h[i].k === enr.k) h.splice(i, 1);
    }
    h.push(enr);
    // Borne haute : au-dela, la sauvegarde grossit sans fin. Deux ans de
    // seances a raison de cinq par semaine tiennent largement dessous.
    if (h.length > 600) h = h.slice(h.length - 600);

    state.hist = h;
    maj = faitsSemaine();
    for (k in state.actFaits) { if (has(state.actFaits, k) && !maj[k]) maj[k] = 0; }

    poser({
      hist: h,
      actFaits: maj,
      archive: texte,
      ecran: "histo",
      phase: "set", demarre: false, faits: null, tIdx: 0, chrono: 0, finiIdx: 0
    });
    window.scrollTo(0, 0);
  }

  function enregistrerSeance() {
    var ex = exosCourants(), f = faitsOu(), i, j, series = 0, tonnage = 0, detail = [];
    var d = deriver(), auj = jourIndexAujourdhui(), k = null;

    for (i = 0; i < ex.length; i++) {
      series += f[i].length;
      for (j = 0; j < f[i].length; j++) {
        if (ex[i].unite !== "min") tonnage += f[i][j].kg * f[i][j].reps;
      }
      // On garde le detail serie par serie : c'est lui, et lui seul, qui
      // permettra a la fiche d'exercice de tracer une courbe de charge.
      if (f[i].length) detail.push({ nom: ex[i].nom, unite: ex[i].unite || "", sets: f[i].slice() });
    }

    // On archive sur le CRENEAU du jour qui porte cette seance, pas sur le
    // premier : une salle peut occuper le second.
    for (i = 0; i < d.slotsSalle.length; i++) {
      if (d.slotsSalle[i].ji === auj && d.slotsSalle[i].a.si === state.seance) {
        k = d.slotsSalle[i].a.k;
      }
    }
    if (k === null) k = state.slotAuj || 0;

    archiver({
      d: cleDate(new Date()), ji: auj, k: k, t: "salle",
      si: state.seance, code: SEANCES[state.seance].code,
      exos: detail.length, tonnage: Math.round(tonnage), series: series,
      sec: state.chrono, ex: detail
      // Second argument : LA LIGNE DU BANDEAU VERT. Elle disait
      // « PUSH · 5 exos · 1360 kg · 7:27 » et la maquette dit
      // « PUSH · mercredi 24 août · 5 séries, 1 360 kg ». Le JOUR compte plus
      // que le chrono : le bandeau confirme QUAND une séance est entrée au
      // journal, et la durée se relit dans la fiche.
    }, SEANCES[state.seance].code + " · " + dateLongue(new Date()).toLowerCase() +
       " · " + series + " série" + (series > 1 ? "s" : "") +
       ", " + millier(Math.round(tonnage)) + " kg");
  }

  function validerActivite(ji, k) {
    var liste = state.obAct[ji] || [], a = liste[k], txt, enr;
    // UN REMPLACEMENT PONCTUEL N'EST PAS DECLARE dans obAct : la lecture par
    // creneau ne le trouve pas, et le bouton « J'ai fait le cours » ne faisait
    // alors RIEN, sans un mot. On prend donc l'activite de remplacement quand
    // il y en a une.
    if (state.remplaceJour && ji === jourIndexAujourdhui()) a = actRemplacement(ji);
    if (!a) return;

    if (a.t === "cours") {
      txt = (a.nom || "Cours") + " · " + NATURES[a.nat].t + " · " + a.min + " min";
      enr = { d: cleDate(new Date()), ji: ji, k: k, t: "cours",
              nom: a.nom || "Cours", nat: a.nat, min: a.min };
    } else if (a.t === "run") {
      txt = "Running · " + LIEUX[a.lieu].t +
            (state.runKm ? " · " + state.runKm + " km" : "") +
            (state.runMin ? " · " + state.runMin + " min" : "");
      enr = { d: cleDate(new Date()), ji: ji, k: k, t: "run",
              lieu: a.lieu, km: state.runKm, minutes: state.runMin };
    } else {
      txt = "Séance de salle";
      enr = { d: cleDate(new Date()), ji: ji, k: k, t: "salle",
              si: a.si, code: SEANCES[a.si].code, exos: 0, tonnage: 0, series: 0, sec: 0, ex: [] };
    }
    archiver(enr, txt);
  }

  // La pesee entre dans SA propre liste, pas dans le journal des seances : ce
  // n'est pas un entrainement, et la melanger fausserait le compte de seances.
  function noterPesee() {
    var p = (state.pesees || []).slice(), i, cle = cleDate(new Date());
    var kg = nombreOu(state.obPoids, 0);
    if (!kg) return;
    for (i = p.length - 1; i >= 0; i--) { if (p[i].d === cle) p.splice(i, 1); }
    p.push({ d: cle, kg: kg });
    poser({ pesees: p, peseeFaite: true });
  }

  function demarrerSeance() {
    var ex = exosCourants(), i, f = [];
    for (i = 0; i < ex.length; i++) f.push([]);
    poser({ ecran: "salle", demarre: true, tIdx: 0, phase: "set", faits: f,
            kg: ex[0] ? ex[0].kg : 0, reps: ex[0] ? ex[0].reps : 0,
            chrono: 0, repos: REPOS_DEFAUT, finiIdx: 0 });
  }

  function quitterSeance() {
    poser({ ecran: "jour", demarre: false, phase: "set" });
  }

  /* =========================================================================
     LES TROIS ECRANS DE LECTURE — Historique, Fiche exercice, Progres
     -------------------------------------------------------------------------
     Ils lisent tous le JOURNAL DATE. Aucun ne lit la constante HISTO du
     prototype, qui contient sept seances inventees : les livrer donnerait le
     meme passe a tout le monde.
     ========================================================================= */

  /* -------------------------------------------------------------------------
     LA COURBE, partagee par la fiche d'exercice et l'ecran Progres
     -------------------------------------------------------------------------
     UNE COURBE, PAS UN HISTOGRAMME. Ce sont des valeurs RELEVEES semaine apres
     semaine, pas des quantites empilees : une barre suggere un cumul qui
     n'existe pas.

     CADRAGE SUR LA PLAGE REELLEMENT PARCOURUE : y = 90 - (v-min)/(max-min)*80.
     Une courbe de poids partant d'un zero implicite ecraserait 2,8 kg perdus
     en une ligne plate ; cadrer sur l'amplitude reelle rend le mouvement
     lisible. La consequence arithmetique compte : la valeur MAX tombe donc
     toujours a y=10 et la MIN a y=90, ce qui est exactement ou se posent les
     deux pointilles de repere. Ils coincident par construction, pas par
     reglage — et ils resteront alignes si la formule change, a condition de
     changer les deux ensemble.

     preserveAspectRatio="none" etire le viewBox aux dimensions reelles : c'est
     ce qui permet de raisonner en pourcentages. En contrepartie le trait
     serait etire lui aussi, d'ou vector-effect="non-scaling-stroke" sur la
     ligne — sans lui, l'epaisseur varie avec la largeur de l'ecran.
     ------------------------------------------------------------------------- */
  var COURBE_HAUT = 10, COURBE_BAS = 90;

  function courbePoints(vals) {
    var i, min = null, max = null, out = [], x, y, n = vals.length;
    for (i = 0; i < n; i++) {
      if (min === null || vals[i] < min) min = vals[i];
      if (max === null || vals[i] > max) max = vals[i];
    }
    if (min === null) return { pts: [], min: 0, max: 0 };
    for (i = 0; i < n; i++) {
      x = n > 1 ? (i / (n - 1)) * 100 : 50;
      // Plage nulle : tout est a la meme valeur. On pose la ligne au MILIEU
      // plutot qu'en haut ou en bas, sinon une serie parfaitement stable
      // ressemblerait a un record ou a un effondrement.
      y = (max === min) ? 50 : COURBE_BAS - ((vals[i] - min) / (max - min)) * (COURBE_BAS - COURBE_HAUT);
      out.push({ x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100, v: vals[i] });
    }
    return { pts: out, min: min, max: max };
  }

  // `libelle` nomme ce que la courbe mesure (« kilomètres courus par semaine »),
  // `teinte` la colore. LES DEUX MANQUAIENT : une courbe sans libelle laisse
  // deviner son sujet, et une courbe toujours citron ne dit pas qu'on a change
  // de mode. La maquette colore la serie avec la teinte de sa discipline.
  function courbeHtml(vals, unite, etiqDepart, etiqFin, ecart, libelle, teinte) {
    var c = courbePoints(vals), i, ligne = [], aire = [], dernier;
    if (!c.pts.length) return '<div class="cb-vide">Pas encore de mesure.</div>';
    teinte = teinte || { trait: "var(--citron-courbe)", aire: "var(--salle-pale)", encre: "var(--citron-encre)" };

    for (i = 0; i < c.pts.length; i++) { ligne.push(c.pts[i].x + "," + c.pts[i].y); }
    aire = ligne.slice();
    aire.unshift(c.pts[0].x + ",100");
    aire.push(c.pts[c.pts.length - 1].x + ",100");
    dernier = c.pts[c.pts.length - 1];

    var h = "";
    // L'EN-TETE : ce que la courbe mesure a gauche, l'ecart a droite, sur la
    // meme ligne. C'est la disposition de la maquette, et elle evite d'avoir a
    // deviner l'unite en lisant l'axe.
    h += '<div class="cb-tete"><span class="cb-lbl">' + esc(libelle || "") + "</span>" +
         (ecart ? '<span class="cb-ecart" style="color:' + teinte.encre + '">' +
                  esc(ecart) + "</span>" : "") + "</div>";
    h += '<div class="cb">';
    h += '<div class="cb-axe"><span class="cb-a-h">' + esc(fmtVal(c.max) + unite) + "</span>" +
         '<span class="cb-a-b">' + esc(fmtVal(c.min) + unite) + "</span></div>";
    h += '<div class="cb-zone">';
    h += '<div class="cb-guide cb-guide-h"></div><div class="cb-guide cb-guide-b"></div>';
    h += '<svg class="cb-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
         '<polyline class="cb-aire" points="' + aire.join(" ") + '" fill="' + teinte.aire + '"></polyline>' +
         '<polyline class="cb-ligne" points="' + ligne.join(" ") + '" stroke="' + teinte.trait + '"' +
         ' vector-effect="non-scaling-stroke"></polyline></svg>';
    h += '<span class="cb-point" style="left:' + dernier.x + "%;top:" + dernier.y +
         "%;background:" + teinte.trait + '"></span>';
    h += "</div>";
    h += '<div class="cb-pieds"><span class="cb-p">' + esc(etiqDepart) + "</span>" +
         '<span class="cb-p">' + esc(etiqFin) + "</span></div>";
    return h + "</div>";
  }

  function fmtVal(v) {
    if (v >= 1000) return String(Math.round(v));
    return String(Math.round(v * 10) / 10).replace(".", ",");
  }

  /* -------------------------------------------------------------------------
     HISTORIQUE
     ------------------------------------------------------------------------- */
  var LEGENDE = [
    { t: "Salle", c: "salle" }, { t: "Cours", c: "cours" }, { t: "Running", c: "run" },
    { t: "Repos", c: "repos" }, { t: "Manqué", c: "manque" }
  ];

  function histoHtml() {
    var h = "", d = deriver(), rech = (state.recherche || "").toLowerCase();

    if (state.archive) {
      // LA PASTILLE VERTE MANQUAIT. Le bandeau s'ouvrait sur du texte : c'est
      // un accuse de reception, et un accuse de reception se voit avant de se
      // lire. La maquette met un rond vert avec une coche devant.
      h += '<div class="bandeau-ok">' +
           '<span class="bo-p" aria-hidden="true">✓</span>' +
           '<span class="bo-t">Séance enregistrée' +
           '<span class="bo-s">' + esc(state.archive) + "</span></span>" +
           '<button type="button" class="bo-x" data-action="fermer-bandeau" aria-label="Fermer">✕</button></div>';
    }

    h += '<div class="ob-champ"><label class="ob-champ-l" for="rech">Chercher un exercice</label>' +
         '<input id="rech" class="ob-input ob-input-txt" type="text" placeholder="développé, squat…"' +
         ' value="' + esc(state.recherche || "") + '" data-action="recherche"></div>';

    if (rech) { h += resultatsRechercheHtml(rech); }

    h += calendrierHtml();
    h += seancesRecentesHtml();
    return h;
  }

  function resultatsRechercheHtml(rech) {
    var vus = {}, out = [], i, j, s, ex, h = "";
    var jr = histTrie();
    for (i = 0; i < jr.length; i++) {
      s = jr[i];
      if (s.t !== "salle" || !s.ex) continue;
      for (j = 0; j < s.ex.length; j++) {
        ex = s.ex[j];
        if (ex.nom.toLowerCase().indexOf(rech) < 0 || vus[ex.nom]) continue;
        vus[ex.nom] = 1;
        out.push(ex.nom);
      }
    }
    h += '<div class="carte-t">Trouvé' + (out.length > 1 ? "s" : "") + " · " + out.length + "</div>";
    if (!out.length) return h + '<p class="cb-vide">Aucun exercice de ce nom dans ton historique.</p>';
    h += '<ul class="hi-liste">';
    for (i = 0; i < out.length; i++) {
      h += '<li><button type="button" class="hi-l" data-action="fiche" data-nom="' + esc(out[i]) + '">' +
           '<span class="hi-n">' + esc(out[i]) + "</span>" +
           '<span class="hi-chev" aria-hidden="true">›</span></button></li>';
    }
    return h + "</ul>";
  }

  // CALENDRIER DU MOIS. Chaque case porte la couleur de la discipline REELLE
  // du jour, prise dans le journal. Un jour prevu et non fait est « manque »,
  // un jour non prevu est « repos » : ce sont deux etats differents, et les
  // confondre ferait passer un dimanche pour un echec.
  function calendrierHtml() {
    var auj = new Date(), an = auj.getFullYear(), mois = auj.getMonth();
    var premier = new Date(an, mois, 1), nb = new Date(an, mois + 1, 0).getDate();
    var decalage = (premier.getDay() + 6) % 7;
    var d = deriver(), prevus = {}, i, h = "", parDate = {}, jr = state.hist || [];

    for (i = 0; i < d.progJours.length; i++) prevus[d.progJours[i].ji] = 1;
    for (i = 0; i < jr.length; i++) { parDate[jr[i].d] = jr[i].t; }

    h += '<div class="carte-t">' + esc(MOIS[mois]) + " " + an + "</div>";
    h += '<div class="cal">';
    for (i = 0; i < 7; i++) {
      h += '<span class="cal-h" aria-hidden="true">' + esc(JOURS[i].charAt(0)) + "</span>";
    }
    for (i = 0; i < decalage; i++) h += '<span class="cal-v"></span>';

    for (i = 1; i <= nb; i++) {
      var dd = new Date(an, mois, i), cle = cleDate(dd), ji = (dd.getDay() + 6) % 7;
      var cls = "cal-c", st = "";
      if (parDate[cle]) {
        cls += " cal-fait";
        st = "background:" + DISC[parDate[cle]].bg + ";color:" + DISC[parDate[cle]].fg;
      } else if (dd > auj) {
        cls += " cal-avenir";
      } else if (prevus[ji]) {
        cls += " cal-manque";
      } else {
        cls += " cal-repos";
      }
      if (cle === cleDate(auj)) cls += " cal-auj";
      h += '<span class="' + cls + '" style="' + st + '">' + i + "</span>";
    }
    h += "</div>";

    h += '<div class="cal-leg">';
    for (i = 0; i < LEGENDE.length; i++) {
      var sw = LEGENDE[i].c === "repos" ? "background:var(--fond-encart)"
        : LEGENDE[i].c === "manque" ? "border:1.5px solid var(--bord-fort)"
        : "background:" + DISC[LEGENDE[i].c].bg;
      h += '<span class="cal-l"><i class="cal-sw" style="' + sw + '"></i>' + esc(LEGENDE[i].t) + "</span>";
    }
    return h + "</div>";
  }

  // SEANCES RECENTES. Les trois disciplines y figurent, chacune avec SES
  // chiffres : une sortie ne se resume pas en tonnage, un cours n'a pas de
  // series. Les compter dans la meme grammaire les rendrait tous faux.
  //
  // REGLE DU CHEVRON : il n'apparait que si la ligne MENE quelque part. Une
  // seance de salle ouvre la fiche de ses exercices ; un cours et une sortie
  // n'ont pas de detail a montrer, donc ni chevron, ni curseur pointer. Un
  // chevron qui ne mene nulle part est une promesse non tenue.
  // Mois abreges pour la pastille de date. « septembre » en entier ne tient pas
  // dans un carre de 46 px, et la couper au rendu produirait « septem… ».
  var MOIS_COURTS = ["janv.", "févr.", "mars", "avril", "mai", "juin",
                     "juil.", "août", "sept.", "oct.", "nov.", "déc."];

  // Ce qu'une seance s'appelle dans la liste. Une seance de salle porte son
  // code ET ce qu'elle travaille : « PUSH » seul ne dit pas ce qu'on a fait.
  function titreSeance(s) {
    if (s.t === "cours") return s.nom || "Cours";
    if (s.t === "run") return "Running";
    var S = SEANCES[s.si];
    return S ? s.code + " · " + S.sub : (s.code || "Séance");
  }

  function seancesRecentesHtml() {
    var h = histTrie(), i, s, out = "", dd, det, cliquable;
    out += '<div class="carte-t">Séances récentes</div>';
    if (!h.length) {
      return out + '<p class="cb-vide">Rien encore. Ta première séance validée apparaîtra ici.</p>';
    }

    out += '<ul class="hi-liste">';
    for (i = 0; i < h.length && i < 20; i++) {
      s = h[i];
      dd = DISC[s.t];
      cliquable = s.t === "salle" && s.ex && s.ex.length;

      // LES NOMBRES S'ECRIVENT A LA FRANCAISE. Le tonnage brut donnait
      // « 3780 kg » la ou la maquette ecrit « 3 780 kg », et la distance
      // sortait du journal telle quelle, donc « 7.2 km » avec un POINT.
      // fmtVal pose la virgule decimale, millier l'espace des milliers.
      if (s.t === "salle") {
        det = (s.exos || 0) + " exos · " + millier(s.tonnage || 0) + " kg" +
              (s.sec ? " · " + Math.round(s.sec / 60) + " min" : "");
      } else if (s.t === "cours") {
        det = NATURES[s.nat] ? NATURES[s.nat].t + " · " + s.min + " min" : s.min + " min";
      } else {
        det = (LIEUX[s.lieu] ? LIEUX[s.lieu].t : "") +
              (s.km ? " · " + fmtVal(nombreOu(s.km, 0)) + " km" : "") +
              (s.minutes ? " · " + s.minutes + " min" : "");
      }

      // LA PASTILLE PORTE LA DATE, PAS LE CODE, et elle est TEINTEE PAR LA
      // DISCIPLINE. Demande d'Olivier a la revue.
      //
      // Elle disait « PUSH » a cote d'un titre qui disait deja « PUSH », et la
      // date etait reléguee dans la ligne de detail. La maquette fait
      // l'inverse : un carre colore qui donne le jour d'un coup d'oeil, et la
      // couleur dit la discipline sans qu'on ait a lire. La date quitte donc la
      // ligne de detail, ou elle faisait doublon.
      var dj = dateDepuisCle(s.d);
      out += "<li>" +
        (cliquable
          ? '<button type="button" class="hi-l" data-action="fiche-seance" data-d="' + esc(s.d) + '">'
          : '<div class="hi-l hi-l-fixe">') +
        '<span class="hi-jour" style="background:' + dd.bg + ";color:" + dd.fg + '">' +
          '<span class="hi-j-n num">' + (dj ? dj.getDate() : "") + "</span>" +
          '<span class="hi-j-m">' + esc(dj ? MOIS_COURTS[dj.getMonth()] : "") + "</span></span>" +
        '<span class="hi-txt"><span class="hi-n">' +
          esc(titreSeance(s)) + "</span>" +
        '<span class="hi-d">' + esc(det) + "</span></span>" +
        (cliquable ? '<span class="hi-chev" aria-hidden="true">›</span>' : "") +
        (cliquable ? "</button>" : "</div>") + "</li>";
    }
    return out + "</ul>";
  }

  // Le chevron d'une seance de salle mene a la fiche de son PREMIER exercice
  // de travail, l'echauffement mis a part : c'est le mouvement qui porte la
  // seance, et celui dont on veut voir la progression de charge. Les autres
  // restent joignables par la recherche.
  function ouvrirFicheSeance(cleJour) {
    var h = state.hist || [], i, j, s = null;
    for (i = 0; i < h.length; i++) { if (h[i].d === cleJour && h[i].t === "salle") s = h[i]; }
    if (!s || !s.ex || !s.ex.length) return;
    for (j = 0; j < s.ex.length; j++) {
      if (s.ex[j].unite !== "min") { poser({ ficheEx: s.ex[j].nom, ecran: "fiche" }); window.scrollTo(0, 0); return; }
    }
    poser({ ficheEx: s.ex[0].nom, ecran: "fiche" });
    window.scrollTo(0, 0);
  }

  function dateCourte(cle) {
    var d = dateDepuisCle(cle);
    if (!d) return cle;
    return d.getDate() + " " + MOIS[d.getMonth()].slice(0, 4);
  }

  /* -------------------------------------------------------------------------
     FICHE EXERCICE
     ------------------------------------------------------------------------- */
  /* -------------------------------------------------------------------------
     LA FICHE EST REFAITE D'APRES LA MAQUETTE, apres retour d'usage d'Olivier.
     -------------------------------------------------------------------------
     Ma premiere version reutilisait la courbe partagee avec l'ecran Progres.
     La maquette, elle, montre un HISTOGRAMME : ici les valeurs sont discretes,
     une charge par seance, et non une grandeur relevee dans le temps. Une
     barre par seance se compare d'un coup d'oeil ; une ligne suggere une
     continuite entre deux seances qui n'existe pas.

     Et il manquait le bouton « Voir la technique ». Il etait rendu en lien
     souligne, pas en bouton de 52 px, donc invisible comme action.
     ------------------------------------------------------------------------- */

  // La couleur d'une barre dit son rapport a la precedente : monte, tient,
  // baisse. Sans elle, six barres de meme teinte demandent de comparer des
  // hauteurs a l'oeil.
  function barreCouleur(v, prec) {
    if (prec === null) return { c: "var(--sombre-barre)", t: "var(--sombre-texte-3)" };
    if (v > prec) return { c: "var(--salle-bg)", t: "var(--salle-bg)" };
    if (v < prec) return { c: "var(--cours-bg)", t: "var(--cours-sur-sombre)" };
    return { c: "var(--sombre-bord)", t: "var(--sombre-texte-2)" };
  }

  function verdictDe(v, prec) {
    if (prec === null) return { t: "première fois", c: "var(--texte-2)" };
    if (v > prec) return { t: "+ " + fmtVal(v - prec) + " kg", c: "var(--vert-encre)" };
    if (v < prec) return { t: "− " + fmtVal(prec - v) + " kg", c: "var(--cours-encre)" };
    return { t: "identique", c: "var(--texte-2)" };
  }

  function ficheHtml() {
    var nom = state.ficheEx, i, j, h = "", ex = null, seances, vals = [], dates = [];
    // LE RETOUR SE POSE AVANT TOUTE SORTIE ANTICIPEE. Il etait plus bas, donc
    // une fiche ouverte sans exercice n'avait AUCUNE issue : meme famille de
    // defaut que le diagnostic dont on ne pouvait pas sortir.
    var retour = '<button type="button" class="fi-retour" data-action="onglet" ' +
                 'data-ecran="histo"><span aria-hidden="true">‹</span> Historique</button>';
    if (!nom) return retour + '<p class="cb-vide">Aucun exercice sélectionné.</p>';

    // On cherche la description dans le catalogue de la seance, pas dans le
    // journal : le journal porte ce qui a ete FAIT, le catalogue porte les
    // consignes.
    for (i = 0; i < SEANCES.length && !ex; i++) {
      for (j = 0; j < SEANCES[i].exos.length; j++) {
        if (SEANCES[i].exos[j].nom === nom) { ex = SEANCES[i].exos[j]; break; }
      }
    }

    h += retour;
    h += '<h1 class="fi-nom">' + esc(nom) + "</h1>";
    if (ex && ex.mat) h += '<div class="fi-mat">' + esc(ex.mat) + "</div>";

    seances = seancesDeExercice(nom, 6);
    for (i = 0; i < seances.length; i++) { vals.push(seances[i].kg); dates.push(dateCourte(seances[i].d)); }

    // --- La carte sombre : charge de travail et histogramme ---
    if (seances.length) {
      var derniere = vals[vals.length - 1], premiere = vals[0];
      var ecart = derniere - premiere;
      var maxi = 0;
      for (i = 0; i < vals.length; i++) { if (vals[i] > maxi) maxi = vals[i]; }

      h += '<section class="fi-carte">';
      h += '<div class="fi-haut"><div>' +
           '<div class="fi-lbl">Ta charge de travail</div>' +
           '<div class="fi-val num">' + esc(fmtVal(derniere)) + '<span class="fi-u">kg</span></div></div>';
      if (seances.length > 1) {
        h += '<div class="fi-droite"><div class="fi-sur">sur 3 mois</div>' +
             '<div class="fi-ecart num" style="color:' +
             (ecart > 0 ? "var(--vert-bg-b)" : (ecart < 0 ? "var(--cours-sur-sombre)" : "var(--sombre-texte-3)")) +
             '">' + (ecart > 0 ? "+ " : (ecart < 0 ? "− " : "")) + esc(fmtVal(Math.abs(ecart))) + " kg</div></div>";
      }
      h += "</div>";

      // HISTOGRAMME, pas courbe : une charge par seance est une valeur
      // DISCRETE. Une ligne suggererait une continuite entre deux seances qui
      // n'existe pas. Les barres sont calees sur le maximum de la periode.
      var prec = null, col;
      h += '<div class="fi-vals">';
      for (i = 0; i < vals.length; i++) {
        col = barreCouleur(vals[i], prec);
        h += '<span class="num" style="color:' + col.t + '">' + esc(fmtVal(vals[i])) + "</span>";
        prec = vals[i];
      }
      h += "</div>";
      prec = null;
      h += '<div class="fi-barres">';
      for (i = 0; i < vals.length; i++) {
        col = barreCouleur(vals[i], prec);
        h += '<span class="fi-b" style="height:' +
             Math.max(8, Math.round((vals[i] / (maxi || 1)) * 100)) + "%;background:" + col.c + '"></span>';
        prec = vals[i];
      }
      h += "</div>";
      h += '<div class="fi-dates">';
      for (i = 0; i < dates.length; i++) h += "<span>" + esc(dates[i]) + "</span>";
      h += "</div></section>";
    } else {
      h += '<p class="cb-vide">Aucune séance enregistrée avec cet exercice.</p>';
    }

    // --- Séance par séance ---
    if (seances.length) {
      h += '<div class="fi-sect">Séance par séance</div>';
      var pv = null;
      for (i = seances.length - 1; i >= 0; i--) {
        pv = i > 0 ? seances[i - 1].kg : null;
        var vd = verdictDe(seances[i].kg, pv);
        h += '<div class="fi-s"><div class="fi-s-h"><span class="fi-s-d">' +
             esc(dateCourte(seances[i].d)) + "</span>" +
             '<span class="fi-s-v" style="color:' + vd.c + '">' + esc(vd.t) + "</span></div>";
        h += '<div class="fi-sets">';
        for (j = 0; j < seances[i].sets.length; j++) {
          h += '<span class="fi-set"><span class="fi-set-k num">' +
               esc(fmtVal(seances[i].sets[j].kg)) + "</span>" +
               '<span class="fi-set-r">' + seances[i].sets[j].reps + " reps</span></span>";
        }
        h += "</div></div>";
      }
    }

    // --- Technique, et le bouton qui manquait ---
    h += '<section class="fi-tech"><div class="fi-tech-t">Technique</div>';
    if (ex && ex.lines && ex.lines.length) {
      h += '<div class="fi-lines">';
      for (i = 0; i < ex.lines.length; i++) {
        h += '<div class="fi-line"><span class="fi-num" aria-hidden="true">' + (i + 1) + "</span>" +
             '<span class="fi-txt">' + esc(ex.lines[i]) + "</span></div>";
      }
      h += "</div>";
    } else {
      h += '<p class="cb-vide">Pas de mémo écrit pour cet exercice.</p>';
    }
    // LA SEULE SORTIE RESEAU DE L'APPLICATION, et c'est un lien, pas un appel.
    // Il etait rendu en lien souligne : invisible comme action. La maquette en
    // fait un bouton de 52 px, et c'est celui-la qu'Olivier cherchait.
    h += '<a class="fi-video" target="_blank" rel="noopener noreferrer" href="' +
         "https://www.youtube.com/results?search_query=" +
         encodeURIComponent(nom + " technique musculation") +
         '"><span aria-hidden="true">▶</span> Voir une vidéo de ce mouvement</a>';
    return h + "</section>";
  }

  /* -------------------------------------------------------------------------
     PROGRES
     ------------------------------------------------------------------------- */
  /* -------------------------------------------------------------------------
     PROGRES — REFAIT D'APRES LA MAQUETTE, apres retour d'usage d'Olivier.
     -------------------------------------------------------------------------
     Ma premiere version avait quatre blocs, la maquette en a SEPT, et la
     courbe elle-meme etait mal montee : posee a nu au lieu d'etre dans sa
     carte, avec son axe en positionnement absolu au lieu d'une colonne flex,
     et son point de fin cale a gauche au lieu de la droite.

     Manquaient entierement : la carte sombre « Ton programme stagne ? » avec
     son appel a l'assistant, et la carte « Tes records » avec ses barres.
     ------------------------------------------------------------------------- */
  function progHtml() {
    var modes = modesDisponibles(), h = "", i, j, k, mode, vals, d = deriver();
    var hj = state.hist || [], tonnage = 0, record = 0, s, heures = 0, km = 0, sorties = 0;
    var recs = {}, ordre = [];

    for (i = 0; i < hj.length; i++) {
      s = hj[i];
      if (s.t === "cours") { heures += s.min || 0; continue; }
      if (s.t === "run") { sorties++; km += nombreOu(s.km, 0); continue; }
      tonnage += s.tonnage || 0;
      if (!s.ex) continue;
      for (j = 0; j < s.ex.length; j++) {
        if (s.ex[j].unite === "min") continue;
        for (k = 0; k < s.ex[j].sets.length; k++) {
          var kg = s.ex[j].sets[k].kg;
          if (kg > record) record = kg;
          if (!recs[s.ex[j].nom]) { recs[s.ex[j].nom] = { max: kg, min: kg }; ordre.push(s.ex[j].nom); }
          if (kg > recs[s.ex[j].nom].max) recs[s.ex[j].nom].max = kg;
          if (kg < recs[s.ex[j].nom].min) recs[s.ex[j].nom].min = kg;
        }
      }
    }

    // --- 1. Trois vignettes ---
    // LIBELLES DE LA MAQUETTE. Les miens disaient « tonnes » et « record kg » :
    // exacts, mais ils nomment l'UNITE au lieu de ce qu'elle mesure. « soulevés
    // au total » et « record de streak » disent de quoi il s'agit.
    h += '<div class="vign">';
    h += vignette(hj.length, "séances");
    if (d.slotsSalle.length) h += vignette(fmtVal(Math.round(tonnage / 100) / 10) + " t", "soulevés au total");
    else if (d.slotsCours.length) h += vignette(fmtVal(Math.round(heures / 6) / 10) + " h", "de cours au total");
    else h += vignette(fmtVal(km) + " km", "courus au total");
    h += vignette(serieRecord(), "record de streak");
    h += "</div>";

    if (!modes.length) {
      return h + '<p class="cb-vide">Déclare tes jours pour voir tes courbes.</p>';
    }

    // --- 2. La carte de courbe ---
    mode = state.modeChart < modes.length ? state.modeChart : 0;
    vals = serieHebdo(modes[mode].v);
    var depart = vals[0], fin = vals[vals.length - 1], delta = fin - depart;
    var u = modes[mode].u ? " " + modes[mode].u : "";

    h += '<section class="pr-carte">';
    h += '<div class="pr-modes" role="group" aria-label="Choisir la série">';
    for (i = 0; i < modes.length; i++) {
      h += '<button type="button" class="pr-mode' + (i === mode ? " pr-mode-on" : "") + '"' +
           ' aria-pressed="' + (i === mode ? "true" : "false") + '"' +
           ' data-action="mode-chart" data-v="' + i + '">' + esc(modes[i].t) + "</button>";
    }
    h += "</div>";
    // PAS DE COURBE SANS MESURE. L'onglet Poids existe des qu'un poids est
    // declare, mais tant qu'aucune pesee n'est notee il n'y a rien a tracer :
    // une ligne horizontale au poids du diagnostic se lirait comme douze
    // semaines sans le moindre progres, ce qui serait faux.
    if (modes[mode].v === "poids" && !(state.pesees || []).length) {
      h += '<div class="pr-attente">' +
           '<div class="pr-attente-t">Aucune pesée notée</div>' +
           '<p class="pr-attente-p">Tu as déclaré <span class="num">' +
           esc(fmtVal(nombreOu(state.obPoids, 0))) + " kg</span> au diagnostic. " +
           "La courbe démarre à ta première pesée, depuis l'écran Aujourd'hui.</p></div>";
    } else {
      h += courbeHtml(vals, u,
        "Départ · " + fmtVal(depart) + u,
        "Aujourd'hui · " + fmtVal(fin) + u,
        (delta >= 0 ? "+ " : "− ") + fmtVal(Math.abs(delta)) + u + " sur 12 sem.",
        modes[mode].l, modes[mode].c);
    }
    h += "</section>";

    // --- 3. La carte Running ---
    if (d.slotsRun.length) h += carteObjectifRunHtml(km, sorties);

    // --- 4. « Ton programme stagne ? » ---
    if (d.slotsSalle.length) h += carteStagnationHtml();

    // --- 5. Tes records ---
    if (d.slotsSalle.length && ordre.length) {
      h += '<section class="pr-recs"><div class="pr-recs-t">Tes records</div>';
      ordre.sort(function (a, b) { return recs[b].max - recs[a].max; });
      var plafond = recs[ordre[0]].max || 1;
      for (i = 0; i < ordre.length && i < 5; i++) {
        var r = recs[ordre[i]], gain = r.max - r.min;
        h += '<div class="pr-rec"><div class="pr-rec-h">' +
             '<span class="pr-rec-n">' + esc(ordre[i]) + "</span>" +
             '<span class="pr-rec-v num">' + esc(fmtVal(r.max)) + " kg</span></div>" +
             '<div class="pr-rec-b"><span class="pr-piste"><span class="pr-barre" style="width:' +
             Math.max(4, Math.round((r.max / plafond) * 100)) + '%"></span></span>' +
             '<span class="pr-gain num" style="color:' +
             (gain > 0 ? "var(--vert-encre)" : "var(--texte-3)") + '">' +
             (gain > 0 ? "+ " + fmtVal(gain) + " kg" : "—") + "</span></div></div>";
      }
      h += "</section>";
    }

    // --- 6. Paliers ---
    h += badgesHtml(hj.length);
    return h;
  }

  // LA CARTE QUI APPELLE L'ASSISTANT. Elle ne s'affiche QUE si le journal
  // montre vraiment une stagnation : proposer de demander de l'aide a quelqu'un
  // qui progresse serait au mieux inutile, au pire decourageant.
  function carteStagnationHtml() {
    var c = chargesRecentes(), i, nom, x, bloque = null;
    for (i = 0; i < c.ordre.length; i++) {
      nom = c.ordre[i];
      x = c.par[nom];
      if (x.stagne >= 2 && (!bloque || x.stagne > c.par[bloque].stagne)) bloque = nom;
    }
    if (!bloque) return "";
    x = c.par[bloque];
    return '<section class="pr-stagne">' +
      '<div class="pr-st-t">Ton programme stagne ?</div>' +
      '<div class="pr-st-p">Le <b>' + esc(bloque.toLowerCase()) + "</b> est bloqué à " +
      esc(fmtVal(x.der)) + " kg depuis " + (x.stagne + 1) + " séances. " +
      "Ton assistant peut relire tes charges et proposer quoi changer.</div>" +
      '<button type="button" class="pr-st-b" data-action="aller-ia">' +
      "Demander une amélioration de mon programme à mon IA</button></section>";
  }

  function vignette(v, l) {
    return '<div class="vg"><span class="vg-n num">' + esc(String(v)) + "</span>" +
           '<span class="vg-l">' + esc(l) + "</span></div>";
  }


  function heuresDeCours() {
    var h = state.hist || [], i, m = 0;
    for (i = 0; i < h.length; i++) { if (h[i].t === "cours") m += h[i].min || 0; }
    return Math.round(m / 60 * 10) / 10;
  }

  // EN-TETE « RUNNING », JAMAIS « COURSE A PIED », et un seul bleu dans toute
  // la carte : bordure, barre, chiffres et vignettes partagent les trois memes
  // valeurs. Deux bleus voisins se lisent comme une erreur d'impression.
  // UNE CARTE D'OBJECTIF, PAS UN RESUME. La mienne recopiait des totaux ; celle
  // de la maquette pose une CIBLE — tenir trente minutes sans marcher — et
  // montre ou l'on en est. Un total ne dit pas s'il faut se rejouir.
  //
  // L'objectif est mesure sur la PLUS LONGUE sortie des quatre dernieres
  // semaines, pas sur la derniere : une mauvaise sortie ne doit pas effacer un
  // record tenu la semaine d'avant.
  var RUN_CIBLE_MIN = 30;

  function carteObjectifRunHtml(kmTotal) {
    var h = state.hist || [], i, d, auj = new Date();
    var pluslongue = 0, plusloin = 0, kmMois = 0, m;
    auj.setHours(0, 0, 0, 0);

    for (i = 0; i < h.length; i++) {
      if (h[i].t !== "run") continue;
      d = dateDepuisCle(h[i].d);
      if (!d || jourEcart(auj, d) > 28 || jourEcart(auj, d) < 0) continue;
      m = nombreOu(h[i].minutes, 0);
      if (m > pluslongue) pluslongue = m;
      if (nombreOu(h[i].km, 0) > plusloin) plusloin = nombreOu(h[i].km, 0);
      kmMois += nombreOu(h[i].km, 0);
    }
    var pct = Math.min(100, Math.round(pluslongue / RUN_CIBLE_MIN * 100));

    return '<section class="run-obj"><div class="ro-t">Running</div>' +
      '<div class="ro-titre">Tenir ' + RUN_CIBLE_MIN + " min sans marcher</div>" +
      '<div class="ro-s">Ta plus longue sortie sans t\'arrêter, sur les quatre ' +
      "dernières semaines.</div>" +
      '<div class="ro-c"><span class="ro-piste"><span class="ro-barre" style="width:' + pct +
      '%"></span></span><span class="ro-n num">' + Math.round(pluslongue) + " / " +
      RUN_CIBLE_MIN + " min</span></div>" +
      '<div class="ro-stats">' +
      '<div class="ro-st"><span class="ro-st-v num">' + esc(fmtVal(kmMois)) +
      ' km</span><span class="ro-st-l">ce mois-ci</span></div>' +
      '<div class="ro-st"><span class="ro-st-v num">' + esc(fmtVal(plusloin)) +
      ' km</span><span class="ro-st-l">ta plus longue sortie</span></div></div></section>';
  }

  function badgesHtml(total) {
    var b = MOTEUR.BADGES, i, h = '<div class="carte-t" style="margin-top:20px">Paliers</div><div class="bdg">';
    for (i = 0; i < b.length; i++) {
      h += '<div class="bd' + (total >= b[i].n ? " bd-on" : "") + '">' +
           '<span class="bd-n num">' + b[i].n + "</span>" +
           '<span class="bd-l">' + esc(b[i].label) + "</span></div>";
    }
    return h + "</div>";
  }

  /* =========================================================================
     LA BRANCHE MOI — Moi, Profil, Mon programme, Mes exercices, Apparence
     ========================================================================= */

  /* -------------------------------------------------------------------------
     MOI
     ------------------------------------------------------------------------- */
  // La photo passe par un <label> qui CONTIENT un <input type="file">
  // transparent en absolute inset 0. C'est ce montage, et lui seul, qui ouvre
  // la photothèque du telephone au premier toucher : un bouton qui appelle
  // .click() sur un input cache est bloque par Safari hors geste direct.
  // LA CARTE D'IDENTITE EST SOMBRE, ET LE PSEUDO EST UN BOUTON.
  //
  // Ma premiere version posait le nom en texte mort : rien ne menait a Profil,
  // alors que la maquette en fait la porte d'entree. Signale par Olivier.
  // Deux zones cliquables, le bloc nom et le chevron, parce qu'on vise l'un ou
  // l'autre selon la main.
  // La seule forme acceptee : une image en base64, sans un seul caractere qui
  // puisse sortir d'un attribut. Le vocabulaire du base64 n'en contient aucun.
  var PHOTO_FORME = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;

  function photoValide(v) {
    return typeof v === "string" && v.length < 4000000 && PHOTO_FORME.test(v);
  }

  function photoHtml() {
    var init = (state.obPrenom || "?").charAt(0).toUpperCase();
    var h = '<div class="moi-carte">';
    h += '<label class="moi-photo">';
    // L'ADRESSE EST ENTRE APOSTROPHES. Une adresse en data: contient une
    // virgule, et `url()` sans guillemets s'arrete dessus : la regle entiere
    // devenait invalide et la pastille restait vide.
    //
    // ET ELLE EST VERIFIEE AVANT D'ETRE POSEE. C'est le seul champ de l'appli
    // qui entre dans du HTML sans passer par esc(), et il ne vient pas toujours
    // de toDataURL, dont la sortie est sure : il peut aussi venir d'un journal
    // IMPORTE, et l'import recopie les valeurs sans regarder ce qu'elles
    // contiennent. Un guillemet dans la chaine fermerait l'attribut, et comme la
    // politique de securite autorise le script en ligne, un gestionnaire glisse
    // la s'executerait. On n'accepte donc qu'une image en base64, et on retombe
    // sur l'initiale sinon.
    var photo = photoValide(state.photo) ? state.photo : null;
    h += photo
      ? '<span class="moi-img" role="img" aria-label="Photo de profil"' +
        " style=\"background-image:url('" + photo + "')\"></span>"
      : '<span class="moi-init" aria-hidden="true">' + esc(init) + "</span>";
    h += '<span class="moi-cap" aria-hidden="true">Photo</span>';
    h += '<input type="file" accept="image/*" class="moi-file" data-action="photo-choisir"' +
         ' aria-label="Choisir une photo de profil"></label>';
    h += '<button type="button" class="moi-ident" data-action="aller-profil">' +
         '<span class="moi-nom">' + esc(state.obPrenom || "Toi") + "</span>" +
         '<span class="moi-sous">' + esc(resumeProfilCourt()) + "</span></button>";
    h += '<button type="button" class="moi-chev" data-action="aller-profil"' +
         ' aria-label="Ouvrir mon profil">›</button>';
    h += "</div>";
    if (photo) {
      h += '<button type="button" class="moi-retirer" data-action="photo-retirer">' +
           "Retirer la photo</button>";
    }
    // La phrase qui disait que la photo n'etait pas enregistree a disparu avec
    // la limite qu'elle annoncait : la photo est maintenant reduite puis gardee
    // sur l'appareil, comme le reste du profil.
    //
    // Reste ce message, pour le cas ou le fichier choisi ne s'ouvre pas. Sans
    // lui, un fichier illisible rendrait la main sans rien dire, et c'est
    // exactement le silence qu'on vient de corriger.
    if (state.photoMsg) {
      h += '<p class="moi-note">' + esc(state.photoMsg) + "</p>";
    }
    return h;
  }

  function resumeProfilCourt() {
    var d = deriver(), p = profilDepuisEtat();
    return d.slots.length + " séance" + (d.slots.length > 1 ? "s" : "") + " par semaine · " +
           fmtVal(p.startWeight) + " → " + fmtVal(p.targetWeight) + " kg";
  }

  // UN GROUPE = UN TITRE HORS CARTE, PUIS UNE SEULE CARTE A SEPARATEURS.
  //
  // Ma premiere version faisait une carte bordee PAR LIGNE : trois lignes
  // donnaient trois cartes empilees, et l'ecran se lisait comme une liste de
  // blocs sans lien. La maquette regroupe les lignes d'un meme sujet dans une
  // carte unique, separees par un filet. C'est ce qui fait qu'un groupe se lit
  // comme un groupe. Signale par Olivier sur le bloc Assistant IA.
  function groupeHtml(titre, lignes) {
    var h = '<div class="mo-g"><div class="mo-g-t">' + esc(titre) + '</div>' +
            '<div class="mo-g-c">', i, l;
    for (i = 0; i < lignes.length; i++) {
      l = lignes[i];
      h += '<button type="button" class="mo-l" data-action="' + l.a + '"' +
           (l.v !== undefined ? ' data-v="' + esc(l.v) + '"' : "") + ">" +
           '<span class="mo-n">' + esc(l.t) + "</span>" +
           (l.s ? '<span class="mo-s num">' + esc(l.s) + "</span>" : "") +
           '<span class="mo-c" aria-hidden="true">›</span></button>';
    }
    return h + "</div></div>";
  }

  function moiHtml() {
    var h = photoHtml(), d = deriver();

    // LES DEUX LIGNES QUI MENENT AUX ETAPES DE SALLE N'EXISTENT QUE S'IL Y A DE
    // LA SALLE. Le diagnostic saute ces deux etapes pour un programme fait de
    // cours ou de running seulement ; y mener depuis ici ouvrirait une question
    // sans objet, et le compteur d'etapes ne saurait plus quoi annoncer.
    var lignesProg = [
      { t: "Mon programme", s: d.slots.length + " activités déclarées", a: "aller-monprog" },
      { t: "Mes exercices", s: nbExercicesActifs() + " retenus", a: "aller-exos" }
    ];
    if (d.slotsSalle.length) {
      lignesProg.push({ t: "Durée par séance", s: dureeLibelle(), a: "ob-etape", v: "5" });
    }
    // ACTION DISTINCTE de « ob-etape ». Corriger une reponse et reprendre les
    // onze etapes ne sont pas le meme geste : le premier rend la main tout de
    // suite, le second redemande tout.
    lignesProg.push({ t: "Refaire le diagnostic", s: "Reprend tout depuis le début", a: "ob-refaire" });
    h += groupeHtml("Programme", lignesProg);

    // LE MATERIEL A SON PROPRE GROUPE.
    //
    // Il etait la quatrieme ligne de « Programme », entre la duree de seance et
    // le bouton qui refait tout le diagnostic. Olivier demandait a pouvoir gerer
    // sa liste de materiel depuis son profil, ce qui veut dire d'abord la
    // trouver. Un titre a son nom la rend visible sans la chercher.
    //
    // Le sous-titre compte les DEUX listes. Les machines n'y figuraient pas,
    // alors que ce sont elles qu'on decoche quand on change de salle.
    //
    // ET LE GROUPE NE DISPARAIT PLUS QUAND LA SEMAINE N'A PAS DE SALLE.
    // Il etait conditionne aux creneaux de salle, comme la ligne « Duree par
    // seance » juste au-dessus. Or le cas qu'Olivier decrit EST une semaine
    // sans salle : « un week-end chez des potes ». Le materiel devenait alors
    // inatteignable, ni depuis Moi ni depuis le diagnostic, qui saute cette
    // etape quand il n'y a pas de salle. Le reglage qu'il veut pouvoir changer
    // disparaissait exactement quand il en a besoin.
    //
    // Y aller depuis ici marche quel que soit le programme : `obSuivant` rend
    // la main a `retourDe` des que le diagnostic est fait, sans traverser les
    // onze etapes.
    h += groupeHtml("Matériel", [
      { t: "Ce dont je dispose", s: resumeMateriel(), a: "ob-etape",
        v: String(ETAPE_MATERIEL) }
    ]);

    h += groupeHtml("Assistant IA", [
      { t: "Assistant IA", s: "Programme et repas", a: "aller-ia" }
    ]);

    h += groupeHtml("Appli", [
      { t: "Apparence", s: ["Clair", "Sombre", "Système"][state.theme], a: "aller-theme" }
    ]);

    h += '<div class="mo-g"><div class="mo-g-t">Données</div><div class="mo-g-c">';
    h += '<button type="button" class="mo-l" data-action="exporter">' +
         '<span class="mo-n">Exporter journal<span class="mo-fmt">format JSON</span></span>' +
         '<span class="mo-c" aria-hidden="true">›</span></button>';
    // L'IMPORT MANQUAIT. Le README exige « export / import JSON du journal »,
    // mais aucun des dix prompts ne l'a commande : il est tombe entre l'etape 6,
    // qui ne demandait que l'export, et la recette, qui le teste au parcours 11.
    // Meme montage que la photo : un <label> qui contient l'input file.
    h += '<label class="mo-l mo-l-file">' +
         '<span class="mo-n">Importer un journal<span class="mo-fmt">' +
         "remplace tout ce qui est enregistré</span></span>" +
         '<span class="mo-c" aria-hidden="true">›</span>' +
         '<input type="file" accept="application/json,.json" class="moi-file"' +
         ' data-action="importer" aria-label="Choisir un fichier de journal"></label>';
    if (state.importMsg) {
      h += '<div class="mo-l mo-l-msg"><span class="mo-n">' + esc(state.importMsg) + "</span></div>";
    }
    h += "</div></div>";

    // Carte version. « Recharger la derniere version » vide le cache et
    // reprend le fichier en ligne : pour ceux qui ont deja le lien en ecran
    // d'accueil, c'est la seule facon de sortir d'une version en cache.
    // LE PARAGRAPHE MANQUAIT, et c'est lui qui rend le bouton comprehensible :
    // sans explication, « recharger » ressemble a un rafraichissement de page,
    // alors qu'il va chercher une version publiee depuis.
    h += '<section class="carte"><div class="mo-v-h"><span class="mo-v-t">Version installée</span>' +
         '<span class="mo-v-n num">v' + esc(APP_VERSION) + "</span></div>";
    h += '<p class="cr-p">Ton téléphone garde l\'appli en mémoire pour qu\'elle s\'ouvre ' +
         "hors-ligne. Si j'ai publié des nouveautés, ce bouton va les chercher.</p>";
    h += '<button type="button" class="cr-btn" data-action="recharger-maj">' +
         "Recharger la dernière version</button></section>";

    h += resetHtml();

    // La ligne de pied. Elle tient en une phrase ce que l'appli promet sur les
    // donnees, a l'endroit ou l'on vient justement les gerer.
    h += '<div class="mo-pied num">Lemmon Fit · hors-ligne · aucune donnée envoyée</div>';
    return h;
  }

  // EN DEUX TEMPS, ET LE SECOND ENUMERE CE QUI DISPARAIT. Un effacement
  // definitif derriere un seul bouton finit toujours par etre declenche par
  // accident, et il n'y a pas de corbeille.
  function resetHtml() {
    // LES DEUX ETATS PRENNENT LES TEXTES DE LA MAQUETTE. Le premier expliquait
    // seulement son titre chez moi ; celui-ci dit ce qui part ET ou l'appli
    // retombe. Le second listait en puces ; la maquette l'ecrit en phrase, ce
    // qui se lit plus vite au moment ou l'on hesite.
    var h = '<section class="carte carte-danger">';
    if (!state.resetDemande) {
      h += '<div class="dg-t">Réinitialiser mes données</div>';
      h += '<p class="cr-p">Efface le diagnostic, le programme, l\'historique et les ' +
           "réglages gardés sur cet appareil. L'appli repart à son premier lancement.</p>";
      h += '<button type="button" class="dg-btn dg-btn-creux" data-action="reset-demander">' +
           "Réinitialiser mes données</button></section>";
      return h;
    }
    h += '<div class="dg-t dg-t-rouge">Tout effacer, vraiment ?</div>';
    h += '<p class="cr-p">Ce qui disparaît : ton diagnostic, ton programme de la semaine, ' +
         "tes cours et tes sorties, ton historique, ta pesée et ta photo.</p>";
    h += '<p class="cr-p">C\'est définitif, il n\'y a pas de corbeille. Exporte ton ' +
         "journal d'abord si tu veux le garder.</p>";
    h += '<button type="button" class="dg-btn" data-action="reset-confirmer">' +
         "Oui, tout effacer</button>";
    h += '<button type="button" class="dg-annuler" data-action="reset-annuler">Annuler</button>';
    return h + "</section>";
  }

  function nbExercicesActifs() {
    var c = MOTEUR.CATALOG, i, n = 0;
    for (i = 0; i < c.length; i++) { if (!state.exclus[i]) n++; }
    return n;
  }

  function nbMateriel() {
    var i, n = 0;
    for (i = 0; i < state.obEquip.length; i++) { if (state.obEquip[i]) n++; }
    return n;
  }
