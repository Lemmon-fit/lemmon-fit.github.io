  // ===========================================================================
  function nutriEcrirePlanIA(v) {
    var res = { ecrit: false, lignes: 0, reportees: 0, perdues: 0, refus: "" };
    if (!profile || !profile.done) {
      res.refus = "Aucun profil actif."; return res;
    }
    if (!v || !isArray(v.plan) || !v.plan.length) {
      res.refus = "Il n'y a aucun plan à enregistrer."; return res;
    }
    if (!v.complet) {
      res.refus = "Ce plan n'est pas complet : il n'est pas enregistrable."; return res;
    }

    // LE RECOMPTE. On compare les lignes de REPAS aux créneaux déclarés
    // maintenant, pas à ceux d'il y a cinq minutes.
    var cr = nutriCreneauxIA(profile), repas = 0, i;
    for (i = 0; i < v.plan.length; i++) { if (!v.plan[i].supp) repas++; }
    if (repas !== cr.length) {
      res.refus = "Ce plan porte " + repas + " prise" + (repas > 1 ? "s" : "") +
                  " pour " + cr.length + " déclarée" + (cr.length > 1 ? "s" : "") +
                  " : tes repas ont changé depuis. Redemande un plan.";
      return res;
    }
    if (v.plan.length > MAX_NUTRI_ITEMS) {
      res.refus = "Ce plan ferait " + v.plan.length + " lignes : le stockage n'en " +
                  "garde que " + MAX_NUTRI_ITEMS + ".";
      return res;
    }

    // ON COPIE AVANT D'ÉCRIRE. `v.plan` vit dans state.iaNutriVal : le poser tel
    // quel dans le profil ferait deux références sur le même tableau, et une
    // correction écrite plus tard modifierait aussi ce que la carte du pont
    // affiche encore.
    var rep = nutriReporterCorrections(profile.nutriPlan, copieProfonde(v.plan));
    profile.nutriPlan = rep.plan;
    profile.nutriPlanLe = todayKey();
    profile.nutriPlanIA = todayKey();
    // CE N'EST PAS UNE MIGRATION. Le message de migration explique un changement
    // que l'appli a décidé seule ; celui-ci a été demandé par un clic, et le
    // signaler deux fois brouillerait les deux.
    profile.nutriMigreLe = null;
    profile.nutriMigreCause = null;

    // `ecrit` n'est pas un détail : quand localStorage refuse — mode privé iOS,
    // quota plein — le plan vit en mémoire et s'affiche, mais il sera perdu au
    // rechargement. Même contrat que nutriCorriger : l'appelant le DIT.
    res.ecrit = persistSettings();
    applyProfile();
    res.lignes = repas;
    res.reportees = rep.reportees;
    res.perdues = rep.perdues;
    return res;
  }

  // --- LE RETOUR ARRIÈRE, GRATUIT ---------------------------------------------
  // « La correction est rangée à côté de la proposition, jamais à sa place — c'est
  // ce qui rend le retour arrière gratuit. » Ici la proposition est REMPLACÉE, donc
  // le retour arrière ne peut pas être gratuit de la même façon : il faut le
  // reconstruire. Il l'est quand même, parce que buildNutrition est déterministe —
  // le plan de l'appli se refabrique à l'identique depuis le profil, sans avoir eu
  // besoin de le garder.
  //
  // SANS CE CHEMIN, L'UTILISATEUR EST PIÉGÉ. Un plan d'IA qui ne lui plaît pas,
  // écrit une fois, ne pourrait plus partir que par un rediagnostic complet — huit
  // étapes, et un plan d'entraînement reconstruit au passage, ce qui remettrait à
  // zéro les charges visées ajustées séance après séance. Le prix serait
  // disproportionné.
  function nutriRevenirPlanAppli() {
    var res = { fait: false, reportees: 0, perdues: 0, ecrit: false };
    if (!profile || !profile.done || !profile.nutriPlanIA) return res;
    var neuf = null;
    try { neuf = buildNutrition(profile); } catch (e) { neuf = null; }
    if (!isArray(neuf)) return res;
    var rep = nutriReporterCorrections(profile.nutriPlan, neuf);
    profile.nutriPlan = rep.plan;
    profile.nutriPlanLe = todayKey();
    profile.nutriPlanIA = null;
    res.ecrit = persistSettings();
    applyProfile();
    res.fait = true;
    res.reportees = rep.reportees;
    res.perdues = rep.perdues;
    return res;
  }

  // LE RELECTEUR, EN UN SEUL EXEMPLAIRE. Deux gestes y arrivent — le collage et
  // l'appel direct — et l'enchainement est le meme : on lit la FORME, puis on
  // juge le FOND. Les ecrire deux fois aurait laisse l'un des deux oublier le
  // validateur, et un plan non valide se serait affiche comme un plan valide.
  function iaNutriRelire() {
    state.iaNutriRes = iaLireNutrition(state.iaNutriTexte);
    state.iaNutriVal = nutriValiderPlanIA(profile, state.iaNutriRes);
  }

  // ===========================================================================
  // LA CARTE « ASSISTANT IA » — LES TROIS MORCEAUX AU MEME ENDROIT
  // ---------------------------------------------------------------------------
  // ⚠️ CE QU'ELLE REPARE, ET C'ETAIT PIRE QU'UN DOUBLE EMPLOI. Les trois morceaux
  // de l'assistant vivaient dans trois cartes differentes : la clé d'API dans
  // « Réglages avancés », le pont des charges dans « Analyse de tes séances », le
  // pont nutrition dans sa propre carte. On configurait dans l'une et on s'en
  // servait dans les deux autres, sans rien qui relie les trois.
  //
  // Et le pont des charges était le plus mal logé : il vivait dans analyseHtml, qui
  // REND LA MAIN avant d'y arriver quand l'historique compte moins de trois séances
  // par exercice. Il était donc invisible exactement quand on cherche à quoi l'appli
  // sert — le propriétaire de l'appli l'a lui-même cherché sans le trouver.
  //
  // LE CHAPEAU REPOND AUX TROIS QUESTIONS QU'IL A POSEES, DANS SON ORDRE :
  // à quoi ça sert, sur quoi le texte envoyé est construit, et ce que l'appli fait
  // de la réponse collée. Elles étaient toutes les trois sans réponse à l'écran.
  // ===========================================================================
  function iaAssistantHtml() {
    if (!profile || !profile.done) return "";

    var avecCle = iaClePrete();
    var resume = avecCle ? ("clé · " + iaFournisseur().label) : "presse-papier";

    var chapeau =
      '<div class="ia-note">' +
        '<b>À quoi ça sert.</b> L\'appli ne compose pas tes repas et ne juge pas ta ' +
        'technique : elle ne sait pas le faire sans inventer. Une IA, elle, sait ' +
        'proposer — mais elle ne sait pas vérifier ce qu\'elle avance. Ici elle ' +
        'propose, et l\'appli vérifie.' +
      '</div>' +
      '<div class="ia-note">' +
        '<b>Sur quoi le texte envoyé est construit.</b> Ton profil, tes deux cibles ' +
        'chiffrées, ton programme, tes séances <b>réellement faites</b> — pas celles ' +
        'que tu as déclarées — et tes compléments déjà au plan. Rien d\'autre : pas ' +
        'ton prénom. Le texte est <b>affiché en entier</b> avant que tu le copies, ' +
        'parce qu\'il part chez un service tiers.' +
      '</div>' +
      '<div class="ia-note">' +
        '<b>Ce que l\'appli fait de la réponse.</b> Elle la relit ligne par ligne ' +
        'contre ton programme, ton matériel et sa table d\'aliments. Une charge à ' +
        'plus de 20 % d\'écart, un exercice qui n\'est pas au programme, une portion ' +
        'qui atteint trois fois une portion courante : écartés, <b>comptés et ' +
        'montrés</b>. Ce qui reste t\'est proposé — rien ne s\'applique tout seul.' +
      '</div>';

    return carteEntete("ia", "✦ Assistant IA", resume) +
      chapeau +
      iaCleHtml() +
      iaNutriHtml() +
      iaHtml() +
      '<div class="nutri-disclaimer">' +
        'Une IA se trompe avec aplomb. Elle ne te voit pas, ne connaît ni tes ' +
        'douleurs ni ta technique, ne pèse rien et ne voit pas ce qu\'il y a dans ton ' +
        'placard. C\'est pour ça que chaque ligne est relue ici, et c\'est la seule ' +
        'raison pour laquelle on peut la laisser proposer quelque chose. Ses ' +
        'propositions ne remplacent ni l\'œil d\'un coach ni un avis médical.' +
      '</div>' +
    '</section>';
  }

  // --- Copie vers le presse-papier -------------------------------------------
  // Trois chemins, du plus propre au plus rustique. Le dernier ne peut pas
  // echouer : le texte est deja affiche, il suffit de le selectionner.
  function iaCopier() {
    iaCopierZone("ia-prompt", iaPrompt);
  }

  // `secours` est une FONCTION, pas une chaine : le texte de repli ne se calcule
  // que si la zone a disparu du DOM. Le construire a chaque appel referait le
  // bilan pour rien.
  function iaCopierZone(id, secours) {
    var zone = document.getElementById(id);
    var texte = zone ? zone.value : secours();

    function replis() {
      try {
        if (zone && zone.setSelectionRange) {
          zone.focus();
          zone.setSelectionRange(0, texte.length);      // iOS ignore select() sur un readonly
          if (document.execCommand && document.execCommand("copy")) {
            notify("Bilan copié. Colle-le dans ton appli IA.", "ok");
            return;
          }
        }
      } catch (e) {}
      notify("Copie automatique refusée par le navigateur : sélectionne le texte et copie-le à la main.", "info");
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        navigator.clipboard.writeText(texte).then(function () {
          notify("Bilan copié. Colle-le dans ton appli IA.", "ok");
        }, replis);
        return;
      } catch (e) { /* on tombe dans le repli */ }
    }
    replis();
  }


  // ===========================================================================
  // APPEL DIRECT AU FOURNISSEUR
  // ---------------------------------------------------------------------------
  // Un appel navigateur, sans serveur intermediaire : c'est le seul montage
  // possible pour une page statique, et il fonctionne — CORS verifie chez les
  // cinq fournisseurs. Anthropic exige en plus un en-tete de consentement
  // explicite, « anthropic-dangerous-direct-browser-access », qui reconnait que
  // la cle vit dans le navigateur.
  //
  // Chaque fournisseur decrit son contrat dans une entree de IA_FOURNISSEURS :
  // ou taper, quels en-tetes, quel corps, ou lire la reponse, ou lire l'erreur.
  // Ajouter un fournisseur, c'est ajouter une entree — le reste ne bouge pas.
  //
  // LA CLE NE VOYAGE JAMAIS DANS L'URL. Un parametre d'URL se retrouve dans les
  // journaux de serveur, l'historique et les en-tetes de provenance. Google
  // accepte sa cle en parametre : on utilise quand meme l'en-tete.
  // ===========================================================================
  var IA_TIMEOUT_MS = 60000;      // un modele qui reflechit prend son temps

  // Plafond de sortie. Douze propositions tiennent en ~400 jetons, mais sur les
  // modeles a raisonnement le plafond couvre la REFLEXION ET la reponse : trop
  // bas, le modele epuise son budget a reflechir et rend une reponse vide ou
  // tronquee, sans erreur. La marge n'est donc pas du confort, c'est ce qui
  // empeche un echec silencieux.
  var IA_MAX_SORTIE = 4000;

  var IA_FOURNISSEURS = [
    {
      v: "anthropic",
      label: "Claude (Anthropic)",
      modele: "claude-opus-5",
      prefixe: "sk-ant-",
      url: "https://api.anthropic.com/v1/messages",
      entetes: function (cle) {
        return {
          "content-type": "application/json",
          "x-api-key": cle,
          "anthropic-version": "2023-06-01",
          // Sans cet en-tete, l'appel depuis une page web est refuse.
          "anthropic-dangerous-direct-browser-access": "true"
        };
      },
      corps: function (modele, prompt) {
        // Pas de « temperature » : les modeles Claude 5 la refusent avec une
        // erreur 400. La consigne se donne dans le texte, pas dans un reglage.
        return { model: modele, max_tokens: IA_MAX_SORTIE,
                 messages: [{ role: "user", content: prompt }] };
      },
      lis: function (j) {
        // On CHERCHE le bloc de texte, on ne prend pas content[0].
        // Sur les modeles a raisonnement adaptatif — dont claude-opus-5 par
        // defaut — le premier bloc est un bloc « thinking » dont le texte est
        // vide. Lire content[0].text rendrait undefined a chaque appel.
        var i;
        if (!j || !isArray(j.content)) return "";
        for (i = 0; i < j.content.length; i++) {
          if (j.content[i] && j.content[i].type === "text") return j.content[i].text || "";
        }
        return "";
      },
      erreur: function (j) { return j && j.error ? j.error.message : ""; }
    },
    {
      v: "openai",
      label: "ChatGPT (OpenAI)",
      modele: "gpt-5.6-luna",
      prefixe: "sk-",
      url: "https://api.openai.com/v1/chat/completions",
      entetes: function (cle) {
        return { "content-type": "application/json", "authorization": "Bearer " + cle };
      },
      corps: function (modele, prompt) {
        // « max_completion_tokens », pas « max_tokens » : l'ancien nom est
        // refuse sur les modeles a raisonnement.
        //
        // reasoning_effort à « none » : rendre douze lignes formatees ne
        // demande pas de reflexion, et les jetons de raisonnement se comptent
        // sur le meme plafond que la reponse — les laisser courir risque une
        // reponse vide.
        return { model: modele, max_completion_tokens: IA_MAX_SORTIE,
                 reasoning_effort: "none",
                 messages: [{ role: "user", content: prompt }] };
      },
      lis: function (j) {
        return (j && isArray(j.choices) && j.choices[0] && j.choices[0].message)
          ? (j.choices[0].message.content || "") : "";
      },
      erreur: function (j) { return j && j.error ? j.error.message : ""; }
    },
    {
      v: "google",
      label: "Gemini (Google)",
      modele: "gemini-3.5-flash-lite",
      prefixe: "AIza",
      url: "https://generativelanguage.googleapis.com/v1beta/models/{modele}:generateContent",
      entetes: function (cle) {
        // En-tete, jamais « ?key= » : une cle en parametre d'URL finit dans les
        // journaux de serveur, l'historique et les en-tetes de provenance.
        return { "content-type": "application/json", "x-goog-api-key": cle };
      },
      corps: function (modele, prompt) {
        return { contents: [{ role: "user", parts: [{ text: prompt }] }],
                 generationConfig: { maxOutputTokens: IA_MAX_SORTIE } };
      },
      lis: function (j) {
        var c = j && isArray(j.candidates) ? j.candidates[0] : null;
        if (!c || !c.content || !isArray(c.content.parts)) return "";
        var out = "", i;
        for (i = 0; i < c.content.parts.length; i++) {
          if (c.content.parts[i] && c.content.parts[i].text) out += c.content.parts[i].text;
        }
        return out;
      },
      erreur: function (j) { return j && j.error ? j.error.message : ""; }
    },
    {
      v: "mistral",
      label: "Mistral",
      modele: "mistral-small-2603",
      prefixe: "",
      url: "https://api.mistral.ai/v1/chat/completions",
      entetes: function (cle) {
        return { "content-type": "application/json", "authorization": "Bearer " + cle };
      },
      corps: function (modele, prompt) {
        // « max_tokens », surtout pas « max_completion_tokens » : Mistral
        // refuse les champs inconnus par une 422, il ne les ignore pas. Un
        // portage depuis OpenAI casse ici plutot que de se degrader en silence.
        return { model: modele, max_tokens: IA_MAX_SORTIE,
                 messages: [{ role: "user", content: prompt }] };
      },
      lis: function (j) {
        var m = (j && isArray(j.choices) && j.choices[0]) ? j.choices[0].message : null;
        if (!m) return "";
        // En mode raisonnement, `content` arrive en MORCEAUX plutot qu'en
        // chaine. On accepte les deux formes : c'est le modele qui décide, et
        // il est modifiable dans les reglages.
        if (typeof m.content === "string") return m.content;
        if (isArray(m.content)) {
          var out = "", i, b;
          for (i = 0; i < m.content.length; i++) {
            b = m.content[i];
            if (typeof b === "string") out += b;
            else if (b && b.type === "text" && b.text) out += b.text;
          }
          return out;
        }
        return "";
      },
      erreur: function (j) {
        // TROIS enveloppes d'erreur distinctes chez Mistral, et l'ordre des
        // tests compte. La validation (422) range `detail` SOUS `message`, pas
        // a la racine : tester `j.detail` en premier le manque, retombe sur
        // `j.message` qui est alors un OBJET, et affiche « [object Object] ».
        if (!j) return "";
        var m = j.message;
        if (m && isArray(m.detail)) {                       // 422 validation
          var out = [], i, d;
          for (i = 0; i < m.detail.length; i++) {
            d = m.detail[i];
            if (d && d.msg) out.push((isArray(d.loc) ? d.loc.join(".") + " : " : "") + d.msg);
          }
          if (out.length) return out.join(" | ");
        }
        if (typeof j.detail === "string") return j.detail;   // 401 cle invalide
        if (typeof m === "string") return m;                 // routage
        return j.error ? (j.error.message || "") : "";
      }
    }
  ];

  // Message d'erreur lisible. Un code HTTP nu n'aide personne : on traduit les
  // trois cas qui arrivent vraiment, et on garde le message du fournisseur pour
  // le reste.
  function iaMessageErreur(statut, detail) {
    if (statut === 401 || statut === 403) {
      return "Clé refusée par le fournisseur. Vérifie qu'elle est complète et toujours active.";
    }
    if (statut === 404) {
      return "Modèle introuvable (« " + iaModeleActif() + " »). Les noms de modèles changent : corrige-le dans les réglages.";
    }
    if (statut === 429) {
      return "Trop de demandes, ou crédit épuisé chez le fournisseur. Réessaie plus tard.";
    }
    if (detail) return detail;
    return "Le fournisseur a répondu " + statut + ".";
  }

  // Appel. Rend le TEXTE brut du modele à onOk, un message lisible à onErr.
  // Volontairement ignorant de ce que le texte contient : c'est iaLire() qui
  // decide de ce qui est applicable, et il traite ce texte comme hostile — que
  // l'utilisateur l'ait colle a la main ou qu'il vienne d'ici.
  function iaAppelDirect(prompt, onOk, onErr) {
    var f = iaFournisseur();
    if (!f || !iaClePrete()) { onErr("Aucune clé enregistrée."); return; }
    if (!window.fetch) { onErr("Ce navigateur ne sait pas faire l'appel direct. Utilise le presse-papier."); return; }

    var modele = iaModeleActif();
    var url = f.url.replace("{modele}", encodeURIComponent(modele));
    var fini = false;

    // fetch n'a pas de delai maximum. Sans ce garde-fou, un reseau qui traine
    // laisse le bouton en « Analyse en cours… » indefiniment — meme piege que
    // le service worker, meme parade.
    //
    // On ANNULE aussi la requete, on ne se contente pas de cesser d'attendre :
    // une requete abandonnee sans etre annulee continue chez le fournisseur, et
    // se paie. AbortController manque sur les tres vieux navigateurs, d'ou le
    // test — sans lui on garde l'ancien comportement plutot que de planter.
    var stop = null;
    try { if (window.AbortController) stop = new window.AbortController(); } catch (e) {}

    var minuteur = window.setTimeout(function () {
      if (fini) return;
      fini = true;
      if (stop) { try { stop.abort(); } catch (e) {} }
      onErr("Pas de réponse après " + Math.round(IA_TIMEOUT_MS / 1000) + " secondes. Réseau lent, ou fournisseur indisponible.");
    }, IA_TIMEOUT_MS);

    function termine(fn, arg) {
      if (fini) return;
      fini = true;
      window.clearTimeout(minuteur);
      fn(arg);
    }

    var options = {
      method: "POST",
      headers: f.entetes(iaReglages.cle),
      body: JSON.stringify(f.corps(modele, prompt))
    };
    if (stop) options.signal = stop.signal;

    window.fetch(url, options).then(function (rep) {
      return rep.text().then(function (txt) {
        var j = null;
        try { j = JSON.parse(txt); } catch (e) {}
        if (!rep.ok) {
          termine(onErr, iaMessageErreur(rep.status, j ? f.erreur(j) : ""));
          return;
        }
        var texte = j ? f.lis(j) : "";
        if (!texte) {
          termine(onErr, "Réponse vide ou illisible du fournisseur.");
          return;
        }
        termine(onOk, texte);
      });
    })["catch"](function (e) {
      // Un echec de fetch ne dit pas pourquoi : hors-ligne, DNS, CORS, tout
      // ressort en « Failed to fetch ». On nomme la cause la plus probable.
      termine(onErr, "Appel impossible : vérifie ta connexion. (" +
                     (e && e.message ? e.message : "erreur réseau") + ")");
    });
  }


  // ===========================================================================
  // CLE D'API : STOCKAGE
  // ---------------------------------------------------------------------------
  // La cle vit HORS du profil, et ce n'est pas un detail de rangement.
  // buildPayload() exporte `profile` : une cle rangee dedans partirait dans le
  // fichier de sauvegarde, celui-la meme que l'utilisateur s'envoie par mail ou
  // AirDrop pour changer de telephone. Une cle d'API est un moyen de paiement —
  // elle n'a rien a faire dans un fichier fait pour etre transmis.
  //
  // Elle ne suit donc PAS la sauvegarde, volontairement : on la ressaisit sur le
  // nouvel appareil. C'est trois secondes de gene contre une fuite silencieuse.
  //
  // Consequence a ne pas oublier : tout ce qui vit hors du profil echappe aussi a
  // cleanProfile. Ces reglages ont donc leur propre validation, cleanIaReglages,
  // appelee par loadSettings. Sans elle, un stockage abime rendrait un objet
  // inattendu et l'ecran des reglages planterait au chargement.
  // ===========================================================================
  var IA_CLE_MAX = 200;
  var IA_MODELE_MAX = 60;

  var iaReglages = { fournisseur: "", cle: "", modele: "" };

  function cleanIaReglages(raw) {
    var out = { fournisseur: "", cle: "", modele: "" };
    if (!raw || typeof raw !== "object") return out;
    var i, connu = false;
    for (i = 0; i < IA_FOURNISSEURS.length; i++) {
      if (IA_FOURNISSEURS[i].v === raw.fournisseur) connu = true;
    }
    if (!connu) return out;                 // fournisseur inconnu : on repart a vide
    out.fournisseur = raw.fournisseur;
    // Une cle est une chaine imprimable sans espace. On retire les blancs de
    // bord, que le collage depuis un site ramene presque toujours.
    if (typeof raw.cle === "string") {
      out.cle = raw.cle.replace(/^\s+|\s+$/g, "").replace(/[\r\n\t ]/g, "").slice(0, IA_CLE_MAX);
    }
    if (typeof raw.modele === "string") {
      out.modele = raw.modele.replace(/^\s+|\s+$/g, "").slice(0, IA_MODELE_MAX);
    }
    return out;
  }

  function iaFournisseur() {
    var i;
    for (i = 0; i < IA_FOURNISSEURS.length; i++) {
      if (IA_FOURNISSEURS[i].v === iaReglages.fournisseur) return IA_FOURNISSEURS[i];
    }
    return null;
  }

  // Changer de fournisseur INVALIDE la cle enregistree.
  //
  // Le modele par defaut depend du fournisseur, et on le remet a zero pour cette
  // raison. La cle en depend tout autant, et l'oublier coutait beaucoup plus
  // cher : une cle Anthropic conservee au passage sur Mistral partait telle
  // quelle chez api.mistral.ai, dans un en-tete Authorization, au premier
  // « Tester la connexion ». Un moyen de paiement transmis a un tiers qui n'a
  // jamais eu a le connaitre, et qu'il faut ensuite aller revoquer.
  //
  // Pire, l'ecran MENTAIT : la carte repliee affichait « Cle enregistree ·
  // Mistral » et le masque « sk-ant••••••••6789 ». On efface donc, on le DIT, et
  // la saisie se rouvre pour que ce ne soit pas une surprise silencieuse.
  //
  // Le test d'egalite garde l'idempotence : re-choisir le MEME fournisseur ne
  // detruit rien, et rien n'est annonce quand aucune cle n'est posee.
  function iaChangerFournisseur(v) {
    var nouveau = cleanIaReglages({ fournisseur: v }).fournisseur;
    state.iaAvisCle = "";
    if (nouveau !== iaReglages.fournisseur) {
      if (iaReglages.cle) {
        iaReglages.cle = "";
        // Deux situations, deux phrases. « — Aucun (pont presse-papier) — » se
        // lit comme « je repasse au collage », pas comme « supprime ma clé » :
        // lui répondre « saisis celle du nouveau » n'aurait aucun sens, il n'y a
        // pas de nouveau fournisseur.
        state.iaAvisCle = nouveau
          ? "Clé effacée : elle appartenait au fournisseur précédent. Saisis celle du nouveau."
          : "Clé effacée : plus aucun fournisseur sélectionné.";
      }
      // Le modèle par défaut dépend du fournisseur : le garder n'aurait aucun
      // sens. On ne le remet à zéro QUE sur un vrai changement, sinon rouvrir le
      // menu sans rien changer effaçait le modèle saisi à la main.
      iaReglages.modele = "";
    }
    iaReglages.fournisseur = nouveau;
    state.iaCleVisible = !iaReglages.cle;
  }

  // Une cle est-elle utilisable ? On ne verifie pas sa validite — seul le
  // fournisseur peut le dire — seulement qu'il y a de quoi tenter l'appel.
  function iaClePrete() {
    var f = iaFournisseur();
    return !!(f && iaReglages.cle && iaReglages.cle.length >= 12);
  }

  function iaModeleActif() {
    var f = iaFournisseur();
    if (!f) return "";
    return iaReglages.modele || f.modele;
  }

  // Relit les champs VIVANTS du formulaire.
  //
  // La saisie ne declenche pas de rendu — sinon le clavier se refermerait a
  // chaque frappe — donc l'etat peut etre en retard sur ce qui est a l'ecran.
  // Pire sur iOS : un collage par le menu systeme ne declenche pas toujours
  // l'evenement input. Tout geste qui UTILISE la cle relit donc le DOM d'abord,
  // au lieu de faire confiance a l'etat.
  function iaLireChamps() {
    var champCle = document.getElementById("ia-cle");
    var champModele = document.getElementById("ia-modele");
    // Le champ n'existe que si la cle est en mode saisie. Absent, on garde la
    // cle enregistree : ne pas l'ecraser avec une chaine vide.
    if (champCle) {
      iaReglages.cle = String(champCle.value)
        .replace(/^\s+|\s+$/g, "").replace(/[\r\n\t ]/g, "").slice(0, IA_CLE_MAX);
      // Une clé est de nouveau posée : l'avis d'effacement a fait son office et
      // devient un mensonge. Sans cette ligne, la carte affichait en même temps
      // « Clé effacée, saisis celle du nouveau » et la clé enregistrée avec son
      // bouton « Effacer ». On le remet à zéro ici, c'est-à-dire dans le seul
      // endroit que TOUS les gestes utilisant la clé traversent.
      if (iaReglages.cle) state.iaAvisCle = "";
    }
    if (champModele) {
      iaReglages.modele = String(champModele.value).replace(/^\s+|\s+$/g, "").slice(0, IA_MODELE_MAX);
    }
  }

  // Affichage masque : assez pour reconnaitre SA cle, pas assez pour la lire
  // par-dessus l'epaule. On garde le prefixe, qui identifie le fournisseur, et
  // les quatre derniers caracteres, qui distinguent deux cles du meme compte.
  function iaCleMasquee(cle) {
    if (!cle) return "";
    if (cle.length <= 12) return new Array(cle.length + 1).join("•");
    return cle.slice(0, 6) + new Array(9).join("•") + cle.slice(-4);
  }


  // ===========================================================================
  // CARTE « REGLAGES AVANCES » : la cle d'API
  // ---------------------------------------------------------------------------
  // Repliee par defaut, et placee apres le profil : c'est une option pour qui
  // sait ce qu'est une cle d'API, pas une etape du parcours. Quelqu'un qui
  // ignore ce que c'est ne doit jamais avoir a se poser la question — le pont
  // presse-papier marche sans rien de tout ca.
  // ===========================================================================
  function iaCleHtml() {
    if (!profile || !profile.done) return "";

    // L'ETAT DE LA CLE VIT DESORMAIS DANS LE RESUME du titre-bouton : il survit au
    // repliage, ce qui etait tout l'interet de la note de repli qu'on retire.
    // SOUS-BLOC de l'assistant, plus une carte a part. C'etait le defaut que
    // signalait Olivier : on saisissait la cle dans « Reglages avances » et on s'en
    // servait dans deux autres cartes, sans rien qui relie les trois.
    var entete =
      '<div class="ana-bloc">' +
        '<div class="field-label">Ta clé d\'API — facultative</div>' +
        '<button type="button" class="detail-toggle" data-action="toggle-avance" aria-expanded="' +
          (state.avanceOuvert ? "true" : "false") + '">' +
          (state.avanceOuvert
            ? "Masquer ▲"
            : (iaClePrete()
                 ? "Clé enregistrée · " + esc(iaFournisseur().label) + " ▼"
                 : "Aucune clé · l'appli passe par le presse-papier ▼")) +
        '</button>';

    if (!state.avanceOuvert) return entete + '</div>';


    var f = iaFournisseur();
    var opts = "", i;
    opts += '<option value=""' + (iaReglages.fournisseur ? "" : " selected") + '>— Aucun (pont presse-papier) —</option>';
    for (i = 0; i < IA_FOURNISSEURS.length; i++) {
      opts += '<option value="' + esc(IA_FOURNISSEURS[i].v) + '"' +
              (IA_FOURNISSEURS[i].v === iaReglages.fournisseur ? " selected" : "") + '>' +
              esc(IA_FOURNISSEURS[i].label) + '</option>';
    }

    // CE TEXTE DISAIT CE QUE LA CLE N'EST PAS, JAMAIS CE QUE LE PONT EST.
    //
    // Il expliquait tres bien qu'une cle d'API « n'est pas ton abonnement
    // habituel, ce sont deux produits separes » — et ne disait nulle part que
    // le PONT, lui, marche avec l'abonnement que l'utilisateur a DEJA. Le
    // proprietaire de l'appli en a conclu qu'il fallait payer une API pour se
    // servir de la fonction. C'est l'information la plus utile de la carte, et
    // c'etait la seule qui manquait.
    //
    // L'ORDRE EST LE MESSAGE : (1) tu n'as besoin de rien ; (2) la cle est un
    // confort ; (3) voila ce qu'elle coute. La mise en garde d'origine reste,
    // mais en queue de paragraphe, ou elle informe au lieu de dissuader.
    //
    // LE CHIFFRE EST MESURE, PAS ESTIME. Bilan d'un profil charge — 23
    // exercices, 80 seances journalisees — 8 653 caracteres, soit environ
    // 2 450 jetons en entree ; la reponse attendue est courte, de l'ordre de
    // 600 jetons. Au tarif du modele par defaut (5 $ le million de jetons en
    // entree, 25 $ en sortie), l'analyse revient a 0,028 $. D'ou « environ
    // 3 centimes », arrondi vers le haut : sur un prix, mieux vaut annoncer un
    // peu trop que pas assez.
    var corps =
      '<div class="ia-note">' +
        'Le pont presse-papier ne demande <b>rien</b> : il marche avec l\'abonnement IA ' +
        'que tu as déjà. Tu copies ton bilan, tu le colles dans ton assistant, tu ' +
        'rapportes la réponse. La clé d\'API ci-dessous est un simple confort — elle ' +
        'évite les copier-coller en laissant l\'appli interroger l\'IA directement. Elle ' +
        'se crée sur le site du fournisseur et se paie à l\'usage, environ 3 centimes ' +
        'par analyse ; ce n\'est pas ton abonnement, ce sont deux produits séparés.' +
      '</div>' +

      '<div class="field">' +
        '<label class="field-label" for="ia-fournisseur">Fournisseur</label>' +
        '<select id="ia-fournisseur" class="ia-select" data-action="ia-fournisseur">' + opts + '</select>' +
        // L'avis d'effacement se rend ICI, sous le sélecteur, et pas seulement
        // en bannière : mesuré sur un iPhone, la bannière se pose en haut du
        // document alors que ces réglages sont tout en bas — 3 296 px au-dessus
        // de l'écran, jamais vue, et effacée au bout de sept secondes. Le seul
        // signal perçu était le champ de saisie qui se rouvre, ce qui n'explique
        // rien. Or c'est précisément l'information qu'il ne faut pas manquer :
        // sans elle, on croit sa clé toujours en place.
        (state.iaAvisCle
          ? '<div class="ia-cle-avis" role="status">' + esc(state.iaAvisCle) + '</div>'
          : '') +
      '</div>';

    if (f) {
      var cleAffichee = state.iaCleVisible ? iaReglages.cle : "";
      corps +=
        '<div class="field">' +
          '<label class="field-label" for="ia-cle">Clé API</label>' +
          (state.iaCleVisible
            ? '<input id="ia-cle" type="text" autocomplete="off" autocapitalize="off" ' +
                'autocorrect="off" spellcheck="false" class="ia-input" data-action="ia-cle-saisie" ' +
                'placeholder="' + esc(f.prefixe) + '…" value="' + esc(cleAffichee) + '">'
            // Champ masque : on n'y remet PAS la vraie cle. Un input password
            // rempli se laisse lire par n'importe quelle inspection, et surtout
            // le navigateur proposerait de l'enregistrer comme mot de passe.
            : '<div class="ia-cle-masque">' +
                (iaReglages.cle ? esc(iaCleMasquee(iaReglages.cle)) : '<i>aucune clé enregistrée</i>') +
              '</div>') +
          '<button type="button" class="ia-lien" data-action="ia-cle-voir">' +
            (state.iaCleVisible ? "Masquer la clé" : (iaReglages.cle ? "Modifier la clé" : "Saisir une clé")) +
          '</button>' +
        '</div>' +

        '<div class="field">' +
          '<label class="field-label" for="ia-modele">Modèle</label>' +
          '<input id="ia-modele" type="text" autocomplete="off" autocapitalize="off" ' +
            'autocorrect="off" spellcheck="false" class="ia-input" data-action="ia-modele-saisie" ' +
            'placeholder="' + esc(f.modele) + '" value="' + esc(iaReglages.modele) + '">' +
          '<div class="field-hint">Laisse vide pour utiliser ' + esc(f.modele) + '. ' +
            'Les noms de modèles changent : si l\'appel échoue, c\'est souvent ça.</div>' +
        '</div>' +

        '<button type="button" class="ia-btn" data-action="ia-tester">⇄ Tester la connexion</button>' +
        (iaReglages.cle
          ? '<button type="button" class="ia-lien ia-lien-danger" data-action="ia-cle-effacer">Effacer la clé de cet appareil</button>'
          : '') +

        '<div class="nutri-disclaimer">' +
          'La clé reste sur ce téléphone et n\'est <b>jamais incluse dans la sauvegarde</b> : ' +
          'un fichier de sauvegarde se transmet, une clé de paiement ne se transmet pas. ' +
          'Tu la ressaisiras sur un nouvel appareil. Chaque analyse envoie ton bilan ' +
          'd\'entraînement au fournisseur et t\'est facturée par lui, quelques centimes ' +
          'à chaque fois. Tu peux révoquer la clé sur son site à tout moment.' +
        '</div>';
    }

    return entete + corps + '</div>';
  }

  // ===========================================================================
  // TABLE D'ALIMENTS
  // ---------------------------------------------------------------------------
  // Le socle des quantités. Sans elle, le plan nutrition ne sait dire qu'un
  // grammage de protéines ; avec elle, il sait dire QUOI manger et COMBIEN.
  //
  // D'OÙ VIENNENT LES CHIFFRES. Ce sont des ORDRES DE GRANDEUR arrondis, tirés
  // des tables de composition usuelles (Ciqual / ANSES pour les aliments
  // courants en France, FoodData Central de l'USDA pour recouper). Ils ne sont
  // PAS des mesures : deux blancs de poulet, deux yaourts grecs, deux barres
  // protéinées de deux marques n'ont pas la même composition. L'écart réel se
  // compte en dizaines de pourcent sur un aliment isolé, en quelques pourcent
  // sur une journée entière. C'est assez pour orienter un repas, pas pour
  // prétendre à une comptabilité. L'interface doit continuer à le dire.
  //
  // ÉTAT DE RÉFÉRENCE — le piège numéro un de cette table. `prot100`, `kcal100`
  // et `gPor` décrivent TOUS LES TROIS le même état de l'aliment, celui que
  // `nom` annonce :
  //   - viandes, poissons, œufs : l'état CRU, c'est-à-dire le morceau tel qu'on
  //     l'achète et tel qu'on se le représente (« 1 filet », « 1 pavé ») ;
  //   - féculents et légumineuses : l'état CUIT, dit dans le nom (« riz cuit »,
  //     « lentilles cuites »), parce que personne ne se représente 70 g de riz
  //     sec dans une assiette ;
  //   - tout le reste : tel qu'il se mange.
  // Les deux conventions se valent en arithmétique : la cuisson fait perdre de
  // l'eau, pas des protéines. 150 g de poulet cru pèsent ~110 g cuits mais
  // portent les mêmes ~35 g de protéines. Ce qu'il ne faut JAMAIS faire, c'est
  // appliquer prot100 d'un état au grammage de l'autre.
  //
  // AUCUNE MARQUE, AUCUN PRODUIT PRÉCIS : que des catégories génériques, pour
  // que la table vieillisse bien et n'oriente vers aucun achat.
  // ===========================================================================

  // Catégories. Elles servent au générateur de repas : une prise se compose en
  // piochant une source de protéines, éventuellement un féculent, un légume.
  var ALIMENT_CATS = {
    prot:  "Sources de protéines",
    lait:  "Laitages",
    fec:   "Féculents",

    fruit: "Fruits",

  };

  //   por      nom de la portion au singulier (« filet », « poignée », « bol »).

    // cote de lui. Les ranger en `gras` les aurait soumises a GRAS_ACCORD, qui
    // repond a une autre question — « ce corps gras va-t-il avec ce plat ? » —
    // et les aurait exclues des collations sans fruit accepte. Un role separe
    // dit ce qu'elles sont : le second aliment d'une prise d'appoint.
    //
    // LE HOUMOUS N'Y EST PAS. Il se mange avec du pain ou des cruditees, jamais
    // a la cuillere : le servir seul a 16h serait exactement le genre de ligne
    // qu'on est en train de corriger. Il reste dans la table pour le selecteur
    // du tiroir, ou c'est l'utilisateur qui sait ce qu'il en fait.
    "encas|collation": ["amandes", "cajou", "abricots"],
    "encas|pdj":       ["amandes", "cajou", "abricots"],
    // Le vivier des gras est le MEME aux trois types de prise : ce n'est pas
    // lui qui trie, c'est GRAS_ACCORD juste en dessous. Voir le commentaire :
    // une regle vaut mieux que trois listes qui divergeront.
    "gras|repas":     ["huile", "beurre", "avocat", "cacahuete"],
    "gras|pdj":       ["huile", "beurre", "avocat", "cacahuete"],
    "gras|collation": ["huile", "beurre", "avocat", "cacahuete"]
  };

  // CE QUI VA AVEC QUOI. Un gras ne se sert pas dans le vide : il accompagne
  // quelque chose, et pas n'importe quoi. La table d'aliments ne le sait pas —
  // elle decrit des aliments, pas des habitudes — et NUTRI_POOL ne repond qu'a
  // la question du CRENEAU. Il manquait la troisieme : dans cette prise-la, ce
  // gras va-t-il avec ce qu'il y a dedans ?
  //
  // MESURE AVANT. 1 680 prises composees (5 profils x 70 journees) portaient
  // 124 associations que personne ne sert :
  //   - 115 fois le beurre de cacahuete tire comme matiere grasse d'un plat
  //     sale — « 1 pave de saumon + brocolis + quinoa + 1 cuillere a soupe de
  //     beurre de cacahuete », « 2 boites de sardines + concombre + pain +
  //     3 cuilleres a soupe de beurre de cacahuete » ;
  //   - 9 fois le beurre pose sur une assiette SANS feculent — « 1 boule de
  //     mozzarella + salade verte + 2 noisettes de beurre ». Une noisette de
  //     beurre fond sur des pommes de terre, pas sur de la salade.
  //
  // UNE REGLE, PAS UNE LISTE DE CAS PARTICULIERS. Deux champs suffisent :
  //   plats  les types de plat ou ce gras a sa place. « sale » = une assiette
  //          de midi ou du soir ; « sucre » = une tartine, un bol, un fruit.
  //   exige  les roles dont AU MOINS UN doit DEJA etre dans la prise pour que
  //          le gras s'y pose. Vide = ce gras se sert nature.
  //   fruits quand le role « fruit » figure dans `exige`, la LISTE des fruits
  //          qui l'acceptent vraiment. Absent = tous.
  // Un gras ajoute demain a la table doit s'y declarer : sans entree ici il ne
  // sort d'AUCUN vivier, et un silence qui se voit vaut mieux qu'une assiette
  // qui ne se mange pas.
  //
  // « FRUIT » EST UN ROLE, PAS UNE LISTE — ET C'EST CE QUI MANQUAIT. `exige`
  // repondait a « y a-t-il un fruit dans cette prise ? », jamais a « LEQUEL ».
  // La regle etait donc juste pour la banane et la pomme, sur lesquelles elle
  // avait ete ecrite, et fausse pour les quatre autres entrees du vivier :
  // « 1 orange (180 g) + 1 cuillere a soupe de beurre de cacahuete », « 2 kiwis
  // + beurre de cacahuete », la compote et le bol de fruits rouges. Mesure avant
  // correction : 65 associations de ce type sur 224 prises portant du beurre de
  // cacahuete, soit pres d'une sur trois — et ce sont les 65 seules qu'on ne
  // sert pas, les « pomme + beurre de cacahuete » etant parfaitement normales.
  //
  // UNE LISTE D'IDENTIFIANTS PLUTOT QU'UN DRAPEAU SUR L'ALIMENT. Le drapeau
  // aurait vecu dans ALIMENTS, qui decrit des aliments et non des habitudes —
  // meme raison que NUTRI_POOL et FEC_FAM juste en dessous. Et « ce fruit
  // accepte le beurre de cacahuete » n'est pas une propriete du fruit : c'est
  // une propriete de la PAIRE. Elle vit donc du cote du gras, la ou la question
  // est posee. Un fruit ajoute au vivier ne recevra pas de cacahuete tant qu'il
  // n'est pas ecrit ici : c'est le sens de marche voulu.
  var GRAS_ACCORD = {
    huile:     { plats: "sale",       exige: [] },               // assaisonne n'importe quel plat sale
    avocat:    { plats: "sale",       exige: [] },               // se mange nature, a la cuillere
    beurre:    { plats: "sale sucre", exige: ["fec"] },          // sur du feculent ou du pain, jamais nu
    // sur du pain ou une banane, pas sur du saumon — ni sur une orange
    cacahuete: { plats: "sucre",      exige: ["fec", "fruit"], fruits: ["banane", "pomme"] }
  };
  // Le type de plat d'un creneau se deduit de son MOTIF : ce qui se sert a midi
  // et le soir est sale, ce qui se sert au petit-dejeuner et au gouter est
  // sucre. Un motif absent de cette table n'accepte aucun gras — le coucher, par
  // exemple, n'en recoit pas.
  var GRAS_PLAT = { repas: "sale", pdj: "sucre", collation: "sucre" };

  // DEUX FECULENTS DE LA MEME FAMILLE NE FONT PAS DEUX FECULENTS. Le second
  // feculent n'ecartait que l'IDENTIFIANT du premier : assez pour interdire
  // « pain + pain », pas « pain + wrap », qui sont deux pains. Mesure sur le
  // profil « je ne cuisine pas » (h 95 kg, 3 repas), ou le vivier sans cuisson
  // se reduisait justement a ces deux-la : 11 assiettes sur 28 servaient les
  // deux ensemble, jusqu'a « 4 tranches de pain complet (160 g) + 3 wraps
  // (180 g) » dans le meme repas — 340 g de farine, plus l'avocat.
  //
  // La famille dit CE QUI SE SUBSTITUE A QUOI dans une assiette. Elle vit ici
  // et non dans ALIMENTS, meme partage que NUTRI_POOL et POR_MAX : elle ne
  // decrit pas un aliment, elle decrit la place qu'il occupe dans un repas.
  // Un feculent absent de la table est sa propre famille — il ne s'exclut donc
  // que lui-meme, ce qui est le comportement d'avant.
  var FEC_FAM = {
    pain: "pain",     wrap: "pain",                                 // deux pains
    riz: "graine",    pates: "graine",   semoule: "graine",
    quinoa: "graine", flocons: "graine", taboule: "graine",         // deux céréales
    pdt: "tubercule", patdouce: "tubercule",                        // deux tubercules
    mais: "mais"
  };
  function fecFamille(id) { return has(FEC_FAM, id) ? FEC_FAM[id] : id; }
  // Tous les identifiants de la famille d'un feculent, lui compris. C'est ce
  // que `exclu` recoit : une INTERDICTION de famille, pas d'aliment.
  function fecMemeFamille(id) {
    var fam = fecFamille(id), out = [], k;
    for (k in FEC_FAM) { if (has(FEC_FAM, k) && FEC_FAM[k] === fam) out.push(k); }
    if (out.indexOf(id) < 0) out.push(id);
    return out;
  }

  // DEUX LEGUMINEUSES NE FONT PAS DEUX SOURCES DE PROTEINES — meme defaut que
  // « pain + wrap », au meme endroit du raisonnement, et il avait survecu a sa
  // correction parce que la seconde SOURCE n'ecartait elle aussi que
  // l'IDENTIFIANT de la premiere. Mesure sur un balayage de 96 profils x 28
  // journees : 43 assiettes servaient deux legumineuses ensemble, jusqu'a « 3
  // portions de haricots blancs egouttes (450 g) + 2 portions de pois chiches
  // egouttes (300 g) » — 750 g de conserve dans un seul repas, pour 46 g de
  // proteines qu'une boite de thon apporte en 180 g.
  //
  // POURQUOI ELLES ET PAS LES AUTRES. Deux viandes dans une assiette — du jambon
  // et du thon — restent parfaitement normales et ne sont pas concernees. Les
  // lentilles sont de la famille bien qu'elles demandent une casserole : ce
  // n'est pas le rayon du magasin qui fait la regle.
  //
  // LE SOJA MANQUAIT, ET LA RAISON EST INSTRUCTIVE. Cette table a longtemps
  // ignore le tofu, et la justification ecrite ici invoquait la DENSITE : « 7 a
  // 9 g de proteines aux 100 g, la ou une viande en porte 18 a 26 ». Cet
  // argument etait une rationalisation apres coup, et c'est LUI qui a laisse
  // passer le soja — le tofu ferme porte 12 g et le tofu fume 16 g, hors de la
  // bande 7-9, donc « pas une legumineuse » selon un critere que la regle ne
  // suivait pas vraiment. Elle a toujours ete BOTANIQUE, et le soja EST une
  // legumineuse. Le plat que le paragraphe ci-dessus cite comme raison d'etre de
  // la regle se reconstituait donc tel quel avec du tofu.
  //
  // MESURE, balayage de 640 profils x 28 journees = 71 680 prises :
  //   avant            : 58 prises servaient deux sources de la famille au sens
  //                      large, l'assiette la plus lourde pesait 990 g pour un
  //                      plafond de prise a 950 — « 3 portions de tofu fume
  //                      (300 g) + 3 portions de pois chiches egouttes (450 g)
  //                      + 2 tomates (240 g) », la SEULE du balayage a franchir
  //                      MASSE_MAX_PRISE.
  //   apres            : 0 prise a deux sources de la famille, masse maximale
  //                      950 g, 0 au-dessus du plafond.
  //   PRIX : aucun, et meme l'inverse. Les journees sous 90 % de leur cible
  //   proteique passent de 821 a 773 sur 17 920 — ecarter le tofu comme SECONDE
  //   source pousse le tirage vers des sources plus denses, qui atteignent la
  //   cible plus facilement. Les journees au-dessus du plafond de 2,2 g/kg ne
  //   bougent pas (65 avant, 65 apres).
  //
  // Meme partage que FEC_FAM : la table vit ici et non dans ALIMENTS, parce
  // qu'elle ne decrit pas un aliment mais la place qu'il occupe dans un repas.
  // Une source absente de la table est sa propre famille — elle ne s'exclut donc
  // qu'elle-meme, ce qui est le comportement d'avant.
  var PROT_FAM = {
    poischiche: "legumineuse", harirouges: "legumineuse",
    hariblancs: "legumineuse", lentilles: "legumineuse",
    // Le soja. Botaniquement une legumineuse, et servi en portions comme les
    // autres : c'est ce qui manquait.
    tofu: "legumineuse", tofufume: "legumineuse"
  };
  function protFamille(id) { return has(PROT_FAM, id) ? PROT_FAM[id] : id; }
  function protMemeFamille(id) {
    var fam = protFamille(id), out = [], k;
    for (k in PROT_FAM) { if (has(PROT_FAM, k) && PROT_FAM[k] === fam) out.push(k); }
    if (out.indexOf(id) < 0) out.push(id);
    return out;
  }
  // Cout d'un gras d'accompagnement, reserve sur la cible calorique AVANT de
  // dimensionner le feculent. Un seul chiffre pour les deux formes qui en
  // servent : deux constantes auraient diverge.
  var RESERVE_GRAS = 90;

  function grasAccord(a) { return (a && has(GRAS_ACCORD, a.id)) ? GRAS_ACCORD[a.id] : null; }
  function grasVaAvecPlat(a, motif) {
    var r = grasAccord(a), t = has(GRAS_PLAT, motif) ? GRAS_PLAT[motif] : "";
    return !!(r && t && r.plats.indexOf(t) >= 0);
  }
  // `pose` dit ce qui est DEJA dans l'assiette, role par role. On l'interroge au
  // moment de poser le gras, pas au tirage : le feculent peut avoir ete tire et
  // pas servi, et c'est ce qui est SERVI qui decide.
  //
  // `pose.fruit` porte l'IDENTIFIANT du fruit servi, pas un booleen — c'est ce
  // qui permet a `fruits` de trancher. Une chaine vide vaut « pas de fruit », et
  // reste fausse pour le `if` : les trois autres roles restent des booleens et
  // la boucle ne fait pas de difference entre les quatre.
  function grasVaAvecPrise(a, pose) {
    var r = grasAccord(a), i, role;
    if (!r) return false;
    if (!r.exige.length) return true;
    for (i = 0; i < r.exige.length; i++) {
      role = r.exige[i];
      if (!pose[role]) continue;
      // Le role est bien la, mais ce fruit-la ne l'accepte pas : on continue de
      // chercher au lieu de rendre faux tout de suite. Un pain de mie ET une
      // orange dans la meme prise, c'est le PAIN qui justifie la cuillere.
      if (role === "fruit" && r.fruits && r.fruits.indexOf(pose.fruit) < 0) continue;
      return true;
    }
    return false;
  }
  // Ce gras a-t-il une CHANCE d'etre servi, vu la composition tiree ? Sert a ne
  // reserver les 90 kcal que quand elles seront depensees : les reserver pour un
  // beurre qui sera ecarte faute de feculent ferait manquer 90 kcal a l'assiette.
  // Le fruit TIRE y passe par son identifiant, comme le fruit SERVI plus bas :
  // reserver 90 kcal pour une cuillere qu'une orange va faire ecarter est
  // exactement l'erreur que cette fonction existe pour eviter.
  function grasPlausible(a, c) {
    return grasVaAvecPrise(a, { prot: !!c.prot, leg: !!c.leg,
                                fec: !!c.fec, fruit: c.fruit ? c.fruit.id : "" });
  }
  // LA RESERVE NE SE PREND QUE SI ELLE SERA DEPENSEE. Deux conditions, et il a
  // fallu les deux : un gras qui a une chance d'etre servi, ET assez de
  // calories pour payer a la fois l'accompagnement minimal et le gras. Sans la
  // seconde, une collation a 210 kcal reservait 90 kcal, n'avait plus de quoi
  // poser un fruit entier, ne posait pas le gras non plus faute des 60 kcal
  // restantes, et tombait de « 1 pot de skyr + 1 banane » (198 kcal) a « 1 pot
  // de skyr, seul aliment de la prise + resservir selon la faim » (90 kcal).
  // `minAcc` est le prix plancher de l'accompagnement de cette forme-la.
  function reserveGras(c, dispo, minAcc) {
    return (c.gras && grasPlausible(c.gras, c) && dispo >= RESERVE_GRAS + minAcc)
      ? RESERVE_GRAS : 0;
  }

  // Proteines apportees PAR L'ACCOMPAGNEMENT, en g, estimees a l'avance. Sans
  // cette reserve la source de proteines est dimensionnee sur la cible pleine,
  // les feculents ajoutent leur part par-dessus, et le total du jour depasse de
  // 30 a 40 % (mesure sur le prototype v1).
  var RESERVE_ACC = { assiette: 10, pdj: 10, legere: 4, collation: 1, laitier: 2 };
  var PART_SOURCE_MIN = 0.6;   // la source porte au moins 60 % de la cible
  // Ce qu'il doit MANQUER a la premiere source pour qu'une seconde ait un sens.
  // En dessous, on ajouterait une ligne pour une garniture : 12 g, c'est une
  // vraie portion — deux tranches de jambon, une demi-boite de thon.
  var PROT_SOURCE2_MIN = 12;
  var PROT_MIN_SLOT = 10, PROT_MAX_SLOT = 55;
  var TOL_PRISE = 0.10;
  var PROT_MAX_DEPASSEMENT = 1.20;   // au-dela, on allege, on ne subit pas
  var CORR_MIN = 0.85, CORR_MAX = 1.30;

  // Si les prises INCOMPRESSIBLES couvrent deja la cible du jour, les prises
  // d'appoint n'ont pas a porter de proteines en plus : elles deviennent une
  // prise d'energie — un fruit, du pain. C'est la seule facon d'eviter que
  // « cinq repas » veuille dire « +40 % de proteines ».
  //
  // LA COLLATION EN FAIT PARTIE, et son absence se mesurait : les profils que
  // l'appli proposait puis condamnait par son propre plafond de 2,2 g/kg
  // avaient presque tous des creneaux [pdj, dej, col, din] — pas un seul
  // creneau allegeable dans la liste, donc rien a alleger, donc un plan a 115 g
  // pour 75 vises chez quelqu'un de 50 kg. Une collation est une prise
  // d'APPOINT au meme titre qu'« avant la seance » : le petit-dejeuner, le
  // dejeuner et le diner sont les trois repas de structure, tout le reste peut
  // redevenir une prise d'energie. Elle vient EN DERNIER : c'est le creneau le
  // plus proche d'un vrai moment de repas des quatre, on ne l'allege qu'apres
  // avoir essaye les autres.
  var SLOTS_ALLEGEABLES = ["pre", "soir", "mat", "col"];

  // ET QUAND IL N'Y A PLUS RIEN A ALLEGER. Vider les creneaux d'appoint ne suffit
  // pas toujours : chez quelqu'un de leger, les TROIS repas de structure pesent
  // deja plus que le plafond a eux seuls. Mesure sur Marie, 52 kg, cible 95 g,
  // plafond 114 g : ses creneaux [pdj, dej, din] totalisaient 97 g pour 72 vises,
  // et la boucle d'allegement sortait sans rien pouvoir faire — 4 journees sur 14
  // entre 116 et 126 g, c'est-a-dire au-dessus du plafond que l'appli affiche
  // elle-meme deux lignes plus bas.
  //
  // LA CAUSE EST UN PLANCHER, PAS UN HASARD. Une source de proteines ne se sert
  // pas en dessous de la moitie d'une portion courante (alimMinPor) : a partir
  // d'un certain point, baisser la cible d'un creneau ne baisse plus ce qui est
  // servi. On abaisse donc la cible PROTEIQUE des creneaux de structure par
  // crans, on RECOMPOSE et on RE-MESURE a chaque cran — meme methode que les deux
  // boucles suivantes —, et on s'arrete des que le plafond est tenu ou qu'un cran
  // n'abaisse plus rien.
  //
  // CE QU'ON N'ABAISSE PAS : les calories. Le plafond porte sur les proteines, et
  // quelqu'un a qui on retire 20 g de proteines doit toujours manger autant. La
  // cible calorique du creneau ne bouge donc pas d'un iota : c'est la DENSITE
  // proteique de l'assiette qui descend, pas la quantite de nourriture.
  //
  // ET SURTOUT : CE N'EST PAS LA CIBLE QU'IL FAUT BAISSER, C'EST CE QUI EST
  // SERVI. Premiere ecriture de ce correctif, mesuree et jetee : elle abaissait
  // parts[i].prot, et n'a rien change du tout — 4 journees sur 14 avant, 4 apres.
  // La raison se lit sur la journee de Marie : ses creneaux visaient DEJA 15, 12
  // et 20 g de proteines, et servaient 26, 40 et 32. La cible n'etait pas le
  // probleme. Le probleme est le PLANCHER DE PORTION : grPourProt ne descend
  // jamais sous la moitie d'une portion courante, et pour un filet de poulet
  // cette moitie-la vaut encore un filet entier, soit 34 g de proteines a lui
  // seul. Baisser une cible de 12 a 10 g ne change rien quand la plus petite
  // chose servable en apporte 34.
  //
  // On pose donc un PLAFOND PAR CRENEAU sur ce que la source a le droit
  // d'apporter, et on le calcule sur ce que le creneau sert REELLEMENT, pas sur
  // ce qu'il visait. Voir grBornerProt : sous le plafond, on sert le grammage
  // qui le tient, et alimentTexte bascule d'elle-meme sur « 75 g de poulet ».
  var STRUCT_CRANS = [0.85, 0.7, 0.55];
  // En dessous, un « repas de structure » n'en est plus un : on prefere avouer le
  // depassement plutot que proposer un dejeuner a 8 g de proteines.
  //
  // 15 g LAISSAIT PASSER DES ASSIETTES QU'ON NE SERT PAS. Mesure sur 70 journees
  // x 4 profils : 89 repas de structure sur 560 servis sous 25 g de proteines,
  // et les pires ne sont pas des repas legers — ce sont des assiettes PLEINES
  // avec une source symbolique a cote : « 1 oeuf (55 g) + 1 demi-concombre +
  // 1 assiette de pates cuites (200 g) », 18 g pour 403 kcal ; « 1 tranche de
  // saumon fume (30 g) + epinards + patate douce + 2 c. a soupe d'huile », 16 g
  // pour 464 kcal. La cause est ecrite trois paragraphes plus haut : le plafond
  // fait baisser la cible PROTEIQUE du creneau pendant que sa cible CALORIQUE ne
  // bouge pas. Ce n'est pas la quantite de nourriture qui s'effondre, c'est la
  // densite proteique — et 15 g de plafond de PRISE, une fois l'accompagnement
  // paye (10 a 13 g de feculent et de legume), ne laissait plus que 2 a 5 g a la
  // source. D'ou le filet de dinde reduit a une tranche.
  var STRUCT_PROT_MIN = 20;

  // ET SURTOUT UN PLANCHER SUR LA SOURCE, QUI N'EST PAS LE MEME PLANCHER.
  //
  // Monter STRUCT_PROT_MIN ne suffit pas et ne pouvait pas suffire : il borne ce
  // que la PRISE ENTIERE a le droit d'apporter, et l'accompagnement se sert en
  // premier. A 20 g de plafond de prise et 13 g d'accompagnement, la source a
  // encore droit a 7 g — une tranche de dinde. Les deux bornes repondent a deux
  // questions differentes, et il fallait les deux.
  //
  // LE PLANCHER SE COMPTE EN PROTEINES, PAS EN PORTIONS. Premiere ecriture,
  // mesuree et jetee : elle posait le plancher a UNE PORTION COURANTE
  // (nPor x gPor). Juste pour les oeufs et le saumon fume — deux oeufs, deux
  // tranches —, ruineux pour les viandes, dont la portion courante est un FILET
  // ENTIER. Releve du 21 juillet chez Marie (52 kg, cible 95 g) : le dejeuner
  // passait de « 90 g de poulet » a « 1 filet de poulet (150 g) », le diner de
  // « 65 g de thon » a « 1 boite (110 g) », et la journee sortait a 152 g de
  // proteines pour 95 visees — 2,92 g/kg. On avait remplace une assiette maigre
  // par un chiffre que personne ne croit.
  //
  // Un tiers de filet en moins se coupe au couteau et ne choque personne ; une
  // tranche de dinde comme seule source d'un diner, si. Ce qui separe les deux
  // n'est pas un compte de portions, c'est la QUANTITE DE PROTEINES que la
  // source apporte. Le plancher vaut donc STRUCT_SRC_PROT_MIN grammes de
  // proteines, traduits en grammes de CET aliment-la...
  //
  // ... ET IL NE FORCE JAMAIS PLUS D'UNE PORTION COURANTE. Sans ce couvercle, un
  // aliment peu dense — 150 g de pois chiches pesent 11 g de proteines — se
  // verrait imposer deux portions par un plancher, alors qu'un plancher n'est
  // la que pour empecher de descendre. Le minimum ne doit pas se muer en
  // obligation.
  //
  // CE QUE CA COUTE, ET POURQUOI C'EST LE BON PRIX. Quand le plafond ne peut
  // plus etre tenu qu'en passant sous ce plancher, on ne le tient pas. Le
  // depassement se voit — nutriBilanPlan le dit en clair — et il est dit du bon
  // ton : « de l'argent perdu, pas un danger », jamais une alerte, ni sur cet
  // ecran ni dans nutriAvis. On echange donc un « A savoir » qui ne fait de mal
  // a personne contre une assiette qui se mange.
  //
  // Les aliments `libre` — les legumes — ne sont pas concernes : grBornerProt
  // les ecarte deja, ils se servent a volonte et n'ont pas de cible a tenir.
  //
  // LA VALEUR EST MESUREE, PAS CHOISIE. Balayage de 420 journees (6 profils x
  // 70 jours), a redistribution deja en place. A gauche le defaut qu'on corrige,
  // a droite ce qu'il coute — des journees au-dessus du plafond de 2,2 g/kg,
  // c'est-a-dire un « A savoir » de plus, jamais une alerte :
  //     valeur   dej+din sous 25 g      journees au-dessus du plafond
  //        0       183 / 840                  0 / 420
  //       15       133 / 840                 33 / 420
  //       18       113 / 840                 66 / 420
  //       20        99 / 840                 79 / 420
  //       22        95 / 840                 93 / 420
  //       25        95 / 840                121 / 420
  // La courbe casse a 20 : au-dela on paie des depassements sans plus rien
  // gagner sur l'assiette (95 contre 99, soit quatre repas). C'est donc la que
  // le plancher se pose. Reference d'avant la passe : 144 / 840 et 0 / 420.
  var STRUCT_SRC_PROT_MIN = 20;
  function grPlancherStruct(a) {
    if (!(a.prot100 > 0)) return 0;
    var parProt = alimentArrondiG(STRUCT_SRC_PROT_MIN * 100 / a.prot100);
    var courante = a.nPor * a.gPor;
    return parProt > courante ? courante : parProt;
  }
  // Ecrit comme le COMPLEMENT de SLOTS_ALLEGEABLES, jamais comme une seconde
  // liste : deux listes auraient diverge a la premiere retouche de l'une.
  function slotDeStructure(k) { return SLOTS_ALLEGEABLES.indexOf(k) < 0; }
  // Un creneau allegeable qui garde quand meme sa source : voir choisirPourSlot
  // et le creneau « Avant le coucher ». Lui aussi se deduit d'une declaration
  // deja faite — la FORME du creneau — plutot que d'une troisieme liste.
  //
  //
  // DEUX PRISES D'APPOINT QUI SE SUIVENT ET QUI SONT TOUTES DEUX SANS PROTEINES :
  // MESURE ET ASSUME, PAS CORRIGE. Une relecture demandait qu'au moins l'une des
  // deux garde sa source — « Collation 16h : 2 oranges » puis « Fin d'apres-midi
  // 17h30 : 2 pommes ». La regle a ete ECRITE ICI, mesuree, et retiree : elle
  // fait passer 45,4 % des journees au-dessus du plafond de 2,2 g/kg (286 sur
  // 630, pire cas 3,31 g/kg) et rend 59 repas de structure sous 15 g de
  // proteines. C'est le banc A4 qui le dit, et il garde ce plafond depuis trois
  // passes.
  //
  // LA RAISON EST STRUCTURELLE, pas contournable par un reglage. « col » est le
  // DERNIER de SLOTS_ALLEGEABLES : quand la boucle d'allegement va jusqu'a lui,
  // elle a deja vide « pre », « soir » et « mat ». Les deux creneaux ne sont donc
  // jamais vides ensemble par hasard — ils le sont uniquement dans les journees
  // ou la cible depasse deja largement le plafond, c'est-a-dire exactement celles
  // ou il n'y a plus rien a rendre. Reordonner la liste ne change rien : col y
  // est deja en dernier. Rendre sa source a l'un des deux, c'est rouvrir le
  // defaut que le plafond existe pour fermer — proposer un plan puis lui
  // reprocher son propre depassement, sur la meme carte.
  // Incidence reelle mesuree : voir le compte rendu de passe. La repetition, elle,
  // a bien ete corrigee — voir COL_TOURNE.
  function slotGardeSaSource(k) {
    return !!(SLOT_BY_K[k] && SLOT_BY_K[k].forme === "laitier");
  }

  // RENDRE AUX REPAS CE QU'UN CRENEAU ALLEGE NE SERT PLUS.
  //
  // C'EST LA CAUSE PRINCIPALE DES ASSIETTES MAIGRES, ET CE N'EST PAS LE PLAFOND.
  // Releve de la journee du 6 aout chez Marie (52 kg, prise de masse), AVANT
  // correction — journee a 109 g de proteines pour un plafond a 114, donc pas un
  // seul plafond de creneau pose :
  //     pdj  vise 15 g / 380 kcal
  //     dej  vise 17 g / 528 kcal   <- « 1 oeuf (55 g) + poelee + riz + avocat »
  //     col  vise 10 g / 180 kcal
  //     pre  vise  0 g / 150 kcal   <- allege : 10 g budgetes, 0 servi, 10 PERDUS
  //     din  vise 20 g / 500 kcal
  // 72 g a repartir, 10 attribues a un creneau qui n'en sert aucun, et le
  // dejeuner — 528 kcal, la plus grosse assiette de la journee — n'en vise que
  // 17. La densite proteique de l'assiette s'effondre pendant que sa quantite de
  // nourriture ne bouge pas : mot pour mot le defaut decrit, mais par ce
  // chemin-la. Le plafond de 2,2 g/kg produit le meme symptome plus rarement, et
  // il est traite plus bas (voir grPorCourante).
  //
  // LE BUDGET NE CHANGE PAS, IL CHANGE DE PLACE. Un creneau qu'on vide de sa
  // source rend sa part aux repas de structure, au prorata des poids `wp` deja
  // declares dans NUTRI_SLOTS. La journee ne vise donc pas un gramme de plus
  // qu'avant : elle sert enfin ce qu'elle avait budgete.
  //
  // ET LA BOUCLE D'ALLEGEMENT CONTINUE DE FAIRE BAISSER LE TOTAL. Un creneau
  // allege ne coutait pas sa cible, il coutait ce qu'il SERVAIT : « col vise
  // 10 g » servait 18 g, « pre vise 10 g » en servait 20 — une source ne se sert
  // pas en dessous d'une demi-portion courante. Le vider economise donc toujours
  // la difference, environ 8 a 10 g par creneau. L'allegement mord moins fort,
  // ce qui est exactement le but : il coupait dans le repas au lieu de couper
  // dans l'appoint.
  //
  // ON REPART TOUJOURS DE LA REPARTITION D'ORIGINE, jamais de la precedente —
  // meme precaution que nutriPlafonnerStructure, et pour la meme raison : deux
  // creneaux alleges l'un apres l'autre composeraient leurs redistributions.
  //
  // UN CRENEAU QUI GARDE SA SOURCE NE REND RIEN. « Avant le coucher » sert son
  // laitage meme allege : lui prendre sa part reviendrait a la donner deux fois.
  function nutriRendreAuxRepas(parts, sans) {
    var out = [], i, p, l, rendu = 0, cibles = [], somme = 0, reste, w, add;
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      l = { k: p.k, kcal: p.kcal, prot: p.prot };
      if (p.protMax > 0) l.protMax = p.protMax;
      if (sans && sans[p.k] && !slotGardeSaSource(p.k)) { rendu += l.prot; l.prot = 0; }
      else if (slotDeStructure(p.k) && SLOT_BY_K[p.k]) {
        cibles.push(l); somme += SLOT_BY_K[p.k].wp;
      }
      out.push(l);
    }
    if (!rendu || !cibles.length || !somme) return out;
    reste = rendu;
    for (i = 0; i < cibles.length; i++) {
      w = SLOT_BY_K[cibles[i].k].wp;
      // Le dernier ramasse le reliquat d'arrondi : la somme rendue est exactement
      // la somme reprise, au gramme pres, sinon la journee viserait autre chose
      // que sa cible sans que personne ne l'ait decide.
      add = (i === cibles.length - 1) ? reste : Math.round(rendu * w / somme);
      if (add > reste) add = reste;
      cibles[i].prot += add;
      if (cibles[i].prot > PROT_MAX_SLOT) cibles[i].prot = PROT_MAX_SLOT;
      reste -= add;
    }
    return out;
  }
  // Le plafond se calcule TOUJOURS sur la journee d'origine, jamais sur la
  // precedente : sinon les crans se composeraient (0,85 x 0,7 x 0,55) et le
  // troisieme tomberait a 33 % au lieu de 55 %.
  function nutriPlafonnerStructure(parts, base, f) {
    var parSlot = {}, out = [], i, p, v, l;
    for (i = 0; i < base.prises.length; i++) parSlot[base.prises[i].slot] = base.prises[i].prot;
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      l = { k: p.k, kcal: p.kcal, prot: p.prot };
      if (p.protMax > 0) l.protMax = p.protMax;
      if (slotDeStructure(p.k)) {
        v = Math.round((has(parSlot, p.k) ? parSlot[p.k] : p.prot) * f);
        if (v < STRUCT_PROT_MIN) v = STRUCT_PROT_MIN;
        l.protMax = v;
      }
      out.push(l);
    }
    return out;
  }

  // --- Tirage reproductible ---------------------------------------------------
  // Un plan doit etre STABLE : la meme journee rend la meme composition, sinon
  // les cases cochees du journal parleraient d'autre chose a chaque rendu. D'ou
  // un hachage de la date plutot qu'un Math.random().
  function nutriSeed(dateKey, sel) {
    var h = 2166136261, s = String(dateKey) + "|" + String(sel), i;
    for (i = 0; i < s.length; i++) {
      h = h ^ s.charCodeAt(i);
      h = (h + (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24)) >>> 0;
    }
    return h >>> 0;
  }

  // Numero de jour absolu, sans passer par Date — meme raison que veilleDe : la
  // composition doit etre calculable partout de la meme facon, y compris dans un
  // banc. C'est le compte de jours julien, dont la seule propriete qui nous
  // importe est d'augmenter d'EXACTEMENT UN par jour civil, y compris au passage
  // d'un mois, d'une annee et d'un 29 fevrier. Il sert la rotation d'alimPick.
  function jourNumero(dateKey) {
    var y = parseInt(String(dateKey).slice(0, 4), 10),
        m = parseInt(String(dateKey).slice(5, 7), 10),
        d = parseInt(String(dateKey).slice(8, 10), 10);
    if (!(y > 0) || !(m > 0) || !(d > 0)) return 0;
    var a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
    return d + Math.floor((153 * mm + 2) / 5) + 365 * yy +
           Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400);
  }

  // Veille d'une date, sans passer par Date : la composition doit etre calculable
  // partout de la meme facon, y compris dans un banc de test.
  function veilleDe(dateKey) {
    var y = parseInt(dateKey.slice(0, 4), 10), m = parseInt(dateKey.slice(5, 7), 10),
        d = parseInt(dateKey.slice(8, 10), 10);
    var dim = [31, ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 29 : 28,
               31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    d--;
    if (d < 1) { m--; if (m < 1) { m = 12; y--; } d = dim[m - 1]; }
    return y + "-" + (m < 10 ? "0" : "") + m + "-" + (d < 10 ? "0" : "") + d;
  }

  // --- Portions ---------------------------------------------------------------
  // `nPor` de la table dit la prise COURANTE (2 poignees de riz, 1 filet de
  // poulet, 2 oeufs). On sert entre la moitie et le double, arrondi a la portion
  // entiere : c'est ce qui permet d'ecrire « 2 poignees » et non « 183 g ».
  function alimMinPor(a) { var n = Math.round(a.nPor / 2); return n < 1 ? 1 : n; }
  function alimMaxPor(a) { var n = a.nPor * 2, m = alimMinPor(a); return n < m + 1 ? m + 1 : n; }

  // L'AMPLEUR d'une prise. Le plafond « jamais plus du double d'une prise
  // courante » est juste pour une journee a quatre ou cinq creneaux ; il est
  // FAUX quand toute la journee tient en deux assiettes. Mesure avant
  // correction : a deux creneaux, le plan plafonnait a 1 909 kcal / 95 g de
  // proteines quelle que soit la cible demandee — le mode d'echec de la v1.4.1,
  // intact sur ce chemin. Manger 3 000 kcal en deux repas, ce sont deux GROSSES
  // assiettes ; l'appli doit savoir l'ecrire au lieu de servir deux assiettes
  // normales et de se taire. `amp` est bornee a AMP_MAX : au-dela ce ne serait
  // plus une grosse assiette, ce serait un chiffre invraisemblable, et le
  // « resservir selon la faim » reste alors le seul aveu honnete.
  var AMP_MAX = 2.5;
  // Les crans d'ampleur, au niveau du module : la journee les monte un a un
  // (BOUCLE 2 de nutriJour) et les remplacants montent le meme escalier, pour
  // qu'une prise proposee a la place d'une autre soit servie de la meme facon.
  var AMP_CRANS = [1.5, 2, AMP_MAX];

  // ... ET UN PLAFOND EN UNITES SERVABLES, qui n'est pas le meme plafond.
  // `amp` borne un FACTEUR ; il ne dit rien de ce que le nombre obtenu donne a
  // lire. A 2,5, l'assiette annoncait « 10 pommes de terre (1 000 g) », « 7 pots
  // de yaourt nature (875 g) », « 3 boules de mozzarella (375 g) » — 900 kcal de
  // fromage dans un repas — et « 4 oranges (720 g) » en collation. Ce ne sont
  // pas de grosses portions, ce sont des chiffres que personne ne servira : une
  // appli qui les ecrit perd sa credibilite sur tout le reste de la carte.
  //
  // LA REGLE. Jamais plus de POR_MAX_DEF unites servables, SAUF si une portion
  // courante doublee en demande deja plus — le plafond ne descend donc JAMAIS
  // sous alimMaxPor(), et une journee ne peut pas servir moins qu'avant que
  // l'ampleur n'existe. Trois pommes de terre font une prise courante, six une
  // grosse assiette, quinze un chiffre invraisemblable.
  //
  // POR_MAX ne surcharge que les aliments ou trois unites sont ENCORE trop :
  // un fruit entier, une boule de mozzarella et une barre proteinee se comptent
  // par un ou deux, pas par trois. Cette table vit ici et non dans ALIMENTS :
  // elle ne decrit pas un aliment, elle decrit ce qu'on en sert — meme partage
  // que NUTRI_POOL, qui dit ou un aliment a sa place sans que la table le sache.
  //
  // Ce qui reste a manger apres le plafond n'est pas perdu : « resservir selon
  // la faim » le dit, et c'est le seul aveu honnete quand la table ne sait plus
  // servir la cible.
  var POR_MAX_DEF = 3;
  var POR_MAX = {
    banane: 2, pomme: 2, orange: 2,       // un fruit entier se compte par un ou deux
    mozza: 2, fromagedur: 2,              // 3 boules = 900 kcal de fromage dans un repas
    avocat: 2, barreprot: 2, poudreprot: 2
  };
  function alimPorMax(a) {
    var m = has(POR_MAX, a.id) ? POR_MAX[a.id] : POR_MAX_DEF;
    var hi = alimMaxPor(a);
    return m > hi ? m : hi;             // le plafond ne descend jamais sous la portion doublee
  }
  function alimBornePor(a, n, amp) {
    var lo = alimMinPor(a), hi = alimMaxPor(a), abs = alimPorMax(a);
    if (amp > 1) hi = Math.round(hi * (amp > AMP_MAX ? AMP_MAX : amp));
    if (hi > abs) hi = abs;
    if (!(n >= lo)) n = lo;
    if (n > hi) n = hi;
    return n;
  }
  // UNE PRISE D'APPOINT SERT DES PORTIONS, PAS UNE CIBLE CALORIQUE.
  //
  // LE DEFAUT, mot pour mot celui qui a ete releve : « 2 oranges (360 g), seul
  // aliment de la prise » a 16h, puis « 1 banane (120 g) » a 17h30. 480 g de
  // fruit nu en quatre-vingt-dix minutes, 5 g de proteines a elles deux, chez
  // quelqu'un en prise de masse. Le meme mecanisme produisait « 4 kiwis
  // (320 g) », « 3 gourdes de compote sans sucre (270 g) » et « 2 bols de
  // fruits rouges (300 g) ».
  //
  // LA CAUSE N'EST PAS LE PLAFOND, C'EST LE DIMENSIONNEMENT. Un accompagnement
  // est cale par grPourKcal sur TOUT ce qui reste de budget calorique, et rien
  // ne l'arretait avant alimPorMax — deux unites pour un fruit entier, trois
  // par defaut. Quand le creneau est allege, la source disparait et le fruit
  // herite du budget entier : il gonfle jusqu'a son plafond d'unites, et le
  // chiffre tombe juste pendant que la ligne devient immangeable. Personne ne
  // mange deux oranges d'affilee ; c'est une portion et demie de trop.
  //
  // LA REGLE : dans une prise d'APPOINT, un accompagnement ne depasse pas UNE
  // portion courante — `nPor * gPor`, exactement ce que la table declare comme
  // la quantite normale. Le libelle suit tout seul : « 1 orange (180 g) »,
  // « 2 kiwis (160 g) » (la portion courante du kiwi EST de deux), « 1 gourde
  // de compote (90 g) ». On ne choisit pas un chiffre, on relit celui que la
  // table porte deja.
  //
  // POURQUOI SEULEMENT L'APPOINT. Un repas de structure a le droit d'etre
  // copieux : c'est son role, et alimPorMax l'y borne deja. Une collation, non
  // — elle sert une ou deux pieces, et la piece EST la prise.
  //
  // POURQUOI PAS SUR LA SOURCE. La source proteinee d'une collation — un pot de
  // skyr, deux oeufs durs, une barre — est ce qu'on cherche a garder, pas ce
  // qu'on cherche a rogner. La regle ne porte que sur ce qui ACCOMPAGNE.
  //
  // CE QUE LES CALORIES DEVIENNENT. Elles ne sont pas perdues : le vivier
  // `encas` qu'on vient d'ouvrir sert le second aliment de la prise, et quand
  // il n'y a vraiment plus rien a poser, « a resservir selon la faim » le dit —
  // c'est l'aveu honnete qui existe deja, et il vaut mieux qu'un chiffre qui
  // tombe juste sur une ligne que personne ne servira.
  function grPorAppoint(a, g) {
    var un;
    if (a.libre) return g;              // un legume se sert a volonte
    un = a.nPor * a.gPor;
    return g > un ? un : g;
  }
  function alimParPorProt(a) { return a.prot100 * a.gPor / 100; }
  function alimParPorKcal(a) { return a.kcal100 * a.gPor / 100; }

  // Grammage a servir pour une cible de proteines, puis de calories. Les
  // aliments `libre` (les legumes) ne se dimensionnent pas : ils se servent a
  // volonte, et leur grammage n'est la que pour le calcul.
  function grPourProt(a, cible, amp) {
    if (a.libre) return a.nPor * a.gPor;
    var u = alimParPorProt(a);
    return alimBornePor(a, u > 0 ? Math.round(cible / u) : a.nPor, amp) * a.gPor;
  }
  function grPourKcal(a, cible, amp) {
    if (a.libre) return a.nPor * a.gPor;
    var u = alimParPorKcal(a);
    return alimBornePor(a, u > 0 ? Math.round(cible / u) : a.nPor, amp) * a.gPor;
  }
  function grMiniDe(a) { return a.libre ? a.nPor * a.gPor : alimMinPor(a) * a.gPor; }

  // PLAFONNER CE QU'UNE PIECE APPORTE EN PROTEINES. Le pendant de grPourProt :
  // celle-la dimensionne vers le haut par portions entieres, celle-ci coupe par
  // le bas quand un plafond de creneau est pose. Voir STRUCT_CRANS pour le
  // pourquoi — sans elle, un plafond a 22 g reste sans effet devant un filet de
  // poulet dont la plus petite portion servable en apporte 34.
  //
  // On rend un GRAMMAGE, pas un compte de portions : c'est exactement le cas ou
  // alimentTexte bascule d'elle-meme sur « 75 g de poulet », ce qu'elle fait
  // deja depuis toujours pour toute quantite qui ne tombe pas sur un compte
  // entier. Rien de nouveau ne s'affiche.
  //
  // GR_MIN_SERVI est le plancher absolu : en dessous ce n'est plus une portion,
  // c'est une garniture, et mieux vaut laisser le depassement se voir que
  // proposer 15 g de poulet. Les aliments `libre` — les legumes — ne sont pas
  // concernes : ils se servent a volonte et n'ont pas de cible a tenir.
  // `plancher` est le grammage sous lequel CET aliment-la ne se sert pas dans CE
  // creneau-la. Absent — les creneaux d'appoint —, on retombe sur GR_MIN_SERVI,
  // c'est-a-dire sur le comportement d'avant, au gramme pres. Voir grPorCourante
  // pour ce que les repas de structure y passent, et pourquoi.
  var GR_MIN_SERVI = 30;

  // ... ET UN PLAFOND SUR CE QUE L'ASSIETTE PESE EN TOUT, qui n'est encore un
  // autre plafond. alimPorMax borne CHAQUE piece a un nombre d'unites servable ;
  // il ne dit rien de ce que quatre pieces bornees font UNE FOIS ADDITIONNEES.
  // A deux repas par jour, toute la journee tient en deux assiettes et chaque
  // piece reste sagement sous son propre plafond pendant que le total derape :
  // « 3 portions de haricots blancs (450 g) + 4 oeufs durs (220 g) + 2 tomates
  // (240 g) + 5 pommes de terre (500 g) + 1 cuillere a soupe d'huile (10 g) »,
  // soit 1 420 g dans une assiette. Mesure avant correction, sur 96 profils x
  // 28 journees : a deux repas, 117 assiettes sur 2 016 pesaient un kilo ou plus
  // (5,8 %), contre 0,1 % a trois repas et 0 % a quatre et cinq. Le defaut est
  // bien celui du CUMUL, pas celui d'une piece.
  //
  // 950 g EST UNE ASSIETTE TRES COPIEUSE, pas une assiette normale : le plafond
  // ne parle que dans les cas extremes et laisse tout le reste intact — la
  // moyenne mesuree est de 475 a 677 g selon le nombre de repas.
  //
  // CE QUI RESTE A MANGER N'EST PAS PERDU : « resservir selon la faim » le dit
  // deja, et c'est le meme aveu honnete que pour POR_MAX. Mieux vaut une
  // assiette servable suivie d'un aveu qu'un chiffre que personne ne mettra dans
  // une assiette.
  var MASSE_MAX_PRISE = 950;
  // Ce que cette piece a le droit de peser, vu ce que la prise pese DEJA. On
  // coupe par PORTIONS ENTIERES — le vocabulaire du module — pour que l'assiette
  // continue de se lire « 3 pommes de terre » et non « 287 g de pommes de terre ».
  // Rendre 0 veut dire « pas cette piece » : sous la demi-portion courante, ce
  // n'est plus une portion, c'est une garniture.
  //
  // LES LEGUMES NE SONT PAS CONCERNES. Ils sont `libre` — a volonte —, leur
  // grammage n'est la que pour le calcul, et rogner une salade pour faire de la
  // place a du feculent serait exactement le contraire de ce qu'on veut.
  function grBornerMasse(a, g, masse) {
    var reste = MASSE_MAX_PRISE - masse, n;
    if (a.libre || g <= reste) return g;
    n = Math.floor(reste / a.gPor);
    return n >= alimMinPor(a) ? n * a.gPor : 0;
  }

  // LA MASSE DES SOURCES PROTEINEES D'UNE PRISE.
  //
  // Meme geste que grBornerMasse, sur un sous-total : ce que pesent les pieces
  // `cat:"prot"` d'une seule prise. Il vient AVEC l'ajout du soja a PROT_FAM,
  // pas a sa place — les deux ont ete mesures separement, et ils ne couvrent
  // pas le meme defaut. PROT_FAM raisonne par familles : il ne rapproche pas
  // « 3 bols de lentilles cuites (600 g) + 1 filet de poulet (150 g) », 750 g
  // de sources dans une assiette, que la balance additionne pourtant. C'est ce
  // que borne ce plafond-ci.
  //
  // 600 g EST LE GENOU DE LA COURBE, et le chiffre vient du balayage, pas d'une
  // intuition. Prix mesure en journees passant sous 90 % de leur cible
  // proteique, sur 17 920 journees (le soja etant deja dans PROT_FAM) :
  //   aucun plafond -> 821    650 g -> 825    550 g -> 911
  //          700 g  -> 823    600 g -> 831    500 g -> 977    400 g -> 1 333
  // Le cout est plat jusqu'a 600 puis grimpe d'un coup : sous ce seuil on paie
  // en journees maigres ce qu'on ne gagne plus en assiettes servables. A 600 g,
  // la masse maximale d'une prise revient sous MASSE_MAX_PRISE (950 g) et la
  // masse proteinee maximale passe de 750 a 600 g.
  //
  // 600 g de sources dans UNE prise reste tres copieux — c'est le meme parti
  // que MASSE_MAX_PRISE : le plafond ne parle que dans les cas extremes.
  var MASSE_MAX_PROT = 600;
  function grBornerMasseProt(a, g, masseProt) {
    var reste = MASSE_MAX_PROT - masseProt, n;
    if (a.libre || g <= reste) return g;
    n = Math.floor(reste / a.gPor);
    return n >= alimMinPor(a) ? n * a.gPor : 0;
  }
