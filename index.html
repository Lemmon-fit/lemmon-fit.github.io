<title>LEMMON FIT</title>
<style>
/* ===========================================================================
   LEMMON FIT v1.22.0 — TOKENS ET SOCLE VISUEL
   ---------------------------------------------------------------------------
   Les valeurs viennent de README.md section 4 du dossier de transfert design.
   Elles ne sont PAS approximees : chaque hexadecimal est recopie tel quel.

   RENVERSEMENT PAR RAPPORT A LA v1.21.0. La production etait sombre par
   defaut. La refonte est CLAIRE par defaut, avec des cartes sombres posees
   dessus. Le theme sombre reste disponible et reprend la palette de la
   v1.21.0, dont les contrastes ont ete mesures texte par texte.

   REGLE DE NOMMAGE, heritee de la v1.21.0 et non negociable : une couleur est
   nommee par son ROLE, jamais par sa valeur. Et une teinte posee en SURFACE
   n'est pas la meme variable que la meme teinte posee en TEXTE. Le citron
   reste citron en aplat ; en texte il doit foncer pour rester lisible.
   =========================================================================== */

:root, :root[data-theme="clair"] {
  /* Surfaces et encres, mode clair */
  --fond:          #f7f3ea;
  --fond-carte:    #fffdf7;
  --fond-encart:   #efe9dc;
  --sep:           #f4efe3;
  --bord:          #ded7c6;
  --bord-discret:  #e7e0cf;
  --bord-champ:    #cfc7b4;
  --bord-fort:     #c6bda8;
  --texte:         #1f1c17;
  --texte-1b:      #544d41;
  --texte-2:       #676052;

  /* AUCUNE DES TROIS ENCRES TERTIAIRES DU README N'ATTEINT 4,5:1, et c'est un
     trou du jeu de jetons, pas une erreur de code. Mesure sur les trois fonds
     clairs (page #f7f3ea, carte #fffdf7, encart #efe9dc) :

         #8a8272   3,44 / 3,74 / 3,15
         #978e7e   2,92 / 3,18 / 2,68
         #7d7566   4,11 / 4,48 / 3,77   ← la plus foncee, et elle echoue encore

     140 textes sur 1620 passaient sous le seuil, tous a cause de ce seul
     jeton : etiquettes de section, en-tetes de calendrier, libelles de la nav
     basse. On prend donc l'encre SECONDAIRE, seule a passer partout
     (5,62 / 6,12 / 5,15).

     CONSEQUENCE ASSUMEE : le palier tertiaire n'existe plus en petit texte.
     Il ne PEUT pas exister a 4,5:1 dans cette palette. Les trois valeurs
     d'origine restent declarees ci-dessous pour du GRAND texte, ou le seuil
     tombe a 3:1 et ou elles sont valables. */
  --texte-3:       #676052;
  --texte-3b:      #978e7e;
  --texte-3c:      #7d7566;

  /* Cartes sombres. Elles existent DANS le mode clair : ce sont des surfaces
     de premier plan, pas un theme. Leurs encres leur sont propres. */
  --sombre-carte:    #1f1c17;
  --sombre-fond:     #100f0d;
  --sombre-fond-2:   #141310;
  --sombre-piste:    #2c281f;
  --sombre-pastille: #3a352c;
  --sombre-barre:    #4a4436;
  --sombre-bord:     #6b6455;
  --sombre-texte:    #f7f3ea;
  --sombre-texte-b:  #ede6d3;
  --sombre-texte-2:  #cfc6b3;
  --sombre-texte-3:  #a89e8a;

  /* LES TROIS DISCIPLINES. Axe semantique central de la refonte : le
     remplissage dit qui mene la seance, le contour ne signale plus que le
     vide. Quatre roles par discipline, jamais melanges.
       -bg    : la surface pleine
       -fg    : l'encre POSEE SUR cette surface
       -pale  : la surface attenuee
       -encre : l'encre lisible sur la surface attenuee ET sur fond clair */
  --salle-bg:    #f4d912;
  --salle-fg:    #100f0d;
  --salle-pale:  #fdf4bd;
  --salle-encre: #4a4000;

  --cours-bg:    #d9741a;
  --cours-fg:    #100f0d;
  --cours-pale:  #f8ddc2;
  --cours-encre: #7d3d05;

  --run-bg:      #1f6dc0;
  --run-fg:      #fffdf7;
  --run-pale:    #d3e3f6;
  --run-encre:   #16497f;

  /* Variantes destinees au TEXTE pose sur une carte sombre. Les encres
     ci-dessus y seraient illisibles. */
  --cours-sur-sombre: #f5c493;
  --run-sur-sombre:   #bcdcff;
  --salle-sur-sombre: #f4d912;

  /* Citron, autres nuances */
  --citron-courbe: #c9ae00;
  --citron-encre:  #6b5b00;
  --citron-doux:   #e3cf5a;

  /* Vert : repos et validation */
  --vert-encre:    #3f6132;
  --vert-encre-b:  #2f5226;
  --vert-bg:       #668d55;
  --vert-bg-b:     #8caa7c;
  --vert-clair:    #a8c39a;
  --vert-pale:     #dfe9d8;
  --vert-pale-b:   #e7f0e2;
  --vert-pale-c:   #cfe3c6;
  --vert-sombre:   #1a2a16;
  --vert-bord:     #cfdcc7;

  /* Destructif. RESERVE a « Reinitialiser mes donnees ». Aucune autre action
     ne porte cette teinte : si tout est rouge, plus rien n'alerte. */
  --danger:        #8f3421;
  --danger-bord:   #d5a293;
  --danger-fg:     #fdf6f3;

  /* Liens. Sans cette declaration le navigateur sert son bleu par defaut,
     qui n'appartient a aucune palette. */
  --lien:       #1a5bab;
  --lien-hover: #16497f;
}

/* THEME SOMBRE. La spec de refonte ne fournit pas de palette de PAGE sombre,
   seulement les cartes sombres du mode clair. On reprend donc la palette de
   la v1.21.0, deja mesuree : 524 textes sur quatre combinaisons, zero sous le
   seuil. Les trois disciplines gardent leurs surfaces pleines et basculent
   sur leurs encres « sur sombre ». */
:root[data-theme="sombre"] {
  --fond:          #100f0d;
  --fond-carte:    #1e1a15;
  --fond-encart:   #1a1712;
  --sep:           #2c281f;
  --bord:          #3a352c;
  --bord-discret:  #4a4436;
  --bord-champ:    #3a3428;
  --bord-fort:     #8c8474;
  --texte:         #ede6d3;
  --texte-1b:      #cfc6b3;
  --texte-2:       #a89e8a;
  --texte-3:       #978e7e;
  --texte-3b:      #978e7e;
  --texte-3c:      #a89e8a;

  --sombre-carte:    #1e1a15;
  --sombre-fond:     #100f0d;
  --sombre-fond-2:   #141310;
  --sombre-piste:    #2c281f;
  --sombre-pastille: #3a352c;
  --sombre-barre:    #4a4436;
  --sombre-bord:     #6b6455;
  --sombre-texte:    #ede6d3;
  --sombre-texte-b:  #ede6d3;
  --sombre-texte-2:  #cfc6b3;
  --sombre-texte-3:  #a89e8a;

  --salle-pale:  #4a4000;
  --salle-encre: #f4d912;
  --cours-pale:  #4a2503;
  --cours-encre: #f5c493;
  --run-pale:    #10365e;
  --run-encre:   #bcdcff;

  --citron-encre: #f4d912;
  --vert-encre:   #8caa7c;
  --vert-encre-b: #cfe3c6;
  --vert-pale:    #1a2a16;
  --vert-pale-b:  #1a2a16;
  --vert-pale-c:  #223019;
  --vert-bord:    #3f5236;

  --danger:      #e08a80;
  --danger-bord: #7a3328;
  --danger-fg:   #100f0d;

  --lien:       #bcdcff;
  --lien-hover: #d3e3f6;
}

/* ===========================================================================
   BASE
   =========================================================================== */

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--fond);
  color: var(--texte);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  overscroll-behavior-y: contain;
  -webkit-text-size-adjust: 100%;
}

button, input, select, textarea {
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

a { color: var(--lien); text-decoration: none; }
a:hover { color: var(--lien-hover); }

p { text-wrap: pretty; }

/* TOUT nombre affiche passe en monospace : charges, kg, kcal, durees, dates
   courtes, tonnages. C'est ce qui aligne les colonnes et rend un tableau de
   charges lisible d'un coup d'oeil. */
.num { font-family: ui-monospace, "SF Mono", monospace; }

/* ===========================================================================
   CHASSIS — ecran, gouttiere, nav basse
   =========================================================================== */

/* pan-y laisse le defilement vertical au navigateur et nous reserve
   l'horizontale. Sans lui, le glissement lateral se bat avec le scroll. */
#ecran {
  touch-action: pan-y;
  min-height: 100vh;
  padding: calc(4px + env(safe-area-inset-top)) 20px 0;
}

/* La gouttiere du bas doit degager la nav, sinon le dernier element passe
   dessous et devient intouchable. */
body.a-nav #ecran {
  padding-bottom: calc(56px + 18px + env(safe-area-inset-bottom));
}

.ecran-titre {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.6px;
  margin: 14px 0 4px;
  color: var(--texte);
}

.ecran-titre-2 {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 14px 0 4px;
  color: var(--texte);
}

.nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: none;
  background: var(--fond-carte);
  border-top: 1px solid var(--bord);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 40;
}
body.a-nav .nav { display: flex; }

.nav-btn {
  flex: 1 1 0;
  min-height: 56px;
  border: 0;
  background: transparent;
  color: var(--texte-3);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 0 2px;
}
.nav-btn svg { display: block; }
.nav-btn-on { color: var(--citron-encre); }

/* ===========================================================================
   SPLASH
   =========================================================================== */

.splash {
  position: fixed;
  inset: 0;
  background: #100f0d;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  z-index: 100;
}
.splash-logo {
  width: 104px;
  height: 104px;
  border-radius: 26px;
  display: block;
}
.splash-mot {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #f7f3ea;
}
.splash-mot i { font-style: normal; color: #f4d912; }

/* ===========================================================================
   ECHAFAUDAGE — etape 1 uniquement
   ---------------------------------------------------------------------------
   Ce bloc n'existe que pour rendre le routage VERIFIABLE tant qu'aucun ecran
   n'a de contenu. Il disparait a l'etape 3, quand les vrais ecrans arrivent.
   Il porte volontairement une bordure en pointilles : on ne doit pas pouvoir
   le confondre avec du produit fini.
   =========================================================================== */

.echaf {
  border: 1.5px dashed var(--bord-fort);
  border-radius: 14px;
  padding: 14px;
  margin: 16px 0;
  background: var(--fond-encart);
}
.echaf-t {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--texte-3);
  margin-bottom: 10px;
}
.echaf-liste { display: flex; flex-wrap: wrap; gap: 8px; }
.echaf-btn {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 13px;
  border: 1.5px solid var(--bord-champ);
  background: var(--fond-carte);
  color: var(--texte-1b);
  font-size: 13.5px;
  font-weight: 600;
}
.echaf-note {
  font-size: 12.5px;
  color: var(--texte-2);
  margin-top: 10px;
}

/* ===========================================================================
   DIAGNOSTIC — 11 etapes
   ---------------------------------------------------------------------------
   Les valeurs viennent du gabarit du prototype, relevees une a une. La regle
   des 44 px prime sur le visuel : une pastille de progression peut etre fine a
   l'oeil, mais elle vit DANS un bouton de 44 px de haut, sinon elle n'est pas
   cliquable au pouce.
   =========================================================================== */

/* PAS DE PADDING HORIZONTAL ICI. `#ecran` porte deja les 20 px de gouttiere ;
   les remettre les DOUBLAIT, et tout le diagnostic se rendait sur 295 px au
   lieu de 335. Consequence mesurable : les sept boutons de jour tombaient a
   39,6 px, sous le seuil de 44, alors que la place existait. Une marge posee
   deux fois ne se voit pas a la lecture du CSS, seulement a la mesure. */
.ob { padding: 4px 0 0; max-width: 460px; margin: 0 auto; }

/* LES 44 px DE LARGE SONT GEOMETRIQUEMENT IMPOSSIBLES ICI, et il vaut mieux
   l'ecrire que le laisser croire : 11 pastilles a 44 px demandent 484 px de
   large, l'ecran de reference en fait 375, dont 335 utiles une fois la
   gouttiere retiree. Le maximum atteignable est donc ~30 px par pastille.
   On prend ce maximum : les boutons PAVENT toute la largeur sans ecart, et
   l'espace visuel entre les traits vient d'un padding INTERIEUR au bouton.
   Un `gap` aurait creuse des zones mortes entre les cibles.
   La hauteur, elle, respecte bien les 44 px. */
.ob-dots { display: flex; justify-content: center; margin-bottom: 2px; }
.ob-dot-btn {
  flex: 1 1 0; min-height: 44px; border: 0; background: transparent;
  display: flex; align-items: center; justify-content: center; padding: 0 2px;
}
.ob-dot { width: 100%; height: 4px; border-radius: 2px; background: var(--bord); display: block; }
.ob-dot-past { background: var(--bord-moyen); }
.ob-dot-on { background: var(--salle-bg); height: 6px; }

.ob-step-label {
  text-align: center; font-size: 11px; color: var(--texte-3); margin-bottom: 14px;
  text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700;
}
/* 26 px et 14,5 px sont MESURES DANS LA MAQUETTE, pas choisis. J'avais pris
   27 et 15, deux valeurs qui existent bien dans l'echelle du README mais que la
   maquette n'utilise pas ici. Quand l'echelle propose plusieurs voisins, c'est
   la maquette qui tranche. */
.ob-titre { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin: 0 0 6px; }
.ob-lead { font-size: 14.5px; line-height: 1.5; color: var(--texte-1b); margin: 0 0 16px; }

.ob-champ { margin-bottom: 12px; }
.ob-champ-l { font-size: 14px; color: var(--texte-2); margin-bottom: 6px; display: block; }
.ob-input {
  width: 100%; min-height: 56px; background: var(--fond-carte);
  border: 1.5px solid var(--bord-champ); border-radius: 13px; color: var(--texte);
  font-size: 17px; padding: 0 14px; font-family: ui-monospace, "SF Mono", monospace;
}
.ob-input-txt { font-family: inherit; font-size: 16px; }

.ob-chips { display: flex; flex-direction: column; gap: 8px; }
.ob-chip {
  width: 100%; text-align: left; min-height: 58px; padding: 10px 14px; border-radius: 13px;
  border: 1.5px solid var(--bord); background: var(--fond-carte); color: var(--texte);
  font-size: 15px; font-weight: 700; display: flex; flex-direction: column; gap: 2px;
}
.ob-chip-s { font-size: 12.5px; font-weight: 400; color: var(--texte-2); }
.ob-chip-on { border-color: var(--salle-bg); background: rgba(244,217,18,.14); }

/* GAP RESSERRE A 3 px POUR ATTEINDRE LES 44 px. A 375 px de large, la
   gouttiere laisse 335 px : sept boutons et six ecarts de 5 px ne donnaient
   que 43,6 px par bouton, juste sous le seuil. A 3 px d'ecart ils font
   45,3 px. L'ecart visuel se voit moins, la cible passe. */
.ob-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 18px; }
.ob-day {
  min-height: 52px; border-radius: 11px; border: 1.5px solid var(--bord);
  background: var(--fond-carte); color: var(--texte-1b); font-size: 12.5px; font-weight: 700;
}
.ob-day-on { background: var(--salle-bg); border-color: var(--salle-bg); color: var(--salle-fg); }

.ob-jour { margin-bottom: 14px; }
.ob-jour-t { font-size: 13px; font-weight: 800; margin-bottom: 6px; color: var(--texte); }
.ob-rang { font-size: 11px; color: var(--texte-3); margin: 8px 0 4px; font-weight: 700; }
/* La fleche est dessinee en fond parce que appearance:none retire celle du
   systeme. Sans elle, le select ne se lit plus comme un select. */
.ob-select {
  width: 100%; min-height: 56px; padding: 0 36px 0 14px; border-radius: 13px;
  border: 2px solid var(--bord); background: var(--fond-carte); color: var(--texte);
  font-family: inherit; font-size: 15.5px; font-weight: 800;
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 20px) calc(50% + 2px), calc(100% - 14px) calc(50% + 2px);
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
}
.ob-select-libre { border-style: dashed; }

.ob-cours {
  border: 1.5px solid var(--cours-pale); background: var(--fond-carte);
  border-left: 4px solid var(--cours-bg);
  border-radius: 13px; padding: 12px 13px; margin-bottom: 10px;
}
.ob-cours-t { font-size: 12.5px; font-weight: 800; color: var(--cours-encre); margin-bottom: 8px; }
.ob-step { display: flex; align-items: center; gap: 8px; }
.ob-step-btn {
  min-width: 48px; min-height: 48px; border-radius: 11px;
  border: 1.5px solid var(--bord-champ); background: var(--fond-carte);
  color: var(--texte); font-size: 20px; font-weight: 700;
}
.ob-step-v {
  flex: 1; text-align: center; font-family: ui-monospace, "SF Mono", monospace;
  font-size: 17px; font-weight: 700;
}
.ob-natures { display: flex; gap: 6px; margin-top: 8px; }
.ob-nature {
  flex: 1; min-height: 46px; border-radius: 11px; border: 1.5px solid var(--bord-moyen);
  background: var(--fond-carte); color: var(--texte-1b); font-size: 13px; font-weight: 700;
}
.ob-nature-on { background: var(--cours-bg); border-color: var(--cours-bg); color: var(--cours-fg); }

.ob-liste { display: flex; flex-direction: column; gap: 8px; }
.ob-case {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  min-height: 58px; padding: 10px 12px; border-radius: 13px;
  border: 1.5px solid var(--bord); background: var(--fond-carte); color: var(--texte);
}
.ob-case-on { border-color: var(--salle-bg); background: rgba(244,217,18,.14); }
.ob-case-box {
  width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--texte-3c);
  flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: transparent;
}
.ob-case-on .ob-case-box { background: var(--sombre-carte); border-color: var(--sombre-carte); color: var(--salle-bg); }
.ob-case-txt { display: flex; flex-direction: column; gap: 2px; }
.ob-case-t { font-size: 14.5px; font-weight: 700; }
.ob-case-s { font-size: 12px; color: var(--texte-2); }

.ob-sess { border: 1px solid var(--bord); border-radius: 13px; padding: 12px 13px; margin-bottom: 10px; }
.ob-sess-t { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
.ob-sess-s { font-size: 12px; color: var(--texte-2); margin-bottom: 8px; }
.ob-sess-pill { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 20px; }
.ob-exos { list-style: none; margin: 0; padding: 0; }
.ob-exo {
  display: flex; align-items: center; gap: 8px; min-height: 44px;
  border-bottom: 1px solid var(--sep); font-size: 13.5px;
}
.ob-exo:last-child { border-bottom: 0; }
.ob-exo-n { flex: 1; }
.ob-exo-d { font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; color: var(--texte-2); }

.ob-recap { background: var(--fond-carte); border: 1px solid var(--bord); border-radius: 18px; padding: 6px 16px; margin-bottom: 12px; }
.ob-recap-l {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  min-height: 48px; padding: 8px 0; border-bottom: 1px solid var(--fond-encart);
}
.ob-recap-l:last-child { border-bottom: 0; }
.ob-recap-t { font-size: 14px; color: var(--texte-1b); }
.ob-recap-v {
  font-family: ui-monospace, "SF Mono", monospace; font-size: 14px; font-weight: 700;
  color: var(--texte); text-align: right;
}
.ob-note { background: var(--fond-encart); border-radius: 14px; padding: 13px 14px; font-size: 13px; line-height: 1.6; color: var(--texte-1b); margin-bottom: 18px; }

.ob-nav { display: flex; gap: 10px; margin: 14px 0 24px; }
.ob-prev {
  min-height: 56px; padding: 0 20px; border-radius: 14px;

/* --- LA COURBE ------------------------------------------------------------
   Les etiquettes portent toutes white-space: nowrap. Sans lui, « 12 km » se
   coupe en deux au milieu d'une valeur, et une etiquette d'axe sur deux
   lignes decale le repere qu'elle est censee nommer.
   ------------------------------------------------------------------------- */
.cb { position: relative; margin: 10px 0 4px; padding-left: 46px; }
.cb-ecart {
  position: absolute; top: -2px; right: 0; font-size: 12px; font-weight: 700;
  color: var(--texte-2); white-space: nowrap;
  font-family: ui-monospace, "SF Mono", monospace;
}
.cb-axe {
  position: absolute; left: 0; top: 18px; bottom: 22px; width: 44px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.cb-a-h, .cb-a-b {
  font-size: 11px; color: var(--texte-3); white-space: nowrap;
  font-family: ui-monospace, "SF Mono", monospace;
}
.cb-zone { position: relative; height: 132px; margin-top: 18px; }
.cb-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cb-aire { fill: var(--salle-pale); stroke: none; }
.cb-ligne { fill: none; stroke: var(--citron-courbe); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
/* Les deux pointilles tombent a 10 % et 90 %, exactement ou la formule place
   cy(max) et cy(min). Voir le commentaire de courbePoints. */
.cb-guide { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--bord-fort); }
.cb-guide-h { top: 10%; }
.cb-guide-b { top: 90%; }
.cb-point {
  position: absolute; width: 10px; height: 10px; border-radius: 50%;
  background: var(--citron-courbe); border: 2px solid var(--fond);
  transform: translate(-50%, -50%);
}
.cb-pieds { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; }
.cb-p { font-size: 11.5px; color: var(--texte-2); white-space: nowrap; }
.cb-vide { font-size: 13px; color: var(--texte-3); font-style: italic; margin: 8px 0 14px; }

/* --- MOI ----------------------------------------------------------------- */
.moi-tete { display: flex; align-items: center; gap: 14px; margin: 8px 0 6px; }
/* Le label est le conteneur, l'input file est pose TRANSPARENT par-dessus en
   absolute inset 0. C'est ce montage qui ouvre la photothèque au premier
   toucher : appeler .click() sur un input cache est bloque hors geste direct. */
.moi-photo {
  position: relative; width: 76px; height: 76px; border-radius: 50%; flex: 0 0 auto;
  background: var(--fond-encart) center/cover no-repeat;
  border: 1.5px solid var(--bord); display: flex; align-items: center; justify-content: center;
  overflow: hidden;

/* ---------------------------------------------------------------------------
   GLISSEMENT — l'ecran qui arrive se voit arriver
   ---------------------------------------------------------------------------
   160 ms : assez pour lire le sens du geste, trop court pour se sentir attendre.
   Seul l'ecran ENTRANT est anime ; animer aussi le sortant demanderait de garder
   deux arbres DOM montes en meme temps, avec leurs ecouteurs et leurs chronos.
   --------------------------------------------------------------------------- */
@keyframes ec-droite { from { transform: translateX(26px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ec-gauche { from { transform: translateX(-26px); opacity: 0; } to { transform: none; opacity: 1; } }
.ec-de-droite { animation: ec-droite .16s cubic-bezier(.22,.61,.36,1); }
.ec-de-gauche { animation: ec-gauche .16s cubic-bezier(.22,.61,.36,1); }

/* Qui demande moins d'animation retrouve le comportement instantane du README. */
@media (prefers-reduced-motion: reduce) {
  .ec-de-droite, .ec-de-gauche { animation: none; }
}

    // travaille plus la meme chose, et le catalogue a deja place ces exercices la
    // ou il faut.
    //
    // `reps: 0` VEUT DIRE « ON N'Y TOUCHE PAS », et pas « on reecrit a
    // l'identique ». La nuance est reelle : la reecriture normalise le separateur,
    // donc « 8 - 10 » ressortirait « 8-10 » et le detail affiche changerait sans
    // qu'aucune regle ne l'ait demande. La perte ne touche qu'au repos.
    var OBJ_SCHEMA = {
      prise:    { reps: -2, repsMin: 5,  repsMax: 15, repos: 1.25 },
      tonifier: { reps: +3, repsMin: 10, repsMax: 20, repos: 0.8 },
      perte:    { reps: 0,  repsMin: 1,  repsMax: 99, repos: 0.85 }
    };


    var OBJ_REPOS_MIN = 30, OBJ_REPOS_MAX = 210;



    // Deplace une fourchette de repetitions en gardant ce qui l'accompagne.
    // « 8-10 » -> « 6-8 », « 12 par jambe » -> « 10 par jambe ». Une chaine dont
    // la tete n'est pas un nombre ressort INTACTE : le catalogue en porte, et les
    // reecrire au chausse-pied produirait la ligne absurde qu'on passe son temps
    // a corriger ailleurs.
    function objDecalerReps(reps, sch) {
      var s = String(reps == null ? "" : reps);
      var m = s.match(/^(\d+)(\s*[-–]\s*(\d+))?/);
      if (!m) return reps;
      var lo = parseInt(m[1], 10) + sch.reps;
      var hi = m[3] ? parseInt(m[3], 10) + sch.reps : lo;
      if (lo < sch.repsMin) lo = sch.repsMin;
      if (hi < lo) hi = lo;
      if (hi > sch.repsMax) hi = sch.repsMax;
      if (lo > hi) lo = hi;
      return (lo === hi ? String(lo) : (lo + "-" + hi)) + s.slice(m[0].length);
    }



    function objDecalerRepos(rest, sch) {
      var r = Math.round((rest || 60) * sch.repos / 15) * 15;
      if (r < OBJ_REPOS_MIN) r = OBJ_REPOS_MIN;
      if (r > OBJ_REPOS_MAX) r = OBJ_REPOS_MAX;
      return r;
    }



    // Copie d'une entree de catalogue. Voir l'entete : `chosen[i].ex` pointe sur
    // l'objet PARTAGE du catalogue, et le muter reecrirait le programme de tous
    // les profils construits ensuite dans le meme onglet.
    function objCopieEx(ex) {
      var o = {}, k;
      for (k in ex) { if (has(ex, k)) o[k] = ex[k]; }
      return o;
    }



    // --- L'application des leviers 2, 3 et 4 sur une seance en construction ------
    // Appelee par buildSession JUSTE APRES le remplissage des creneaux et AVANT la
    // taille : c'est la seule position ou le changement se voit vraiment. Posee
    // apres la taille, une serie de plus aurait fait deborder la seance sans que
    // le budget de temps ait son mot a dire ; un repos allonge n'aurait compte
    // dans aucun cout, et l'appli aurait annonce une duree fausse.
    //
    // ELLE NE REND RIEN : elle modifie `chosen` sur place, comme les trois boucles
    // de taille qui la suivent.
    var OBJ_SETS_MAX = 5;


    function objRenforcer(chosen, profile) {
      var obj = objectifDe(profile);
      if (!obj) return;                       // profil non confirme : v1.9.3 intacte
      var vises = objPatsVises(profile), sch = has(OBJ_SCHEMA, obj) ? OBJ_SCHEMA[obj] : null;
      var i, c;
      for (i = 0; i < chosen.length; i++) {
        c = chosen[i];
        if (!c || !c.ex) continue;

        // LEVIER 3 — le schema. Il ne touche que les exercices qui se comptent en
        // REPETITIONS : un gainage tenu « 30-45 sec » n'a pas de fourchette a
        // decaler, et lui allonger le repos ne repond a aucun objectif.
        if (sch && c.ex.reps) {
          c.ex = objCopieEx(c.ex);
          if (sch.reps) c.ex.reps = objDecalerReps(c.ex.reps, sch);
          c.ex.rest = objDecalerRepos(c.ex.rest, sch);
        }

        // LEVIER 4 — en perte, le gainage et le cardio ne sont plus les premiers
        // sacrifies. C'est le seul effet de la branche « perte », et il est reel :
        // a 30 minutes, une seance perdait son gainage AVANT toute autre chose,
        // c'est-a-dire exactement le creneau qu'on vient chercher.
        if (obj === "perte" && c.prio === 3 &&
            (c.ex.pat === "core" || c.ex.pat === "hiit" || c.ex.pat === "cardio")) {
          c.prio = 2;
        }

        // LEVIER 2 — les zones visees, en prise de masse uniquement (zonesDe le
        // garantit). Le creneau passe de « confort » a « utile », donc il survit a
        // la taille, et il gagne une serie s'il se compte en repetitions.
        if (vises[c.ex.pat]) {
          if (c.prio === 3) c.prio = 2;
          if (c.ex.reps && c.sets < OBJ_SETS_MAX) c.sets++;
        }
      }
    }



    function splitFor(n) {
      if (n <= 1) return [TPL.fullA];
      if (n === 2) return [TPL.fullA, TPL.fullB];
      if (n === 3) return [TPL.fullA, TPL.fullB, TPL.fullC];
      if (n === 4) return [TPL.haut, TPL.bas, TPL.hautB, TPL.basB];
      if (n === 5) return [TPL.push, TPL.pull, TPL.legs, TPL.hiit, TPL.full];
      if (n === 6) return [TPL.push, TPL.pull, TPL.legs, TPL.haut, TPL.bas, TPL.hiit];
      return [TPL.push, TPL.pull, TPL.legs, TPL.haut, TPL.bas, TPL.hiit, TPL.cardio];
    }



    // --- Remplissage d'un créneau ------------------------------------------------
    function candidatesFor(pat, avail, excluded, used) {
      var out = [], i, ex, j, ok;
      for (i = 0; i < CATALOG.length; i++) {
        ex = CATALOG[i];
        if (ex.pat !== pat) continue;
        if (excluded[ex.id]) continue;
        if (used[ex.id]) continue;
        ok = true;
        for (j = 0; j < ex.equip.length; j++) {
          if (!avail[ex.equip[j]]) { ok = false; break; }
        }
        if (ok) out.push(ex);
      }
      out.sort(function (a, b) { return a.rank - b.rank; });
      return out;
    }



    function pickForSlot(slot, avail, excluded, used) {
      var c = candidatesFor(slot.pat, avail, excluded, used);
      if (!c.length && slot.fb) c = candidatesFor(slot.fb, avail, excluded, used);
      if (!c.length) return null;
      return c[Math.min(slot.alt, c.length - 1)];
    }



    // --- Construction d'une séance ----------------------------------------------
    // On remplit tous les créneaux possibles, puis on TAILLE pour tenir dans le
    // temps annoncé : d'abord en retirant une série aux exercices de confort,
    // ensuite en supprimant les créneaux, du moins important au plus important.
    // Les créneaux de priorité 1 ne sont jamais touchés : une séance sans sa
    // poussée principale n'est plus la séance.
    function buildSession(tpl, profile) {
      var avail = { bw: true }, excluded = {}, used = {}, i, chosen = [], ex;
      for (i = 0; i < profile.equipment.length; i++) avail[profile.equipment[i]] = true;
      if (avail.mach) { for (i = 0; i < GYM_IMPLIES.length; i++) avail[GYM_IMPLIES[i]] = true; }
      for (i = 0; i < profile.excluded.length; i++) excluded[profile.excluded[i]] = true;

      // Machines déclarées absentes : on les verse dans les exclusions plutôt que
      // d'ajouter un filtre au sélecteur. Même effet, un seul chemin à tester.
      var noGear = {}, ng = profile.noGear || [];
      for (i = 0; i < ng.length; i++) noGear[ng[i]] = true;
      for (i = 0; i < CATALOG.length; i++) {
        if (CATALOG[i].gear && noGear[CATALOG[i].gear]) excluded[CATALOG[i].id] = true;
      }

      for (i = 0; i < tpl.slots.length; i++) {
        ex = pickForSlot(tpl.slots[i], avail, excluded, used);
        if (!ex) continue;                       // aucun candidat : créneau sauté
        used[ex.id] = true;
        // idx retient la place du créneau dans la séance : après une coupe puis un
        // repêchage, il permet de remettre l'exercice à sa position d'origine, et
        // non à la fin. L'ordre compte : les polyarticulaires passent avant les
        // isolations, on ne finit pas une séance par un soulevé de terre.
        chosen.push({ ex: ex, prio: tpl.slots[i].prio, sets: ex.sets || 1, idx: i });
      }

      // L'OBJECTIF CONFIRME AGIT ICI, ET AVANT LA TAILLE. Voir objRenforcer :
      // zones visees, schema de repetitions et de repos, survie du gainage en
      // perte. Sans objectif confirme, elle ne fait rien du tout.
      objRenforcer(chosen, profile);

      var budget = profile.minutes * 60;
      function currentList() {
        return chosen.map(function (c) {
          var o = {}, k;
          for (k in c.ex) { if (has(c.ex, k)) o[k] = c.ex[k]; }
          o.sets = c.sets;
          return o;
        });
      }
      function cost() { return totalCost(currentList()); }

      var guard = 0;
      // 1. Alléger les exercices de confort avant d'en supprimer.
      while (cost() > budget && guard++ < 60) {
        var trimmed = false, j;
        for (j = chosen.length - 1; j >= 0; j--) {
          if (chosen[j].prio === 3 && chosen[j].sets > 2 && !chosen[j].ex.mins && !chosen[j].ex.blockMins) {
            chosen[j].sets--; trimmed = true; break;
          }
        }
        if (!trimmed) break;
      }
      // 2. Puis supprimer, du confort vers l'utile, en partant de la fin.
      var dropped = [];
      guard = 0;
      while (cost() > budget && guard++ < 60) {
        var cut = -1, p, j2;
        for (p = 3; p >= 2 && cut < 0; p--) {
          for (j2 = chosen.length - 1; j2 >= 0; j2--) {
            if (chosen[j2].prio === p) { cut = j2; break; }
          }
        }
        if (cut < 0) break;                      // il ne reste que l'essentiel
        dropped.push(chosen.splice(cut, 1)[0]);
      }

      // 3. Repêchage. Sans cette passe, une seule coupe trop chère laissait le
      //    temps restant inutilisé : mesuré sur un full body de 50 minutes, la
      //    séance tombait à 4 exercices pour 40 minutes, alors que le gainage
      //    retiré tenait largement dans les 10 minutes qui restaient. On remet
      //    donc les créneaux écartés, du plus important au moins important, tant
      //    qu'ils rentrent.
      dropped.sort(function (a, b) { return a.prio - b.prio; });
      var byIdx = function (a, b) { return a.idx - b.idx; };
      for (var r = 0; r < dropped.length; r++) {
        var backup = chosen.slice();
        chosen.push(dropped[r]);
        chosen.sort(byIdx);
        if (cost() > budget) chosen = backup;
      }

      // 4. Extension. Un créneau sans candidat est simplement sauté : personne
      //    n'a de machine à mollets dans son salon. Une séance pouvait donc finir
      //    très en dessous du temps annoncé — mesuré sans aucun matériel, un PULL
      //    tombait à trois exercices et vingt minutes pour soixante-quinze
      //    demandées. On rallonge alors ce qui reste, un tour de série à la fois,
      //    plafonné à deux séries de plus que la prescription et à six au total :
      //    remplir le temps ne doit pas transformer la séance en marathon.
      guard = 0;
      var etendu = true;
      while (etendu && guard++ < 40) {
        etendu = false;
        for (var xi = 0; xi < chosen.length; xi++) {
          var cx = chosen[xi];
          if (cx.ex.mins || cx.ex.blockMins) continue;      // bloc chronométré
          var plafond = Math.min((cx.ex.sets || 1) + 2, 6);
          if (cx.sets >= plafond) continue;
          cx.sets++;
          if (cost() > budget) cx.sets--; else etendu = true;
        }
      }

      var list = currentList();
      var mins = Math.round(totalCost(list) / 60 / 5) * 5;
      return {
        code: tpl.code,
        label: tpl.label,
        sub: tpl.sub,
        duration: "~" + mins + " min",
        // La taille s'arrête aux créneaux structurants : en dessous d'une
        // trentaine de minutes, une séance complète ne rentre tout simplement pas.
        // On l'annonce plutôt que de laisser croire qu'elle tient dans le temps
        // demandé, et plutôt que de livrer une séance amputée de sa poussée.
        over: mins > profile.minutes,
        exercises: list.map(function (o) {
          var b = repsBounds(o.reps);
          return { id: o.id, name: o.name, detail: detailOf(o), sets: o.sets,
                   load: isLoadableEx(o), track: isLoadableEx(o) ? "load" : "none",
                   rest: o.rest || 60, repsLo: b.lo, repsHi: b.hi };
                   // kgCible reste absent tant que l'utilisateur n'a pas trouve sa
                   // charge : on ne devine pas a sa place au premier jour.
        })
      };
    }



    // L'allure de base sert à convertir le temps annoncé en distance. Le plafond
    // évite de prescrire une sortie longue de dix kilomètres à quelqu'un qui n'a
    // jamais couru : c'est la blessure la plus banale du débutant.
    var RUN_LEVELS = [
      { v: "debut",    label: "Je débute",        hint: "jamais couru, ou très peu", pace: 8.0, maxKm: 6 },
      { v: "regulier", label: "Je cours déjà",    hint: "une à deux fois par semaine", pace: 6.5, maxKm: 13 },
      { v: "entraine", label: "Je suis entraîné", hint: "trois fois par semaine ou plus", pace: 5.5, maxKm: 22 }
    ];



    function runLevel(v) {
      var i;
      for (i = 0; i < RUN_LEVELS.length; i++) { if (RUN_LEVELS[i].v === v) return RUN_LEVELS[i]; }
      return RUN_LEVELS[0];
    }



    var RUN_TPL = {
      easy: { code: "run-easy", label: "ENDURANCE", sub: "Footing facile", pat: "run-easy", alt: 0 },
      recup: { code: "run-recup", label: "RÉCUPÉRATION", sub: "Footing très lent", pat: "run-easy", alt: 1 },
      long: { code: "run-long", label: "SORTIE LONGUE", sub: "La durée avant l'allure", pat: "run-long", alt: 0 },
      interv: { code: "run-int", label: "FRACTIONNÉ", sub: "Intervalles courts", pat: "run-int", alt: 0 },
      cotes: { code: "run-hill", label: "CÔTES", sub: "Puissance en montée", pat: "run-hill", alt: 0 },
      seuil: { code: "run-tempo", label: "SEUIL", sub: "Allure soutenue et régulière", pat: "run-tempo", alt: 0 }
    };



    // Répartition de la semaine. Règle tenue partout : une seule séance dure par
    // semaine en dessous de quatre sorties, deux au maximum au-delà, et le reste
    // en facile. C'est la distribution qui fait progresser sans casser.
    // Un débutant ne reçoit AUCUNE séance de qualité : il lui faut d'abord des
    // semaines d'endurance. Les créneaux durs retombent alors sur du facile.
    function runWeek(n, niveau) {
      var lvl = niveau === "entraine" ? 3 : (niveau === "regulier" ? 2 : 1);
      var dur = lvl >= 3 ? RUN_TPL.seuil : (lvl >= 2 ? RUN_TPL.interv : RUN_TPL.easy);
      var dur2 = lvl >= 2 ? RUN_TPL.cotes : RUN_TPL.easy;
      if (n <= 1) return [RUN_TPL.easy];
      if (n === 2) return [RUN_TPL.easy, RUN_TPL.long];
      if (n === 3) return [RUN_TPL.easy, dur, RUN_TPL.long];
      if (n === 4) return [RUN_TPL.easy, dur, RUN_TPL.recup, RUN_TPL.long];
      if (n === 5) return [RUN_TPL.easy, dur, RUN_TPL.recup, dur2, RUN_TPL.long];
      if (n === 6) return [RUN_TPL.easy, dur, RUN_TPL.recup, dur2, RUN_TPL.easy, RUN_TPL.long];
      return [RUN_TPL.easy, dur, RUN_TPL.recup, dur2, RUN_TPL.easy, RUN_TPL.recup, RUN_TPL.long];
    }



    function pickRun(pat, alt, avail) {
      var c = [], i, ex, j, ok;
      for (i = 0; i < CATALOG.length; i++) {
        ex = CATALOG[i];
        if (ex.pat !== pat) continue;
        ok = true;
        for (j = 0; j < ex.equip.length; j++) { if (!avail[ex.equip[j]]) ok = false; }
        if (ok) c.push(ex);
      }
      c.sort(function (a, b) { return a.rank - b.rank; });
      if (!c.length) return null;
      return c[Math.min(alt, c.length - 1)];
    }



    function frKm(km) {
      return frDec(String(Math.round(km * 10) / 10));
    }



    // Une séance de course : échauffement, le bloc principal, retour au calme,
    // et de la mobilité s'il reste du temps. La DISTANCE du bloc principal se
    // déduit du temps restant et de l'allure, jamais l'inverse : c'est le temps
    // que l'utilisateur a annoncé, pas le kilométrage.
    function buildRunSession(tpl, profile) {
      var niv = runLevel(profile.runLevel);
      var avail = { bw: true }, i;
      for (i = 0; i < profile.equipment.length; i++) avail[profile.equipment[i]] = true;
      if (avail.mach) { for (i = 0; i < GYM_IMPLIES.length; i++) avail[GYM_IMPLIES[i]] = true; }

      var chauffe = pickRun("run-warm", 0, avail);
      var calme = pickRun("run-cool", 0, avail);
      var mob = pickRun("run-mob", 0, avail);
      var bloc = pickRun(tpl.pat, tpl.alt, avail);
      if (!bloc) bloc = pickRun("run-easy", 0, avail);

      // L'echauffement depend du type de seance, pas d'un forfait. Un footing
      // facile commence lentement : les premieres minutes SONT l'echauffement, et
      // lui imposer huit minutes de plus revenait a passer dix-neuf minutes a ne
      // pas courir sur une seance de quarante. Un fractionne, lui, se prepare
      // vraiment, sinon c'est le claquage.
      var dur = (tpl.pat === "run-int" || tpl.pat === "run-tempo" || tpl.pat === "run-hill");
      var minChauffe = dur ? 8 : 4;
      var minCalme = dur ? 6 : 4;
      if (chauffe) {
        chauffe = { id: chauffe.id, name: chauffe.name, mins: minChauffe,
                    note: dur ? "marche puis trot" : "marche rapide" };
      }
      if (calme) calme = { id: calme.id, name: calme.name, mins: minCalme, note: "trot puis marche" };

      var minutes = profile.minutes;
      var fixe = (chauffe ? chauffe.mins : 0) + (calme ? calme.mins : 0);
      var dispo = minutes - fixe;
      // La mobilite n'est ajoutee que s'il reste franchement de quoi courir
      // apres : sur une seance courte, elle mangeait un kilometre pour rien.
      var avecMob = false;
      if (mob && dispo - mob.mins >= 22) { dispo -= mob.mins; avecMob = true; }
      if (dispo < 8) dispo = 8;                       // il faut bien courir un peu

      // LE BLOC PORTE SON PROPRE TEMPS. Jusqu'ici toutes les séances de la
      // semaine recevaient le même budget, et la sortie longue — qui se court
      // plus lentement — finissait donc plus COURTE que l'endurance dans treize
      // configurations sur quinze. La distance reste dérivée du temps ; c'est le
      // temps du bloc qui change.
      var tps = bloc.tps || 1;
      var allure = niv.pace * (bloc.pace || 1);
      var km = (dispo * tps) / allure;
      var plafond = niv.maxKm * (bloc.plafond || 1);
      if (km > plafond) km = plafond;
      km = Math.round(km * 2) / 2;                    // au demi-kilomètre
      if (km < 1) km = 1;

      var reel = Math.round(fixe + km * allure + (avecMob ? mob.mins : 0));
      var exos = [];
      if (chauffe) {
        exos.push({ id: chauffe.id, name: chauffe.name, detail: detailOf(chauffe), sets: 1, load: false, track: "none" });
      }
      var texte;
      if (bloc.pat === "run-int") {
        texte = "8 × 30 s vite / 30 s trot, environ " + frKm(km) + " km en tout";
      } else if (bloc.pat === "run-hill") {
        texte = "6 à 8 montées, environ " + frKm(km) + " km en tout";
      } else if (tps > 1) {
        // Une séance volontairement plus longue le DIT, à l'endroit où on la
        // lit. Se contenter d'allonger la distance en silence ferait passer le
        // dépassement pour une erreur de l'appli.
        texte = frKm(km) + " km, allure ~" + frDec(String(Math.round(allure * 10) / 10)) +
                " min/km, environ " + Math.round(km * allure) + " min : la plus longue de ta semaine";
      } else {
        texte = frKm(km) + " km, allure ~" + frDec(String(Math.round(allure * 10) / 10)) + " min/km";
      }
      exos.push({ id: bloc.id, name: bloc.name, detail: texte, sets: 1, load: false, track: "run", cible: km });
      if (calme) {
        exos.push({ id: calme.id, name: calme.name, detail: detailOf(calme), sets: 1, load: false, track: "none" });
      }
      if (avecMob) {
        exos.push({ id: mob.id, name: mob.name, detail: detailOf(mob), sets: 1, load: false, track: "none" });
      }

      return {
        code: tpl.code,
        label: tpl.label,
        sub: tpl.sub,
        duration: "~" + (Math.round(reel / 5) * 5) + " min",
        // `over` garde son sens : cette séance dépasse le temps annoncé. C'est
        // vrai d'une sortie longue, et l'éteindre reviendrait à cacher le seul
        // fait que l'utilisateur doit connaître avant de partir.
        over: reel > minutes + 3,
        // `voulue` dit que le dépassement est la RÈGLE du bloc et non un
        // débordement : c'est ce qui permet à l'écran de ne pas conseiller
        // « reviens en arrière pour allonger la durée » là où ce serait faux.
        voulue: tps > 1,
        course: true,
        exercises: exos
      };
    }



    // Discipline d'un jour donné. En mode mixte, chaque jour choisi porte son
    // étiquette ; en mode simple, tous les jours suivent la discipline unique.
    function kindOfDay(profile, dow) {
      if (profile.discipline === "course") return "course";
      if (profile.discipline === "muscu") return "muscu";
      return (profile.dayKinds && profile.dayKinds[dow] === "course") ? "course" : "muscu";
    }



    // Le programme est indexé par jour de la semaine, mais avec DIMANCHE = 7 et
    // non 0. getDay() rend 0 le dimanche, or tout le code existant teste la clé de
    // programme par sa vérité (« if (!progKey) », « progKey ? ... »). Une séance
    // du dimanche aurait donc été traitée comme inexistante : pas d'exercices
    // affichés, tonnage compté à zéro. Décaler la clé règle le problème à la
    // source plutôt que de corriger une dizaine de tests un par un.
    function dayKey(dow) { return dow === 0 ? 7 : dow; }



    function buildPlan(profile) {
      // Tri sur la CLÉ et non sur getDay(), pour que la semaine commence le lundi :
      // sinon un profil « mardi, jeudi, dimanche » attribuerait la première séance
      // au dimanche, qui vaut 0.
      var days = profile.days.slice().sort(function (a, b) { return dayKey(a) - dayKey(b); });

      // Les deux disciplines sont réparties d'abord, puis chacune reçoit sa propre

    function nutritionTargets(profile) {

      var maintain = Math.round(w * (28 + days) / 10) * 10;

      var gaining = target > w;

      var surplus = gaining ? Math.min(400, Math.round(maintain * 0.15)) : 0;

      var kcal = Math.max(floor, maintain - deficit + surplus);

    // se calcule hors ligne, sans compte et sans réseau : la plus grande partie du
    // besoin « ajuste mon programme selon mes résultats » relève de l'arithmétique,
    // pas d'un modèle de langage.
    //
    // Les règles et leur provenance :
    //   MONTER LA CHARGE  règle des 2-pour-2 (NSCA) : dépasser la cible de deux
    //                     répétitions ou plus sur la dernière série, deux séances
    //                     de suite. Incrément de 2 à 10 %, conforme à la prise de
    //                     position de l'ACSM de 2009.
    //   BAISSER           répétitions sous le bas de la fourchette, deux séances
    //                     de suite.
    //   ÉCHEC             décroissance marquée des répétitions à l'intérieur d'une
    //                     même séance.
    //   ÉCOURTÉ           moins de séries que prescrit, trois séances de suite.
    //                     Trois, parce qu'une séance écourtée peut tout aussi bien
    //                     venir d'un manque de temps ou d'une machine occupée : les
    //                     données ne distinguent pas les deux causes.
    //   STAGNATION        1RM estimé (Epley) sans progrès sur trois séances.
    //                     ATTENTION : aucune définition validée du plateau n'existe
    //                     dans la littérature. Ce seuil est NOTRE convention, et
    //                     l'interface doit le dire.
    // ===========================================================================
    var ANA_MIN_SEANCES = 3;        // en dessous, on ne conclut rien


    var ANA_PROFONDEUR = 5;         // nombre de séances remontées par exercice


    var ANA_SEMAINES_DECHARGE = 6;  // au-delà, on suggère une décharge



    // Patterns du bas du corps : l'incrément de charge y est plus grossier, les
    // machines et barres ne se chargent pas au kilo près.
    var ANA_BAS = { knee: 1, hip: 1, "quad-iso": 1, "ham-iso": 1, calf: 1 };



    function epley(kg, reps) { return kg * (1 + reps / 30); }



    // Dernière série RENSEIGNÉE d'un exercice : c'est elle que la règle des 2-pour-2
    // regarde, pas la première.
    function derniereSerie(arr) {
      var i;
      for (i = arr.length - 1; i >= 0; i--) {
        if (arr[i] && arr[i].reps) return arr[i];
      }
      return null;
    }



    // Séances passées où CET exercice a été chargé, de la plus récente à la plus
    // ancienne, TOUS jours de programme confondus.
    //
    // Le filtre par jour de programme qui se trouvait ici rendait la moitié de
    // l'historique invisible. Un même exercice vit souvent dans PLUSIEURS jours du
    // plan — mesuré sur le générateur : 7 exercices chargés en double sur un plan
    // à 6 jours, 2 sur un plan maison à 2 jours, 1 sur un haut/bas à 4 jours. En
    // ne retenant que les séances du premier jour trouvé, le développé couché fait
    // le lundi ET le jeudi n'était analysé que sur ses lundis : 5 séances
    // enregistrées, 3 vues. Un exercice plat le lundi et en progrès le jeudi
    // recevait donc un verdict tiré d'une moitié de ses données.
    //
    // Même leçon que pour sessionTonnage en v1.3.0 : on rassemble par IDENTITÉ
    // d'exercice, jamais par appartenance à un jour du programme. Une séance libre
    // du samedi où l'on a poussé de la fonte compte, elle aussi.
    function seancesDe(exId, depuisKey) {
      var out = [], cursor = addDays(dateFromKey(depuisKey), 0), i, k, e, arr;
      for (i = 0; i < LOOKBACK_DAYS && out.length < ANA_PROFONDEUR; i++) {
        k = fmt(cursor);
        e = state.log[k];
        // La journée EN COURS ne compte que si elle a été validée. Tant que
        // « Séance terminée » n'est pas coché, ce qui est saisi est un brouillon :
        // chaque frappe est pourtant écrite en stockage. Mesuré, une seule série
        // d'échauffement à 60 kg pendant qu'on travaille à 100 suffisait à
        // retourner « Progression normale » en « stagnation » et à proposer de
        // remplacer l'exercice ; à faire franchir le seuil des trois séances par
        // une séance qui n'existe pas encore ; et à ré-ancrer sur 60 kg la charge
        // de référence que le pont IA annonce au modèle, dont dépend son garde-fou
        // de ratio. Regarder son bilan pendant le repos entre deux séries est le
        // geste le plus naturel du monde.
        //

        // sont jamais validées, et les perdre amputerait l'historique. Et une
        // séance du jour VALIDÉE compte, elle : c'est bien le décalage 0 qui est
        // voulu, seul l'état brouillon manquait.
        if (e && !(k === todayKey() && !e.done)) {
          arr = setsOf(e, exId);

    // Incrément de charge : 5 % arrondi au cran réaliste de la salle.
    //
    // TOUJOURS LA, ET PLUS UTILISÉE QUE PAR LA BAISSE. Les deux règles qui font
    // MONTER la charge passent depuis la v1.6.0 par pasCharge(), qui lit le
    // matériel et non le pattern. Celle qui fait DESCENDRE garde ce cran-ci :
    // baisser n'est pas dans le mandat de la v1.6.0, et son pas est verrouillé par
    // test_livrable_analyse (34 kg d'haltères redescendent à 32). Le défaut y est
    // pourtant le même — 32 kg n'est pas plus un cran de râtelier que 34 — et il
    // est écrit au rapport de fin.
    function incrementCharge(kg, pat) {
      var cran = ANA_BAS[pat] ? 2.5 : 1;
      var brut = kg * 0.05;
      if (brut < cran) brut = cran;
      return Math.round(brut / cran) * cran;

    // ===========================================================================
    // LE PAS QUE LE MATÉRIEL SERT RÉELLEMENT
    // ---------------------------------------------------------------------------
    // CE QUE LE DÉFAUT PRODUISAIT, mesuré sur le livrable v1.5.0 avant d'écrire une
    // ligne : développé couché barre à 60 kg -> « viser 63 kg ». 63 kg ne se charge
    // pas : il faudrait 1,5 kg par côté. Le cran venait du PATTERN de mouvement,
    // pas du matériel, et c'est le matériel qui décide de ce qu'on peut poser.
    //
    // LE CRAN LE PLUS FIN, PAR MATÉRIEL, ET POURQUOI CE CHIFFRE-LÀ :
    //   barre  2,5 kg  deux disques de 1,25 kg, un de chaque côté. C'est le plus
    //                  petit disque qu'une salle a toujours.
    //   mach   2,5 kg  la demi-plaque des colonnes. Toutes les salles n'en ont pas,
    //                  et c'est assumé : arrondir à la plaque pleine de 5 kg ferait
    //                  bondir un triceps à la poulie de 20 à 25 kg, soit 25 % d'un
    //                  coup (mesuré). Entre un pas parfois indisponible et un pas
    //                  toujours trop gros, on garde le premier.
    //   trac   2,5 kg  ceinture de lest, mêmes disques que la barre.
    //   halt   1 / 2 / 2,5 kg selon la charge — le cran du RÂTELIER, qui n'est pas
    //                  constant : 1 kg en dessous de 10, 2 kg de 10 à 30, 2,5 kg
    //                  au-delà. C'est exactement le cas cité au mandat : +2,5 kg sur
    //                  un développé couché, +1 kg sur un curl à 8 kg.
    //   elast  rien    une bande ne se charge pas en kilos. On change de bande.
    //   bw     rien    le poids de corps se durcit en changeant de variante ou en
    //                  ajoutant des répétitions. Le catalogue l'écrit déjà dans ses
    //                  fiches (« baisse la hauteur du support »).
    //
    // LES MACHINES ASSISTÉES SONT À PART, ET C'EST LE PIÈGE LE PLUS COÛTEUX. Sur
    // les dips assistés et le tirage assisté (gear « dips »), les kilos saisis sont
    // le CONTREPOIDS : en ajouter rend l'exercice PLUS FACILE. Proposer « viser
    // 47,5 kg » y est l'inverse d'une progression. Deux exercices du catalogue sont
    // concernés, et la règle des 2-pour-2 le faisait déjà avant ce correctif.
    //
    // PORTÉE MESURÉE SUR LE CATALOGUE : 72 exercices chargeables — barre 7,
    // machine 19, haltères 15, traction 1 (servables : 42) ; poids de corps 20,
    // élastique 9, traction+élastique 1, plus les 2 assistés (non servables : 32).
    // Sur ces 32, l'appli ne propose plus un nombre de kilos qu'elle ne peut pas
    // justifier — elle DIT pourquoi, ce qui vaut mieux qu'un « +1 kg » sur une
    // bande élastique.
    // ===========================================================================
    var PAS_MATERIEL = {
      barre: 2.5, mach: 2.5, trac: 2.5,
      halt: -1,                 // -1 : le cran dépend de la charge, voir pasHalteres
      elast: 0, bw: 0, cardio: 0

    // Familles de machines où les kilos AIDENT au lieu de résister.
    var PAS_ASSISTE = { dips: true };



    function pasHalteres(kg) {
      if (kg < 10) return 1;
      if (kg < 30) return 2;
      return 2.5;
    }



    // Le pas à proposer sur cet exercice à cette charge, et — quand il n'y en a
    // pas — la phrase qui dit pourquoi. Rendre 0 sans explication laisserait
    // l'utilisateur devant un constat sans suite.
    //
    // LE MATÉRIEL VIENT DU CATALOGUE, jamais du plan : un exercice STOCKÉ ne porte
    // ni equip ni gear, seul CAT_BY_ID les a. Même leçon que coutSeance, qui a dû
    // apprendre la même chose pour les minutes.
    function pasCharge(ex, kg) {
      var c = CAT_BY_ID[ex.id], i, code, cran, retenu = 0;
      if (!c || !isArray(c.equip) || !c.equip.length) return { pas: 0, pourquoi: "" };
      if (c.gear && PAS_ASSISTE[c.gear] === true) {
        return { pas: 0, pourquoi: "Sur cette machine, les kilos sont le contrepoids qui t'aide : " +
                                   "pour durcir, il faut en enlever, pas en ajouter." };
      }
      for (i = 0; i < c.equip.length; i++) {
        code = c.equip[i];
        // Un code de matériel inconnu ne vaut pas un pas inventé.
        if (!has(PAS_MATERIEL, code)) return { pas: 0, pourquoi: "" };
        cran = (PAS_MATERIEL[code] === -1) ? pasHalteres(kg) : PAS_MATERIEL[code];
        // UN SEUL matériel non chiffrable suffit à fermer la porte. Le seul
        // exercice du catalogue à en cumuler deux est la traction assistée
        // élastique : la bande y EST l'assistance, ajouter des kilos n'aurait
        // aucun sens.
        if (!(cran > 0)) {
          return { pas: 0, pourquoi: "Cet exercice ne se règle pas en kilos : passe à une variante " +
                                     "plus dure, ou ajoute des répétitions." };
        }
        if (cran > retenu) retenu = cran;
      }
      var brut = kg * 0.05;
      if (brut < retenu) brut = retenu;
      return { pas: Math.round(brut / retenu) * retenu, pourquoi: "" };
    }



    // Arrondi de sûreté : 0,05 x 42,5 rend 2,1250000000000004 en virgule
    // flottante, et une charge visée s'affiche à l'écran.
    function chargeVisee(kg, pas) {
      return Math.min(MAX_KG, Math.round((kg + pas) * 100) / 100);
    }



    // Une séance où TOUTES les séries renseignées ont atteint le haut de la
    // fourchette, et où il y en a au moins autant que le programme en prescrit.
    //
    // TROIS EXIGENCES, ET AUCUNE N'EST DÉCORATIVE :
    //   - toutes les séries renseignées, pas seulement la dernière. La règle des
    //     2-pour-2 lit derniereSerie() ; ici le mandat parle de TOUTES les séries,
    //     et c'est ce qui fait la différence entre « j'ai fini fort » et « la
    //     charge ne limite plus ».
    //   - au moins autant de séries que prescrit. Sans ce compte, deux séries
    //     faciles sur cinq, deux fois de suite, feraient monter la charge d'une
    //     séance qu'on n'a jamais finie. C'est exactement le signal contraire.
    //   - une charge sur chaque série. « Monter la charge » n'a pas de sens sur des
    //     séries sans kilos, et la référence serait fausse.
    //
    // LA RÉFÉRENCE EST LA PLUS LOURDE DES SÉRIES, et c'est le seul choix qui résiste
    // aux deux façons réelles d'enregistrer. Prendre la DERNIÈRE série (ce que fait
    // la règle des 2-pour-2) ramène à 40 kg quelqu'un qui finit par une série
    // allégée après trois séries à 60. Prendre la PLUS LÉGÈRE ramène au même
    // endroit quand un échauffement est saisi dans la même liste. La plus lourde
    // est portée par le fait mesuré : cette série-là AUSSI a atteint le haut de la
    // fourchette, donc elle ne limitait pas non plus.
    function seanceToutEnHaut(s, ex) {
      var arr = s.sets, i, e, n = 0, kgMax = 0;
      var vises = (ex.sets > 0) ? ex.sets : 1;

        e = arr[i];
        if (!e || !e.reps) continue;          // série non renseignée : elle ne dit rien
        if (e.reps < ex.repsHi) return null;  // une seule sous la cible suffit à dire non
        if (!e.kg) return null;

      }
      if (n < vises || !kgMax) return null;
      return { n: n, kg: kgMax };
    }



    function analyseExercice(ex, aujourdhui) {
      var pat = CAT_BY_ID[ex.id] ? CAT_BY_ID[ex.id].pat : "";
      var seances = seancesDe(ex.id, aujourdhui);
      var res = { id: ex.id, nom: ex.name, seances: seances.length, etat: "ok", texte: "", proposition: null };
      if (seances.length < ANA_MIN_SEANCES) {
        res.etat = "jeune";
        res.texte = seances.length + " séance" + (seances.length > 1 ? "s" : "") + " enregistrée" +
                    (seances.length > 1 ? "s" : "") + ", il en faut " + ANA_MIN_SEANCES + ".";
        return res;
      }

      // Décision déjà prise sur cet exercice, et aucune séance depuis. Sans cette
      // garde, appliquer « monte à 105 kg » ne changeant pas l'historique qui a
      // motivé le conseil, la règle se redéclencherait au rendu suivant et
      // l'appli redemanderait la même chose en boucle.
      if (ex.decideLe && seances[0].date <= ex.decideLe) {
        res.etat = "decide";
        res.texte = "Ajusté le " + ptFinal(shortDate(ex.decideLe)) + " En attente de ta prochaine séance.";
        return res;
      }

      var d0 = derniereSerie(seances[0].sets), d1 = derniereSerie(seances[1].sets);
      var kgRef = d0 && d0.kg ? d0.kg : null;

      // ORDRE D'ÉVALUATION. Les règles de charge passent AVANT « écourté », et ce
      // n'est pas un détail : mise en tête, la règle des séances écourtées avalait
      // tous les autres diagnostics. Quelqu'un qui fait 3 séries là où le
      // programme en prescrit 4 se retrouvait étiqueté « écourté » à chaque
      // analyse et ne recevait jamais le conseil de charge dont il avait besoin.
      // Les règles de charge lisent la DERNIÈRE série renseignée, donc une séance
      // qui s'effondre ne les déclenche pas : il n'y a pas de conflit entre elles.

      // --- Règle des 2-pour-2 : prêt à monter ---------------------------------
      if (d0 && d1 && d0.reps >= ex.repsHi + 2 && d1.reps >= ex.repsHi + 2 && kgRef) {
        var pas2 = pasCharge(ex, kgRef);
        res.etat = "monter";
        res.texte = "Cible dépassée de deux répétitions ou plus sur tes deux dernières séances (" +

            raison: "Règle des 2-pour-2 : deux répétitions au-dessus de la cible, deux fois de suite. " +
                    "Le pas de " + frDec(String(pas2.pas)) + " kg est celui que ton matériel sert." };
        } else if (pas2.pourquoi) {

          // disparaît, et on dit à sa place ce qu'il faut faire.

      }

      // LA MARCHE D'EN DESSOUS DE LA RÈGLE DES 2-POUR-2, et la règle inverse de la
      // stagnation. Mesure sur le livrable v1.5.0 avant correctif, squat barre
      // prescrit 5 x 6-8, journal fabriqué de neuf : cinq séries à 8 répétitions,
      // trois séances de suite, rendaient « Stagnation » et proposaient de
      // REMPLACER l'exercice. Le 1RM d'Epley ne bouge pas à charge et répétitions
      // égales, et le moteur en concluait un plateau — alors que le signal dit
      // l'exact contraire : la charge ne limite plus.
      var hi0 = seanceToutEnHaut(seances[0], ex), hi1 = seanceToutEnHaut(seances[1], ex);
      if (hi0 && hi1) {

        res.etat = "monter";
        res.texte = "Haut de la fourchette atteint sur toutes tes séries, deux séances de suite (" +
                    hi1.n + " puis " + hi0.n + " séries à " + ex.repsHi + " répétitions ou plus, " +
                    "jusqu'à " + frDec(String(hi0.kg)) + " kg).";
        if (pasH.pas > 0) {
          var viseH = chargeVisee(hi0.kg, pasH.pas);
          res.proposition = { type: "charge", ex: ex.id, kg: viseH, hausse: true,
            texte: "Viser " + frDec(String(viseH)) + " kg sur " + ex.name,
            raison: "Toutes tes séries ont atteint le haut de la fourchette, deux séances de suite : " +
                    "la charge ne te limite plus. Le pas de " + frDec(String(pasH.pas)) +
                    " kg est celui que ton matériel sert." };

          res.texte += " " + pasH.pourquoi;
        }
        return res;
      }

      // --- Sous la fourchette : trop lourd ------------------------------------
      if (d0 && d1 && d0.reps < ex.repsLo && d1.reps < ex.repsLo && kgRef) {
        var moins = incrementCharge(kgRef, pat);
        res.etat = "baisser";
        res.texte = "Sous le bas de la fourchette sur tes deux dernières séances (" +
                    d1.reps + " puis " + d0.reps + " pour " + ex.repsLo + " minimum).";
        res.proposition = { type: "charge", ex: ex.id, kg: Math.max(MIN_KG, kgRef - moins),
          texte: "Redescendre à " + frDec(String(Math.max(MIN_KG, kgRef - moins))) + " kg sur " + ex.name,
          raison: "La charge t'empêche d'atteindre la fourchette prescrite." };
        return res;

      var reps = [], ri;

        if (seances[0].sets[ri] && seances[0].sets[ri].reps) reps.push(seances[0].sets[ri].reps);
      }
      if (reps.length >= 3 && reps[0] - reps[reps.length - 1] >= 3) {
        res.etat = "echec";
        res.texte = "Tes répétitions s'effondrent en cours de série (" + reps.join(", ") +
                    ") : tu finis à l'échec.";
        res.proposition = { type: "repos", ex: ex.id, rest: Math.min(180, (ex.rest || 60) + 30),
          texte: "Allonger le repos de " + ex.name + " à " + fmtRest(Math.min(180, (ex.rest || 60) + 30)),
          raison: "Finir à l'échec dès la deuxième série coûte plus qu'il ne rapporte." };
        return res;

      // Seuil à DEUX séries manquantes, pas une. À une série près, on signalait
      // une préférence de volume comme si c'était un problème, à chaque analyse.
      // Et trois séances, parce qu'une séance courte peut venir d'un manque de
      // temps ou d'une machine occupée : les données ne distinguent pas les causes.
      var manque = Math.max(2, Math.ceil(ex.sets / 2));

        res.texte = "Arrêté nettement avant la fin sur tes trois dernières séances (" +
                    seances[0].sets.length + " séries sur " + ex.sets + " prescrites).";
        res.proposition = { type: "volume", ex: ex.id, delta: -1,
          texte: "Passer " + ex.name + " à " + (ex.sets - 1) + " séries",
          raison: "Trois séances de suite nettement écourtées. Mieux vaut un volume que tu finis." };
        return res;

      // --- Stagnation du 1RM estimé -------------------------------------------
      var maxs = [], mi2;
      for (mi2 = 0; mi2 < Math.min(3, seances.length); mi2++) {
        var ds = derniereSerie(seances[mi2].sets);
        maxs.push(ds && ds.kg && ds.reps ? epley(ds.kg, ds.reps) : 0);
      }
      if (maxs.length === 3 && maxs[0] > 0 && maxs[0] <= maxs[2] * 1.01) {
        res.etat = "stagnation";
        res.texte = "Tu es stable sur cet exercice : même charge et mêmes répétitions sur tes trois dernières séances.";
        var remplacant = analyseRemplacant(ex, pat);
        if (remplacant) {
          res.proposition = { type: "remplacer", ex: ex.id, par: remplacant.id,
            texte: "Remplacer " + ex.name + " par " + remplacant.name,
            raison: "Trois séances au même niveau. Si tu veux relancer, changer d'angle marche souvent — mais garder cet exercice est un choix valable." };
        }
        return res;
      }

      res.texte = "Progression normale.";
      return res;
    }



    // TOUS les remplaçants légaux, du meilleur au moins bon.
    //
    // Cette fonction EST le mandat de remplacement, écrit une seule fois : même
    // pattern de mouvement, faisable avec le matériel déclaré, non refusé au

    // que la séance reste équilibrée : une poussée horizontale en remplace une
    // autre, jamais un tirage.
    //

    // second filtre écrit à côté aurait fini par diverger de celui-ci, et c'est
    // précisément le filtre qui empêche un modèle de langage de remplacer un
    // soulevé de terre par des mollets.
    function analyseCandidats(ex, pat) {
      if (!profile || !pat) return [];
      var avail = { bw: true }, i;
      for (i = 0; i < profile.equipment.length; i++) avail[profile.equipment[i]] = true;
      if (avail.mach) { for (i = 0; i < GYM_IMPLIES.length; i++) avail[GYM_IMPLIES[i]] = true; }
      var exclus = {}, noGear = {};
      for (i = 0; i < profile.excluded.length; i++) exclus[profile.excluded[i]] = true;
      for (i = 0; i < (profile.noGear || []).length; i++) noGear[profile.noGear[i]] = true;
      // Déjà présents dans le programme, tous jours confondus : on ne propose pas
      // un exercice que l'utilisateur fait déjà ailleurs dans sa semaine.
      var deja = {}, pk, j;
      for (pk in PROGRAM) {
        if (!has(PROGRAM, pk)) continue;
