      dots += '<span class="ob-dot' + (i === step ? " ob-dot-on" : (i < step ? " ob-dot-past" : "")) + '"></span>';
    }

    if (etape === "Toi") {
      body =
        '<p class="ob-lead">Cette appli va construire un programme pour <b>toi</b> : ton objectif, ton temps, ton matériel. ' +
          'Huit questions, deux minutes. Tu pourras tout changer plus tard.</p>' +
        '<div class="field">' +
          '<label class="field-label" for="ob-name">Ton prénom</label>' +
          '<input id="ob-name" type="text" autocomplete="given-name" class="weight-input" maxlength="24"' +
            ' data-action="ob-name" placeholder="ex. Alex" value="' + esc(d.name) + '">' +
        '</div>' +
        '<div class="field">' +
          '<div class="field-label">Tu es…</div>' +
          '<div class="ob-row">' +
            obBtn("ob-sex", "Un homme", ' data-v="h"', d.sex === "h") +
            obBtn("ob-sex", "Une femme", ' data-v="f"', d.sex === "f") +
          '</div>' +
          '<div class="field-hint">Sert uniquement à fixer un plancher de calories cohérent dans le bilan nutrition.</div>' +
        '</div>' +
        // Sans cette porte de sortie, quelqu'un qui réinstalle l'appli ou change
        // de téléphone est enfermé dans le questionnaire : le bouton d'import
        // vit dans l'écran de bilan, inaccessible tant qu'aucun programme
        // n'existe. Il devrait refaire un diagnostic pour restaurer sa sauvegarde.
        (state.ob.direct ? '' :
          '<div class="ob-restore">' +
            '<button type="button" class="ob-restore-btn" data-action="import-data">' +
              "J'ai déjà une sauvegarde à restaurer</button>" +
            '<input type="file" id="import-file-input" accept="application/json,.json" class="sr-only">' +
          '</div>');

    } else if (etape === "Poids") {
      var ecart = Math.round((d.startWeight - d.targetWeight) * 10) / 10;
      var warn = "";
      if (d.targetWeight < 45) {
        warn = '<div class="ob-warn">Un objectif sous 45 kg sort de ce qu\'une appli peut accompagner sereinement. Parles-en à un médecin avant de viser ça.</div>';
      } else if (ecart > d.startWeight * 0.3) {
        warn = '<div class="ob-warn">Tu vises plus de 30 % de ton poids actuel. C\'est possible, mais ça se joue sur plus d\'un an et ça mérite un avis médical.</div>';
      } else if (ecart > 0) {
        var sem = Math.ceil(ecart / 0.6);
        warn = '<div class="ob-note">' + frDec(ecart) + ' kg à perdre. À un rythme tenable de 0,5 à 0,75 kg par semaine, compte <b>' +
          Math.max(4, Math.round(sem * 0.8)) + ' à ' + Math.round(sem * 1.3) + ' semaines</b>.</div>';
      } else if (ecart < -d.startWeight * 0.25) {
        warn = '<div class="ob-warn">Tu vises plus de 25 % de ton poids actuel en prise. C\'est long, et une bonne part de ce qui monterait vite serait du gras. Un avis médical n\'est pas de trop.</div>';
      } else if (ecart < 0) {
        // Prise de masse : le rythme tenable est BIEN plus lent qu'en perte.
        // Annoncer les mêmes 0,5 à 0,75 kg par semaine serait promettre du
        // muscle là où la balance ne monterait que de gras et d'eau.
        var semP = Math.ceil(Math.abs(ecart) / 0.3);
        warn = '<div class="ob-note">' + frDec(Math.abs(ecart)) + ' kg à prendre. Le muscle se construit lentement : ' +
          'à un rythme tenable de 0,2 à 0,4 kg par semaine, compte <b>' +
          Math.max(6, Math.round(semP * 0.75)) + ' à ' + Math.round(semP * 1.5) + ' semaines</b>. ' +
          'Le programme reste le même, c\'est l\'assiette qui change.</div>';
      }
      body =
        '<div class="field">' +
          '<label class="field-label" for="ob-weight">Ton poids aujourd\'hui (kg)</label>' +
          '<input id="ob-weight" type="text" inputmode="decimal" autocomplete="off" class="weight-input"' +
            ' data-action="ob-weight" placeholder="ex. 82" value="' + esc(frDec(d.startWeight)) + '">' +
          '<div class="field-hint">La virgule et le point marchent tous les deux.</div>' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label" for="ob-target">Ton objectif (kg)</label>' +
          '<input id="ob-target" type="text" inputmode="decimal" autocomplete="off" class="weight-input"' +
            ' data-action="ob-target" placeholder="ex. 75" value="' + esc(frDec(d.targetWeight)) + '">' +
        '</div>' + obCapHtml(d) + warn;

    } else if (etape === "Objectif") {
      body = obObjectifHtml(d);

    } else if (etape === "Pratique") {
      var discBtns = "";
      for (i = 0; i < DISCIPLINES.length; i++) {
        var dc = DISCIPLINES[i], dOn = d.discipline === dc.v;
        discBtns +=
          '<button type="button" class="ob-equip' + (dOn ? " ob-equip-on" : "") + '"' +
            ' data-action="ob-discipline" data-v="' + dc.v + '" aria-pressed="' + (dOn ? "true" : "false") + '">' +
            '<span class="ob-equip-box" aria-hidden="true">' + (dOn ? "✓" : "") + '</span>' +
            '<span class="ob-equip-text"><b>' + esc(dc.label) + '</b><span>' + esc(dc.hint) + '</span></span>' +
          '</button>';
      }
      var nivHtml = "";
      if (d.discipline !== "muscu") {
        var nivBtns = "";
        for (i = 0; i < RUN_LEVELS.length; i++) {
          var nv = RUN_LEVELS[i], nOn = d.runLevel === nv.v;
          nivBtns +=
            '<button type="button" class="ob-equip' + (nOn ? " ob-equip-on" : "") + '"' +
              ' data-action="ob-runlevel" data-v="' + nv.v + '" aria-pressed="' + (nOn ? "true" : "false") + '">' +
              '<span class="ob-equip-box" aria-hidden="true">' + (nOn ? "✓" : "") + '</span>' +
              '<span class="ob-equip-text"><b>' + esc(nv.label) + '</b><span>' + esc(nv.hint) + '</span></span>' +
            '</button>';
        }
        var niv = runLevel(d.runLevel);
        nivHtml =
          '<div class="ob-gear">' +
            '<div class="field-label">Où en es-tu en course ?</div>' +
            '<div class="field-hint" style="margin-bottom:10px">Les distances en découlent. C\'est la question qui évite ' +
              'de proposer dix kilomètres à quelqu\'un qui n\'a jamais couru — la blessure la plus banale du débutant.</div>' +
            '<div class="ob-equip-list">' + nivBtns + '</div>' +
            '<div class="ob-note">Allure de référence <b>' + frDec(String(niv.pace)) + ' min/km</b>, ' +
              'sortie plafonnée à <b>' + niv.maxKm + ' km</b> au début.</div>' +
          '</div>';
      }
      body =
        '<p class="ob-lead">Qu\'est-ce que tu veux faire ? Le programme, le suivi et l\'écran de progression s\'adaptent : ' +
          'on ne mesure pas une sortie en kilos.</p>' +
        '<div class="ob-equip-list">' + discBtns + '</div>' + nivHtml + obMixHtml(d);

    } else if (etape === "Rythme") {
      var dayBtns = "";
      for (i = 0; i < DAY_ORDER.length; i++) {
        var dw = DAY_ORDER[i];
        dayBtns += '<button type="button" class="ob-day' + (d.days.indexOf(dw) >= 0 ? " ob-day-on" : "") + '"' +
          ' data-action="ob-day" data-d="' + dw + '" aria-pressed="' + (d.days.indexOf(dw) >= 0 ? "true" : "false") + '"' +
          ' aria-label="' + DAY_FULL[dw] + '">' + DAY_LABELS[dw] + '</button>';
      }
      var minBtns = "";
      for (i = 0; i < MINUTE_CHOICES.length; i++) {
        minBtns += obBtn("ob-min", MINUTE_CHOICES[i] + " min", ' data-v="' + MINUTE_CHOICES[i] + '"', d.minutes === MINUTE_CHOICES[i]);
      }
      var nb = d.days.length;
      var mixHtml = obMixHtml(d);
      var nMuscu = nb - obJoursCourse(d).length;
      var splitName;
      if (d.discipline === "course") splitName = "endurance, et une sortie longue dès deux sorties";
      else if (nMuscu <= 0) splitName = "course uniquement";
      else splitName = (nMuscu <= 3 ? "full body" : (nMuscu === 4 ? "haut / bas" : "push, pull, legs et compléments"));
      body =
        '<div class="field">' +
          '<div class="field-label">Quels jours peux-tu t\'entraîner ?</div>' +
          '<div class="ob-days">' + dayBtns + '</div>' +
          '<div class="field-hint">Choisis des jours réalistes plutôt qu\'ambitieux. Les autres jours seront des jours de repos, ' +
            'et l\'appli ne te comptera pas de séance manquée dessus.</div>' +
        '</div>' +
        '<div class="field">' +
          '<div class="field-label">Combien de temps par séance ?</div>' +
          '<div class="ob-row ob-row-wrap">' + minBtns + '</div>' +
          '<div class="field-hint">Temps réel sur place, échauffement et repos compris.</div>' +
        '</div>' +
        mixHtml +
        (nb ? '<div class="ob-note"><b>' + nb + ' séance' + (nb > 1 ? "s" : "") + ' par semaine</b> de ' + d.minutes +
          ' minutes. La découpe sera en ' + splitName + '.</div>'
            : '<div class="ob-warn">Choisis au moins un jour pour continuer.</div>');

    } else if (etape === "Matériel") {
      var eqBtns = "";
      for (i = 0; i < EQUIP_OPTIONS.length; i++) {
        var o = EQUIP_OPTIONS[i], on = d.equipment.indexOf(o.v) >= 0;
        eqBtns +=
          '<button type="button" class="ob-equip' + (on ? " ob-equip-on" : "") + '"' +
            ' data-action="ob-equip" data-v="' + o.v + '" aria-pressed="' + (on ? "true" : "false") + '">' +
            '<span class="ob-equip-box" aria-hidden="true">' + (on ? "✓" : "") + '</span>' +
            '<span class="ob-equip-text"><b>' + esc(o.label) + '</b><span>' + esc(o.hint) + '</span></span>' +
          '</button>';
      }
      // Sous-liste des machines, seulement pour qui va en salle. Cases cochées
      // par défaut : on décoche ce qui manque, ce qui est plus rapide que de
      // cocher douze appareils, et plus sûr en cas d'abandon en cours de route.
      var gearHtml = "";
      if (d.equipment.indexOf("mach") >= 0) {
        var gBtns = "";
        for (i = 0; i < GEAR_OPTIONS.length; i++) {
          var g = GEAR_OPTIONS[i], gOn = d.noGear.indexOf(g.v) < 0;
          gBtns +=
            '<button type="button" class="ob-equip ob-equip-sub' + (gOn ? " ob-equip-on" : "") + '"' +
              ' data-action="ob-gear" data-v="' + g.v + '" aria-pressed="' + (gOn ? "true" : "false") + '">' +
              '<span class="ob-equip-box" aria-hidden="true">' + (gOn ? "✓" : "") + '</span>' +
              '<span class="ob-equip-text"><b>' + esc(g.label) + '</b>' +
                (g.hint ? '<span>' + esc(g.hint) + '</span>' : '') + '</span>' +
            '</button>';
        }
        var nbAbs = d.noGear.length;
        gearHtml =
          '<div class="ob-gear">' +
            '<div class="field-label">Qu\'est-ce que ta salle a vraiment ?</div>' +
            '<div class="field-hint" style="margin-bottom:10px">Tout est coché. <b>Décoche ce que ta salle n\'a pas</b> — ' +
              'aucune salle ne possède les 22 machines du catalogue, et un programme bâti sur un appareil absent ne se fait pas.</div>' +
            '<div class="ob-equip-list">' + gBtns + '</div>' +
            (nbAbs
              ? '<div class="ob-note">' + nbAbs + ' famille' + (nbAbs > 1 ? "s" : "") + ' écartée' + (nbAbs > 1 ? "s" : "") +
                '. Les exercices concernés seront remplacés par des équivalents.</div>'
              : "") +
          '</div>';
      }
      body =
        '<p class="ob-lead">Coche tout ce dont tu disposes. Ne coche rien si tu n\'as rien : le programme se fera au poids de corps, ' +
          'ce qui marche très bien.</p>' +
        '<div class="ob-equip-list">' + eqBtns + '</div>' +
        (d.equipment.indexOf("mach") >= 0
          ? '<div class="ob-note">Salle cochée : haltères, barre, traction et cardio sont considérés comme disponibles.</div>'
          : (d.equipment.length === 0
            ? '<div class="ob-note">Rien de coché : programme <b>100 % poids de corps</b>, faisable dans un salon.</div>' : "")) +
        gearHtml;

    } else if (etape === "Programme") {
      // Le plan est indexé par CLÉ de jour (dimanche = 7), pas par getDay().
      // Parcourir directement d.days ferait disparaître le dimanche de l'aperçu.
      var plan = obPreview(), sessions = "", dk, di;
      var days = [];
      for (di = 0; di < d.days.length; di++) days.push(dayKey(d.days[di]));
      days.sort(function (a, b) { return a - b; });
      for (di = 0; di < days.length; di++) {
        dk = days[di];
        var s = plan[dk];
        if (!s) continue;
        var rows = "";
        for (i = 0; i < s.exercises.length; i++) {
          var e = s.exercises[i];
          rows +=
            '<li class="ob-exo">' +
              '<span class="ob-exo-text"><b>' + esc(e.name) + '</b><span>' + esc(e.detail) + '</span></span>' +
              '<button type="button" class="ob-exo-no" data-action="ob-exclude" data-ex="' + esc(e.id) + '"' +
                ' aria-label="Refuser ' + esc(e.name) + '">✕</button>' +
            '</li>';
        }
        sessions +=
          '<div class="ob-sess">' +
            '<div class="ob-sess-head"><b>' + esc(DAY_FULL[dk === 7 ? 0 : dk]) + '</b> · ' + esc(s.label) +
              '<span class="duration-pill">' + esc(s.duration) + '</span></div>' +
            '<ul class="ob-exo-list">' + rows + '</ul>' +
          '</div>';
      }
      var exclHtml = "";
      if (d.excluded.length) {
        var chips = "";
        for (i = 0; i < d.excluded.length; i++) {
          var ce = CAT_BY_ID[d.excluded[i]];
          if (!ce) continue;
          chips += '<button type="button" class="ob-back-chip" data-action="ob-unexclude" data-ex="' + esc(ce.id) + '">' +
            esc(ce.name) + ' ↩</button>';
        }
        exclHtml = '<div class="ob-excluded"><div class="field-label">Refusés (touche pour remettre)</div>' + chips + '</div>';
      }
      var overSubi = false, overVoulu = false;
      for (di = 0; di < days.length; di++) {
        if (!plan[days[di]] || !plan[days[di]].over) continue;
        if (plan[days[di]].voulue) overVoulu = true; else overSubi = true;
      }
      body =
        '<p class="ob-lead">Voici ce que ça donne. Touche la croix pour refuser un exercice que tu détestes : ' +
          'il sera <b>remplacé immédiatement</b> par un autre du même type.</p>' +
        sessions + exclHtml +
        (overVoulu
          ? '<div class="ob-note">Ta <b>sortie longue</b> dure plus que les ' + d.minutes +
            ' minutes annoncées, et c\'est voulu : à budget de temps égal, elle serait ' +
            'plus COURTE que ton footing, puisqu\'elle se court plus lentement. Sa durée ' +
            'et sa distance sont écrites sur sa ligne.</div>'
          : '') +
        (overSubi
          ? '<div class="ob-warn">Certaines séances dépassent les ' + d.minutes + ' minutes annoncées. ' +
            'En dessous d\'une trentaine de minutes, on ne peut plus retirer d\'exercice sans amputer la séance de son mouvement principal. ' +
            'Reviens en arrière pour allonger la durée, ou garde-les en sachant que tu déborderas.</div>'
          : '');

    } else if (etape === "Nutrition") {
      var n = d.nutri;
      var mealBtns = "";
      for (i = 2; i <= 5; i++) mealBtns += obBtn("ob-meals", i + " repas", ' data-v="' + i + '"', n.meals === i);
      var alcBtns =
        obBtn("ob-alcohol", "Jamais", ' data-v="non"', n.alcohol === "non") +
        obBtn("ob-alcohol", "De temps en temps", ' data-v="parfois"', n.alcohol === "parfois") +
        obBtn("ob-alcohol", "Souvent", ' data-v="souvent"', n.alcohol === "souvent");
      var suppBtns = "";
      for (i = 0; i < SUPPS.length; i++) {
      var sp = SUPPS[i], onS = n.supps.indexOf(sp.v) >= 0;
        // La barre proteinee est SUGGEREE quand une collation est declaree : c'est
        // la seule ligne de complement qui reponde a une habitude plutot qu'a un
        // objectif. Suggeree, pas cochee — une prise alimentaire de plus ne
        // s'ajoute pas toute seule, c'est le defaut corrige en v1.9.0.
        var sugg = (sp.v === "barreprot" && n.snack && !onS);
        suppBtns +=
          '<button type="button" class="ob-equip' + (onS ? " ob-equip-on" : "") + '"' +
            ' data-action="ob-supp" data-v="' + sp.v + '" aria-pressed="' + (onS ? "true" : "false") + '">' +
            '<span class="ob-equip-box" aria-hidden="true">' + (onS ? "✓" : "") + '</span>' +
            '<span class="ob-equip-text"><b>' + esc(sp.label) +
              (sugg ? " · suggérée" : "") + '</b><span>' +
              esc(sugg ? "Tu as déclaré une collation : c'est la prise qu'elle remplace le mieux quand tu n'es pas chez toi." : sp.why) +
            '</span></span>' +
          '</button>';
      }
      body =
        '<div class="field">' +
          '<div class="field-label">Combien de vrais repas par jour ?</div>' +
          '<div class="ob-row ob-row-wrap">' + mealBtns + '</div>' +
        '</div>' +
        '<div class="field">' +
          '<div class="field-label">Quelques habitudes</div>' +
          '<div class="ob-row ob-row-wrap">' +
            obBtn("ob-bool", "Je petit-déjeune", ' data-field="breakfast"', n.breakfast) +
            obBtn("ob-bool", "J\'ajoute une collation", ' data-field="snack"', n.snack) +
            obBtn("ob-bool", "Je cuisine", ' data-field="cook"', n.cook) +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<div class="field-label">Alcool</div>' +
          '<div class="ob-row ob-row-wrap">' + alcBtns + '</div>' +
          (n.alcohol === "souvent"
            ? '<div class="ob-note">C\'est souvent le levier le plus rentable : l\'alcool apporte des calories sans rassasier et dégrade le sommeil, donc la récupération.</div>'
            : "") +
        '</div>' +
        '<div class="field">' +
          '<div class="field-label">Compléments — coche ce que tu prends ou veux prendre</div>' +
          '<div class="ob-equip-list">' + suppBtns + '</div>' +
          '<div class="ob-warn ob-warn-soft">Aucun complément n\'est nécessaire pour progresser. Ceux-là sont juste les mieux documentés. ' +
            'Si tu prends un traitement ou que tu as un souci de santé, demande à ton médecin avant d\'en ajouter un.</div>' +
        '</div>';

    } else {
      var t = nutritionTargets(d);
      var planF = obPreview(), nbS = 0, dk2;
      for (dk2 in planF) { if (has(planF, dk2)) nbS++; }
      var dayNames = [], dj, sortedDays = [];
      for (dj = 0; dj < d.days.length; dj++) sortedDays.push(dayKey(d.days[dj]));
      sortedDays.sort(function (a, b) { return a - b; });
      for (dj = 0; dj < sortedDays.length; dj++) dayNames.push(DAY_FULL[sortedDays[dj] === 7 ? 0 : sortedDays[dj]]);
      body =
        '<p class="ob-lead">Tout est prêt' + (d.name ? ", " + esc(d.name) : "") + '. Voilà ton programme.</p>' +
        '<div class="ob-recap">' +
          '<div class="ob-recap-row"><span>Séances</span><b>' + nbS + ' par semaine</b></div>' +
          '<div class="ob-recap-row"><span>Jours</span><b>' + esc(dayNames.join(", ")) + '</b></div>' +
          '<div class="ob-recap-row"><span>Durée</span><b>' + d.minutes + ' min par séance</b></div>' +
          '<div class="ob-recap-row"><span>Objectif</span><b>' + frDec(d.startWeight) + ' → ' + frDec(d.targetWeight) + ' kg</b></div>' +
          '<div class="ob-recap-row"><span>Entraînement</span><b>' + esc(objResume(d)) + '</b></div>' +
          (t.weeks ? '<div class="ob-recap-row"><span>Horizon</span><b>' + t.weeks + ' semaines environ</b></div>' : "") +
        '</div>' +
        '<div class="ob-recap">' +
          '<div class="ob-recap-row"><span>Maintien estimé</span><b>' + frNum(t.maintain) + ' kcal/j</b></div>' +
          '<div class="ob-recap-row"><span>Cible pour avancer</span><b>' + frNum(t.kcal) + ' kcal/j</b></div>' +
          '<div class="ob-recap-row"><span>Protéines</span><b>' + t.prot + ' g/j</b></div>' +
        '</div>' +
        (t.floored
          ? '<div class="ob-warn">Le déficit calculé descendait sous un plancher raisonnable : la cible a été relevée à ' + frNum(t.kcal) +
            ' kcal. Perdre plus vite que ça se fait avec un suivi, pas avec une appli.</div>'
          : '<div class="ob-warn ob-warn-soft">Ces chiffres sont des <b>repères</b>, pas une prescription. Ils sortent d\'une estimation à partir de ton poids ' +
            'et de ton volume d\'entraînement, sans mesurer ton métabolisme. Ajuste-les d\'après ce que fait la balance sur trois semaines.</div>');
    }

    var isLast = step === OB_STEPS.length - 1;
    var blocked = !obCanAdvance(step);
    var direct = !!state.ob.direct;
    var nav = direct
      ? ('<div class="ob-nav">' +
          '<button type="button" class="ob-back" data-action="ob-annuler">Annuler</button>' +
          '<button type="button" class="ob-next" data-action="ob-enregistrer"' +
            (blocked ? ' disabled' : '') + '>Enregistrer</button>' +
        '</div>')
      : ('<div class="ob-nav">' +
          (step > 0 ? '<button type="button" class="ob-back" data-action="ob-back">Retour</button>' : '<span></span>') +
          '<button type="button" class="ob-next" data-action="' + (isLast ? "ob-finish" : "ob-next") + '"' +
            (blocked ? ' disabled' : '') + '>' + (isLast ? "Créer mon programme" : "Suivant") + '</button>' +
        '</div>');

    root.innerHTML =
      '<div class="container ob-container">' +
        '<div class="brandmark"><img src="' + ICON_DATA_URI + '" alt="" class="brandmark-icon">' +
          '<span class="brandmark-text">LEMMON<b>FIT</b></span></div>' +
        (direct
          ? '<div class="ob-step-label">Modifier · ' + esc(OB_STEPS[step]) + '</div>'
          : '<div class="ob-dots" aria-hidden="true">' + dots + '</div>' +
            '<div class="ob-step-label">Étape ' + (step + 1) + ' sur ' + OB_STEPS.length + ' · ' + esc(OB_STEPS[step]) + '</div>') +
        '<section class="card ob-card">' + body +
          (state.ob.error ? '<div class="ob-warn">' + esc(state.ob.error) + '</div>' : '') +
          (direct ? obAvertissement(d) : '') +
        '</section>' +
        nav +
        (direct
          ? '<div class="ob-safe">' + esc(obRassurance(d)) + '</div>'
          : (state.ob.hasLog
            ? '<div class="ob-safe">Ton historique est intact : ce diagnostic ne touche qu\'au programme à venir.</div>'
            : '')) +
      '</div>';
  }

  // Validation finale : c'est le seul endroit qui écrit le profil.
  // LE SEUL ENDROIT QUI ECRIT LE PROFIL, pour les deux entrees : le diagnostic
  // complet et la retouche d'une etape. `refaire` dit ce qu'on reconstruit.
  //
  // POURQUOI ON NE RECONSTRUIT PAS PAR PRECAUTION. Refaire le PLAN rappelle
  // buildPlan, qui repart du catalogue : les charges visees ajustees seance
  // apres seance par l'analyse (kgCible, decideLe) repartent de zero. Refaire la
  // NUTRITION repose nutriPlanLe, et nutriBilan ecarte alors toutes les journees
  // anterieures — leurs cases sont indexees par POSITION dans le plan — donc le
  // frein sur les charges perd son historique. Reconstruire « au cas ou » coute
  // les deux.
  //
  // Rend le compte des corrections reportees, ou null si le profil obtenu n'est
  // pas affichable — auquel cas RIEN n'a ete ecrit et l'ecran d'avant tient.
  function obEcrire(d, refaire) {
    var repCorr = { reportees: 0, perdues: 0 }, cleaned;
    // LE VERROU DE FOND. Rien ne s'ecrit pour un mixte sans sortie, quel que
    // soit le chemin : c'est l'invariant, et il vit la ou l'ecriture passe.
    if (!obMixteOk(d)) return null;
    if (refaire.plan) {
      d.plan = buildPlan(d);
      // L'epoque se note ICI, au moment exact ou les jours prevus prennent une
      // valeur neuve, et depuis le plan REELLEMENT construit.
      joursHistoNoter(d);
    }
    // Le plan refait entraine la nutrition : le nombre de jours d'entrainement
    // entre dans les besoins. L'inverse n'est pas vrai.
    if (refaire.plan || refaire.nutri) {
      repCorr = nutriReporterCorrections(
        (profile && profile.nutriPlan) ? profile.nutriPlan : null, buildNutrition(d));
      d.nutriPlan = repCorr.plan;
      d.nutriPlanLe = todayKey();
      // LE PLAN REDEVIENT CELUI DE L'APPLI : le drapeau d'IA tombe. Sans cette
      // ligne, la carte continuerait de juger un plan de complements comme une
      // journee complete — le defaut trouve au navigateur en v1.13.0 — et la
      // migration de reduction resterait desarmee sur ce profil pour toujours.
      d.nutriPlanIA = null;
    }
    d.done = true;
    d.legacy = false;
    if (!d.createdAt) d.createdAt = todayKey();
    cleaned = cleanProfile(d);
    if (!cleaned || !cleaned.plan) return null;
    profile = cleaned;
    applyProfile();
    persistSettings();
    return repCorr;
  }

  // Compte-rendu des corrections de nutrition, commun aux deux entrees.
  function obPhraseCorrections(repCorr) {
    var msg = "";
    if (repCorr.reportees) {
      msg += " " + repCorr.reportees + " correction" + (repCorr.reportees > 1 ? "s" : "") +
             " reportée" + (repCorr.reportees > 1 ? "s" : "") + " sur le nouveau plan.";
    }
    if (repCorr.perdues) {
      msg += repCorr.perdues > 1
        ? (" " + repCorr.perdues + " corrections n'ont pas pu être reportées : leurs créneaux n'existent plus.")
        : " 1 correction n'a pas pu être reportée : son créneau n'existe plus.";
    }
    return msg;
  }

  // Retouche d'une seule etape. Le plan et la nutrition ne sont refaits que si
  // le DIFF le demande — jamais parce qu'une etape a ete ouverte.
  function obEnregistrer() {
    var d = obDraft(), diff = obDiff(state.ob.avant, d), repCorr, msg;
    if (!obMixteOk(d)) { state.ob.error = OB_ERR_MIXTE; render(); return; }
    repCorr = obEcrire(d, diff);
    if (!repCorr) {
      state.ob.error = "Le programme n'a pas pu être construit avec ces réglages. " +
                       "Rien n'a été modifié : corrige, ou annule.";
      render();
      return;
    }
    state.ob = null;
    state.page = "annexe";
    render();
    allerEnHaut();
    if (!diff.champs.length) msg = "Rien n'a changé.";
    else if (diff.plan) msg = "Profil enregistré. Programme et plan nutrition refaits.";
    else if (diff.nutri) msg = "Profil enregistré. Plan nutrition refait.";
    else msg = "Profil enregistré.";
    msg += obPhraseCorrections(repCorr);
    notify(msg, repCorr.perdues ? "info" : "ok");
  }

  function obFinish() {
    var d = obDraft();
    // On renvoie a l'etape qui PORTE le selecteur : au dernier ecran du
    // diagnostic, dire « touche un jour » sans montrer les jours n'aide pas.
    if (!obMixteOk(d)) {
      state.ob.error = OB_ERR_MIXTE;
      state.ob.step = obEtapeRang("Rythme");
      render();
      allerEnHaut();
      return;
    }
    var repCorr = obEcrire(d, { plan: true, nutri: true });
    if (!repCorr) {
      state.ob.error = "Le programme n'a pas pu être construit. Reviens en arrière et vérifie tes jours d'entraînement.";
      render();
      return;
    }
    state.ob = null;
    state.page = "seance";
    render();
    allerEnHaut();
    var msgOb = "Programme créé. Bonne première séance" +
                (profile.name ? ", " + profile.name : "") + "." +
                obPhraseCorrections(repCorr);
    notify(msgOb, repCorr.perdues ? "info" : "ok");
  }


  // ===========================================================================
  // MOTEUR D'ANALYSE
  // ---------------------------------------------------------------------------
  // Un constat CHIFFRÉ tiré du journal, puis des propositions d'ajustement. Tout
  // se calcule hors ligne, sans compte et sans réseau : la plus grande partie du
  // besoin « ajuste mon programme selon mes résultats » relève de l'arithmétique,
  // pas d'un modèle de langage.
  //
  // Les règles et leur provenance :
  //   MONTER LA CHARGE  règle des 2-pour-2 (NSCA) : dépasser la cible de deux
  //                     répétitions ou plus sur la dernière série, deux séances
  //                     de suite. Incrément de 2 à 10 %, conforme à la prise de
  //                     position de l'ACSM de 2009.
  //   BAISSER           répétitions sous le bas de la fourchette, deux séances
  //                     de suite.
  //   ÉCHEC             décroissance marquée des répétitions à l'intérieur d'une
  //                     même séance.
  //   ÉCOURTÉ           moins de séries que prescrit, trois séances de suite.
  //                     Trois, parce qu'une séance écourtée peut tout aussi bien
  //                     venir d'un manque de temps ou d'une machine occupée : les
  //                     données ne distinguent pas les deux causes.
  //   STAGNATION        1RM estimé (Epley) sans progrès sur trois séances.
  //                     ATTENTION : aucune définition validée du plateau n'existe
  //                     dans la littérature. Ce seuil est NOTRE convention, et
  //                     l'interface doit le dire.
  // ===========================================================================
  var ANA_MIN_SEANCES = 3;        // en dessous, on ne conclut rien
  var ANA_PROFONDEUR = 5;         // nombre de séances remontées par exercice
  var ANA_SEMAINES_DECHARGE = 6;  // au-delà, on suggère une décharge

  // Patterns du bas du corps : l'incrément de charge y est plus grossier, les
  // machines et barres ne se chargent pas au kilo près.
  var ANA_BAS = { knee: 1, hip: 1, "quad-iso": 1, "ham-iso": 1, calf: 1 };

  function epley(kg, reps) { return kg * (1 + reps / 30); }

  // Dernière série RENSEIGNÉE d'un exercice : c'est elle que la règle des 2-pour-2
  // regarde, pas la première.
  function derniereSerie(arr) {
    var i;
    for (i = arr.length - 1; i >= 0; i--) {
      if (arr[i] && arr[i].reps) return arr[i];
    }
    return null;
  }

  // Séances passées où CET exercice a été chargé, de la plus récente à la plus
  // ancienne, TOUS jours de programme confondus.
  //
  // Le filtre par jour de programme qui se trouvait ici rendait la moitié de
  // l'historique invisible. Un même exercice vit souvent dans PLUSIEURS jours du
  // plan — mesuré sur le générateur : 7 exercices chargés en double sur un plan
  // à 6 jours, 2 sur un plan maison à 2 jours, 1 sur un haut/bas à 4 jours. En
  // ne retenant que les séances du premier jour trouvé, le développé couché fait
  // le lundi ET le jeudi n'était analysé que sur ses lundis : 5 séances
  // enregistrées, 3 vues. Un exercice plat le lundi et en progrès le jeudi
  // recevait donc un verdict tiré d'une moitié de ses données.
  //
  // Même leçon que pour sessionTonnage en v1.3.0 : on rassemble par IDENTITÉ
  // d'exercice, jamais par appartenance à un jour du programme. Une séance libre
  // du samedi où l'on a poussé de la fonte compte, elle aussi.
  function seancesDe(exId, depuisKey) {
    var out = [], cursor = addDays(dateFromKey(depuisKey), 0), i, k, e, arr;
    for (i = 0; i < LOOKBACK_DAYS && out.length < ANA_PROFONDEUR; i++) {
      k = fmt(cursor);
      e = state.log[k];
      // La journée EN COURS ne compte que si elle a été validée. Tant que
      // « Séance terminée » n'est pas coché, ce qui est saisi est un brouillon :
      // chaque frappe est pourtant écrite en stockage. Mesuré, une seule série
      // d'échauffement à 60 kg pendant qu'on travaille à 100 suffisait à
      // retourner « Progression normale » en « stagnation » et à proposer de
      // remplacer l'exercice ; à faire franchir le seuil des trois séances par
      // une séance qui n'existe pas encore ; et à ré-ancrer sur 60 kg la charge
      // de référence que le pont IA annonce au modèle, dont dépend son garde-fou
      // de ratio. Regarder son bilan pendant le repos entre deux séries est le
      // geste le plus naturel du monde.
      //
      // Les journées PASSÉES restent comptées même sans `done` : beaucoup ne
      // sont jamais validées, et les perdre amputerait l'historique. Et une
      // séance du jour VALIDÉE compte, elle : c'est bien le décalage 0 qui est
      // voulu, seul l'état brouillon manquait.
      if (e && !(k === todayKey() && !e.done)) {
        arr = setsOf(e, exId);
        if (arr.length) out.push({ date: k, sets: arr });
      }
      cursor = addDays(cursor, -1);
    }
    return out;
  }

  // Incrément de charge : 5 % arrondi au cran réaliste de la salle.
  //
  // TOUJOURS LA, ET PLUS UTILISÉE QUE PAR LA BAISSE. Les deux règles qui font
  // MONTER la charge passent depuis la v1.6.0 par pasCharge(), qui lit le
  // matériel et non le pattern. Celle qui fait DESCENDRE garde ce cran-ci :
  // baisser n'est pas dans le mandat de la v1.6.0, et son pas est verrouillé par
  // test_livrable_analyse (34 kg d'haltères redescendent à 32). Le défaut y est
  // pourtant le même — 32 kg n'est pas plus un cran de râtelier que 34 — et il
  // est écrit au rapport de fin.
  function incrementCharge(kg, pat) {
    var cran = ANA_BAS[pat] ? 2.5 : 1;
    var brut = kg * 0.05;
    if (brut < cran) brut = cran;
    return Math.round(brut / cran) * cran;
  }

  // ===========================================================================
  // LE PAS QUE LE MATÉRIEL SERT RÉELLEMENT
  // ---------------------------------------------------------------------------
  // CE QUE LE DÉFAUT PRODUISAIT, mesuré sur le livrable v1.5.0 avant d'écrire une
  // ligne : développé couché barre à 60 kg -> « viser 63 kg ». 63 kg ne se charge
  // pas : il faudrait 1,5 kg par côté. Le cran venait du PATTERN de mouvement,
  // pas du matériel, et c'est le matériel qui décide de ce qu'on peut poser.
  //
  // LE CRAN LE PLUS FIN, PAR MATÉRIEL, ET POURQUOI CE CHIFFRE-LÀ :
  //   barre  2,5 kg  deux disques de 1,25 kg, un de chaque côté. C'est le plus
  //                  petit disque qu'une salle a toujours.
  //   mach   2,5 kg  la demi-plaque des colonnes. Toutes les salles n'en ont pas,
  //                  et c'est assumé : arrondir à la plaque pleine de 5 kg ferait
  //                  bondir un triceps à la poulie de 20 à 25 kg, soit 25 % d'un
  //                  coup (mesuré). Entre un pas parfois indisponible et un pas
  //                  toujours trop gros, on garde le premier.
  //   trac   2,5 kg  ceinture de lest, mêmes disques que la barre.
  //   halt   1 / 2 / 2,5 kg selon la charge — le cran du RÂTELIER, qui n'est pas
  //                  constant : 1 kg en dessous de 10, 2 kg de 10 à 30, 2,5 kg
  //                  au-delà. C'est exactement le cas cité au mandat : +2,5 kg sur
  //                  un développé couché, +1 kg sur un curl à 8 kg.
  //   elast  rien    une bande ne se charge pas en kilos. On change de bande.
  //   bw     rien    le poids de corps se durcit en changeant de variante ou en
  //                  ajoutant des répétitions. Le catalogue l'écrit déjà dans ses
  //                  fiches (« baisse la hauteur du support »).
  //
  // LES MACHINES ASSISTÉES SONT À PART, ET C'EST LE PIÈGE LE PLUS COÛTEUX. Sur
  // les dips assistés et le tirage assisté (gear « dips »), les kilos saisis sont
  // le CONTREPOIDS : en ajouter rend l'exercice PLUS FACILE. Proposer « viser
  // 47,5 kg » y est l'inverse d'une progression. Deux exercices du catalogue sont
  // concernés, et la règle des 2-pour-2 le faisait déjà avant ce correctif.
  //
  // PORTÉE MESURÉE SUR LE CATALOGUE : 72 exercices chargeables — barre 7,
  // machine 19, haltères 15, traction 1 (servables : 42) ; poids de corps 20,
  // élastique 9, traction+élastique 1, plus les 2 assistés (non servables : 32).
  // Sur ces 32, l'appli ne propose plus un nombre de kilos qu'elle ne peut pas
  // justifier — elle DIT pourquoi, ce qui vaut mieux qu'un « +1 kg » sur une
  // bande élastique.
  // ===========================================================================
  var PAS_MATERIEL = {
    barre: 2.5, mach: 2.5, trac: 2.5,
    halt: -1,                 // -1 : le cran dépend de la charge, voir pasHalteres
    elast: 0, bw: 0, cardio: 0
  };
  // Familles de machines où les kilos AIDENT au lieu de résister.
  var PAS_ASSISTE = { dips: true };

  function pasHalteres(kg) {
    if (kg < 10) return 1;
    if (kg < 30) return 2;
    return 2.5;
  }

  // Le pas à proposer sur cet exercice à cette charge, et — quand il n'y en a
  // pas — la phrase qui dit pourquoi. Rendre 0 sans explication laisserait
  // l'utilisateur devant un constat sans suite.
  //
  // LE MATÉRIEL VIENT DU CATALOGUE, jamais du plan : un exercice STOCKÉ ne porte
  // ni equip ni gear, seul CAT_BY_ID les a. Même leçon que coutSeance, qui a dû
  // apprendre la même chose pour les minutes.
  function pasCharge(ex, kg) {
    var c = CAT_BY_ID[ex.id], i, code, cran, retenu = 0;
    if (!c || !isArray(c.equip) || !c.equip.length) return { pas: 0, pourquoi: "" };
    if (c.gear && PAS_ASSISTE[c.gear] === true) {
      return { pas: 0, pourquoi: "Sur cette machine, les kilos sont le contrepoids qui t'aide : " +
                                 "pour durcir, il faut en enlever, pas en ajouter." };
    }
    for (i = 0; i < c.equip.length; i++) {
      code = c.equip[i];
      // Un code de matériel inconnu ne vaut pas un pas inventé.
      if (!has(PAS_MATERIEL, code)) return { pas: 0, pourquoi: "" };
      cran = (PAS_MATERIEL[code] === -1) ? pasHalteres(kg) : PAS_MATERIEL[code];
      // UN SEUL matériel non chiffrable suffit à fermer la porte. Le seul
      // exercice du catalogue à en cumuler deux est la traction assistée
      // élastique : la bande y EST l'assistance, ajouter des kilos n'aurait
      // aucun sens.
      if (!(cran > 0)) {
        return { pas: 0, pourquoi: "Cet exercice ne se règle pas en kilos : passe à une variante " +
                                   "plus dure, ou ajoute des répétitions." };
      }
      if (cran > retenu) retenu = cran;
    }
    var brut = kg * 0.05;
    if (brut < retenu) brut = retenu;
    return { pas: Math.round(brut / retenu) * retenu, pourquoi: "" };
  }

  // Arrondi de sûreté : 0,05 x 42,5 rend 2,1250000000000004 en virgule
  // flottante, et une charge visée s'affiche à l'écran.
  function chargeVisee(kg, pas) {
    return Math.min(MAX_KG, Math.round((kg + pas) * 100) / 100);
  }

  // Une séance où TOUTES les séries renseignées ont atteint le haut de la
  // fourchette, et où il y en a au moins autant que le programme en prescrit.
  //
  // TROIS EXIGENCES, ET AUCUNE N'EST DÉCORATIVE :
  //   - toutes les séries renseignées, pas seulement la dernière. La règle des
  //     2-pour-2 lit derniereSerie() ; ici le mandat parle de TOUTES les séries,
  //     et c'est ce qui fait la différence entre « j'ai fini fort » et « la
  //     charge ne limite plus ».
  //   - au moins autant de séries que prescrit. Sans ce compte, deux séries
  //     faciles sur cinq, deux fois de suite, feraient monter la charge d'une
  //     séance qu'on n'a jamais finie. C'est exactement le signal contraire.
  //   - une charge sur chaque série. « Monter la charge » n'a pas de sens sur des
  //     séries sans kilos, et la référence serait fausse.
  //
  // LA RÉFÉRENCE EST LA PLUS LOURDE DES SÉRIES, et c'est le seul choix qui résiste
  // aux deux façons réelles d'enregistrer. Prendre la DERNIÈRE série (ce que fait
  // la règle des 2-pour-2) ramène à 40 kg quelqu'un qui finit par une série
  // allégée après trois séries à 60. Prendre la PLUS LÉGÈRE ramène au même
  // endroit quand un échauffement est saisi dans la même liste. La plus lourde
  // est portée par le fait mesuré : cette série-là AUSSI a atteint le haut de la
  // fourchette, donc elle ne limitait pas non plus.
  function seanceToutEnHaut(s, ex) {
    var arr = s.sets, i, e, n = 0, kgMax = 0;
    var vises = (ex.sets > 0) ? ex.sets : 1;
    for (i = 0; i < arr.length; i++) {
      e = arr[i];
      if (!e || !e.reps) continue;          // série non renseignée : elle ne dit rien
      if (e.reps < ex.repsHi) return null;  // une seule sous la cible suffit à dire non
      if (!e.kg) return null;
      n++;
      if (e.kg > kgMax) kgMax = e.kg;
    }
    if (n < vises || !kgMax) return null;
    return { n: n, kg: kgMax };
  }

  function analyseExercice(ex, aujourdhui) {
    var pat = CAT_BY_ID[ex.id] ? CAT_BY_ID[ex.id].pat : "";
    var seances = seancesDe(ex.id, aujourdhui);
    var res = { id: ex.id, nom: ex.name, seances: seances.length, etat: "ok", texte: "", proposition: null };
    if (seances.length < ANA_MIN_SEANCES) {
      res.etat = "jeune";
      res.texte = seances.length + " séance" + (seances.length > 1 ? "s" : "") + " enregistrée" +
                  (seances.length > 1 ? "s" : "") + ", il en faut " + ANA_MIN_SEANCES + ".";
      return res;
    }

    // Décision déjà prise sur cet exercice, et aucune séance depuis. Sans cette
    // garde, appliquer « monte à 105 kg » ne changeant pas l'historique qui a
    // motivé le conseil, la règle se redéclencherait au rendu suivant et
    // l'appli redemanderait la même chose en boucle.
    if (ex.decideLe && seances[0].date <= ex.decideLe) {
      res.etat = "decide";
      res.texte = "Ajusté le " + ptFinal(shortDate(ex.decideLe)) + " En attente de ta prochaine séance.";
      return res;
    }

    var d0 = derniereSerie(seances[0].sets), d1 = derniereSerie(seances[1].sets);
    var kgRef = d0 && d0.kg ? d0.kg : null;

    // ORDRE D'ÉVALUATION. Les règles de charge passent AVANT « écourté », et ce
    // n'est pas un détail : mise en tête, la règle des séances écourtées avalait
    // tous les autres diagnostics. Quelqu'un qui fait 3 séries là où le
    // programme en prescrit 4 se retrouvait étiqueté « écourté » à chaque
    // analyse et ne recevait jamais le conseil de charge dont il avait besoin.
    // Les règles de charge lisent la DERNIÈRE série renseignée, donc une séance
    // qui s'effondre ne les déclenche pas : il n'y a pas de conflit entre elles.

    // --- Règle des 2-pour-2 : prêt à monter ---------------------------------
    if (d0 && d1 && d0.reps >= ex.repsHi + 2 && d1.reps >= ex.repsHi + 2 && kgRef) {
      var pas2 = pasCharge(ex, kgRef);
      res.etat = "monter";
      res.texte = "Cible dépassée de deux répétitions ou plus sur tes deux dernières séances (" +
                  d1.reps + " puis " + d0.reps + " pour " + ex.repsHi + " visées).";
      if (pas2.pas > 0) {
        var vise2 = chargeVisee(kgRef, pas2.pas);
        res.proposition = { type: "charge", ex: ex.id, kg: vise2, hausse: true,
          texte: "Viser " + frDec(String(vise2)) + " kg sur " + ex.name,
          raison: "Règle des 2-pour-2 : deux répétitions au-dessus de la cible, deux fois de suite. " +
                  "Le pas de " + frDec(String(pas2.pas)) + " kg est celui que ton matériel sert." };
      } else if (pas2.pourquoi) {
        // Le constat reste VRAI et reste affiché ; seule la proposition
        // disparaît, et on dit à sa place ce qu'il faut faire.
        res.texte += " " + pas2.pourquoi;
      }
      return res;
    }

    // --- Haut de la fourchette atteint sur TOUTES les séries, deux fois ------
    // LA MARCHE D'EN DESSOUS DE LA RÈGLE DES 2-POUR-2, et la règle inverse de la
    // stagnation. Mesure sur le livrable v1.5.0 avant correctif, squat barre
    // prescrit 5 x 6-8, journal fabriqué de neuf : cinq séries à 8 répétitions,
    // trois séances de suite, rendaient « Stagnation » et proposaient de
    // REMPLACER l'exercice. Le 1RM d'Epley ne bouge pas à charge et répétitions
    // égales, et le moteur en concluait un plateau — alors que le signal dit
    // l'exact contraire : la charge ne limite plus.
    var hi0 = seanceToutEnHaut(seances[0], ex), hi1 = seanceToutEnHaut(seances[1], ex);
    if (hi0 && hi1) {
      var pasH = pasCharge(ex, hi0.kg);
      res.etat = "monter";
      res.texte = "Haut de la fourchette atteint sur toutes tes séries, deux séances de suite (" +
                  hi1.n + " puis " + hi0.n + " séries à " + ex.repsHi + " répétitions ou plus, " +
                  "jusqu'à " + frDec(String(hi0.kg)) + " kg).";
      if (pasH.pas > 0) {
        var viseH = chargeVisee(hi0.kg, pasH.pas);
        res.proposition = { type: "charge", ex: ex.id, kg: viseH, hausse: true,
          texte: "Viser " + frDec(String(viseH)) + " kg sur " + ex.name,
          raison: "Toutes tes séries ont atteint le haut de la fourchette, deux séances de suite : " +
                  "la charge ne te limite plus. Le pas de " + frDec(String(pasH.pas)) +
                  " kg est celui que ton matériel sert." };
      } else if (pasH.pourquoi) {
        res.texte += " " + pasH.pourquoi;
      }
      return res;
    }

    // --- Sous la fourchette : trop lourd ------------------------------------
    if (d0 && d1 && d0.reps < ex.repsLo && d1.reps < ex.repsLo && kgRef) {
      var moins = incrementCharge(kgRef, pat);
      res.etat = "baisser";
      res.texte = "Sous le bas de la fourchette sur tes deux dernières séances (" +
                  d1.reps + " puis " + d0.reps + " pour " + ex.repsLo + " minimum).";
      res.proposition = { type: "charge", ex: ex.id, kg: Math.max(MIN_KG, kgRef - moins),
        texte: "Redescendre à " + frDec(String(Math.max(MIN_KG, kgRef - moins))) + " kg sur " + ex.name,
        raison: "La charge t'empêche d'atteindre la fourchette prescrite." };
      return res;
    }

    // --- Échec : les répétitions s'effondrent dans la séance -----------------
    var reps = [], ri;
    for (ri = 0; ri < seances[0].sets.length; ri++) {
      if (seances[0].sets[ri] && seances[0].sets[ri].reps) reps.push(seances[0].sets[ri].reps);
    }
    if (reps.length >= 3 && reps[0] - reps[reps.length - 1] >= 3) {
      res.etat = "echec";
      res.texte = "Tes répétitions s'effondrent en cours de série (" + reps.join(", ") +
                  ") : tu finis à l'échec.";
      res.proposition = { type: "repos", ex: ex.id, rest: Math.min(180, (ex.rest || 60) + 30),
        texte: "Allonger le repos de " + ex.name + " à " + fmtRest(Math.min(180, (ex.rest || 60) + 30)),
        raison: "Finir à l'échec dès la deuxième série coûte plus qu'il ne rapporte." };
      return res;
    }

    // --- Écourté : nettement moins de séries que prescrit, trois fois --------
    // Seuil à DEUX séries manquantes, pas une. À une série près, on signalait
    // une préférence de volume comme si c'était un problème, à chaque analyse.
    // Et trois séances, parce qu'une séance courte peut venir d'un manque de
    // temps ou d'une machine occupée : les données ne distinguent pas les causes.
    var manque = Math.max(2, Math.ceil(ex.sets / 2));
    var ecourte = 0, si;
    for (si = 0; si < 3 && si < seances.length; si++) {
      if (ex.sets - seances[si].sets.length >= manque) ecourte++;
    }
    if (ecourte >= 3) {
      res.etat = "ecourte";
      res.texte = "Arrêté nettement avant la fin sur tes trois dernières séances (" +
                  seances[0].sets.length + " séries sur " + ex.sets + " prescrites).";
      res.proposition = { type: "volume", ex: ex.id, delta: -1,
        texte: "Passer " + ex.name + " à " + (ex.sets - 1) + " séries",
        raison: "Trois séances de suite nettement écourtées. Mieux vaut un volume que tu finis." };
      return res;
    }

    // --- Stagnation du 1RM estimé -------------------------------------------
    var maxs = [], mi2;
    for (mi2 = 0; mi2 < Math.min(3, seances.length); mi2++) {
      var ds = derniereSerie(seances[mi2].sets);
      maxs.push(ds && ds.kg && ds.reps ? epley(ds.kg, ds.reps) : 0);
    }
    if (maxs.length === 3 && maxs[0] > 0 && maxs[0] <= maxs[2] * 1.01) {
      res.etat = "stagnation";
      res.texte = "Tu es stable sur cet exercice : même charge et mêmes répétitions sur tes trois dernières séances.";
      var remplacant = analyseRemplacant(ex, pat);
      if (remplacant) {
        res.proposition = { type: "remplacer", ex: ex.id, par: remplacant.id,
          texte: "Remplacer " + ex.name + " par " + remplacant.name,
          raison: "Trois séances au même niveau. Si tu veux relancer, changer d'angle marche souvent — mais garder cet exercice est un choix valable." };
      }
      return res;
    }

    res.texte = "Progression normale.";
    return res;
  }

  // TOUS les remplaçants légaux, du meilleur au moins bon.
  //
  // Cette fonction EST le mandat de remplacement, écrit une seule fois : même
  // pattern de mouvement, faisable avec le matériel déclaré, non refusé au
  // diagnostic, absent du programme. Rester dans le pattern est ce qui garantit
  // que la séance reste équilibrée : une poussée horizontale en remplace une
  // autre, jamais un tirage.
  //
  // Le pont IA s'appuie sur cette même liste, pour proposer ET pour valider. Un
  // second filtre écrit à côté aurait fini par diverger de celui-ci, et c'est
  // précisément le filtre qui empêche un modèle de langage de remplacer un
  // soulevé de terre par des mollets.
  function analyseCandidats(ex, pat) {
    if (!profile || !pat) return [];
    var avail = { bw: true }, i;
    for (i = 0; i < profile.equipment.length; i++) avail[profile.equipment[i]] = true;
    if (avail.mach) { for (i = 0; i < GYM_IMPLIES.length; i++) avail[GYM_IMPLIES[i]] = true; }
    var exclus = {}, noGear = {};
    for (i = 0; i < profile.excluded.length; i++) exclus[profile.excluded[i]] = true;
    for (i = 0; i < (profile.noGear || []).length; i++) noGear[profile.noGear[i]] = true;
    // Déjà présents dans le programme, tous jours confondus : on ne propose pas
    // un exercice que l'utilisateur fait déjà ailleurs dans sa semaine.
    var deja = {}, pk, j;
    for (pk in PROGRAM) {
      if (!has(PROGRAM, pk)) continue;
      for (j = 0; j < PROGRAM[pk].exercises.length; j++) deja[PROGRAM[pk].exercises[j].id] = true;
    }
    var cands = [], c, k2, ok;
    for (i = 0; i < CATALOG.length; i++) {
      c = CATALOG[i];
      if (c.pat !== pat || c.id === ex.id) continue;
      // CHRONOMÉTRÉ ET CHARGÉ NE S'EXCLUENT PLUS, ILS SE CLASSENT.
      //
      // C'était une exclusion, parce qu'appliquerProposition écrivait
      // track "load" sans discuter : un hollow hold devenait « 8-12 reps » et
      // réclamait des kilos pour un maintien isométrique. Cette écriture est
      // corrigée — le genre vient du catalogue —, donc l'exclusion n'a plus de
      // raison d'être. Elle devient une PRÉFÉRENCE dans le tri, plus bas :
      // même genre d'abord, genre opposé en queue de liste.
      //
      // Une préférence et non un retrait, parce que la mesure le dit : retirer
      // le filtre ne fait gagner un remplaçant à AUCUNE ligne, et en dégrade
      // six — un crunch passait de relevés de jambes, qui se comptent, à la
      // planche latérale, qui se tient. Classer plutôt qu'exclure laisse le
      // verdict déterministe rigoureusement identique et ouvre la queue de
      // liste au pont IA, qui revalide contre elle.
      if (exclus[c.id] || deja[c.id]) continue;
      if (c.gear && noGear[c.gear]) continue;
      ok = true;
      for (k2 = 0; k2 < c.equip.length; k2++) { if (!avail[c.equip[k2]]) ok = false; }
      if (ok) cands.push(c);
    }
    // Le classement du catalogue dit « le meilleur disponible », pas « le
    // meilleur remplaçant ». Pour quelqu'un qui a du matériel, il faisait
    // remonter les variantes au poids de corps dès qu'elles étaient bien
    // classées : proposer une chaise contre le mur à la place d'une extension
    // quadriceps, dans une salle équipée, c'est une régression déguisée en
    // conseil. On relègue donc le poids de corps quand il y a mieux sous la main.
    var aDuMateriel = profile.equipment.length > 0;
    // Le genre passe AVANT le rabat poids-de-corps, et c'est ce qui garantit
    // que le premier candidat ne bouge pas : tant qu'un remplaçant du même
    // genre existe, il reste en tête, exactement comme avant.
    var memeGenre = (ex.track === "load");
    cands.sort(function (a, b) {
      var ag = (isLoadableEx(a) === memeGenre) ? 0 : 1;
      var bg = (isLoadableEx(b) === memeGenre) ? 0 : 1;
      if (ag !== bg) return ag - bg;
      if (aDuMateriel) {
        var abw = (a.equip.length === 1 && a.equip[0] === "bw") ? 1 : 0;
        var bbw = (b.equip.length === 1 && b.equip[0] === "bw") ? 1 : 0;
        if (abw !== bbw) return abw - bbw;
      }
      return a.rank - b.rank;
    });
    return cands;
  }

  // Le meilleur remplaçant, ou rien.
  //
  // Rétrograder le poids de corps ne suffit pas s'il est le SEUL candidat : il
  // sort quand même. Pour quelqu'un qui a une salle, se voir proposer une chaise
  // contre le mur à la place d'une extension quadriceps n'est pas un conseil,
  // c'est un recul. Dans ce cas on ne propose rien : le constat de stagnation
  // reste affiché, sans suggestion douteuse pour meubler.
  function analyseRemplacant(ex, pat) {
    var cands = analyseCandidats(ex, pat);
    if (!cands.length) return null;
    var choisi = cands[0];
    var aDuMateriel = profile.equipment.length > 0;
    var choisiBw = (choisi.equip.length === 1 && choisi.equip[0] === "bw");
    if (aDuMateriel && choisiBw) return null;
    return choisi;
  }

  // Constat global : assiduité, ancienneté de la dernière décharge, rythme de
  // perte de poids par rapport à ce qui était visé.
  function analyseGlobale(aujourdhui) {
    var g = { seances: 0, semaines: 0, decharge: null, poids: null };
    var k, e, premiere = null;
    for (k in state.log) {
      if (!has(state.log, k)) continue;
      e = state.log[k];
      if (e && e.done) { g.seances++; if (!premiere || k < premiere) premiere = k; }
    }
    if (premiere) {
      g.semaines = Math.floor((dateFromKey(aujourdhui) - dateFromKey(premiere)) / (7 * 86400000));
    }
    var derniere = (profile && profile.dechargeLe) ? profile.dechargeLe : premiere;
    if (derniere) {
      var sem = Math.floor((dateFromKey(aujourdhui) - dateFromKey(derniere)) / (7 * 86400000));
      if (sem >= ANA_SEMAINES_DECHARGE) g.decharge = sem;
    }
    return g;
  }

  // ===========================================================================
  // FATIGUE DÉCLARÉE : ALLÉGER, JAMAIS ANNULER
  // ---------------------------------------------------------------------------
  // CE QUI EXISTAIT, MESURÉ : rien. Deux journaux identiques à ceci près que l'un
  // porte énergie/sommeil/force au plancher et l'autre au maximum rendent la
  // MÊME analyse et le MÊME écran, au caractère près. Les trois niveaux étaient
  // saisis, stockés, recopiés dans « Dernière fois », et lus par personne.
  //
  // CE QU'ON EN FAIT, ET CE QU'ON N'EN FAIT PAS. On propose de lever un peu moins
  // sur UNE séance. On ne touche pas au programme, on ne retire pas d'exercice,
  // on ne baisse aucune charge, et on n'impose rien : c'est une proposition, avec
  // « Ignorer » à côté d'« Appliquer », comme toutes les autres.
  //
  // POURQUOI L'ÉNERGIE DÉCLENCHE ET PAS LES DEUX AUTRES. Le mandat parle de deux
  // journées d'énergie basse. Le sommeil et la force ressentie NOMMENT ce qui va
  // avec — ils entrent dans la phrase, jamais dans la condition. Trois signaux
  // qui déclenchent chacun de leur côté, ce serait trois fois plus de bruit pour
  // un même état.
  //
  // AUJOURD'HUI COMPTE, et c'est la différence avec seancesDe(). Une série tapée
  // pendant qu'on est encore à la salle est un BROUILLON : elle ne dit pas encore
  // ce qu'a été la séance. Un niveau d'énergie tapé aujourd'hui, lui, est une
  // phrase complète sur aujourd'hui — il n'y a rien à attendre. Et c'est
  // précisément le jour où la proposition sert.
  //
  // LA FENÊTRE TOLÈRE UN TROU. On prend les DEUX dernières journées RENSEIGNÉES
  // dans les FAT_FENETRE derniers jours, pas les deux dernières journées du
  // calendrier : quelqu'un qui n'ouvre pas l'appli un dimanche ne doit pas voir
  // son constat s'effacer. Au-delà de la fenêtre, on ne conclut plus — une
  // journée basse d'il y a une semaine ne dit rien d'aujourd'hui.
  //
  // LA FRÉQUENCE EST BORNÉE, ET LE CHIFFRE EST MESURÉ — calendrier rejoué jour
  // par jour sur le livrable, chaque proposition étant décidée (scratchpad/
  // v160b/mesure_frequence.js) :
  //
  //   donnees-simulees-9-semaines.json, telles quelles ... 3 brutes -> 2 bornées
  //   le même journal, énergie forcée à 1 TOUS LES JOURS . 59 brutes -> 7 bornées
  //   le même journal, énergie à 3 partout ............... 0
  //   le même journal, une journée basse sur deux ........ 0
  //
  // 59 propositions sur 64 jours, c'est une par jour ou presque : sans borne, le
  // conseil devient du décor et cesse d'être lu. Bornée, la même fatigue continue
  // en rend 7, soit une tous les dix jours — et les deux témoins montrent que la
  // règle se tait quand elle doit se taire.
  // ===========================================================================
  var FAT_FENETRE = 4;   // jours regardés en arrière, AUJOURD'HUI COMPRIS
  var FAT_REPIT   = 10;  // jours de paix après une décision d'allègement
  var FAT_BAS     = 1;   // le niveau « Faible » de l'échelle LEVELS

  function fatigueRecente(aujourdhui) {
    var f = { basse: false, jours: [], sommeil: 0, force: 0, repit: 0 };
    if (!DATE_RE.test(String(aujourdhui))) return f;
    var base = dateFromKey(aujourdhui), j, k, e, vus = [], i;
    for (j = 0; j <= FAT_FENETRE && vus.length < 2; j++) {
      k = fmt(addDays(base, -j));
      e = state.log[k];
      if (e && e.energy) vus.push({ k: k, e: e });
    }
    if (vus.length < 2) return f;
    if (vus[0].e.energy !== FAT_BAS || vus[1].e.energy !== FAT_BAS) return f;
    f.basse = true;
    f.jours = [vus[1].k, vus[0].k];          // la plus ancienne d'abord
    for (i = 0; i < 2; i++) {
      if (vus[i].e.sleep === FAT_BAS) f.sommeil++;
      if (vus[i].e.strength === FAT_BAS) f.force++;
    }
    // La borne se compte depuis la dernière DÉCISION, appliquée ou refusée. Un
    // refus est une décision : on ne repose pas la question le lendemain.
    var v = (profile && profile.allegeVuLe && DATE_RE.test(profile.allegeVuLe)) ? profile.allegeVuLe : null;
    if (v) {
      var reste = FAT_REPIT - Math.floor((base - dateFromKey(v)) / 86400000);
      if (reste > 0) f.repit = reste;
    }
    return f;
  }

  // La prochaine journée PRÉVUE, aujourd'hui compris. C'est la séance qu'on
  // allège : proposer d'alléger « aujourd'hui » un jour de repos ne servirait à
  // personne, et le mandat parle de la PROCHAINE séance.
  function prochainJourPrevu(aujourdhui) {
    var d = dateFromKey(aujourdhui), i;
    if (!d || isNaN(d.getTime())) return null;
    for (i = 0; i < 8; i++) {
      if (isTrainingDay(d)) return fmt(d);
      d = addDays(d, 1);
    }
    return null;
  }

  // Cette séance-là a-t-elle seulement quelque chose à perdre ? Un plan 100 %
  // course n'a que des blocs de kilomètres, qui ne comptent pas en séries : la
  // proposition y serait une promesse vide. On ne la fait pas.
  function allegeableLe(dateKey) {
    var d = dateFromKey(dateKey);
    if (!d || isNaN(d.getTime())) return false;
    var s = PROGRAM[dayKey(d.getDay())], i, e;
    if (!s || !s.exercises) return false;
    for (i = 0; i < s.exercises.length; i++) {
      e = s.exercises[i];
      if ((e.track || "none") !== "run" && setsCountOf(e) > 1) return true;
    }
    return false;
  }

  // Analyse complète du programme actif.
  function analyser() {
    var aujourdhui = todayKey();
    var out = { exercices: [], propositions: [], globale: analyseGlobale(aujourdhui),
                exploitables: 0, jeunes: 0, horsAnalyse: [],
                fatigue: { basse: false, jours: [], sommeil: 0, force: 0, repit: 0 } };
    if (!profile || !profile.plan) return out;
    var pk, i, ex, r, vus = {};
    for (pk in PROGRAM) {
      if (!has(PROGRAM, pk)) continue;
      for (i = 0; i < PROGRAM[pk].exercises.length; i++) {
        ex = PROGRAM[pk].exercises[i];
        if (ex.track !== "load") {
          // SORTI DE L'ANALYSE, ET ON LE DIT. Une ligne qui porte `decideLe`
          // sans être en « load » a été mise là par une décision : elle était
          // analysée, elle ne l'est plus. Une ligne chronométrée d'origine, elle,
          // n'a jamais rien quitté et ne s'annonce pas.
          if (ex.decideLe && !vus[ex.id]) {
            vus[ex.id] = true;
            out.horsAnalyse.push({ id: ex.id, nom: ex.name, jour: parseInt(pk, 10) });
          }
          continue;
        }
        if (vus[ex.id]) continue;
        vus[ex.id] = true;
        r = analyseExercice(ex, aujourdhui);
        r.jour = parseInt(pk, 10);
        out.exercices.push(r);
        if (r.etat === "jeune") out.jeunes++; else out.exploitables++;
        if (r.proposition) {
          // Le jour voyage avec la proposition : sans lui, l'application ne
          // saurait pas dans quelle séance retrouver l'exercice à modifier.
          r.proposition.jour = parseInt(pk, 10);
          out.propositions.push(r.proposition);
        }
      }
    }
    // La décharge est un CONSEIL, pas un changement applique : elle demanderait
    // de retenir un etat temporaire sur une semaine, et sa preuve experimentale
    // est de toute facon mince et contestee.
    if (out.globale.decharge) {
      out.propositions.push({ type: "conseil",
        texte: "Semaine de décharge",
        raison: out.globale.decharge + " semaines sans allègement. Réduis d'une série et de " +
                "20 % tes charges pendant une semaine, puis reprends où tu en étais." });
    }

    // L'allègement sur fatigue déclarée. Il vit ICI, avec les autres règles, et
    // pas dans le rendu : c'est une règle métier.
    out.fatigue = fatigueRecente(aujourdhui);
    if (out.fatigue.basse && !out.fatigue.repit) {
      var quandF = prochainJourPrevu(aujourdhui);
      if (quandF && allegeableLe(quandF)) {
        var motsF = "Énergie faible le " + shortDate(out.fatigue.jours[0]) + " et le " +
                    ptFinal(shortDate(out.fatigue.jours[1]));
        if (out.fatigue.sommeil) {
          motsF += " Sommeil faible aussi, " + out.fatigue.sommeil +
                   (out.fatigue.sommeil > 1 ? " jours" : " jour") + " sur les deux.";
        }
        if (out.fatigue.force) {
          motsF += " Force ressentie faible aussi, " + out.fatigue.force +
                   (out.fatigue.force > 1 ? " jours" : " jour") + " sur les deux.";
        }
        out.propositions.push({ type: "alleger", quand: quandF,
          texte: "Alléger la séance du " + shortDate(quandF) +
                 " : une série de moins sur chaque exercice",
          raison: motsF + " Aujourd'hui on lève un peu moins. Les charges ne bougent pas, " +
                  "aucun exercice ne saute, et ton programme est intact dès la séance " +
                  "suivante : c'est cette séance-là, et elle seule." });
      }
    }

    return out;
  }


  // ===========================================================================
  // APPLICATION D'UNE PROPOSITION
  // ---------------------------------------------------------------------------
  // Le mandat est volontairement borné : volumes, charges, repos, et
  // remplacement d'un exercice par un autre du MÊME pattern de mouvement. Ni les
  // jours, ni la découpe, ni la discipline ne bougent — sans quoi l'historique
  // se fragmenterait en programmes successifs incomparables.
  //
  // Chaque décision, appliquée OU refusée, marque l'exercice à la date du jour.
  // Sans cette marque, la règle se redéclencherait au rendu suivant : appliquer
  // « monte à 105 kg » ne change pas l'historique qui a motivé le conseil, et
  // l'appli redemanderait la même chose en boucle jusqu'à la séance suivante.
  // ===========================================================================
  function planExercice(jour, exId) {
    if (!PROGRAM[jour]) return null;
    var i, ex = PROGRAM[jour].exercises;
    for (i = 0; i < ex.length; i++) { if (ex[i].id === exId) return { liste: ex, rang: i }; }
    return null;
  }

  // TOUTES les places du plan où cet exercice apparaît, et pas seulement celle
  // du jour porté par la proposition.
  //
  // Un exercice chargé vit souvent dans plusieurs jours : mesuré sur le
  // générateur, 7 doublons sur un plan à 6 jours. En n'écrivant que dans le
  // premier, « viser 84 kg au développé couché » laissait le jeudi à l'ancienne
  // charge — et sans marque de décision, donc la règle se redéclenchait
  // indéfiniment depuis l'autre jour. Une charge cible est une propriété de
  // l'exercice, pas du jour de la semaine où on le fait.
  function planExercices(exId) {
    var out = [], pk, i, ex;
    for (pk in PROGRAM) {
      if (!has(PROGRAM, pk)) continue;
      ex = PROGRAM[pk].exercises;
      for (i = 0; i < ex.length; i++) {
        if (ex[i].id === exId) out.push({ liste: ex, rang: i, jour: parseInt(pk, 10) });
      }
    }
    return out;
  }

  function journaliser(texte) {
    if (!profile.journal) profile.journal = [];
    profile.journal.push({ date: todayKey(), texte: String(texte).slice(0, 120) });
    if (profile.journal.length > 40) profile.journal = profile.journal.slice(-40);
  }

  // La pastille de durée et le drapeau « ça ne rentre pas dans ton temps » sont
  // posés par buildPlan, et plus personne n'y touchait ensuite. Un ajustement de
  // séries ou de repos les laissait donc mentir : mesuré, une seule proposition
  // de repos acceptée faisait passer la séance de 55 à 65 minutes réelles avec
  // la pastille figée sur « ~60 min », et une salve complète l'emmenait à 229.
  // Le budget de temps est un choix explicite du profil — il ne saute pas en
  // silence. On recalcule sur le MÊME coût que buildPlan.
  //
  // Le repli sur CAT_BY_ID n'est pas une précaution de style : les exercices
  // STOCKÉS dans le plan ne portent ni mins ni blockMins, seul le catalogue les
  // a. Sans lui, un échauffement chronométré compterait comme une série et
  // toutes les séances intactes perdraient cinq minutes d'affichage à la simple
  // mise à jour de l'appli.
  function coutSeance(s) {
    var t = 0, i, e, c, o;
    for (i = 0; i < s.exercises.length; i++) {
      e = s.exercises[i];
      c = CAT_BY_ID[e.id];
      o = { sets: e.sets, rest: (e.rest || 60) };
      if (c && c.mins) { o.mins = c.mins; }
      else if (c && c.blockMins) { o.blockMins = c.blockMins; }
      t += costOf(o, i === 0);
    }
    return t;
  }

  // `jours` limite le recalcul aux séances réellement modifiées. Sans cette
  // limite, un ajustement sur le mercredi réécrivait les pastilles des cinq
  // jours : sans effet sur un plan produit par le générateur courant, mais un
  // plan plus ancien — le plan par défaut adopté au démarrage pour quiconque
  // vient d'une version antérieure au profil — n'a pas été chiffré avec ce
  // modèle de coût. Ses cinq pastilles changeaient d'un coup, et un « ça ne
  // rentre pas dans ton temps » pouvait s'allumer sur une séance que personne
  // n'avait touchée.
  function rafraichirDurees(jours) {
    var pk, s, mins;
    for (pk in PROGRAM) {
      if (!has(PROGRAM, pk)) continue;
      if (jours && !jours[pk]) continue;
      s = PROGRAM[pk];
      // Une séance de course a sa propre durée (distance x allure) : ses blocs
      // n'ont ni séries ni repos exploitables ici.
      if (s.course) continue;
      mins = Math.round(coutSeance(s) / 60 / 5) * 5;
      s.duration = "~" + mins + " min";
      s.over = profile ? (mins > profile.minutes) : false;
    }
  }

  // Une prescription écrite en toutes lettres dans le catalogue porte une nuance
  // que repsLo/repsHi ne savent pas rendre. « 10 par lettre » sur Y-T-W au sol,
  // c'est 10 en Y, 10 en T, 10 en W — trente mouvements, pas dix. En rejouant
  // detailFromPlan on écrivait « 10 reps », le tiers du volume prescrit, et la
  // fiche détaillée continuait de décrire les trois lettres : l'écran se
  // contredisait, et le plan amputé partait en stockage.
  //
  // Tant que les bornes numériques n'ont pas bougé, on rejoue donc le texte du
  // catalogue et on ne réécrit que ce qui a réellement changé : les séries et le
  // repos. Si un ajustement modifie un jour les bornes, on repasse aux chiffres
  // plutôt que d'afficher un texte périmé.
  // LE CHIFFRE DU LIBELLE ET LE NOMBRE DE LIGNES SORTENT DU MEME ENDROIT.
  //
  // La seance allegee prescrit une serie de moins SANS toucher au plan — c'est
  // la regle de l'allegement, et elle est juste : le programme doit etre intact
  // des la seance suivante. Mais la phrase de prescription lisait `ex.sets`,
  // donc le plan, pendant que les lignes de saisie lisaient le total rendu.
  // Mesure avant correctif, seance allegee : « 8-10 reps x 5 sets » au-dessus
  // de QUATRE lignes de saisie, et un compteur « 4/4 faits » a cote.
  //
  // On ne reconstruit pas la phrase, on n'en reecrit que le nombre : le texte du
  // catalogue porte des nuances que les bornes ne savent pas rendre (voir
  // detailAjuste juste en dessous), et les exercices chronometres n'ont pas de
  // bornes du tout. L'ancre est le « x » de la prescription, suivi du nombre,
  // suivi de « sets » ou « series » — la seule forme que produisent detailOf,
  // detailFromPlan et detailAjuste.
  function detailPourSeries(ex, series) {
    var txt = String(ex.detail === undefined || ex.detail === null ? "" : ex.detail);
    if (!(series > 0) || series === setsCountOf(ex)) return txt;
    return txt.replace(/(\u00d7\s*)(\d+)(\s*)(sets|s\u00e9ries)/,
                       function (m, a, n, esp, mot) {
                         return a + series + esp +
                                (series > 1 ? mot : mot.replace(/s$/, ""));
                       });
  }

  // Une ligne chronometree n'a ni bornes ni charge, mais elle a des SERIES et un
  // REPOS. On ne reconstruit pas sa phrase — le texte du catalogue porte des
  // nuances que les nombres ne savent pas rendre —, on n'en reecrit que ce qui
  // a reellement change, exactement comme detailPourSeries au-dessus.
  function detailChrono(e) {
    var txt = String(e.detail === undefined || e.detail === null ? "" : e.detail);
    // Pas de « repos » dans la phrase : c'est une forme en minutes ou un bloc
    // chronometre dont le total serait contredit par une reecriture. On la rend
    // intacte.
    if (txt.indexOf("repos") < 0) return txt;
    var n = e.sets;
    var out = txt.replace(/(×\s*)(\d+)(\s*)(sets|séries)/,
                          function (m, a, v, esp, mot) {
                            return a + n + esp +
                                   (n > 1 ? mot : mot.replace(/s$/, ""));
                          });
    return out.replace(/(repos\s+)\d+\s*(?:sec|min)/, "$1" + fmtRest(e.rest || 60));
  }

  function detailAjuste(e) {
    if (e.track !== "load") return detailChrono(e);
    var c = CAT_BY_ID[e.id], b;
    if (c && c.reps && !/^\s*\d+(\s*-\s*\d+)?\s*$/.test(String(c.reps))) {
      b = repsBounds(c.reps);
      if (b.lo === e.repsLo && b.hi === e.repsHi) {
        return String(c.reps) + " reps × " + e.sets +
               " sets, repos " + fmtRest(e.rest || 60);
      }
    }
    return detailFromPlan(e);
  }

  function appliquerProposition(p, applique) {
    if (!profile || !profile.plan || !p) return false;
    var places = (p.ex !== undefined) ? planExercices(p.ex) : [];
    var i, neuf = null;

    // Le remplaçant se valide AVANT d'écrire quoi que ce soit. Résolu au fil de
    // la boucle, un identifiant inconnu laissait le plan à moitié modifié : le
    // lundi remplacé, le jeudi non.
    if (applique && p.type === "remplacer") {
      // has(), et non un acces direct : CAT_BY_ID["constructor"] rend la
      // fonction Object, donc une valeur vraie, et la ligne partait dans le
      // plan sans `id` — silencieusement jetee par cleanProfile a la relance
      // suivante, un exercice en moins dans la séance.
      neuf = has(CAT_BY_ID, p.par) ? CAT_BY_ID[p.par] : null;
      // Un bloc de course ne se décrit ni en répétitions ni en durée de série :
      // cette fonction ne sait pas l'écrire. Elle le refuse, plutôt que d'en
      // écrire une version approximative.
      if (!neuf || neuf.track === "run") return false;
    }

    if (applique && places.length) {
      for (i = 0; i < places.length; i++) {
        var cible = places[i], e = cible.liste[cible.rang];
        if (p.type === "charge") {
          e.kgCible = p.kg;
        } else if (p.type === "volume") {
          // Un DELTA, pas une valeur absolue : deux jours peuvent prescrire des
          // volumes différents pour le même exercice, et l'intention « une série
          // de moins » se transpose, un « passe à 3 » non.
          e.sets = Math.max(1, Math.min(MAX_SETS, e.sets + p.delta));
          e.detail = detailAjuste(e);
        } else if (p.type === "repos") {
          e.rest = p.rest;
          e.detail = detailAjuste(e);
        } else if (p.type === "remplacer") {
          var b = repsBounds(neuf.reps);
          // LE GENRE DE L'EXERCICE VIENT DU CATALOGUE, PAS D'UNE CONSTANTE.
          // `load: true, track: "load"` était écrit sans regarder le
          // remplaçant : un gainage devenait un exercice à kilos prescrit en
          // 8-12 répétitions — le repli de repsBounds(undefined) — et la vraie
          // prescription (« 30-60 sec ») était perdue. La corruption survivait
          // à cleanProfile, donc au rechargement.
          var chg = isLoadableEx(neuf);
          var nSets = neuf.sets || e.sets, nRest = neuf.rest || 60;
          // On garde la POSITION dans la séance : un polyarticulaire ne se
          // retrouve pas relégué en fin de séance parce qu'il a changé de nom.
          cible.liste[cible.rang] = {
            id: neuf.id, name: neuf.name, sets: nSets,
            load: chg, track: chg ? "load" : "none", rest: nRest,
            repsLo: b.lo, repsHi: b.hi, decideLe: todayKey()
          };
          // La phrase se compose sur les séries et le repos RÉELLEMENT écrits,
          // pas sur l'entrée du catalogue : `neuf.sets || e.sets` peut retenir
          // la valeur de la ligne remplacée, et « × 3 sets » au-dessus de deux
          // pastilles serait un libellé qui ment sur ce qu'on demande.
          cible.liste[cible.rang].detail = chg
            ? detailAjuste(cible.liste[cible.rang])
            : detailOf({ mins: neuf.mins, blockMins: neuf.blockMins,
                         dur: neuf.dur, note: neuf.note,
                         sets: nSets, rest: nRest });
        }
      }
      // Seules les séances qu'on vient d'écrire sont rechiffrées, et seulement
      // si on a écrit : un REFUS ne doit rien changer au plan.
      //
      // Une charge cible n'entre dans aucun terme du calcul de durée : accepter
      // « viser 40 kg » ne change ni les séries ni le repos. Rechiffrer dans ce
      // cas ne ferait que réécrire la pastille d'un plan hérité, pour rien.
      if (p.type !== "charge") {
        var joursTouches = {};
        for (i = 0; i < places.length; i++) joursTouches[places[i].jour] = true;
        rafraichirDurees(joursTouches);
      }
      journaliser(p.texte);
    }

    // Marquer la décision, appliquée ou non, à CHAQUE place. Un refus est une
    // décision : on ne reposera pas la question tant qu'aucune séance nouvelle
    // n'est venue. Une seule place marquée laissait la règle repartir depuis
    // l'autre jour au rendu suivant.
    for (i = 0; i < places.length; i++) {
      places[i].liste[places[i].rang].decideLe = todayKey();
    }
    if (p.type === "conseil") profile.dechargeLe = todayKey();
    // L'ALLEGEMENT POSE UNE DATE, IL NE TOUCHE PAS AU PLAN. C'est ce qui le rend
    // sans danger : rien a defaire le lendemain, rien qui puisse corrompre un
    // programme, et un profil relu par une version anterieure ignore simplement
    // le champ. Reduire `sets` dans PROGRAM aurait demande de le remonter — et
    // la premiere occasion manquee de le remonter aurait ampute le programme
    // pour de bon.
    if (p.type === "alleger") {
      if (applique && p.quand && DATE_RE.test(p.quand)) {
        profile.allegeLe = p.quand;
        journaliser(p.texte);
      }
      // La marque tombe MEME SUR UN REFUS : c'est elle qui borne la frequence.
      profile.allegeVuLe = todayKey();
    }

    profile.plan = PROGRAM;
    persistSettings();
    return true;
  }

  // ===========================================================================
  // CARTE ANALYSE
  // ===========================================================================
  var ETATS = {
    monter:     { pastille: "▲", cls: "ana-up",   mot: "Prêt à monter" },
    baisser:    { pastille: "▼", cls: "ana-down", mot: "Trop lourd" },
    echec:      { pastille: "!", cls: "ana-warn", mot: "À l'échec" },
    ecourte:    { pastille: "!", cls: "ana-warn", mot: "Écourté" },
    stagnation: { pastille: "=", cls: "ana-flat", mot: "Stagnation" },
    ok:         { pastille: "✓", cls: "ana-ok",   mot: "Progression" },
    jeune:      { pastille: "·", cls: "ana-wait", mot: "En attente" },
    decide:     { pastille: "·", cls: "ana-wait", mot: "Ajusté" }
  };

  function anaPropHtml(p, pi) {
    return '<div class="ana-prop">' +
      '<div class="ana-prop-texte">' + esc(p.texte) + '</div>' +
      '<div class="ana-prop-raison">' + esc(p.raison) + '</div>' +
      (p.type === "conseil"
        ? '<div class="ana-prop-actes">' +
            '<button type="button" class="ana-ok-btn" data-action="ana-vu" data-i="' + pi + '">Compris</button>' +
          '</div>'
        : '<div class="ana-prop-actes">' +
            '<button type="button" class="ana-ok-btn" data-action="ana-appliquer" data-i="' + pi + '">Appliquer</button>' +
            '<button type="button" class="ana-non-btn" data-action="ana-ignorer" data-i="' + pi + '">Ignorer</button>' +
          '</div>') +
    '</div>';
  }

  // Le bloc « N propositions », rendu a l'identique aux deux endroits qui en ont
  // besoin. Les INDICES restent ceux de a.propositions : le gestionnaire de clic
  // rejoue analyser() et lit `data-i` dedans, un index local mentirait.
  function anaPropsBlocHtml(props) {
    if (!props.length) return "";
    var s = "", i;
    for (i = 0; i < props.length; i++) s += anaPropHtml(props[i], i);
    return '<div class="ana-bloc">' +
      '<div class="field-label">' + props.length + ' proposition' +
        (props.length > 1 ? "s" : "") + '</div>' + s +
    '</div>';

  // L'ECRAN DE FIN DE SEANCE. Il ne calcule rien de neuf : il relit ce que la
  // journee porte deja, et le dit une fois.
  function bravoHtml(dateKey, entry, program) {
    var kg = sessionTonnage(dateKey, entry), sets = 0, exos = 0, km = 0, k;
    var s = entry && entry.sets ? entry.sets : {};
    for (k in s) {
      if (!has(s, k) || !isArray(s[k])) continue;
      var fait = 0, z;
      for (z = 0; z < s[k].length; z++) {
        if (!s[k][z]) continue;
        if (s[k][z].reps > 0 || s[k][z].km > 0 || s[k][z].min > 0) fait++;
        if (s[k][z].km > 0) km += s[k][z].km;
      }
      if (fait) { exos++; sets += fait; }
    }

    // Trois cas, dans cet ordre. Aucun tirage au sort : l'ecran doit etre
    // reproductible, sinon il n'est pas testable.
    var naturel = PROGRAM[dayKey(dateFromKey(dateKey).getDay())];
    var phrase;
    if (!naturel) {
      phrase = "Ce jour n'était pas prévu au programme. Il compte quand même.";
    } else if (km > 0 && kg <= 0) {
      phrase = "Les kilomètres faciles sont ceux qui construisent le reste.";
    } else {
      phrase = "C'est la répétition qui fait le résultat, pas la séance parfaite.";
    }

    var suivant = prochainJourPrevu(fmt(addDays(dateFromKey(dateKey), 1)));
    var chiffres =
      '<div class="stat-grid">' +
        '<div class="stat-box"><div class="stat-num">' + exos + '</div>' +
          '<div class="stat-label">exercice' + (exos > 1 ? "s" : "") + '</div></div>' +
        '<div class="stat-box"><div class="stat-num">' + sets + '</div>' +
          '<div class="stat-label">série' + (sets > 1 ? "s" : "") + '</div></div>' +
        (kg > 0
          ? '<div class="stat-box"><div class="stat-num">' + frPoids(kg) + '</div>' +
            '<div class="stat-label">soulevé<br>aujourd\'hui</div></div>'
          : '') +
        (km > 0
