      // bouton qui ne fait rien vaut moins qu'une absence de bouton.
      if (i > 0) {
        h += '<button type="button" class="mp-x" data-action="exo-retirer" data-si="' + a.si +
             '" data-nom="' + esc(ex[i].nom) + '" aria-label="Retirer ' + esc(ex[i].nom) + '">Retirer</button>';
      }
      h += "</li>";
    }
    h += "</ul>";

    // LE VIVIER est exactement ce que la duree a ecarte, plus ce qui a ete
    // retire a la main. Ces decisions survivent a un changement de duree :
    // le generateur propose, l'utilisateur tranche, et le generateur ne
    // reecrit pas la decision.
    h += '<button type="button" class="mp-plus" data-action="ajout-ouvrir" data-si="' + a.si + '">' +
         "＋ Ajouter un exercice (" + dispo.length + " disponible" + (dispo.length > 1 ? "s" : "") + ")</button>";

    if (state.ajoutOuvert === String(a.si)) {
      h += '<div class="mp-panneau">';
      if (!dispo.length) {
        h += '<p class="cb-vide">Rien à réintégrer : tous les exercices de cette séance sont déjà là.</p>';

        for (i = 0; i < dispo.length; i++) {

               '<button type="button" class="mp-d-b" data-action="exo-ajouter" data-cle="' +
               esc(dispo[i].cle) + '">Ajouter</button></div>';
        }
      }
      h += "</div>";
    }
    return h;
  }

  function photoChoisir(input) {
    var f = input && input.files && input.files[0];
    if (!f) return;
    if (state.photo) { try { window.URL.revokeObjectURL(state.photo); } catch (e) {} }
    poser({ photo: window.URL.createObjectURL(f) });

  function photoRetirer() {
    // On REVOQUE l'URL avant de la lacher : sans ca, le blob reste en memoire
    // du navigateur jusqu'a la fermeture de l'onglet.
    if (state.photo) { try { window.URL.revokeObjectURL(state.photo); } catch (e) {} }
    poser({ photo: null });
  }

  function exporterJournal() {
    var o = {}, i, k, b, url, a;
    for (i = 0; i < CLES_SAUVEES.length; i++) { k = CLES_SAUVEES[i]; o[k] = state[k]; }
    o._version = APP_VERSION;
    o._export = cleDate(new Date());
    try {
      b = new window.Blob([JSON.stringify(o, null, 1)], { type: "application/json" });
      url = window.URL.createObjectURL(b);
      a = document.createElement("a");
      a.href = url;
      a.download = "lemmonfit-" + cleDate(new Date()) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(function () { try { window.URL.revokeObjectURL(url); } catch (e) {} }, 1000);
      // LA DATE DU DERNIER EXPORT MANQUAIT. C'est la seule facon de savoir si
      // sa sauvegarde date d'hier ou de trois mois, et donc ce qu'on perdrait.
      poser({ dernierExport: cleDate(new Date()) });
    } catch (e) {}
  }

  // L'IMPORT PASSE PAR LA MEME PORTE QUE LA LECTURE DU STOCKAGE : seules les
  // cles connues sont reinjectees, les autres ignorees. Un fichier exporte par
  // une version future ne peut donc pas imposer un champ que ce code ne sait
  // pas traiter, et un fichier bricole a la main ne peut pas injecter n'importe
  // quoi dans l'etat.
  //
  // IL REMPLACE, IL NE FUSIONNE PAS. Fusionner deux journaux demanderait de
  // trancher les conflits date par date, sans que personne puisse verifier le
  // resultat. On le dit dans le libelle.
  function importerJournal(input) {
    var f = input && input.files && input.files[0];
    if (!f) return;
    var lecteur = new window.FileReader();
    lecteur.onload = function () {
      var o, i, k, repris = 0, maj = {};
      try { o = JSON.parse(String(lecteur.result)); }
      catch (e) { poser({ importMsg: "Fichier illisible : ce n'est pas du JSON." }); return; }
      if (!o || typeof o !== "object") {
        poser({ importMsg: "Fichier illisible." }); return;
      }
      for (i = 0; i < CLES_SAUVEES.length; i++) {
        k = CLES_SAUVEES[i];
        if (has(o, k)) { maj[k] = o[k]; repris++; }
      }
      if (!repris) { poser({ importMsg: "Aucune donnée reconnue dans ce fichier." }); return; }
      maj.importMsg = "Importé : " + repris + " réglages, " +
                      ((o.hist && o.hist.length) || 0) + " séances.";
      poser(maj);
      state.actFaits = faitsSemaine();
      rendre();
    };
    lecteur.onerror = function () { poser({ importMsg: "Lecture du fichier impossible." }); };
    lecteur.readAsText(f);
  }

  // Vide les caches du service worker puis recharge. C'est la seule sortie
  // pour qui a l'appli en ecran d'accueil : sans ca, iOS resert sa copie.
  function rechargerMaj() {
    var fini = function () {
      window.location.href = window.location.pathname + "?v=" + jourNumero() + "-" + (state.hist || []).length;
    };
    try {
      if (window.caches && window.caches.keys) {
        window.caches.keys().then(function (ks) {
          var i, p = [];
          for (i = 0; i < ks.length; i++) p.push(window.caches.delete(ks[i]));
          return window.Promise.all(p);
        }).then(fini)["catch"](fini);
        return;
      }
    } catch (e) {}
    fini();
  }

  function resetConfirmer() {
    try { window.localStorage.removeItem(CLE); } catch (e) {}
    window.location.reload();
  }

  function exoRetirer(si, nom) {
    var S = SEANCES[si], i, cle = null, maj = {}, k;
    for (i = 0; i < S.exos.length; i++) { if (S.exos[i].nom === nom) cle = S.code + "-" + i; }
    if (!cle) return;
    for (k in state.obRetires) { if (has(state.obRetires, k)) maj[k] = state.obRetires[k]; }
    maj[cle] = 1;
    // Retirer annule un ajout precedent : sinon les deux drapeaux se
    // contrediraient et `obRetires`, prioritaire, gagnerait sans qu'on
    // comprenne pourquoi le bouton Ajouter ne fait plus rien.
    var aj = {}, k2;
    for (k2 in state.obAjouts) { if (has(state.obAjouts, k2) && k2 !== cle) aj[k2] = state.obAjouts[k2]; }
    poser({ obRetires: maj, obAjouts: aj });
  }

  function exoAjouter(cle) {
    var maj = {}, k, ret = {}, k2;
    for (k in state.obAjouts) { if (has(state.obAjouts, k)) maj[k] = state.obAjouts[k]; }
    maj[cle] = 1;
    for (k2 in state.obRetires) { if (has(state.obRetires, k2) && k2 !== cle) ret[k2] = state.obRetires[k2]; }
    poser({ obAjouts: maj, obRetires: ret });
  }

  /* =========================================================================

     ========================================================================= */

  /* -------------------------------------------------------------------------
     LES DEUX PROMPTS
     -------------------------------------------------------------------------
     LEUR STRUCTURE EST RECOPIEE DU PROTOTYPE, LEUR CONTENU NON, ET C'EST
     DELIBERE. Les deux fonctions du prototype sont ecrites EN DUR : un homme de
     38 ans, 78,4 kg pour 1,78 m, un developpe couche a 37,5 kg, 2 340 kcal,
     « pas de porc ». Seuls le nombre de jours et la duree y varient.

     La spec demande deux choses incompatibles : « recopie ces deux fonctions
     verbatim » et « composent le prompt depuis les charges reelles des 4
     dernieres semaines, le materiel, le poids, l'objectif ». On ne peut pas
     satisfaire les deux. Recopier verbatim enverrait a l'IA le corps de
     quelqu'un d'autre, et le modele repondrait pour une personne qui n'existe
     pas — sur un ecran dont TOUT l'interet est que la reponse soit personnelle.

     On garde donc les intitules de section mot pour mot, et on les alimente
     avec l'etat et le journal.
     ------------------------------------------------------------------------- */

  // Les charges reellement soulevees sur les 4 dernieres semaines, par
  // exercice : premiere valeur, derniere valeur, et le signalement d'une
  // stagnation. C'est CE bloc qui rend la question utile.
  function chargesRecentes() {
    var h = histTrie(), i, j, k, par = {}, ordre = [], auj = new Date(), d, e;
    auj.setHours(0, 0, 0, 0);

    for (i = h.length - 1; i >= 0; i--) {
      if (h[i].t !== "salle" || !h[i].ex) continue;
      d = dateDepuisCle(h[i].d);
      if (!d || jourEcart(auj, d) > 28) continue;
      for (j = 0; j < h[i].ex.length; j++) {
        e = h[i].ex[j];
        if (e.unite === "min" || !e.sets.length) continue;
        var meilleure = 0;
        for (k = 0; k < e.sets.length; k++) { if (e.sets[k].kg > meilleure) meilleure = e.sets[k].kg; }
        if (!par[e.nom]) { par[e.nom] = { prem: meilleure, der: meilleure, n: 0, reps: e.sets[0].reps, series: e.sets.length, stagne: 0 }; ordre.push(e.nom); }
        else {
          if (meilleure === par[e.nom].der) par[e.nom].stagne++;
          else par[e.nom].stagne = 0;
          par[e.nom].der = meilleure;
          par[e.nom].series = e.sets.length;
          par[e.nom].reps = e.sets[0].reps;
        }
        par[e.nom].n++;
      }
    }
    return { par: par, ordre: ordre };
  }

  function materielTexte() {
    var out = [], i;
    for (i = 0; i < EQUIP.length; i++) { if (state.obEquip[i]) out.push(EQUIP[i].t); }
    var absentes = [];
    for (i = 0; i < GEAR.length; i++) { if (!state.obGear[i]) absentes.push(GEAR[i].t); }
    var l = [];
    l.push(out.length ? out.join(", ") + "." : "Poids du corps uniquement.");
    // CE QUI MANQUE COMPTE PLUS QUE CE QUI EST LA. Sans cette ligne, un modele
    // propose un developpe epaules a la machine a quelqu'un qui n'en a pas, et
    // la reponse entiere devient inapplicable.
    if (absentes.length) l.push("PAS de : " + absentes.join(", ") + ".");
    l.push("Haltères jusqu'à " + state.obHalt + " kg.");
    return l;
  }

  function promptProgramme(nJours, duree) {
    var p = profilDepuisEtat(), c = chargesRecentes(), i, nom, x, L = [];
    var obj = ["perte de gras", "maintien", "prise de muscle"][state.obObjectif] || "perte de gras";
    var d = deriver(), tonnage = 0, hj = histDepuis(28);

    for (i = 0; i < hj.length; i++) { if (hj[i].t === "salle") tonnage += hj[i].tonnage || 0; }

    L.push("Tu es préparateur physique. Je suis en " + obj + ", " +
           fmtVal(p.startWeight) + " kg pour" );
    L.push((state.obTaille ? state.obTaille + " cm" : "taille non précisée") +
           (state.obAge ? ", " + state.obAge + " ans" : "") + ", " +
           nJours + " séance" + (nJours > 1 ? "s" : "") + " par semaine en salle, " +
           duree + " par séance.");
    L.push("");

    L.push("== CE QUE J'AI FAIT SUR 4 SEMAINES ==");
    if (!c.ordre.length) {
      L.push("Aucune séance enregistrée pour l'instant : je démarre.");
    } else {
      for (i = 0; i < c.ordre.length; i++) {
        nom = c.ordre[i];
        x = c.par[nom];
        L.push(nom + " : " + (x.prem === x.der ? fmtVal(x.der) + " kg"
                : fmtVal(x.prem) + " → " + fmtVal(x.der) + " kg") +
               ", " + x.series + "×" + x.reps +
               (x.stagne >= 2 ? " (bloqué depuis " + (x.stagne + 1) + " séances)" : ""));
      }
      L.push("Volume sur 4 semaines : " + fmtVal(Math.round(tonnage / 100) / 10) + " t.");
    }
    L.push("");

    L.push("== MON MATÉRIEL ==");
    L = L.concat(materielTexte());
    L.push("");

    L.push("== CE QUE JE VEUX SAVOIR ==");
    L.push("1. Mon programme est-il suffisant, ou trop simple pour mon niveau ?");
    L.push("   Est-il assez progressif, ou est-ce que je piétine ?");
    L.push("2. Qu'est-ce qui explique mes stagnations ?");
    L.push("3. Quoi changer sur les 4 prochaines semaines ?");
    L.push("");
    // LE FORMAT DE REPONSE EST IMPOSE PARCE QU'UN VALIDATEUR LE RELIT. Ce n'est
    // pas une preference de mise en forme : ce qui ne suit pas cette grammaire
    // est ecarte a la lecture, et l'utilisateur voit pourquoi.
    L.push("Une ligne par changement, séparateur barre verticale :");
    L.push("CHARGE | identifiant de l'exercice | kg | raison courte");
    L.push("N'invente pas d'exercice absent de mon matériel.");
    return L.join("\n");
  }

  function promptNutrition(nJours) {
    var p = profilDepuisEtat(), t = MOTEUR.nutritionTargets(p), i, s, L = [];
    var obj = ["perte de gras", "maintien", "prise de muscle"][state.obObjectif] || "perte de gras";
    var prot = 0, kcal = 0;

    // CE QUE LES COMPLEMENTS APPORTENT DEJA doit sortir de la cible demandee :
    // sans ca, le plan les compterait une seconde fois et l'utilisateur
    // mangerait au-dessus de sa cible en croyant la suivre.
    //
    // MAIS LA TABLE DE LA v1.21.0 NE PORTE PAS LES MACROS TOUTES FAITES. Celle
    // du prototype avait `prot: 24, kcal: 114` ecrits dans la ligne ; celle-ci
    // pose `alim` et calcule depuis une table d'aliments qui n'est pas exposee
    // par la facade du moteur. Lire `s.prot` y rend donc undefined.
    //
    // ON NE COMBLE PAS PAR UN ZERO. Annoncer « je ne prends aucun complement »
    // a quelqu'un qui en prend deux ferait composer un plan qui les ignore,
    // donc un plan faux. Tant que le calcul n'est pas branche, on NOMME les
    // complements retenus et on laisse le dieteticien en tenir compte.
    var noms = [];
    for (i = 0; i < MOTEUR.SUPPS.length; i++) {
      if (!state.obSupps[i]) continue;
      s = MOTEUR.SUPPS[i];
      noms.push(s.label);
      if (typeof s.prot === "number") prot += s.prot;
      if (typeof s.kcal === "number") kcal += s.kcal;
    }

    L.push("Tu es diététicien. Écris-moi le plan alimentaire d'UNE journée,");
    L.push("en français, pour " + (p.sex === "f" ? "une femme" : "un homme") +
           (state.obAge ? " de " + state.obAge + " ans" : "") + ", " +
           fmtVal(p.startWeight) + " kg" +
           (state.obTaille ? ", " + state.obTaille + " cm" : "") + ", en " + obj);
    L.push("avec " + nJours + " séance" + (nJours > 1 ? "s" : "") + " par semaine.");
    L.push("");

    L.push("== MES CIBLES, CALCULÉES PAR L'APPLI ==");
    L.push(t.kcal + " kcal et " + t.prot + " g de protéines pour la journée entière.");
    if (prot || kcal) {
      L.push("Mes compléments en apportent déjà " + prot + " g et " + kcal + " kcal, et l'appli");
      L.push("les ajoutera elle-même : tes lignes doivent donc totaliser");
      L.push("environ " + (t.kcal - kcal) + " kcal et " + (t.prot - prot) + " g.");
    } else if (noms.length) {
      L.push("Je prends déjà : " + noms.join(", ") + ".");
      L.push("Tiens-en compte dans le total, l'appli les ajoute de son côté.");
    } else {
      L.push("Je ne prends aucun complément : tes lignes doivent couvrir la cible entière.");
    }
    L.push("");

    L.push("== CONTRAINTES ==");
    var prises = [];
    if (state.obPetitDej) prises.push("petit-déjeuner");
    prises.push("déjeuner");
    if (state.obCollation) prises.push("collation");
    prises.push("dîner");
    L.push(prises.length + " prises : " + prises.join(", ") + ".");
    L.push(state.obCuisine ? "Je cuisine, mais simple : moins de 20 min par repas."
                           : "Je cuisine peu : privilégie ce qui se prépare sans cuisson.");
    L.push("");
    L.push("Une ligne par prise, exactement dans cette forme, séparateur");
    L.push("barre verticale :");
    L.push("repas | clé | ce que je mange, avec les quantités | protéines g | kcal");
    return L.join("\n");
  }

  /* -------------------------------------------------------------------------
     LA ZONE DE COLLAGE — ET LE VALIDATEUR
     -------------------------------------------------------------------------
     LA SPEC NE MENTIONNE QUE « une zone ou coller la reponse ». Ce serait un
     tuyau : l'appli ecrirait dans le programme ce qu'un modele a dit, sans
     rien verifier. Or c'est exactement ce que l'architecture de la v1.21.0
     interdit — le mandat vit dans le VALIDATEUR, jamais dans le prompt, parce
     qu'un prompt se contourne.

     Le collage passe donc par iaLire(), greffe avec le moteur. Il revalide
     chaque ligne contre le plan et le materiel declares, borne chaque
     proposition a plus ou moins 20 % et plafonne les hausses par salve.
     ET LES REJETS SONT MONTRES : les avaler laisserait croire que l'IA n'a
     rien propose, alors qu'elle a propose quelque chose d'irrecevable.
     ------------------------------------------------------------------------- */
  function iaCollerHtml() {
    var h = '<div class="carte-t" style="margin-top:20px">Colle la réponse ici</div>';
    h += '<textarea class="ia-zone" rows="5" placeholder="Colle la réponse de ton assistant…"' +
         ' data-action="ia-coller">' + esc(state.iaTexte || "") + "</textarea>";
    h += '<button type="button" class="cs-cta cs-cta-clair" data-action="ia-lire">' +
         "Lire la réponse</button>";

    if (!state.iaRes) return h;

    var r = state.iaRes, i;
    h += '<div class="ia-res">';
    if (r.rien) {
      h += '<p class="cr-p">Ton assistant ne propose aucun changement.</p>';
    }
    if (r.props && r.props.length) {
      h += '<div class="carte-t">Propositions retenues · ' + r.props.length + "</div><ul class=\"mo-liste\">";
      for (i = 0; i < r.props.length; i++) {
        h += '<li><div class="mo-l" style="cursor:default"><span class="mo-n">' +
             esc(r.props[i].texte || r.props[i].id || "") + "</span>" +
             (r.props[i].raison ? '<span class="mo-s">' + esc(r.props[i].raison) + "</span>" : "") +
             "</div></li>";
      }
      h += "</ul>";
    }
    if (r.rejets && r.rejets.length) {
      h += '<div class="carte-t" style="color:var(--cours-encre)">Écarté · ' + r.rejets.length + "</div>";
      h += '<ul class="ia-rejets">';
      for (i = 0; i < r.rejets.length; i++) h += "<li>" + esc(r.rejets[i]) + "</li>";
      h += "</ul>";
      h += '<p class="moi-note">Ces lignes n\'ont pas été appliquées. L\'appli ne recopie ' +
           "pas une réponse sans la relire.</p>";
    }
    if (!r.rien && (!r.props || !r.props.length) && (!r.rejets || !r.rejets.length)) {
      h += '<p class="cr-p">Rien d\'exploitable dans ce texte.</p>';
    }
    return h + "</div>";
  }

  function iaLireReponse() {
    var p = profilDepuisEtat(), res;
    // Le moteur a besoin d'un profil ACTIF pour valider contre le plan. Sans ce
    // pont, iaLire rejette tout avec « aucun programme actif ».
    try { MOTEUR.__poserProfil(p); } catch (e) {}
    try { res = MOTEUR.iaLire(state.iaTexte || ""); }
    catch (e) { res = { props: [], rejets: ["La lecture a échoué : " + e.message], rien: false }; }
    poser({ iaRes: res });
  }

  function iaCopier() {
    var n = document.getElementById("ia-prompt"), t = n ? n.textContent : "";
    try {
      if (window.navigator && window.navigator.clipboard) {
        window.navigator.clipboard.writeText(t);
      } else {
        // Repli pour les navigateurs sans presse-papier moderne, dont Safari
        // hors contexte securise.
        var ta = document.createElement("textarea");
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      poser({ iaCopie: true });
    } catch (e) {}
  }

  /* -------------------------------------------------------------------------
     NUTRITION — EN CHANTIER
     -------------------------------------------------------------------------
     ON LIVRE EXACTEMENT CE QUE MONTRE LA MAQUETTE, ET RIEN DE PLUS. Aucun
     suivi alimentaire, aucune base d'aliments, aucune jauge de progression :
     une jauge qui se remplit quand on coche un repas mesurerait des coches,
     pas des calories, et l'utilisateur croirait suivre sa cible.
     ------------------------------------------------------------------------- */
  function nutriHtml() {
    var d = deriver(), auj = jourIndexAujourdhui(), i, jr = null, acts = [];
    for (i = 0; i < d.progJours.length; i++) { if (d.progJours[i].ji === auj) jr = d.progJours[i]; }
    if (jr) { for (i = 0; i < jr.acts.length; i++) acts.push(DISC[jr.acts[i].t].t); }

    var p = profilDepuisEtat(), t = MOTEUR.nutritionTargets(p), h = "";

    h += '<p class="nu-tete">' + (acts.length
      ? "Aujourd'hui : " + esc(acts.join(" et "))
      : "Aujourd'hui : repos") + "</p>";

    h += '<section class="carte-sombre"><div class="cs-code">Tes cibles du jour</div>';
    h += '<div class="cs-sur">Ce que tu as réellement mangé n\'est pas encore suivi.</div>';
    h += '<div class="nu-cibles">' +
         '<div class="nu-c"><span class="nu-n num">' + t.prot + " g</span><span>protéines</span></div>" +
         '<div class="nu-c"><span class="nu-n num">' + t.kcal + " kcal</span><span>sur la journée</span></div>" +
         "</div>";
    h += '<p class="cs-txt">Estimées depuis ton poids et ton volume d\'entraînement. ' +
         "Ce sont des repères, pas une prescription.</p></section>";

    h += '<section class="nu-chantier">';
    h += '<div class="nu-ch-tete"><span class="nu-badge">EN CHANTIER</span></div>';
    h += '<div class="carte-t">Les prises</div>';
    // TEXTE COMPLET DE LA MAQUETTE. J'en avais garde la premiere moitie : elle
    // dit que rien n'est mesure, mais pas que les repas affiches SONT un
    // exemple. Sans cette seconde moitie, on les prend pour un plan.
    h += '<p class="cr-p">Cocher un repas ne mesure rien : l\'appli n\'a pas de base ' +
         "d'aliments derrière. Cette partie attend une vraie référence " +
         "nutritionnelle — d'ici là, les repas ci-dessous sont un exemple, pas un suivi.</p>";
    h += '<ul class="nu-repas">';
    for (i = 0; i < REPAS.length; i++) {
      h += '<li class="nu-r"><span class="nu-box" aria-hidden="true"></span>' +
           '<span class="nu-r-t">' + esc(REPAS[i].t || REPAS[i].nom || "") + "</span>" +
           (REPAS[i].h ? '<span class="nu-r-h num">' + esc(REPAS[i].h) + "</span>" : "") + "</li>";
    }
    h += "</ul></section>";

    h += '<div class="carte-t">Tes compléments</div>';
    var pris = 0;
    h += '<ul class="mo-liste">';
    for (i = 0; i < MOTEUR.SUPPS.length; i++) {
      if (!state.obSupps[i]) continue;
      pris++;
      h += '<li><div class="mo-l" style="cursor:default"><span class="mo-n">' +
           esc(MOTEUR.SUPPS[i].label) + "</span>" +
           '<span class="mo-s">' + esc(MOTEUR.SUPPS[i].why) + "</span></div></li>";
    }
    h += "</ul>";
    // L'ETAT VIDE MANQUAIT SA MOITIE UTILE : il constatait l'absence sans dire
    // ou la corriger. Celui de la maquette nomme l'etape a rouvrir.
    if (!pris) {
      h += '<p class="cr-p">Tu n\'as retenu aucun complément au diagnostic. ' +
           "Rien n'est ajouté à ton plan — reviens sur l'étape Habitudes si tu " +
           "changes d'avis.</p>";
    }

    // L'HORIZON MANQUAIT, et c'est le seul bloc qui relie les cibles a une
    // date. Sans lui, l'ecran annonce deux nombres sans dire ou ils menent.
    // Signale par Olivier a l'usage.
    //

    dy = t ? t.clientY - _ty : 0;

    e = state.ecran;
    racine = document.getElementById("app");
    if (!racine) return;

    if (e === "splash") {
      document.body.className = "";
      racine.innerHTML = splashHtml();
      return;
    }

    document.body.className = NAV_CACHEE[e] ? "" : "a-nav";

    if (e === "onb") {
      racine.innerHTML = '<div id="ecran">' + onboardingHtml() + '</div>';
      return;
    }

    // Le mode entrainement et l'enchainement sont des PLEINS ECRANS poses
    // par-dessus : ils ne vivent pas dans la gouttiere commune, et la nav basse
    // n'y a pas sa place. On ne sort que par leurs propres boutons.
    if (e === "salle") { racine.innerHTML = salleHtml(); return; }
    if (e === "trans") { racine.innerHTML = transHtml(); return; }

    if (e === "histo") {
      racine.innerHTML = '<div id="ecran"><h1 class="ecran-titre">Historique</h1>' +
        histoHtml() + "</div>" + navHtml();
      return;
    }
    if (e === "fiche") {
      racine.innerHTML = '<div id="ecran">' + ficheHtml() + "</div>" + navHtml();
      return;
    }
    if (e === "prog") {
      racine.innerHTML = '<div id="ecran"><h1 class="ecran-titre">Progrès</h1>' +
        progHtml() + "</div>" + navHtml();
      return;
    }
    if (e === "ia") {
      racine.innerHTML = '<div id="ecran"><h1 class="ecran-titre-2">Assistant IA</h1>' +
        iaHtml() + "</div>" + navHtml();
      return;
    }
    if (e === "nutri") {
      racine.innerHTML = '<div id="ecran"><h1 class="ecran-titre">Nutrition</h1>' +
        nutriHtml() + "</div>" + navHtml();
      return;
    }
    if (e === "moi") {
      racine.innerHTML = '<div id="ecran"><h1 class="ecran-titre">Moi</h1>' +
        moiHtml() + "</div>" + navHtml();
      return;
    }
    if (e === "profil") {
      racine.innerHTML = '<div id="ecran"><h1 class="ecran-titre-2">Profil</h1>' +
        profilHtml() + "</div>" + navHtml();
      return;
    }
    if (e === "monprog") {
      racine.innerHTML = '<div id="ecran"><h1 class="ecran-titre-2">Mon programme</h1>' +
        monProgHtml() + "</div>" + navHtml();
      return;
    }
    if (e === "exos") {
      racine.innerHTML = '<div id="ecran"><h1 class="ecran-titre-2">Mes exercices</h1>' +
        exosCatalogueHtml() + "</div>" + navHtml();
      return;
    }
    if (e === "theme") {
      racine.innerHTML = '<div id="ecran"><h1 class="ecran-titre-2">Apparence</h1>' +
        themeHtml() + "</div>" + navHtml();
      return;
    }
    if (e === "jour") {
      racine.innerHTML = '<div id="ecran">' + jourHtml() + "</div>" + navHtml();
      return;
    }

    titre = TITRES[e] || "";
    // LE BANDEAU DE VALIDATION. Il est pose ici en attendant l'ecran
    // Historique, a l'etape 5. Il ne remplace PAS la ligne dans la liste : une
    // seance validee doit apparaitre dans l'historique, pas seulement dans un
    // bandeau qu'on ferme et qui emporte la preuve avec lui.
    var bandeau = "";
    if (e === "histo" && state.archive) {
      bandeau = '<div class="bandeau-ok"><span class="bo-t">Séance enregistrée' +
                '<span class="bo-s">' + esc(state.archive) + "</span></span>" +
                '<button type="button" class="bo-x" data-action="fermer-bandeau"' +
                ' aria-label="Fermer">✕</button></div>';
    }

    corps = '<div id="ecran">' +
              '<h1 class="' + (has(PARENT, e) ? "ecran-titre-2" : "ecran-titre") + '">' +
                esc(titre) + '</h1>' +
              bandeau +
              echafaudageHtml() +
            '</div>' +
            (NAV_CACHEE[e] ? "" : navHtml());

    racine.innerHTML = corps;
  }

  // =========================================================================
  // EVENEMENTS
  // -------------------------------------------------------------------------
  // Delegation unique sur le document. Le DOM est reconstruit a chaque rendu :
  // attacher les ecouteurs aux elements les perdrait au rendu suivant, et
  // garder une reference a un noeud detache est le piege classique.
  // =========================================================================
  function cible(ev) {
    var n = ev.target;
    while (n && n !== document) {
      if (n.getAttribute && n.getAttribute("data-action")) return n;
      n = n.parentNode;
    }
    return null;
  }

  function basculerTableau(cle, i) {
    var v = state[cle].slice(), o = {};
    v[i] = v[i] ? 0 : 1;
    o[cle] = v;
    poser(o);
  }

  function borner(v, mini, maxi) {
    return v < mini ? mini : (v > maxi ? maxi : v);
  }

  // `exclus` est indexe par POSITION dans le catalogue. Un objet, pas un
  // tableau : seules les exclusions sont stockees, donc un catalogue qui
  // grandit n'oblige a rien migrer.
  function basculerExclu(i) {
    var maj = {}, k;
    for (k in state.exclus) { if (has(state.exclus, k)) maj[k] = state.exclus[k]; }
    if (maj[i]) delete maj[i]; else maj[i] = 1;
    poser({ exclus: maj });
  }

  function onClick(ev) {
    var n = cible(ev), action, ec, o = {};
    if (!n) return;
    action = n.getAttribute("data-action");
    ec = n.getAttribute("data-ecran");

    // --- Diagnostic ---
    if (action === "ob-next") { obSuivant(); return; }
    if (action === "ob-prev") { obPrecedent(); return; }
    if (action === "ob-aller") {
      poser({ obStep: parseInt(n.getAttribute("data-v"), 10) || 0 });
      window.scrollTo(0, 0); return;
    }
    if (action === "ob-jour") { basculerTableau("obJours", parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "ob-equip") { basculerTableau("obEquip", parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "ob-gear") { basculerTableau("obGear", parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "ob-supp") { basculerTableau("obSupps", parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "ob-single") {
      o[n.getAttribute("data-cle")] = parseInt(n.getAttribute("data-v"), 10);
      poser(o); return;
    }
    if (action === "ob-sexe") { poser({ obSexe: parseInt(n.getAttribute("data-v"), 10) }); return; }
    if (action === "ob-bascule") {
      var c = n.getAttribute("data-cle");
      o[c] = state[c] ? 0 : 1;
      poser(o); return;
    }
    if (action === "ob-halt") {
      poser({ obHalt: borner(state.obHalt + parseInt(n.getAttribute("data-d"), 10), 2, 60) });
      return;
    }
    if (action === "ob-cours-min") {
      var ji = parseInt(n.getAttribute("data-ji"), 10), k = parseInt(n.getAttribute("data-k"), 10);
      var acte = (state.obAct[ji] || [])[k];
      if (acte) majCours(ji, k, "min", borner(acte.min + parseInt(n.getAttribute("data-d"), 10), 15, 180));
      return;
    }
    if (action === "ob-cours-nat") {
      majCours(parseInt(n.getAttribute("data-ji"), 10),
               parseInt(n.getAttribute("data-k"), 10),
               "nat", parseInt(n.getAttribute("data-v"), 10));
      return;
    }

    // --- Aujourd'hui ---
    if (action === "creneau") {
      poser({ slotAuj: parseInt(n.getAttribute("data-i"), 10), coursQuitte: false });
      return;
    }
    if (action === "demarrer-seance") { demarrerSeance(); return; }
    if (action === "autre-seance") {
      poser({ coursQuitte: true, seance: (state.seance + 1) % SEANCES.length });
      return;
    }
    // Choisir NOMMEMENT une seance dans la liste des cinq, au lieu de faire
    // defiler a l'aveugle.
    if (action === "choisir-seance") {
      poser({ coursQuitte: true, seance: parseInt(n.getAttribute("data-i"), 10) || 0 });
      return;
    }
    if (action === "ouvrir-exo") { ouvrirExercice(parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "valider-act") {
      validerActivite(parseInt(n.getAttribute("data-ji"), 10), parseInt(n.getAttribute("data-k"), 10));
      return;
    }
    if (action === "run-lieu") {
      majCours(parseInt(n.getAttribute("data-ji"), 10), parseInt(n.getAttribute("data-k"), 10),
               "lieu", parseInt(n.getAttribute("data-v"), 10));
      poser({ runLieu: parseInt(n.getAttribute("data-v"), 10) });
      return;
    }
    if (action === "pesee-faite") { noterPesee(); return; }
    // « Corriger » rouvre la saisie du jour. Se peser deux fois de suite est
    // banal ; figer la journee obligerait a attendre sept jours pour rectifier
    // un chiffre tape de travers.
    if (action === "pesee-corriger") { poser({ peseeFaite: false }); return; }

    // --- Mode entrainement ---
    if (action === "valider-serie") { validerSerie(); return; }
    // Reprendre la precedente : on pose les deux valeurs, PUIS on valide par le
    // meme chemin que la saisie a la main. Ecrire directement dans `faits`
    // court-circuiterait le passage en repos et la detection de fin
    // d'exercice, et la serie ne compterait pas comme les autres.
    if (action === "reprendre-serie") {
      var fr = faitsOu()[state.tIdx], pr = fr && fr.length ? fr[fr.length - 1] : null;
      if (!pr) return;
      state.kg = pr.kg;
      state.reps = pr.reps;
      validerSerie();
      return;
    }
    if (action === "kg-pas") {
      // Le pas suit l'unite : 2,5 kg sur une barre, 1 minute sur un bloc
      // chronometre. Un pas unique obligerait a taper huit fois pour monter de
      // 20 kg, ou ferait sauter une minute et demie sur un echauffement.
      var exo = exosDe(state.seance)[state.tIdx];
      var pas = (exo && exo.unite === "min") ? 1 : 2.5;
      poser({ kg: Math.max(0, Math.round((state.kg + parseInt(n.getAttribute("data-d"), 10) * pas) * 10) / 10) });
      return;
    }
    if (action === "reps-pas") {
      poser({ reps: Math.max(1, state.reps + parseInt(n.getAttribute("data-d"), 10)) });
      return;
    }
    if (action === "repos-regler") {
      poser({ repos: borner(state.repos + parseInt(n.getAttribute("data-d"), 10), 15, 300) });
      return;
    }
    if (action === "repos-passer") { poser({ phase: "set", repos: 90 }); return; }
    if (action === "aller-trans") { poser({ ecran: "trans", phase: "transition", finiIdx: state.tIdx }); return; }
    if (action === "finir-seance") { poser({ ecran: "salle", phase: "fin" }); return; }
    if (action === "enregistrer-seance") { enregistrerSeance(); return; }
    if (action === "quitter-seance") { quitterSeance(); return; }
    if (action === "fermer-bandeau") { poser({ archive: null }); return; }
    if (action === "mode-chart") { poser({ modeChart: parseInt(n.getAttribute("data-v"), 10) }); return; }

    // --- Branche Moi ---
    if (action === "aller-profil") { aller("profil"); return; }
    if (action === "aller-monprog") { aller("monprog"); return; }
    if (action === "aller-exos") { aller("exos"); return; }
    if (action === "aller-theme") { aller("theme"); return; }
    if (action === "aller-ia") { poser({ iaOnglet: 0, iaCopie: false, ecran: "ia" }); window.scrollTo(0,0); return; }
    if (action === "aller-ia-nutri") { poser({ iaOnglet: 1, iaCopie: false, ecran: "ia" }); window.scrollTo(0,0); return; }
    if (action === "ia-onglet") { poser({ iaOnglet: parseInt(n.getAttribute("data-v"), 10), iaCopie: false }); return; }
    if (action === "ia-copier") { iaCopier(); return; }
    if (action === "ia-lire") { iaLireReponse(); return; }
    if (action === "ob-etape") {
      // Chaque ligne du Profil porte SON etape : on y retourne directement au
      // lieu de rouvrir le diagnostic au debut.
      poser({ ecran: "onb", obStep: parseInt(n.getAttribute("data-v"), 10) || 0, vu: state.vu });
      window.scrollTo(0, 0);
      return;
    }
    if (action === "photo-retirer") { photoRetirer(); return; }
    if (action === "exporter") { exporterJournal(); return; }
    if (action === "recharger-maj") { rechargerMaj(); return; }
    if (action === "reset-demander") { poser({ resetDemande: true }); return; }
    if (action === "reset-annuler") { poser({ resetDemande: false }); return; }
    if (action === "reset-confirmer") { resetConfirmer(); return; }
    if (action === "exclu") { basculerExclu(parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "theme-choisir") { poser({ theme: parseInt(n.getAttribute("data-v"), 10) }); return; }
    if (action === "ajout-ouvrir") {
      var si = n.getAttribute("data-si");
      poser({ ajoutOuvert: state.ajoutOuvert === si ? "" : si });
      return;
    }
    if (action === "exo-retirer") {
      exoRetirer(parseInt(n.getAttribute("data-si"), 10), n.getAttribute("data-nom"));
      return;
    }
    if (action === "exo-ajouter") { exoAjouter(n.getAttribute("data-cle")); return; }
    if (action === "fiche") { poser({ ficheEx: n.getAttribute("data-nom"), ecran: "fiche" }); window.scrollTo(0,0); return; }
    if (action === "fiche-seance") { ouvrirFicheSeance(n.getAttribute("data-d")); return; }

    if (action === "splash-passer") {
      splashSortir();

    } else if (action === "onglet") {
      aller(ec);

    } else if (action === "echaf") {
      if (ec === "__ouvrir") {
        // Le bouton final du diagnostic. `seance` ne doit JAMAIS valoir null :
        // c'est ce qui vidait l'ecran quand le jour courant etait un cours.
        // A l'etape 3 il vaudra siDepart ; ici on garde simplement un entier.
        poser({ vu: true, ecran: "jour", seance: state.seance || 0 });
      } else if (ec === "__onb") {
        poser({ ecran: "onb", obStep: 0 });
      } else if (ec === "__reset") {
        try { window.localStorage.removeItem(CLE); } catch (e) {}
        window.location.reload();
      } else {
        aller(ec);
      }
    }
  }

  // Les champs de saisie du diagnostic. Ils ecrivent SANS redessiner : voir
  // poserSansRendre. Le champ affiche deja ce que l'utilisateur tape, le
  // reconstruire ne servirait qu'a lui reprendre le curseur.
  var CHAMPS_TEXTE = {
    "ob-prenom": "obPrenom", "ob-age": "obAge", "ob-taille": "obTaille",
    "ob-poids": "obPoids", "ob-cible": "obPoidsCible",
    "run-km": "runKm", "run-min": "runMin", "recherche": "recherche",
    "ia-coller": "iaTexte"
  };

  function onSaisie(ev) {
    var n = cible(ev), action, o = {}, ji, k, liste, copie2, kk, acte, p, neuf;
    if (!n) return;
    action = n.getAttribute("data-action");

    if (has(CHAMPS_TEXTE, action)) {
      o[CHAMPS_TEXTE[action]] = n.value;
      poserSansRendre(o);
      return;
    }

    if (action === "ob-cours-nom") {
      ji = parseInt(n.getAttribute("data-ji"), 10);
      k = parseInt(n.getAttribute("data-k"), 10);
      liste = (state.obAct[ji] || []).slice();
      acte = liste[k];
      if (!acte) return;
      neuf = {};
      for (p in acte) { if (has(acte, p)) neuf[p] = acte[p]; }
      neuf.nom = n.value;
      liste[k] = neuf;
      copie2 = {};
      for (kk in state.obAct) { if (has(state.obAct, kk)) copie2[kk] = state.obAct[kk]; }
      copie2[ji] = liste;
      poserSansRendre({ obAct: copie2 });
    }
  }

  // Le changement de discipline, lui, DOIT redessiner : il fait apparaitre ou
  // disparaitre le second creneau et le bloc de reglage du cours.
  function onChangement(ev) {
    var n = cible(ev), action;
    if (!n) return;
    action = n.getAttribute("data-action");

    // Un input file n'emet pas de clic exploitable : c'est « change » qui dit
    // qu'un fichier a ete choisi.
    if (action === "photo-choisir") { photoChoisir(n); return; }
    if (action === "importer") { importerJournal(n); return; }

    if (action !== "ob-slot") return;
    poserSlot(parseInt(n.getAttribute("data-ji"), 10),
              parseInt(n.getAttribute("data-k"), 10),
              n.value);
  }

  // =========================================================================
  // DEMARRAGE
  // =========================================================================
  function demarrer() {
    var sauve, k;

    poserDefauts();

    // La lecture se fait AVANT le premier rendu, sans exception. Rendre puis
    // relire produirait un battement visible et, pire, un ecran construit sur
    // des valeurs par defaut que l'utilisateur n'a jamais choisies.
    sauve = lire();
    if (sauve) {
      for (k in sauve) { if (has(sauve, k)) state[k] = sauve[k]; }
    }
    _dernier = null;

    // `actFaits` est RECALCULE depuis le journal a chaque demarrage. Il decrit
    // la semaine courante ; le laisser tel qu'il a ete sauve afficherait lundi
    // matin les coches de la semaine passee, et le selecteur de creneau
    // annoncerait « fait » sur une seance qui ne l'est pas.
    state.actFaits = faitsSemaine();

    appliqueTheme();

    // LE SERVICE WORKER N'ETAIT ENREGISTRE NULLE PART, et personne ne le
    // demandait : le prompt 1 ne le mentionne pas, aucun autre non plus. Il est
    // pourtant la condition du « hors-ligne d'abord » du README, et sans lui le
    // bouton « Recharger la derniere version » vide un cache qui n'a jamais ete
    // rempli. Trouve a la recette, parcours 12.
    //
    // On enregistre APRES le chargement : le faire pendant retarderait le
    // premier rendu pour un service qui ne sert qu'aux visites suivantes.
    try {
      if (window.navigator && window.navigator.serviceWorker) {
        window.addEventListener("load", function () {
          window.navigator.serviceWorker.register("sw.js")["catch"](function () {
            // Un echec d'enregistrement n'est pas fatal : l'appli marche en
            // ligne. On l'avale plutot que de sortir une erreur que
            // l'utilisateur ne peut pas traiter.
          });
        }, false);
      }
    } catch (e) {}

    armerChrono();

    document.addEventListener("click", onClick, false);
    document.addEventListener("input", onSaisie, false);
    document.addEventListener("change", onChangement, false);
    document.addEventListener("touchstart", tStart, { passive: true });
    document.addEventListener("touchend", tEnd, false);
    window.addEventListener("pagehide", ecrireAvantDeQuitter, false);

    // Le systeme peut changer de theme pendant que l'appli est ouverte.
    try {
      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        if (mq.addEventListener) {
          mq.addEventListener("change", function () { if (state.theme === 2) rendre(); });
        } else if (mq.addListener) {
          mq.addListener(function () { if (state.theme === 2) rendre(); });
        }
      }
    } catch (e) {}

    if (state.vu) {
      // Diagnostic deja fait : pas de splash du tout.
      _splashFini = true;
      state.ecran = "jour";
      rendre();
    } else {
      state.ecran = "splash";
      rendre();
      window.setTimeout(splashSortir, SPLASH_MS);
    }
  }

  // Pilotage depuis les bancs. Sans ces trois portes, un test ne peut ni lire
  // ni forcer l'etat interne, et il ne resterait qu'a tester le DOM rendu.
  window.__lf = {
    version: APP_VERSION,
    lire: function (k) { return state[k]; },
    poser: function (k, v) { state[k] = v; rendre(); },
    etat: function () { return state; },
    defauts: DEFAUTS,
    clesSauvees: CLES_SAUVEES,
    cle: CLE,
    onglets: ONGLETS,
    parent: PARENT,
    figes: FIGES,
    titres: TITRES,
    glisser: glisser,
    aller: aller,
    ecrireMaintenant: ecrireMaintenant,
    // Derivation. Exposee entiere : un banc doit pouvoir verifier la rotation
    // sans passer par le DOM, sinon il mesure le rendu et pas la regle.
    deriver: deriver,
    exosDe: exosDe,
    exosDisponibles: exosDisponibles,
    nbTravail: nbTravail,
    jourIndexAujourdhui: jourIndexAujourdhui,
    jours: JOURS,
    // Le moteur greffe de la v1.21.0. Il reste enferme dans sa propre portee ;
    // cette porte sert aux bancs et au raccordement des ecrans, pas a le
    // publier sur window.
    moteur: MOTEUR
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", demarrer, false);
  } else {
    demarrer();
  }
})();
</script>
</body>
</html>
