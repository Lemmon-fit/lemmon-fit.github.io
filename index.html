      if (arr[i] && arr[i].reps) return arr[i];
    }
    return null;
  }

  // Séances passées où CET exercice a été chargé, de la plus récente à la plus
  // ancienne, TOUS jours de programme confondus.
  //
  // Le filtre par jour de programme qui se trouvait ici rendait la moitié de
  // l'historique invisible. Un même exercice vit souvent dans PLUSIEURS jours du
  // plan — mesuré sur le générateur : 7 exercices chargés en double sur un plan
  // à 6 jours, 2 sur un plan maison à 2 jours, 1 sur un haut/bas à 4 jours. En
  // ne retenant que les séances du premier jour trouvé, le développé couché fait
  // le lundi ET le jeudi n'était analysé que sur ses lundis : 5 séances
  // enregistrées, 3 vues. Un exercice plat le lundi et en progrès le jeudi
  // recevait donc un verdict tiré d'une moitié de ses données.
  //
  // Même leçon que pour sessionTonnage en v1.3.0 : on rassemble par IDENTITÉ
  // d'exercice, jamais par appartenance à un jour du programme. Une séance libre
  // du samedi où l'on a poussé de la fonte compte, elle aussi.
  function seancesDe(exId, depuisKey) {
    var out = [], cursor = addDays(dateFromKey(depuisKey), 0), i, k, e, arr;
    for (i = 0; i < LOOKBACK_DAYS && out.length < ANA_PROFONDEUR; i++) {
      k = fmt(cursor);
      e = state.log[k];
      if (e) {
        arr = setsOf(e, exId);
        if (arr.length) out.push({ date: k, sets: arr });
      }
      cursor = addDays(cursor, -1);
    }
    return out;
  }

  // Incrément de charge : 5 % arrondi au cran réaliste de la salle.
  function incrementCharge(kg, pat) {
    var cran = ANA_BAS[pat] ? 2.5 : 1;
    var brut = kg * 0.05;
    if (brut < cran) brut = cran;
    return Math.round(brut / cran) * cran;
  }

  function analyseExercice(ex, aujourdhui) {
    var pat = CAT_BY_ID[ex.id] ? CAT_BY_ID[ex.id].pat : "";
    var seances = seancesDe(ex.id, aujourdhui);
    var res = { id: ex.id, nom: ex.name, seances: seances.length, etat: "ok", texte: "", proposition: null };
    if (seances.length < ANA_MIN_SEANCES) {
      res.etat = "jeune";
      res.texte = seances.length + " séance" + (seances.length > 1 ? "s" : "") + " enregistrée" +
                  (seances.length > 1 ? "s" : "") + ", il en faut " + ANA_MIN_SEANCES + ".";
      return res;
    }

    // Décision déjà prise sur cet exercice, et aucune séance depuis. Sans cette
    // garde, appliquer « monte à 105 kg » ne changeant pas l'historique qui a
    // motivé le conseil, la règle se redéclencherait au rendu suivant et
    // l'appli redemanderait la même chose en boucle.
    if (ex.decideLe && seances[0].date <= ex.decideLe) {
      res.etat = "decide";
      res.texte = "Ajusté le " + shortDate(ex.decideLe) + ". En attente de ta prochaine séance.";
      return res;
    }

    var d0 = derniereSerie(seances[0].sets), d1 = derniereSerie(seances[1].sets);
    var kgRef = d0 && d0.kg ? d0.kg : null;

    // ORDRE D'ÉVALUATION. Les règles de charge passent AVANT « écourté », et ce
    // n'est pas un détail : mise en tête, la règle des séances écourtées avalait
    // tous les autres diagnostics. Quelqu'un qui fait 3 séries là où le
    // programme en prescrit 4 se retrouvait étiqueté « écourté » à chaque
    // analyse et ne recevait jamais le conseil de charge dont il avait besoin.
    // Les règles de charge lisent la DERNIÈRE série renseignée, donc une séance
    // qui s'effondre ne les déclenche pas : il n'y a pas de conflit entre elles.

    // --- Règle des 2-pour-2 : prêt à monter ---------------------------------
    if (d0 && d1 && d0.reps >= ex.repsHi + 2 && d1.reps >= ex.repsHi + 2 && kgRef) {
      var plus = incrementCharge(kgRef, pat);
      res.etat = "monter";
      res.texte = "Cible dépassée de deux répétitions ou plus sur tes deux dernières séances (" +
                  d1.reps + " puis " + d0.reps + " pour " + ex.repsHi + " visées).";
      res.proposition = { type: "charge", ex: ex.id, kg: kgRef + plus,
        texte: "Viser " + frDec(String(kgRef + plus)) + " kg sur " + ex.name,
        raison: "Règle des 2-pour-2 : deux répétitions au-dessus de la cible, deux fois de suite." };
      return res;
    }

    // --- Sous la fourchette : trop lourd ------------------------------------
    if (d0 && d1 && d0.reps < ex.repsLo && d1.reps < ex.repsLo && kgRef) {
      var moins = incrementCharge(kgRef, pat);
      res.etat = "baisser";
      res.texte = "Sous le bas de la fourchette sur tes deux dernières séances (" +
                  d1.reps + " puis " + d0.reps + " pour " + ex.repsLo + " minimum).";
      res.proposition = { type: "charge", ex: ex.id, kg: Math.max(MIN_KG, kgRef - moins),
        texte: "Redescendre à " + frDec(String(Math.max(MIN_KG, kgRef - moins))) + " kg sur " + ex.name,
        raison: "La charge t'empêche d'atteindre la fourchette prescrite." };
      return res;
    }

    // --- Échec : les répétitions s'effondrent dans la séance -----------------
    var reps = [], ri;
    for (ri = 0; ri < seances[0].sets.length; ri++) {
      if (seances[0].sets[ri] && seances[0].sets[ri].reps) reps.push(seances[0].sets[ri].reps);
    }
    if (reps.length >= 3 && reps[0] - reps[reps.length - 1] >= 3) {
      res.etat = "echec";
      res.texte = "Tes répétitions s'effondrent en cours de série (" + reps.join(", ") +
                  ") : tu finis à l'échec.";
      res.proposition = { type: "repos", ex: ex.id, rest: Math.min(180, (ex.rest || 60) + 30),
        texte: "Allonger le repos de " + ex.name + " à " + fmtRest(Math.min(180, (ex.rest || 60) + 30)),
        raison: "Finir à l'échec dès la deuxième série coûte plus qu'il ne rapporte." };
      return res;
    }

    // --- Écourté : nettement moins de séries que prescrit, trois fois --------
    // Seuil à DEUX séries manquantes, pas une. À une série près, on signalait
    // une préférence de volume comme si c'était un problème, à chaque analyse.
    // Et trois séances, parce qu'une séance courte peut venir d'un manque de
    // temps ou d'une machine occupée : les données ne distinguent pas les causes.
    var manque = Math.max(2, Math.ceil(ex.sets / 2));
    var ecourte = 0, si;
    for (si = 0; si < 3 && si < seances.length; si++) {
      if (ex.sets - seances[si].sets.length >= manque) ecourte++;
    }
    if (ecourte >= 3) {
      res.etat = "ecourte";
      res.texte = "Arrêté nettement avant la fin sur tes trois dernières séances (" +
                  seances[0].sets.length + " séries sur " + ex.sets + " prescrites).";
      res.proposition = { type: "volume", ex: ex.id, delta: -1,
        texte: "Passer " + ex.name + " à " + (ex.sets - 1) + " séries",
        raison: "Trois séances de suite nettement écourtées. Mieux vaut un volume que tu finis." };
      return res;
    }

    // --- Stagnation du 1RM estimé -------------------------------------------
    var maxs = [], mi2;
    for (mi2 = 0; mi2 < Math.min(3, seances.length); mi2++) {
      var ds = derniereSerie(seances[mi2].sets);
      maxs.push(ds && ds.kg && ds.reps ? epley(ds.kg, ds.reps) : 0);
    }
    if (maxs.length === 3 && maxs[0] > 0 && maxs[0] <= maxs[2] * 1.01) {
      res.etat = "stagnation";
      res.texte = "Aucun progrès sur tes trois dernières séances, à charge et répétitions égales.";
      var remplacant = analyseRemplacant(ex, pat);
      if (remplacant) {
        res.proposition = { type: "remplacer", ex: ex.id, par: remplacant.id,
          texte: "Remplacer " + ex.name + " par " + remplacant.name,
          raison: "Stagnation depuis trois séances. Changer d'angle relance souvent la progression." };
      }
      return res;
    }

    res.texte = "Progression normale.";
    return res;
  }

  // TOUS les remplaçants légaux, du meilleur au moins bon.
  //
  // Cette fonction EST le mandat de remplacement, écrit une seule fois : même
  // pattern de mouvement, faisable avec le matériel déclaré, non refusé au
  // diagnostic, absent du programme. Rester dans le pattern est ce qui garantit
  // que la séance reste équilibrée : une poussée horizontale en remplace une
  // autre, jamais un tirage.
  //
  // Le pont IA s'appuie sur cette même liste, pour proposer ET pour valider. Un
  // second filtre écrit à côté aurait fini par diverger de celui-ci, et c'est
  // précisément le filtre qui empêche un modèle de langage de remplacer un
  // soulevé de terre par des mollets.
  function analyseCandidats(ex, pat) {
    if (!profile || !pat) return [];
    var avail = { bw: true }, i;
    for (i = 0; i < profile.equipment.length; i++) avail[profile.equipment[i]] = true;
    if (avail.mach) { for (i = 0; i < GYM_IMPLIES.length; i++) avail[GYM_IMPLIES[i]] = true; }
    var exclus = {}, noGear = {};
    for (i = 0; i < profile.excluded.length; i++) exclus[profile.excluded[i]] = true;
    for (i = 0; i < (profile.noGear || []).length; i++) noGear[profile.noGear[i]] = true;
    // Déjà présents dans le programme, tous jours confondus : on ne propose pas
    // un exercice que l'utilisateur fait déjà ailleurs dans sa semaine.
    var deja = {}, pk, j;
    for (pk in PROGRAM) {
      if (!has(PROGRAM, pk)) continue;
      for (j = 0; j < PROGRAM[pk].exercises.length; j++) deja[PROGRAM[pk].exercises[j].id] = true;
    }
    var cands = [], c, k2, ok;
    for (i = 0; i < CATALOG.length; i++) {
      c = CATALOG[i];
      if (c.pat !== pat || c.id === ex.id) continue;
      if (exclus[c.id] || deja[c.id]) continue;
      if (c.gear && noGear[c.gear]) continue;
      ok = true;
      for (k2 = 0; k2 < c.equip.length; k2++) { if (!avail[c.equip[k2]]) ok = false; }
      if (ok) cands.push(c);
    }
    // Le classement du catalogue dit « le meilleur disponible », pas « le
    // meilleur remplaçant ». Pour quelqu'un qui a du matériel, il faisait
    // remonter les variantes au poids de corps dès qu'elles étaient bien
    // classées : proposer une chaise contre le mur à la place d'une extension
    // quadriceps, dans une salle équipée, c'est une régression déguisée en
    // conseil. On relègue donc le poids de corps quand il y a mieux sous la main.
    var aDuMateriel = profile.equipment.length > 0;
    cands.sort(function (a, b) {
      if (aDuMateriel) {
        var abw = (a.equip.length === 1 && a.equip[0] === "bw") ? 1 : 0;
        var bbw = (b.equip.length === 1 && b.equip[0] === "bw") ? 1 : 0;
        if (abw !== bbw) return abw - bbw;
      }
      return a.rank - b.rank;
    });
    return cands;
  }

  // Le meilleur remplaçant, ou rien.
  //
  // Rétrograder le poids de corps ne suffit pas s'il est le SEUL candidat : il
  // sort quand même. Pour quelqu'un qui a une salle, se voir proposer une chaise
  // contre le mur à la place d'une extension quadriceps n'est pas un conseil,
  // c'est un recul. Dans ce cas on ne propose rien : le constat de stagnation
  // reste affiché, sans suggestion douteuse pour meubler.
  function analyseRemplacant(ex, pat) {
    var cands = analyseCandidats(ex, pat);
    if (!cands.length) return null;
    var choisi = cands[0];
    var aDuMateriel = profile.equipment.length > 0;
    var choisiBw = (choisi.equip.length === 1 && choisi.equip[0] === "bw");
    if (aDuMateriel && choisiBw) return null;
    return choisi;
  }

  // Constat global : assiduité, ancienneté de la dernière décharge, rythme de
  // perte de poids par rapport à ce qui était visé.
  function analyseGlobale(aujourdhui) {
    var g = { seances: 0, semaines: 0, decharge: null, poids: null };
    var k, e, premiere = null;
    for (k in state.log) {
      if (!has(state.log, k)) continue;
      e = state.log[k];
      if (e && e.done) { g.seances++; if (!premiere || k < premiere) premiere = k; }
    }
    if (premiere) {
      g.semaines = Math.floor((dateFromKey(aujourdhui) - dateFromKey(premiere)) / (7 * 86400000));
    }
    var derniere = (profile && profile.dechargeLe) ? profile.dechargeLe : premiere;
    if (derniere) {
      var sem = Math.floor((dateFromKey(aujourdhui) - dateFromKey(derniere)) / (7 * 86400000));
      if (sem >= ANA_SEMAINES_DECHARGE) g.decharge = sem;
    }
    return g;
  }

  // Analyse complète du programme actif.
  function analyser() {
    var aujourdhui = todayKey();
    var out = { exercices: [], propositions: [], globale: analyseGlobale(aujourdhui),
                exploitables: 0, jeunes: 0 };
    if (!profile || !profile.plan) return out;
    var pk, i, ex, r, vus = {};
    for (pk in PROGRAM) {
      if (!has(PROGRAM, pk)) continue;
      for (i = 0; i < PROGRAM[pk].exercises.length; i++) {
        ex = PROGRAM[pk].exercises[i];
        if (ex.track !== "load" || vus[ex.id]) continue;
        vus[ex.id] = true;
        r = analyseExercice(ex, aujourdhui);
        r.jour = parseInt(pk, 10);
        out.exercices.push(r);
        if (r.etat === "jeune") out.jeunes++; else out.exploitables++;
        if (r.proposition) {
          // Le jour voyage avec la proposition : sans lui, l'application ne
          // saurait pas dans quelle séance retrouver l'exercice à modifier.
          r.proposition.jour = parseInt(pk, 10);
          out.propositions.push(r.proposition);
        }
      }
    }
    // La décharge est un CONSEIL, pas un changement applique : elle demanderait
    // de retenir un etat temporaire sur une semaine, et sa preuve experimentale
    // est de toute facon mince et contestee.
    if (out.globale.decharge) {
      out.propositions.push({ type: "conseil",
        texte: "Semaine de décharge",
        raison: out.globale.decharge + " semaines sans allègement. Réduis d'une série et de " +
                "20 % tes charges pendant une semaine, puis reprends où tu en étais." });
    }
    return out;
  }


  // ===========================================================================
  // APPLICATION D'UNE PROPOSITION
  // ---------------------------------------------------------------------------
  // Le mandat est volontairement borné : volumes, charges, repos, et
  // remplacement d'un exercice par un autre du MÊME pattern de mouvement. Ni les
  // jours, ni la découpe, ni la discipline ne bougent — sans quoi l'historique
  // se fragmenterait en programmes successifs incomparables.
  //
  // Chaque décision, appliquée OU refusée, marque l'exercice à la date du jour.
  // Sans cette marque, la règle se redéclencherait au rendu suivant : appliquer
  // « monte à 105 kg » ne change pas l'historique qui a motivé le conseil, et
  // l'appli redemanderait la même chose en boucle jusqu'à la séance suivante.
  // ===========================================================================
  function planExercice(jour, exId) {
    if (!PROGRAM[jour]) return null;
    var i, ex = PROGRAM[jour].exercises;
    for (i = 0; i < ex.length; i++) { if (ex[i].id === exId) return { liste: ex, rang: i }; }
    return null;
  }

  // TOUTES les places du plan où cet exercice apparaît, et pas seulement celle
  // du jour porté par la proposition.
  //
  // Un exercice chargé vit souvent dans plusieurs jours : mesuré sur le
  // générateur, 7 doublons sur un plan à 6 jours. En n'écrivant que dans le
  // premier, « viser 84 kg au développé couché » laissait le jeudi à l'ancienne
  // charge — et sans marque de décision, donc la règle se redéclenchait
  // indéfiniment depuis l'autre jour. Une charge cible est une propriété de
  // l'exercice, pas du jour de la semaine où on le fait.
  function planExercices(exId) {
    var out = [], pk, i, ex;
    for (pk in PROGRAM) {
      if (!has(PROGRAM, pk)) continue;
      ex = PROGRAM[pk].exercises;
      for (i = 0; i < ex.length; i++) {
        if (ex[i].id === exId) out.push({ liste: ex, rang: i, jour: parseInt(pk, 10) });
      }
    }
    return out;
  }

  function journaliser(texte) {
    if (!profile.journal) profile.journal = [];
    profile.journal.push({ date: todayKey(), texte: String(texte).slice(0, 120) });
    if (profile.journal.length > 40) profile.journal = profile.journal.slice(-40);
  }

  function appliquerProposition(p, applique) {
    if (!profile || !profile.plan || !p) return false;
    var places = (p.ex !== undefined) ? planExercices(p.ex) : [];
    var i, neuf = null;

    // Le remplaçant se valide AVANT d'écrire quoi que ce soit. Résolu au fil de
    // la boucle, un identifiant inconnu laissait le plan à moitié modifié : le
    // lundi remplacé, le jeudi non.
    if (applique && p.type === "remplacer") {
      neuf = CAT_BY_ID[p.par];
      if (!neuf) return false;
    }

    if (applique && places.length) {
      for (i = 0; i < places.length; i++) {
        var cible = places[i], e = cible.liste[cible.rang];
        if (p.type === "charge") {
          e.kgCible = p.kg;
        } else if (p.type === "volume") {
          // Un DELTA, pas une valeur absolue : deux jours peuvent prescrire des
          // volumes différents pour le même exercice, et l'intention « une série
          // de moins » se transpose, un « passe à 3 » non.
          e.sets = Math.max(1, Math.min(MAX_SETS, e.sets + p.delta));
          e.detail = detailFromPlan(e);
        } else if (p.type === "repos") {
          e.rest = p.rest;
          e.detail = detailFromPlan(e);
        } else if (p.type === "remplacer") {
          var b = repsBounds(neuf.reps);
          // On garde la POSITION dans la séance : un polyarticulaire ne se
          // retrouve pas relégué en fin de séance parce qu'il a changé de nom.
          cible.liste[cible.rang] = {
            id: neuf.id, name: neuf.name, sets: neuf.sets || e.sets,
            load: true, track: "load", rest: neuf.rest || 60,
            repsLo: b.lo, repsHi: b.hi, decideLe: todayKey()
          };
          cible.liste[cible.rang].detail = detailFromPlan(cible.liste[cible.rang]);
        }
      }
      journaliser(p.texte);
    }

    // Marquer la décision, appliquée ou non, à CHAQUE place. Un refus est une
    // décision : on ne reposera pas la question tant qu'aucune séance nouvelle
    // n'est venue. Une seule place marquée laissait la règle repartir depuis
    // l'autre jour au rendu suivant.
    for (i = 0; i < places.length; i++) {
      places[i].liste[places[i].rang].decideLe = todayKey();
    }
    if (p.type === "conseil") profile.dechargeLe = todayKey();

    profile.plan = PROGRAM;
    persistSettings();
    return true;
  }

  // ===========================================================================
  // CARTE ANALYSE
  // ===========================================================================
  var ETATS = {
    monter:     { pastille: "▲", cls: "ana-up",   mot: "Prêt à monter" },
    baisser:    { pastille: "▼", cls: "ana-down", mot: "Trop lourd" },
    echec:      { pastille: "!", cls: "ana-warn", mot: "À l'échec" },
    ecourte:    { pastille: "!", cls: "ana-warn", mot: "Écourté" },
    stagnation: { pastille: "=", cls: "ana-flat", mot: "Stagnation" },
    ok:         { pastille: "✓", cls: "ana-ok",   mot: "Progression" },
    jeune:      { pastille: "·", cls: "ana-wait", mot: "En attente" },
    decide:     { pastille: "·", cls: "ana-wait", mot: "Ajusté" }
  };

  function analyseHtml() {
    if (!profile || !profile.done || !profile.plan) return "";

    var entete =
      '<div class="card-title">📊 Analyse de tes séances</div>' +
      '<button type="button" class="detail-toggle" data-action="toggle-analyse" aria-expanded="' +
        (state.showAnalyse ? "true" : "false") + '">' +
        (state.showAnalyse ? "Masquer l\'analyse" : "Analyser mes séances") +
        (state.showAnalyse ? " ▲" : " ▼") + '</button>';

    if (!state.showAnalyse) {
      return '<section class="card">' + entete + '</section>';
    }

    var a = analyser();
    var corps = "";

    if (!a.exploitables) {
      // Exactement ce que demandait le cahier des charges : pas de verdict tant
      // qu'il n'y a pas de quoi en tirer un.
      var manque = ANA_MIN_SEANCES;
      corps =
        '<div class="ob-note">Pas encore de quoi conclure. Il faut au moins <b>' + manque +
        ' séances par exercice</b> pour qu\'une tendance veuille dire quelque chose. ' +
        'Reviens quand tu en auras fait quelques-unes de plus.</div>';
      return '<section class="card">' + entete + corps + '</section>';
    }

    // --- Propositions ---------------------------------------------------------
    if (a.propositions.length) {
      var props = "", pi;
      for (pi = 0; pi < a.propositions.length; pi++) {
        var p = a.propositions[pi];
        props +=
          '<div class="ana-prop">' +
            '<div class="ana-prop-texte">' + esc(p.texte) + '</div>' +
            '<div class="ana-prop-raison">' + esc(p.raison) + '</div>' +
            (p.type === "conseil"
              ? '<div class="ana-prop-actes">' +
                  '<button type="button" class="ana-ok-btn" data-action="ana-vu" data-i="' + pi + '">Compris</button>' +
                '</div>'
              : '<div class="ana-prop-actes">' +
                  '<button type="button" class="ana-ok-btn" data-action="ana-appliquer" data-i="' + pi + '">Appliquer</button>' +
                  '<button type="button" class="ana-non-btn" data-action="ana-ignorer" data-i="' + pi + '">Ignorer</button>' +
                '</div>') +
          '</div>';
      }
      corps +=
        '<div class="ana-bloc">' +
          '<div class="field-label">' + a.propositions.length + ' proposition' +
            (a.propositions.length > 1 ? "s" : "") + '</div>' + props +
        '</div>';
    } else {
      corps += '<div class="ob-note">Rien à changer pour l\'instant. Continue comme ça.</div>';
    }

    // --- Constat par exercice -------------------------------------------------
    var lignes = "", ei;
    for (ei = 0; ei < a.exercices.length; ei++) {
      var x = a.exercices[ei];
      var et = ETATS[x.etat] || ETATS.ok;
      lignes +=
        '<div class="ana-ligne">' +
          '<span class="ana-pastille ' + et.cls + '" aria-hidden="true">' + et.pastille + '</span>' +
          '<span class="ana-ligne-texte">' +
            '<b>' + esc(x.nom) + '</b>' +
            '<span>' + esc(x.texte) + '</span>' +
          '</span>' +
        '</div>';
    }
    corps +=
      '<div class="ana-bloc">' +
        '<div class="field-label">Exercice par exercice</div>' + lignes +
      '</div>';

    // --- Honnêteté sur les seuils ---------------------------------------------
    corps +=
      '<div class="nutri-disclaimer">' +
        'Les règles de charge suivent la règle des 2-pour-2 et la position de l\'ACSM. ' +
        'En revanche <b>aucune définition validée du plateau n\'existe</b> : le seuil de ' +
        'stagnation utilisé ici est une convention, pas un résultat de recherche. ' +
        'Ces propositions ne remplacent pas l\'œil d\'un coach.' +
      '</div>';

    // --- Pont vers une IA -----------------------------------------------------
    // Place APRES le constat déterministe, et ce n'est pas un détail de mise en
    // page : ce qui se calcule hors ligne se lit d'abord, l'avis extérieur
    // vient en complément. L'inverse ferait passer le moteur pour un lot de
    // consolation.
    corps += iaHtml();

    // --- Journal des ajustements ----------------------------------------------
    if (profile.journal && profile.journal.length) {
      var jl = "", ji, jrn = profile.journal.slice(-6).reverse();
      for (ji = 0; ji < jrn.length; ji++) {
        jl += '<div class="ana-jrn"><span>' + esc(shortDate(jrn[ji].date)) + '</span>' +
              esc(jrn[ji].texte) + '</div>';
      }
      corps += '<div class="ana-bloc"><div class="field-label">Derniers ajustements</div>' + jl + '</div>';
    }

    return '<section class="card">' + entete + corps + '</section>';
  }


  // ===========================================================================
  // PONT PRESSE-PAPIER VERS UNE IA
  // ---------------------------------------------------------------------------
  // Pourquoi un presse-papier et pas une connexion. Se brancher sur le compte IA
  // grand public déjà installé sur le téléphone est IMPOSSIBLE : chez les cinq
  // fournisseurs, l'abonnement et l'API sont deux produits à facturation
  // étanche, « Sign in with ChatGPT » ne rend que l'identité, et Anthropic
  // interdit explicitement l'usage tiers d'un jeton consommateur. Le
  // presse-papier n'est donc pas un pis-aller en attendant mieux : c'est le seul
  // chemin qui marche sans rien demander à personne, et il marche hors ligne
  // jusqu'au moment du collage.
  //
  // LE TEXTE QUI PART EST MONTRÉ. Ces données quittent l'appli pour un service
  // tiers ; les afficher avant l'envoi n'est pas une politesse, c'est la seule
  // façon de décider en connaissance de cause.
  //
  // LA RÉPONSE EST TRAITÉE COMME HOSTILE. Un modèle de langage se trompe, invente
  // des identifiants, et le texte collé peut ne pas venir de lui du tout. Rien
  // n'est appliqué sur sa parole : chaque ligne est revalidée contre le mandat
  // par iaLire(), et ce qui ne passe pas est compté et montré, jamais avalé en
  // silence. Le mandat n'est pas dans le prompt — un prompt se contourne — il est
  // dans le validateur.
  // ===========================================================================

  // Un modèle ne peut pas dépasser ce ratio sur une charge. Le moteur
  // déterministe monte de 5 % ; on laisse de la marge à un avis extérieur, mais
  // pas au point qu'une hallucination pose 300 kg sur une extension quadriceps.
  var IA_RATIO_MAX = 1.2;
  var IA_RATIO_MIN = 0.6;
  var IA_MAX_PROPS = 12;         // au-delà, ce n'est plus un conseil, c'est un déluge
  var IA_MAX_RAISON = 160;
  var IA_SEP = "|";

  // Plafond de HAUSSES de charge par salve.
  //
  // Le ratio de 1,2 borne chaque proposition prise séparément, pas la
  // trajectoire : douze hausses à +19 % acceptées chaque semaine doublent les
  // charges en un mois, et chaque pas aura paru raisonnable. C'est le seul
  // garde-fou de ce fichier dont l'enjeu est le corps et non les données —
  // d'où un plafond franchement bas.
  var IA_MAX_HAUSSES = 4;

  // --- Ce que l'appli sait dire d'elle-même ---------------------------------
  function iaMaterielTexte() {
    var out = [], i;
    for (i = 0; i < EQUIP_OPTIONS.length; i++) {
      if (profile.equipment.indexOf(EQUIP_OPTIONS[i].v) >= 0) out.push(EQUIP_OPTIONS[i].label);
    }
    if (!out.length) out.push("Poids de corps uniquement");
    var txt = out.join(", ");
    if (profile.noGear && profile.noGear.length) {
      var abs = [], k, g;
      for (k = 0; k < profile.noGear.length; k++) {
        for (g = 0; g < GEAR_OPTIONS.length; g++) {
          if (GEAR_OPTIONS[g].v === profile.noGear[k]) abs.push(GEAR_OPTIONS[g].label);
        }
      }
      if (abs.length) txt += " (machines absentes : " + abs.join(", ") + ")";
    }
    return txt;
  }

  // Charge de référence d'un exercice : la cible posée si elle existe, sinon la
  // dernière charge réellement soulevée. Sans référence, une proposition de
  // charge n'est pas validable et sera refusée.
  function iaChargeRef(ex, seances) {
    if (ex.kgCible) return ex.kgCible;
    var i, d;
    for (i = 0; i < seances.length; i++) {
      d = derniereSerie(seances[i].sets);
      if (d && d.kg) return d.kg;
    }
    return null;
  }

  // Tous les exercices chargés du plan, dédoublonnés, avec leur historique.
  // Dédoublonnés parce qu'un même exercice vit souvent dans plusieurs jours :
  // l'envoyer deux fois inviterait le modèle à proposer deux charges différentes
  // pour le même mouvement.
  function iaExercices() {
    var out = [], vus = {}, pk, i, ex;
    for (pk in PROGRAM) {
      if (!has(PROGRAM, pk)) continue;
      for (i = 0; i < PROGRAM[pk].exercises.length; i++) {
        ex = PROGRAM[pk].exercises[i];
        if (ex.track !== "load" || vus[ex.id]) continue;
        vus[ex.id] = true;
        out.push({ ex: ex, seances: seancesDe(ex.id, todayKey()) });
      }
    }
    return out;
  }

  function iaPrompt() {
    if (!profile || !profile.plan) return "";
    var L = [], tous = iaExercices(), liste = [], i, j;

    // Seuls les exercices AVEC historique partent. Un exercice jamais fait
    // n'apprend rien au modèle et gonfle le texte : sur un programme de cinq
    // jours à peine commencé, vingt lignes sur vingt-cinq disaient « aucune
    // séance enregistrée ». Le texte doit rester collable dans une application
    // mobile, et chaque ligne inutile dilue les vraies données.
    for (i = 0; i < tous.length; i++) {
      if (tous[i].seances.length) liste.push(tous[i]);
    }

    L.push("Tu es coach de musculation. Voici mes donnees d'entrainement reelles.");
    L.push("Propose-moi des ajustements de programme, en respectant strictement le");
    L.push("cadre et le format decrits plus bas.");
    L.push("");

    L.push("== MON PROFIL ==");
    L.push((profile.sex === "f" ? "Femme" : "Homme") + ", " + frDec(profile.startWeight) +
           " kg, objectif " + frDec(profile.targetWeight) + " kg.");
    L.push(profile.days.length + " seances par semaine, " + profile.minutes + " min par seance.");
    L.push("Materiel : " + iaMaterielTexte() + ".");
    L.push("");

    L.push("== MES EXERCICES ==");
    L.push("Format : Nom [identifiant] - series x fourchette de repetitions - repos - charge visee");
    L.push("puis mes dernieres seances, de la plus recente a la plus ancienne.");
    L.push("");
    if (!liste.length) {
      L.push("(aucune seance avec charge enregistree pour l'instant)");
    }
    for (i = 0; i < liste.length; i++) {
      var e = liste[i].ex, ss = liste[i].seances;
      var ref = iaChargeRef(e, ss);
      L.push("- " + e.name + " [" + e.id + "] - " + e.sets + " x " + e.repsLo + "-" + e.repsHi +
             " reps - repos " + (e.rest || 60) + "s" +
             (ref ? " - charge actuelle " + frDec(String(ref)) + " kg" : " - charge inconnue"));
      for (j = 0; j < ss.length; j++) {
        var series = [], k, s;
        for (k = 0; k < ss[j].sets.length; k++) {
          s = ss[j].sets[k];
          if (!s) { continue; }
          if (s.kg && s.reps) series.push(frDec(String(s.kg)) + "kg x " + s.reps);
          else if (s.reps) series.push(s.reps + " reps");
          else series.push("serie faite");
        }
        L.push("    " + shortDate(ss[j].date) + " : " + (series.length ? series.join(", ") : "rien de note"));
      }
    }
    L.push("");

    // Les remplacements LEGAUX sont donnes d'avance. Laisser le modele choisir
    // librement dans un catalogue qu'il ne connait pas produirait des
    // identifiants inventes, refuses ensuite un par un. Autant lui donner la
    // liste : ce qu'il propose a alors une chance d'etre applicable.
    L.push("== REMPLACEMENTS AUTORISES ==");
    L.push("Uniquement ceux-ci : meme pattern de mouvement, faisables avec mon materiel.");
    var auMoinsUn = false;
    for (i = 0; i < liste.length; i++) {
      var ex2 = liste[i].ex;
      var pat = CAT_BY_ID[ex2.id] ? CAT_BY_ID[ex2.id].pat : "";
      var cands = analyseCandidats(ex2, pat), noms = [];
      for (j = 0; j < cands.length && j < 5; j++) noms.push(cands[j].id);
      if (noms.length) {
        auMoinsUn = true;
        L.push("- a la place de " + ex2.id + " : " + noms.join(", "));
      }
    }
    if (!auMoinsUn) L.push("(aucun remplacement possible avec le materiel declare)");
    L.push("");

    L.push("== CE QUE TU AS LE DROIT DE CHANGER ==");
    L.push("La charge visee, le nombre de series, le temps de repos, et le remplacement");
    L.push("d'un exercice par un autre de la liste ci-dessus. RIEN D'AUTRE : ni mes jours,");
    L.push("ni la structure de mes seances, ni ma nutrition, ni ma facon de m'entrainer.");
    L.push("Une hausse de charge ne depasse pas 20 % de la charge actuelle.");
    L.push("");

    L.push("== FORMAT DE REPONSE ==");
    L.push("Une ligne par proposition, exactement dans cette forme, separateur barre verticale :");
    L.push("CHARGE" + IA_SEP + "identifiant" + IA_SEP + "kilos" + IA_SEP + "raison courte");
    L.push("VOLUME" + IA_SEP + "identifiant" + IA_SEP + "+1 ou -1" + IA_SEP + "raison courte");
    L.push("REPOS" + IA_SEP + "identifiant" + IA_SEP + "secondes" + IA_SEP + "raison courte");
    L.push("REMPLACER" + IA_SEP + "identifiant" + IA_SEP + "identifiant de remplacement" + IA_SEP + "raison courte");
    L.push("");
    L.push("Exemple :");
    L.push("CHARGE" + IA_SEP + "leg-press" + IA_SEP + "105" + IA_SEP + "Tu depasses la cible depuis deux seances.");
    L.push("");
    L.push("N'invente aucun identifiant : reprends exactement ceux entre crochets.");
    L.push("Douze propositions au maximum. Si rien ne doit changer, ecris RIEN.");

    return L.join("\n");
  }

  // ===========================================================================
  // LECTURE DE LA REPONSE
  // ---------------------------------------------------------------------------
  // Le texte colle est une entree hostile, au meme titre qu'un fichier importe.
  // On ne cherche pas a comprendre la prose autour : on balaie les lignes, on
  // garde celles qui ont la forme attendue, et chacune doit ensuite franchir le
  // mandat. Ce qui echoue est COMPTE et MONTRE — un rejet silencieux laisserait
  // croire que le modele n'a rien propose.
  // ===========================================================================
  function iaNettoieRaison(s) {
    // Le texte du modele finira dans du HTML : il passera par esc() a
    // l'affichage, mais on le borne des maintenant, et on retire les retours a
    // la ligne qui casseraient la mise en page.
    //
    // Les adresses web sont retirees : une raison d'ajustement d'entrainement
    // n'a aucun motif d'en contenir, et ce champ est le seul texte libre venu
    // de l'exterieur qu'on affiche. Fermer ce canal coute une ligne.
    return String(s || "").replace(/[\r\n\t]+/g, " ")
             .replace(/\b(?:https?:\/\/|www\.)\S+/gi, "[lien retiré]")
             .replace(/\s+/g, " ")
             .replace(/^\s+|\s+$/g, "").slice(0, IA_MAX_RAISON);
  }

  // L'exercice doit etre dans le plan ET porter une charge. Un identifiant du
  // catalogue qui n'est pas au programme n'a rien a faire ici.
  function iaExerciceDuPlan(id) {
    var liste = iaExercices(), i;
    for (i = 0; i < liste.length; i++) { if (liste[i].ex.id === id) return liste[i]; }
    return null;
  }

  function iaLire(texte) {
    var res = { props: [], rejets: [], rien: false };
    if (!profile || !profile.plan) {
      res.rejets.push("Aucun programme actif.");
      return res;
    }
    var brut = String(texte || "");
    if (!brut.replace(/^\s+|\s+$/g, "")) {
      res.rejets.push("Rien n'a ete colle.");
      return res;
    }

    var lignes = brut.split(/\r?\n/), i, vus = {}, hausses = 0;
    for (i = 0; i < lignes.length; i++) {
      var ligne = lignes[i].replace(/^\s+|\s+$/g, "");
      if (!ligne) continue;
      // Les modeles encadrent volontiers leur reponse de ``` ou de puces.
      ligne = ligne.replace(/^[`>\-\*\s]+/, "").replace(/`+$/, "");
      if (/^RIEN\b/i.test(ligne)) { res.rien = true; continue; }
      if (ligne.indexOf(IA_SEP) < 0) continue;         // de la prose, on l'ignore

      var parts = ligne.split(IA_SEP), t, p;
      for (t = 0; t < parts.length; t++) parts[t] = parts[t].replace(/^\s+|\s+$/g, "");
      var type = parts[0].toUpperCase().replace(/[^A-Z]/g, "");
      var id = parts[1] || "";
      var val = parts[2] || "";
      var raison = iaNettoieRaison(parts.slice(3).join(" "));

      // Egalite stricte, jamais une recherche de sous-chaine : « CHAR » ou
      // « REPO » passeraient un test par indexOf sur une liste concatenee.
      if (type !== "CHARGE" && type !== "VOLUME" && type !== "REPOS" && type !== "REMPLACER") {
        continue;                                      // ligne qui n'est pas une proposition
      }

      // Le plafond ne se compte qu'une fois la ligne reconnue comme
      // proposition : sinon de la prose contenant une barre verticale
      // declencherait le message de surplus.
      if (res.props.length >= IA_MAX_PROPS) {
        res.rejets.push("Plus de " + IA_MAX_PROPS + " propositions : le surplus est ignore.");
        break;
      }

      var cible = iaExerciceDuPlan(id);
      if (!cible) {
        res.rejets.push("« " + id + " » n'est pas un exercice charge de mon programme.");
        continue;
      }
      if (vus[type + ":" + id]) {
        res.rejets.push("Deuxieme proposition " + type.toLowerCase() + " sur " + cible.ex.name + " : ignoree.");
        continue;
      }

      var ex = cible.ex;

      if (type === "CHARGE") {
        var kg = cleanNumber(val, MIN_KG, MAX_KG, 1);
        if (kg === null) {
          res.rejets.push("Charge illisible pour " + ex.name + " (« " + val + " »).");
          continue;
        }
        var ref = iaChargeRef(ex, cible.seances);
        if (!ref) {
          res.rejets.push("Pas de charge de reference pour " + ex.name + " : proposition non verifiable.");
          continue;
        }
        // Le garde-fou qui compte. Un modele qui se trompe d'unite ou
        // d'exercice produit des chiffres plausibles a l'ecran et dangereux
        // sous une barre.
        if (kg > ref * IA_RATIO_MAX || kg < ref * IA_RATIO_MIN) {
          res.rejets.push("Ecart trop grand sur " + ex.name + " : " + frDec(String(kg)) +
                          " kg pour " + frDec(String(ref)) + " kg actuels.");
          continue;
        }
        if (kg === ref) continue;                      // ne rien changer n'est pas une proposition
        // Plafond de HAUSSES, pas de baisses : redescendre n'a jamais blessé
        // personne. Le refus est montré, pour qu'une salve tronquée ne passe
        // pas pour l'avis complet du modèle.
        if (kg > ref) {
          if (hausses >= IA_MAX_HAUSSES) {
            res.rejets.push("Plus de " + IA_MAX_HAUSSES + " hausses de charge d'un coup : " +
                            ex.name + " est ecarte. Monte par etapes.");
            continue;
          }
          hausses++;
        }
        vus[type + ":" + id] = true;
        res.props.push({ type: "charge", ex: id, kg: kg, ia: true,
          texte: "Viser " + frDec(String(kg)) + " kg sur " + ex.name,
          raison: raison || "Propose par l'IA." });

      } else if (type === "VOLUME") {
        var delta = cleanNumber(val.replace(/^\+/, ""), -3, 3, 0);
        if (delta === null || delta === 0) {
          res.rejets.push("Variation de series illisible pour " + ex.name + " (« " + val + " »).");
          continue;
        }
        var cibleSets = ex.sets + delta;
        if (cibleSets < 1 || cibleSets > MAX_SETS) {
          res.rejets.push("Volume hors bornes pour " + ex.name + " : " + cibleSets + " series.");
          continue;
        }
        vus[type + ":" + id] = true;
        res.props.push({ type: "volume", ex: id, delta: delta, ia: true,
          texte: "Passer " + ex.name + " a " + cibleSets + " series",
          raison: raison || "Propose par l'IA." });

      } else if (type === "REPOS") {
        var sec = cleanNumber(val, 20, 300, 0);
        if (sec === null) {
          res.rejets.push("Temps de repos illisible pour " + ex.name + " (« " + val + " »).");
          continue;
        }
        if (sec === (ex.rest || 60)) continue;
        vus[type + ":" + id] = true;
        res.props.push({ type: "repos", ex: id, rest: sec, ia: true,
          texte: "Repos de " + ex.name + " a " + fmtRest(sec),
          raison: raison || "Propose par l'IA." });

      } else if (type === "REMPLACER") {
        var pat = CAT_BY_ID[id] ? CAT_BY_ID[id].pat : "";
        // On revalide contre la MEME liste que celle envoyee dans le prompt.
        // C'est elle qui porte le mandat : meme pattern, materiel disponible,
        // pas d'exercice refuse, pas de doublon dans le programme.
        var cands = analyseCandidats(ex, pat), okC = null, ci;
        for (ci = 0; ci < cands.length; ci++) { if (cands[ci].id === val) okC = cands[ci]; }
        if (!okC) {
          res.rejets.push("« " + val + " » n'est pas un remplacant autorise pour " + ex.name + ".");
          continue;
        }
        vus[type + ":" + id] = true;
        res.props.push({ type: "remplacer", ex: id, par: okC.id, ia: true,
          texte: "Remplacer " + ex.name + " par " + okC.name,
          raison: raison || "Propose par l'IA." });
      }
    }

    if (!res.props.length && !res.rejets.length && !res.rien) {
      res.rejets.push("Aucune ligne au format attendu n'a ete trouvee.");
    }
    return res;
  }

  // Une proposition appliquee peut rendre les suivantes caduques : remplacer un
  // exercice le fait sortir du plan, et une proposition de charge qui le visait
  // n'a plus de cible. Sans ce filtre, le bouton restait a l'ecran et ne faisait
  // plus rien au tap suivant — appliquerProposition ne trouvant aucune place,
  // il retournait vrai sans avoir rien change.
  function iaRevalider(props) {
    var out = [], i, p, cible;
    for (i = 0; i < props.length; i++) {
      p = props[i];
      cible = iaExerciceDuPlan(p.ex);
      if (!cible) continue;
      if (p.type === "charge") {
        var ref = iaChargeRef(cible.ex, cible.seances);
        if (!ref || p.kg === ref) continue;
        if (p.kg > ref * IA_RATIO_MAX || p.kg < ref * IA_RATIO_MIN) continue;
      } else if (p.type === "volume") {
        var nb = cible.ex.sets + p.delta;
        if (nb < 1 || nb > MAX_SETS) continue;
      } else if (p.type === "repos") {
        if (p.rest === (cible.ex.rest || 60)) continue;
      } else if (p.type === "remplacer") {
        var pat2 = CAT_BY_ID[p.ex] ? CAT_BY_ID[p.ex].pat : "";
        var cands2 = analyseCandidats(cible.ex, pat2), trouve = false, ci2;
        for (ci2 = 0; ci2 < cands2.length; ci2++) { if (cands2[ci2].id === p.par) trouve = true; }
        if (!trouve) continue;
      }
      out.push(p);
    }
    return out;
  }


  // ===========================================================================
  // CARTE « DEMANDER A UNE IA »
  // ---------------------------------------------------------------------------
  // Deux zones de texte plutot qu'un bouton magique, et c'est un choix.
  //
  // En sortie : le texte est MONTRE avant d'etre copie. Ces donnees partent vers
  // un service tiers, les afficher est la condition pour decider en connaissance
  // de cause. Le bouton de copie tente navigator.clipboard, puis execCommand ;
  // si les deux echouent, le texte est deja a l'ecran et reste selectionnable a
  // la main. Aucun chemin ne laisse l'utilisateur sans solution.
  //
  // En entree : on ne lit PAS le presse-papier. navigator.clipboard.readText
  // demande une permission a chaque appel sur iOS et echoue en standalone plus
  // souvent qu'a son tour ; un champ ou l'on colle marche partout, toujours.
  // ===========================================================================
  function iaHtml() {
    if (!profile || !profile.done || !profile.plan) return "";

    var entete =
      '<div class="ana-bloc">' +
        '<div class="field-label">Demander un avis a une IA</div>' +
        '<button type="button" class="detail-toggle" data-action="toggle-ia" aria-expanded="' +
          (state.iaOuvert ? "true" : "false") + '">' +
          (state.iaOuvert ? "Masquer le pont IA ▲" : "Ouvrir le pont IA ▼") +
        '</button>';

    if (!state.iaOuvert) return entete + '</div>';

    var prompt = iaPrompt();
    var avecCle = iaClePrete();

    var corps =
      '<div class="ia-note">' +
        (avecCle
          ? 'Une cle est enregistree : l\'appli peut interroger ' + esc(iaFournisseur().label) +
            ' directement. Le presse-papier reste disponible si tu preferes. '
          : 'L\'appli ne se connecte a rien. Tu copies le texte ci-dessous, tu le colles ' +
            'dans l\'appli IA de ton choix, puis tu rapportes sa reponse ici. ') +
        '<b>Ce texte part vers un service tiers</b> : il est affiche en entier pour que ' +
        'tu voies exactement ce que tu envoies.' +
      '</div>';

    // Appel direct : proposé EN PREMIER quand une clé existe, parce que c'est
    // alors le chemin court. Sans clé la section n'apparaît pas du tout —
    // annoncer un bouton qu'on ne peut pas utiliser n'aide personne.
    if (avecCle) {
      corps +=
        '<button type="button" class="ia-btn ia-btn-fort" data-action="ia-demander"' +
          (state.iaOccupe ? ' disabled' : '') + '>' +
          (state.iaOccupe ? '… Analyse en cours' : '✦ Demander a ' + esc(iaFournisseur().label)) +
        '</button>' +
        '<div class="ia-ou">ou passe par le presse-papier</div>';
    }

    corps +=
      '<div class="ia-etape">1 · Copie ce bilan</div>' +
      '<textarea class="ia-zone" id="ia-prompt" readonly rows="7" ' +
        'aria-label="Bilan a copier vers l\'IA">' + esc(prompt) + '</textarea>' +
      '<button type="button" class="ia-btn" data-action="ia-copier">⧉ Copier le bilan</button>' +

      '<div class="ia-etape">2 · Colle la reponse de l\'IA</div>' +
      '<textarea class="ia-zone" id="ia-reponse" rows="5" ' +
        'placeholder="Colle ici la reponse de l\'IA, telle quelle." ' +
        'data-action="ia-saisie" aria-label="Reponse de l\'IA">' + esc(state.iaTexte || "") + '</textarea>' +
      '<button type="button" class="ia-btn" data-action="ia-lire">✓ Lire la reponse</button>';

    // --- Resultat de la lecture -----------------------------------------------
    if (state.iaRes) {
      var r = state.iaRes, k;

      if (r.props.length) {
        var props = "";
        for (k = 0; k < r.props.length; k++) {
          var p = r.props[k];
          props +=
            '<div class="ana-prop ia-prop">' +
              '<div class="ana-prop-texte">' + esc(p.texte) + '</div>' +
              '<div class="ana-prop-raison">' + esc(p.raison) + '</div>' +
              '<div class="ana-prop-actes">' +
                '<button type="button" class="ana-ok-btn" data-action="ia-appliquer" data-i="' + k + '">Appliquer</button>' +
                '<button type="button" class="ana-non-btn" data-action="ia-ignorer" data-i="' + k + '">Ignorer</button>' +
              '</div>' +
            '</div>';
        }
        corps += '<div class="ia-resultat"><div class="field-label">' + r.props.length +
                 ' proposition' + (r.props.length > 1 ? "s" : "") + ' retenue' +
                 (r.props.length > 1 ? "s" : "") + '</div>' + props + '</div>';
      } else if (r.rien) {
        corps += '<div class="ob-note">L\'IA ne propose aucun changement.</div>';
      }

      // Les rejets sont MONTRES. Les avaler en silence laisserait croire que
      // l'IA n'a rien propose, alors qu'elle a propose quelque chose que le
      // mandat refuse — et c'est precisement ce qu'il faut savoir.
      if (r.rejets.length) {
        var rj = "";
        for (k = 0; k < r.rejets.length; k++) rj += '<li>' + esc(r.rejets[k]) + '</li>';
        corps +=
          '<div class="ia-rejets">' +
            '<div class="field-label">' + r.rejets.length + ' ecartee' +
              (r.rejets.length > 1 ? "s" : "") + '</div>' +
            '<ul>' + rj + '</ul>' +
            '<div class="ia-rejets-pourquoi">L\'appli ne s\'en remet pas a l\'IA : ' +
              'chaque proposition est reverifiee contre ton programme et ton materiel. ' +
              'Ce qui sort du cadre est ecarte ici, pas applique.</div>' +
          '</div>';
      }
    }

    corps +=
      '<div class="nutri-disclaimer">' +
        'Une IA se trompe avec aplomb. Elle ne te voit pas, ne connait ni tes ' +
        'douleurs ni ta technique, et n\'a aucun moyen de verifier ce qu\'elle avance. ' +
        'Ses propositions ne remplacent pas l\'œil d\'un coach.' +
      '</div>';

    return entete + corps + '</div>';
  }

  // --- Copie vers le presse-papier -------------------------------------------
  // Trois chemins, du plus propre au plus rustique. Le dernier ne peut pas
  // echouer : le texte est deja affiche, il suffit de le selectionner.
  function iaCopier() {
    var zone = document.getElementById("ia-prompt");
    var texte = zone ? zone.value : iaPrompt();

    function replis() {
      try {
        if (zone && zone.setSelectionRange) {
          zone.focus();
          zone.setSelectionRange(0, texte.length);      // iOS ignore select() sur un readonly
          if (document.execCommand && document.execCommand("copy")) {
            notify("Bilan copie. Colle-le dans ton appli IA.", "ok");
            return;
          }
        }
      } catch (e) {}
      notify("Copie automatique refusee par le navigateur : selectionne le texte et copie-le a la main.", "info");
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        navigator.clipboard.writeText(texte).then(function () {
          notify("Bilan copie. Colle-le dans ton appli IA.", "ok");
        }, replis);
        return;
      } catch (e) { /* on tombe dans le repli */ }
    }
    replis();
  }


  // ===========================================================================
  // APPEL DIRECT AU FOURNISSEUR
  // ---------------------------------------------------------------------------
  // Un appel navigateur, sans serveur intermediaire : c'est le seul montage
  // possible pour une page statique, et il fonctionne — CORS verifie chez les
  // cinq fournisseurs. Anthropic exige en plus un en-tete de consentement
  // explicite, « anthropic-dangerous-direct-browser-access », qui reconnait que
  // la cle vit dans le navigateur.
  //
  // Chaque fournisseur decrit son contrat dans une entree de IA_FOURNISSEURS :
  // ou taper, quels en-tetes, quel corps, ou lire la reponse, ou lire l'erreur.
  // Ajouter un fournisseur, c'est ajouter une entree — le reste ne bouge pas.
  //
  // LA CLE NE VOYAGE JAMAIS DANS L'URL. Un parametre d'URL se retrouve dans les
  // journaux de serveur, l'historique et les en-tetes de provenance. Google
  // accepte sa cle en parametre : on utilise quand meme l'en-tete.
  // ===========================================================================
  var IA_TIMEOUT_MS = 60000;      // un modele qui reflechit prend son temps

  // Plafond de sortie. Douze propositions tiennent en ~400 jetons, mais sur les
  // modeles a raisonnement le plafond couvre la REFLEXION ET la reponse : trop
  // bas, le modele epuise son budget a reflechir et rend une reponse vide ou
  // tronquee, sans erreur. La marge n'est donc pas du confort, c'est ce qui
  // empeche un echec silencieux.
  var IA_MAX_SORTIE = 4000;

  var IA_FOURNISSEURS = [
    {
      v: "anthropic",
      label: "Claude (Anthropic)",
      modele: "claude-opus-5",
      prefixe: "sk-ant-",
      url: "https://api.anthropic.com/v1/messages",
      entetes: function (cle) {
        return {
          "content-type": "application/json",
          "x-api-key": cle,
          "anthropic-version": "2023-06-01",
          // Sans cet en-tete, l'appel depuis une page web est refuse.
          "anthropic-dangerous-direct-browser-access": "true"
        };
      },
      corps: function (modele, prompt) {
        // Pas de « temperature » : les modeles Claude 5 la refusent avec une
        // erreur 400. La consigne se donne dans le texte, pas dans un reglage.
        return { model: modele, max_tokens: IA_MAX_SORTIE,
                 messages: [{ role: "user", content: prompt }] };
      },
      lis: function (j) {
        // On CHERCHE le bloc de texte, on ne prend pas content[0].
        // Sur les modeles a raisonnement adaptatif — dont claude-opus-5 par
        // defaut — le premier bloc est un bloc « thinking » dont le texte est
        // vide. Lire content[0].text rendrait undefined a chaque appel.
        var i;
        if (!j || !isArray(j.content)) return "";
        for (i = 0; i < j.content.length; i++) {
          if (j.content[i] && j.content[i].type === "text") return j.content[i].text || "";
        }
        return "";
      },
      erreur: function (j) { return j && j.error ? j.error.message : ""; }
    },
    {
      v: "openai",
      label: "ChatGPT (OpenAI)",
      modele: "gpt-5.6-luna",
      prefixe: "sk-",
      url: "https://api.openai.com/v1/chat/completions",
      entetes: function (cle) {
        return { "content-type": "application/json", "authorization": "Bearer " + cle };
      },
      corps: function (modele, prompt) {
        // « max_completion_tokens », pas « max_tokens » : l'ancien nom est
        // refuse sur les modeles a raisonnement.
        //
        // reasoning_effort à « none » : rendre douze lignes formatees ne
        // demande pas de reflexion, et les jetons de raisonnement se comptent
        // sur le meme plafond que la reponse — les laisser courir risque une
        // reponse vide.
        return { model: modele, max_completion_tokens: IA_MAX_SORTIE,
                 reasoning_effort: "none",
                 messages: [{ role: "user", content: prompt }] };
      },
      lis: function (j) {
        return (j && isArray(j.choices) && j.choices[0] && j.choices[0].message)
          ? (j.choices[0].message.content || "") : "";
      },
      erreur: function (j) { return j && j.error ? j.error.message : ""; }
    },
    {
      v: "google",
      label: "Gemini (Google)",
      modele: "gemini-3.5-flash-lite",
      prefixe: "AIza",
      url: "https://generativelanguage.googleapis.com/v1beta/models/{modele}:generateContent",
      entetes: function (cle) {
        // En-tete, jamais « ?key= » : une cle en parametre d'URL finit dans les
        // journaux de serveur, l'historique et les en-tetes de provenance.
        return { "content-type": "application/json", "x-goog-api-key": cle };
      },
      corps: function (modele, prompt) {
        return { contents: [{ role: "user", parts: [{ text: prompt }] }],
                 generationConfig: { maxOutputTokens: IA_MAX_SORTIE } };
      },
      lis: function (j) {
        var c = j && isArray(j.candidates) ? j.candidates[0] : null;
        if (!c || !c.content || !isArray(c.content.parts)) return "";
        var out = "", i;
        for (i = 0; i < c.content.parts.length; i++) {
          if (c.content.parts[i] && c.content.parts[i].text) out += c.content.parts[i].text;
        }
        return out;
      },
      erreur: function (j) { return j && j.error ? j.error.message : ""; }
    },
    {
      v: "mistral",
      label: "Mistral",
      modele: "mistral-small-2603",
      prefixe: "",
      url: "https://api.mistral.ai/v1/chat/completions",
      entetes: function (cle) {
        return { "content-type": "application/json", "authorization": "Bearer " + cle };
      },
      corps: function (modele, prompt) {
        // « max_tokens », surtout pas « max_completion_tokens » : Mistral
        // refuse les champs inconnus par une 422, il ne les ignore pas. Un
        // portage depuis OpenAI casse ici plutot que de se degrader en silence.
        return { model: modele, max_tokens: IA_MAX_SORTIE,
                 messages: [{ role: "user", content: prompt }] };
      },
      lis: function (j) {
        var m = (j && isArray(j.choices) && j.choices[0]) ? j.choices[0].message : null;
        if (!m) return "";
        // En mode raisonnement, `content` arrive en MORCEAUX plutot qu'en
        // chaine. On accepte les deux formes : c'est le modele qui décide, et
        // il est modifiable dans les reglages.
        if (typeof m.content === "string") return m.content;
        if (isArray(m.content)) {
          var out = "", i, b;
          for (i = 0; i < m.content.length; i++) {
            b = m.content[i];
            if (typeof b === "string") out += b;
            else if (b && b.type === "text" && b.text) out += b.text;
          }
          return out;
        }
        return "";
      },
      erreur: function (j) {
        // TROIS enveloppes d'erreur distinctes chez Mistral, et l'ordre des
        // tests compte. La validation (422) range `detail` SOUS `message`, pas
        // a la racine : tester `j.detail` en premier le manque, retombe sur
        // `j.message` qui est alors un OBJET, et affiche « [object Object] ».
        if (!j) return "";
        var m = j.message;
        if (m && isArray(m.detail)) {                       // 422 validation
          var out = [], i, d;
          for (i = 0; i < m.detail.length; i++) {
            d = m.detail[i];
            if (d && d.msg) out.push((isArray(d.loc) ? d.loc.join(".") + " : " : "") + d.msg);
          }
          if (out.length) return out.join(" | ");
        }
        if (typeof j.detail === "string") return j.detail;   // 401 cle invalide
        if (typeof m === "string") return m;                 // routage
        return j.error ? (j.error.message || "") : "";
      }
    }
  ];

  // Message d'erreur lisible. Un code HTTP nu n'aide personne : on traduit les
  // trois cas qui arrivent vraiment, et on garde le message du fournisseur pour
  // le reste.
  function iaMessageErreur(statut, detail) {
    if (statut === 401 || statut === 403) {
      return "Cle refusee par le fournisseur. Verifie qu'elle est complete et toujours active.";
    }
    if (statut === 404) {
      return "Modele introuvable (« " + iaModeleActif() + " »). Les noms de modeles changent : corrige-le dans les reglages.";
    }
    if (statut === 429) {
      return "Trop de demandes, ou credit epuise chez le fournisseur. Reessaie plus tard.";
    }
    if (detail) return detail;
    return "Le fournisseur a repondu " + statut + ".";
  }

  // Appel. Rend le TEXTE brut du modele à onOk, un message lisible à onErr.
  // Volontairement ignorant de ce que le texte contient : c'est iaLire() qui
  // decide de ce qui est applicable, et il traite ce texte comme hostile — que
  // l'utilisateur l'ait colle a la main ou qu'il vienne d'ici.
  function iaAppelDirect(prompt, onOk, onErr) {
    var f = iaFournisseur();
    if (!f || !iaClePrete()) { onErr("Aucune cle enregistree."); return; }
    if (!window.fetch) { onErr("Ce navigateur ne sait pas faire l'appel direct. Utilise le presse-papier."); return; }

    var modele = iaModeleActif();
    var url = f.url.replace("{modele}", encodeURIComponent(modele));
    var fini = false;

    // fetch n'a pas de delai maximum. Sans ce garde-fou, un reseau qui traine
    // laisse le bouton en « Analyse en cours… » indefiniment — meme piege que
    // le service worker, meme parade.
    //
    // On ANNULE aussi la requete, on ne se contente pas de cesser d'attendre :
    // une requete abandonnee sans etre annulee continue chez le fournisseur, et
    // se paie. AbortController manque sur les tres vieux navigateurs, d'ou le
    // test — sans lui on garde l'ancien comportement plutot que de planter.
    var stop = null;
    try { if (window.AbortController) stop = new window.AbortController(); } catch (e) {}

    var minuteur = window.setTimeout(function () {
      if (fini) return;
      fini = true;
      if (stop) { try { stop.abort(); } catch (e) {} }
      onErr("Pas de reponse apres " + Math.round(IA_TIMEOUT_MS / 1000) + " secondes. Reseau lent, ou fournisseur indisponible.");
    }, IA_TIMEOUT_MS);

    function termine(fn, arg) {
      if (fini) return;
      fini = true;
      window.clearTimeout(minuteur);
      fn(arg);
    }

    var options = {
      method: "POST",
      headers: f.entetes(iaReglages.cle),
      body: JSON.stringify(f.corps(modele, prompt))
    };
    if (stop) options.signal = stop.signal;

    window.fetch(url, options).then(function (rep) {
      return rep.text().then(function (txt) {
        var j = null;
        try { j = JSON.parse(txt); } catch (e) {}
        if (!rep.ok) {
          termine(onErr, iaMessageErreur(rep.status, j ? f.erreur(j) : ""));
          return;
        }
        var texte = j ? f.lis(j) : "";
        if (!texte) {
          termine(onErr, "Reponse vide ou illisible du fournisseur.");
          return;
        }
        termine(onOk, texte);
      });
    })["catch"](function (e) {
      // Un echec de fetch ne dit pas pourquoi : hors-ligne, DNS, CORS, tout
      // ressort en « Failed to fetch ». On nomme la cause la plus probable.
      termine(onErr, "Appel impossible : verifie ta connexion. (" +
                     (e && e.message ? e.message : "erreur reseau") + ")");
    });
  }


  // ===========================================================================
  // CLE D'API : STOCKAGE
  // ---------------------------------------------------------------------------
  // La cle vit HORS du profil, et ce n'est pas un detail de rangement.
  // buildPayload() exporte `profile` : une cle rangee dedans partirait dans le
  // fichier de sauvegarde, celui-la meme que l'utilisateur s'envoie par mail ou
  // AirDrop pour changer de telephone. Une cle d'API est un moyen de paiement —
  // elle n'a rien a faire dans un fichier fait pour etre transmis.
  //
  // Elle ne suit donc PAS la sauvegarde, volontairement : on la ressaisit sur le
  // nouvel appareil. C'est trois secondes de gene contre une fuite silencieuse.
  //
  // Consequence a ne pas oublier : tout ce qui vit hors du profil echappe aussi a
  // cleanProfile. Ces reglages ont donc leur propre validation, cleanIaReglages,
  // appelee par loadSettings. Sans elle, un stockage abime rendrait un objet
  // inattendu et l'ecran des reglages planterait au chargement.
  // ===========================================================================
  var IA_CLE_MAX = 200;
  var IA_MODELE_MAX = 60;

  var iaReglages = { fournisseur: "", cle: "", modele: "" };

  function cleanIaReglages(raw) {
    var out = { fournisseur: "", cle: "", modele: "" };
    if (!raw || typeof raw !== "object") return out;
    var i, connu = false;
    for (i = 0; i < IA_FOURNISSEURS.length; i++) {
      if (IA_FOURNISSEURS[i].v === raw.fournisseur) connu = true;
    }
    if (!connu) return out;                 // fournisseur inconnu : on repart a vide
    out.fournisseur = raw.fournisseur;
    // Une cle est une chaine imprimable sans espace. On retire les blancs de
    // bord, que le collage depuis un site ramene presque toujours.
    if (typeof raw.cle === "string") {
      out.cle = raw.cle.replace(/^\s+|\s+$/g, "").replace(/[\r\n\t ]/g, "").slice(0, IA_CLE_MAX);
    }
    if (typeof raw.modele === "string") {
      out.modele = raw.modele.replace(/^\s+|\s+$/g, "").slice(0, IA_MODELE_MAX);
    }
    return out;
  }

  function iaFournisseur() {
    var i;
    for (i = 0; i < IA_FOURNISSEURS.length; i++) {
      if (IA_FOURNISSEURS[i].v === iaReglages.fournisseur) return IA_FOURNISSEURS[i];
    }
    return null;
  }

  // Une cle est-elle utilisable ? On ne verifie pas sa validite — seul le
  // fournisseur peut le dire — seulement qu'il y a de quoi tenter l'appel.
  function iaClePrete() {
    var f = iaFournisseur();
    return !!(f && iaReglages.cle && iaReglages.cle.length >= 12);
  }

  function iaModeleActif() {
    var f = iaFournisseur();
    if (!f) return "";
    return iaReglages.modele || f.modele;
  }

  // Relit les champs VIVANTS du formulaire.
  //
  // La saisie ne declenche pas de rendu — sinon le clavier se refermerait a
  // chaque frappe — donc l'etat peut etre en retard sur ce qui est a l'ecran.
  // Pire sur iOS : un collage par le menu systeme ne declenche pas toujours
  // l'evenement input. Tout geste qui UTILISE la cle relit donc le DOM d'abord,
  // au lieu de faire confiance a l'etat.
  function iaLireChamps() {
    var champCle = document.getElementById("ia-cle");
    var champModele = document.getElementById("ia-modele");
    // Le champ n'existe que si la cle est en mode saisie. Absent, on garde la
    // cle enregistree : ne pas l'ecraser avec une chaine vide.
    if (champCle) {
      iaReglages.cle = String(champCle.value)
        .replace(/^\s+|\s+$/g, "").replace(/[\r\n\t ]/g, "").slice(0, IA_CLE_MAX);
    }
    if (champModele) {
      iaReglages.modele = String(champModele.value).replace(/^\s+|\s+$/g, "").slice(0, IA_MODELE_MAX);
    }
  }

  // Affichage masque : assez pour reconnaitre SA cle, pas assez pour la lire
  // par-dessus l'epaule. On garde le prefixe, qui identifie le fournisseur, et
  // les quatre derniers caracteres, qui distinguent deux cles du meme compte.
  function iaCleMasquee(cle) {
    if (!cle) return "";
    if (cle.length <= 12) return new Array(cle.length + 1).join("•");
    return cle.slice(0, 6) + new Array(9).join("•") + cle.slice(-4);
  }


  // ===========================================================================
  // CARTE « REGLAGES AVANCES » : la cle d'API
  // ---------------------------------------------------------------------------
  // Repliee par defaut, et placee apres le profil : c'est une option pour qui
  // sait ce qu'est une cle d'API, pas une etape du parcours. Quelqu'un qui
  // ignore ce que c'est ne doit jamais avoir a se poser la question — le pont
  // presse-papier marche sans rien de tout ca.
  // ===========================================================================
  function iaCleHtml() {
    if (!profile || !profile.done) return "";

    var ouvert = state.avanceOuvert;
    var entete =
      '<section class="card">' +
        '<div class="card-title">⚙ Réglages avancés</div>' +
        '<button type="button" class="detail-toggle" data-action="toggle-avance" aria-expanded="' +
          (ouvert ? "true" : "false") + '">' +
          (ouvert ? "Masquer" : "Clé API pour l\'analyse IA") + (ouvert ? " ▲" : " ▼") +
        '</button>';

    if (!ouvert) {
      // Un mot sur l'etat, meme replie : sinon on ne sait pas si une cle est
      // posee sans deplier.
      return entete +
        (iaClePrete()
          ? '<div class="ia-cle-etat">Clé enregistrée · ' + esc(iaFournisseur().label) + '</div>'
          : '') +
        '</section>';
    }

    var f = iaFournisseur();
    var opts = "", i;
    opts += '<option value=""' + (iaReglages.fournisseur ? "" : " selected") + '>— Aucun (pont presse-papier) —</option>';
    for (i = 0; i < IA_FOURNISSEURS.length; i++) {
      opts += '<option value="' + esc(IA_FOURNISSEURS[i].v) + '"' +
              (IA_FOURNISSEURS[i].v === iaReglages.fournisseur ? " selected" : "") + '>' +
              esc(IA_FOURNISSEURS[i].label) + '</option>';
    }

    var corps =
      '<div class="ia-note">' +
        'Avec une clé, l\'appli interroge l\'IA <b>directement</b>, sans passer par le ' +
        'presse-papier. C\'est facultatif : tout marche sans. Une clé d\'API se crée sur ' +
        'le site du fournisseur et se paie à l\'usage — ce n\'est pas ton abonnement ' +
        'habituel, ce sont deux produits séparés.' +
      '</div>' +

      '<div class="field">' +
        '<label class="field-label" for="ia-fournisseur">Fournisseur</label>' +
        '<select id="ia-fournisseur" class="ia-select" data-action="ia-fournisseur">' + opts + '</select>' +
      '</div>';

    if (f) {
      var cleAffichee = state.iaCleVisible ? iaReglages.cle : "";
      corps +=
        '<div class="field">' +
          '<label class="field-label" for="ia-cle">Clé API</label>' +
          (state.iaCleVisible
            ? '<input id="ia-cle" type="text" autocomplete="off" autocapitalize="off" ' +
                'autocorrect="off" spellcheck="false" class="ia-input" data-action="ia-cle-saisie" ' +
                'placeholder="' + esc(f.prefixe) + '…" value="' + esc(cleAffichee) + '">'
            // Champ masque : on n'y remet PAS la vraie cle. Un input password
            // rempli se laisse lire par n'importe quelle inspection, et surtout
            // le navigateur proposerait de l'enregistrer comme mot de passe.
            : '<div class="ia-cle-masque">' +
                (iaReglages.cle ? esc(iaCleMasquee(iaReglages.cle)) : '<i>aucune clé enregistrée</i>') +
              '</div>') +
          '<button type="button" class="ia-lien" data-action="ia-cle-voir">' +
            (state.iaCleVisible ? "Masquer la clé" : (iaReglages.cle ? "Modifier la clé" : "Saisir une clé")) +
          '</button>' +
        '</div>' +

        '<div class="field">' +
          '<label class="field-label" for="ia-modele">Modèle</label>' +
          '<input id="ia-modele" type="text" autocomplete="off" autocapitalize="off" ' +
            'autocorrect="off" spellcheck="false" class="ia-input" data-action="ia-modele-saisie" ' +
            'placeholder="' + esc(f.modele) + '" value="' + esc(iaReglages.modele) + '">' +
          '<div class="field-hint">Laisse vide pour utiliser ' + esc(f.modele) + '. ' +
            'Les noms de modèles changent : si l\'appel échoue, c\'est souvent ça.</div>' +
        '</div>' +

        '<button type="button" class="ia-btn" data-action="ia-tester">⇄ Tester la connexion</button>' +
        (iaReglages.cle
          ? '<button type="button" class="ia-lien ia-lien-danger" data-action="ia-cle-effacer">Effacer la clé de cet appareil</button>'
          : '') +

        '<div class="nutri-disclaimer">' +
          'La clé reste sur ce téléphone et n\'est <b>jamais incluse dans la sauvegarde</b> : ' +
          'un fichier de sauvegarde se transmet, une clé de paiement ne se transmet pas. ' +
          'Tu la ressaisiras sur un nouvel appareil. Chaque analyse envoie ton bilan ' +
          'd\'entraînement au fournisseur et t\'est facturée par lui, quelques centimes ' +
          'à chaque fois. Tu peux révoquer la clé sur son site à tout moment.' +
        '</div>';
    }

    return entete + corps + '</section>';
  }

  function notify(text, kind) {
    state.notice = { text: text, kind: kind || "info" };
    render();
    window.setTimeout(function () {
      if (state.notice && state.notice.text === text) { state.notice = null; render(); }
    }, 7000);
  }

  // --- Sauvegarde / restauration --------------------------------------------
  // Le profil part avec la sauvegarde. Sans lui, restaurer sur un autre
  // téléphone rendrait un historique orphelin : les séries sont indexées par
  // exercice, et sans le programme correspondant plus rien ne s'affiche.
  function buildPayload() {
    return JSON.stringify({
      app: "LEMMON FIT",
      version: APP_VERSION,
      exportedAt: new Date().toISOString(),
      profile: profile,
      log: state.log
    }, null, 2);
  }

  function exportData() {
    // Le profil vaut autant que le journal. Quelqu'un qui vient de finir le
    // diagnostic n'a aucune séance enregistrée, mais il a un programme, des
    // réglages et un plan nutrition : refuser l'export dans cet état le laissait
    // sans filet précisément au moment de l'installation, là où il en a le plus
    // besoin. La sauvegarde embarque le profil depuis buildPayload.
    var aProfil = !!(profile && profile.done);
    if (!countKeys(state.log) && !aProfil) { notify("Il n'y a encore rien à exporter.", "info"); return; }
    var payload = buildPayload();
    var filename = "lemmon-fit-sauvegarde-" + todayKey() + ".json";

    // Sur iPhone en mode « ajouté à l'écran d'accueil », un téléchargement par
    // <a download> ne produit rien, silencieusement. La feuille de partage iOS
    // est la seule voie fiable en standalone.
    if (window.File && navigator.share && navigator.canShare) {
      try {
        var file = new File([payload], filename, { type: "application/json" });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: filename })
            .then(function () { notify("Sauvegarde partagée. Range-la dans Fichiers, ou envoie-la-toi par mail.", "ok"); })
            .catch(function (err) {
              if (err && err.name === "AbortError") return;
              downloadFallback(payload, filename);
            });
          return;
        }
      } catch (e) { /* repli */ }
    }
    downloadFallback(payload, filename);
  }

  function downloadFallback(payload, filename) {
    try {
      var blob = new Blob([payload], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      notify("Sauvegarde générée : " + filename, "ok");
    } catch (e) {
      window.alert("Export impossible : " + (e && e.message ? e.message : e));
    }
  }

  function importPayload(text) {
    var parsed = JSON.parse(text);
    var incoming = (parsed && parsed.log && typeof parsed.log === "object") ? parsed.log : parsed;
    var incomingProfile = (parsed && parsed.profile) ? cleanProfile(parsed.profile) : null;
    var withProfile = !!(incomingProfile && incomingProfile.plan);

    // Le profil du fichier est appliqué AVANT le nettoyage du journal qui
    // l'accompagne. cleanEntry valide « nutri » contre la liste de prises
    // active : nettoyer d'abord ferait perdre les prises cochées d'une
    // sauvegarde dont le plan nutrition diffère de celui du téléphone qui
    // reçoit. On restaure le profil précédent si l'import est abandonné.
    var profilPrecedent = profile, profilTemp = null;
    if (withProfile) { incomingProfile.done = true; profilTemp = incomingProfile; }
    // Une sauvegarde produite par une version ANTÉRIEURE au diagnostic ne porte
    // aucun profil : la v1.0.0 en ligne n'écrit que { app, version, exportedAt,
    // log }. Reçue sur une installation neuve, PROGRAM est vide et cleanLog
    // tourne à sec — les charges au format par rang ne peuvent être résolues, et
    // les prises de nutrition sont toutes écartées, faute de liste à valider.
    // On adopte donc le programme d'origine, exactement comme le démarrage.
    // Mesuré sans ce garde-fou : 1 794 kg de charges et 5 prises détruits, et
    // comme l'écran de diagnostic n'affiche pas les notifications, l'utilisateur
    // ne voit rien du tout et recommence.
    else if (!countKeys(PROGRAM)) { profilTemp = legacyProfile(); profilTemp.done = true; }
    function annuler() {
      if (!profilTemp) return;
      profile = profilPrecedent;
      applyProfile();
    }
    if (profilTemp) { profile = profilTemp; applyProfile(); }

    var cleaned = cleanLog(incoming);
    var n = countKeys(cleaned), k;

    // Un fichier sans aucune séance mais avec un profil est parfaitement
    // légitime : c'est la sauvegarde de quelqu'un qui vient d'installer l'appli
    // et de faire son diagnostic. Exiger une séance rendait cet export
    // impossible à relire, donc inutile.
    if (!n && !withProfile) {
      annuler();
      throw new Error("ce fichier ne contient ni séance ni profil");
    }
    var quoi = [];
    if (n) quoi.push(n + " jour(s) de séances");
    if (withProfile) quoi.push("un profil et son programme");
    if (!window.confirm("Importer " + quoi.join(" et ") + " ?" +
        (withProfile ? "\n\nLe profil et le programme du fichier remplaceront les tiens." : "") +
        (n ? "\n\nLes séances fusionnent avec les tiennes ; en cas de conflit sur une même date, le fichier importé gagne." : ""))) {
      annuler();
      return;
    }
    for (k in cleaned) { if (has(cleaned, k)) state.log[k] = cleaned[k]; }
    // Le journal EN PREMIER : si le stockage refuse d'écrire, mieux vaut ne pas
    // avoir remplacé le profil pour un journal qui n'a pas pu s'enregistrer.
    var ok = persist();
    if (profilTemp) {
      persistSettings();
      // Sortir du questionnaire est indispensable : garder le journal restauré
      // sans le programme qui va avec le rendrait illisible, et l'écran de
      // diagnostic n'affiche pas les notifications, donc rien ne signalerait
      // que l'import a réussi.
      if (state.ob) state.ob = null;
    }
    notify(ok ? ("Import terminé : " + quoi.join(" et ") + ".")
              : "Import affiché mais NON enregistré : le stockage refuse d'écrire.",
           ok ? "ok" : "error");
  }

  // --- Mise à jour ----------------------------------------------------------
  // On ne détruit JAMAIS le cache avant d'avoir la nouvelle version en main.
  // La sonde porte "?nocache=" : sw.js laisse passer ces requêtes sans y toucher,
  // sinon elle serait servie depuis le cache et réussirait même hors-ligne,
  // l'appli s'effaçant alors en croyant le réseau disponible.
  function updateApp() {
    var base = window.location.origin + window.location.pathname;
    var probe = base + "?nocache=" + Date.now();
    var fresh = base + "?v=" + Date.now();
    notify("Recherche d'une mise à jour…", "info");
    fetch(probe, { cache: "reload" })
      .then(function (r) {
        if (!r || !r.ok) throw new Error("réseau injoignable");
        return r.text();
      })
      .then(function (html) {
        // Un portail Wi-Fi répond 200 avec sa propre page : on vérifie qu'on a
        // bien récupéré l'appli avant de vider le cache.
        if (html.length < 5000 || html.indexOf("LEMMON FIT") === -1) {
          throw new Error("réponse inattendue du réseau");
        }
        if (!window.caches || !caches.keys) return null;
        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        });
      })
      .then(function () { window.location.replace(fresh); })
      .catch(function () {
        notify("Mise à jour impossible : réseau injoignable. L'appli reste utilisable telle quelle, tes données sont intactes.", "error");
      });
  }

  // --- Écriture des séries --------------------------------------------------
  function copySets(entry) {
    var out = {}, k, i, src;
    if (entry && entry.sets) {
      for (k in entry.sets) {
        if (!has(entry.sets, k)) continue;
        src = entry.sets[k];
        out[k] = [];
        for (i = 0; i < src.length; i++) {
          out[k].push({ kg: src[i].kg, reps: src[i].reps,
                        km: src[i].km, min: src[i].min });
        }
      }
    }
    return out;
  }

  // Nombre de séries d'un exercice sans charge (pastilles).
  function setSetsCount(exId, n) {
    var sets = copySets(currentEntry());
    if (n > 0) {
      var arr = sets[exId] || [];
      while (arr.length < n) arr.push({});
      arr.length = n;
      sets[exId] = arr;
    } else {
      delete sets[exId];
    }
    updateEntry({ sets: countKeys(sets) ? sets : null });
  }

  function writeSetField(exId, setIdx, field, rawValue) {
    var sets = copySets(currentEntry());
    var arr = sets[exId] || [];
    var raw = String(rawValue).replace(",", ".").trim();

    while (arr.length <= setIdx) arr.push({});

    if (raw === "") {
      delete arr[setIdx][field];
    } else {
      var v;
      if (field === "kg") v = cleanNumber(raw, MIN_KG, MAX_KG, 1);
      else if (field === "km") v = cleanNumber(raw, MIN_KM, MAX_KM, 2);
      else if (field === "min") v = cleanNumber(raw, MIN_MIN, MAX_MIN, 0);
      else v = cleanNumber(raw, MIN_REPS, MAX_REPS, 0);
      if (v === null) return false;   // saisie incomplète ou hors bornes
      arr[setIdx][field] = v;
    }

    // On retire les séries vides de fin, pour que le compteur reste juste.
    var lastFilled = -1, i;
    for (i = 0; i < arr.length; i++) {
      if (arr[i].kg !== undefined || arr[i].reps !== undefined ||
          arr[i].km !== undefined || arr[i].min !== undefined) lastFilled = i;
    }
    if (lastFilled >= 0) arr.length = lastFilled + 1; else arr.length = 0;

    if (arr.length) sets[exId] = arr; else delete sets[exId];
    updateEntry({ sets: countKeys(sets) ? sets : null });
    return true;
  }

  // --- Navigation entre les deux écrans -------------------------------------
  function setPage(page) {
    if (page !== "seance" && page !== "annexe") return;
    if (state.page === page) return;
    state.pageAnim = (page === "annexe") ? "right" : "left";
    state.page = page;
    state.openExo = null;         // on ne garde pas une fiche ouverte en fond
    render();
    window.scrollTo(0, 0);
  }

  // Glissement horizontal. Conditions volontairement strictes : le geste doit
