        if (a.min !== undefined) o.min = a.min;
        if (a.nat !== undefined) o.nat = a.nat;
        if (a.lieu !== undefined) o.lieu = a.lieu;
        if (a.t === "salle") { o.si = rot % SEANCES.length; rot++; }
        acts.push(o);
      }

      p = acts.length ? acts[0] : null;
      out.push({
        ji: ji,
        nom: JOURS[ji],
        acts: acts,
        vide: acts.length === 0,
        si:    (p && p.t === "salle") ? p.si : null,
        cours: (p && p.t === "cours") ? p : null,
        run:   (p && p.t === "run")   ? p : null
      });
    }
    return out;
  }

  // -------------------------------------------------------------------------
  // INVARIANT 2 — TOUT COMPTAGE DE VOLUME SE FAIT SUR `slots`, JAMAIS SUR
  // `progJours`.
  //
  // POURQUOI : `progJours` porte UN jour par entree, et son `si` / `cours` /
  // `run` ne decrit que la PREMIERE activite de la journee. Quelqu'un qui fait
  // salle le midi et cours le soir a deux activites le vendredi ; compter sur
  // `progJours` en perdrait une, et le total d'heures de cours comme le tonnage
  // hebdomadaire seraient faux sans que rien ne le signale.
  // -------------------------------------------------------------------------
  function aplatir(progJours) {
    var out = [], i, j;
    for (i = 0; i < progJours.length; i++) {
      for (j = 0; j < progJours[i].acts.length; j++) {
        out.push({ ji: progJours[i].ji, nom: progJours[i].nom, a: progJours[i].acts[j] });
      }
    }
    return out;
  }

  function filtrerSlots(slots, type) {
    var out = [], i;
    for (i = 0; i < slots.length; i++) {
      if (slots[i].a.t === type) out.push(slots[i]);
    }
    return out;
  }

  // -------------------------------------------------------------------------
  // INVARIANT 3 — `jourDe(si)` CHERCHE DANS `slotsSalle`, PAS DANS LE PREMIER
  // CRENEAU DE CHAQUE JOUR.
  //
  // POURQUOI : une seance de salle peut occuper le SECOND creneau d'une
  // journee, par exemple un vendredi ou le cours a lieu le matin. La chercher
  // parmi les premiers creneaux ne la trouve pas, et l'ecran la declare alors
  // « hors rotation » alors qu'elle y est parfaitement.
  // -------------------------------------------------------------------------
  function faireJourDe(slotsSalle) {
    return function (si) {
      var i;
      for (i = 0; i < slotsSalle.length; i++) {
        if (slotsSalle[i].a.si === si) return slotsSalle[i].nom.toLowerCase();
      }
      return "";
    };
  }

  // -------------------------------------------------------------------------
  // INVARIANT 4 — `seance` NE DOIT JAMAIS VALOIR null.
  //
  // POURQUOI : SEANCES[null] vaut undefined, et tout l'ecran se vide. Le cas se
  // produisait a la sortie du diagnostic quand le jour courant portait un cours
  // ou une sortie : il n'y avait pas de seance « du jour », et null etait pose
  // faute de mieux. On retombe donc, dans l'ordre : la seance du jour si c'est
  // de la salle, sinon la premiere seance de la rotation, sinon zero.
  // -------------------------------------------------------------------------
  function calculerSiDepart(progJours, slotsSalle) {
    var auj = jourIndexAujourdhui(), i;
    for (i = 0; i < progJours.length; i++) {
      if (progJours[i].ji === auj && progJours[i].si !== null) return progJours[i].si;
    }
    if (slotsSalle.length) return slotsSalle[0].a.si;
    return 0;
  }

  // -------------------------------------------------------------------------
  // INVARIANT 5 (seconde moitie) — UN JOUR OU UN CRENEAU SANS ACTIVITE
  // N'AFFICHE AUCUNE LISTE D'EXERCICES.
  //
  // POURQUOI : un jour coche dont la liste d'activites est vide est un etat
  // LEGITIME, l'utilisateur a le droit de ne rien declarer. Lui inventer une
  // seance par defaut afficherait un programme qu'il n'a pas demande.
  // -------------------------------------------------------------------------
  function exercicesParJour(progJours) {
    var out = [], i;
    for (i = 0; i < progJours.length; i++) {
      out.push(progJours[i].si === null ? [] : exosDe(progJours[i].si));
    }
    return out;
  }

  // La seance effective : echauffement, puis N exercices de travail, chacun
  // remplace par son equivalent de meme pattern s'il a ete refuse au
  // diagnostic.
  //
  // L'ORDRE DES TROIS TESTS EST LA REGLE METIER, pas un detail :
  //   1. `obRetires` d'abord   — une suppression a la main est PRIORITAIRE ;
  //   2. echauffement et `obAjouts` ensuite — toujours presents ;
  //   3. la coupe par duree en dernier.
  // C'est ce qui fait survivre les decisions de l'utilisateur a un changement
  // de duree de seance : le generateur propose, l'utilisateur tranche, et le
  // generateur ne reecrit pas la decision.
  function exosDe(idx) {
    var S = SEANCES[idx] || SEANCES[0], gardes = [], i, cle, e, refuse, out = [], rang;

    for (i = 0; i < S.exos.length; i++) {
      cle = S.code + "-" + i;
      if (state.obRetires[cle]) continue;
      if (i === 0 || state.obAjouts[cle]) { gardes.push({ e: S.exos[i], rang: i }); continue; }
      if (i <= nbTravail()) gardes.push({ e: S.exos[i], rang: i });
    }

    for (i = 0; i < gardes.length; i++) {
      e = gardes[i].e;
      rang = gardes[i].rang;
      refuse = !!state.obRefus[S.code + "-" + rang];
      if (!refuse) { out.push(e); continue; }
      // Un exercice refuse cede la place a son remplacant. Le materiel et les
      // consignes sont vides parce qu'ils decrivaient l'exercice d'origine :
      // les garder afficherait la fiche du mouvement qu'on vient d'ecarter.
      out.push({
        nom: e.remp, remplace: e.nom, mat: "", lines: [],
        muscle: e.muscle, n: e.n, kg: e.kg, reps: e.reps,
        unite: e.unite, last: e.last, remp: e.remp
      });
    }
    return out;
  }

  // Le vivier du bouton « Ajouter un exercice » : exactement ce que la duree a
  // ecarte, plus ce qui a ete retire a la main.
  function exosDisponibles(idx) {
    var S = SEANCES[idx] || SEANCES[0], out = [], i, cle;
    for (i = 1; i < S.exos.length; i++) {
      cle = S.code + "-" + i;
      if (state.obRetires[cle]) { out.push({ e: S.exos[i], rang: i, cle: cle }); continue; }
      if (i > nbTravail() && !state.obAjouts[cle]) out.push({ e: S.exos[i], rang: i, cle: cle });
    }
    return out;
  }

  // Point d'entree unique. Tout ecran qui a besoin du programme appelle CECI et
  // rien d'autre : deux derivations paralleles finiraient par se contredire.
  function deriver() {
    var progJours = deriverJours();
    var slots = aplatir(progJours);
    var slotsSalle = filtrerSlots(slots, "salle");
    var slotsCours = filtrerSlots(slots, "cours");
    var slotsRun = filtrerSlots(slots, "run");
    return {
      progJours: progJours,
      slots: slots,
      slotsSalle: slotsSalle,
      slotsCours: slotsCours,
      slotsRun: slotsRun,
      progEx: exercicesParJour(progJours),
      jourDe: faireJourDe(slotsSalle),
      siDepart: calculerSiDepart(progJours, slotsSalle),
      aujourdhui: jourIndexAujourdhui()
    };
  }

  /* =========================================================================
     LE JOURNAL DATE
     -------------------------------------------------------------------------
     POURQUOI IL EXISTE, ALORS QUE LA SPEC NE LE DEMANDE PAS.
     Le prototype archive dans `actFaits`, indexe par « jour de semaine + rang
     de creneau » : la cle « 2-0 » designe le mercredi, tous les mercredis. Il
     ne peut donc porter qu'UNE semaine, et il se contredit lui-meme des la
     suivante. Le prototype s'en accommode parce que son ecran Historique lit
     `HISTO`, sept seances ECRITES EN DUR dans ses constantes.

     Livrer ca donnerait a tout le monde le meme historique invente, et la
     seance d'hier n'existerait nulle part. Les trois ecrans de cette etape —
     Historique, Fiche, Progres — lisent tous du passe : sans journal date, ils
     ne peuvent afficher que de la fiction.

     `hist` est donc la SOURCE DE VERITE. `actFaits` reste ecrit parce que la
     spec le liste, mais il est aussi RECALCULE depuis `hist` pour la semaine
     courante : c'est ce qui le fait se vider tout seul le lundi suivant, au
     lieu de garder des coches d'une semaine morte.
     ========================================================================= */

  function cleDate(d) {
    var m = d.getMonth() + 1, j = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (j < 10 ? "0" : "") + j;
  }

  function dateDepuisCle(k) {
    var p = String(k).split("-");
    if (p.length !== 3) return null;
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
    return isNaN(d.getTime()) ? null : d;
  }

  // Lundi de la semaine contenant d. La semaine commence le lundi, comme le
  // reste de l'appli : `getDay()` rend 0 le dimanche, d'ou le cas particulier.
  function lundiDe(d) {
    var r = new Date(d.getTime()), dow = r.getDay();
    r.setDate(r.getDate() + (dow === 0 ? -6 : 1 - dow));
    r.setHours(0, 0, 0, 0);
    return r;
  }

  function jourEcart(a, b) {
    return Math.round((a.getTime() - b.getTime()) / 86400000);
  }

  function histTrie() {
    var h = (state.hist || []).slice();
    h.sort(function (x, y) { return x.d > y.d ? -1 : (x.d < y.d ? 1 : 0); });
    return h;
  }

  // Les creneaux valides de la SEMAINE COURANTE, derives du journal. C'est ce
  // qui alimente la bande de la semaine et le selecteur de creneau.
  function faitsSemaine() {
    var h = state.hist || [], out = {}, i, d, lundi = lundiDe(new Date()), e;
    for (i = 0; i < h.length; i++) {
      d = dateDepuisCle(h[i].d);
      if (!d) continue;
      e = jourEcart(d, lundi);
      if (e < 0 || e > 6) continue;
      out[h[i].ji + "-" + h[i].k] = 1;
    }
    return out;
  }

  // Nombre de seances sur les N derniers jours, toutes disciplines.
  function histDepuis(nJours) {
    var h = state.hist || [], out = [], i, d, auj = new Date();
    auj.setHours(0, 0, 0, 0);
    for (i = 0; i < h.length; i++) {
      d = dateDepuisCle(h[i].d);
      if (d && jourEcart(auj, d) <= nJours && jourEcart(auj, d) >= 0) out.push(h[i]);
    }
    return out;
  }

  // La SERIE : nombre de jours d'entrainement consecutifs, en remontant depuis
  // aujourd'hui et en ne comptant que les JOURS PREVUS. Un jour non prevu qui
  // ne porte rien ne casse pas la serie — sinon le dimanche la remettrait a
  // zero toutes les semaines.
  function serieCourante() {
    var d = deriver(), h = state.hist || [], parDate = {}, i, n = 0;
    var cur = new Date(); cur.setHours(0, 0, 0, 0);
    var prevus = {};
    for (i = 0; i < d.progJours.length; i++) prevus[d.progJours[i].ji] = 1;
    for (i = 0; i < h.length; i++) parDate[h[i].d] = 1;
    if (!d.progJours.length) return 0;

    // On part d'hier si aujourd'hui est prevu mais pas encore fait : une seance
    // pas encore faite ne casse pas une serie, elle ne l'a pas encore
    // prolongee.
    var ji = (cur.getDay() + 6) % 7;
    if (prevus[ji] && !parDate[cleDate(cur)]) cur.setDate(cur.getDate() - 1);

    for (i = 0; i < 400; i++) {
      ji = (cur.getDay() + 6) % 7;
      if (prevus[ji]) {
        if (parDate[cleDate(cur)]) n++;
        else break;
      }
      cur.setDate(cur.getDate() - 1);
    }
    return n;
  }

  // Assiduite : seances faites sur seances prevues, depuis la premiere trace.
  function assiduite() {
    var d = deriver(), h = state.hist || [], i, prevus = {}, faits = h.length;
    if (!h.length || !d.progJours.length) return 0;
    for (i = 0; i < d.progJours.length; i++) prevus[d.progJours[i].ji] = 1;

    var premiere = null, dd;
    for (i = 0; i < h.length; i++) {
      dd = dateDepuisCle(h[i].d);
      if (dd && (!premiere || dd < premiere)) premiere = dd;
    }
    if (!premiere) return 0;

    var cur = new Date(premiere.getTime()), auj = new Date(), attendus = 0;
    auj.setHours(0, 0, 0, 0);
    while (cur <= auj && attendus < 4000) {
      if (prevus[(cur.getDay() + 6) % 7]) attendus++;
      cur.setDate(cur.getDate() + 1);
    }
    if (!attendus) return 0;
    return Math.min(100, Math.round((faits / attendus) * 100));
  }

  // Les N dernieres seances portant cet exercice, de la plus ancienne a la plus
  // recente : la courbe de charge se lit de gauche a droite.
  function seancesDeExercice(nom, n) {
    var h = histTrie(), out = [], i, j, ex, meilleure;
    for (i = 0; i < h.length && out.length < n; i++) {
      if (h[i].t !== "salle" || !h[i].ex) continue;
      for (j = 0; j < h[i].ex.length; j++) {
        ex = h[i].ex[j];
        if (ex.nom !== nom || !ex.sets.length) continue;
        meilleure = 0;
        for (var k = 0; k < ex.sets.length; k++) {
          if (ex.sets[k].kg > meilleure) meilleure = ex.sets[k].kg;
        }
        out.push({ d: h[i].d, kg: meilleure, sets: ex.sets });
        break;
      }
    }
    return out.reverse();
  }

  // Douze semaines de valeurs hebdomadaires, pour les courbes de l'ecran
  // Progres. Une semaine sans rien vaut 0 et n'est pas trouee : un trou ferait
  // sauter la ligne d'un point a l'autre en cachant l'absence.
  function serieHebdo(mode) {
    var h = state.hist || [], i, s, out = [], lundi = lundiDe(new Date()), sem, val, d, e;
    var seaux = [];
    for (i = 0; i < 12; i++) seaux.push(0);

    for (i = 0; i < h.length; i++) {
      s = h[i];
      d = dateDepuisCle(s.d);
      if (!d) continue;
      e = Math.floor(jourEcart(lundi, lundiDe(d)) / 7);
      if (e < 0 || e > 11) continue;
      sem = 11 - e;
      if (mode === "tonnage") val = s.t === "salle" ? (s.tonnage || 0) : 0;
      else if (mode === "distance") val = s.t === "run" ? nombreOu(s.km, 0) : 0;
      else if (mode === "seances") val = 1;
      else val = 0;
      seaux[sem] += val;
    }

    if (mode === "poids") {
      // Le poids n'est pas un CUMUL : on prend la derniere pesee connue de
      // chaque semaine, et on reporte la precedente sur les semaines sans
      // pesee. Sommer des poids ne voudrait rien dire.
      var pes = state.pesees || [], dernier = 0;
      for (i = 0; i < 12; i++) seaux[i] = null;
      for (i = 0; i < pes.length; i++) {
        d = dateDepuisCle(pes[i].d);
        if (!d) continue;
        e = Math.floor(jourEcart(lundi, lundiDe(d)) / 7);
        if (e < 0 || e > 11) continue;
        seaux[11 - e] = pes[i].kg;
      }
      for (i = 0; i < 12; i++) {
        if (seaux[i] === null) seaux[i] = dernier;
        else dernier = seaux[i];
      }
      // Les semaines d'avant la premiere pesee valent la premiere connue,
      // sinon la courbe partirait de zero et transformerait deux kilos perdus
      // en effondrement.
      var premier = 0;
      for (i = 0; i < 12; i++) { if (seaux[i]) { premier = seaux[i]; break; } }
      for (i = 0; i < 12; i++) { if (!seaux[i]) seaux[i] = premier; else break; }
    }

    for (i = 0; i < 12; i++) out.push(seaux[i]);
    return out;
  }

  // Quels modes la semaine DECLAREE peut produire. Proposer « Distance » a
  // quelqu'un qui ne court pas afficherait une courbe plate a zero, et
  // laisserait croire a une regression.
  function modesDisponibles() {
    var d = deriver(), out = [];
    if (d.slotsSalle.length) out.push({ v: "tonnage", t: "Tonnage", u: "kg" });
    if ((state.pesees || []).length) out.push({ v: "poids", t: "Poids", u: "kg" });
    if (d.slotsRun.length) out.push({ v: "distance", t: "Distance", u: "km" });
    if (d.slots.length) out.push({ v: "seances", t: "Séances", u: "" });
    return out;
  }

  /* =========================================================================
     DIAGNOSTIC — 11 etapes
     -------------------------------------------------------------------------
     Les titres et sous-titres viennent de la constante OB, extraite verbatim
     du prototype. Ce fichier ne les reecrit pas : il les REND.

     Les VALEURS, elles, ne viennent pas de OB. Le prototype y range un prenom,
     un age, deux poids et « 2 800 kcal/j » ecrits en dur, pour peupler ses
     captures. Ici, elles sortent de l'etat et du moteur.
     ========================================================================= */

  var OB_DISC_OPTS = [
    { v: "",      t: "— rien —" },
    { v: "salle", t: "Salle" },
    { v: "cours", t: "Cours collectif" },
    { v: "run",   t: "Running" }
  ];

  // Minutes reelles derriere chaque entree de DUREES. Le libelle « 1 h 15 » ne
  // se parse pas ; cette table est la traduction, et elle a la meme longueur
  // que DUREES, ce qu'un controle verifie plus bas.
  var OB_DUREE_MIN = [30, 45, 60, 75];

  var OB_SEXES = ["Homme", "Femme"];

  // -------------------------------------------------------------------------
  // LE PONT VERS LE MOTEUR
  // -------------------------------------------------------------------------
  // Le diagnostic parle en `ob*`, le moteur greffe parle en profil. Cette
  // fonction est le SEUL endroit qui connait les deux vocabulaires. Sans elle,
  // chaque ecran traduirait dans son coin et les traductions divergeraient.
  //
  // `days` ne retient que les jours qui portent AU MOINS une activite : un jour
  // coche mais vide est legitime cote diagnostic, mais il n'a rien a faire dans
  // le calcul des calories, qui compte des seances.
  function profilDepuisEtat() {
    var d = deriver(), jours = [], kinds = {}, i, j, aSalle, aRun;

    for (i = 0; i < d.progJours.length; i++) {
      j = d.progJours[i];
      if (j.vide) continue;
      // Les jours du moteur vont de 1 (lundi) a 7 (dimanche) ; les notres de
      // 0 a 6. dayKey() du moteur attend le format de getDay(), ou dimanche
      // vaut 0 : notre index 6 doit donc devenir 0, et les autres +1.
      jours.push(j.ji === 6 ? 0 : j.ji + 1);
      aSalle = false; aRun = false;
      for (var k = 0; k < j.acts.length; k++) {
        if (j.acts[k].t === "salle") aSalle = true;
        if (j.acts[k].t === "run") aRun = true;
      }
      if (aRun && !aSalle) kinds[j.ji === 6 ? 0 : j.ji + 1] = "course";
    }

    var equip = [];
    var CORRESP = ["mach", "halt", "barre", "trac", "elast", "bw"];
    for (i = 0; i < state.obEquip.length && i < CORRESP.length; i++) {
      if (state.obEquip[i]) equip.push(CORRESP[i]);
    }

    var nCourse = 0, nSalle = 0;
    for (i = 0; i < d.slotsRun.length; i++) nCourse++;
    for (i = 0; i < d.slotsSalle.length; i++) nSalle++;

    return {
      name: state.obPrenom,
      sex: state.obSexe === 1 ? "f" : "h",
      startWeight: nombreOu(state.obPoids, 80),
      targetWeight: nombreOu(state.obPoidsCible, 75),
      minutes: OB_DUREE_MIN[state.obDuree] || 45,
      days: jours,
      dayKinds: kinds,
      discipline: nSalle && nCourse ? "mixte" : (nCourse && !nSalle ? "course" : "muscu"),
      equipment: equip,
      objectif: ["perte", "maintien", "prise"][state.obObjectif] || "perte"
    };
  }

  function nombreOu(txt, defaut) {
    var v = parseFloat(String(txt).replace(",", "."));
    return isNaN(v) ? defaut : v;
  }

  // -------------------------------------------------------------------------
  // ETAPE 5 — LE BLOC DISCIPLINE
  // -------------------------------------------------------------------------
  // Une LISTE DEROULANTE NATIVE par creneau, jamais un bouton a taper
  // plusieurs fois : avec un bouton, on ne sait pas combien de fois appuyer
  // pour atteindre « Running », et on decouvre les options en les traversant.
  //
  // LE POINT DELICAT EST DANS `poserSlot` : on ne reecrit le creneau QUE si le
  // type change. Reecrire a chaque selection effacerait le nom deja saisi
  // (« Pilates ») des qu'on rouvre la liste sans rien changer.
  function poserSlot(ji, k, v) {
    var liste = (state.obAct[ji] || []).slice(), copie2 = {}, kk;

    if (!v) {
      liste.splice(k, 1);
    } else if (!liste[k] || liste[k].t !== v) {
      liste[k] = v === "cours" ? { t: "cours", nom: "", min: 60, nat: 1 }
               : v === "run"   ? { t: "run", lieu: 0 }
               : { t: "salle" };
    }

    for (kk in state.obAct) { if (has(state.obAct, kk)) copie2[kk] = state.obAct[kk]; }
    copie2[ji] = liste;
    poser({ obAct: copie2, slotAuj: 0 });
  }

  function majCours(ji, k, champ, valeur) {
    var liste = (state.obAct[ji] || []).slice(), copie2 = {}, kk, o = {}, p;
    if (!liste[k]) return;
    for (p in liste[k]) { if (has(liste[k], p)) o[p] = liste[k][p]; }
    o[champ] = valeur;
    liste[k] = o;
    for (kk in state.obAct) { if (has(state.obAct, kk)) copie2[kk] = state.obAct[kk]; }
    copie2[ji] = liste;
    poser({ obAct: copie2 });
  }

  function selectSlotHtml(ji, k, act, libre) {
    var i, o, sel, style = "";
    if (!libre && act) {
      style = "background:" + DISC[act.t].bg + ";border-color:" + DISC[act.t].bd +
              ";color:" + DISC[act.t].fg + ";";
    }
    var h = '<select class="ob-select' + (libre ? " ob-select-libre" : "") + '"' +
            ' style="' + style + '"' +
            ' data-action="ob-slot" data-ji="' + ji + '" data-k="' + k + '"' +
            ' aria-label="Activité du ' + esc(JOURS[ji]) + (k > 0 ? ", 2e séance" : "") + '">';
    for (i = 0; i < OB_DISC_OPTS.length; i++) {
      o = OB_DISC_OPTS[i];
      sel = (libre ? o.v === "" : o.v === act.t);
      h += '<option value="' + o.v + '"' + (sel ? " selected" : "") + '>' + esc(o.t) + "</option>";
    }
    return h + "</select>";
  }

  function blocCoursHtml(ji, k, act) {
    var i, h = "";
    h += '<div class="ob-cours">';

  /* =========================================================================
     ECRAN « AUJOURD'HUI »
     -------------------------------------------------------------------------
     Ordre impose par le README section 9, et respecte ligne pour ligne :
       1. date longue + titre + serie
       2. bande de la semaine, coloree par discipline, suffixe « +1 »
       3. phrase de motivation
       4. selecteur de creneau, seulement si la journee porte deux activites
       5. la carte du jour, dans une de ses quatre variantes
       6. resume nutrition
       7. carte de pesee
     ========================================================================= */

  var JOURS_LONGS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
  var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
              "août", "septembre", "octobre", "novembre", "décembre"];

  function dateLongue(d) {
    var s = JOURS_LONGS[(d.getDay() + 6) % 7] + " " + d.getDate() + " " + MOIS[d.getMonth()];
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  // NUMERO DE JOUR REEL, PAS UNE CONSTANTE. Le prototype ecrit `jour = 20690`,
  // le numero du 24 aout 2026, pour que ses captures ne bougent pas. Recopier ce
  // nombre figerait la variante de motivation pour toujours : la meme phrase
  // tous les jours, a vie. On le calcule depuis la date LOCALE, pour que le
  // changement se fasse a minuit chez l'utilisateur et pas a minuit UTC.
  function jourNumero() {
    var d = new Date();
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  // -------------------------------------------------------------------------
  // MOTIVATION
  // -------------------------------------------------------------------------
  // Premier contexte dont la condition passe, du plus specifique au plus
  // general. La variante est choisie par un hachage du nom du contexte combine
  // au numero du jour : meme phrase toute la journee, une autre demain. Un
  // tirage aleatoire changerait de phrase a chaque rendu, donc a chaque
  // toucher, et l'ecran paraitrait instable.
  function motivation(ctx) {
    var i, k, m, h, p, val;
    var jour = jourNumero();
    for (i = 0; i < MOTIV.length; i++) {
      m = MOTIV[i];
      if (!m.si(ctx)) continue;
      h = 0;
      for (k = 0; k < m.k.length; k++) { h = (h * 31 + m.k.charCodeAt(k)) % 9973; }
      p = m.v[(jour + h) % m.v.length];
      val = function (x) { return typeof x === "function" ? x(ctx) : x; };
      return { cle: m.k, head: val(p.head), sub: val(p.sub) };
    }
    return { cle: "", head: "", sub: "" };
  }

  // Le contexte est bati sur des donnees REELLES, jamais sur des valeurs
  // d'exemple. Ce qui manque encore vaut null ou zero, et les conditions de
  // MOTIV sont ecrites pour le supporter : un contexte incomplet retombe sur
  // « default », il n'invente pas.
  //
  // Le contexte lit le JOURNAL DATE, donc il dit vrai au-dela de la semaine
  // courante. `palier` compare le total aux paliers de BADGES ; `plateau` et
  // `tonnageDiff` comparent les deux dernieres seances de salle du meme code.
  function contexteMotivation() {
    var d = deriver(), h = histTrie(), i, total = h.length;
    var p = profilDepuisEtat();
    var reste = (p.startWeight && p.targetWeight) ? (p.startWeight - p.targetWeight) : null;
    var auj = jourIndexAujourdhui(), jourSeance = false;
    for (i = 0; i < d.progJours.length; i++) { if (d.progJours[i].ji === auj) jourSeance = true; }

    var palier = false;
    for (i = 0; i < MOTEUR.BADGES.length; i++) { if (MOTEUR.BADGES[i].n === total) palier = true; }

    // Tonnage : ecart entre les deux dernieres seances de salle de MEME code.
    // Comparer un PUSH a un LEGS ne voudrait rien dire.
    var tonnageDiff = 0, vues = {}, prem = null, sec = null;
    for (i = 0; i < h.length; i++) {
      if (h[i].t !== "salle") continue;
      if (!prem) { prem = h[i]; continue; }
      if (!sec && h[i].code === prem.code) { sec = h[i]; break; }
    }
    if (prem && sec) tonnageDiff = (prem.tonnage || 0) - (sec.tonnage || 0);

    // Plateau : le poids n'a pas bouge de plus de 300 g sur deux semaines.
    var pes = state.pesees || [], plateau = false;
    if (pes.length >= 2) {
      var dernier = pes[pes.length - 1], avant = pes[0], j;
      for (j = pes.length - 1; j >= 0; j--) {
        if (jourEcart(dateDepuisCle(dernier.d), dateDepuisCle(pes[j].d)) >= 14) { avant = pes[j]; break; }
      }
      plateau = Math.abs(dernier.kg - avant.kg) < 0.3;
    }

    var perdu = pes.length ? (pes[0].kg - pes[pes.length - 1].kg) : 0;

    return {
      total: total,
      streak: serieCourante(),
      assiduite: assiduite(),
      reste: reste,
      resteTxt: reste === null ? "" : frDec(reste),
      kgTxt: frDec(perdu > 0 ? perdu : 0),
      palier: palier,
      plateau: plateau,
      tonnageDiff: tonnageDiff,
      tonTxt: frDec(Math.abs(tonnageDiff)),
      avance: false,
      jourSeance: jourSeance
    };
  }

  function frDec(n) {
    var s = String(Math.round(n * 10) / 10);
    return s.replace(".", ",");
  }

  // -------------------------------------------------------------------------

  // Sept cases, une par jour. Chacune porte l'initiale et le CODE de son

  // seance serait invisible sur l'ecran qui sert justement a lire la semaine.
  function bandeSemaineHtml() {
    var d = deriver(), auj = jourIndexAujourdhui(), h = "", i, j, jr, code, dd, fait, cle;

    h += '<div class="sem" role="img" aria-label="Ta semaine">';

        h += '<div class="sem-c' + (i === auj ? " sem-auj" : "") + '">' +

           (fait ? '<span class="sem-ok" aria-label="faite">✓</span>' : "") +
           "</div>";
    }
    return h + "</div>";
  }

    h += '<p class="cr-p">Une pesée ne vaut que comparée à la précédente. ' +

  // -------------------------------------------------------------------------
  // ASSEMBLAGE
  // -------------------------------------------------------------------------
  function actiteDuJour() {
    var d = deriver(), auj = jourIndexAujourdhui(), i, jr = null;
    for (i = 0; i < d.progJours.length; i++) { if (d.progJours[i].ji === auj) jr = d.progJours[i]; }

    // « Faire une autre seance » remplace l'activite du jour par une seance de
    // salle choisie a la main. Le drapeau est necessaire : sans lui, la carte
    // continuerait d'afficher le cours du jour, et l'utilisateur ne verrait pas
    // ce qu'il vient de demander. Il retombe des qu'on change de creneau ou de
    // jour, parce que c'est un choix ponctuel, pas un reglage.
    if (state.coursQuitte) {
      return { jour: jr, acts: jr ? jr.acts : [],
               act: { t: "salle", si: state.seance, ji: auj, k: 0, cle: auj + "-0" } };
    }

    if (!jr || jr.vide) return { jour: jr, acts: [], act: null };
    var idx = state.slotAuj < jr.acts.length ? state.slotAuj : 0;
    return { jour: jr, acts: jr.acts, act: jr.acts[idx] };
  }

  function jourHtml() {
    var ctx = contexteMotivation(), mot = motivation(ctx), du = actiteDuJour();
    var h = "", serie = ctx.streak;

    h += '<div class="jour-r"><h1 class="ecran-titre">Aujourd\'hui</h1>' +
         '<div class="serie" aria-label="' + serie + ' séances validées cette semaine">' +
         '<span aria-hidden="true">🔥</span><span class="serie-n num">' + serie + "</span></div></div>";
    h += "</header>";

    h += bandeSemaineHtml();

    if (mot.head) {
      h += '<section class="motiv"><div class="motiv-h">' + esc(mot.head) + "</div>" +

    }

  /* =========================================================================
     MODE ENTRAINEMENT, ENCHAINEMENT, FIN DE SEANCE
     -------------------------------------------------------------------------
     Plein ecran sombre, UN SEUL exercice visible. Quatre phases, portees par
     `state.phase` : "set" (on charge la barre), "repos" (le decompte tourne),
     "transition" (l'exercice est fini, on choisit le suivant) et "fin".
     ========================================================================= */

  var REPOS_DEFAUT = 90;

  function mmss(n) {
    var m = Math.floor(n / 60), s = n % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function exosCourants() { return exosDe(state.seance); }

  function faitsOu() {
    var ex, i, out;
    if (state.faits) return state.faits;
    ex = exosCourants();
    out = [];
    for (i = 0; i < ex.length; i++) out.push([]);
    return out;
  }

  function copierFaits(f) {
    var out = [], i;
    for (i = 0; i < f.length; i++) out.push(f[i].slice());
    return out;
  }

  // -------------------------------------------------------------------------
  // OUVRIR UN EXERCICE
  // -------------------------------------------------------------------------
  // Les steppers reprennent la DERNIERE serie faite sur cet exercice, sinon la
  // prescription. Repartir de zero a chaque ouverture obligerait a remonter la
  // charge a la main a chaque serie.
  function ouvrirExercice(i) {
    var ex = exosCourants(), e = ex[i], f = faitsOu();
    if (!e) return;
    var dernier = f[i] && f[i].length ? f[i][f[i].length - 1] : null;
    poser({
      ecran: "salle", demarre: true, tIdx: i, phase: "set", faits: f,
      kg: dernier ? dernier.kg : e.kg,
      reps: dernier ? dernier.reps : e.reps,
      tech: false, chrono: state.chrono || 0
    });
  }

  // -------------------------------------------------------------------------
  // VALIDER UNE SERIE
  // -------------------------------------------------------------------------
  // Quand l'exercice atteint son compte de series, on n'enchaine PAS en
  // silence : on ouvre l'ecran d'enchainement. Sauter un exercice sans l'avoir
  // vu etait le reproche principal du prototype.
  function validerSerie() {
    var ex = exosCourants(), exo = ex[state.tIdx], f0 = faitsOu(), faits, i, reste = false;
    if (!exo) return;
    if (f0[state.tIdx].length >= exo.n) return;

    faits = copierFaits(f0);
    faits[state.tIdx].push({ kg: state.kg, reps: state.reps });

    if (faits[state.tIdx].length >= exo.n) {
      for (i = 0; i < ex.length; i++) {
        if (faits[i].length < ex[i].n) { reste = true; break; }
      }
      poser({ faits: faits, finiIdx: state.tIdx,
              phase: reste ? "transition" : "fin",
              ecran: reste ? "trans" : "salle" });
    } else {
      poser({ faits: faits, phase: "repos", repos: state.repos || REPOS_DEFAUT });
    }
  }

  // -------------------------------------------------------------------------
  // LE CHRONO
  // -------------------------------------------------------------------------
  // Un seul intervalle pour toute l'appli, arme au demarrage. Il ne fait rien
  // hors du mode entrainement : le tester ici plutot que d'armer et desarmer
  // evite la classe de bugs ou deux intervalles se superposent.
  var _tic = null;

  function armerChrono() {
    if (_tic) return;
    _tic = window.setInterval(function () {
      if (state.ecran !== "salle" || !state.demarre) return;
      if (state.phase === "repos") {
        if (state.repos <= 1) {
          state.phase = "set";
          state.repos = REPOS_DEFAUT;
        } else {
          state.repos = state.repos - 1;
        }
        state.chrono = state.chrono + 1;
        rendre();
      } else if (state.phase === "set") {
        state.chrono = state.chrono + 1;
        majChrono();
      }
    }, 1000);
  }

  // Pendant une serie, SEUL le chiffre du chrono change. Reconstruire tout
  // l'ecran chaque seconde relancerait le rendu 3 600 fois par heure et
  // reprendrait le focus des champs. On touche donc le seul noeud concerne.
  function majChrono() {
    var n = document.getElementById("chrono-v");
    if (n) n.innerHTML = esc(mmss(state.chrono));
  }

  function stepper(action, val, unite, libelle) {
    return '<div class="st"><div class="st-l">' + esc(libelle) + "</div>" +
      '<div class="st-r">' +
      '<button type="button" class="st-b" data-action="' + action + '" data-d="-1"' +
      ' aria-label="Diminuer ' + esc(libelle) + '">−</button>' +
      '<div class="st-v num">' + esc(String(val).replace(".", ",")) +
      '<span class="st-u">' + esc(unite) + "</span></div>" +
      '<button type="button" class="st-b" data-action="' + action + '" data-d="1"' +
      ' aria-label="Augmenter ' + esc(libelle) + '">+</button></div></div>';
  }

  // -------------------------------------------------------------------------
  // L'ECRAN
  // -------------------------------------------------------------------------
  function salleHtml() {
    var ex = exosCourants(), exo = ex[state.tIdx], f = faitsOu();
    if (!exo) return '<div class="salle"><p class="sa-vide">Aucun exercice.</p>' +
      '<button type="button" class="sa-quitter" data-action="quitter-seance">Quitter</button></div>';

    if (state.phase === "fin") return finHtml();

    var faites = f[state.tIdx] ? f[state.tIdx].length : 0;
    var h = '<div class="salle">';

    h += '<div class="sa-haut">';
    h += '<button type="button" class="sa-x" data-action="quitter-seance" aria-label="Quitter la séance">✕</button>';
    h += '<div class="sa-code">' + esc(SEANCES[state.seance].code) + "</div>";
    h += '<div class="sa-chrono num" id="chrono-v">' + esc(mmss(state.chrono)) + "</div>";
    h += "</div>";

    h += '<div class="sa-exo">' + esc(exo.nom) + "</div>";
    h += '<div class="sa-mat">' + esc(exo.mat || "") + "</div>";
    h += '<div class="sa-serie">Série <b class="num">' + (faites + 1) + "</b> sur <b class=\"num\">" +
         exo.n + "</b></div>";

    if (state.phase === "repos") {
      h += '<div class="sa-repos"><div class="sa-repos-l">Repos</div>' +
           '<div class="sa-repos-v num">' + esc(mmss(state.repos)) + "</div>" +
           '<div class="sa-repos-r">' +
           '<button type="button" class="sa-repos-b" data-action="repos-regler" data-d="-15">−15 s</button>' +
           '<button type="button" class="sa-repos-b" data-action="repos-passer">Passer</button>' +
           '<button type="button" class="sa-repos-b" data-action="repos-regler" data-d="15">+15 s</button>' +
           "</div></div>";
    } else {
      h += stepper("kg-pas", state.kg, exo.unite === "min" ? "" : " kg", "Charge");
      h += stepper("reps-pas", state.reps, exo.unite ? " " + exo.unite : " reps",
                   exo.unite === "min" ? "Durée" : "Répétitions");

      // REPRENDRE LA SERIE PRECEDENTE, EN UN TOUCHER.
      //
      // Fonctionnalite de la v1.20.0, perdue au passage : la maquette n'a
      // aucun ecran de mode entrainement, donc elle ne pouvait pas la porter,
      // et je ne l'ai pas retrouvee tout seul. Signalee par Olivier a l'usage.
      //
      // LE BOUTON ANNONCE CE QU'IL VA ECRIRE. « 65 × 8 » plutot que
      // « Refaire » : on sait avant de toucher, et on ne decouvre pas la
      // valeur apres coup. Il n'existe JAMAIS sur la premiere serie, faute de
      // precedente a reprendre.
      //
      // Il ECRIT vraiment, par le meme chemin que la saisie a la main : le
      // tonnage, l'historique et la fiche d'exercice le comptent comme une
      // serie ordinaire, parce que c'en est une.
      if (faites > 0) {
        var prec = f[state.tIdx][faites - 1];
        h += '<button type="button" class="sa-reprendre" data-action="reprendre-serie">' +
             '<span class="sa-r-l">Comme la précédente</span>' +
             '<span class="sa-r-v num">' + esc(String(prec.kg).replace(".", ",")) +
             (exo.unite === "min" ? "" : " kg") + " × " + prec.reps +
             (exo.unite ? " " + exo.unite : "") + "</span></button>";
      }

      h += '<button type="button" class="sa-valider" data-action="valider-serie">' +
           "Valider la série</button>";
    }

    if (faites) {
      h += '<div class="sa-faites">';
      for (var i = 0; i < f[state.tIdx].length; i++) {
        h += '<span class="sa-f num">' + esc(String(f[state.tIdx][i].kg).replace(".", ",")) +
             " × " + f[state.tIdx][i].reps + "</span>";
      }
      h += "</div>";
    }

    h += '<button type="button" class="sa-lien" data-action="aller-trans">Voir les autres exercices</button>';
    return h + "</div>";
  }

  // ECRAN D'ENCHAINEMENT : le suivant est PROPOSE, les autres restent
  // accessibles en un toucher. C'est la reponse au reproche principal.
  function transHtml() {
    var ex = exosCourants(), f = faitsOu(), i, suivant = -1, e, n;
    for (i = 0; i < ex.length; i++) {
      if (f[i].length < ex[i].n && i !== state.finiIdx) { suivant = i; break; }
    }

    var h = '<div class="salle">';
    h += '<div class="sa-haut"><button type="button" class="sa-x" data-action="quitter-seance"' +
         ' aria-label="Quitter la séance">✕</button>' +
         '<div class="sa-code">' + esc(SEANCES[state.seance].code) + "</div>" +
         '<div class="sa-chrono num">' + esc(mmss(state.chrono)) + "</div></div>";

    h += '<div class="tr-t">Fin de l\'exercice</div>';
    if (ex[state.finiIdx]) {
      h += '<div class="tr-fini">' + esc(ex[state.finiIdx].nom) + " · " +
           '<span class="num">' + f[state.finiIdx].length + "</span> séries</div>";
    }

    if (suivant >= 0) {
      h += '<button type="button" class="tr-suivant" data-action="ouvrir-exo" data-i="' + suivant + '">' +
           '<span class="tr-s-l">Ensuite</span>' +
           '<span class="tr-s-n">' + esc(ex[suivant].nom) + "</span>" +
           '<span class="tr-s-d num">' + esc(ex[suivant].n + " × " + ex[suivant].reps +
           (ex[suivant].unite ? " " + ex[suivant].unite : "")) + "</span></button>";
    }

    h += '<div class="tr-autres-t">Ou reprends celui que tu veux</div><ul class="tr-liste">';
    for (i = 0; i < ex.length; i++) {
      e = ex[i];
      n = f[i].length;
      h += '<li><button type="button" class="tr-a' + (n >= e.n ? " tr-a-fini" : "") + '"' +
           ' data-action="ouvrir-exo" data-i="' + i + '">' +
           '<span class="tr-a-n">' + esc(e.nom) + "</span>" +
           '<span class="tr-a-d num">' + n + "/" + e.n + (n >= e.n ? " ✓" : "") + "</span></button></li>";
    }
    h += "</ul>";
    h += '<button type="button" class="sa-valider" data-action="finir-seance">Terminer la séance</button>';
    return h + "</div>";
  }

  function finHtml() {
    var ex = exosCourants(), f = faitsOu(), i, j, series = 0, tonnage = 0;
    for (i = 0; i < ex.length; i++) {
      series += f[i].length;
      for (j = 0; j < f[i].length; j++) {
        if (ex[i].unite !== "min") tonnage += f[i][j].kg * f[i][j].reps;
      }
    }
    var mot = motivation(contexteMotivation());

    var h = '<div class="salle">';
    h += '<div class="fin-t">Séance terminée</div>';
    h += '<div class="fin-code">' + esc(SEANCES[state.seance].code) + "</div>";
    h += '<div class="fin-chiffres">' +
         '<div class="fin-c"><span class="fin-n num">' + series + "</span><span>séries</span></div>" +
         '<div class="fin-c"><span class="fin-n num">' + Math.round(tonnage) + "</span><span>kg</span></div>" +
         '<div class="fin-c"><span class="fin-n num">' + esc(mmss(state.chrono)) + "</span><span>durée</span></div>" +
         "</div>";
    if (mot.head) {
      h += '<div class="fin-motiv"><div class="motiv-h">' + esc(mot.head) + "</div>" +
           '<div class="motiv-s">' + esc(mot.sub) + "</div></div>";
    }
    h += '<button type="button" class="sa-valider" data-action="enregistrer-seance">' +
         "Enregistrer la séance</button>";
    return h + "</div>";
  }

  // -------------------------------------------------------------------------
  // ENREGISTREMENT
  // -------------------------------------------------------------------------
  // UNE SEULE PORTE pour les trois disciplines. Valider un cours ou une sortie
  // fait EXACTEMENT ce que fait une seance de salle : ecrire actFaits, poser le
  // texte d'archive, et naviguer vers l'Historique. Trois chemins separes
  // auraient diverge des la premiere retouche, et deux disciplines sur trois
  // seraient restees invisibles dans la liste.
  // `enr` porte le detail de la seance ; `texte` est sa ligne d'archive.
  // UNE SEULE ECRITURE POUR LES TROIS DISCIPLINES : c'est ce qui garantit
  // qu'un cours et une sortie apparaissent dans l'Historique au meme titre
  // qu'une seance de salle, et pas seulement dans un bandeau qu'on ferme.
  function archiver(enr, texte) {
    var h = (state.hist || []).slice(), i, maj = {}, k;

    // Une meme date et un meme creneau ne peuvent porter qu'une seance : on
    // remplace au lieu d'empiler. Sans ca, valider deux fois de suite
    // comptabiliserait deux seances et fausserait tonnage comme assiduite.
    for (i = h.length - 1; i >= 0; i--) {
      if (h[i].d === enr.d && h[i].ji === enr.ji && h[i].k === enr.k) h.splice(i, 1);
    }
    h.push(enr);
    // Borne haute : au-dela, la sauvegarde grossit sans fin. Deux ans de
    // seances a raison de cinq par semaine tiennent largement dessous.
    if (h.length > 600) h = h.slice(h.length - 600);

    state.hist = h;
    maj = faitsSemaine();
    for (k in state.actFaits) { if (has(state.actFaits, k) && !maj[k]) maj[k] = 0; }

    poser({
      hist: h,
      actFaits: maj,
      archive: texte,
      ecran: "histo",
      phase: "set", demarre: false, faits: null, tIdx: 0, chrono: 0, finiIdx: 0
    });
    window.scrollTo(0, 0);
  }

  function enregistrerSeance() {
    var ex = exosCourants(), f = faitsOu(), i, j, series = 0, tonnage = 0, detail = [];
    var d = deriver(), auj = jourIndexAujourdhui(), k = null;

    for (i = 0; i < ex.length; i++) {
      series += f[i].length;
      for (j = 0; j < f[i].length; j++) {
        if (ex[i].unite !== "min") tonnage += f[i][j].kg * f[i][j].reps;
      }
      // On garde le detail serie par serie : c'est lui, et lui seul, qui
      // permettra a la fiche d'exercice de tracer une courbe de charge.
      if (f[i].length) detail.push({ nom: ex[i].nom, unite: ex[i].unite || "", sets: f[i].slice() });
    }

    // On archive sur le CRENEAU du jour qui porte cette seance, pas sur le
    // premier : une salle peut occuper le second.
    for (i = 0; i < d.slotsSalle.length; i++) {
      if (d.slotsSalle[i].ji === auj && d.slotsSalle[i].a.si === state.seance) {
        k = d.slotsSalle[i].a.k;
      }
    }
    if (k === null) k = state.slotAuj || 0;

    archiver({
      d: cleDate(new Date()), ji: auj, k: k, t: "salle",
      si: state.seance, code: SEANCES[state.seance].code,
      exos: detail.length, tonnage: Math.round(tonnage), series: series,
      sec: state.chrono, ex: detail
    }, SEANCES[state.seance].code + " · " + detail.length + " exos · " +
       Math.round(tonnage) + " kg · " + mmss(state.chrono));
  }

  function validerActivite(ji, k) {
    var liste = state.obAct[ji] || [], a = liste[k], txt, enr;
    if (!a) return;

    if (a.t === "cours") {
      txt = (a.nom || "Cours") + " · " + NATURES[a.nat].t + " · " + a.min + " min";
      enr = { d: cleDate(new Date()), ji: ji, k: k, t: "cours",
              nom: a.nom || "Cours", nat: a.nat, min: a.min };
    } else if (a.t === "run") {
      txt = "Running · " + LIEUX[a.lieu].t +
            (state.runKm ? " · " + state.runKm + " km" : "") +
            (state.runMin ? " · " + state.runMin + " min" : "");
      enr = { d: cleDate(new Date()), ji: ji, k: k, t: "run",
              lieu: a.lieu, km: state.runKm, minutes: state.runMin };
    } else {
      txt = "Séance de salle";
      enr = { d: cleDate(new Date()), ji: ji, k: k, t: "salle",
              si: a.si, code: SEANCES[a.si].code, exos: 0, tonnage: 0, series: 0, sec: 0, ex: [] };
    }
    archiver(enr, txt);
  }

  // La pesee entre dans SA propre liste, pas dans le journal des seances : ce
  // n'est pas un entrainement, et la melanger fausserait le compte de seances.
  function noterPesee() {
    var p = (state.pesees || []).slice(), i, cle = cleDate(new Date());
    var kg = nombreOu(state.obPoids, 0);
    if (!kg) return;
    for (i = p.length - 1; i >= 0; i--) { if (p[i].d === cle) p.splice(i, 1); }
    p.push({ d: cle, kg: kg });
    poser({ pesees: p, peseeFaite: true });
  }

  function demarrerSeance() {
    var ex = exosCourants(), i, f = [];
    for (i = 0; i < ex.length; i++) f.push([]);
    poser({ ecran: "salle", demarre: true, tIdx: 0, phase: "set", faits: f,
            kg: ex[0] ? ex[0].kg : 0, reps: ex[0] ? ex[0].reps : 0,
            chrono: 0, repos: REPOS_DEFAUT, finiIdx: 0 });
  }

  function quitterSeance() {
    poser({ ecran: "jour", demarre: false, phase: "set" });
  }

  /* =========================================================================
     LES TROIS ECRANS DE LECTURE — Historique, Fiche exercice, Progres
     -------------------------------------------------------------------------
     Ils lisent tous le JOURNAL DATE. Aucun ne lit la constante HISTO du
     prototype, qui contient sept seances inventees : les livrer donnerait le
     meme passe a tout le monde.
     ========================================================================= */

  /* -------------------------------------------------------------------------
     LA COURBE, partagee par la fiche d'exercice et l'ecran Progres
     -------------------------------------------------------------------------
     UNE COURBE, PAS UN HISTOGRAMME. Ce sont des valeurs RELEVEES semaine apres
     semaine, pas des quantites empilees : une barre suggere un cumul qui
     n'existe pas.

     CADRAGE SUR LA PLAGE REELLEMENT PARCOURUE : y = 90 - (v-min)/(max-min)*80.
     Une courbe de poids partant d'un zero implicite ecraserait 2,8 kg perdus
     en une ligne plate ; cadrer sur l'amplitude reelle rend le mouvement
     lisible. La consequence arithmetique compte : la valeur MAX tombe donc
     toujours a y=10 et la MIN a y=90, ce qui est exactement ou se posent les
     deux pointilles de repere. Ils coincident par construction, pas par
     reglage — et ils resteront alignes si la formule change, a condition de
     changer les deux ensemble.

     preserveAspectRatio="none" etire le viewBox aux dimensions reelles : c'est
     ce qui permet de raisonner en pourcentages. En contrepartie le trait
     serait etire lui aussi, d'ou vector-effect="non-scaling-stroke" sur la
     ligne — sans lui, l'epaisseur varie avec la largeur de l'ecran.
     ------------------------------------------------------------------------- */
  var COURBE_HAUT = 10, COURBE_BAS = 90;

  function courbePoints(vals) {
    var i, min = null, max = null, out = [], x, y, n = vals.length;
    for (i = 0; i < n; i++) {
      if (min === null || vals[i] < min) min = vals[i];
      if (max === null || vals[i] > max) max = vals[i];
    }
    if (min === null) return { pts: [], min: 0, max: 0 };
    for (i = 0; i < n; i++) {
      x = n > 1 ? (i / (n - 1)) * 100 : 50;
      // Plage nulle : tout est a la meme valeur. On pose la ligne au MILIEU
      // plutot qu'en haut ou en bas, sinon une serie parfaitement stable
      // ressemblerait a un record ou a un effondrement.
      y = (max === min) ? 50 : COURBE_BAS - ((vals[i] - min) / (max - min)) * (COURBE_BAS - COURBE_HAUT);
      out.push({ x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100, v: vals[i] });
    }
    return { pts: out, min: min, max: max };
  }

  function courbeHtml(vals, unite, etiqDepart, etiqFin, ecart) {
    var c = courbePoints(vals), i, ligne = [], aire = [], dernier;
    if (!c.pts.length) return '<div class="cb-vide">Pas encore de mesure.</div>';

    for (i = 0; i < c.pts.length; i++) { ligne.push(c.pts[i].x + "," + c.pts[i].y); }
    aire = ligne.slice();
    aire.unshift(c.pts[0].x + ",100");
    aire.push(c.pts[c.pts.length - 1].x + ",100");
    dernier = c.pts[c.pts.length - 1];

    var h = '<div class="cb">';
    if (ecart) h += '<div class="cb-ecart">' + esc(ecart) + "</div>";
    h += '<div class="cb-axe"><span class="cb-a-h">' + esc(fmtVal(c.max) + unite) + "</span>" +
         '<span class="cb-a-b">' + esc(fmtVal(c.min) + unite) + "</span></div>";
    h += '<div class="cb-zone">';
    h += '<div class="cb-guide cb-guide-h"></div><div class="cb-guide cb-guide-b"></div>';
    h += '<svg class="cb-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
         '<polyline class="cb-aire" points="' + aire.join(" ") + '"></polyline>' +
         '<polyline class="cb-ligne" points="' + ligne.join(" ") + '"' +
         ' vector-effect="non-scaling-stroke"></polyline></svg>';
    h += '<span class="cb-point" style="left:' + dernier.x + "%;top:" + dernier.y + '%"></span>';
    h += "</div>";
    h += '<div class="cb-pieds"><span class="cb-p">' + esc(etiqDepart) + "</span>" +
         '<span class="cb-p">' + esc(etiqFin) + "</span></div>";
    return h + "</div>";
  }

  function fmtVal(v) {
    if (v >= 1000) return String(Math.round(v));
    return String(Math.round(v * 10) / 10).replace(".", ",");
  }

  /* -------------------------------------------------------------------------
     HISTORIQUE
     ------------------------------------------------------------------------- */
  var LEGENDE = [
    { t: "Salle", c: "salle" }, { t: "Cours", c: "cours" }, { t: "Running", c: "run" },
    { t: "Repos", c: "repos" }, { t: "Manqué", c: "manque" }
  ];

  function histoHtml() {
    var h = "", d = deriver(), rech = (state.recherche || "").toLowerCase();

    if (state.archive) {
      h += '<div class="bandeau-ok"><span class="bo-t">Séance enregistrée' +
           '<span class="bo-s">' + esc(state.archive) + "</span></span>" +
           '<button type="button" class="bo-x" data-action="fermer-bandeau" aria-label="Fermer">✕</button></div>';
    }

    h += '<div class="ob-champ"><label class="ob-champ-l" for="rech">Chercher un exercice</label>' +
         '<input id="rech" class="ob-input ob-input-txt" type="text" placeholder="développé, squat…"' +
         ' value="' + esc(state.recherche || "") + '" data-action="recherche"></div>';

    if (rech) { h += resultatsRechercheHtml(rech); }

    h += calendrierHtml();
    h += seancesRecentesHtml();
    return h;
  }

  function resultatsRechercheHtml(rech) {
    var vus = {}, out = [], i, j, s, ex, h = "";
    var jr = histTrie();
    for (i = 0; i < jr.length; i++) {
      s = jr[i];
      if (s.t !== "salle" || !s.ex) continue;
      for (j = 0; j < s.ex.length; j++) {
        ex = s.ex[j];
        if (ex.nom.toLowerCase().indexOf(rech) < 0 || vus[ex.nom]) continue;
        vus[ex.nom] = 1;
        out.push(ex.nom);
      }
    }
    h += '<div class="carte-t">Trouvé' + (out.length > 1 ? "s" : "") + " · " + out.length + "</div>";
    if (!out.length) return h + '<p class="cb-vide">Aucun exercice de ce nom dans ton historique.</p>';
    h += '<ul class="hi-liste">';
    for (i = 0; i < out.length; i++) {
      h += '<li><button type="button" class="hi-l" data-action="fiche" data-nom="' + esc(out[i]) + '">' +
           '<span class="hi-n">' + esc(out[i]) + "</span>" +
           '<span class="hi-chev" aria-hidden="true">›</span></button></li>';
    }
    return h + "</ul>";
  }

  // CALENDRIER DU MOIS. Chaque case porte la couleur de la discipline REELLE
  // du jour, prise dans le journal. Un jour prevu et non fait est « manque »,
  // un jour non prevu est « repos » : ce sont deux etats differents, et les
  // confondre ferait passer un dimanche pour un echec.
  function calendrierHtml() {
    var auj = new Date(), an = auj.getFullYear(), mois = auj.getMonth();
    var premier = new Date(an, mois, 1), nb = new Date(an, mois + 1, 0).getDate();
    var decalage = (premier.getDay() + 6) % 7;
    var d = deriver(), prevus = {}, i, h = "", parDate = {}, jr = state.hist || [];

    for (i = 0; i < d.progJours.length; i++) prevus[d.progJours[i].ji] = 1;
    for (i = 0; i < jr.length; i++) { parDate[jr[i].d] = jr[i].t; }

    h += '<div class="carte-t">' + esc(MOIS[mois]) + " " + an + "</div>";
    h += '<div class="cal">';
    for (i = 0; i < 7; i++) {
      h += '<span class="cal-h" aria-hidden="true">' + esc(JOURS[i].charAt(0)) + "</span>";
    }
    for (i = 0; i < decalage; i++) h += '<span class="cal-v"></span>';

    for (i = 1; i <= nb; i++) {
      var dd = new Date(an, mois, i), cle = cleDate(dd), ji = (dd.getDay() + 6) % 7;
      var cls = "cal-c", st = "";
      if (parDate[cle]) {
        cls += " cal-fait";
        st = "background:" + DISC[parDate[cle]].bg + ";color:" + DISC[parDate[cle]].fg;
      } else if (dd > auj) {
        cls += " cal-avenir";
      } else if (prevus[ji]) {
        cls += " cal-manque";
      } else {
        cls += " cal-repos";
      }
      if (cle === cleDate(auj)) cls += " cal-auj";
      h += '<span class="' + cls + '" style="' + st + '">' + i + "</span>";
    }
    h += "</div>";

    h += '<div class="cal-leg">';
    for (i = 0; i < LEGENDE.length; i++) {
      var sw = LEGENDE[i].c === "repos" ? "background:var(--fond-encart)"
        : LEGENDE[i].c === "manque" ? "border:1.5px solid var(--bord-fort)"
        : "background:" + DISC[LEGENDE[i].c].bg;
      h += '<span class="cal-l"><i class="cal-sw" style="' + sw + '"></i>' + esc(LEGENDE[i].t) + "</span>";
    }
    return h + "</div>";
  }

  // SEANCES RECENTES. Les trois disciplines y figurent, chacune avec SES
  // chiffres : une sortie ne se resume pas en tonnage, un cours n'a pas de
  // series. Les compter dans la meme grammaire les rendrait tous faux.
  //
  // REGLE DU CHEVRON : il n'apparait que si la ligne MENE quelque part. Une
  // seance de salle ouvre la fiche de ses exercices ; un cours et une sortie
  // n'ont pas de detail a montrer, donc ni chevron, ni curseur pointer. Un
  // chevron qui ne mene nulle part est une promesse non tenue.
  function seancesRecentesHtml() {
    var h = histTrie(), i, s, out = "", dd, det, cliquable;
    out += '<div class="carte-t">Séances récentes</div>';
    if (!h.length) {
      return out + '<p class="cb-vide">Rien encore. Ta première séance validée apparaîtra ici.</p>';
    }

    out += '<ul class="hi-liste">';
    for (i = 0; i < h.length && i < 20; i++) {
      s = h[i];
      dd = DISC[s.t];
      cliquable = s.t === "salle" && s.ex && s.ex.length;

      if (s.t === "salle") {
        det = (s.exos || 0) + " exos · " + (s.tonnage || 0) + " kg" +
              (s.sec ? " · " + Math.round(s.sec / 60) + " min" : "");
      } else if (s.t === "cours") {
        det = NATURES[s.nat] ? NATURES[s.nat].t + " · " + s.min + " min" : s.min + " min";
      } else {
        det = (LIEUX[s.lieu] ? LIEUX[s.lieu].t : "") +
              (s.km ? " · " + s.km + " km" : "") + (s.minutes ? " · " + s.minutes + " min" : "");
      }

      out += "<li>" +
        (cliquable
          ? '<button type="button" class="hi-l" data-action="fiche-seance" data-d="' + esc(s.d) + '">'
          : '<div class="hi-l hi-l-fixe">') +
        '<span class="hi-p" style="background:' + dd.pale + ";color:" + dd.encre + '">' +
          esc(s.t === "salle" ? s.code : dd.court) + "</span>" +
        '<span class="hi-txt"><span class="hi-n">' +
          esc(s.t === "cours" ? (s.nom || "Cours") : (s.t === "run" ? "Running" : s.code)) + "</span>" +
        '<span class="hi-d">' + esc(dateCourte(s.d)) + " · " + esc(det) + "</span></span>" +
        (cliquable ? '<span class="hi-chev" aria-hidden="true">›</span>' : "") +
        (cliquable ? "</button>" : "</div>") + "</li>";
    }
    return out + "</ul>";
  }

  // Le chevron d'une seance de salle mene a la fiche de son PREMIER exercice
  // de travail, l'echauffement mis a part : c'est le mouvement qui porte la
  // seance, et celui dont on veut voir la progression de charge. Les autres
  // restent joignables par la recherche.
  function ouvrirFicheSeance(cleJour) {
    var h = state.hist || [], i, j, s = null;
    for (i = 0; i < h.length; i++) { if (h[i].d === cleJour && h[i].t === "salle") s = h[i]; }
    if (!s || !s.ex || !s.ex.length) return;
    for (j = 0; j < s.ex.length; j++) {
      if (s.ex[j].unite !== "min") { poser({ ficheEx: s.ex[j].nom, ecran: "fiche" }); window.scrollTo(0, 0); return; }
    }
    poser({ ficheEx: s.ex[0].nom, ecran: "fiche" });
    window.scrollTo(0, 0);
  }

  function dateCourte(cle) {
    var d = dateDepuisCle(cle);
    if (!d) return cle;
    return d.getDate() + " " + MOIS[d.getMonth()].slice(0, 4);
  }

  /* -------------------------------------------------------------------------
     FICHE EXERCICE
     ------------------------------------------------------------------------- */
  /* -------------------------------------------------------------------------
     LA FICHE EST REFAITE D'APRES LA MAQUETTE, apres retour d'usage d'Olivier.
     -------------------------------------------------------------------------
     Ma premiere version reutilisait la courbe partagee avec l'ecran Progres.
     La maquette, elle, montre un HISTOGRAMME : ici les valeurs sont discretes,
     une charge par seance, et non une grandeur relevee dans le temps. Une
     barre par seance se compare d'un coup d'oeil ; une ligne suggere une
     continuite entre deux seances qui n'existe pas.

     Et il manquait le bouton « Voir la technique ». Il etait rendu en lien
     souligne, pas en bouton de 52 px, donc invisible comme action.
     ------------------------------------------------------------------------- */

  // La couleur d'une barre dit son rapport a la precedente : monte, tient,
  // baisse. Sans elle, six barres de meme teinte demandent de comparer des
  // hauteurs a l'oeil.
  function barreCouleur(v, prec) {
    if (prec === null) return { c: "var(--sombre-barre)", t: "var(--sombre-texte-3)" };
    if (v > prec) return { c: "var(--salle-bg)", t: "var(--salle-bg)" };
    if (v < prec) return { c: "var(--cours-bg)", t: "var(--cours-sur-sombre)" };
    return { c: "var(--sombre-bord)", t: "var(--sombre-texte-2)" };
  }

  function verdictDe(v, prec) {
    if (prec === null) return { t: "première fois", c: "var(--texte-2)" };
    if (v > prec) return { t: "+ " + fmtVal(v - prec) + " kg", c: "var(--vert-encre)" };
    if (v < prec) return { t: "− " + fmtVal(prec - v) + " kg", c: "var(--cours-encre)" };
    return { t: "identique", c: "var(--texte-2)" };
  }

  function ficheHtml() {
    var nom = state.ficheEx, i, j, h = "", ex = null, seances, vals = [], dates = [];
    if (!nom) return '<p class="cb-vide">Aucun exercice sélectionné.</p>';

    // On cherche la description dans le catalogue de la seance, pas dans le
    // journal : le journal porte ce qui a ete FAIT, le catalogue porte les
    // consignes.
    for (i = 0; i < SEANCES.length && !ex; i++) {
      for (j = 0; j < SEANCES[i].exos.length; j++) {
        if (SEANCES[i].exos[j].nom === nom) { ex = SEANCES[i].exos[j]; break; }
      }
    }

    h += '<button type="button" class="fi-retour" data-action="onglet" data-ecran="histo">' +
         '<span aria-hidden="true">‹</span> Historique</button>';
    h += '<h1 class="fi-nom">' + esc(nom) + "</h1>";
    if (ex && ex.mat) h += '<div class="fi-mat">' + esc(ex.mat) + "</div>";

    seances = seancesDeExercice(nom, 6);
    for (i = 0; i < seances.length; i++) { vals.push(seances[i].kg); dates.push(dateCourte(seances[i].d)); }

    // --- La carte sombre : charge de travail et histogramme ---
    if (seances.length) {
      var derniere = vals[vals.length - 1], premiere = vals[0];
      var ecart = derniere - premiere;
      var maxi = 0;
      for (i = 0; i < vals.length; i++) { if (vals[i] > maxi) maxi = vals[i]; }

      h += '<section class="fi-carte">';
      h += '<div class="fi-haut"><div>' +
           '<div class="fi-lbl">Ta charge de travail</div>' +
           '<div class="fi-val num">' + esc(fmtVal(derniere)) + '<span class="fi-u">kg</span></div></div>';
      if (seances.length > 1) {
        h += '<div class="fi-droite"><div class="fi-sur">sur 3 mois</div>' +
             '<div class="fi-ecart num" style="color:' +
             (ecart > 0 ? "var(--vert-bg-b)" : (ecart < 0 ? "var(--cours-sur-sombre)" : "var(--sombre-texte-3)")) +
             '">' + (ecart > 0 ? "+ " : (ecart < 0 ? "− " : "")) + esc(fmtVal(Math.abs(ecart))) + " kg</div></div>";
      }
      h += "</div>";

      // HISTOGRAMME, pas courbe : une charge par seance est une valeur
      // DISCRETE. Une ligne suggererait une continuite entre deux seances qui
      // n'existe pas. Les barres sont calees sur le maximum de la periode.
      var prec = null, col;
      h += '<div class="fi-vals">';
      for (i = 0; i < vals.length; i++) {
        col = barreCouleur(vals[i], prec);
        h += '<span class="num" style="color:' + col.t + '">' + esc(fmtVal(vals[i])) + "</span>";
        prec = vals[i];
      }
      h += "</div>";
      prec = null;
      h += '<div class="fi-barres">';
      for (i = 0; i < vals.length; i++) {
        col = barreCouleur(vals[i], prec);
        h += '<span class="fi-b" style="height:' +
             Math.max(8, Math.round((vals[i] / (maxi || 1)) * 100)) + "%;background:" + col.c + '"></span>';
        prec = vals[i];
      }
      h += "</div>";
      h += '<div class="fi-dates">';
      for (i = 0; i < dates.length; i++) h += "<span>" + esc(dates[i]) + "</span>";
      h += "</div></section>";
    } else {
      h += '<p class="cb-vide">Aucune séance enregistrée avec cet exercice.</p>';
    }

    // --- Séance par séance ---
    if (seances.length) {
      h += '<div class="fi-sect">Séance par séance</div>';
      var pv = null;
      for (i = seances.length - 1; i >= 0; i--) {
        pv = i > 0 ? seances[i - 1].kg : null;
        var vd = verdictDe(seances[i].kg, pv);
        h += '<div class="fi-s"><div class="fi-s-h"><span class="fi-s-d">' +
             esc(dateCourte(seances[i].d)) + "</span>" +
             '<span class="fi-s-v" style="color:' + vd.c + '">' + esc(vd.t) + "</span></div>";
        h += '<div class="fi-sets">';
        for (j = 0; j < seances[i].sets.length; j++) {
          h += '<span class="fi-set"><span class="fi-set-k num">' +
               esc(fmtVal(seances[i].sets[j].kg)) + "</span>" +
               '<span class="fi-set-r">' + seances[i].sets[j].reps + " reps</span></span>";
        }
        h += "</div></div>";
      }
    }

    // --- Technique, et le bouton qui manquait ---
    h += '<section class="fi-tech"><div class="fi-tech-t">Technique</div>';
    if (ex && ex.lines && ex.lines.length) {
      h += '<div class="fi-lines">';
      for (i = 0; i < ex.lines.length; i++) {
        h += '<div class="fi-line"><span class="fi-num" aria-hidden="true">' + (i + 1) + "</span>" +
             '<span class="fi-txt">' + esc(ex.lines[i]) + "</span></div>";
      }
      h += "</div>";
    } else {
      h += '<p class="cb-vide">Pas de mémo écrit pour cet exercice.</p>';
    }
    // LA SEULE SORTIE RESEAU DE L'APPLICATION, et c'est un lien, pas un appel.
    // Il etait rendu en lien souligne : invisible comme action. La maquette en
    // fait un bouton de 52 px, et c'est celui-la qu'Olivier cherchait.
    h += '<a class="fi-video" target="_blank" rel="noopener noreferrer" href="' +
         "https://www.youtube.com/results?search_query=" +
         encodeURIComponent(nom + " technique musculation") +
         '"><span aria-hidden="true">▶</span> Voir une vidéo de ce mouvement</a>';
    return h + "</section>";
  }

  /* -------------------------------------------------------------------------
     PROGRES
     ------------------------------------------------------------------------- */
  /* -------------------------------------------------------------------------
     PROGRES — REFAIT D'APRES LA MAQUETTE, apres retour d'usage d'Olivier.
     -------------------------------------------------------------------------
     Ma premiere version avait quatre blocs, la maquette en a SEPT, et la
     courbe elle-meme etait mal montee : posee a nu au lieu d'etre dans sa
     carte, avec son axe en positionnement absolu au lieu d'une colonne flex,
     et son point de fin cale a gauche au lieu de la droite.

     Manquaient entierement : la carte sombre « Ton programme stagne ? » avec
     son appel a l'assistant, et la carte « Tes records » avec ses barres.
     ------------------------------------------------------------------------- */
  function progHtml() {
    var modes = modesDisponibles(), h = "", i, j, k, mode, vals, d = deriver();
    var hj = state.hist || [], tonnage = 0, record = 0, s, heures = 0, km = 0, sorties = 0;
    var recs = {}, ordre = [];

    for (i = 0; i < hj.length; i++) {
      s = hj[i];
      if (s.t === "cours") { heures += s.min || 0; continue; }
      if (s.t === "run") { sorties++; km += nombreOu(s.km, 0); continue; }
      tonnage += s.tonnage || 0;
      if (!s.ex) continue;
      for (j = 0; j < s.ex.length; j++) {
        if (s.ex[j].unite === "min") continue;
        for (k = 0; k < s.ex[j].sets.length; k++) {
          var kg = s.ex[j].sets[k].kg;
          if (kg > record) record = kg;
          if (!recs[s.ex[j].nom]) { recs[s.ex[j].nom] = { max: kg, min: kg }; ordre.push(s.ex[j].nom); }
          if (kg > recs[s.ex[j].nom].max) recs[s.ex[j].nom].max = kg;
          if (kg < recs[s.ex[j].nom].min) recs[s.ex[j].nom].min = kg;
        }
      }
    }

    // --- 1. Trois vignettes ---
    h += '<div class="vign">';
    h += vignette(hj.length, "séances");
    if (d.slotsSalle.length) h += vignette(fmtVal(Math.round(tonnage / 100) / 10), "tonnes");
    else if (d.slotsCours.length) h += vignette(fmtVal(Math.round(heures / 6) / 10), "h de cours");
    else h += vignette(fmtVal(km), "km");
    h += vignette(record ? fmtVal(record) : "—", "record kg");
    h += "</div>";

    if (!modes.length) {
      return h + '<p class="cb-vide">Déclare tes jours pour voir tes courbes.</p>';
    }

    // --- 2. La carte de courbe ---
    mode = state.modeChart < modes.length ? state.modeChart : 0;
    vals = serieHebdo(modes[mode].v);
    var depart = vals[0], fin = vals[vals.length - 1], delta = fin - depart;
    var u = modes[mode].u ? " " + modes[mode].u : "";

    h += '<section class="pr-carte">';
    h += '<div class="pr-modes" role="group" aria-label="Choisir la série">';
    for (i = 0; i < modes.length; i++) {
      h += '<button type="button" class="pr-mode' + (i === mode ? " pr-mode-on" : "") + '"' +
           ' aria-pressed="' + (i === mode ? "true" : "false") + '"' +
           ' data-action="mode-chart" data-v="' + i + '">' + esc(modes[i].t) + "</button>";
    }
    h += "</div>";
    h += courbeHtml(vals, u,
      "Départ · " + fmtVal(depart) + u,
      "Aujourd'hui · " + fmtVal(fin) + u,
      (delta >= 0 ? "+" : "−") + fmtVal(Math.abs(delta)) + u + " sur 12 semaines",
      modes[mode].t);
    h += "</section>";

    // --- 3. La carte Running ---
    if (d.slotsRun.length) h += carteObjectifRunHtml(km, sorties);

    // --- 4. « Ton programme stagne ? » ---
    if (d.slotsSalle.length) h += carteStagnationHtml();

    // --- 5. Tes records ---
    if (d.slotsSalle.length && ordre.length) {
      h += '<section class="pr-recs"><div class="pr-recs-t">Tes records</div>';
      ordre.sort(function (a, b) { return recs[b].max - recs[a].max; });
      var plafond = recs[ordre[0]].max || 1;
      for (i = 0; i < ordre.length && i < 5; i++) {
        var r = recs[ordre[i]], gain = r.max - r.min;
        h += '<div class="pr-rec"><div class="pr-rec-h">' +
             '<span class="pr-rec-n">' + esc(ordre[i]) + "</span>" +
             '<span class="pr-rec-v num">' + esc(fmtVal(r.max)) + " kg</span></div>" +
             '<div class="pr-rec-b"><span class="pr-piste"><span class="pr-barre" style="width:' +
             Math.max(4, Math.round((r.max / plafond) * 100)) + '%"></span></span>' +
             '<span class="pr-gain num" style="color:' +
             (gain > 0 ? "var(--vert-encre)" : "var(--texte-3)") + '">' +
             (gain > 0 ? "+ " + fmtVal(gain) + " kg" : "—") + "</span></div></div>";
      }
      h += "</section>";
    }

    // --- 6. Paliers ---
    h += badgesHtml(hj.length);
    return h;
  }

  // LA CARTE QUI APPELLE L'ASSISTANT. Elle ne s'affiche QUE si le journal
  // montre vraiment une stagnation : proposer de demander de l'aide a quelqu'un
  // qui progresse serait au mieux inutile, au pire decourageant.
  function carteStagnationHtml() {
    var c = chargesRecentes(), i, nom, x, bloque = null;
    for (i = 0; i < c.ordre.length; i++) {
      nom = c.ordre[i];
      x = c.par[nom];
      if (x.stagne >= 2 && (!bloque || x.stagne > c.par[bloque].stagne)) bloque = nom;
    }
    if (!bloque) return "";
    x = c.par[bloque];
    return '<section class="pr-stagne">' +
      '<div class="pr-st-t">Ton programme stagne ?</div>' +
      '<div class="pr-st-p">Le <b>' + esc(bloque.toLowerCase()) + "</b> est bloqué à " +
      esc(fmtVal(x.der)) + " kg depuis " + (x.stagne + 1) + " séances. " +
      "Ton assistant peut relire tes charges et proposer quoi changer.</div>" +
      '<button type="button" class="pr-st-b" data-action="aller-ia">' +
      "Demander une amélioration de mon programme à mon IA</button></section>";
  }

  function vignette(v, l) {
    return '<div class="vg"><span class="vg-n num">' + esc(String(v)) + "</span>" +
           '<span class="vg-l">' + esc(l) + "</span></div>";
  }


  function heuresDeCours() {
    var h = state.hist || [], i, m = 0;
    for (i = 0; i < h.length; i++) { if (h[i].t === "cours") m += h[i].min || 0; }
    return Math.round(m / 60 * 10) / 10;
  }

  // EN-TETE « RUNNING », JAMAIS « COURSE A PIED », et un seul bleu dans toute
  // la carte : bordure, barre, chiffres et vignettes partagent les trois memes
  // valeurs. Deux bleus voisins se lisent comme une erreur d'impression.
  function carteObjectifRunHtml(kmTotal, sortiesTotal) {
    var h = state.hist || [], i, km = 0, sorties = 0, lundi = lundiDe(new Date()), d, mins = 0;
    for (i = 0; i < h.length; i++) {
      if (h[i].t !== "run") continue;
      d = dateDepuisCle(h[i].d);
      if (!d || jourEcart(d, lundi) < 0 || jourEcart(d, lundi) > 6) continue;
      sorties++;
      km += nombreOu(h[i].km, 0);
      mins += nombreOu(h[i].minutes, 0);
    }
    var vise = deriver().slotsRun.length;
    var pct = Math.min(100, vise ? Math.round(sorties / vise * 100) : 0);

    return '<section class="run-obj"><div class="ro-t">Running</div>' +
      '<div class="ro-titre">' + esc(fmtVal(km)) + " km cette semaine</div>" +
      '<div class="ro-s">' + sorties + " sortie" + (sorties > 1 ? "s" : "") +
      " sur " + vise + " prévue" + (vise > 1 ? "s" : "") + ". " +
      (sorties >= vise ? "Le compte y est." : "Il en reste " + (vise - sorties) + ".") + "</div>" +
      '<div class="ro-c"><span class="ro-piste"><span class="ro-barre" style="width:' + pct +
      '%"></span></span><span class="ro-n num">' + sorties + "/" + vise + "</span></div>" +
      '<div class="ro-stats">' +
      '<div class="ro-st"><span class="ro-st-v num">' + esc(fmtVal(kmTotal || 0)) +
      ' km</span><span class="ro-st-l">depuis le début</span></div>' +
      '<div class="ro-st"><span class="ro-st-v num">' +
      (mins ? Math.round(mins) + " min" : "—") +
      '</span><span class="ro-st-l">cette semaine</span></div></div></section>';
  }

  function badgesHtml(total) {
    var b = MOTEUR.BADGES, i, h = '<div class="carte-t" style="margin-top:20px">Paliers</div><div class="bdg">';
    for (i = 0; i < b.length; i++) {
      h += '<div class="bd' + (total >= b[i].n ? " bd-on" : "") + '">' +
           '<span class="bd-n num">' + b[i].n + "</span>" +
           '<span class="bd-l">' + esc(b[i].label) + "</span></div>";
    }
    return h + "</div>";
  }

  /* =========================================================================
     LA BRANCHE MOI — Moi, Profil, Mon programme, Mes exercices, Apparence
     ========================================================================= */

  /* -------------------------------------------------------------------------
     MOI
     ------------------------------------------------------------------------- */
  // La photo passe par un <label> qui CONTIENT un <input type="file">
  // transparent en absolute inset 0. C'est ce montage, et lui seul, qui ouvre
  // la photothèque du telephone au premier toucher : un bouton qui appelle
  // .click() sur un input cache est bloque par Safari hors geste direct.
  // LA CARTE D'IDENTITE EST SOMBRE, ET LE PSEUDO EST UN BOUTON.
  //
  // Ma premiere version posait le nom en texte mort : rien ne menait a Profil,
  // alors que la maquette en fait la porte d'entree. Signale par Olivier.
  // Deux zones cliquables, le bloc nom et le chevron, parce qu'on vise l'un ou
  // l'autre selon la main.
  function photoHtml() {
    var init = (state.obPrenom || "?").charAt(0).toUpperCase();
    var h = '<div class="moi-carte">';
    h += '<label class="moi-photo">';
    h += state.photo
      ? '<span class="moi-img" role="img" aria-label="Photo de profil" style="background-image:url(' + state.photo + ')"></span>'
      : '<span class="moi-init" aria-hidden="true">' + esc(init) + "</span>";
    h += '<span class="moi-cap" aria-hidden="true">Photo</span>';
    h += '<input type="file" accept="image/*" class="moi-file" data-action="photo-choisir"' +
         ' aria-label="Choisir une photo de profil"></label>';
    h += '<button type="button" class="moi-ident" data-action="aller-profil">' +
         '<span class="moi-nom">' + esc(state.obPrenom || "Toi") + "</span>" +
         '<span class="moi-sous">' + esc(resumeProfilCourt()) + "</span></button>";

  // UN GROUPE = UN TITRE HORS CARTE, PUIS UNE SEULE CARTE A SEPARATEURS.
  //
  // Ma premiere version faisait une carte bordee PAR LIGNE : trois lignes
  // donnaient trois cartes empilees, et l'ecran se lisait comme une liste de
  // blocs sans lien. La maquette regroupe les lignes d'un meme sujet dans une
  // carte unique, separees par un filet. C'est ce qui fait qu'un groupe se lit
  // comme un groupe. Signale par Olivier sur le bloc Assistant IA.
  function groupeHtml(titre, lignes) {
    var h = '<div class="mo-g"><div class="mo-g-t">' + esc(titre) + '</div>' +
            '<div class="mo-g-c">', i, l;
    for (i = 0; i < lignes.length; i++) {
      l = lignes[i];
      h += '<button type="button" class="mo-l" data-action="' + l.a + '"' +
           (l.v !== undefined ? ' data-v="' + esc(l.v) + '"' : "") + ">" +
           '<span class="mo-n">' + esc(l.t) + "</span>" +
           (l.s ? '<span class="mo-s num">' + esc(l.s) + "</span>" : "") +
           '<span class="mo-c" aria-hidden="true">›</span></button>';
    }
    return h + "</div></div>";
  }

  function resetHtml() {
    // LES DEUX ETATS PRENNENT LES TEXTES DE LA MAQUETTE. Le premier expliquait

      h += '<div class="dg-t">Réinitialiser mes données</div>';
      h += '<p class="cr-p">Efface le diagnostic, le programme, l\'historique et les ' +

      h += '<button type="button" class="dg-btn dg-btn-creux" data-action="reset-demander">' +
           "Réinitialiser mes données</button></section>";

    h += '<p class="cr-p">Ce qui disparaît : ton diagnostic, ton programme de la semaine, ' +
         "tes cours et tes sorties, ton historique, ta pesée et ta photo.</p>";

  /* -------------------------------------------------------------------------
     MON PROGRAMME — la vue canonique
     -------------------------------------------------------------------------
     UNE CARTE PAR ACTIVITE, PAS PAR JOUR. Un jour a deux activites produit
     deux cartes, la seconde titree « Vendredi · 2e séance ». Grouper par jour
     ferait disparaitre la seconde derriere la premiere, exactement le defaut
     que l'invariant 2 corrige cote comptage.

     LA PASTILLE PORTE LA COULEUR PLEINE de sa discipline. C'est un jeu DISTINCT
     de celui de l'etape Programme du diagnostic, qui utilise les teintes
     attenuees pour marquer l'etat « depliee ». Les melanger ferait lire un etat
     d'interface la ou il n'y a qu'une discipline.
     ------------------------------------------------------------------------- */
  function monProgHtml() {
    var d = deriver(), h = "", i, s, dd;
    if (!d.slots.length) {
      return '<p class="cb-vide">Aucune activité déclarée. Reprends l\'étape Rythme.</p>' +
        '<button type="button" class="cr-btn" data-action="ob-etape" data-v="4">Déclarer mes jours</button>';
    }

    for (i = 0; i < d.slots.length; i++) {
      s = d.slots[i];
      dd = DISC[s.a.t];
      h += '<section class="mp">';
      h += '<div class="mp-tete"><div class="mp-jour">' + esc(s.nom) +
           (s.a.k > 0 ? " · 2e séance" : "") + "</div>" +
           '<span class="mp-pill" style="background:' + dd.bg + ";color:" + dd.fg + '">' +
           esc(dd.court) + "</span></div>";

      if (s.a.t === "salle") h += mpSalleHtml(s.a);
      else if (s.a.t === "cours") {
        h += '<div class="mp-sub">' + esc(s.a.nom || "Cours") + " · " +
             esc(NATURES[s.a.nat].t) + " · " + s.a.min + " min</div>";
      } else {
        h += '<div class="mp-sub">' + esc(LIEUX[s.a.lieu].t) + "</div>";
      }
      h += "</section>";
    }

    // TEXTE DE LA MAQUETTE. Le mien annoncait le service, le sien annonce la
    // QUESTION : « trop simple, trop dur, mal reparti » sont les trois doutes
    // qu'on a devant son propre programme, et les nommer vaut mieux que de
    // proposer une « amelioration » qui ne dit pas de quoi.
    h += '<section class="carte-sombre">' +
         '<div class="mp-ia-t">Un avis extérieur</div>' +
         '<div class="cs-txt">Trop simple, trop dur, mal réparti ? L\'appli prépare la ' +
         "question à partir de tes charges et de tes quatre dernières semaines.</div>" +
         '<button type="button" class="cs-cta" data-action="aller-ia">' +
         "Demander une amélioration de mon programme à mon IA</button></section>";
    return h;
  }

  function mpSalleHtml(a) {
    var ex = exosDe(a.si), dispo = exosDisponibles(a.si), i, h = "", S = SEANCES[a.si];
    h += '<div class="mp-sub">' + esc(S.code) + " · " + esc(S.sub) + "</div>";

    // TOUS les exercices visibles en permanence, rien a deplier : c'est la vue
    // canonique, celle qu'on ouvre justement pour tout voir d'un coup.
    h += '<ul class="mp-exos">';
    for (i = 0; i < ex.length; i++) {
      h += '<li class="mp-e"><span class="mp-e-n">' + esc(ex[i].nom) +
           (ex[i].remplace ? '<span class="mp-e-r">remplace ' + esc(ex[i].remplace) + "</span>" : "") +
           "</span>" +
           '<span class="mp-e-d num">' + esc(ex[i].n + " × " + ex[i].reps +
           (ex[i].unite ? " " + ex[i].unite : "")) + "</span>";
