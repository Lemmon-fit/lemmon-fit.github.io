<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://api.mistral.ai; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LEMMON FIT">
<meta name="theme-color" id="meta-theme" content="#100f0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>LEMMON FIT</title>
<style>
  /* ---------------------------------------------------------------
     PALETTES. Le theme actif est pose par data-theme sur <html>.
     « systeme » est resolu en JS vers sombre ou clair : une valeur
     concrete est toujours ecrite, ce qui evite une cascade de media
     queries et rend la couleur lisible depuis le JavaScript.
     --------------------------------------------------------------- */
  :root, :root[data-theme="sombre"] {
    --fond:         #100f0d;  /* fond de page */
    --fond-carte:   #1e1a15;  /* carte, proposition */
    --fond-encart:  #1a1712;  /* encart en retrait */
    --fond-champ:   #100f0d;  /* champ de saisie, creuse */
    --fond-pill:    #2c281f;  /* pastille, jeton */
    --fond-pill-2:  #24201b;  /* pastille secondaire */
    --sep:          #2c281f;  /* separateur */
    --bord:         #3a352c;  /* bordure standard */
    --bord-champ:   #3a3428;  /* bordure de champ */
    --bord-discret: #4a4436;  /* bordure a peine visible */
    --bord-moyen:   #6b6455;  /* bordure intermediaire */
    --bord-fort:    #8c8474;  /* bordure de controle, 4,5:1 */
    --texte:        #ede6d3;  /* texte principal */
    --texte-1b:     #cfc6b3;  /* texte courant */
    --texte-2:      #a89e8a;  /* texte secondaire */
    --texte-3:      #978e7e;  /* texte discret, plancher 4,5:1 sur TOUS les fonds */
    --sur-accent:   #100f0d;  /* texte pose SUR une surface accent */
    --accent:       #f4d912;  /* surface accent : fond, bordure */
    --accent-txt:   #f4d912;  /* accent en TEXTE, lisible sur le fond */
    --accent-pill:  #f2e58a;  /* texte sur pastille accent */
    --vert:         #8caa7c;  /* surface verte */
    --vert-txt:     #8caa7c;  /* vert en texte */
    --vert-pill:    #cfe3c6;  /* texte sur pastille verte */
    --bleu:         #4a9eff;  /* surface bleue */
    --bleu-txt:     #bcdcff;  /* bleu en texte */
    --bleu-pill:    #bcdcff;  /* texte sur pastille bleue */
    --bleu-bord:    #7fb3e8;  /* liseré des propositions IA */
    --rouge:        #e08a80;  /* surface rouge */
    --rouge-txt:    #e08a80;  /* rouge en texte */
    --rouge-fort:   #c1685f;  /* bordure rouge appuyee */
    --rouge-pill:   #f0b3ac;  /* texte sur pastille rouge */
  }
  :root[data-theme="clair"] {
    --fond:         #f7f3ea;
    --fond-carte:   #fffdf7;
    --fond-encart:  #efe9dc;
    --fond-champ:   #fffdf7;
    --fond-pill:    #e7e0cf;
    --fond-pill-2:  #ece5d6;
    --sep:          #e2dccd;
    --bord:         #ded7c6;
    --bord-champ:   #cfc7b4;
    --bord-discret: #ded7c6;
    --bord-moyen:   #a89e8a;
    --bord-fort:    #7d7566;
    --texte:        #1f1c17;
    --texte-1b:     #3d382f;
    --texte-2:      #544d41;
    --texte-3:      #676052;
    --sur-accent:   #100f0d;
    --accent:       #f4d912;
    --accent-txt:   #6b5b00;
    --accent-pill:  #5c4e00;
    --vert:         #668d55;
    --vert-txt:     #3f6132;
    --vert-pill:    #2f5226;
    --bleu:         #2f7fd4;
    --bleu-txt:     #1a5bab;
    --bleu-pill:    #16497f;
    --bleu-bord:    #2f7fd4;
    --rouge:        #c1483a;
    --rouge-txt:    #a13529;
    --rouge-fort:   #a13529;
    --rouge-pill:   #8c2a1f;
  }

  * { box-sizing: border-box; }
  button, input { -webkit-tap-highlight-color: transparent; }

  html, body { background:var(--fond); margin: 0; min-height: 100vh; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:var(--texte);
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    overscroll-behavior-y: contain;
  }

  .container { max-width: 420px; margin: 0 auto; overflow-x: hidden; }

  /* Deux écrans : la séance d'un côté, tout le reste de l'autre.
     On ne rend QUE l'écran actif : garder les deux dans le DOM imposerait au
     conteneur la hauteur du plus grand, laissant un vide énorme sous le plus
     court. L'effet de glissement vient donc d'une animation d'entrée. */
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab {
    flex: 1; min-height: 46px; border-radius: 10px; background: transparent;
    border:1.5px solid var(--bord-fort) !important; color:var(--texte-1b); font-size: 13px; font-weight: 700;
  }
  .tab-active { background:var(--accent); border-color:var(--accent) !important; color:var(--sur-accent); }
  .swipe-hint { text-align: center; font-size: 11px; color:var(--texte-3); margin: -6px 0 14px; }

  @keyframes slideFromRight { from { transform: translateX(28px); opacity: 0.35; } to { transform: none; opacity: 1; } }
  @keyframes slideFromLeft  { from { transform: translateX(-28px); opacity: 0.35; } to { transform: none; opacity: 1; } }
  .page-from-right { animation: slideFromRight 0.22s ease-out; }
  .page-from-left  { animation: slideFromLeft 0.22s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .page-from-right, .page-from-left { animation: none; }
  }

  .brandmark { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .brandmark-icon { width: 22px; height: 22px; border-radius: 6px; }
  .brandmark-text { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; color:var(--texte-1b); }
  .brandmark-text b { color:var(--accent-txt); font-weight: 800; }

  #splash {
    position: fixed; inset: 0; background:var(--fond); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.4s ease;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  .splash-icon { width: 148px; height: 148px; }

  .banner {
    border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.4;
    margin-bottom: 16px; font-weight: 600;
  }
  .banner-error { background: rgba(193,104,95,0.15); border:1px solid var(--rouge-fort); color:var(--rouge-pill); }
  .banner-ok { background: rgba(140,170,124,0.15); border:1px solid var(--vert); color:var(--vert-pill); }
  .banner-info { background: rgba(74,158,255,0.12); border:1px solid var(--bleu); color:var(--bleu-pill); }
  .banner-warn { background: rgba(244,217,18,0.12); border:1px solid var(--accent); color:var(--accent-pill); }
  .banner-btn {
    display: block; width: 100%; margin-top: 10px; min-height: 44px; border-radius: 8px;
    background: rgba(244,217,18,0.18); border:1px solid var(--accent) !important;
    color:var(--accent-txt); font-size: 13px; font-weight: 700;
  }

  .settings-card { border-color:var(--bord); }
  .backup-row { display: flex; gap: 8px; }
  .backup-btn {
    flex: 1; min-height: 48px; border-radius: 8px; border:1.5px solid var(--bord-fort) !important;
    background: transparent; color:var(--texte-1b); font-size: 13px; font-weight: 600;
  }

  button { touch-action: manipulation; border: none; font-family: inherit; }

  /* --- Le zoom accidentel en salle (v1.6.0) --------------------------------
     « manipulation » = pan-x + pan-y + pinch-zoom : le pincement a deux doigts
     et le defilement restent entiers, SEUL le double-tap-pour-zoomer tombe.
     C'est lui, la gene en salle — pas le pincement. Pose sur <html> parce que
     le geste se decide sur la chaine des ancetres jusqu'a la fenetre : la page
     entiere est couverte, texte compris, et un ecran ajoute demain l'est aussi.
     user-scalable=no n'est PAS remis : il a ete retire en v1.1.0 pour que les
     notes en 12 px restent agrandissables, et cette raison n'a pas bouge. */
  html { touch-action: manipulation; }

  .header { text-align: center; margin-bottom: 14px; }
  .header-date { font-size: 13px; color:var(--texte-2); text-transform: capitalize; margin-bottom: 4px; }
  .header-title { font-size: 30px; font-weight: 800; letter-spacing: 1px; margin: 0; color:var(--texte); }
  .header-title-rest { color:var(--vert-txt); }
  .header-sub { font-size: 15px; color:var(--texte-2); margin-top: 4px; }
  .header-override { font-size: 12px; color:var(--accent-pill); margin-top: 7px; line-height: 1.4; }
  .header-override-btn {
    background: none; border: 0; padding: 0; margin-left: 4px;
    font: inherit; color: inherit; text-decoration: underline; cursor: pointer;
  }

  /* Ordre chronologique de gauche à droite : avant-hier, hier, aujourd'hui. */
  .day-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .day-btn {
    flex: 1; min-height: 44px; border-radius: 8px; border:1.5px solid var(--bord-fort) !important;
    background: transparent; color:var(--texte-1b); font-size: 13px; font-weight: 600;
  }
  .day-btn-active { background:var(--accent); border-color:var(--accent) !important; color:var(--sur-accent); }
  .day-date { width: 100%; margin-bottom: 14px; }
  .date-link {
    display: block; width: 100%; min-height: 40px; margin-bottom: 14px;
    background: transparent; color:var(--texte-3); font-size: 12px; text-decoration: underline;
    text-decoration-color:var(--bord-discret);
  }
  .prog-toggle {
    width: 100%; min-height: 44px; background: transparent; border:1px dashed var(--bord-fort) !important;
    border-radius: 8px; color:var(--texte-2); font-size: 13px; font-weight: 600; margin-bottom: 10px;
  }
  .prog-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .prog-btn {
    flex: 1 1 auto; min-width: 74px; min-height: 46px; border-radius: 8px;
    border:1.5px solid var(--bord-fort) !important; background: transparent; color:var(--texte-1b);
    font-size: 13px; font-weight: 700;
  }
  .prog-btn-active { background:var(--accent); border-color:var(--accent) !important; color:var(--sur-accent); }

  .hero { text-align: center; margin-bottom: 20px; }
  .hero-flame-wrap { display: inline-flex; padding: 14px 22px; border-radius: 999px; }
  .glow-soft { box-shadow: 0 0 26px -4px var(--glow); }
  .glow-strong { box-shadow: 0 0 40px -2px var(--glow), 0 0 70px -10px var(--glow); }
  .hero-flame { display:flex; align-items:center; justify-content:center; gap: 8px; font-size: 28px; }
  .hero-number {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
    font-size: 44px; font-weight: 700; color:var(--texte);
  }
  .hero-label { font-size: 13px; color:var(--texte-2); margin-top: 2px; }

  /* Grille par semaine. La barre de 20 carrés d'avant ne disait rien : elle
     répétait le streak affiché juste au-dessus, sans aucun repère de date, et
     devenait une barre pleine dès que ça se passait bien. Rangée en semaines
     avec les initiales des jours, le MOTIF des trous devient lisible : on voit
     qu'on saute toujours le vendredi. Ça, un compteur ne peut pas le dire. */
  /* Le nombre de colonnes vient du profil : il vaut le nombre de jours
     d'entrainement choisis, de 1 a 7. Il est donc pose en style en ligne. */
  .weekgrid {
    display: grid; grid-template-columns: 30px repeat(5, 1fr);
    gap: 5px; margin: 14px auto 0; max-width: 250px;
  }
  .wg-head, .wg-label {
    font-size: 10px; color:var(--texte-2); text-align: center; line-height: 16px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .wg-label { text-align: right; padding-right: 3px; }
  .wg-cell { height: 17px; border-radius: 4px; }
  .wg-done { background:var(--accent); }
  .wg-miss { background: transparent; border:1.5px solid var(--bord-fort); }
  .wg-today { background: transparent; border:1.5px solid var(--accent); box-shadow: inset 0 0 0 2px rgba(244,217,18,0.22); }
  .wg-today-done { background:var(--accent); box-shadow: 0 0 0 2px rgba(244,217,18,0.35); }
  .wg-future { background: transparent; border:1.5px dashed var(--bord-discret); }
  /* --bord-discret plafonne a 1,30:1 en theme clair, meme a pleine opacite : les
     cases « avant tes debuts » y etaient invisibles. Monter l'opacite ne servait
     a rien, c'est la TEINTE qui manquait. --bord-moyen donne 2,39:1 en clair, et
     le pointille suffit a garder la hierarchie par rapport aux cases pleines. */
  .wg-pre { background: transparent; border:1.5px dotted var(--bord-moyen); }
  /* HORS EPOQUE : ce jour n'etait pas prevu a cette date-la. Le meme traitement
     que .wg-pre — la case existe, elle ne reproche rien — mais une teinte de
     fond plutot qu'un pointille, pour que les deux « non comptees » restent
     distinguables l'une de l'autre. --fond-pill est un fond, pas un trait :
     c'est le role juste, et il tient dans les deux themes. */
  .wg-hors { background:var(--fond-pill); }

  /* Meme mal que .wg-pre, et sur la case qui compte le plus : en theme clair,
     l'accent jaune sur fond creme donne 1,28:1 — le contraste le PLUS FAIBLE de
     toute la grille, plus faible que les cases « avant tes debuts » qu'elle est
     censee dominer. Sur une installation neuve, cette case est le seul repere de
     l'ecran d'accueil. --accent-txt est l'accent lisible EN TRAIT (5,36:1 en
     clair) ; le theme sombre, deja excellent, garde le jaune. */
  :root[data-theme="clair"] .wg-today { border-color: var(--accent-txt); }

  .ia-cle-avis {
    font-size: 13px; color:var(--texte); background:var(--bord);
    border-left:3px solid var(--accent-txt);
    border-radius: 6px; padding: 8px 10px; margin-top: 8px; line-height: 1.4;
  }
  .wg-legend { display: flex; gap: 12px; justify-content: center; font-size: 10px; color:var(--texte-3); margin-top: 9px; flex-wrap: wrap; }
  .wg-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .wg-swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  .card { background:var(--fond-pill-2); border:1px solid var(--bord); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card-title {
    font-size: 14px; font-weight: 700; color:var(--texte-2); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }

  /* --- LE TITRE-BOUTON D'UNE CARTE REPLIABLE -----------------------------
     Un <button> et pas un <div> cliquable : c'est un vrai controle, il doit
     recevoir le focus au clavier et s'annoncer aux lecteurs d'ecran (aria-expanded).
     Le titre passe en <span> a l'interieur — un <div> dans un <button> est
     invalide, et le navigateur reconstruit alors le DOM autrement : le clic
     partirait au mauvais endroit. Le meme piege a deja ete paye sur la ligne de
     nutrition, ou un bouton se trouvait dans un bouton. */
  .card-titre {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: transparent; border: 0; padding: 0; margin: 0;
    text-align: left; min-height: 30px; cursor: pointer;
  }
  .card-titre .card-title { margin-bottom: 12px; flex: 1 1 auto; min-width: 0; }
  /* LE RESUME SURVIT AU REPLIAGE, et c'est sa raison d'etre : il vit DANS le
     bouton, donc le masquage des freres ne l'atteint pas. Sans lui, replier
     « Reglages avances » cachait « Cle enregistree · Anthropic », qui est
     precisement ce qu'on veut savoir sans deplier. */
  .card-resume {
    font-size: 12px; font-weight: 600; color:var(--texte-3);
    margin-bottom: 12px; white-space: nowrap;
  }
  .card-chev { font-size: 12px; color:var(--texte-3); margin-bottom: 12px; }
  /* Une carte repliee masque tout SAUF son titre-bouton. Le corps est bati puis
     cache : voir l'en-tete de la chaine pour pourquoi ce n'est pas un oubli. */
  .card-replie > *:not(.card-titre) { display: none; }
  .card-replie .card-title,
  .card-replie .card-resume,
  .card-replie .card-chev { margin-bottom: 0; }

  .motivation-card { background:var(--fond-pill-2); border-color:var(--bord-discret); }
  .motivation-head { font-size: 20px; font-weight: 700; color:var(--texte); margin-bottom: 6px; }
  .motivation-sub { font-size: 15px; color:var(--texte-2); line-height: 1.5; }

  .duration-pill {
    background:var(--bord); color:var(--texte-1b); font-size: 11px; font-weight: 800;
    padding: 3px 8px; border-radius: 20px; margin-left: auto;
  }

  .last-session {
    font-size: 13px; color:var(--texte-1b); background:var(--fond-carte); border-radius: 8px;
    padding: 9px 12px; margin-bottom: 12px; line-height: 1.4;
  }
  .last-session strong { color:var(--texte); }
  .last-session-empty { color:var(--texte-2); font-style: italic; }

  /* --- Séance allégée sur fatigue déclarée (v1.6.0) ------------------------ */
  .allege-note {
    background:var(--fond-carte); border-left:3px solid var(--accent); border-radius: 6px;
    padding: 10px 12px; font-size: 12px; color:var(--texte-1b); line-height: 1.45;
    margin-bottom: 12px;
  }
  .allege-note b { color:var(--texte); }
  .allege-annuler {
    display: block; width: 100%; min-height: 44px; margin-top: 10px;
    background: transparent; border:1px solid var(--bord-fort) !important;
    border-radius: 8px; color:var(--texte-2); font-size: 12px; font-weight: 600;
    font-family: inherit;
  }

  .detail-toggle {
    width: 100%; min-height: 48px; background: transparent; border:1px dashed var(--bord-fort) !important;
    border-radius: 8px; color:var(--texte-2); font-size: 13px; font-weight: 600; margin-bottom: 4px;
  }

  .exercise-list { list-style: none; margin: 12px 0 0; padding: 0; }
  .exercise-item { padding: 12px 0 14px 12px; border-bottom:1px solid var(--bord); border-left: 3px solid transparent; }
  .exercise-item:last-child { border-bottom: none; }
  .exercise-item-top { display: flex; align-items: center; gap: 6px; }
  /* Le nom replie ou déplie l'exercice. Le « ? » vient juste après, collé au
     nom : posé en bout de ligne, on ne voyait plus à quoi il se rapportait. */
  .exercise-item-name {
    flex: 0 1 auto; text-align: left; background: transparent; padding: 4px 0; min-height: 44px;
    font-family: inherit; font-size: 14px; font-weight: 700; color:var(--texte);
    display: flex; align-items: center; gap: 8px;
  }
  /* Chevron nettement visible : à 12 px il ne se lisait pas comme un bouton. */
  .exo-caret {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px;
    background:var(--bord); color:var(--accent-txt);
    font-size: 13px; line-height: 22px; text-align: center;
  }
  .howto-btn {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    border:1px solid var(--bord-fort) !important; background: transparent; color:var(--texte-2);
    font-size: 13px; font-weight: 700; font-family: inherit;
  }
  .howto-btn[aria-expanded="true"] { border-color:var(--accent) !important; color:var(--accent-txt); }
  .exercise-check-icon { margin-left: auto; }
  /* Replié : la ligne se tasse et se grise, pour que l'effet soit visible même
     sur un exercice court comme un échauffement. */
  /* PAS D'OPACITE ICI. Une opacite porte sur l'element ENTIER : elle composait
     le nom, le résumé, la coche, le chevron et le « ? » sur le fond de la carte
     d'un seul coup, et faisait tomber les cinq sous 4,5:1 en thème clair (3,59 /
     3,40 / 3,40 / 2,81 / 3,08). Le « en retrait » se dit par la COULEUR : le
     chevron passe en texte secondaire, le résumé et le « ? » y sont déjà, le nom
     garde sa pleine force. Le reste de l'effet est géométrique — la ligne se
     tasse de 132 px à 56 px et le détail devient un résumé d'une ligne. */
  .exercise-item-folded { padding-top: 6px; padding-bottom: 6px; }
  .exercise-item-folded .exercise-item-name { min-height: 34px; font-weight: 600; }
  .exercise-item-folded .exo-caret { color:var(--texte-2); }
  .exo-summary {
    font-size: 12px; color:var(--texte-2); padding-left: 42px; margin-top: -4px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .exercise-item-detail { font-size: 13px; color:var(--texte-2); margin-top: 2px; }

  .howto {
    background:var(--fond-encart); border:1px solid var(--bord); border-radius: 8px;
    padding: 11px 12px; margin-top: 9px;
  }
  .howto-mat {
    font-size: 11px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
    color:var(--accent-txt); margin-bottom: 7px;
  }
  .howto-list { margin: 0; padding-left: 17px; }
  .howto-list li { font-size: 13px; color:var(--texte-1b); line-height: 1.45; margin-bottom: 5px; }
  .howto-video {
    display: block; text-align: center; margin-top: 10px; min-height: 44px; line-height: 44px;
    border-radius: 8px; border:1px solid var(--bleu); background: rgba(74,158,255,0.14);
    color:var(--bleu-pill); font-size: 13px; font-weight: 700; text-decoration: none;
  }
  .howto-note { font-size: 11px; color:var(--texte-3); margin-top: 8px; line-height: 1.4; }
  .exercise-item-done { border-left-color:var(--vert); background: rgba(140,170,124,0.07); }
  .exercise-item-done .exercise-item-name { color:var(--vert-pill); }
  .exercise-check-icon { color:var(--vert-txt); flex-shrink: 0; font-weight: 900; }

  /* Pastilles : seulement pour les exercices chronométrés, sans charge.
     Zone de frappe portée à 46 px par un pseudo-élément, écart suffisant pour
     que deux zones voisines ne se chevauchent pas. */
  .set-row { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; row-gap: 14px; margin-top: 12px; }
  .set-dot {
    position: relative;
    width: 30px; height: 30px; border-radius: 50%; border:1.5px solid var(--bord-fort); background: transparent;
    color:var(--texte-1b); font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .set-dot::after { content: ""; position: absolute; top: -8px; right: -8px; bottom: -8px; left: -8px; }
  .set-remaining { font-size: 12px; color:var(--texte-2); }

  /* Saisie série par série : la charge peut monter ou descendre entre les séries. */
  .serie-table { margin-top: 10px; }
  .serie-line { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .serie-num {
    width: 20px; flex-shrink: 0; text-align: center;
    font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; font-weight: 700; color:var(--texte-2);
  }
  .serie-line-filled .serie-num { color:var(--accent-txt); }
  .serie-input {
    width: 74px; min-height: 46px; background: var(--fond-champ); border:1.5px solid var(--bord-fort); border-radius: 8px;
    color:var(--texte); font-size: 16px; padding: 0 8px; text-align: center;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .serie-input:focus { outline:2px solid var(--accent); border-color:var(--accent); }
  .serie-unit { font-size: 12px; color:var(--texte-2); flex-shrink: 0; }
  .serie-x { color:var(--texte-2); font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .serie-sub {
    font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; font-weight: 700;
    color:var(--accent-txt); margin-left: auto; flex-shrink: 0;
  }

  .exo-compare {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    background:var(--fond-carte); border-radius: 8px; padding: 9px 11px; margin-top: 9px;
    font-size: 12px; color:var(--texte-2);
  }
  .exo-compare b { color:var(--texte); font-weight: 700; font-family: ui-monospace, "SF Mono", monospace; font-size: 14px; }
  .exo-today b { color:var(--accent-txt); }
  .load-up { color:var(--vert-txt); font-weight: 700; }
  .load-down { color:var(--rouge-txt); font-weight: 700; }

  .tonnage-line {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    background:var(--fond-carte); border-radius: 8px; padding: 10px 12px; margin-top: 12px;
  }
  .tonnage-value { font-family: ui-monospace, "SF Mono", monospace; font-size: 19px; font-weight: 700; color:var(--accent-txt); }
  .tonnage-label { font-size: 12px; color:var(--texte-2); }

  /* --- Repliage groupe de ce qui est fait (v1.6.0) -------------------------
     Pose JUSTE AU-DESSUS de la liste : ce qui se replie est entierement sous
     lui, donc il ne bouge pas sous le doigt qui l'actionne. */
  .fold-done-btn {
    display: block; width: 100%; min-height: 44px; margin-top: 8px;
    background: transparent; border:1px solid var(--bord-fort) !important;
    border-radius: 8px; color:var(--texte-2); font-size: 12px; font-weight: 600;
    font-family: inherit;
  }

  .all-done-hint {
    background: rgba(140,170,124,0.14); border:1px solid var(--vert); color:var(--vert-pill);
    font-size: 13px; font-weight: 600; padding: 10px 12px; border-radius: 8px; margin-top: 12px;
  }

  .nutrition-list { list-style: none; margin: 12px 0 0; padding: 0; }
  .nutrition-item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 12px 8px; min-height: 48px; border-radius: 6px;
    border: none; border-bottom:1px solid var(--bord); border-left: 3px solid transparent;
    background: transparent; color: inherit; font-family: inherit;
  }
  .nutrition-list li:last-child .nutrition-item { border-bottom: none; }
  .nutrition-item-done { border-left-color:var(--vert); background: rgba(140,170,124,0.07); }
  .nutrition-item-done .nutrition-item-name { color:var(--vert-pill); }
  .nutrition-check-icon { color:var(--vert-txt); flex-shrink: 0; margin-left: auto; font-weight: 900; }
  .nutrition-time { font-family: ui-monospace, "SF Mono", monospace; font-size: 13px; font-weight: 700; color:var(--accent-txt); min-width: 48px; }
  .nutrition-item-text { display: flex; flex-direction: column; flex: 1; }
  .nutrition-item-name { font-size: 14px; color:var(--texte); }
  .nutrition-item-note { font-size: 12px; color:var(--texte-2); margin-top: 1px; }

  .checkin-btn {
    width: 100%; min-height: 54px; border-radius: 10px; border:1.5px solid var(--bord-fort) !important; background: transparent;
    color:var(--texte); font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px;
  }
  .checkin-btn-active { background:var(--vert); border-color:var(--vert) !important; color:var(--sur-accent); }

  .field { margin-bottom: 14px; }
  .field-label { font-size: 14px; color:var(--texte-2); margin-bottom: 6px; display:block; }
  .weight-input {
    width: 100%; min-height: 50px; background: var(--fond-champ); border:1.5px solid var(--bord-fort); border-radius: 10px;
    color:var(--texte); font-size: 18px; padding: 0 14px; font-family: ui-monospace, "SF Mono", monospace;
  }
  .weight-input:focus { outline:2px solid var(--accent); border-color:var(--accent); }
  .field-hint { font-size: 12px; color:var(--texte-2); margin-top: 5px; }

  .level-row { display:flex; gap: 8px; }
  .level-btn {
    flex: 1; min-height: 48px; border-radius: 8px; border:1.5px solid var(--bord-fort) !important; background: transparent;
    color:var(--texte-1b); font-size: 14px; font-weight: 600;
  }
  .level-btn-active { background:var(--accent); border-color:var(--accent) !important; color:var(--sur-accent); }

  /* L'échelle verticale est en HTML, dans une gouttière à gauche : le SVG est en
     preserveAspectRatio="none", donc tout texte placé dedans serait étiré. */
  .chart-wrap { position: relative; padding-left: 32px; margin-top: 6px; }
  .weight-svg { width: 100%; height: 150px; display: block; }
  .chart-yaxis { position: absolute; left: 0; top: 0; width: 28px; height: 150px; }
  .chart-ytick {
    position: absolute; right: 0; transform: translateY(-50%);
    font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color:var(--texte-2);
    background:var(--fond-pill-2); padding: 0 2px; line-height: 1.1;
  }
  .chart-ytick-target { color:var(--vert-txt); font-weight: 700; }
  .chart-labels { display: flex; justify-content: space-between; font-size: 11px; color:var(--texte-2); margin-top: 6px; padding-left: 32px; }
  .chart-labels b { color:var(--texte); font-family: ui-monospace, "SF Mono", monospace; font-weight: 700; }
  .chart-target-label { color:var(--vert-txt); font-weight: 600; }
  .chart-modes { display: flex; gap: 6px; margin-bottom: 10px; }
  .chart-mode-btn {
    flex: 1; min-height: 44px; border-radius: 8px; border:1.5px solid var(--bord-fort) !important;
    background: transparent; color:var(--texte-1b); font-size: 12px; font-weight: 600;
  }
  .chart-mode-active { background:var(--accent); border-color:var(--accent) !important; color:var(--sur-accent); }
  /* --- Ce que la courbe ne montre pas, et le moyen de le voir (v1.6.0) ----- */
  .chart-span {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 8px; font-size: 11px; color:var(--texte-2); line-height: 1.4;
  }
  .chart-span span { flex: 1 1 150px; }
  .chart-span-btn {
    min-height: 36px; padding: 0 12px; background: transparent;
    border:1px solid var(--bord-fort) !important; border-radius: 8px;
    color:var(--texte-1b); font-size: 11px; font-weight: 600; font-family: inherit;
  }

  .chart-legend { display: flex; gap: 14px; justify-content: center; font-size: 11px; color:var(--texte-2); margin-top: 8px; flex-wrap: wrap; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

  .stat-grid { display: flex; gap: 10px; margin-bottom: 12px; }
  .stat-box { flex: 1; text-align: center; padding: 11px 6px; border-radius: 10px; background:var(--fond-carte); border:1.5px solid var(--bord); }
  .stat-num { font-family: ui-monospace, "SF Mono", monospace; font-size: 18px; font-weight: 700; color:var(--accent-txt); }
  .stat-label { font-size: 11px; color:var(--texte-2); margin-top: 3px; line-height: 1.3; }

  .badges { display:flex; gap: 10px; }
  .badge { flex: 1; text-align: center; padding: 12px 6px; border-radius: 10px; border:1.5px solid var(--bord-fort); background:var(--fond-carte); }
  .badge-unlocked { border-color:var(--accent); background: rgba(232,183,74,0.14); }
  .badge-num { font-family: ui-monospace, "SF Mono", monospace; font-size: 18px; font-weight: 700; color:var(--texte-1b); }
  .badge-unlocked .badge-num { color:var(--accent-txt); }
  .badge-label { font-size: 12px; color:var(--texte-1b); margin-top: 2px; font-weight: 600; }
  .total-line { text-align:center; font-size: 12px; color:var(--texte-2); margin-top: 12px; line-height: 1.5; }

  .footer-row { text-align: center; margin-top: 8px; }
  .reset-btn { background: none; color:var(--texte-3); font-size: 12px; min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 5px; }
  .update-btn {
    background: rgba(74,158,255,0.14); border:1px solid var(--bleu) !important; color:var(--bleu-pill);
    font-size: 12px; font-weight: 700; padding: 0 18px; min-height: 44px; border-radius: 22px;
    display: inline-flex; align-items: center; gap: 5px; margin-bottom: 10px;
  }
  .version-tag { font-size: 11px; color:var(--texte-3); margin-top: 8px; }

  button:active { transform: scale(0.96); filter: brightness(1.25); }
  .nutrition-item:active { background: rgba(244,217,18,0.10); }
  .set-dot:active { border-color:var(--accent); }

  input:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset: 2px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* --- Diagnostic de première utilisation ---------------------------------- */
  .ob-container { max-width: 460px; }
  .ob-dots { display: flex; gap: 5px; justify-content: center; margin-bottom: 10px; }
  .ob-dot { width: 22px; height: 4px; border-radius: 2px; background:var(--bord); }
  .ob-dot-past { background:var(--bord-moyen); }
  .ob-dot-on { background:var(--accent); }
  .ob-step-label {
    text-align: center; font-size: 11px; color:var(--texte-3); margin-bottom: 14px;
    text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700;
  }
  .ob-card { padding: 18px 16px; }
  .ob-lead { font-size: 15px; line-height: 1.5; color:var(--texte-1b); margin: 0 0 16px; }
  .ob-lead b { color:var(--texte); }

  .ob-row { display: flex; gap: 8px; }
  .ob-row-wrap { flex-wrap: wrap; }
  .ob-chip {
    flex: 1 1 auto; min-width: 88px; min-height: 48px; padding: 0 12px; border-radius: 9px;
    border:1.5px solid var(--bord-fort) !important; background: transparent; color:var(--texte-1b);
    font-size: 13px; font-weight: 600; font-family: inherit;
  }
  .ob-chip-on { background:var(--accent); border-color:var(--accent) !important; color:var(--sur-accent); font-weight: 700; }

  /* Sept jours sur une ligne : cases carrées, zone de frappe suffisante. */
  .ob-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .ob-day {
    min-height: 52px; border-radius: 9px; border:1.5px solid var(--bord-fort) !important;
    background: transparent; color:var(--texte-1b); font-size: 12px; font-weight: 700; font-family: inherit;
  }
  .ob-day-on { background:var(--accent); border-color:var(--accent) !important; color:var(--sur-accent); }

  .ob-equip-list { display: flex; flex-direction: column; gap: 8px; }
  .ob-equip {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    min-height: 58px; padding: 10px 12px; border-radius: 10px;
    border:1.5px solid var(--bord-fort) !important; background: transparent; font-family: inherit;
  }
  .ob-equip-on { border-color:var(--accent) !important; background: rgba(244,217,18,0.09); }
  .ob-equip-box {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px; border:1.5px solid var(--bord-fort);
    color:var(--sur-accent); font-size: 14px; font-weight: 900; line-height: 22px; text-align: center;
  }
  .ob-equip-on .ob-equip-box { background:var(--accent); border-color:var(--accent); }
  .ob-equip-text { display: flex; flex-direction: column; gap: 2px; }
  .ob-equip-text b { font-size: 14px; color:var(--texte); font-weight: 700; }
  .ob-equip-text span { font-size: 12px; color:var(--texte-2); line-height: 1.35; }

  /* Sous-liste des machines : décalée et sur fond sombre pour qu'on voie qu'elle
     dépend de la case « salle de sport » juste au-dessus. */
  .ob-gear {
    margin-top: 16px; padding: 13px 12px 4px; border-radius: 10px;
    background:var(--fond-encart); border:1px solid var(--bord);
  }
  .ob-equip-sub { min-height: 52px; padding: 8px 11px; }
  .ob-equip-sub .ob-equip-text b { font-size: 13px; }
  .ob-equip-sub .ob-equip-box { width: 22px; height: 22px; line-height: 20px; font-size: 13px; }
  .ob-gear .ob-note { margin-bottom: 10px; }

  /* Affectation muscu / course, un bouton par jour choisi. */
  .ob-kinds { display: flex; flex-wrap: wrap; gap: 6px; }
  .ob-kind {
    flex: 1 1 auto; min-width: 62px; min-height: 54px; border-radius: 9px;
    border:1.5px solid var(--bord-fort) !important; background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-family: inherit;
  }
  .ob-kind-day { font-size: 13px; font-weight: 700; color:var(--texte); }
  .ob-kind-what { font-size: 10px; color:var(--texte-2); text-transform: uppercase; letter-spacing: 0.4px; }
  .ob-kind-run { border-color:var(--bleu) !important; background: rgba(74,158,255,0.12); }
  .ob-kind-run .ob-kind-day { color:var(--bleu-pill); }
  .ob-kind-run .ob-kind-what { color:var(--bleu-txt); font-weight: 700; }

  .ob-sess { margin-bottom: 14px; }
  .ob-sess-head {
    display: flex; align-items: center; gap: 6px; font-size: 13px; color:var(--texte-2);
    padding-bottom: 6px; border-bottom:1px solid var(--bord); margin-bottom: 4px;
  }
  .ob-sess-head b { color:var(--accent-txt); text-transform: capitalize; }
  .ob-exo-list { list-style: none; margin: 0; padding: 0; }
  .ob-exo {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; border-bottom:1px solid var(--sep);
  }
  .ob-exo:last-child { border-bottom: none; }
  .ob-exo-text { display: flex; flex-direction: column; flex: 1; gap: 1px; }
  .ob-exo-text b { font-size: 13px; color:var(--texte); font-weight: 600; }
  .ob-exo-text span { font-size: 11px; color:var(--texte-3); }
  .ob-exo-no {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    border:1px solid var(--bord-moyen) !important; background: transparent; color:var(--texte-2);
    font-size: 13px; font-weight: 700; font-family: inherit;
  }
  .ob-exo-no:active { border-color:var(--rouge) !important; color:var(--rouge-txt); }
  .ob-excluded { margin-top: 12px; padding-top: 12px; border-top:1px solid var(--bord); }
  .ob-back-chip {
    display: inline-block; margin: 4px 5px 0 0; min-height: 38px; padding: 0 11px; border-radius: 19px;
    border:1px solid var(--bord-moyen) !important; background: transparent; color:var(--texte-2);
    font-size: 12px; font-family: inherit;
  }

  .ob-note {
    background:var(--fond-carte); border-left:3px solid var(--accent); border-radius: 6px;
    padding: 10px 12px; font-size: 13px; color:var(--texte-1b); line-height: 1.45; margin-top: 12px;
  }
  .ob-note b { color:var(--texte); }
  .ob-warn {
    background: rgba(193,104,95,0.13); border:1px solid var(--rouge-fort); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; color:var(--rouge-pill); line-height: 1.45; margin-top: 12px;
  }
  .ob-warn-soft { background: rgba(140,132,116,0.10); border-color:var(--bord-moyen); color:var(--texte-2); }
  .ob-warn b { color:var(--texte); }

  .ob-recap { background:var(--fond-carte); border-radius: 10px; padding: 4px 12px; margin-bottom: 12px; }
  .ob-recap-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 9px 0; border-bottom:1px solid var(--sep); font-size: 13px; color:var(--texte-2);
  }
  .ob-recap-row:last-child { border-bottom: none; }
  .ob-recap-row b { color:var(--texte); font-weight: 700; text-align: right; }

  .ob-restore { margin-top: 18px; padding-top: 14px; border-top:1px solid var(--bord); }
  .ob-restore-btn {
    width: 100%; min-height: 46px; border-radius: 8px; background: transparent;
    border:1px dashed var(--bord-fort) !important; color:var(--texte-2); font-size: 13px; font-family: inherit;
  }

  .ob-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .ob-back {
    min-height: 50px; padding: 0 18px; border-radius: 10px; background: transparent;
    border:1.5px solid var(--bord-fort) !important; color:var(--texte-1b); font-size: 14px; font-weight: 600;
  }
  .ob-next {
    flex: 1; min-height: 54px; border-radius: 10px; background:var(--accent); border: none;
    color:var(--sur-accent); font-size: 15px; font-weight: 800;
  }
  .ob-next[disabled] { background:var(--bord); color:var(--texte-3); }
  .ob-safe { text-align: center; font-size: 11px; color:var(--texte-3); margin-top: 14px; line-height: 1.5; }

  /* --- Carte profil, dans Bilan & réglages --------------------------------- */
  .profile-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 8px 0; border-bottom:1px solid var(--sep); font-size: 13px; color:var(--texte-2);
  }
  .profile-row:last-of-type { border-bottom: none; }
  .profile-row b { color:var(--texte); font-weight: 600; text-align: right; }
  .profile-btn {
    width: 100%; min-height: 48px; margin-top: 12px; border-radius: 8px;
    border:1.5px solid var(--bord-fort) !important; background: transparent; color:var(--texte-1b);
    font-size: 13px; font-weight: 600;
  }
  /* --- Retouche d'un point du profil, borne de l'historique (v1.6.0) ------- */
  .profile-rows > :last-child { border-bottom: none !important; }
  .profile-row-btn {
    width: 100%; min-height: 44px; background: transparent;
    border: none; border-bottom:1px solid var(--sep) !important;
    font-family: inherit; font-size: 13px; text-align: left;
  }
  .profile-row-go { color:var(--texte-3); font-size: 16px; margin-left: 2px; }
  .histo-note {
    font-size: 11px; color:var(--texte-3); line-height: 1.45;
    margin-top: 8px; text-align: center;
  }
  /* --- Correction d'une prise, fiches de complements (v1.5.0) --------------
     Ecrit DIRECTEMENT en variables de theme. Ce bloc est injecte apres le
     passage de theme.py, qui ne repassera donc pas dessus : une couleur en dur
     ici resterait sombre sur le theme clair, et personne ne le verrait avant
     d'ouvrir l'appli en plein jour. */
  .nutrition-row { display: flex; align-items: stretch; gap: 0; }
  .nutrition-row .nutrition-item { flex: 1; min-width: 0; }
  .nutrition-row-edit { background: var(--fond-encart); }
  /* 44 px : la cible tactile minimale. Corriger est rare, mais rate' deux fois
     de suite, ce n'est plus rare, c'est agacant. */
  .nutri-edit-btn {
    flex: 0 0 44px; width: 44px; background: none; border: none;
    border-bottom: 1px solid var(--sep); color: var(--texte-3);
    font-size: 15px; cursor: pointer; padding: 0;
  }
  .nutrition-list li:last-child .nutri-edit-btn { border-bottom: none; }
  /* --accent-txt et NON --accent, ici comme partout ou le citron est du TEXTE.
     Mesure : --accent sur --fond-pill en theme clair = 1,08:1, le crayon
     disparaissait pendant l'appui. */
  .nutri-edit-btn:active { background: var(--fond-pill); color: var(--accent-txt); }
  /* Meme raison : ce point marque une prise corrigee, sur le fond de carte.
     Mesure : --accent = 1,28:1 sur la page claire, 1,40:1 sur la carte. */
  .nutri-corrige { color: var(--accent-txt); font-weight: 900; margin-left: 5px; }

  .nutri-edit-supprime { padding: 10px 12px 12px; background: var(--fond-encart);
                border-left: 2px solid var(--accent); }
  .nutri-edit-base { font-size: 12px; color: var(--texte-2); line-height: 1.5;
                     margin-bottom: 10px; }
  .nutri-edit-base b { color: var(--texte); font-weight: 600; }
  .nutri-choix { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .nutri-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 10px; min-height: 36px;
    background: var(--fond-pill); border: 1px solid var(--bord-discret);
    border-radius: 8px; color: var(--texte-1b); font-size: 12px;
    font-family: inherit; cursor: pointer; text-align: left;
  }
  /* Jeton selectionne : meme traitement que .tab-active, .day-btn-active et
     .ob-chip-on — aplat d'accent, texte --sur-accent. La version precedente
     posait « background: var(--accent-pill); color: var(--accent) », soit une
     var de TEXTE en fond et une var de SURFACE en texte, les deux roles
     inverses. Mesure en theme sombre : 1,11:1, le libelle du jeton choisi
     etait illisible — et c'est le seul repere qui dit lequel est choisi. */
  .nutri-chip-on { border-color: var(--accent); color: var(--sur-accent); background: var(--accent); }
  .nutri-chip-num { color: var(--texte-3); font-size: 11px; }
  .nutri-chip-on .nutri-chip-num { color: var(--sur-accent); }

  /* Trois niveaux, trois couleurs, et le plus severe seul en avant. Afficher
     cinq remarques d'un coup sur un telephone, c'est n'en faire lire aucune. */
  .nutri-avis { margin: 8px 0 4px; padding: 8px 10px; border-radius: 8px;
                font-size: 12px; line-height: 1.45; }
  /* Teinte translucide en fond, --*-pill en texte : exactement le patron de
     .banner-ok / .banner-info / .banner-error, qui tiennent leur seuil dans les
     deux themes. La version precedente posait le --*-pill EN FOND et le --*-txt
     EN TEXTE, les deux roles inverses. Mesure : 1,90 et 1,26 pour le vert,
     1,45 et 1,24 pour le rouge, et 1,00:1 pour le bleu en theme sombre —
     --bleu-txt et --bleu-pill y sont le MEME hexadecimal, #bcdcff : l'avis
     etait litteralement invisible. */
  .nutri-avis-0 { background: rgba(140,170,124,0.15); color: var(--vert-pill); }
  .nutri-avis-1 { background: rgba(74,158,255,0.12); color: var(--bleu-pill); }
  .nutri-avis-2 { background: rgba(193,104,95,0.15); color: var(--rouge-pill); }
  .nutri-avis-plus { font-size: 11px; color: var(--texte-3); line-height: 1.45;

  .nutri-edit-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  /* btn-primary et btn-ghost n'existaient pas dans le livrable : la carte
     Analyse a ses .ana-ok-btn / .ana-non-btn, le diagnostic les siens. On les
     definit ici, avec exactement la meme geometrie (44 px de haut, meme rayon)
     pour qu'un bouton n'ait pas deux tailles selon la carte ou il apparait. */
  .btn-primary {
    flex: 1; min-height: 44px; border-radius: 8px; border: none; padding: 0 12px;
    background: var(--accent); color: var(--sur-accent);
    font-size: 13px; font-weight: 800; font-family: inherit; cursor: pointer;
  }
  /* PAS `opacity`. Un voile compose le texte ET le fond sur le parent : le
     couple tombait a 3,61:1 en sombre et 2,71:1 en clair, et sortait du champ du
     banc de contraste, qui ne mesure pas l'opacite. Deux var() declarees, avec
     leurs roles — --bord est un fond, --texte-2 est du texte — donnent 4,59:1 en
     sombre et 5,82:1 en clair, et redeviennent mesurables. */
  .btn-primary[disabled] { background:var(--bord); color:var(--texte-2); cursor: default; }

  .nutri-remise { margin-top: 8px; }

  /* La carte qui explique un plan recompose. Elle est en tete de la carte
     Nutrition et non dans la liste depliable : un message qu'il faut deplier

  .nutri-migre { margin: 0 0 12px; padding: 10px 12px 12px;

  /* --accent-txt et NON --accent. Le citron est une couleur de FOND : en TEXTE

     l'ecran et il etait invisible. Le liseré au-dessus, lui, garde --accent :
     c'est un aplat, pas du texte. Meme piege que « ✓ Valider la seance » a
     1,13:1, deja corrige lors de la pose du theme. Le HTML est juste et c'est
     la couleur CALCULEE qui est fausse : c'est pourquoi aucun banc ne le voyait
     — test_c_contraste.js le voit desormais, et le prouve en echouant des qu'on
     remet --accent ici. */
  .nutri-migre-t { font-size: 13px; font-weight: 800; color: var(--accent-txt);
                   margin-bottom: 6px; }
  .nutri-migre-c { font-size: 12px; color: var(--texte-1b); line-height: 1.5;

<script>
/* Pose le theme avant le premier rendu, pour eviter le clignotement. */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem("olivier-coach-settings") || "{}");
    var t = s && s.theme;
    if (t !== "clair" && t !== "sombre" && t !== "systeme") t = "systeme";
    if (t === "systeme") {
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
            ? "clair" : "sombre";
    }
    document.documentElement.setAttribute("data-theme", t);
    var m = document.getElementById("meta-theme");
    if (m && t === "clair") m.setAttribute("content", "#f7f3ea");
  } catch (e) { /* theme sombre par defaut */ }
})();
</script>

  // --- Theme -----------------------------------------------------------
  // « systeme » est resolu ici vers une valeur CONCRETE, sombre ou clair,
  // plutot que laisse a une media query. Deux raisons : le CSS reste une
  // simple paire de palettes sans cascade conditionnelle, et le JavaScript
  // peut relire les couleurs du graphique sans avoir a deviner quel theme
  // s'applique.
  function couleurCss(nom) {
    try {
      var v = window.getComputedStyle(document.documentElement).getPropertyValue("--" + nom);
      v = String(v || "").replace(/^\s+|\s+$/g, "");
      return v || null;
    } catch (e) { return null; }
  }

  function themeSysteme() {
    try {
      return (window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches) ? "clair" : "sombre";
    } catch (e) { return "sombre"; }
  }

  function themeEffectif() {
    return state.theme === "systeme" ? themeSysteme() : state.theme;
  }

  function appliqueTheme() {
    var eff = themeEffectif();
    try { document.documentElement.setAttribute("data-theme", eff); } catch (e) {}
    // La barre d'etat d'iOS suit cette balise. Elle n'accepte pas var(), c'est
    // le seul endroit ou il faut relire la valeur reelle.
    try {
      var m = document.getElementById("meta-theme");
      if (m) m.setAttribute("content", couleurCss("fond") || "#100f0d");
    } catch (e) {}
  }

  // programme actif : c'est ce qui permet de refaire le diagnostic sans perdre

  // ses séries écartées par cleanEntry au chargement suivant, définitivement.
  var CAT_BY_ID = {};
  var EXERCISE_IDS = {};

    var i;
    for (i = 0; i < CATALOG.length; i++) {
      CAT_BY_ID[CATALOG[i].id] = CATALOG[i];
      EXERCISE_IDS[CATALOG[i].id] = true;
    }
  })();

  // La découpe suit le nombre de séances, pas les jours choisis. En dessous de

  // ===========================================================================
  // L'OBJECTIF CONFIRME, ET CE QU'IL CHANGE DANS LE PROGRAMME
  // ---------------------------------------------------------------------------
  // Jusqu'ici l'appli DEDUISAIT l'objectif de l'ecart entre le poids du jour et
  // le poids vise, et ne le disait jamais. Deux consequences mesurees sur le
  // livrable v1.9.3 :

  //     alors que 200 g sur une balance de salle de bain sont du bruit ;

  //     rigoureusement le meme pour quelqu'un qui veut perdre dix kilos et pour
  //     quelqu'un qui veut en prendre huit.
  //

  // qui la valide. Poser une question ouverte aurait autorise « je veux prendre

  // l'appli aurait ensuite du arbitrer toute seule, en silence.
  //
  // LE CHAMP N'EST PAS OBLIGATOIRE, ET C'EST VOULU. `objectif` vaut null tant
  // qu'il n'a pas ete confirme, et un profil a null recoit EXACTEMENT le
  // programme de la v1.9.3, a l'octet pres. C'est ce qui permet a un profil deja
  // installe — celui du telephone d'Olivier, en v1.4.1 — de ne pas voir son plan

  //
  // TROIS LEVIERS, ET AUCUN N'EST DECORATIF. Ils sont mesures par test_c_objectif :
  //   1. LA DECOUPE. En prise de masse, le jour de HIIT et le jour de cardio ne
  //      sont pas des jours de prise : ils sont remplaces par du travail avec
  //      charges. En perte, ils restent — c'est justement ce qu'on vient
  //      chercher.
  //   2. LES ZONES VISEES. En prise de masse seulement : les creneaux qui
  //      servent une zone choisie passent de « confort » a « utile » (ils ne sont
  //      donc plus les premiers sacrifies quand le temps manque) et gagnent une
  //      serie. Une prise ciblee « haut du corps » ne rend pas la meme seance

  // qu'il ne changeait RIEN : a 30 minutes et trois jours, le programme de perte

  // Les trois objectifs. `v` est ce qui est stocke ; rien d'autre n'est accepte

  var OBJ_SCHEMA = {

  // la tete n'est pas un nombre ressort INTACTE : le catalogue en porte, et les
  // reecrire au chausse-pied produirait la ligne absurde qu'on passe son temps

  function objDecalerReps(reps, sch) {

    if (hi < lo) hi = lo;
    if (hi > sch.repsMax) hi = sch.repsMax;
    if (lo > hi) lo = hi;
    return (lo === hi ? String(lo) : (lo + "-" + hi)) + s.slice(m[0].length);

    if (r > OBJ_REPOS_MAX) r = OBJ_REPOS_MAX;
    return r;

  // Copie d'une entree de catalogue. Voir l'entete : `chosen[i].ex` pointe sur

  // les profils construits ensuite dans le meme onglet.
  function objCopieEx(ex) {
    var o = {}, k;
    for (k in ex) { if (has(ex, k)) o[k] = ex[k]; }
    return o;

  // --- L'application des leviers 2, 3 et 4 sur une seance en construction ------
  // Appelee par buildSession JUSTE APRES le remplissage des creneaux et AVANT la

  // apres la taille, une serie de plus aurait fait deborder la seance sans que
  // le budget de temps ait son mot a dire ; un repos allonge n'aurait compte
  // dans aucun cout, et l'appli aurait annonce une duree fausse.

  var OBJ_SETS_MAX = 5;

    var i, c;

      // LEVIER 3 — le schema. Il ne touche que les exercices qui se comptent en

      if (sch && c.ex.reps) {

      // LEVIER 4 — en perte, le gainage et le cardio ne sont plus les premiers
      // sacrifies. C'est le seul effet de la branche « perte », et il est reel :
      // a 30 minutes, une seance perdait son gainage AVANT toute autre chose,
      // c'est-a-dire exactement le creneau qu'on vient chercher.
      if (obj === "perte" && c.prio === 3 &&

        c.prio = 2;
      }

      // LEVIER 2 — les zones visees, en prise de masse uniquement (zonesDe le
      // garantit). Le creneau passe de « confort » a « utile », donc il survit a
      // la taille, et il gagne une serie s'il se compte en repetitions.
      if (vises[c.ex.pat]) {
        if (c.prio === 3) c.prio = 2;
        if (c.ex.reps && c.sets < OBJ_SETS_MAX) c.sets++;
      }
    }
  }

  // --- Ce que l'ecran en dit ---------------------------------------------------
  // Une phrase par branche, ecrite au present et sans promesse. Elle est lue au
  // diagnostic ET dans la carte de profil : deux copies auraient diverge.
  function objPhrase(prof) {
    var obj = objectifDe(prof), z, i, noms;
    if (obj === "prise") {
      z = zonesDe(prof); noms = [];
      for (i = 0; i < z.length; i++) noms.push(zoneDef(z[i]).label.toLowerCase());
      return noms.length
        ? "Prise de masse, en insistant sur " + noms.join(", ") + "."
        : "Prise de masse.";
    }
    if (obj === "perte") return "Perte de poids : repos plus court, gainage et cardio préservés.";
    if (obj === "tonifier") return "Tonification à poids constant : plus de répétitions, moins de repos.";
    return "Objectif non confirmé.";
  }

  // Le resume court de la carte de profil et de l'ecran de fin de diagnostic.
  function objResume(prof) {
    var obj = objectifDe(prof), d = objectifDef(obj), z;
    if (!d) return "non confirmé";
    if (obj !== "prise") return d.court;
    z = zonesDe(prof);
    return d.court + (z.length ? " · " + z.length + " zone" + (z.length > 1 ? "s" : "") : "");
  }

  function splitFor(n) {
    if (n <= 1) return [TPL.fullA];
    if (n === 2) return [TPL.fullA, TPL.fullB];
    if (n === 3) return [TPL.fullA, TPL.fullB, TPL.fullC];
    if (n === 4) return [TPL.haut, TPL.bas, TPL.hautB, TPL.basB];
    if (n === 5) return [TPL.push, TPL.pull, TPL.legs, TPL.hiit, TPL.full];
    if (n === 6) return [TPL.push, TPL.pull, TPL.legs, TPL.haut, TPL.bas, TPL.hiit];
    return [TPL.push, TPL.pull, TPL.legs, TPL.haut, TPL.bas, TPL.hiit, TPL.cardio];
  }

  // --- Remplissage d'un créneau ------------------------------------------------
  function candidatesFor(pat, avail, excluded, used) {
    var out = [], i, ex, j, ok;
    for (i = 0; i < CATALOG.length; i++) {
      ex = CATALOG[i];
      if (ex.pat !== pat) continue;
      if (excluded[ex.id]) continue;
      if (used[ex.id]) continue;
      ok = true;
      for (j = 0; j < ex.equip.length; j++) {
        if (!avail[ex.equip[j]]) { ok = false; break; }
      }
      if (ok) out.push(ex);
    }
    out.sort(function (a, b) { return a.rank - b.rank; });
    return out;
  }

  function pickForSlot(slot, avail, excluded, used) {
    var c = candidatesFor(slot.pat, avail, excluded, used);
    if (!c.length && slot.fb) c = candidatesFor(slot.fb, avail, excluded, used);
    if (!c.length) return null;
    return c[Math.min(slot.alt, c.length - 1)];
  }

  // --- Construction d'une séance ----------------------------------------------
  // On remplit tous les créneaux possibles, puis on TAILLE pour tenir dans le
  // temps annoncé : d'abord en retirant une série aux exercices de confort,
  // ensuite en supprimant les créneaux, du moins important au plus important.
  // Les créneaux de priorité 1 ne sont jamais touchés : une séance sans sa
  // poussée principale n'est plus la séance.
  function buildSession(tpl, profile) {
    var avail = { bw: true }, excluded = {}, used = {}, i, chosen = [], ex;
    for (i = 0; i < profile.equipment.length; i++) avail[profile.equipment[i]] = true;
    if (avail.mach) { for (i = 0; i < GYM_IMPLIES.length; i++) avail[GYM_IMPLIES[i]] = true; }
    for (i = 0; i < profile.excluded.length; i++) excluded[profile.excluded[i]] = true;

    // Machines déclarées absentes : on les verse dans les exclusions plutôt que
    // d'ajouter un filtre au sélecteur. Même effet, un seul chemin à tester.
    var noGear = {}, ng = profile.noGear || [];
    for (i = 0; i < ng.length; i++) noGear[ng[i]] = true;
    for (i = 0; i < CATALOG.length; i++) {
      if (CATALOG[i].gear && noGear[CATALOG[i].gear]) excluded[CATALOG[i].id] = true;
    }

    for (i = 0; i < tpl.slots.length; i++) {
      ex = pickForSlot(tpl.slots[i], avail, excluded, used);
      if (!ex) continue;                       // aucun candidat : créneau sauté
      used[ex.id] = true;
      // idx retient la place du créneau dans la séance : après une coupe puis un
      // repêchage, il permet de remettre l'exercice à sa position d'origine, et
      // non à la fin. L'ordre compte : les polyarticulaires passent avant les
      // isolations, on ne finit pas une séance par un soulevé de terre.
      chosen.push({ ex: ex, prio: tpl.slots[i].prio, sets: ex.sets || 1, idx: i });
    }

    // L'OBJECTIF CONFIRME AGIT ICI, ET AVANT LA TAILLE. Voir objRenforcer :
    // zones visees, schema de repetitions et de repos, survie du gainage en
    // perte. Sans objectif confirme, elle ne fait rien du tout.
    objRenforcer(chosen, profile);

    var budget = profile.minutes * 60;
    function currentList() {
      return chosen.map(function (c) {
        var o = {}, k;
        for (k in c.ex) { if (has(c.ex, k)) o[k] = c.ex[k]; }
        o.sets = c.sets;
        return o;
      });
    }
    function cost() { return totalCost(currentList()); }

    var guard = 0;
    // 1. Alléger les exercices de confort avant d'en supprimer.
    while (cost() > budget && guard++ < 60) {
      var trimmed = false, j;
      for (j = chosen.length - 1; j >= 0; j--) {
        if (chosen[j].prio === 3 && chosen[j].sets > 2 && !chosen[j].ex.mins && !chosen[j].ex.blockMins) {
          chosen[j].sets--; trimmed = true; break;
        }
      }
      if (!trimmed) break;
    }
    // 2. Puis supprimer, du confort vers l'utile, en partant de la fin.
    var dropped = [];
    guard = 0;
    while (cost() > budget && guard++ < 60) {
      var cut = -1, p, j2;
      for (p = 3; p >= 2 && cut < 0; p--) {
        for (j2 = chosen.length - 1; j2 >= 0; j2--) {
          if (chosen[j2].prio === p) { cut = j2; break; }
        }
      }
      if (cut < 0) break;                      // il ne reste que l'essentiel
      dropped.push(chosen.splice(cut, 1)[0]);
    }

    // 3. Repêchage. Sans cette passe, une seule coupe trop chère laissait le
    //    temps restant inutilisé : mesuré sur un full body de 50 minutes, la
    //    séance tombait à 4 exercices pour 40 minutes, alors que le gainage
    //    retiré tenait largement dans les 10 minutes qui restaient. On remet
    //    donc les créneaux écartés, du plus important au moins important, tant
    //    qu'ils rentrent.
    dropped.sort(function (a, b) { return a.prio - b.prio; });
    var byIdx = function (a, b) { return a.idx - b.idx; };
    for (var r = 0; r < dropped.length; r++) {
      var backup = chosen.slice();
      chosen.push(dropped[r]);
      chosen.sort(byIdx);
      if (cost() > budget) chosen = backup;
    }

    // 4. Extension. Un créneau sans candidat est simplement sauté : personne
    //    n'a de machine à mollets dans son salon. Une séance pouvait donc finir
    //    très en dessous du temps annoncé — mesuré sans aucun matériel, un PULL
    //    tombait à trois exercices et vingt minutes pour soixante-quinze
    //    demandées. On rallonge alors ce qui reste, un tour de série à la fois,
    //    plafonné à deux séries de plus que la prescription et à six au total :
    //    remplir le temps ne doit pas transformer la séance en marathon.
    guard = 0;
    var etendu = true;
    while (etendu && guard++ < 40) {
      etendu = false;
      for (var xi = 0; xi < chosen.length; xi++) {
        var cx = chosen[xi];
        if (cx.ex.mins || cx.ex.blockMins) continue;      // bloc chronométré
        var plafond = Math.min((cx.ex.sets || 1) + 2, 6);
        if (cx.sets >= plafond) continue;
        cx.sets++;
        if (cost() > budget) cx.sets--; else etendu = true;
      }
    }

    var list = currentList();
    var mins = Math.round(totalCost(list) / 60 / 5) * 5;
    return {
      code: tpl.code,
      label: tpl.label,
      sub: tpl.sub,
      duration: "~" + mins + " min",
      // La taille s'arrête aux créneaux structurants : en dessous d'une
      // trentaine de minutes, une séance complète ne rentre tout simplement pas.
      // On l'annonce plutôt que de laisser croire qu'elle tient dans le temps
      // demandé, et plutôt que de livrer une séance amputée de sa poussée.
      over: mins > profile.minutes,
      exercises: list.map(function (o) {
        var b = repsBounds(o.reps);
        return { id: o.id, name: o.name, detail: detailOf(o), sets: o.sets,
                 load: isLoadableEx(o), track: isLoadableEx(o) ? "load" : "none",
                 rest: o.rest || 60, repsLo: b.lo, repsHi: b.hi };
                 // kgCible reste absent tant que l'utilisateur n'a pas trouve sa
                 // charge : on ne devine pas a sa place au premier jour.
      })
    };
  }

  // ===========================================================================
  // COURSE À PIED
  // ---------------------------------------------------------------------------
  // Une séance de course ne se compte pas en kilos. Les séries portent
  // { km, min } au lieu de { kg, reps } : même forme de stockage, donc aucune
  // migration de l'historique, mais une allure calculée à la place d'un tonnage.
  // ===========================================================================
  var DISCIPLINES = [
    { v: "muscu",  label: "Musculation",    hint: "charges, machines ou poids de corps" },
    { v: "course", label: "Course à pied",  hint: "uniquement courir" },
    { v: "mixte",  label: "Les deux",       hint: "certains jours en salle, d'autres en course" }
  ];

  // L'allure de base sert à convertir le temps annoncé en distance. Le plafond
  // évite de prescrire une sortie longue de dix kilomètres à quelqu'un qui n'a
  // jamais couru : c'est la blessure la plus banale du débutant.
  var RUN_LEVELS = [
    { v: "debut",    label: "Je débute",        hint: "jamais couru, ou très peu", pace: 8.0, maxKm: 6 },
    { v: "regulier", label: "Je cours déjà",    hint: "une à deux fois par semaine", pace: 6.5, maxKm: 13 },
    { v: "entraine", label: "Je suis entraîné", hint: "trois fois par semaine ou plus", pace: 5.5, maxKm: 22 }
  ];

  function runLevel(v) {
    var i;
    for (i = 0; i < RUN_LEVELS.length; i++) { if (RUN_LEVELS[i].v === v) return RUN_LEVELS[i]; }
    return RUN_LEVELS[0];
  }

  var RUN_TPL = {
    easy: { code: "run-easy", label: "ENDURANCE", sub: "Footing facile", pat: "run-easy", alt: 0 },
    recup: { code: "run-recup", label: "RÉCUPÉRATION", sub: "Footing très lent", pat: "run-easy", alt: 1 },
    long: { code: "run-long", label: "SORTIE LONGUE", sub: "La durée avant l'allure", pat: "run-long", alt: 0 },
    interv: { code: "run-int", label: "FRACTIONNÉ", sub: "Intervalles courts", pat: "run-int", alt: 0 },
    cotes: { code: "run-hill", label: "CÔTES", sub: "Puissance en montée", pat: "run-hill", alt: 0 },
    seuil: { code: "run-tempo", label: "SEUIL", sub: "Allure soutenue et régulière", pat: "run-tempo", alt: 0 }
  };

  // Répartition de la semaine. Règle tenue partout : une seule séance dure par
  // semaine en dessous de quatre sorties, deux au maximum au-delà, et le reste
  // en facile. C'est la distribution qui fait progresser sans casser.
  // Un débutant ne reçoit AUCUNE séance de qualité : il lui faut d'abord des
  // semaines d'endurance. Les créneaux durs retombent alors sur du facile.
  function runWeek(n, niveau) {
    var lvl = niveau === "entraine" ? 3 : (niveau === "regulier" ? 2 : 1);
    var dur = lvl >= 3 ? RUN_TPL.seuil : (lvl >= 2 ? RUN_TPL.interv : RUN_TPL.easy);
    var dur2 = lvl >= 2 ? RUN_TPL.cotes : RUN_TPL.easy;
    if (n <= 1) return [RUN_TPL.easy];
    if (n === 2) return [RUN_TPL.easy, RUN_TPL.long];
    if (n === 3) return [RUN_TPL.easy, dur, RUN_TPL.long];
    if (n === 4) return [RUN_TPL.easy, dur, RUN_TPL.recup, RUN_TPL.long];
    if (n === 5) return [RUN_TPL.easy, dur, RUN_TPL.recup, dur2, RUN_TPL.long];
    if (n === 6) return [RUN_TPL.easy, dur, RUN_TPL.recup, dur2, RUN_TPL.easy, RUN_TPL.long];
    return [RUN_TPL.easy, dur, RUN_TPL.recup, dur2, RUN_TPL.easy, RUN_TPL.recup, RUN_TPL.long];
  }

  function pickRun(pat, alt, avail) {
    var c = [], i, ex, j, ok;
    for (i = 0; i < CATALOG.length; i++) {
      ex = CATALOG[i];
      if (ex.pat !== pat) continue;
      ok = true;
      for (j = 0; j < ex.equip.length; j++) { if (!avail[ex.equip[j]]) ok = false; }
      if (ok) c.push(ex);
    }
    c.sort(function (a, b) { return a.rank - b.rank; });
    if (!c.length) return null;
    return c[Math.min(alt, c.length - 1)];
  }

  function frKm(km) {
    return frDec(String(Math.round(km * 10) / 10));
  }

  // Une séance de course : échauffement, le bloc principal, retour au calme,
  // et de la mobilité s'il reste du temps. La DISTANCE du bloc principal se
  // déduit du temps restant et de l'allure, jamais l'inverse : c'est le temps
  // que l'utilisateur a annoncé, pas le kilométrage.
  function buildRunSession(tpl, profile) {
    var niv = runLevel(profile.runLevel);
    var avail = { bw: true }, i;
    for (i = 0; i < profile.equipment.length; i++) avail[profile.equipment[i]] = true;
    if (avail.mach) { for (i = 0; i < GYM_IMPLIES.length; i++) avail[GYM_IMPLIES[i]] = true; }

    var chauffe = pickRun("run-warm", 0, avail);
    var calme = pickRun("run-cool", 0, avail);
    var mob = pickRun("run-mob", 0, avail);
    var bloc = pickRun(tpl.pat, tpl.alt, avail);
    if (!bloc) bloc = pickRun("run-easy", 0, avail);

    // L'echauffement depend du type de seance, pas d'un forfait. Un footing
    // facile commence lentement : les premieres minutes SONT l'echauffement, et
    // lui imposer huit minutes de plus revenait a passer dix-neuf minutes a ne
    // pas courir sur une seance de quarante. Un fractionne, lui, se prepare
    // vraiment, sinon c'est le claquage.
    var dur = (tpl.pat === "run-int" || tpl.pat === "run-tempo" || tpl.pat === "run-hill");
    var minChauffe = dur ? 8 : 4;
    var minCalme = dur ? 6 : 4;
    if (chauffe) {
      chauffe = { id: chauffe.id, name: chauffe.name, mins: minChauffe,
                  note: dur ? "marche puis trot" : "marche rapide" };
    }
    if (calme) calme = { id: calme.id, name: calme.name, mins: minCalme, note: "trot puis marche" };

    var minutes = profile.minutes;
    var fixe = (chauffe ? chauffe.mins : 0) + (calme ? calme.mins : 0);
    var dispo = minutes - fixe;
    // La mobilite n'est ajoutee que s'il reste franchement de quoi courir
    // apres : sur une seance courte, elle mangeait un kilometre pour rien.
    var avecMob = false;
    if (mob && dispo - mob.mins >= 22) { dispo -= mob.mins; avecMob = true; }
    if (dispo < 8) dispo = 8;                       // il faut bien courir un peu

    // LE BLOC PORTE SON PROPRE TEMPS. Jusqu'ici toutes les séances de la
    // semaine recevaient le même budget, et la sortie longue — qui se court
    // plus lentement — finissait donc plus COURTE que l'endurance dans treize
    // configurations sur quinze. La distance reste dérivée du temps ; c'est le
    // temps du bloc qui change.
    var tps = bloc.tps || 1;
    var allure = niv.pace * (bloc.pace || 1);
    var km = (dispo * tps) / allure;
    var plafond = niv.maxKm * (bloc.plafond || 1);
    if (km > plafond) km = plafond;
    km = Math.round(km * 2) / 2;                    // au demi-kilomètre
    if (km < 1) km = 1;

    var reel = Math.round(fixe + km * allure + (avecMob ? mob.mins : 0));
    var exos = [];
    if (chauffe) {
      exos.push({ id: chauffe.id, name: chauffe.name, detail: detailOf(chauffe), sets: 1, load: false, track: "none" });
    }
    var texte;
    if (bloc.pat === "run-int") {
      texte = "8 × 30 s vite / 30 s trot, environ " + frKm(km) + " km en tout";
    } else if (bloc.pat === "run-hill") {
      texte = "6 à 8 montées, environ " + frKm(km) + " km en tout";
    } else if (tps > 1) {
      // Une séance volontairement plus longue le DIT, à l'endroit où on la
      // lit. Se contenter d'allonger la distance en silence ferait passer le
      // dépassement pour une erreur de l'appli.
      texte = frKm(km) + " km, allure ~" + frDec(String(Math.round(allure * 10) / 10)) +
              " min/km, environ " + Math.round(km * allure) + " min : la plus longue de ta semaine";
    } else {
      texte = frKm(km) + " km, allure ~" + frDec(String(Math.round(allure * 10) / 10)) + " min/km";
    }
    exos.push({ id: bloc.id, name: bloc.name, detail: texte, sets: 1, load: false, track: "run", cible: km });
    if (calme) {
      exos.push({ id: calme.id, name: calme.name, detail: detailOf(calme), sets: 1, load: false, track: "none" });
    }
    if (avecMob) {
      exos.push({ id: mob.id, name: mob.name, detail: detailOf(mob), sets: 1, load: false, track: "none" });
    }

    return {
      code: tpl.code,
      label: tpl.label,
      sub: tpl.sub,
      duration: "~" + (Math.round(reel / 5) * 5) + " min",
      // `over` garde son sens : cette séance dépasse le temps annoncé. C'est
      // vrai d'une sortie longue, et l'éteindre reviendrait à cacher le seul
      // fait que l'utilisateur doit connaître avant de partir.
      over: reel > minutes + 3,
      // `voulue` dit que le dépassement est la RÈGLE du bloc et non un
      // débordement : c'est ce qui permet à l'écran de ne pas conseiller
      // « reviens en arrière pour allonger la durée » là où ce serait faux.
      voulue: tps > 1,
      course: true,
      exercises: exos
    };
  }

  // Discipline d'un jour donné. En mode mixte, chaque jour choisi porte son
  // étiquette ; en mode simple, tous les jours suivent la discipline unique.
  function kindOfDay(profile, dow) {
    if (profile.discipline === "course") return "course";
    if (profile.discipline === "muscu") return "muscu";
    return (profile.dayKinds && profile.dayKinds[dow] === "course") ? "course" : "muscu";
  }

  // Le programme est indexé par jour de la semaine, mais avec DIMANCHE = 7 et
  // non 0. getDay() rend 0 le dimanche, or tout le code existant teste la clé de
  // programme par sa vérité (« if (!progKey) », « progKey ? ... »). Une séance
  // du dimanche aurait donc été traitée comme inexistante : pas d'exercices
  // affichés, tonnage compté à zéro. Décaler la clé règle le problème à la
  // source plutôt que de corriger une dizaine de tests un par un.
  function dayKey(dow) { return dow === 0 ? 7 : dow; }

  function buildPlan(profile) {
    // Tri sur la CLÉ et non sur getDay(), pour que la semaine commence le lundi :
    // sinon un profil « mardi, jeudi, dimanche » attribuerait la première séance
    // au dimanche, qui vaut 0.
    var days = profile.days.slice().sort(function (a, b) { return dayKey(a) - dayKey(b); });

    // Les deux disciplines sont réparties d'abord, puis chacune reçoit sa propre
    // découpe. Une semaine de trois séances de muscu et deux de course, ce n'est
    // pas une semaine de cinq : c'est un full body A/B/C d'un côté et une
    // endurance plus une sortie longue de l'autre.
    var joursMuscu = [], joursCourse = [], i;
    for (i = 0; i < days.length; i++) {
      if (kindOfDay(profile, days[i]) === "course") joursCourse.push(days[i]);
      else joursMuscu.push(days[i]);
    }
    var tplsM = joursMuscu.length ? splitPour(joursMuscu.length, profile) : [];
    var tplsC = joursCourse.length ? runWeek(joursCourse.length, profile.runLevel) : [];

    var plan = {};
    for (i = 0; i < joursMuscu.length; i++) plan[dayKey(joursMuscu[i])] = buildSession(tplsM[i], profile);
    for (i = 0; i < joursCourse.length; i++) plan[dayKey(joursCourse[i])] = buildRunSession(tplsC[i], profile);
    return plan;
  }

  // ===========================================================================
  // NUTRITION
  // ---------------------------------------------------------------------------
  // Des REPÈRES, pas une prescription. L'estimation part du poids et du volume
  // d'entraînement, sans prétendre à la précision d'un calcul de métabolisme :
  // annoncer « 1 847 kcal » donnerait une fausse impression d'exactitude.
  // Un plancher empêche de descendre à un niveau qui ne relève plus d'une appli.
  // ===========================================================================
  // Plafond du nombre de prises d'un plan nutrition. Il sert AUSSI à valider les
  // prises cochées dans le journal : celles-ci doivent être bornées par une
  // constante et non par la longueur de la liste du moment, sinon raccourcir son
  // plan effacerait rétroactivement les cases cochées des mois précédents.
  var MAX_NUTRI_ITEMS = 20;

  // ===========================================================================
  // COMPLEMENTS — la table complete remplace celle de la v1.3.0.
  // ---------------------------------------------------------------------------
  // Un seul objet par complement, qui porte TOUT : la ligne du plan (time/item/
  // note), la phrase du diagnostic (why) et la fiche depliable (quand/comment/
  // dose/effet/avis). Avant, la posologie etait ecrite DEUX fois — dans
  // SUPPS.note et en dur dans buildNutrition — et les deux avaient deja diverge.
  //
  // Ce sont des REPERES d'usage courant chez un adulte en bonne sante qui fait
  // de la musculation, pas une prescription. Aucune dose ne sort des fourchettes
  // usuelles, et chaque fiche dit a quel moment un avis medical vaut mieux.
  var SUPPS = [
    { v: "creatine", label: "Créatine monohydrate", moment: "post",
      time: "Après la séance", item: "Créatine 3 à 5 g",
      note: "dans ton shaker, avec la protéine · les jours sans séance, au petit-déjeuner",
      why: "Le complément le mieux documenté pour la force et le volume d'entraînement.",
