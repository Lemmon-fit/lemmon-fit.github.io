<style>
/* ===========================================================================
   LEMMON FIT v1.22.0 — TOKENS ET SOCLE VISUEL
   ---------------------------------------------------------------------------
   Les valeurs viennent de README.md section 4 du dossier de transfert design.
   Elles ne sont PAS approximees : chaque hexadecimal est recopie tel quel.

   RENVERSEMENT PAR RAPPORT A LA v1.21.0. La production etait sombre par
   defaut. La refonte est CLAIRE par defaut, avec des cartes sombres posees
   dessus. Le theme sombre reste disponible et reprend la palette de la
   v1.21.0, dont les contrastes ont ete mesures texte par texte.

   REGLE DE NOMMAGE, heritee de la v1.21.0 et non negociable : une couleur est
   nommee par son ROLE, jamais par sa valeur. Et une teinte posee en SURFACE
   n'est pas la meme variable que la meme teinte posee en TEXTE. Le citron
   reste citron en aplat ; en texte il doit foncer pour rester lisible.
   =========================================================================== */

:root, :root[data-theme="clair"] {
  /* Surfaces et encres, mode clair */
  --fond:          #f7f3ea;
  --fond-carte:    #fffdf7;
  --fond-encart:   #efe9dc;
  --sep:           #f4efe3;
  --bord:          #ded7c6;
  --bord-discret:  #e7e0cf;
  --bord-champ:    #cfc7b4;
  --bord-fort:     #c6bda8;
  --texte:         #1f1c17;
  --texte-1b:      #544d41;
  --texte-2:       #676052;

  /* AUCUNE DES TROIS ENCRES TERTIAIRES DU README N'ATTEINT 4,5:1, et c'est un
     trou du jeu de jetons, pas une erreur de code. Mesure sur les trois fonds
     clairs (page #f7f3ea, carte #fffdf7, encart #efe9dc) :

         #8a8272   3,44 / 3,74 / 3,15
         #978e7e   2,92 / 3,18 / 2,68
         #7d7566   4,11 / 4,48 / 3,77   ← la plus foncee, et elle echoue encore

     140 textes sur 1620 passaient sous le seuil, tous a cause de ce seul
     jeton : etiquettes de section, en-tetes de calendrier, libelles de la nav
     basse. On prend donc l'encre SECONDAIRE, seule a passer partout
     (5,62 / 6,12 / 5,15).

     CONSEQUENCE ASSUMEE : le palier tertiaire n'existe plus en petit texte.
     Il ne PEUT pas exister a 4,5:1 dans cette palette. Les trois valeurs
     d'origine restent declarees ci-dessous pour du GRAND texte, ou le seuil
     tombe a 3:1 et ou elles sont valables. */
  --texte-3:       #676052;
  --texte-3b:      #978e7e;
  --texte-3c:      #7d7566;

  /* Cartes sombres. Elles existent DANS le mode clair : ce sont des surfaces
     de premier plan, pas un theme. Leurs encres leur sont propres. */
  --sombre-carte:    #1f1c17;
  --sombre-fond:     #100f0d;
  --sombre-fond-2:   #141310;
  --sombre-piste:    #2c281f;
  --sombre-pastille: #3a352c;
  --sombre-barre:    #4a4436;
  --sombre-bord:     #6b6455;
  --sombre-texte:    #f7f3ea;
  --sombre-texte-b:  #ede6d3;
  --sombre-texte-2:  #cfc6b3;
  --sombre-texte-3:  #a89e8a;

  /* LES TROIS DISCIPLINES. Axe semantique central de la refonte : le
     remplissage dit qui mene la seance, le contour ne signale plus que le
     vide. Quatre roles par discipline, jamais melanges.
       -bg    : la surface pleine
       -fg    : l'encre POSEE SUR cette surface
       -pale  : la surface attenuee
       -encre : l'encre lisible sur la surface attenuee ET sur fond clair */
  --salle-bg:    #f4d912;
  --salle-fg:    #100f0d;
  --salle-pale:  #fdf4bd;
  --salle-encre: #4a4000;

  --cours-bg:    #d9741a;
  --cours-fg:    #100f0d;
  --cours-pale:  #f8ddc2;
  --cours-encre: #7d3d05;

  --run-bg:      #1f6dc0;
  --run-fg:      #fffdf7;
  --run-pale:    #d3e3f6;
  --run-encre:   #16497f;

  /* Variantes destinees au TEXTE pose sur une carte sombre. Les encres
     ci-dessus y seraient illisibles. */
  --cours-sur-sombre: #f5c493;
  --run-sur-sombre:   #bcdcff;
  --salle-sur-sombre: #f4d912;

  /* Citron, autres nuances */
  --citron-courbe: #c9ae00;
  --citron-encre:  #6b5b00;
  --citron-doux:   #e3cf5a;

  /* Vert : repos et validation */
  --vert-encre:    #3f6132;
  --vert-encre-b:  #2f5226;
  --vert-bg:       #668d55;
  --vert-bg-b:     #8caa7c;
  --vert-clair:    #a8c39a;
  --vert-pale:     #dfe9d8;
  --vert-pale-b:   #e7f0e2;
  --vert-pale-c:   #cfe3c6;
  --vert-sombre:   #1a2a16;
  --vert-bord:     #cfdcc7;

  /* Destructif. RESERVE a « Reinitialiser mes donnees ». Aucune autre action
     ne porte cette teinte : si tout est rouge, plus rien n'alerte. */
  --danger:        #8f3421;
  --danger-bord:   #d5a293;
  --danger-fg:     #fdf6f3;

  /* Liens. Sans cette declaration le navigateur sert son bleu par defaut,
     qui n'appartient a aucune palette. */
  --lien:       #1a5bab;
  --lien-hover: #16497f;
}

/* THEME SOMBRE. La spec de refonte ne fournit pas de palette de PAGE sombre,
   seulement les cartes sombres du mode clair. On reprend donc la palette de
   la v1.21.0, deja mesuree : 524 textes sur quatre combinaisons, zero sous le
   seuil. Les trois disciplines gardent leurs surfaces pleines et basculent
   sur leurs encres « sur sombre ». */
:root[data-theme="sombre"] {
  --fond:          #100f0d;
  --fond-carte:    #1e1a15;
  --fond-encart:   #1a1712;
  --sep:           #2c281f;
  --bord:          #3a352c;
  --bord-discret:  #4a4436;
  --bord-champ:    #3a3428;
  --bord-fort:     #8c8474;
  --texte:         #ede6d3;
  --texte-1b:      #cfc6b3;
  --texte-2:       #a89e8a;
  --texte-3:       #978e7e;
  --texte-3b:      #978e7e;
  --texte-3c:      #a89e8a;

  --sombre-carte:    #1e1a15;
  --sombre-fond:     #100f0d;
  --sombre-fond-2:   #141310;
  --sombre-piste:    #2c281f;
  --sombre-pastille: #3a352c;
  --sombre-barre:    #4a4436;
  --sombre-bord:     #6b6455;
  --sombre-texte:    #ede6d3;
  --sombre-texte-b:  #ede6d3;
  --sombre-texte-2:  #cfc6b3;
  --sombre-texte-3:  #a89e8a;

  --salle-pale:  #4a4000;
  --salle-encre: #f4d912;
  --cours-pale:  #4a2503;
  --cours-encre: #f5c493;
  --run-pale:    #10365e;
  --run-encre:   #bcdcff;

  --citron-encre: #f4d912;
  --vert-encre:   #8caa7c;
  --vert-encre-b: #cfe3c6;
  --vert-pale:    #1a2a16;
  --vert-pale-b:  #1a2a16;
  --vert-pale-c:  #223019;
  --vert-bord:    #3f5236;

  --danger:      #e08a80;
  --danger-bord: #7a3328;
  --danger-fg:   #100f0d;

  --lien:       #bcdcff;
  --lien-hover: #d3e3f6;
}

/* ===========================================================================
   BASE
   =========================================================================== */

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--fond);
  color: var(--texte);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  overscroll-behavior-y: contain;
  -webkit-text-size-adjust: 100%;
}

button, input, select, textarea {
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

a { color: var(--lien); text-decoration: none; }
a:hover { color: var(--lien-hover); }

p { text-wrap: pretty; }

/* TOUT nombre affiche passe en monospace : charges, kg, kcal, durees, dates
   courtes, tonnages. C'est ce qui aligne les colonnes et rend un tableau de
   charges lisible d'un coup d'oeil. */
.num { font-family: ui-monospace, "SF Mono", monospace; }

/* ===========================================================================
   CHASSIS — ecran, gouttiere, nav basse
   =========================================================================== */

/* pan-y laisse le defilement vertical au navigateur et nous reserve
   l'horizontale. Sans lui, le glissement lateral se bat avec le scroll.

   LA CLASSE EN PLUS DE L'IDENTIFIANT. Pendant un glissement, deux ecrans sont
   montes cote a cote : le sortant et l'entrant. Un seul peut porter `#ecran`,
   sans quoi getElementById rendrait le decor a la place du vivant. Les volets
   du glissement portent donc `.ecran`, et c'est la MEME regle qui les habille —
   recopier ces valeurs dans une seconde regle serait deux verites a tenir. */
#ecran,
.ecran {
  touch-action: pan-y;
  min-height: 100vh;
  padding: calc(4px + env(safe-area-inset-top)) 20px 0;
}

/* La gouttiere du bas doit degager la nav, sinon le dernier element passe
   dessous et devient intouchable. */
body.a-nav #ecran,
body.a-nav .ecran {
  padding-bottom: calc(56px + 18px + env(safe-area-inset-bottom));
}

.ecran-titre {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.6px;
  margin: 14px 0 4px;
  color: var(--texte);
}

.ecran-titre-2 {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 14px 0 4px;
  color: var(--texte);
}

.nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: none;
  background: var(--fond-carte);
  border-top: 1px solid var(--bord);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 40;
}
body.a-nav .nav { display: flex; }

.nav-btn {
  flex: 1 1 0;
  min-height: 56px;
  border: 0;
  background: transparent;
  color: var(--texte-3);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 0 2px;
}
.nav-btn svg { display: block; }
.nav-btn-on { color: var(--citron-encre); }

/* ===========================================================================
   SPLASH
   =========================================================================== */

.splash {
  position: fixed;
  inset: 0;
  background: #100f0d;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  z-index: 100;
}
/* LE CONTOUR DE LA VIGNETTE DU SPLASH.
   ---------------------------------------------------------------------------
   Il se lisait comme un autocollant mal decoupe, et Olivier l'a signale.

   LA CAUSE, MESUREE. Le PNG ne contient pas que sa tuile : il porte autour
   d'elle un POURTOUR OPAQUE de 6 %, gris bleute. Sur la ligne mediane la
   luminance vaut 34 a 42 jusqu'a x=30, puis retombe a 28 dans la tuile. Le fond
   du splash, lui, est a 15. Ce pourtour ressortait donc nettement, et le
   `border-radius: 26px` le coupait A UN RAYON QUI N'EST PAS CELUI DE LA TUILE
   dessinee dedans : il restait un croissant de gris clair dans chaque angle.

   LA CORRECTION. On recadre le pourtour a l'affichage — 6,5 % de chaque cote,
   soit 33 px sur 512, juste au-dela du liseré sombre qui borde la tuile — et on
   arrondit sur la tuile elle-meme. La boite est agrandie d'autant pour que la
   vignette garde sa taille vue : 120 px de boite pour 104 px visibles.

   L'IMAGE N'EST PAS TOUCHEE. Elle sert aussi d'icone au manifeste, et le splash
   doit continuer d'afficher le logo avec son nom. */
.splash-logo {
  width: 120px;
  height: 120px;
  clip-path: inset(6.5% round 20%);
  display: block;
}
.splash-mot {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #f7f3ea;
}
.splash-mot i { font-style: normal; color: #f4d912; }

/* ===========================================================================
   ECHAFAUDAGE — etape 1 uniquement
   ---------------------------------------------------------------------------
   Ce bloc n'existe que pour rendre le routage VERIFIABLE tant qu'aucun ecran
   n'a de contenu. Il disparait a l'etape 3, quand les vrais ecrans arrivent.
   Il porte volontairement une bordure en pointilles : on ne doit pas pouvoir
   le confondre avec du produit fini.
   =========================================================================== */

.echaf {
  border: 1.5px dashed var(--bord-fort);
  border-radius: 14px;
  padding: 14px;
  margin: 16px 0;
  background: var(--fond-encart);
}
.echaf-t {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--texte-3);
  margin-bottom: 10px;
}
.echaf-liste { display: flex; flex-wrap: wrap; gap: 8px; }
.echaf-btn {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 13px;
  border: 1.5px solid var(--bord-champ);
  background: var(--fond-carte);
  color: var(--texte-1b);
  font-size: 13.5px;
  font-weight: 600;
}
.echaf-note {
  font-size: 12.5px;
  color: var(--texte-2);
  margin-top: 10px;
}

/* ===========================================================================
   DIAGNOSTIC — 11 etapes
   ---------------------------------------------------------------------------
   Les valeurs viennent du gabarit du prototype, relevees une a une. La regle
   des 44 px prime sur le visuel : une pastille de progression peut etre fine a
   l'oeil, mais elle vit DANS un bouton de 44 px de haut, sinon elle n'est pas
   cliquable au pouce.
   =========================================================================== */

/* PAS DE PADDING HORIZONTAL ICI. `#ecran` porte deja les 20 px de gouttiere ;
   les remettre les DOUBLAIT, et tout le diagnostic se rendait sur 295 px au
   lieu de 335. Consequence mesurable : les sept boutons de jour tombaient a
   39,6 px, sous le seuil de 44, alors que la place existait. Une marge posee
   deux fois ne se voit pas a la lecture du CSS, seulement a la mesure. */
.ob { padding: 4px 0 0; max-width: 460px; margin: 0 auto; }

/* LES 44 px DE LARGE SONT GEOMETRIQUEMENT IMPOSSIBLES ICI, et il vaut mieux
   l'ecrire que le laisser croire : 11 pastilles a 44 px demandent 484 px de
   large, l'ecran de reference en fait 375, dont 335 utiles une fois la
   gouttiere retiree. Le maximum atteignable est donc ~30 px par pastille.
   On prend ce maximum : les boutons PAVENT toute la largeur sans ecart, et
   l'espace visuel entre les traits vient d'un padding INTERIEUR au bouton.
   Un `gap` aurait creuse des zones mortes entre les cibles.
   La hauteur, elle, respecte bien les 44 px. */
.ob-dots { display: flex; justify-content: center; margin-bottom: 2px; }
.ob-dot-btn {
  flex: 1 1 0; min-height: 44px; border: 0; background: transparent;
  display: flex; align-items: center; justify-content: center; padding: 0 2px;
}
.ob-dot { width: 100%; height: 4px; border-radius: 2px; background: var(--bord); display: block; }
.ob-dot-past { background: var(--bord-moyen); }
.ob-dot-on { background: var(--salle-bg); height: 6px; }

.ob-step-label {
  text-align: center; font-size: 11px; color: var(--texte-3); margin-bottom: 14px;
  text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700;
}
/* 26 px et 14,5 px sont MESURES DANS LA MAQUETTE, pas choisis. J'avais pris
   27 et 15, deux valeurs qui existent bien dans l'echelle du README mais que la
   maquette n'utilise pas ici. Quand l'echelle propose plusieurs voisins, c'est
   la maquette qui tranche. */
.ob-titre { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin: 0 0 6px; }
.ob-lead { font-size: 14.5px; line-height: 1.5; color: var(--texte-1b); margin: 0 0 16px; }

.ob-champ { margin-bottom: 12px; }
.ob-champ-l { font-size: 14px; color: var(--texte-2); margin-bottom: 6px; display: block; }
.ob-input {
  width: 100%; min-height: 56px; background: var(--fond-carte);
  border: 1.5px solid var(--bord-champ); border-radius: 13px; color: var(--texte);
  font-size: 17px; padding: 0 14px; font-family: ui-monospace, "SF Mono", monospace;
}
.ob-input-txt { font-family: inherit; font-size: 16px; }

.ob-chips { display: flex; flex-direction: column; gap: 8px; }
.ob-chip {
  width: 100%; text-align: left; min-height: 58px; padding: 10px 14px; border-radius: 13px;
  border: 1.5px solid var(--bord); background: var(--fond-carte); color: var(--texte);
  font-size: 15px; font-weight: 700; display: flex; flex-direction: column; gap: 2px;
}
.ob-chip-s { font-size: 12.5px; font-weight: 400; color: var(--texte-2); }
.ob-chip-on { border-color: var(--salle-bg); background: rgba(244,217,18,.14); }

/* GAP RESSERRE A 3 px POUR ATTEINDRE LES 44 px. A 375 px de large, la
   gouttiere laisse 335 px : sept boutons et six ecarts de 5 px ne donnaient
   que 43,6 px par bouton, juste sous le seuil. A 3 px d'ecart ils font
   45,3 px. L'ecart visuel se voit moins, la cible passe. */
.ob-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 18px; }
.ob-day {
  min-height: 52px; border-radius: 11px; border: 1.5px solid var(--bord);
  background: var(--fond-carte); color: var(--texte-1b); font-size: 12.5px; font-weight: 700;
}
.ob-day-on { background: var(--salle-bg); border-color: var(--salle-bg); color: var(--salle-fg); }

.ob-jour { margin-bottom: 14px; }
.ob-jour-t { font-size: 13px; font-weight: 800; margin-bottom: 6px; color: var(--texte); }
.ob-rang { font-size: 11px; color: var(--texte-3); margin: 8px 0 4px; font-weight: 700; }
/* La fleche est dessinee en fond parce que appearance:none retire celle du
   systeme. Sans elle, le select ne se lit plus comme un select. */
.ob-select {
  width: 100%; min-height: 56px; padding: 0 36px 0 14px; border-radius: 13px;
  border: 2px solid var(--bord); background: var(--fond-carte); color: var(--texte);
  font-family: inherit; font-size: 15.5px; font-weight: 800;
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 20px) calc(50% + 2px), calc(100% - 14px) calc(50% + 2px);
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
}
.ob-select-libre { border-style: dashed; }

/* LA DUREE A SOI, sous les quatre reperes. Elle est separee par un filet :
   c'est la meme question, mais une autre facon d'y repondre, et sans le filet
   le champ se lisait comme une question de plus. */
.ob-duree-libre {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--sep);
}
.ob-duree-aide {
  font-size: 12.5px;
  color: var(--texte-2);
  margin-top: 6px;
}

/* LE LIEN D'AJOUT D'UNE DEUXIEME SEANCE.
   Il remplace un menu vide en pointilles sous chaque jour deja rempli : sept
   jours coches donnaient sept menus « rien » a lire et a ecarter. Un lien dit
   ce qu'il fait et ne prend qu'une ligne.
   L'encre citron est celle de l'onglet actif de la nav : #6b5b00 sur le fond
   clair, #f4d912 sur le sombre, tous deux tres au-dessus de 4,5:1.
   La cible de 44 px vient du padding et non d'une hauteur fixe, pour que le
   libelle puisse passer sur deux lignes sur un petit ecran sans deborder. */
.ob-ajout-seance {
  display: block;
  width: 100%;
  min-height: 44px;
  margin-top: 6px;
  padding: 11px 2px;
  border: 0;
  background: transparent;
  color: var(--citron-encre);
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  text-align: left;
}

.ob-cours {
  border: 1.5px solid var(--cours-pale); background: var(--fond-carte);
  border-left: 4px solid var(--cours-bg);
  border-radius: 13px; padding: 12px 13px; margin-bottom: 10px;
}
.ob-cours-t { font-size: 12.5px; font-weight: 800; color: var(--cours-encre); margin-bottom: 8px; }
.ob-step { display: flex; align-items: center; gap: 8px; }
.ob-step-btn {
  min-width: 48px; min-height: 48px; border-radius: 11px;
  border: 1.5px solid var(--bord-champ); background: var(--fond-carte);
  color: var(--texte); font-size: 20px; font-weight: 700;
}
.ob-step-v {
  flex: 1; text-align: center; font-family: ui-monospace, "SF Mono", monospace;
  font-size: 17px; font-weight: 700;
}
.ob-natures { display: flex; gap: 6px; margin-top: 8px; }
.ob-nature {
  flex: 1; min-height: 46px; border-radius: 11px; border: 1.5px solid var(--bord-moyen);
  background: var(--fond-carte); color: var(--texte-1b); font-size: 13px; font-weight: 700;
}
.ob-nature-on { background: var(--cours-bg); border-color: var(--cours-bg); color: var(--cours-fg); }

.ob-liste { display: flex; flex-direction: column; gap: 8px; }
.ob-case {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  min-height: 58px; padding: 10px 12px; border-radius: 13px;

}

.ob-case-box {
  width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--texte-3c);

}

.ob-case-txt { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.ob-case-t { font-size: 14.5px; font-weight: 700; }
.ob-case-s { font-size: 12px; color: var(--texte-2); }
/* Le chevron de la case qui commande une liste. Meme role que celui des
   journees de l'etape 8 : il dit qu'il y a quelque chose dessous. */
.ob-case-ch { flex: 0 0 auto; font-size: 13px; color: var(--texte-3); }

/* LA CASE « MACHINES DE SALLE » ET SA LISTE NE FONT QU'UN BLOC.
   Ouvert, il prend le fond des encarts et un filet citron a gauche : la liste
   se lit alors comme le CONTENU de la case, pas comme une section voisine. */
.ob-mach { border-radius: 13px; }
.ob-mach-on { background: var(--fond-encart); border-left: 4px solid var(--salle-bg); }
.ob-mach-on > .ob-case { background: transparent; border-color: transparent; }
.ob-mach-c { padding: 0 10px 12px 10px; }
.ob-mach-l { font-size: 12.5px; color: var(--texte-2); margin: 0 0 10px; }

.ob-sess { border: 1px solid var(--bord); border-radius: 13px; padding: 0 13px; margin-bottom: 10px; }
/* Ouverte, la journee se distingue de ses voisines repliees. */
.ob-sess-on { background: var(--fond-encart); }
/* La ligne repliee EST le bouton : toute la largeur est cliquable, pas
   seulement le chevron. 56 px, au-dessus des 44 px reglementaires. */
.ob-sess-h {
  width: 100%; min-height: 56px; padding: 10px 0;
  display: flex; align-items: center; gap: 10px;
  border: 0; background: transparent; font-family: inherit; text-align: left;
}
.ob-sess-c { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ob-sess-t { font-size: 13.5px; font-weight: 800; color: var(--texte); }
.ob-sess-s { font-size: 12px; color: var(--texte-2); }
.ob-sess-ch { flex: 0 0 auto; font-size: 13px; color: var(--texte-3); }
.ob-sess-pill {
  flex: 0 0 auto; min-width: 56px; text-align: center;
  font-size: 10.5px; font-weight: 800; padding: 4px 8px; border-radius: 20px;
}
.ob-sess-p { font-size: 13px; color: var(--texte-1b); line-height: 1.5; margin: 0 0 12px; }

/* « Non merci » sur une ligne d'exercice. Discret tant qu'il n'a pas servi,
   marque une fois le refus pose : la ligne reste visible et annonce son
   remplacant, au lieu de disparaitre sans dire ce qui la remplace. */
.ob-non {
  flex: 0 0 auto; min-height: 40px; padding: 0 12px;
  border-radius: 10px;
  border: 1.5px solid var(--bord-fort);
  background: transparent;
  color: var(--texte-2);
  font-family: inherit; font-size: 12.5px; font-weight: 700;
}
.ob-non-on { border-color: var(--cours-bg); background: var(--cours-pale); color: var(--cours-encre); }
.ob-exo-c { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.ob-exo-r { font-size: 11.5px; color: var(--cours-encre); }
.ob-prog-pied { font-size: 13px; color: var(--texte-1b); line-height: 1.55; margin: 14px 0 0; }
/* LES INTITULES DE SECTION DE L'ETAPE HABITUDES. « QUELQUES HABITUDES »,
   « ALCOOL », « COMPLÉMENTS » : ils decoupent un ecran qui pose quatre
   questions de nature differente et se lisait comme une seule liste. */
.ob-sect {
  font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--texte-2); margin: 22px 0 8px;
}

/* Les trois habitudes en JETONS. Trois questions binaires ne meritent pas
   trois cartes pleine largeur ; le premier prend la ligne parce que son
   libelle est le plus long. 48 px de haut, cible tactile tenue. */
.ob-hab { display: flex; flex-wrap: wrap; gap: 8px; }
.ob-h {

  border-radius: 12px;
  border: 1.5px solid var(--bord-fort);

.ob-h-on { background: var(--salle-bg); border-color: var(--salle-bg); color: var(--salle-fg); }
.ob-h-c { font-weight: 800; }

/* LES QUATRE CONDITIONS DE PESEE. Elles vivaient dans PESEE_COND et ne
   servaient que sur l'accueil, le jour de la pesee. Elles manquaient ici, au
   moment ou l'on CHOISIT son rendez-vous, donc au moment ou elles peuvent
   encore changer la reponse. Fond sombre comme la maquette : c'est un encart
   de mise en garde, pas une question de plus. */
.cond {

  padding: 16px;
  margin-top: 20px;
}

/* --- AUJOURD'HUI --------------------------------------------------------- */
.jour-h { margin-bottom: 12px; }

.jour-d { font-size: 13px; color: var(--texte-2); }

.motiv-h { font-size: 15px; font-weight: 800; margin-bottom: 3px; }
.motiv-s { font-size: 13px; line-height: 1.55; color: var(--texte-1b); }

.creneaux { display: flex; gap: 8px; margin-bottom: 12px; }
.creneau {

/* --- MODE ENTRAINEMENT --------------------------------------------------- */
.salle {
  position: fixed; inset: 0; background: var(--sombre-fond); color: var(--sombre-texte);
  padding: calc(14px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  overflow-y: auto; z-index: 50;
  display: flex; flex-direction: column;
}
/* LE CORPS SE CENTRE, L'ENTETE NE BOUGE PAS.
   Les marges automatiques plutot que `justify-content: center` : quand le
   contenu est plus haut que l'ecran, une marge auto vaut zero et l'ecran
   redefile normalement depuis le haut, alors qu'un centrage par
   `justify-content` pousse le debut du contenu hors de la zone atteignable.
   L'ecran de serie est justement dans ce cas des qu'on ouvre le memo.
   Le conteneur reste en `display: block` : ses enfants gardent la fusion de
   leurs marges verticales, donc les quatre ecrans conservent au pixel les
   espacements qu'Olivier a valides. Passer `.salle` en flex sans ce conteneur
   aurait supprime cette fusion et rallonge la fin de seance d'environ 70 px. */
.sa-corps { flex: 0 0 auto; margin-top: auto; margin-bottom: auto; }
/* L'ENTETE NE SE LAISSE PAS COMPRIMER.
   Mesure : avec le memo « Comment faire ? » ouvert, l'ecran de serie depasse de
   188 px, et comme un element flex retrecit par defaut, la barre d'avancement
   passait de 4 px a ZERO. Elle disparaissait purement et simplement. C'est le
   passage de `.salle` en flex qui l'a rendue compressible ; en flux de blocs
   une hauteur de 4 px est une hauteur de 4 px. */
.salle > .sa-haut, .salle > .sa-barre { flex: 0 0 auto; }
/* LE PREMIER BLOC DU CORPS NE PORTE PAS DE MARGE HAUTE.
   `.sa-corps` etant un element flex, il ouvre son propre contexte : la marge
   haute de son premier enfant ne fusionne plus avec celle de la barre, elle
   s'y AJOUTE et compte dans la hauteur qu'on centre. Le repos tombait 9 px et
   la fin de seance 13 px plus bas que la serie et l'enchainement, alors
   qu'Olivier demandait justement que les quatre ecrans se ressemblent. */
.sa-corps > :first-child { margin-top: 0; }
.sa-haut { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.sa-x { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--sombre-texte-3); font-size: 20px; }
.sa-code { flex: 1; font-size: 13px; font-weight: 800; letter-spacing: 1.2px; color: var(--salle-sur-sombre); }
.sa-chrono { font-size: 17px; font-weight: 700; color: var(--sombre-texte-2); }
.sa-exo { font-size: 27px; font-weight: 800; letter-spacing: -.5px; line-height: 1.15; }
.sa-mat { font-size: 13px; color: var(--sombre-texte-3); margin-top: 4px; }
.sa-serie { font-size: 14px; color: var(--sombre-texte-2); margin: 14px 0 18px; }

.st { margin-bottom: 14px; }
.st-l { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--sombre-texte-3); margin-bottom: 6px; }
.st-r { display: flex; align-items: center; gap: 10px; }
.st-b {
  min-width: 64px; min-height: 64px; border-radius: 16px; border: 1.5px solid var(--sombre-bord);
  background: var(--sombre-carte); color: var(--sombre-texte); font-size: 26px; font-weight: 700;
}
.st-v { flex: 1; text-align: center; font-size: 34px; font-weight: 800; }
.st-u { font-size: 15px; font-weight: 600; color: var(--sombre-texte-3); margin-left: 4px; }

.sa-valider {

}
.sa-lien { width: 100%; min-height: 48px; border: 0; background: transparent; color: var(--sombre-texte-3); font-size: 13.5px; text-decoration: underline; margin-top: 10px; }

/* LES DEUX BOUTONS DU BAS DU MODE ENTRAINEMENT — « Comment faire ? » et
   « Changer d'exercice ». La maquette les pose cote a cote, a parts egales,
   sous la carte de validation. Ils remplacent un lien souligne qui se lisait
   comme du texte et pas comme une action.
   52 px de haut : au-dessus des 44 px reglementaires, et le geste se fait a
   bout de bras entre deux series. */
.sa-actions { display: flex; gap: 10px; margin-top: 14px; }
.sa-act {
  flex: 1 1 0;
  min-height: 52px;
  border-radius: 13px;
  border: 1.5px solid var(--sombre-bord);
  background: transparent;
  color: var(--sombre-texte);
  font-family: inherit;
  font-size: 14.5px;
  font-weight: 700;
  padding: 0 8px;
}
/* Ouvert, le bouton porte la couleur de la seance : on voit lequel des deux
   a produit le panneau qui vient de s'ouvrir en dessous. */
.sa-act-on { border-color: var(--salle-sur-sombre); color: var(--salle-sur-sombre); }

.sa-tech { margin-top: 12px; }
.sa-tech-l {

  gap: 10px;

}

  background: var(--sombre-pastille);

  font-weight: 800;

  align-items: center;

}
.sa-tech-vide { color: var(--sombre-texte-3); font-size: 14px; }
/* LA SEULE SORTIE RESEAU DE L'APPLICATION, et c'est un lien, pas un appel. */
.sa-tech-video {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  margin-top: 12px;
  border-radius: 13px;
  border: 1.5px solid var(--sombre-bord);
  color: var(--sombre-texte);
  font-size: 14.5px;
  font-weight: 700;
  text-decoration: none;

/* ===========================================================================
   MODE ENTRAINEMENT — LE DESIGN DE LA MAQUETTE
   ---------------------------------------------------------------------------
   Ces ecrans sont TOUJOURS sombres, quel que soit le theme : les jetons
   --sombre-* sont fixes, et les quelques valeurs litterales ci-dessous le sont
   pour la meme raison. Il n'y a pas de variante claire a tenir.
   =========================================================================== */

/* --- L'en-tete partage par les trois ecrans ------------------------------- */
.sa-rond {
  min-width: 44px; min-height: 44px; flex: 0 0 44px;
  border-radius: 50%;
  border: 1.5px solid var(--sombre-bord);
  background: transparent;
  color: var(--sombre-texte-2);
  font-size: 17px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.sa-pos { flex: 1; font-size: 14px; font-weight: 700; color: var(--sombre-texte-2); }
.sa-pos b { color: var(--sombre-texte); font-weight: 800; }

/* La barre d'avancement de la SEANCE, pas de l'exercice : series faites sur
   series prevues. Fine, parce qu'elle informe sans reclamer l'attention. */
.sa-barre {
  height: 4px; border-radius: 2px;
  background: var(--sombre-pastille);
  margin: -6px 0 18px;
  overflow: hidden;
}
.sa-barre-v { display: block; height: 100%; background: var(--salle-bg); border-radius: 2px; }

/* --- La fiche de l'exercice ---------------------------------------------- */
.sa-muscle {
  font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--salle-sur-sombre); margin-bottom: 4px;
}

/* Une pastille par serie prevue. Faite, elle porte sa valeur ; a venir, un
   tiret. On lit ce qui reste sans compter. */
.sa-pastilles { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 16px; }
.sa-past {
  min-width: 62px; min-height: 52px;
  border-radius: 12px;
  border: 1.5px solid var(--sombre-bord);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 4px 8px;
}
.sa-past-r { font-size: 11px; font-weight: 800; color: var(--sombre-texte-3); }
.sa-past-v { font-size: 13px; font-weight: 700; color: var(--sombre-texte-2); }
.sa-past-ok { border-color: var(--salle-sur-sombre); }
.sa-past-ok .sa-past-r,
.sa-past-ok .sa-past-v { color: var(--salle-sur-sombre); }

/* La carte de saisie : le rang de la serie, la derniere fois, les deux
   molettes et la validation dans un MEME cadre. A plat, ces quatre elements ne
   se lisaient pas comme une seule question. */
.sa-carte {
  border-radius: 18px;
  background: var(--sombre-pastille);
  padding: 14px;
  margin-bottom: 14px;
}
.sa-carte-h {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
}
.sa-serie { font-size: 15px; font-weight: 800; color: var(--sombre-texte); }
.sa-dernier { font-size: 12.5px; color: var(--sombre-texte-3); }
/* LES DEUX MOLETTES SONT EMPILEES, ELLES NE PEUVENT PAS TENIR COTE A COTE.
   Mesure a 375 px : la carte offre 307 px de contenu, et une molette reclame
   64 + 10 + le nombre + 10 + 64, soit 148 px avant meme d'afficher un chiffre.
   Deux molettes cote a cote demandent donc 296 px, plus les 10 px qui les
   separent, soit 306 : il ne reste 1 px pour les deux nombres. Le cote a cote
   redevient possible vers 540 px de large, ce qu'aucun iPhone n'offre.
   Le cote a cote ne debordait pas seulement du cadre : le « − » des repetitions
   recouvrait le « + » de la charge sur 47 de ses 64 px, et comme il est opaque
   et vient apres dans l'arbre, c'est LUI qui recevait le toucher. On croyait
   ajouter du poids, on retirait une repetition. Mesure au point : il ne restait
   que 16 px sur 64 ou le « + » de la charge faisait ce qu'il annonce.
   LA MARGE BASSE EST PORTEE PAR LE GROUPE, pas par la derniere molette. En
   flex, ses 14 px restaient a l'interieur et s'ajoutaient aux 8 px du bouton,
   soit 22 px. En bloc, cette marge traverserait le conteneur et fusionnerait :
   il ne serait reste que 8 px devant « Valider » et 4 devant « Comme la
   precedente », c'est-a-dire deux cibles tactiles qui se touchent presque, le
   defaut meme qu'on vient de corriger. */
.sa-steppers { display: block; margin-bottom: 22px; }
.sa-steppers .st:last-child { margin-bottom: 0; }

.sa-annuler {
  width: 100%; min-height: 48px; margin-top: 12px;
  border-radius: 13px;
  border: 1.5px dashed var(--sombre-bord);
  background: transparent;
  color: var(--sombre-texte-3);
  font-family: inherit; font-size: 14px; font-weight: 700;
}

/* --- Le repos : un ecran a lui ------------------------------------------- */
.sa-repos-l {
  font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--sombre-texte-3); text-align: center; margin-top: 18px;
}
.sa-anneau { position: relative; width: 200px; max-width: 62vw; margin: 12px auto 22px; }
.sa-anneau svg { display: block; width: 100%; height: auto; transform: rotate(-90deg); }
.sa-anneau-fond { fill: none; stroke: var(--sombre-pastille); stroke-width: 12; }
/* L'arc se vide dans le sens horaire. La transition suit le decompte a la
   seconde : sans elle, l'anneau saute par crans. */
.sa-anneau-arc {
  fill: none; stroke: var(--salle-bg); stroke-width: 12; stroke-linecap: round;
  transition: stroke-dashoffset 1s linear;
}
.sa-anneau-c {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.sa-anneau-v { font-size: 44px; font-weight: 800; color: var(--salle-sur-sombre); line-height: 1.1; }
.sa-anneau-s { font-size: 13px; color: var(--sombre-texte-3); }

.sa-ensuite-l {
  font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--sombre-texte-3); text-align: center;
}
.sa-ensuite-n { font-size: 21px; font-weight: 800; color: var(--sombre-texte); text-align: center; margin-top: 4px; }
.sa-ensuite-d { font-size: 13.5px; color: var(--sombre-texte-3); text-align: center; margin-top: 2px; }
.sa-repos-btns { display: flex; gap: 10px; margin-top: 22px; }
.sa-repos-btns .sa-act { flex: 0 0 38%; }
.sa-valider-court { flex: 1; margin-top: 0; }

/* --- Fin d'exercice ------------------------------------------------------ */
/* Le bloc vert accuse reception de ce qui vient d'etre fait AVANT d'annoncer
   la suite. L'ecran s'ouvrait sur « Fin de l'exercice » en titre, ce qui parle
   deja du suivant. */
.tr-fait {
  display: flex; align-items: center; gap: 13px;
  background: #1c2a1c;
  border: 1px solid #2f4a2f;

  margin-bottom: 22px;
}
.tr-fait-p {

  background: #7bb26a; color: #10240d;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 800;
}
.tr-fait-c { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tr-fait-l {
  font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
  color: #9ccf8c;
}
.tr-fait-n { font-size: 17px; font-weight: 800; color: var(--sombre-texte); }
.tr-fait-d { font-size: 13px; color: #9ccf8c; }

.tr-s { font-size: 14px; color: var(--sombre-texte-3); line-height: 1.5; margin: 4px 0 16px; }
.tr-s b { color: var(--sombre-texte-2); }

.tr-a-r {
  flex: 0 0 30px; width: 30px; height: 30px; border-radius: 9px;
  background: var(--sombre-pastille); color: var(--salle-sur-sombre);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800;
}
.tr-a-c { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; text-align: left; }
.tr-a-e { font-size: 12.5px; font-weight: 700; color: #9ccf8c; white-space: nowrap; }

.fin-rond {

/* Le vert dit la hausse. Il ne sert QUE quand il y a eu hausse : une ligne

.sa-quitter { width: 100%; min-height: 52px; border-radius: 13px; border: 1.5px solid var(--sombre-bord); background: transparent; color: var(--sombre-texte-2); font-size: 15px; }

.sa-repos { text-align: center; padding: 10px 0 4px; }

/* ===========================================================================
   LEMMON FIT v1.22.0 — HISTORIQUE, FICHE, PROGRES
   =========================================================================== */

/* --- LA COURBE ------------------------------------------------------------
   Les etiquettes portent toutes white-space: nowrap. Sans lui, « 12 km » se
   coupe en deux au milieu d'une valeur, et une etiquette d'axe sur deux
   lignes decale le repere qu'elle est censee nommer.
   ------------------------------------------------------------------------- */
.cb { position: relative; margin: 10px 0 4px; padding-left: 46px; }
.cb-ecart {
  position: absolute; top: -2px; right: 0; font-size: 12px; font-weight: 700;
  color: var(--texte-2); white-space: nowrap;
  font-family: ui-monospace, "SF Mono", monospace;
}
.cb-axe {
  position: absolute; left: 0; top: 18px; bottom: 22px; width: 44px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.cb-a-h, .cb-a-b {
  font-size: 11px; color: var(--texte-3); white-space: nowrap;
  font-family: ui-monospace, "SF Mono", monospace;
}
.cb-zone { position: relative; height: 132px; margin-top: 18px; }
.cb-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cb-aire { fill: var(--salle-pale); stroke: none; }
.cb-ligne { fill: none; stroke: var(--citron-courbe); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
/* Les deux pointilles tombent a 10 % et 90 %, exactement ou la formule place
   cy(max) et cy(min). Voir le commentaire de courbePoints. */
.cb-guide { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--bord-fort); }
.cb-guide-h { top: 10%; }
.cb-guide-b { top: 90%; }
.cb-point {
  position: absolute; width: 10px; height: 10px; border-radius: 50%;
  background: var(--citron-courbe); border: 2px solid var(--fond);
  transform: translate(-50%, -50%);
}
.cb-pieds { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; }
.cb-p { font-size: 11.5px; color: var(--texte-2); white-space: nowrap; }
.cb-vide { font-size: 13px; color: var(--texte-3); font-style: italic; margin: 8px 0 14px; }

/* --- HISTORIQUE ---------------------------------------------------------- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 10px; }
.cal-h { font-size: 10px; font-weight: 800; color: var(--texte-3); text-align: center; padding-bottom: 2px; }
.cal-c {
  aspect-ratio: 1 / 1; min-height: 38px; border-radius: 9px; display: flex;
  align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
  font-family: ui-monospace, "SF Mono", monospace;
  background: var(--fond-encart); color: var(--texte-3);
}
.cal-v { min-height: 38px; }
.cal-fait { font-weight: 800; }
.cal-manque { background: transparent; border: 1.5px solid var(--bord-fort); color: var(--texte-3); }
.cal-avenir { background: transparent; border: 1.5px dashed var(--bord-discret); color: var(--texte-3); }
.cal-repos { opacity: .55; }
.cal-auj { outline: 2px solid var(--texte); outline-offset: -2px; }

.cal-leg { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 16px; }
.cal-l { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--texte-2); white-space: nowrap; }
.cal-sw { width: 11px; height: 11px; border-radius: 4px; display: inline-block; }

.hi-liste { list-style: none; margin: 0 0 18px; padding: 0; }
.hi-l {
  width: 100%; text-align: left; background: transparent; border: 0;
  border-bottom: 1px solid var(--sep); min-height: 60px; color: var(--texte);
  display: flex; align-items: center; gap: 11px; padding: 8px 0;
}
/* Pas de curseur pointer sur une ligne qui ne mene nulle part : le curseur
   promet un clic, et une promesse non tenue est pire qu'une absence. */
.hi-l-fixe { cursor: default; }
.hi-p {
  font-size: 10px; font-weight: 800; letter-spacing: .4px; padding: 4px 8px;
  border-radius: 8px; flex: 0 0 auto; min-width: 52px; text-align: center;
}

/* LA PASTILLE DE DATE DES SEANCES RECENTES.
   Elle remplace la pastille qui repetait le code deja present dans le titre.
   Le fond PLEIN de la discipline, pas sa teinte pale : c'est lui qui permet de
   balayer la liste et de voir d'un coup ce qui etait de la salle, un cours ou
   une sortie, sans lire une seule ligne.
   Carre de 46 px, donc au-dessus des 44 px de cible tactile, meme si c'est la
   ligne entiere qui est cliquable. */
.hi-jour {
  flex: 0 0 auto;
  width: 46px; min-height: 46px;
  border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; padding: 4px 2px;

/* ===========================================================================
   LEMMON FIT v1.22.0 — CORRECTIONS DE FIDELITE
   ---------------------------------------------------------------------------
   Ecrit apres le retour d'usage d'Olivier sur la version deposee. Toutes les
   valeurs sont RELEVEES dans maquette.html, pas choisies.

   Ce fichier vient EN DERNIER dans l'assemblage : il corrige des regles posees
   plus tot, et l'ordre de cascade est ce qui lui permet de gagner sans qu'on
   ait a retoucher les fichiers d'origine.
   =========================================================================== */

/* ---------------------------------------------------------------------------
   GLISSEMENT — les deux ecrans suivent le doigt
   ---------------------------------------------------------------------------
   LA PISTE est posee par-dessus la page pendant le geste. Elle porte les deux
   volets, sortant et entrant, cote a cote, et c'est le JavaScript qui les
   translate a chaque touchmove — aucune duree ici, le mouvement EST le doigt.
   Seule la fin de course, au relacher, est une transition (.glisse-fin).

   z-index 30 : SOUS la nav basse, qui est a 40 et reste donc en place pendant
   tout le geste, comme une barre d'onglets doit le faire.

   pointer-events: none : le doigt continue de viser l'ecran reel, dont le
   `touch-action: pan-y` reserve l'horizontale. La piste est un decor.

   Le fond est OPAQUE des deux cotes : la piste couvre l'ecran reel, ce qui
   permet de reconstruire celui-ci derriere elle avant de la retirer. C'est ce
   qui evite de voir le nouvel ecran se monter.
   --------------------------------------------------------------------------- */
.glisse-piste {
  position: fixed;
  inset: 0;
  z-index: 30;
  overflow: hidden;
  pointer-events: none;
  background: var(--fond);
}

/* `top` est pose en ligne par le JavaScript : le volet sortant est remonte de
   la position de defilement, pour montrer ce que l'utilisateur a sous les yeux
   et pas le haut de l'ecran. L'`overflow: hidden` de la piste coupe le reste. */
.glisse-volet {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  background: var(--fond);
  will-change: transform;
}

/* 210 ms : assez pour lire la fin du mouvement, trop court pour se sentir
   attendre. Elle ne s'ajoute pas au geste, elle le termine. */
.glisse-fin { transition: transform .21s cubic-bezier(.22,.61,.36,1); }

/* ---------------------------------------------------------------------------
   L'ENTREE ANIMEE, pour les bascules qui ne viennent pas d'un doigt : nav
   basse, bancs, et le geste rattrape au relacher quand la piste n'a pas ete
   montee. Le glissement, lui, porte son propre mouvement de bout en bout.
   --------------------------------------------------------------------------- */
@keyframes ec-droite { from { transform: translateX(26px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ec-gauche { from { transform: translateX(-26px); opacity: 0; } to { transform: none; opacity: 1; } }
.ec-de-droite { animation: ec-droite .16s cubic-bezier(.22,.61,.36,1); }
.ec-de-gauche { animation: ec-gauche .16s cubic-bezier(.22,.61,.36,1); }

/* Qui demande moins d'animation retrouve le comportement instantane du README.
   La piste n'est alors jamais montee — le JavaScript le verifie avant de la
   construire — mais la regle reste, au cas ou le reglage change en cours de
   route pendant qu'une fin de course est en vol. */
@media (prefers-reduced-motion: reduce) {
  .ec-de-droite, .ec-de-gauche { animation: none; }
  .glisse-fin { transition: none; }
}

    // Les trois objectifs. `v` est ce qui est stocke ; rien d'autre n'est accepte

    function pickRun(pat, alt, avail) {

        if (ok) c.push(ex);

      c.sort(function (a, b) { return a.rank - b.rank; });
      if (!c.length) return null;

    // Une séance où TOUTES les séries renseignées ont atteint le haut de la

    //   - toutes les séries renseignées, pas seulement la dernière. La règle des
    //     2-pour-2 lit derniereSerie() ; ici le mandat parle de TOUTES les séries,
    //     et c'est ce qui fait la différence entre « j'ai fini fort » et « la
    //     charge ne limite plus ».
    //   - au moins autant de séries que prescrit. Sans ce compte, deux séries
    //     faciles sur cinq, deux fois de suite, feraient monter la charge d'une
    //     séance qu'on n'a jamais finie. C'est exactement le signal contraire.
    //   - une charge sur chaque série. « Monter la charge » n'a pas de sens sur des
    //     séries sans kilos, et la référence serait fausse.
    //
    // LA RÉFÉRENCE EST LA PLUS LOURDE DES SÉRIES, et c'est le seul choix qui résiste
    // aux deux façons réelles d'enregistrer. Prendre la DERNIÈRE série (ce que fait
    // la règle des 2-pour-2) ramène à 40 kg quelqu'un qui finit par une série

    // endroit quand un échauffement est saisi dans la même liste. La plus lourde

    function seanceToutEnHaut(s, ex) {

        if (!e || !e.reps) continue;          // série non renseignée : elle ne dit rien
        if (e.reps < ex.repsHi) return null;  // une seule sous la cible suffit à dire non
        if (!e.kg) return null;

    function analyseExercice(ex, aujourdhui) {

      var seances = seancesDe(ex.id, aujourdhui);
      var res = { id: ex.id, nom: ex.name, seances: seances.length, etat: "ok", texte: "", proposition: null };
      if (seances.length < ANA_MIN_SEANCES) {
        res.etat = "jeune";
        res.texte = seances.length + " séance" + (seances.length > 1 ? "s" : "") + " enregistrée" +
                    (seances.length > 1 ? "s" : "") + ", il en faut " + ANA_MIN_SEANCES + ".";
        return res;

      // Décision déjà prise sur cet exercice, et aucune séance depuis. Sans cette

      // motivé le conseil, la règle se redéclencherait au rendu suivant et

      var kgRef = d0 && d0.kg ? d0.kg : null;

      // programme en prescrit 4 se retrouvait étiqueté « écourté » à chaque
      // analyse et ne recevait jamais le conseil de charge dont il avait besoin.
      // Les règles de charge lisent la DERNIÈRE série renseignée, donc une séance
      // qui s'effondre ne les déclenche pas : il n'y a pas de conflit entre elles.

      // --- Règle des 2-pour-2 : prêt à monter ---------------------------------
      if (d0 && d1 && d0.reps >= ex.repsHi + 2 && d1.reps >= ex.repsHi + 2 && kgRef) {

        res.etat = "monter";
        res.texte = "Cible dépassée de deux répétitions ou plus sur tes deux dernières séances (" +

        if (pas2.pas > 0) {

          res.proposition = { type: "charge", ex: ex.id, kg: vise2, hausse: true,

            raison: "Règle des 2-pour-2 : deux répétitions au-dessus de la cible, deux fois de suite. " +

        } else if (pas2.pourquoi) {

      }

      // --- Haut de la fourchette atteint sur TOUTES les séries, deux fois ------

      var hi0 = seanceToutEnHaut(seances[0], ex), hi1 = seanceToutEnHaut(seances[1], ex);
      if (hi0 && hi1) {

        res.texte = "Haut de la fourchette atteint sur toutes tes séries, deux séances de suite (" +

        res.texte = "Sous le bas de la fourchette sur tes deux dernières séances (" +
                    d1.reps + " puis " + d0.reps + " pour " + ex.repsLo + " minimum).";
        res.proposition = { type: "charge", ex: ex.id, kg: Math.max(MIN_KG, kgRef - moins),
          texte: "Redescendre à " + frDec(String(Math.max(MIN_KG, kgRef - moins))) + " kg sur " + ex.name,
          raison: "La charge t'empêche d'atteindre la fourchette prescrite." };

      // --- Échec : les répétitions s'effondrent dans la séance -----------------
      var reps = [], ri;
      for (ri = 0; ri < seances[0].sets.length; ri++) {
        if (seances[0].sets[ri] && seances[0].sets[ri].reps) reps.push(seances[0].sets[ri].reps);
      }
      if (reps.length >= 3 && reps[0] - reps[reps.length - 1] >= 3) {
        res.etat = "echec";
        res.texte = "Tes répétitions s'effondrent en cours de série (" + reps.join(", ") +
                    ") : tu finis à l'échec.";
        res.proposition = { type: "repos", ex: ex.id, rest: Math.min(180, (ex.rest || 60) + 30),
          texte: "Allonger le repos de " + ex.name + " à " + fmtRest(Math.min(180, (ex.rest || 60) + 30)),

      var manque = Math.max(2, Math.ceil(ex.sets / 2));

            raison: "Trois séances au même niveau. Si tu veux relancer, changer d'angle marche souvent — mais garder cet exercice est un choix valable." };

    // TOUS les remplaçants légaux, du meilleur au moins bon.

    // Cette fonction EST le mandat de remplacement, écrit une seule fois : même

    // que la séance reste équilibrée : une poussée horizontale en remplace une
    // autre, jamais un tirage.

    // Le pont IA s'appuie sur cette même liste, pour proposer ET pour valider. Un
    // second filtre écrit à côté aurait fini par diverger de celui-ci, et c'est
    // précisément le filtre qui empêche un modèle de langage de remplacer un
    // soulevé de terre par des mollets.
    function analyseCandidats(ex, pat) {
      if (!profile || !pat) return [];
      var avail = { bw: true }, i;
      for (i = 0; i < profile.equipment.length; i++) avail[profile.equipment[i]] = true;
      if (avail.mach) { for (i = 0; i < GYM_IMPLIES.length; i++) avail[GYM_IMPLIES[i]] = true; }
      var exclus = {}, noGear = {};
      for (i = 0; i < profile.excluded.length; i++) exclus[profile.excluded[i]] = true;
      for (i = 0; i < (profile.noGear || []).length; i++) noGear[profile.noGear[i]] = true;

      // un exercice que l'utilisateur fait déjà ailleurs dans sa semaine.
      var deja = {}, pk, j;
      for (pk in PROGRAM) {
        if (!has(PROGRAM, pk)) continue;
        for (j = 0; j < PROGRAM[pk].exercises.length; j++) deja[PROGRAM[pk].exercises[j].id] = true;
      }

        // réclamait des kilos pour un maintien isométrique. Cette écriture est
        // corrigée — le genre vient du catalogue —, donc l'exclusion n'a plus de
        // raison d'être. Elle devient une PRÉFÉRENCE dans le tri, plus bas :
        // même genre d'abord, genre opposé en queue de liste.
        //
        // Une préférence et non un retrait, parce que la mesure le dit : retirer
        // le filtre ne fait gagner un remplaçant à AUCUNE ligne, et en dégrade

        if (exclus[c.id] || deja[c.id]) continue;

      // meilleur remplaçant ». Pour quelqu'un qui a du matériel, il faisait

      // quadriceps, dans une salle équipée, c'est une régression déguisée en

      var aDuMateriel = profile.equipment.length > 0;

      var memeGenre = (ex.track === "load");

    function analyseRemplacant(ex, pat) {
      var cands = analyseCandidats(ex, pat);
      if (!cands.length) return null;

      var aDuMateriel = profile.equipment.length > 0;
      var choisiBw = (choisi.equip.length === 1 && choisi.equip[0] === "bw");
      if (aDuMateriel && choisiBw) return null;

    // Constat global : assiduité, ancienneté de la dernière décharge, rythme de
    // perte de poids par rapport à ce qui était visé.
    function analyseGlobale(aujourdhui) {
      var g = { seances: 0, semaines: 0, decharge: null, poids: null };
      var k, e, premiere = null;
      for (k in state.log) {
        if (!has(state.log, k)) continue;
        e = state.log[k];

      }
      if (premiere) {
        g.semaines = Math.floor((dateFromKey(aujourdhui) - dateFromKey(premiere)) / (7 * 86400000));

        var sem = Math.floor((dateFromKey(aujourdhui) - dateFromKey(derniere)) / (7 * 86400000));
        if (sem >= ANA_SEMAINES_DECHARGE) g.decharge = sem;

    // ===========================================================================
    // FATIGUE DÉCLARÉE : ALLÉGER, JAMAIS ANNULER
    // ---------------------------------------------------------------------------
    // CE QUI EXISTAIT, MESURÉ : rien. Deux journaux identiques à ceci près que l'un
    // porte énergie/sommeil/force au plancher et l'autre au maximum rendent la
    // MÊME analyse et le MÊME écran, au caractère près. Les trois niveaux étaient
    // saisis, stockés, recopiés dans « Dernière fois », et lus par personne.

    // CE QU'ON EN FAIT, ET CE QU'ON N'EN FAIT PAS. On propose de lever un peu moins
    // sur UNE séance. On ne touche pas au programme, on ne retire pas d'exercice,

    // « Ignorer » à côté d'« Appliquer », comme toutes les autres.
    //
    // POURQUOI L'ÉNERGIE DÉCLENCHE ET PAS LES DEUX AUTRES. Le mandat parle de deux
    // journées d'énergie basse. Le sommeil et la force ressentie NOMMENT ce qui va

    // journée basse d'il y a une semaine ne dit rien d'aujourd'hui.
    //
    // LA FRÉQUENCE EST BORNÉE, ET LE CHIFFRE EST MESURÉ — calendrier rejoué jour

    //

    //   le même journal, énergie à 3 partout ............... 0
    //   le même journal, une journée basse sur deux ........ 0

    // ===========================================================================
    var FAT_FENETRE = 4;   // jours regardés en arrière, AUJOURD'HUI COMPRIS


    var FAT_REPIT   = 10;  // jours de paix après une décision d'allègement


    var FAT_BAS     = 1;   // le niveau « Faible » de l'échelle LEVELS



    function fatigueRecente(aujourdhui) {
      var f = { basse: false, jours: [], sommeil: 0, force: 0, repit: 0 };
      if (!DATE_RE.test(String(aujourdhui))) return f;
      var base = dateFromKey(aujourdhui), j, k, e, vus = [], i;
      for (j = 0; j <= FAT_FENETRE && vus.length < 2; j++) {

      if (vus[0].e.energy !== FAT_BAS || vus[1].e.energy !== FAT_BAS) return f;

        if (vus[i].e.strength === FAT_BAS) f.force++;

      // refus est une décision : on ne repose pas la question le lendemain.
      var v = (profile && profile.allegeVuLe && DATE_RE.test(profile.allegeVuLe)) ? profile.allegeVuLe : null;
      if (v) {
        var reste = FAT_REPIT - Math.floor((base - dateFromKey(v)) / 86400000);

    // La prochaine journée PRÉVUE, aujourd'hui compris. C'est la séance qu'on
    // allège : proposer d'alléger « aujourd'hui » un jour de repos ne servirait à
    // personne, et le mandat parle de la PROCHAINE séance.
    function prochainJourPrevu(aujourdhui) {
      var d = dateFromKey(aujourdhui), i;
      if (!d || isNaN(d.getTime())) return null;
      for (i = 0; i < 8; i++) {
        if (isTrainingDay(d)) return fmt(d);
        d = addDays(d, 1);
      }
      return null;
    }



    // Cette séance-là a-t-elle seulement quelque chose à perdre ? Un plan 100 %
    // course n'a que des blocs de kilomètres, qui ne comptent pas en séries : la
    // proposition y serait une promesse vide. On ne la fait pas.
    function allegeableLe(dateKey) {
      var d = dateFromKey(dateKey);
      if (!d || isNaN(d.getTime())) return false;
      var s = PROGRAM[dayKey(d.getDay())], i, e;
      if (!s || !s.exercises) return false;
      for (i = 0; i < s.exercises.length; i++) {
        e = s.exercises[i];
        if ((e.track || "none") !== "run" && setsCountOf(e) > 1) return true;
      }
      return false;
    }



    // Analyse complète du programme actif.
    function analyser() {
      var aujourdhui = todayKey();
      var out = { exercices: [], propositions: [], globale: analyseGlobale(aujourdhui),
                  exploitables: 0, jeunes: 0, horsAnalyse: [],
                  fatigue: { basse: false, jours: [], sommeil: 0, force: 0, repit: 0 } };

    REPAS: REPAS,

  /* =========================================================================
     DERIVATION — la regle qui porte tout le reste
     -------------------------------------------------------------------------
     De `obJours` (quels jours) et `obAct` (quoi, ces jours-la) se deduisent la
     rotation des seances, les trois listes de creneaux et la liste d'exercices
     de chaque seance. RIEN n'est ecrit en dur : ni « l'exercice 3 », ni « le
     vendredi ». Chaque litteral de ce genre a produit un bug pendant la
     conception du prototype.
     ========================================================================= */

  var JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];

  // AUJOURD'HUI VIENT DU TELEPHONE, PAS D'UNE CONSTANTE. Le prototype de design
  // fige ce jour a mercredi (AUJ_I = 2) pour que ses captures soient stables.
  // Recopier ce 2 donnerait une application qui ne dit vrai qu'un jour sur
  // sept. getDay() rend 0 le dimanche ; nos jours vont de lundi = 0 a
  // dimanche = 6, d'ou le decalage.
  function jourIndexAujourdhui() {
    return (new Date().getDay() + 6) % 7;
  }

  // =========================================================================
  // LA DUREE D'UNE SEANCE EN SALLE
  // -------------------------------------------------------------------------
  // Elle vient soit d'une des quatre entrees de DUREES, soit du champ libre de
  // l'etape 6, ou l'on tape ses propres minutes. UN SEUL endroit la calcule :
  // le nombre d'exercices, le libelle affiche sur l'accueil et dans Moi, et le
  // pont vers le moteur en dependent tous, et trois lectures separees
  // finiraient par ne plus dire la meme chose.
  //
  // `obDuree` GARDE SON SENS D'INDEX, et `obDureeLibre` s'ajoute a cote. Faire
  // porter les minutes a `obDuree` aurait relu les « 1 » deja enregistres sur
  // les telephones comme « une minute ».
  // =========================================================================
  var DUREE_MIN = 20, DUREE_MAX = 180;

  // Rend les minutes du champ libre, ou 0 s'il est vide, illisible ou hors
  // bornes. En dessous de 20 min il ne reste pas de seance a construire ;
  // au-dela de 180 min le nombre d'exercices demande depasse de loin ce que le
  // catalogue contient, et l'ecran promettrait ce qu'il ne peut pas tenir.
  //
  // ⚠️ NE PAS SE CONTENTER DE RETIRER CE QUI N'EST PAS UN CHIFFRE. C'est ce que
  // faisait la premiere version, et « 1h30 » y devenait 130 minutes : le
  // double de ce qui etait ecrit, sans un mot. On lit donc les heures au lieu
  // de les effacer, et tout ce qui ne rentre dans aucune des deux formes est
  // refuse plutot que devine.
  function dureeLibreValide() {
    var brut = state.obDureeLibre, m, v;
    if (brut === undefined || brut === null) return 0;
    brut = String(brut).trim().toLowerCase().replace(/\s+/g, "");
    if (brut === "") return 0;

    // « 90 », « 90min », « 90minutes »
    m = /^(\d{1,3})(min(ute)?s?)?$/.exec(brut);
    if (m) { v = parseInt(m[1], 10); }
    else {
      // « 1h30 », « 1h », « 1h00 », « 2h05 »
      m = /^(\d{1,2})h(\d{1,2})?$/.exec(brut);
      if (!m) return 0;
      v = parseInt(m[1], 10) * 60 + (m[2] ? parseInt(m[2], 10) : 0);
    }
    if (isNaN(v) || v < DUREE_MIN || v > DUREE_MAX) return 0;
    return v;
  }

  function dureeMinutes() {
    return dureeLibreValide() || OB_DUREE_MIN[state.obDuree] || 45;
  }

  function dureeLibelle() {
    var v = dureeLibreValide(), h, m;
    if (!v) return DUREES[state.obDuree] ? DUREES[state.obDuree].t : "45 minutes";
    if (v < 60) return v + " minutes";
    h = Math.floor(v / 60);
    m = v % 60;
    return m ? h + " h " + (m < 10 ? "0" + m : m) : h + " h";
  }

  // Nombre d'exercices de TRAVAIL, echauffement non compris. Les libelles de
  // DUREES annoncent un de plus (4, 6, 7, 8) parce qu'ils comptent
  // l'echauffement, qui est toujours la.
  //
  // LES QUATRE DUREES PROPOSEES SONT DES REPERES CHOISIS, PAS UNE FORMULE :
  // 30 min tient 3 exercices, 45 en tient 5, 60 en tient 6, 75 en tient 7. La
  // marche de 30 a 45 vaut deux exercices, les suivantes un seul. Aucune
  // formule simple ne passe par ces quatre points ; on INTERPOLE donc entre
  // eux plutot que d'inventer une regle qui les contredirait, et au-dela de
  // 75 min on prolonge la derniere pente, un exercice par quart d'heure.
  //
  // ⚠️ CE NOMBRE EST UNE DEMANDE, PAS UNE PROMESSE. `exosDe` s'arrete a ce que
  // la seance CONTIENT : PUSH et PULL ont 6 exercices de travail, LEGS 5,
  // HIIT 4, FULL BODY 16. Une seance longue n'en sort donc pas davantage, et
  // c'etait deja vrai avant le champ libre — a 1 h 15 l'ecran annonce
  // « 8 exercices » alors qu'un jour LEGS en donne 6.
  var DUREE_ANCRES = [[30, 3], [45, 5], [60, 6], [75, 7]];

  function nbTravailPour(minutes) {
    var i, a, b;
    if (!(minutes > 0)) return 5;
    a = DUREE_ANCRES[0];
    if (minutes <= a[0]) return Math.max(1, Math.round(a[1] * minutes / a[0]));
    for (i = 1; i < DUREE_ANCRES.length; i++) {
      a = DUREE_ANCRES[i - 1];
      b = DUREE_ANCRES[i];
      if (minutes <= b[0]) {
        return Math.round(a[1] + (b[1] - a[1]) * (minutes - a[0]) / (b[0] - a[0]));
      }
    }
    b = DUREE_ANCRES[DUREE_ANCRES.length - 1];
    return Math.round(b[1] + (minutes - b[0]) / 15);
  }

  function nbTravail() {
    return nbTravailPour(dureeMinutes());
  }

  // -------------------------------------------------------------------------
  // INVARIANT 1 — LA ROTATION NE CONSOMME QUE LES CRENEAUX DE SALLE.
  //
  // POURQUOI : un cours collectif est un jour d'entrainement, mais le coach le
  // mene et l'appli ne genere rien pour lui. S'il prenait un rang dans la
  // rotation PUSH / PULL / LEGS / HIIT / FULL BODY, declarer un cours le
  // mercredi decalerait tout le programme des jours suivants : le jeudi
  // passerait de PULL a LEGS sans que personne n'ait rien demande. Le compteur
  // `rot` est donc incremente UNIQUEMENT sur `t === "salle"`.
  //
  // INVARIANT 5 (premiere moitie) — un jour coche mais sans activite declaree
  // est legitime, et il ne porte AUCUNE seance : `si` vaut null, et rien en
  // aval ne doit lire SEANCES[null].
  // -------------------------------------------------------------------------
  function deriverJours() {
    var rot = 0, out = [], ji, brut, acts, k, a, o, p;

    for (ji = 0; ji < state.obJours.length; ji++) {
      if (!state.obJours[ji]) continue;

      brut = state.obAct[ji] || [];
      acts = [];
      for (k = 0; k < brut.length; k++) {
        a = brut[k];
        o = { k: k, ji: ji, cle: ji + "-" + k, t: a.t };
        if (a.nom !== undefined) o.nom = a.nom;
        if (a.min !== undefined) o.min = a.min;
        if (a.nat !== undefined) o.nat = a.nat;
        if (a.lieu !== undefined) o.lieu = a.lieu;
        if (a.t === "salle") { o.si = rot % SEANCES.length; rot++; }
        acts.push(o);
      }

      p = acts.length ? acts[0] : null;
      out.push({
        ji: ji,
        nom: JOURS[ji],
        acts: acts,
        vide: acts.length === 0,
        si:    (p && p.t === "salle") ? p.si : null,
        cours: (p && p.t === "cours") ? p : null,
        run:   (p && p.t === "run")   ? p : null
      });
    }
    return out;
  }

  // -------------------------------------------------------------------------
  // INVARIANT 2 — TOUT COMPTAGE DE VOLUME SE FAIT SUR `slots`, JAMAIS SUR
  // `progJours`.
  //
  // POURQUOI : `progJours` porte UN jour par entree, et son `si` / `cours` /
  // `run` ne decrit que la PREMIERE activite de la journee. Quelqu'un qui fait
  // salle le midi et cours le soir a deux activites le vendredi ; compter sur
  // `progJours` en perdrait une, et le total d'heures de cours comme le tonnage
  // hebdomadaire seraient faux sans que rien ne le signale.
  // -------------------------------------------------------------------------
  function aplatir(progJours) {
    var out = [], i, j;
    for (i = 0; i < progJours.length; i++) {
      for (j = 0; j < progJours[i].acts.length; j++) {
        out.push({ ji: progJours[i].ji, nom: progJours[i].nom, a: progJours[i].acts[j] });
      }
    }
    return out;
  }

  function filtrerSlots(slots, type) {
    var out = [], i;
    for (i = 0; i < slots.length; i++) {
      if (slots[i].a.t === type) out.push(slots[i]);
    }
    return out;
  }

  // -------------------------------------------------------------------------
  // INVARIANT 3 — `jourDe(si)` CHERCHE DANS `slotsSalle`, PAS DANS LE PREMIER
  // CRENEAU DE CHAQUE JOUR.
  //
  // POURQUOI : une seance de salle peut occuper le SECOND creneau d'une
  // journee, par exemple un vendredi ou le cours a lieu le matin. La chercher
  // parmi les premiers creneaux ne la trouve pas, et l'ecran la declare alors
  // « hors rotation » alors qu'elle y est parfaitement.
  // -------------------------------------------------------------------------
  function faireJourDe(slotsSalle) {
    return function (si) {
      var i;
      for (i = 0; i < slotsSalle.length; i++) {
        if (slotsSalle[i].a.si === si) return slotsSalle[i].nom.toLowerCase();
      }
      return "";
    };
  }

  // -------------------------------------------------------------------------
  // INVARIANT 4 — `seance` NE DOIT JAMAIS VALOIR null.
  //
  // POURQUOI : SEANCES[null] vaut undefined, et tout l'ecran se vide. Le cas se
  // produisait a la sortie du diagnostic quand le jour courant portait un cours
  // ou une sortie : il n'y avait pas de seance « du jour », et null etait pose
  // faute de mieux. On retombe donc, dans l'ordre : la seance du jour si c'est
  // de la salle, sinon la premiere seance de la rotation, sinon zero.
  // -------------------------------------------------------------------------
  function calculerSiDepart(progJours, slotsSalle) {
    var auj = jourIndexAujourdhui(), i;
    for (i = 0; i < progJours.length; i++) {
      if (progJours[i].ji === auj && progJours[i].si !== null) return progJours[i].si;
    }
    if (slotsSalle.length) return slotsSalle[0].a.si;
    return 0;
  }

  // -------------------------------------------------------------------------
  // INVARIANT 5 (seconde moitie) — UN JOUR OU UN CRENEAU SANS ACTIVITE
  // N'AFFICHE AUCUNE LISTE D'EXERCICES.
  //
  // POURQUOI : un jour coche dont la liste d'activites est vide est un etat
  // LEGITIME, l'utilisateur a le droit de ne rien declarer. Lui inventer une
  // seance par defaut afficherait un programme qu'il n'a pas demande.
  // -------------------------------------------------------------------------
  function exercicesParJour(progJours) {
    var out = [], i;
    for (i = 0; i < progJours.length; i++) {
      out.push(progJours[i].si === null ? [] : exosDe(progJours[i].si));
    }
    return out;
  }

  // La seance effective : echauffement, puis N exercices de travail, chacun
  // remplace par son equivalent de meme pattern s'il a ete refuse au
  // diagnostic.
  //
  // L'ORDRE DES TROIS TESTS EST LA REGLE METIER, pas un detail :
  //   1. `obRetires` d'abord   — une suppression a la main est PRIORITAIRE ;
  //   2. echauffement et `obAjouts` ensuite — toujours presents ;
  //   3. la coupe par duree en dernier.
  // C'est ce qui fait survivre les decisions de l'utilisateur a un changement
  // de duree de seance : le generateur propose, l'utilisateur tranche, et le
  // generateur ne reecrit pas la decision.
  // Copie de surface d'un exercice du catalogue, augmentee de son rang et de sa
  // cle de refus. Une copie, parce que SEANCES est une constante partagee.
  function copieExo(e, rang, code) {
    var o = {}, k;
    for (k in e) { if (has(e, k)) o[k] = e[k]; }
    o.rang = rang;
    o.cle = code + "-" + rang;
    return o;
  }

    var S = SEANCES[idx] || SEANCES[0], gardes = [], i, cle, e, refuse, out = [], rang;

    for (i = 0; i < S.exos.length; i++) {
      cle = S.code + "-" + i;
      if (state.obRetires[cle]) continue;
      if (i === 0 || state.obAjouts[cle]) { gardes.push({ e: S.exos[i], rang: i }); continue; }
      if (i <= nbTravail()) gardes.push({ e: S.exos[i], rang: i });
    }

    for (i = 0; i < gardes.length; i++) {
      e = gardes[i].e;
      rang = gardes[i].rang;
      refuse = !!state.obRefus[S.code + "-" + rang];
      if (!refuse) {
        // UNE COPIE, JAMAIS L'OBJET DU CATALOGUE. SEANCES est une constante
        // partagee par tous les ecrans ; rendre ses objets tels quels invitait
        // a ecrire dedans, et une ecriture y serait devenue la nouvelle
        // reference pour tout le monde, sans passer par l'etat.
        //
        // La copie porte en plus `rang` et `cle`, dont l'ecran du programme a
        // besoin pour proposer « Non merci » sur la BONNE ligne : les refus
        // sont indexes par rang, pas par nom.
        out.push(copieExo(e, rang, S.code));
        continue;
      }
      // Un exercice refuse cede la place a son remplacant. Le materiel et les
      // consignes sont vides parce qu'ils decrivaient l'exercice d'origine :
      // les garder afficherait la fiche du mouvement qu'on vient d'ecarter.
      out.push({
        nom: e.remp, remplace: e.nom, mat: "", lines: [],
        muscle: e.muscle, n: e.n, kg: e.kg, reps: e.reps,
        unite: e.unite, last: e.last, remp: e.remp,
        rang: rang, cle: S.code + "-" + rang, refuse: true
      });
    }
    return appliquerPlanIA(out);
  }

  // =========================================================================
  // LES CHANGEMENTS ACCEPTES DE L'ASSISTANT
  // -------------------------------------------------------------------------
  // Ils s'appliquent ICI, au seul endroit qui fabrique la liste d'exercices
  // d'une seance. Pose plus loin, une charge aurait change sans que le nombre
  // de series suive, et l'ecran de fin aurait compte un tonnage sur des series
  // que la seance ne prescrivait pas.
  //
  // `state.iaPlan` est indexe par NOM AFFICHE, parce que c'est ce que porte la
  // liste ici. La conversion depuis l'identifiant du moteur se fait une seule
  // fois, au moment d'appliquer (voir block_ia.js).
  //
  // La page de controle de la derivation n'a pas ce champ dans son etat : le
  // garde le laisse passer sans rien changer.
  // =========================================================================
  function appliquerPlanIA(liste) {
    var maj = state.iaPlan, i, k, m, o, sortie = [];
    if (!maj) return liste;
    for (i = 0; i < liste.length; i++) {
      m = has(maj, liste[i].nom) ? maj[liste[i].nom] : null;
      if (!m) { sortie.push(liste[i]); continue; }
      o = {};
      for (k in liste[i]) { if (has(liste[i], k)) o[k] = liste[i][k]; }
      // On ne touche PAS a `last` : il raconte la derniere seance faite, pas ce
      // qui est prescrit. Le reecrire ferait dire au passe ce qu'il n'a pas ete.
      if (m.kg) o.kg = m.kg;
      if (m.n) o.n = m.n;
      if (m.repos) o.repos = m.repos;
      if (m.remp && m.remp.nom) {
        o.remplace = o.nom;
        o.nom = m.remp.nom;
        o.mat = m.remp.mat || "";
        o.lines = m.remp.lines || [];
      }
      sortie.push(o);
    }
    return sortie;
  }

  // Le vivier du bouton « Ajouter un exercice » : exactement ce que la duree a
  // ecarte, plus ce qui a ete retire a la main.
  function exosDisponibles(idx) {
    var S = SEANCES[idx] || SEANCES[0], out = [], i, cle;
    for (i = 1; i < S.exos.length; i++) {
      cle = S.code + "-" + i;
      if (state.obRetires[cle]) { out.push({ e: S.exos[i], rang: i, cle: cle }); continue; }
      if (i > nbTravail() && !state.obAjouts[cle]) out.push({ e: S.exos[i], rang: i, cle: cle });
    }
    return out;
  }

  // Point d'entree unique. Tout ecran qui a besoin du programme appelle CECI et
  // rien d'autre : deux derivations paralleles finiraient par se contredire.
  function deriver() {
    var progJours = deriverJours();
    var slots = aplatir(progJours);
    var slotsSalle = filtrerSlots(slots, "salle");
    var slotsCours = filtrerSlots(slots, "cours");
    var slotsRun = filtrerSlots(slots, "run");
    return {
      progJours: progJours,
      slots: slots,
      slotsSalle: slotsSalle,
      slotsCours: slotsCours,
      slotsRun: slotsRun,
      progEx: exercicesParJour(progJours),
      jourDe: faireJourDe(slotsSalle),
      siDepart: calculerSiDepart(progJours, slotsSalle),
      aujourdhui: jourIndexAujourdhui()
    };
  }

  /* =========================================================================
     LE JOURNAL DATE
     -------------------------------------------------------------------------
     POURQUOI IL EXISTE, ALORS QUE LA SPEC NE LE DEMANDE PAS.
     Le prototype archive dans `actFaits`, indexe par « jour de semaine + rang
     de creneau » : la cle « 2-0 » designe le mercredi, tous les mercredis. Il
     ne peut donc porter qu'UNE semaine, et il se contredit lui-meme des la
     suivante. Le prototype s'en accommode parce que son ecran Historique lit
     `HISTO`, sept seances ECRITES EN DUR dans ses constantes.

     Livrer ca donnerait a tout le monde le meme historique invente, et la
     seance d'hier n'existerait nulle part. Les trois ecrans de cette etape —
     Historique, Fiche, Progres — lisent tous du passe : sans journal date, ils
     ne peuvent afficher que de la fiction.

     `hist` est donc la SOURCE DE VERITE. `actFaits` reste ecrit parce que la
     spec le liste, mais il est aussi RECALCULE depuis `hist` pour la semaine
     courante : c'est ce qui le fait se vider tout seul le lundi suivant, au
     lieu de garder des coches d'une semaine morte.
     ========================================================================= */

  function cleDate(d) {
    var m = d.getMonth() + 1, j = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (j < 10 ? "0" : "") + j;
  }

  function dateDepuisCle(k) {
    var p = String(k).split("-");
    if (p.length !== 3) return null;
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
    return isNaN(d.getTime()) ? null : d;
  }

  // Lundi de la semaine contenant d. La semaine commence le lundi, comme le
  // reste de l'appli : `getDay()` rend 0 le dimanche, d'ou le cas particulier.
  function lundiDe(d) {
    var r = new Date(d.getTime()), dow = r.getDay();
    r.setDate(r.getDate() + (dow === 0 ? -6 : 1 - dow));
    r.setHours(0, 0, 0, 0);
    return r;
  }

  function jourEcart(a, b) {
    return Math.round((a.getTime() - b.getTime()) / 86400000);
  }

  function histTrie() {
    var h = (state.hist || []).slice();
    h.sort(function (x, y) { return x.d > y.d ? -1 : (x.d < y.d ? 1 : 0); });
    return h;
  }

  // Les creneaux valides de la SEMAINE COURANTE, derives du journal. C'est ce
  // qui alimente la bande de la semaine et le selecteur de creneau.
  function faitsSemaine() {
    var h = state.hist || [], out = {}, i, d, lundi = lundiDe(new Date()), e;
    for (i = 0; i < h.length; i++) {
      d = dateDepuisCle(h[i].d);
      if (!d) continue;
      e = jourEcart(d, lundi);
      if (e < 0 || e > 6) continue;
      out[h[i].ji + "-" + h[i].k] = 1;
    }
    return out;
  }

  // Nombre de seances sur les N derniers jours, toutes disciplines.
  function histDepuis(nJours) {
    var h = state.hist || [], out = [], i, d, auj = new Date();
    auj.setHours(0, 0, 0, 0);
    for (i = 0; i < h.length; i++) {
      d = dateDepuisCle(h[i].d);
      if (d && jourEcart(auj, d) <= nJours && jourEcart(auj, d) >= 0) out.push(h[i]);
    }
    return out;
  }

  // La SERIE : nombre de jours d'entrainement consecutifs, en remontant depuis
  // aujourd'hui et en ne comptant que les JOURS PREVUS. Un jour non prevu qui
  // ne porte rien ne casse pas la serie — sinon le dimanche la remettrait a
  // zero toutes les semaines.
  function serieCourante() {
    var d = deriver(), h = state.hist || [], parDate = {}, i, n = 0;
    var cur = new Date(); cur.setHours(0, 0, 0, 0);
    var prevus = {};
    for (i = 0; i < d.progJours.length; i++) prevus[d.progJours[i].ji] = 1;
    for (i = 0; i < h.length; i++) parDate[h[i].d] = 1;
    if (!d.progJours.length) return 0;

    // On part d'hier si aujourd'hui est prevu mais pas encore fait : une seance
    // pas encore faite ne casse pas une serie, elle ne l'a pas encore
    // prolongee.
    var ji = (cur.getDay() + 6) % 7;
    if (prevus[ji] && !parDate[cleDate(cur)]) cur.setDate(cur.getDate() - 1);

    for (i = 0; i < 400; i++) {
      ji = (cur.getDay() + 6) % 7;
      if (prevus[ji]) {
        if (parDate[cleDate(cur)]) n++;
        else break;
      }
      cur.setDate(cur.getDate() - 1);
    }
    return n;
  }

  // LA PLUS LONGUE SERIE JAMAIS TENUE. Elle se lit dans le passe, contrairement
  // a serieCourante() qui remonte depuis aujourd'hui : c'est un record, il ne
  // se perd pas quand la serie en cours se casse.
  function serieRecord() {
    var h = state.hist || [], d = deriver(), i, prevus = {}, parDate = {};
    if (!h.length || !d.progJours.length) return "—";
    for (i = 0; i < d.progJours.length; i++) prevus[d.progJours[i].ji] = 1;
    for (i = 0; i < h.length; i++) parDate[h[i].d] = 1;

    var premiere = null, dd;
    for (i = 0; i < h.length; i++) {
      dd = dateDepuisCle(h[i].d);
      if (dd && (!premiere || dd < premiere)) premiere = dd;
    }
    if (!premiere) return "—";

    var cur = new Date(premiere.getTime()), auj = new Date(), n = 0, max = 0, garde = 0;
    auj.setHours(0, 0, 0, 0);
    while (cur <= auj && garde++ < 4000) {
      if (prevus[(cur.getDay() + 6) % 7]) {
        if (parDate[cleDate(cur)]) { n++; if (n > max) max = n; }
        else n = 0;
      }
      cur.setDate(cur.getDate() + 1);
    }
    return max || "—";
  }

  // Assiduite : seances faites sur seances prevues, depuis la premiere trace.
  function assiduite() {
    var d = deriver(), h = state.hist || [], i, prevus = {}, faits = h.length;
    if (!h.length || !d.progJours.length) return 0;
    for (i = 0; i < d.progJours.length; i++) prevus[d.progJours[i].ji] = 1;

    var premiere = null, dd;
    for (i = 0; i < h.length; i++) {
      dd = dateDepuisCle(h[i].d);
      if (dd && (!premiere || dd < premiere)) premiere = dd;
    }
    if (!premiere) return 0;

    var cur = new Date(premiere.getTime()), auj = new Date(), attendus = 0;
    auj.setHours(0, 0, 0, 0);
    while (cur <= auj && attendus < 4000) {
      if (prevus[(cur.getDay() + 6) % 7]) attendus++;
      cur.setDate(cur.getDate() + 1);
    }
    if (!attendus) return 0;
    return Math.min(100, Math.round((faits / attendus) * 100));
  }

  // Les N dernieres seances portant cet exercice, de la plus ancienne a la plus
  // recente : la courbe de charge se lit de gauche a droite.
