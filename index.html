  // CE QUE DEVIENT LA LIGNE CAFEINE UN JOUR DE REPOS. Sa fiche dit « avant la
  // seance » et « garde-la pour les seances lourdes » ; l'afficher telle quelle
  // un jour sans entrainement, sous le libelle « Avant seance », c'est proposer
  // un cafe pour une seance qui n'aura pas lieu — et c'est le seul complement
  // des cinq dont l'interet depend du jour.
  //
  // POURQUOI LA LIGNE RESTE, AU LIEU D'ETRE RETIREE. Les cases cochees du
  // journal sont indexees par POSITION, et nutriCorriger(index) vise la meme
  // position dans le plan STOCKE : les deux tableaux doivent garder la meme
  // longueur et le meme ordre. Une ligne qui disparait un jour sur deux ferait
  // parler chaque ligne suivante d'autre chose. C'est mot pour mot le
  // raisonnement deja tenu pour le creneau « Avant la seance », qu'on RENOMME
  // « Fin d'apres-midi » les jours de repos au lieu de le supprimer. On fait
  // donc ici le meme geste, et la ligne dit ce qui est vrai aujourd'hui.
  var CAF_REPOS = {
    time: "Jour de repos",
    item: "Pas de caféine aujourd'hui",
    note: "elle se garde pour les jours de séance",
    nom: "Caféine"
  };

  // Les cinq rubriques de fiche, dans l'ordre d'affichage. Un tableau plutot que
  // cinq blocs de HTML recopies : ajouter une rubrique devient une ligne.
  var SUPP_RUBRIQUES = [
    { k: "quand", t: "Quand" },
    { k: "comment", t: "Comment" },
    { k: "dose", t: "Combien" },
    { k: "effet", t: "À retenir" },
    { k: "avis", t: "Quand demander un avis" }
  ];

  function suppById(v) {
    var i;
    for (i = 0; i < SUPPS.length; i++) { if (SUPPS[i].v === v) return SUPPS[i]; }
    return null;
  }

  // Lignes de plan d'un groupe de moments. buildNutrition appelle
  // suppLignes(supps, "matin") apres la premiere prise, puis
  // suppLignes(supps, "soir") apres le diner : la posologie n'est plus ecrite
  // qu'a un seul endroit, la table.
  function suppLignes(supps, moment) {
    var out = [], i, s;
    for (i = 0; i < SUPPS.length; i++) {
      s = SUPPS[i];
      if (supps[s.v] && s.moment === moment) {
        out.push({ time: s.time, item: s.item, note: s.note, supp: s.v });
      }
    }
    return out;
  }

  // Fiche depliable. Meme forme que howtoHtml() pour un exercice : un encart
  // dans le flux, jamais une modale, et l'avertissement en pied de fiche.
  function suppFicheHtml(v) {
    var s = suppById(v), i, r, corps = "";
    if (!s) return "";
    for (i = 0; i < SUPP_RUBRIQUES.length; i++) {
      r = SUPP_RUBRIQUES[i];
      if (!s[r.k]) continue;
      corps += '<div class="supp-bloc"><div class="supp-bloc-t">' + esc(r.t) + '</div>' +
               '<div class="supp-bloc-c">' + esc(s[r.k]) + '</div></div>';
    }
    return '<div class="howto supp-fiche">' +
      '<div class="howto-mat">' + esc(s.label) + '</div>' + corps +
      '<div class="howto-note">Des repères d\'usage courant, pas une prescription. ' +
      'Aucun complément n\'est nécessaire pour progresser. Si tu prends un traitement ou ' +
      'que tu as un souci de santé, demande à ton médecin avant d\'en ajouter un.</div>' +
    '</div>';
  }

  function nutritionTargets(profile) {
    var w = profile.startWeight, target = profile.targetWeight;
    var days = profile.days.length;
    // Facteur d'activité grossier mais honnête : 28 kcal/kg au repos relatif,
    // plus une unité par séance hebdomadaire.
    var maintain = Math.round(w * (28 + days) / 10) * 10;
    var losing = target < w;
    var gaining = target > w;
    var deficit = losing ? Math.min(500, Math.round(maintain * 0.2)) : 0;
    // Surplus de 15 %, plafonné à 400 kcal. Au-delà, la part de gras prise
    // augmente sans que le muscle suive : le corps ne construit pas plus vite
    // parce qu'on mange plus. 400 kcal par jour valent environ 0,35 kg par
    // semaine, ce qui est déjà un rythme soutenu.
    var surplus = gaining ? Math.min(400, Math.round(maintain * 0.15)) : 0;
    var floor = profile.sex === "f" ? 1400 : 1600;
    var kcal = Math.max(floor, maintain - deficit + surplus);
    var flooded = losing && (maintain - deficit) < floor;
    // Protéines calées sur le poids le PLUS BAS des deux. En perte c'est la
    // cible : les caler sur le poids actuel gonfle inutilement quand il reste
    // beaucoup à perdre. En prise c'est le poids actuel, pour la raison
    // symétrique — viser les protéines d'un corps qu'on n'a pas encore.
    var prot = Math.round((Math.min(w, target) * 1.8) / 5) * 5;
    // Horizon dans les DEUX sens. 7 700 kcal valent environ un kilo.
    var ecartKcal = losing ? deficit : surplus;
    var weeks = ecartKcal > 0
      ? Math.ceil((Math.abs(w - target) * 7700) / (ecartKcal * 7)) : null;
    return {
      maintain: maintain, kcal: kcal,
      deficit: maintain - kcal,          // négatif en prise de masse
      surplus: kcal - maintain,          // négatif en perte de poids
      prot: prot, floored: flooded, weeks: weeks,
      losing: losing, gaining: gaining
    };
  }

  // Ligne de plan d'un complement. Les macros sont ECRITES, pas laissees a null :
  // 3 g de creatine, une capsule d'omega 3 ou un cafe n'apportent rien de
  // mesurable, et 0 est ici la valeur VRAIE, pas une inconnue. Les laisser
  // « non chiffrees » ferait basculer nutriBilanPlan en « plan partiellement
  // chiffre » pour tout utilisateur qui prend de la creatine, c'est-a-dire pour
  // la plupart — et l'appli renoncerait a conclure sur un plan qu'elle connait
  // parfaitement. Seule la proteine en poudre porte un vrai apport, et c'est
  // exactement celui que nutriJour a deja retire de la cible des repas.
  //
  // ET ELLE DOIT LE DIRE. Porter les macros sans les afficher a produit le
  // defaut le plus deroutant de la refonte : la ligne pesait 23 g et 114 kcal
  // dans le total, mais sa note lisait « ou quand les proteines manquent ». Le
  // bilan sous la liste annoncait donc 156 g quand l'addition des notes
  // visibles en donnait 133 — un ecart de 23 g qu'aucune ligne de l'ecran ne
  // justifiait, et la phrase « plus de 2,2 g par kilo » se calculait sur un
  // total que personne ne pouvait retrouver.
  //
  // La whey est la SEULE ligne de complement qui apporte un vrai macro : 3 g de
  // creatine, une capsule d'omega 3 ou un cafe n'apportent rien de mesurable,
  // et leur note reste la posologie. Elle porte donc sa note chiffree comme
  // toute autre ligne du plan, dans la meme grammaire et avec le meme
  // separateur, suivie de la posologie qui reste utile.
  //
  // La note chiffree n'est pas qu'un affichage : c'est une forme RELUE. Le
  // totaliseur du plan sait retrouver « 23 g prot » dans une note quand la ligne
  // n'a pas de champ chiffre, ce qui est le cas des plans d'avant la v1.5.0. Pas
  // de double compte pour autant — des qu'un champ `prot` existe, c'est lui qui
  // est lu, jamais la note. Cette relecture sert aussi de garde-fou au plan
  // ecrit par une IA : elle permet de comparer ce qu'une ligne ANNONCE a ce que
  // le lecteur y comprend vraiment.
  function nutriLigneSupp(s, fixe) {
    var l = { time: s.time, item: s.item, note: s.note, supp: s.v,
              key: "s" + s.v, nom: s.label, prot: 0, kcal: 0 };
    // `fixe` etait fourni par la journee composee, qui n'existe plus. Les deux
    // complements qui portent de vraies macros les calculent desormais
    // eux-memes, depuis la table d'aliments : un seul endroit, comme la
    // posologie.
    if (!fixe && s.alim) fixe = nutriMacrosFixes(s.alim);
    if (s.alim && fixe) {
      l.prot = fixe.prot; l.kcal = fixe.kcal;
      var chiffre = nutriNote(fixe.prot, fixe.kcal);
      if (chiffre) l.note = chiffre + " · " + s.note;
    }
    return l;
  }

  // Le plan nutrition, avec des QUANTITES. C'est le coeur de la v1.5.0 : la
  // v1.3.0 disait « Déjeuner : protéine + légumes + féculent — 45 g prot », ce
  // qui ne se totalise pas, ne se compare a rien et ne se corrige pas.
  //
  // CE QUE buildNutrition FIGE, ET CE QU'IL NE FIGE PAS. Il pose la STRUCTURE du
  // plan : l'ordre des lignes, leur nombre, leur cle de creneau, la place des
  // complements. C'est elle qui doit rester stable, parce que les cases cochees
  // du journal sont indexees par POSITION : une structure qui bouge fait parler
  // les journees anterieures d'autres lignes.
  //
  // La COMPOSITION, elle, ne se fige pas — voir nutriPlanDuJour juste en dessous.
  // Elle etait figee jusqu'ici, et c'etait le defaut le plus lourd de la
  // refonte : tout le mecanisme de variation par la date, concu et teste, ne
  // servait a rien en production. Quelqu'un qui installait l'appli mangeait le
  // meme dejeuner tous les jours, indefiniment.
  // LES MACROS D'UN COMPLEMENT QUI EN PORTE. La whey et la barre proteinee sont
  // les deux seules lignes de complement qui apportent quelque chose de
  // mesurable. Ce calcul vivait dans nutriJour, qui composait la journee ; il
  // en est SORTI pour survivre a la reduction, parce que sans lui la ligne whey
  // repartirait non chiffree et le total de la journee mentirait vers le bas.
  function nutriMacrosFixes(id) {
    var a = aliment(id), ap;
    if (!a) return { prot: 0, kcal: 0 };
    ap = alimentApport(a, a.nPor * a.gPor);
    return { prot: Math.round(ap.prot), kcal: ap.kcal };
  }

  // ===========================================================================
  // LE PLAN DU JOUR — DES COMPLEMENTS, ET RIEN D'AUTRE
  // ---------------------------------------------------------------------------
  // L'APPLI NE COMPOSE PLUS DE REPAS. Decision du proprietaire du 17 aout 2026,
  // prise apres cinq passes de correctifs et une mesure sans appel : 9,87 % des
  // prises servaient un laitage en trois pots ou plus, jusqu'a quatre pots de
  // 500 g. La cause n'etait pas une liste de bogues, elle etait architecturale —
  // le generateur assemblait des ROLES et mettait les grammes a l'echelle pour
  // atteindre une cible calorique et proteique, et « 4 pots de yaourt » est une
  // BONNE reponse a ce probleme-la. L'espace des combinaisons absurdes est plus
  // grand que l'espace des garde-fous qu'on peut ecrire contre elles.
  //
  // CE QUI RESTE EST CE QUE L'APPLI SAIT FAIRE SANS RIEN INVENTER : dire quand
  // et comment prendre les complements qu'on a declares, et donner deux cibles
  // chiffrees. Pour un vrai plan alimentaire, l'utilisateur connecte une IA et
  // c'est ELLE qui ecrit — sous le controle d'un validateur, a partir de la
  // v1.14.0.
  //
  // L'ORDRE DES LIGNES EST FIXE ET DOCUMENTE, parce que les cases cochees du
  // journal sont indexees par POSITION : matin, avant la seance, apres la
  // seance, collation, soir. Il suit la journee, et il ne depend plus d'aucun
  // creneau de repas — c'est ce qui le rend enfin stable.
  // ===========================================================================

  function buildNutrition(profile) {
    var n = profile.nutri || {};

    for (i = 0; i < (n.supps || []).length; i++) supps[n.supps[i]] = true;

    for (i = 0; i < SUPP_ORDRE.length; i++) {
      lg = suppLignes(supps, SUPP_ORDRE[i]);
      for (z = 0; z < lg.length; z++) {
        list.push(nutriLigneSupp(suppById(lg[z].supp), null));
      }
    }
    // Borne dure. Elle ne peut plus mordre — six complements au maximum contre
    // vingt places — mais elle reste : cleanProfile tronque au meme endroit, et
    // un plan plus long que ce que le stockage garde serait faux des le
    // rechargement.
    if (list.length > MAX_NUTRI_ITEMS) list = list.slice(0, MAX_NUTRI_ITEMS);
    return list;
  }

  // ===========================================================================
  // LE PLAN D'UNE JOURNEE PRECISE
  // ---------------------------------------------------------------------------
  // LA STRUCTURE VIENT DU PROFIL, LE CONTENU SE RECOMPOSE.
  //
  // Ce qui est repris de profile.nutriPlan, et qui ne bouge JAMAIS d'un jour a
  // l'autre : l'ordre des lignes, leur nombre, leur cle de creneau, leur heure,
  // l'identifiant de complement, et la correction de l'utilisateur. C'est la
  // structure qui indexe les cases cochees du journal — la faire varier ferait
  // parler chaque journee passee d'autres lignes que celles qu'on lui a
  // montrees. Voir nutriBilan, qui ecarte deja les journees d'un AUTRE plan.
  //
  // Ce qui se recompose avec la DATE AFFICHEE : la composition, la note chiffree
  // et les deux macros. nutriJour est deterministe — meme date, meme profil,
  // meme assiette —, donc rouvrir hier redonne exactement ce qu'on y avait lu.
  //
  // CE QUI EST RENDU EST UNE COPIE. Rien ici n'ecrit dans profile.nutriPlan :
  // la proposition stockee reste la reference du report de corrections apres un
  // rediagnostic, et l'ecriture d'une correction continue de passer par le seul
  // chemin qui existe, nutriCorriger(index) sur le plan STOCKE. Les deux
  // tableaux ont la meme longueur et le meme ordre : l'index vaut pour les deux.
  //
  // LA CORRECTION SURVIT. Elle est reportee telle quelle sur la ligne
  // recomposee, et nutriEffectif continue de la faire passer devant la
  // proposition : corriger « le dejeuner, c'est un kebab » ne se perd pas parce
  // que la proposition du lendemain n'est plus la meme.
  function nutriPlanDuJour(prof, dateKey) {
    if (!prof || !isArray(prof.nutriPlan) || !prof.nutriPlan.length) return [];
    var struct = prof.nutriPlan, out = [], i, l, ln, p;
    if (!DATE_RE.test(String(dateKey))) dateKey = todayKey();

    // v1.13.0. Ce qui reste depend encore de la date, et c'est la seule chose
    // qui en dependait vraiment : la ligne cafeine change de texte les jours
    // sans seance.
    var seance = nutriEstSeance(prof, dateKey);
    for (i = 0; i < struct.length; i++) {
      l = struct[i];

      ln = { time: l.time, item: l.item, note: l.note, key: l.key, nom: l.nom,
             prot: l.prot, kcal: l.kcal };
      if (l.supp) ln.supp = l.supp;
      // Voir CAF_REPOS : la ligne garde sa PLACE, elle change de TEXTE. Elle
      // reste cochable — quelqu'un qui prend quand meme un cafe le coche —, et
      // ses macros restent a zero, ce qu'elles ont toujours ete.
      if (l.supp === "cafeine" && !seance) {
        ln.time = CAF_REPOS.time; ln.item = CAF_REPOS.item;
        ln.note = CAF_REPOS.note; ln.nom = CAF_REPOS.nom;
      }
      if (l.corr) ln.corr = l.corr;
      out.push(ln);
    }
    return out;
  }

  // rendre sa journee : c'est le calcul le plus lourd de la carte. Le frein en
  // demande quatorze d'un coup pour relire l'historique, et le rendu un de plus.
  // La cle porte une signature du profil : deux profils differents ne peuvent
  // pas se lire l'un pour l'autre, meme si personne n'a pense a vider le memo.

            track: (e.track === "run" || e.track === "load" || e.track === "none")
                     ? e.track : (e.load === true ? "load" : "none"),
            cible: cleanNumber(e.cible, 0.5, 100, 1) || undefined,
            rest: cleanNumber(e.rest, 0, 600, 0) || (CAT_BY_ID[e.id].rest || 60),
            repsLo: cleanNumber(e.repsLo, 1, MAX_REPS, 0) || repsBounds(CAT_BY_ID[e.id].reps).lo,
            repsHi: cleanNumber(e.repsHi, 1, MAX_REPS, 0) || repsBounds(CAT_BY_ID[e.id].reps).hi,
            kgCible: cleanNumber(e.kgCible, MIN_KG, MAX_KG, 1) || undefined,
            decideLe: (typeof e.decideLe === "string" && DATE_RE.test(e.decideLe)) ? e.decideLe : undefined
          });
        }
        if (!exos.length) continue;
        plan[dnum] = {
          code: String(s.code || "seance").slice(0, 20),
          label: String(s.label || "SÉANCE").slice(0, 30),
          sub: String(s.sub || "").slice(0, 80),
          duration: String(s.duration || "").slice(0, 20),
          over: s.over === true,
          // `voulue` : la séance est plus longue que le temps annoncé PAR
          // CONSTRUCTION (sortie longue). Sans cette ligne, le champ serait
          // effacé au rechargement et la séance repasserait pour un accident.
          voulue: s.voulue === true,
          course: s.course === true,
          exercises: exos
        };
        kept++;
      }
      if (kept) p.plan = plan;
    }

    // ------------------------------------------------------------------------
    // LE CONTRAT DE STOCKAGE DU PLAN NUTRITION
    // ------------------------------------------------------------------------
    // UN SEUL bloc, qui porte l'UNION des besoins des quatre briques de la
    // v1.5.0. Ce n'est pas une precaution de style : tout champ non declare ici
    // est EFFACE au rechargement, en silence. Un contrat incomplet ne casse rien
    // le jour ou on l'ecrit — il casse a la relance, quand l'utilisateur retrouve
    // un plan ampute sans savoir pourquoi.
    //
    // LE CONFLIT TRANCHE. Les briques ont ete concues en parallele et ne
    // s'accordaient pas :
    //   - CORRECTIONS gardait `item` borne a 90 caracteres, la borne de la
    //     v1.3.0, quand une ligne disait « Déjeuner : protéine + légumes » ;
    //   - REPAS produit desormais des compositions reelles. MESURE, pas estimee :
    //     620 928 prises composees sur l'ensemble des profils possibles (poids,
    //     cibles, 2 a 5 repas, avec et sans petit-dejeuner, collation, cuisine,
    //     jours d'entrainement, complements, sept dates) donnent une longueur
    //     maximale de 194 caracteres —
    //       « 2 portions de haricots rouges égouttés (300 g) + 1 assiette de
    //         poêlée de légumes (200 g) + 6 pommes de terre (600 g) + 2 cuillères
    //         à soupe de beurre de cacahuète (30 g) + resservir selon la faim »
    //     A 90, cette ligne serait coupee au milieu de « poêlée » au premier
    //     rechargement. D'ou NUTRI_LIGNE_MAX = 240 : la mesure, plus une marge
    //     pour un aliment ajoute a la table demain.
    //   - COMPLEMENTS a besoin de `supp`, l'identifiant de la fiche a deplier ;
    //   - REPAS a besoin de l'identite du creneau, `key` et `nom`.
    //
    // `item` reste la PROPOSITION, toujours. La correction de l'utilisateur vit
    // dans `corr`, a cote, jamais a la place : c'est ce qui rend le retour
    // arriere gratuit et le report apres rediagnostic possible.
    p.nutriPlan = null;
    if (isArray(raw.nutriPlan)) {
      var np = [];
      for (i = 0; i < raw.nutriPlan.length && i < MAX_NUTRI_ITEMS; i++) {
        var it = raw.nutriPlan[i];
        if (!it || typeof it !== "object") continue;
        var lig = {
          time: String(it.time || "").slice(0, 20),
          item: String(it.item || "").slice(0, NUTRI_LIGNE_MAX),
          note: String(it.note || "").slice(0, NUTRI_NOTE_MAX),
          // Identite STABLE de la prise, independante de sa position. Elle sert
          // a reporter les corrections quand un rediagnostic reconstruit le
          // plan : la position, elle, bouge des que le nombre de repas change.
          // Bornee a 16 et reduite a [a-z0-9] : c'est une cle, pas du texte.
          key: String(it.key || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 16),
          // Libelle du creneau (« Déjeuner », « Avant le coucher »). Il sert a
          // l'editeur de correction, qui doit pouvoir dire CE QU'ON REMPLACE
          // quand la composition, elle, tient sur trois lignes.
          nom: String(it.nom || "").slice(0, 30),
          // Apport ESTIME de la prise. null veut dire « non chiffre » et doit le
          // rester : remplacer par 0 ferait mentir tous les totaux vers le bas,
          // et le frein sur les charges se declencherait sur du vide.
          prot: cleanNumber(it.prot, 0, NUTRI_PROT_MAX, 0),
          kcal: cleanNumber(it.kcal, 0, NUTRI_KCAL_MAX, 0)
        };
        // Ligne de complement : elle porte l'identifiant de sa fiche. Valide
        // contre SUPPS, pas seulement nettoye — un identifiant inconnu ferait
        // afficher un bouton « fiche » qui n'ouvrirait rien.
        if (it.supp && suppById(String(it.supp))) lig.supp = String(it.supp);
        // La correction de l'utilisateur, a COTE de la proposition et jamais a
        // sa place.
        var co = cleanNutriCorr(it.corr);
        if (co) lig.corr = co;
        np.push(lig);
      }
      // UN TABLEAU VIDE EST UN PLAN VALIDE DEPUIS LA REDUCTION : c'est celui de
      // qui ne prend aucun complement. `null` reste reserve a « jamais genere »,
      // et isArray(null) etant faux, ce cas-la ne passe pas ici.
      p.nutriPlan = np;
    }

    // Date de generation du plan. Les cases cochees du journal sont indexees par
    // POSITION : un plan refait decale toutes les positions, et les journees
    // anterieures parlent alors d'autres lignes. nutriBilan s'en sert pour les
    // ECARTER au lieu de les mal lire. Sans ce champ, le frein sur les charges
    // se prononcerait sur un historique illisible.
    p.nutriPlanLe = (typeof raw.nutriPlanLe === "string" && DATE_RE.test(raw.nutriPlanLe)) ? raw.nutriPlanLe : null;

    // Date a laquelle un plan anterieur a la v1.5.0 a ete recompose. Elle sert a
    // UNE seule chose : tenir la carte d'explication a l'ecran jusqu'a ce que
    // l'utilisateur la ferme. Elle vit dans le contrat parce que tout champ non
    // declare ici est efface au rechargement — sans cette ligne, le message
    // disparaitrait a la premiere relance, c'est-a-dire souvent avant d'avoir
    // ete lu, et un plan aurait change tout seul sans explication.
    p.nutriMigreLe = (typeof raw.nutriMigreLe === "string" && DATE_RE.test(raw.nutriMigreLe)) ? raw.nutriMigreLe : null;

    // DATE A LAQUELLE UNE IA A ECRIT CE PLAN. Meme forme que les deux dates
    // au-dessus, et pour la meme raison : un champ non declare ici est efface au
    // rechargement, et l'appli se remettrait a juger un plan de complements comme
    // si c'etait une journee — le defaut trouve au navigateur en v1.13.0.
    p.nutriPlanIA = (typeof raw.nutriPlanIA === "string" && DATE_RE.test(raw.nutriPlanIA)) ? raw.nutriPlanIA : null;

    // LA CAUSE DE LA DERNIERE MIGRATION, dans un ensemble CLOS. Une chaine libre
    // n'aurait aucun sens ici : cette valeur choisit un texte, et un texte
    // introuvable laisserait la carte vide apres avoir change le plan de
    // l'utilisateur.
    p.nutriMigreCause = (raw.nutriMigreCause === "v141" || raw.nutriMigreCause === "reduction")
                          ? raw.nutriMigreCause : null;

    // ------------------------------------------------------------------------
    // HISTORIQUE DES JOURS PREVUS. Champ hors `plan`, donc sa validation lui
    // appartient. Une epoque sans date valide, sans jour valide, ou en double,
    // est ECARTEE plutot que reparee : joursPrevusLe s'arrete a la premiere
    // epoque posterieure a la date cherchee, une liste bricolee lui ferait
    // rendre l'epoque d'a cote.
    // ------------------------------------------------------------------------
    p.joursHisto = [];
    if (isArray(raw.joursHisto)) {
      var hz = raw.joursHisto, hi, vus = {};
      for (hi = 0; hi < hz.length && p.joursHisto.length < MAX_EPOQUES; hi++) {
        var ep = hz[hi];
        if (!ep || typeof ep !== "object") continue;
        if (typeof ep.depuis !== "string" || !DATE_RE.test(ep.depuis)) continue;
        if (has(vus, ep.depuis)) continue;
        if (!isArray(ep.jours)) continue;
        var jr = [], jvus = {}, jj;
        for (jj = 0; jj < ep.jours.length; jj++) {
          var jv = parseInt(ep.jours[jj], 10);
          if (jv >= 0 && jv <= 6 && !jvus[jv]) { jvus[jv] = true; jr.push(jv); }
        }
        // Une epoque sans aucun jour ne dit rien et ferait rendre un tableau
        // vide a joursPrevusLe, donc « aucun jour prevu » : le denominateur
        // tomberait a zero et l'assiduite disparaitrait.
        if (!jr.length) continue;
        jr.sort(function (a, b) { return a - b; });
        vus[ep.depuis] = true;
        p.joursHisto.push({ depuis: ep.depuis, jours: jr });
      }
      p.joursHisto.sort(function (a, b) {
        return a.depuis > b.depuis ? 1 : (a.depuis < b.depuis ? -1 : 0);
      });
    }

    p.dechargeLe = (typeof raw.dechargeLe === "string" && DATE_RE.test(raw.dechargeLe)) ? raw.dechargeLe : null;
    p.allegeLe   = (typeof raw.allegeLe   === "string" && DATE_RE.test(raw.allegeLe))   ? raw.allegeLe   : null;
    p.allegeVuLe = (typeof raw.allegeVuLe === "string" && DATE_RE.test(raw.allegeVuLe)) ? raw.allegeVuLe : null;
    // Journal des ajustements : sans lui, on ne sait plus dans six mois pourquoi
    // le programme a change. Borne a 40 entrees, les plus recentes gardees.
    p.journal = [];
    if (isArray(raw.journal)) {
      var jz = raw.journal.slice(-40), ji;
      for (ji = 0; ji < jz.length; ji++) {
        var je = jz[ji];
        if (!je || typeof je !== "object") continue;
        if (typeof je.date !== "string" || !DATE_RE.test(je.date)) continue;
        p.journal.push({ date: je.date, texte: String(je.texte || "").slice(0, 120) });
      }
    }

    p.legacy = raw.legacy === true;
    p.createdAt = (typeof raw.createdAt === "string" && DATE_RE.test(raw.createdAt)) ? raw.createdAt : null;
    // Un profil n'est « fait » que s'il a réellement un programme à afficher.
    p.done = raw.done === true && !!p.plan;
    if (p.done) { nutriMigrerPlan(p); joursHistoMigrer(p); }
    return p;
  }

  // Programme ACTIF et liste de nutrition ACTIVE. Vides tant que le profil n'est
  // pas charge ; applyProfile() les remplit. Le reste du fichier continue de
  // lire PROGRAM, PROGRAM_ORDER et NUTRITION exactement comme avant.
  var profile = null;
  var PROGRAM = {};
  var PROGRAM_ORDER = [];
  var NUTRITION = [];
  var TRAIN_DAYS = {};

  function applyProfile() {
    var i;
    PROGRAM = (profile && profile.plan) ? profile.plan : {};
    PROGRAM_ORDER = [];
    TRAIN_DAYS = {};
    // Les cles du plan vont de 1 a 7 (dimanche = 7), TRAIN_DAYS est indexe par
    // getDay() donc de 0 a 6. La conversion se fait ici, une seule fois.
    for (i = 1; i <= 7; i++) {
      if (PROGRAM[i]) { PROGRAM_ORDER.push(i); TRAIN_DAYS[i === 7 ? 0 : i] = true; }
    }
    NUTRITION = profile ? nutriPlanDuJour(profile, (state && state.editDate) || todayKey()) : [];
    if (profile) {
      START_WEIGHT = profile.startWeight;
      TARGET_WEIGHT = profile.targetWeight;
    }
  }

  var LEVELS = [ { v: 1, label: "Faible" }, { v: 2, label: "Moyen" }, { v: 3, label: "Bon" } ];

  // Les paliers comptent des SÉANCES. Pour revenir à l'ancien affichage en jours :
  //   [{ n: 7, label: "Semaine tenue" }, { n: 30, label: "Un mois régulier" }, { n: 90, label: "Trimestre complet" }]
  var BADGES = [
    { n: 5,  label: "Semaine tenue" },
    { n: 22, label: "Un mois régulier" },
    { n: 65, label: "Trimestre complet" }
  ];

  var CHART_MODES = [
    { v: "both",  label: "Les deux" },
    { v: "raw",   label: "Pesées" },
    { v: "trend", label: "Tendance" }
  ];

  // --- Dates (tout en heure LOCALE) ------------------------------------------
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function dateFromKey(k) { return new Date(k + "T00:00:00"); }
  function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
  // Un jour d'entrainement est un jour CHOISI dans le profil, plus « lundi a
  // vendredi ». Cette hypothese etait cablee dans la grille, l'assiduite, le
  // streak et les phrases : quelqu'un qui s'entraine mardi, jeudi et samedi
  // voyait trois seances manquees par semaine et deux seances hors compte.
  function isTrainingDay(d) { return TRAIN_DAYS[d.getDay()] === true; }

  // ==========================================================================
  // LES JOURS PREVUS, HISTORISES
  // --------------------------------------------------------------------------
  // CE QUE LE DEFAUT PRODUISAIT, MESURE SUR LE LIVRABLE v1.5.0 avant d'ecrire
  // une seule ligne de correctif — journal fabrique de neuf, 9 semaines, AUCUNE
  // seance manquee :
  //
  //   journal parfait lundi/mercredi/vendredi, profil 3 jours ... 100 %  (27/27)
  //   le meme journal, profil passe a 5 jours ...................  60 %  (27/45)
  //
  // Quarante points perdus sans qu'une seule seance ait ete manquee. Le
  // denominateur compte les jours prevus D'AUJOURD'HUI sur TOUT le passe, et le
  // passe n'a evidemment pas de seance les jours qu'on vient d'ajouter.
  //
  // LE SENS INVERSE, celui qu'annonce le backlog (« de 5 a 3 jours, 85 % tombe a
  // 57 % »), NE SE REPRODUIT PLUS : 100 % puis 100 % sur un journal parfait,
  // 81 % puis 83 % sur les donnees de test. Retirer un jour retire ses seances du
  // numerateur ET du denominateur. Le constat datait de la v1.3.0, ou
  // isTrainingDay valait « lundi a vendredi » en dur.
  //
  // LA FORME : une liste d'EPOQUES, pas un champ par journee.
  //     { depuis: "AAAA-MM-JJ", jours: [1,3,5] }
  // Elle est petite, bornee a MAX_EPOQUES, et cleanProfile la valide en entier.
  // Un champ par journee grossirait avec le journal et obligerait a le REECRIRE
  // — la seule chose que ce projet ne touche jamais.
  //
  // LES JOURS SONT CEUX DU PLAN, pas ceux de `days`. buildPlan peut laisser un
  // jour de cote quand rien n'y tient ; c'est le plan qui fait foi a l'ecran, et
  // TRAIN_DAYS en decoule deja. Prendre `days` ferait compter comme prevu un
  // jour qui n'a aucune seance a afficher.
  //
  // CE QU'ON NE SAIT PAS, ON LE DIT. Avant la premiere epoque connue, l'appli n'a
  // aucune trace des jours prevus. Elle applique alors les plus anciens qu'elle
  // connaisse — c'est EXACTEMENT le comportement d'avant ce correctif, donc un
  // profil migre ne voit pas son pourcentage bouger d'un coup — et l'ecran de
  // progression l'ECRIT. Effacer cette periode du calcul aurait ete l'autre
  // option : elle fait passer un profil de 9 semaines d'historique a un
  // denominateur d'un seul jour le matin de la migration. Rejetee pour ca.
  // ==========================================================================
  var MAX_EPOQUES = 10;

  // Leve quand l'historique vient d'etre pose en memoire et n'est pas encore sur
  // le disque. Meme mecanique que nutriMigreAEcrire, et pour la meme raison : une
  // ancre recalculee a chaque ouverture avancerait d'un jour a chaque ouverture.
  var joursHistoAEcrire = false;

  // Jours d'un plan, en convention getDay() (dimanche = 0). Les cles du plan vont
  // de 1 a 7, la conversion se fait ici comme dans applyProfile.
  function joursDuPlan(plan) {
    var out = [], i;
    for (i = 1; i <= 7; i++) { if (plan && plan[i]) out.push(i === 7 ? 0 : i); }
    out.sort(function (a, b) { return a - b; });
    return out;
  }

  function memesJours(a, b) {
    var i;
    if (!isArray(a) || !isArray(b) || a.length !== b.length) return false;
    for (i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false; }
    return true;
  }

  // Note une epoque SI les jours ont change. Appelee au moment ou le plan est
  // ecrit, jamais ailleurs : c'est le seul instant ou « les jours prevus » ont
  // une valeur neuve.
  function joursHistoNoter(p) {
    var neufs, h, dernier, auj;
    if (!p || !p.plan) return;
    neufs = joursDuPlan(p.plan);
    if (!neufs.length) return;
    if (!isArray(p.joursHisto)) p.joursHisto = [];
    h = p.joursHisto;
    dernier = h.length ? h[h.length - 1] : null;
    if (dernier && memesJours(dernier.jours, neufs)) return;
    auj = todayKey();
    // Deux retouches le MEME jour ne font qu'une epoque. Sans ca, dix essais de
    // suite dans l'ecran de reglage videraient la liste par le haut et la borne
    // « connu depuis » sauterait en avant sans que rien ne le justifie.
    if (dernier && dernier.depuis === auj && h.length > 1) dernier.jours = neufs;
    else {
      if (dernier && dernier.depuis === auj) {
        dernier.depuis = fmt(new Date(dateFromKey(auj).getTime() - 86400000));
      }
      h.push({ depuis: auj, jours: neufs });
    }
    // On jette les PLUS ANCIENNES : garder dix epoques recentes vaut mieux que
    // dix epoques mortes. La borne « connu depuis » avance d'autant, et l'ecran
    // la dit.
    while (h.length > MAX_EPOQUES) h.shift();
    joursHistoAEcrire = true;
  }

  // Premiere pose, pour un profil ecrit avant la v1.6.0. L'ancre est createdAt,
  // la seule date que le profil connaisse de lui-meme ; a defaut le jour de la
  // migration, comme le fait deja nutriPlanLe.
  function joursHistoMigrer(p) {
    var jours;
    if (!p || !p.done || !p.plan) return;
    if (isArray(p.joursHisto) && p.joursHisto.length) return;
    jours = joursDuPlan(p.plan);
    if (!jours.length) { p.joursHisto = []; return; }
    p.joursHisto = [{
      depuis: (typeof p.createdAt === "string" && DATE_RE.test(p.createdAt)) ? p.createdAt : todayKey(),
      jours: jours
    }];
    joursHistoAEcrire = true;
  }

  // Jours prevus a une date donnee, ou null quand le profil n'historise pas —
  // auquel cas l'appelant retombe sur le comportement d'avant ce correctif.
  function joursPrevusLe(p, key) {
    var h = (p && isArray(p.joursHisto)) ? p.joursHisto : null, i, choisi;
    if (!h || !h.length) return null;
    choisi = h[0];
    for (i = 0; i < h.length; i++) {
      if (h[i].depuis <= key) choisi = h[i]; else break;
    }
    return choisi.jours;
  }

  // Date a partir de laquelle les jours prevus sont CONNUS, ou null.
  function joursHistoDepuis(p) {
    var h = (p && isArray(p.joursHisto)) ? p.joursHisto : null;
    return (h && h.length) ? h[0].depuis : null;
  }

  // Le pendant historise d'isTrainingDay. Il ne le REMPLACE pas : la grille des
  // quatre semaines, la serie en cours et les phrases parlent du present et
  // continuent de lire les jours du profil courant.
  function etaitJourPrevu(d) {
    var j = joursPrevusLe(profile, fmt(d));
    if (!j) return isTrainingDay(d);
    return j.indexOf(d.getDay()) >= 0;
  }
  function todayKey() { return fmt(new Date()); }
  // Lundi de la semaine contenant d (semaine commençant le lundi).
  function mondayOf(d) {
    var r = new Date(d), dow = r.getDay();
    r.setDate(r.getDate() + (dow === 0 ? -6 : 1 - dow));
    return r;
  }
  function longDate(k) {
    var d = dateFromKey(k);
    var s = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    // Meme regle que shortDate : le premier du mois est un ordinal, les autres
    // quantiemes sont cardinaux. Ici le quantieme suit le nom du jour, donc on
    // l'ancre sur l'espace qui le precede plutot que sur le debut de chaine.
    return (d.getDate() === 1) ? s.replace(/ 1(?!\d)/, " 1er") : s;
  }
  function weekdayName(k) {
    return dateFromKey(k).toLocaleDateString("fr-FR", { weekday: "long" });
  }
  function shortDate(k) {
    var d = dateFromKey(k);
    var s = d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
    // « le 1 avr. » n'existe pas : le premier du mois est un ordinal. Les autres
    // quantiemes sont cardinaux (« le 2 avr. »), donc la regle ne vaut que pour
    // le 1er. Le garde-fou (?!\d) evite de toucher au 10, au 11 ou au 12.
    return (d.getDate() === 1) ? s.replace(/^1(?!\d)/, "1er") : s;
  }

  // shortDate rend l'abreviation AVEC son point pour huit mois sur douze
  // (« 20 juil. ») et SANS pour les quatre autres (« 3 mars », « 5 juin »,
  // « 1er aout », « 3 mai »). Coller un point derriere donnait « juil.. » les
  // huit premiers, et une phrase juste les quatre autres. On ne pose donc le
  // point final que s'il manque.
  function ptFinal(s) {
    s = String(s);
    return s.charAt(s.length - 1) === "." ? s : s + ".";
  }

  // Le nombre de series et la presence d'une charge sont desormais des CHAMPS
  // de l'exercice, plus le resultat d'une analyse de la phrase de prescription.
  // Cette analyse etait le seul obstacle a un budget de temps calculable.
  function setsCountOf(ex) {
    var n = ex.sets;
    if (!(n > 0)) return 1;
    return n > 8 ? 1 : n;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function levelLabel(v) { var l = LEVELS[v - 1]; return l ? l.label : null; }
  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function isArray(a) { return Object.prototype.toString.call(a) === "[object Array]"; }
  function countKeys(o) { var n = 0, k; for (k in o) { if (has(o, k)) n++; } return n; }
  function frNum(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function frDec(n) { return String(n).replace(".", ","); }
  // Le tonnage ne passe en tonnes qu'au-delà de 10 t, et avec une décimale :
  // arrondi à la tonne entière, 1 500 kg s'affichaient « 2 t ».
  function frPoids(kg) {
    if (kg >= 10000) {
      // La partie entiere passe par frNum pour recevoir le separateur de
      // milliers, la decimale est recollee ensuite : frNum arrondit, lui donner
      // le nombre complet rendrait « 1 235 » au lieu de « 1 234,6 ».
      var t = (kg / 1000).toFixed(1).split(".");
      return frNum(Number(t[0])) + "," + t[1] + " t";
    }
    return frNum(kg) + " kg";
  }

  // --- Validation ------------------------------------------------------------
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  function cleanLevel(v) {
    var n = typeof v === "number" ? v : parseInt(v, 10);
    return (n === 1 || n === 2 || n === 3) ? n : null;
  }
  function cleanNumber(v, lo, hi, decimals) {
    var n = typeof v === "number" ? v : parseFloat(String(v).replace(",", "."));
    if (!isFinite(n) || n < lo || n > hi) return null;
    var p = Math.pow(10, decimals || 0);
    return Math.round(n * p) / p;
  }
  function cleanWeight(v) { return cleanNumber(v, MIN_WEIGHT, MAX_WEIGHT, 1); }
  // Le champ « prog » d'une séance passée est un CONSTAT, pas une référence vers
  // le programme du moment. Le valider contre PROGRAM effaçait l'information dès
  // qu'un jour disparaissait du plan : refaire le diagnostic en retirant le
  // mardi supprimait « prog » de tous les mardis passés, et cleanEntry effaçait
  // carrément la journée quand c'était sa seule information. Le tout réécrit
  // dans le stockage par loadLog. On ne vérifie donc plus que la forme.
  // La résolution vers un programme existant se fait en aval, dans progKeyFor,
  // ce qui laisse un jour réintroduit plus tard retrouver son historique.
  function cleanProg(v) {
    var n = typeof v === "number" ? v : parseInt(v, 10);
    return (n >= 1 && n <= 7) ? n : null;
  }

  // sets : { "<identifiant>": [ { kg?, reps? }, ... ] }
  // La longueur du tableau EST le nombre de séries faites. Un élément vide vaut
  // « série faite, charge non notée » : c'est le cas des exercices chronométrés.
  function cleanSetsArray(arr) {
    if (!isArray(arr)) return null;
    var out = [], lastFilled = -1, i, src, one, kg, reps, km, mn;
    for (i = 0; i < arr.length && i < MAX_SETS; i++) {
      src = arr[i];
      one = {};
      if (src && typeof src === "object") {
        kg = cleanNumber(src.kg, MIN_KG, MAX_KG, 1);
        reps = cleanNumber(src.reps, MIN_REPS, MAX_REPS, 0);
        km = cleanNumber(src.km, MIN_KM, MAX_KM, 2);
        mn = cleanNumber(src.min, MIN_MIN, MAX_MIN, 0);
        if (kg !== null) one.kg = kg;
        if (reps !== null) one.reps = reps;
        if (km !== null) one.km = km;
        if (mn !== null) one.min = mn;
      }
      out.push(one);
      if (one.kg !== undefined || one.reps !== undefined ||
          one.km !== undefined || one.min !== undefined) lastFilled = i;
    }
    // On coupe les séries vides de fin SEULEMENT si le tableau contient au moins
    // une série renseignée. Un tableau entièrement vide est légitime : c'est un
    // compteur de séries pour un exercice sans charge.
    if (lastFilled >= 0) out.length = lastFilled + 1;
    return out.length ? out : null;
  }

  function cleanEntry(raw) {
    if (!raw || typeof raw !== "object") return null;
    var out = {}, k, lv, kept = false;

    if (raw.done === true) { out.done = true; kept = true; }

    var w = cleanWeight(raw.weight);
    if (w !== null) { out.weight = w; kept = true; }

    var p = cleanProg(raw.prog);
    if (p !== null) { out.prog = p; kept = true; }

    lv = cleanLevel(raw.energy);   if (lv) { out.energy = lv; kept = true; }
    lv = cleanLevel(raw.sleep);    if (lv) { out.sleep = lv; kept = true; }
    lv = cleanLevel(raw.strength); if (lv) { out.strength = lv; kept = true; }

    if (raw.sets && typeof raw.sets === "object") {
      var st = {}, stCount = 0, arr;
      for (k in raw.sets) {
        if (!has(raw.sets, k)) continue;
        // has() et non un accès direct : EXERCISE_IDS["constructor"] rend la
        // fonction Object, donc une valeur vraie. Des séries rangées sous un nom
        // emprunté à la chaîne de prototypes passaient la validation et
        // comptaient dans le tonnage. Même précaution que DATE_RE sur les clés
        // de journée.
        if (!has(EXERCISE_IDS, k)) continue;    // identifiant inconnu : écarté
        arr = cleanSetsArray(raw.sets[k]);
        if (arr) { st[k] = arr; stCount++; }
      }
      if (stCount) { out.sets = st; kept = true; }
    }

    if (raw.nutri && typeof raw.nutri === "object") {
      var nu = {}, nuCount = 0;
      for (k in raw.nutri) {
        if (!has(raw.nutri, k)) continue;
        var j = parseInt(k, 10);
        // Borne fixe, et non NUTRITION.length. Depuis que le plan nutrition est
        // généré, sa longueur varie : quelqu'un qui refait son diagnostic en
        // décochant une collation passerait de 5 prises à 3, et toutes les cases
        // d'indice 3 ou plus seraient effacées de TOUT l'historique au prochain
        // chargement, puis réécrites. Des mois de suivi perdus en silence, sous
        // un écran qui promet que l'historique est intact. Même raisonnement que
        // pour « prog » : on valide la forme, pas l'appartenance au plan actif.
        if (j >= 0 && j < MAX_NUTRI_ITEMS && raw.nutri[k]) { nu[j] = true; nuCount++; }
      }
      if (nuCount) { out.nutri = nu; kept = true; }
    }

    return kept ? out : null;
  }

  // Migration des formats antérieurs. Jusqu'à la v1.2.0, on avait deux champs
  // séparés, indexés par RANG d'exercice : exSets (nombre de séries) et loads
  // (une seule charge pour tout l'exercice). On les fusionne en « sets », en
  // répétant la charge sur chaque série, ce qui est exactement ce que l'ancien
  // modèle voulait dire. Sans ça, un historique antérieur perdrait tout.
  function migrateEntry(dateKey, raw) {
    if (!raw || typeof raw !== "object") return raw;
    if (!raw.exSets && !raw.loads) return raw;
    // Sans programme chargé, aucun rang d'exercice ne peut être résolu en
    // identifiant. On rend l'entrée INTACTE plutôt que de la vider : une
    // migration impossible doit rester rattrapable au démarrage suivant.
    if (!countKeys(PROGRAM)) return raw;

    var pk = cleanProg(raw.prog);
    if (pk === null) {
      var dow = dayKey(dateFromKey(dateKey).getDay());
      pk = PROGRAM[dow] ? dow : null;
    }
    var exos = (pk !== null && PROGRAM[pk]) ? PROGRAM[pk].exercises : [];

    function idOf(key) {
      if (EXERCISE_IDS[key]) return key;
      if (/^\d+$/.test(key)) {
        var i = parseInt(key, 10);
        if (exos[i]) return exos[i].id;
      }
      return null;
    }

    var sets = {}, k, id, i;

    if (raw.exSets && typeof raw.exSets === "object") {
      for (k in raw.exSets) {
        if (!has(raw.exSets, k)) continue;
        id = idOf(k);
        var n = parseInt(raw.exSets[k], 10);
        if (!id || !(n > 0)) continue;
        sets[id] = [];
        for (i = 0; i < n && i < MAX_SETS; i++) sets[id].push({});
      }
    }
    if (raw.loads && typeof raw.loads === "object") {
      for (k in raw.loads) {
        if (!has(raw.loads, k)) continue;
        id = idOf(k);
        var src = raw.loads[k];
        if (!id || !src || typeof src !== "object") continue;
        if (!sets[id]) sets[id] = [{}];
        for (i = 0; i < sets[id].length; i++) {
          if (src.kg !== undefined) sets[id][i].kg = src.kg;
          if (src.reps !== undefined) sets[id][i].reps = src.reps;
        }
      }
    }

    delete raw.exSets;
    delete raw.loads;
    if (countKeys(sets)) raw.sets = sets;
    return raw;
  }

  function cleanLog(raw) {
    var out = {}, k, e;
    if (!raw || typeof raw !== "object") return out;
    for (k in raw) {
      if (!has(raw, k)) continue;
      if (!DATE_RE.test(k)) continue;   // écarte __proto__, constructor, etc.
      e = cleanEntry(migrateEntry(k, raw[k]));
      if (e) out[k] = e;
    }
    return out;
  }

  // --- État ------------------------------------------------------------------
  // editDate : la journée en cours de saisie, volontairement NON persistée.
  // editDatePinned dit si elle a été CHOISIE explicitement. Tant qu'elle ne l'est
  // pas, elle suit le jour réel : c'est ce qui règle le passage de minuit. Avant,
  // le retour à aujourd'hui dépendait de renderedDay, or le premier rendu après
  // minuit mettait renderedDay à jour en laissant editDate sur la veille, ce qui
  // désarmait le garde-fou et faisait écrire toute la journée sur le jour d'avant.
  var state = {
    log: {},
    editDate: todayKey(),
    editDatePinned: false,
    showExercises: true,
    suppFiche: null,      // identifiant du complement dont la fiche est ouverte
    showProgPicker: false,
    chartMode: "both",
    chartSpan: "6mois",     // "6mois" | "tout" — largeur de l'echelle des dates
    theme: "systeme",       // "sombre" | "clair" | "systeme"

    openExo: null,          // identifiant de l'exercice dont la fiche est ouverte
    exoFolded: {},          // exercices repliés, non persistés : tout est déplié au lancement
    showDatePicker: false,  // champ date replié par défaut, il ne sert qu'au rattrapage
    page: "seance",         // "seance" | "annexe"
    pageAnim: null,         // sens du glissement pour le prochain rendu
    storageOk: true,
    // Cartes OUVERTES, par cle. `true` = ouverte. Une cle absente prend le defaut
    // de CARTES_FERMEES, ce qui evite d'ecrire neuf entrees au premier lancement.
    // Persiste : replier six cartes a chaque demarrage couterait plus cher que de
    // faire defiler, donc un repliage qui ne survit pas ne sert a rien.
    cartes: {},
    // Version SERVIE quand elle est strictement plus recente que celle qui tourne,
    // sinon null. Jamais persistee : c'est un fait du reseau, pas un reglage, et le
    // relire du stockage afficherait un bandeau perime au lancement suivant, avant
    // meme d'avoir sonde.
    majDispo: null,
    // « Plus tard » : vaut pour la SESSION seulement. Persister le refus cacherait
    // le bandeau pour toujours a quelqu'un qui n'a pas mis a jour.
    majVue: false,
    logRaw: null,         // chaine EXACTE du journal en stockage, vue par cette instance
    notice: null,
    ob: null,             // brouillon du diagnostic, non persisté
    iaOuvert: false,      // pont IA replie par defaut : il ne sert pas tous les jours
    // Les deux sous-blocs de l'assistant. Reintroduits en v1.19.0 : ils avaient
    // disparu avec les bascules de carte en v1.17.0, mais ceux-la choisissent un
    // OUTIL entre deux ponts, ils n'economisent pas du scroll. Non persistes : on
    // ouvre l'outil dont on a besoin, on ne le retrouve pas ouvert trois jours plus
    // tard.
    iaNutriOuvert: false,
    avanceOuvert: false,
    iaTexte: "",          // reponse collee, gardee le temps de la session
    iaRes: null,          // propositions retenues et ecartees apres validation
    iaOccupe: false,      // un appel direct est en cours
    // Pont IA NUTRITION. Trois champs plutot qu'un : le texte colle, sa lecture
    // de FORME, et le JUGEMENT du plan. Les garder separes permet a la carte de
    // dire « la forme est bonne, le contenu ne l'est pas » — le cas le plus
    // frequent — au lieu d'un refus global qui n'apprend rien.
    // Rien de tout ca n'est stocke : une reponse d'IA n'a pas a survivre a la
    // session, et v1.14.0 n'ecrit nulle part.
    iaNutriTexte: "",
    iaNutriRes: null,     // sortie de iaLireNutrition (la FORME)
    iaNutriVal: null,     // sortie de nutriValiderPlanIA (le FOND)
    iaCleVisible: false,  // la cle est masquee tant qu'on ne la modifie pas
    iaAvisCle: ""         // avis rendu DANS la carte, la banniere du haut n'y est pas vue
  };

  function syncLogDepuisStockage() {
    // Même garde que loadLog : jamais avant applyProfile, sinon cleanLog
    // validerait contre un PROGRAM vide et écarterait tout.
    if (!countKeys(PROGRAM)) return;
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return; }
    if (raw === null) return;
    if (raw === state.logRaw) return;   // rien n'a bougé : cas normal, coût nul
    try {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.log && typeof parsed.log === "object") parsed = parsed.log;
      state.log = cleanLog(parsed);
      state.logRaw = raw;
    } catch (e) { /* stockage illisible : on garde la copie mémoire */ }
  }

  function loadLog() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      if (parsed && parsed.log && typeof parsed.log === "object") parsed = parsed.log;
      state.log = cleanLog(parsed);
      state.storageOk = true;
      state.logRaw = JSON.stringify(state.log);
      // Si le nettoyage ou la migration ont changé quoi que ce soit, on réécrit
      // tout de suite : sinon les données rejetées resteraient en stockage.
      // On ne réécrit JAMAIS le journal tant que le programme n'est pas chargé :
      // ce qui vient d'être « nettoyé » l'aurait été contre un programme vide,
      // et la réécriture graverait la perte.
      if (raw && countKeys(PROGRAM) && state.logRaw !== raw) persist();
    } catch (e) {
      state.storageOk = false;
      state.log = {};
      state.logRaw = null;
    }
  }

  function persist() {
    try {
      var s = JSON.stringify(state.log);
      localStorage.setItem(STORAGE_KEY, s);
      state.logRaw = s;                 // notre écriture devient la référence
      state.storageOk = true;
      return true;
    } catch (e) {
      state.storageOk = false;
      return false;
    }
  }

  function loadSettings() {
    try {
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (!s || typeof s !== "object") return;
      if (typeof s.showExercises === "boolean") state.showExercises = s.showExercises;
      // VALIDE CONTRE LA LISTE CLOSE, cle par cle. Un objet relu tel quel
      // laisserait entrer n'importe quel nom depuis un stockage abime, et
      // carteOuverte lirait alors un etat que personne ne peut plus atteindre.
      if (s.cartes && typeof s.cartes === "object") {
        var sc;
        for (sc = 0; sc < CARTES_REPLIABLES.length; sc++) {
          if (typeof s.cartes[CARTES_REPLIABLES[sc]] === "boolean") {
            state.cartes[CARTES_REPLIABLES[sc]] = s.cartes[CARTES_REPLIABLES[sc]];
          }
        }
      }
      if (s.chartMode === "both" || s.chartMode === "raw" || s.chartMode === "trend") {
        state.chartMode = s.chartMode;
      }
      if (s.chartSpan === "6mois" || s.chartSpan === "tout") {
        state.chartSpan = s.chartSpan;
      }
      if (s.theme === "sombre" || s.theme === "clair" || s.theme === "systeme") {
        state.theme = s.theme;
      }
      if (s.profile) profile = cleanProfile(s.profile);
      // Reglages IA : valides a part, parce qu'ils vivent hors du profil et
      // echappent donc a cleanProfile. Sans cette ligne, un stockage abime
      // rendrait un objet inattendu et la carte des reglages planterait.
      iaReglages = cleanIaReglages(s.ia);
      if (nutriMigreAEcrire || joursHistoAEcrire) {
        nutriMigreAEcrire = false; joursHistoAEcrire = false; persistSettings();
      }
    } catch (e) { /* réglages illisibles : valeurs par défaut */ }
  }

  // LES TROIS CAS DU LANCEMENT, et le seul endroit qui les tranche :
  //   profil complet           on l'applique, rien ne change a l'ecran ;
  //   pas de profil + journal  une version anterieure tournait ici, on reprend
  //                            son programme d'origine sans rien demander : un
  //                            historique ne doit pas tomber sur un questionnaire ;
  //   rien du tout             premiere installation, on lance le diagnostic —
  //                            decide par l'appelant, qui voit `profile.done`.
  //
  // En fonction plutot qu'au fil de l'amorcage, parce que le banc coupe la
  // source a `loadSettings();` : une regle ecrite plus bas n'est eprouvee par
  // personne, et celle-ci est le chemin du PREMIER lancement d'un utilisateur
  // qui a deja des donnees. C'est exactement le cas ou une regression ne se voit
  // qu'une fois, chez quelqu'un d'autre, sans retour possible.
  function amorcerProfil() {
    // Sonde sur la chaine BRUTE : le journal n'est pas encore charge, compter
    // les cles de state.log rendrait toujours zero.
    var rawLog = null;
    try { rawLog = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    var journalExiste = !!(rawLog && rawLog.length > 2);
    if (!profile && journalExiste) {
      profile = legacyProfile();
      persistSettings();
    }
    if (profile && profile.done) applyProfile();
  }

  function persistSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        showExercises: state.showExercises,
        cartes: state.cartes,
        chartMode: state.chartMode,
        chartSpan: state.chartSpan,
        theme: state.theme,
        profile: profile,
        // Frere du profil, jamais dedans : buildPayload() exporte `profile`,
        // et une cle d'API n'a rien a faire dans un fichier fait pour etre
        // transmis. Elle ne suit donc pas la sauvegarde, volontairement.
        ia: iaReglages
      }));
      // Rend VRAI si l'ecriture a eu lieu. Meme contrat que persist() : un
      // appelant qui annonce « c'est enregistre » doit pouvoir le verifier.
      return true;
    } catch (e) { state.storageOk = false; return false; }
  }

  function updateEntry(patch) {
    var key = state.editDate;
    if (!DATE_RE.test(key)) return;
    syncLogDepuisStockage();
    var entry = {}, ek, k;
    var existing = state.log[key];
    if (existing) { for (ek in existing) { if (has(existing, ek)) entry[ek] = existing[ek]; } }
    for (k in patch) {
      if (!has(patch, k)) continue;
      if (patch[k] === null || patch[k] === undefined) delete entry[k];
      else entry[k] = patch[k];
    }
    var cleaned = cleanEntry(entry);
    if (cleaned) state.log[key] = cleaned;
    else delete state.log[key];
    persist();
  }

  function currentEntry() { return state.log[state.editDate] || {}; }

  // Programme effectué un jour donné : celui explicitement choisi, sinon celui du
  // jour de la semaine. Le week-end n'en a aucun par défaut.
  function progKeyFor(dateKey, entry) {
    if (entry && entry.prog && PROGRAM[entry.prog]) return entry.prog;
    var dow = dayKey(dateFromKey(dateKey).getDay());
    return PROGRAM[dow] ? dow : null;
  }

  // --- Séries et tonnage -----------------------------------------------------
  function setsOf(entry, exId) {
    var s = (entry && entry.sets) ? entry.sets[exId] : null;
    return isArray(s) ? s : [];
  }
  function setsDone(entry, exId) { return setsOf(entry, exId).length; }

  // Replie les exercices TERMINES de la journee affichee, et rend leur nombre.
  // Appelee par le bouton et par la validation de seance. JAMAIS par une saisie :
  // c'est la condition qui avait fait ecarter ce correctif en v1.3.0, un bloc
  // qui se referme pendant qu'on tape la derniere valeur.
  // « Termine » se lit ici exactement comme dans exerciseProgress, meme borne
  // MAX_SETS comprise : deux definitions du mot donneraient un bouton qui
  // annonce trois exercices et en replie deux.
  function replierLesFaits() {
    var pk = progKeyFor(state.editDate, currentEntry());
    var prg = pk ? PROGRAM[pk] : null;
    if (!prg) return 0;
    var e = currentEntry(), n = 0, i, ex;
    for (i = 0; i < prg.exercises.length; i++) {
      ex = prg.exercises[i];
      if (Math.min(setsDone(e, ex.id), MAX_SETS) >= setsCountOf(ex)) {
        if (state.exoFolded[ex.id] !== true) { state.exoFolded[ex.id] = true; n++; }
        // Une fiche technique ouverte dans un bloc replie n'aurait nulle part
        // ou s'afficher, meme regle que toggle-exo.
        if (state.openExo === ex.id) state.openExo = null;
      }
    }
    return n;
  }

  // Tonnage = somme des charge × répétitions, série par série. Exact, puisque la
  // charge est notée pour chaque série et non supposée constante.
  // Distance et duree parcourues sur un bloc de course, puis sur la journee.
  // Le pendant exact du tonnage, pour une discipline qui ne se compte pas en
  // kilos : sans ca l'ecran de progression d'un coureur afficherait « 0 kg ».
  function exerciseDistance(entry, exId) {
    var arr = setsOf(entry, exId), d = 0, i;
    for (i = 0; i < arr.length; i++) { if (arr[i] && arr[i].km) d += arr[i].km; }
    return d;
  }
  function exerciseMinutes(entry, exId) {
    var arr = setsOf(entry, exId), m = 0, i;
    for (i = 0; i < arr.length; i++) { if (arr[i] && arr[i].min) m += arr[i].min; }
    return m;
  }
  function sessionDistance(entry) {
    if (!entry || !entry.sets) return 0;
    var d = 0, k;
    for (k in entry.sets) { if (has(entry.sets, k)) d += exerciseDistance(entry, k); }
    return d;
  }
  // Allure au format francais : 5,4 min/km devient « 5'24 ».
  function frAllure(km, minutes) {
    if (!(km > 0) || !(minutes > 0)) return null;
    var parKm = minutes / km;
    var m = Math.floor(parKm);
    var s = Math.round((parKm - m) * 60);
    if (s === 60) { m++; s = 0; }
    return m + "'" + (s < 10 ? "0" : "") + s;
  }

  function exerciseTonnage(entry, exId) {
    var arr = setsOf(entry, exId), t = 0, i;
    for (i = 0; i < arr.length; i++) {
      if (arr[i] && arr[i].kg && arr[i].reps) t += arr[i].kg * arr[i].reps;
    }
    return t;
  }
  // On somme TOUTES les séries enregistrées ce jour-là, et non les seuls
  // exercices du programme du jour.
  //
  // L'ancienne version filtrait par le programme, en héritage du bug des
  // charges indexées par RANG : une série orpheline pouvait alors être du
  // tonnage fantôme attribué au mauvais exercice. Depuis l'indexation par
  // IDENTIFIANT, une série orpheline n'est plus une erreur d'attribution :
  // c'est un exercice réellement effectué, validé contre le catalogue.
  //
  // Le filtre était devenu nuisible. Il rendait invisible tout tonnage d'un
  // jour sans programme, et surtout, depuis que les jours d'entraînement sont
  // configurables, retirer un jour du profil aurait effacé le tonnage de
  // toutes les séances passées ce jour-là. Mesuré sur un historique de test :
  // 1 876 kg d'une séance libre du samedi manquaient au total.
  function sessionTonnage(dateKey, entry) {
    if (!entry || !entry.sets) return 0;
    var t = 0, k;
    for (k in entry.sets) { if (has(entry.sets, k)) t += exerciseTonnage(entry, k); }
    return t;
  }

  // Dernière fois que cet exercice a été chargé, en balayant JOUR PAR JOUR vers
  // l'arrière et en n'acceptant que les journées du MÊME programme. L'ancien pas
  // de 7 jours encodait l'hypothèse « même jour de semaine = même programme »,
  // que le choix de séance rend fausse.
  function lastTonnageFor(fromKey, exId, progKey) {
    var cursor = addDays(dateFromKey(fromKey), -1), i, k, e, t;
    for (i = 0; i < LOOKBACK_DAYS; i++) {
      k = fmt(cursor);
      e = state.log[k];
      if (e && progKeyFor(k, e) === progKey) {
        t = exerciseTonnage(e, exId);
        if (t > 0) return { date: k, tonnage: t, sets: setsDone(e, exId) };
      }
      cursor = addDays(cursor, -1);
    }
    return null;
  }

  // Dernière séance du MÊME programme. L'ancienne version s'arrêtait sur
  // n'importe quelle entrée non vide : une simple pesée faisait office de séance
  // de référence, le tonnage de comparaison valait 0 et l'appli annonçait
  // « premier repère » alors que dix séances étaient enregistrées.
  // Pendant de lastTonnageFor pour la course : la derniere fois qu'on a couru
  // ce meme bloc, avec sa distance et sa duree.
  function lastRunFor(fromKey, exId, progKey) {
    var cursor = addDays(dateFromKey(fromKey), -1), i, k, e, d;
    for (i = 0; i < LOOKBACK_DAYS; i++) {
      k = fmt(cursor);
      e = state.log[k];
      if (e && progKeyFor(k, e) === progKey) {
        d = exerciseDistance(e, exId);
        if (d > 0) return { date: k, km: d, min: exerciseMinutes(e, exId) };
      }
      cursor = addDays(cursor, -1);
    }
    return null;
  }

  function lastSessionKeyFor(fromKey, progKey) {
    if (!progKey) return null;
    var cursor = addDays(dateFromKey(fromKey), -1), i, k, e;
    for (i = 0; i < LOOKBACK_DAYS; i++) {
      k = fmt(cursor);
      e = state.log[k];
      if (e && progKeyFor(k, e) === progKey && (e.done || e.sets)) return k;
      cursor = addDays(cursor, -1);
    }
    return null;
  }

  // --- Moyenne mobile de poids ----------------------------------------------
  // Les pesées sont irrégulières : on moyenne sur une FENÊTRE DE DATES glissante,
  // pas sur un nombre de points, sinon deux pesées espacées de trois semaines
  // seraient traitées comme deux jours consécutifs.
  function weightTrend(series, windowDays) {
    var out = [], i, j, end, start, sum, n, d;
    for (i = 0; i < series.length; i++) {
      end = dateFromKey(series[i].date);
      start = addDays(end, -(windowDays - 1));
      sum = 0; n = 0;
      for (j = 0; j <= i; j++) {
        d = dateFromKey(series[j].date);
        if (d >= start && d <= end) { sum += series[j].poids; n++; }
      }
      out.push({ date: series[i].date, poids: sum / n });
    }
    return out;
  }

  // --- Phrase du jour --------------------------------------------------------
  // Le THÈME vient des données (streak, poids, tonnage, palier, reprise), la
  // FORMULATION est tirée d'après la date. Deux conséquences voulues : la phrase
  // ne bouge pas quand on tape dans l'appli au cours de la journée, et elle
  // change le lendemain même si rien d'autre n'a évolué. Surtout, pas de
  // Math.random : le texte sauterait à chaque re-rendu, donc à chaque tap.
  function dayHash(s) {
    var h = 2166136261, i;
    for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h >>> 0;
  }
  // ROTATION indexée sur le numéro du jour, et non hachage de la date. Un
  // hachage est bien réparti mais pas alterné : il produisait des séries de
  // quatre ou cinq jours sur la même formulation. Ici l'indice avance d'un cran
  // chaque jour, donc la phrase change forcément, et le décalage propre au thème
  // évite que tous les thèmes changent en même temps.
  function dayNumber(dateKey) {
    return Math.floor(dateFromKey(dateKey).getTime() / 86400000);
  }
  function pickForDay(list, dateKey, salt) {
    if (list.length < 2) return list[0];
    return list[(dayNumber(dateKey) + dayHash(salt)) % list.length];
  }

  function motivationFor(c) {
    var kgPerdus = frDec(Math.abs(c.weightDelta));
    // Le SENS visé se lit sur l'intention du profil (départ vers cible), pas sur
    // la variation constatée : deux semaines de stagnation ne changent pas
    // l'objectif que l'utilisateur s'est donné.
    var enPrise = !!(profile && profile.targetWeight > profile.startWeight);
    // Ce qui reste à parcourir, toujours positif, quel que soit le sens.
    var reste = c.toGo === null ? null : frDec(Math.max(0, Math.round(Math.abs(c.toGo) * 10) / 10));
    // « Ça avance » veut dire descendre en perte, monter en prise.
    var avance = enPrise ? (c.weightDelta > 0) : (c.weightDelta < 0);

    if (c.totalDone === 0) {
      return pickForDay([
        { head: "La première séance compte double.", sub: "Pas besoin de résultat visible aujourd'hui, juste de la présence. Le reste suit." },
        { head: "Tout commence par une séance.", sub: "Celle d'aujourd'hui n'a pas besoin d'être bonne. Elle a besoin d'exister." },
        { head: "Aucun historique, aucune dette.", sub: "Tu démarres à zéro et c'est confortable : il n'y a rien à rattraper." }
      ], c.dateKey, "start");
    }

    if (reste !== null && Math.abs(c.toGo) <= 2 && avance) {
      return pickForDay([
        { head: "Il te reste " + reste + " kg.", sub: "La dernière portion est la plus lente. Ne change rien à ce qui a marché jusqu'ici." },
        { head: "Objectif à " + reste + " kg.", sub: "À ce stade, c'est la régularité qui finit le travail, pas un coup d'accélérateur." },
        { head: "Plus que " + reste + " kg au compteur.", sub: "Tu as fait " + kgPerdus + " kg. Le plus dur est derrière." }
      ], c.dateKey, "endgame");
    }

    if (c.badgeHit) {
      return pickForDay([
        { head: "Palier " + c.totalDone + " séances franchi.", sub: "Ce n'est plus de la motivation, c'est devenu une habitude." },
        { head: c.totalDone + " séances au compteur.", sub: "Le chiffre importe moins que ce qu'il prouve : tu y retournes même les jours sans envie." },
        { head: "Cap des " + c.totalDone + " séances.", sub: "Personne ne t'a obligé à venir " + c.totalDone + " fois. C'est ça, le résultat." }
      ], c.dateKey, "badge");
    }

    // Le message le plus utile de tous : la balance ne bouge plus mais les
    // charges montent. Sans ça, c'est le moment classique où on abandonne.
    if (c.plateau && c.tonnageDiff > 0) {
      return pickForDay([
        { head: "La balance stagne, pas toi.", sub: "Ton poids n'a quasiment pas bougé en deux semaines, mais tu soulèves " + frNum(c.tonnageDiff) + " kg de plus que la dernière fois sur cette séance." },
        { head: "+" + frNum(c.tonnageDiff) + " kg soulevés, poids stable.", sub: "C'est le signe qu'il se passe quelque chose que la balance ne mesure pas. Continue." },
        { head: "Plateau sur la balance.", sub: "Le muscle est plus dense que la graisse : ton poids peut stagner pendant que ta composition change. Tes charges le disent." }
      ], c.dateKey, "plateau-up");
    }

    if (c.plateau && c.weightDelta < 0) {
      return pickForDay([
        { head: "Palier de poids.", sub: "Deux semaines sans bouger, c'est normal et ça finit toujours par repartir. Tu es à " + kgPerdus + " kg depuis le départ." },
        { head: "La balance fait une pause.", sub: "Un plateau n'est pas un arrêt. La seule erreur serait de lâcher la régularité maintenant." },
        { head: kgPerdus + " kg, et ça bloque un peu.", sub: "Regarde tes charges plutôt que la balance cette semaine : c'est là que la progression se voit." }
      ], c.dateKey, "plateau");
    }

    if (c.streak === 0 && c.isTrainingDay && !c.doneToday) {
      return pickForDay([
        { head: "Reprise en douceur.", sub: "Ta séance du jour t'attend. Une séance faite efface vite un jour manqué." },
        { head: "Un jour sauté, rien de cassé.", sub: "Tu as déjà " + c.totalDone + " séances derrière toi. Elles ne disparaissent pas." },
        { head: "On repart d'ici.", sub: "Le streak repart à un aujourd'hui. Le total, lui, reste à " + c.totalDone + "." }
      ], c.dateKey, "comeback");
    }

    if (c.tonnageDiff > 0) {
      return pickForDay([
        { head: "+" + frNum(c.tonnageDiff) + " kg soulevés.", sub: "Tu soulèves plus que la dernière fois sur cette séance. Ça, la balance ne le dit pas." },
        { head: "Séance plus lourde que la précédente.", sub: frNum(c.tonnageDiff) + " kg de plus au total. C'est la définition de la progression." },
        { head: "Les charges montent.", sub: "+" + frNum(c.tonnageDiff) + " kg sur cette séance. Note-les, elles serviront de repère la semaine prochaine." }
      ], c.dateKey, "tonnage");
    }

    if (c.streak >= 10) {
      return pickForDay([
        { head: c.streak + " séances d'affilée.", sub: "À ce stade, ce n'est plus la volonté qui te porte, c'est la régularité elle-même." },
        { head: c.streak + " jours sans en manquer un.", sub: "L'habitude est prise. Le vrai risque maintenant, c'est de vouloir en faire trop." },
        { head: "Série de " + c.streak + ".", sub: "Ton assiduité est à " + (c.attendance === null ? "un bon niveau" : c.attendance + " %") + ". Peu de gens tiennent ça." }
      ], c.dateKey, "streak-long");
    }

    if (c.streak >= 4) {
      return pickForDay([
        { head: c.streak + " séances d'affilée.", sub: "Le doute recule normalement autour de la 3e ou 4e semaine. Tu y es presque." },
        { head: "Série en cours : " + c.streak + ".", sub: "C'est la phase où ça demande encore un effort conscient. Elle ne dure pas." },
        { head: c.streak + " d'affilée, ça tient.", sub: "Ne cherche pas à accélérer. Cherche à ne pas casser la série." }
      ], c.dateKey, "streak-mid");
    }

    if (avance && enPrise) {
      return pickForDay([
        { head: "+" + kgPerdus + " kg depuis le départ.", sub: "La masse se construit lentement. Un chiffre qui monte doucement est exactement ce qu'on veut." },
        { head: kgPerdus + " kg de plus au compteur.", sub: reste !== null ? "Reste " + reste + " kg pour atteindre l'objectif." : "La pente est la bonne." },
        { head: "Le poids monte.", sub: "Vérifie que tes charges montent aussi : c'est ce qui distingue du muscle d'un simple surplus." }
      ], c.dateKey, "weight-prise");
    }

    if (avance) {
      return pickForDay([
        { head: kgPerdus + " kg depuis le départ.", sub: "Un chiffre qui bouge, même petit, est une preuve, pas une coïncidence." },
        { head: "-" + kgPerdus + " kg au compteur.", sub: reste !== null ? "Reste " + reste + " kg pour atteindre l'objectif." : "La pente est la bonne." },
        { head: "Le poids descend.", sub: kgPerdus + " kg de moins qu'au premier jour. Regarde la tendance, pas la pesée du matin." }
      ], c.dateKey, "weight");
    }

    if (!c.isTrainingDay) {
      return pickForDay([
        { head: "Jour de repos.", sub: "Aucune séance attendue. Te peser aujourd'hui lisse quand même la courbe." },
        { head: "Jour sans programme.", sub: "La récupération fait partie de l'entraînement, elle n'est pas une pause dans le travail." },
        { head: "Repos prévu.", sub: "Tu as " + c.totalDone + " séances derrière toi. Rien à prouver aujourd'hui." }
      ], c.dateKey, "weekend");
    }

    return pickForDay([
      { head: "Chaque séance compte.", sub: "Les premières semaines ne se voient pas dans le miroir, elles se voient dans le streak." },
      { head: c.totalDone + " séances faites.", sub: "Le résultat n'est pas dans la séance d'aujourd'hui, il est dans leur addition." },
      { head: "Présent, c'est déjà l'essentiel.", sub: "Une séance moyenne faite vaut mieux qu'une séance parfaite reportée." }
    ], c.dateKey, "default");
  }

  // --- Fiche technique d'un exercice ----------------------------------------
  // Volontairement AUCUN lien vidéo codé en dur : il est impossible de garantir
  // qu'un identifiant de vidéo pointe vraiment sur le bon exercice, et un mauvais
  // repère technique sur un mouvement chargé, c'est un risque de blessure. Le
  // bouton lance donc une recherche sur le NOM exact de l'exercice, ce qui rend
  // la correspondance certaine.
  function howtoHtml(ex) {
    // La fiche vit dans le catalogue, à côté du reste de l'exercice. Elle
    // occupait un objet HOWTO séparé, qu'il fallait tenir synchronisé à la main.
    var h = CAT_BY_ID[ex.id];
    var query = encodeURIComponent(ex.name + " technique musculation");
    var lines = h ? h.lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join("") : "";
    return '<div class="howto">' +
      (h ? '<div class="howto-mat">' + esc(h.mat) + '</div>' : "") +
      (lines ? '<ul class="howto-list">' + lines + '</ul>' : '<div class="howto-note">Pas de fiche pour cet exercice.</div>') +
      '<a class="howto-video" href="https://www.youtube.com/results?search_query=' + query + '"' +
        ' target="_blank" rel="noopener noreferrer">▶ Chercher une vidéo de cet exercice</a>' +
      '<div class="howto-note">Mémo écrit, pas l\'œil d\'un coach. Si un réglage de machine te fait douter, fais-toi montrer une fois sur place.</div>' +
    '</div>';
  }

  // --- Rendu -----------------------------------------------------------------
  var root = document.getElementById("root");
  var renderedDay = null;

  // ==========================================================================
  // LA POSITION DE DEFILEMENT
  // --------------------------------------------------------------------------
  // Ce que le livrable rendait apres un rendu, mesure avant d'ecrire une ligne
  // (ecran seance, seance a demi remplie) :
  //
  //   <button> rendus ............. 27, dont porteurs d'un id :  0
  //   <input>  rendus ............. 27, dont porteurs d'un id : 27
  //   defilement sauve ............ NON
  //
  // Le focus n'est rendu qu'a ce qui porte un id, donc aux seuls champs. Et
  // taper dans un champ ne redessine RIEN — le gestionnaire « input » ecrit la
  // valeur et sort, expres, pour ne pas fermer le clavier. Ce qui redessine,
  // c'est le CLIC : cocher une serie, replier, valider. Que des boutons, aucun
  // id. A l'instant exact que le defaut nomme, il n'y avait donc rien a
  // restaurer d'un cote et rien de sauve de l'autre.
  //
  // MESURE DU DEPLACEMENT, en remplissant le haut de la liste et en suivant la
  // position du dernier exercice : +100 caracteres et 6 noeuds apres une serie,
  // +218 et 8 noeuds apres trois. Autant de hauteur inseree au-dessus du doigt.
  //
  // LE JETON. Une reprise differee qui survit a un rendu plus recent ferait
  // revenir la page a une position perimee : chaque appel prend un numero, et
  // une reprise dont le numero n'est plus le dernier ne fait rien. C'est ce qui
  // permet a allerEnHaut() de couper une restauration deja programmee, au lieu
  // de se battre avec elle.
  // ==========================================================================
  var scrollJeton = 0;

  function scrollCourant() {
    if (typeof window.pageYOffset === "number") return window.pageYOffset;
    var de = document.documentElement;
    if (de && typeof de.scrollTop === "number") return de.scrollTop;
    return (document.body && document.body.scrollTop) || 0;
  }

  function scrollRendre(y) {
    scrollJeton++;
    var mien = scrollJeton;
    try { window.scrollTo(0, y); } catch (e) {}
    // iOS ecrase une position rendue avant la fin de la mise en page. On repasse
    // apres, et une fois encore a la frame suivante — mais SEULEMENT si la
    // position a effectivement ete ecrasee, et seulement si aucun rendu plus
    // recent n'a pris la main depuis.
    var repasse = function () {
      if (mien !== scrollJeton) return;
      if (Math.abs(scrollCourant() - y) < 2) return;
      try { window.scrollTo(0, y); } catch (e) {}
    };
    if (typeof window.requestAnimationFrame === "function") {
      window.requestAnimationFrame(function () {
        repasse();
        window.requestAnimationFrame(repasse);
      });
    } else if (typeof setTimeout === "function") {
      setTimeout(repasse, 0);
    }
  }

  // Le SEUL chemin pour remonter en haut. Il passe par le meme jeton que la
  // restauration, sinon les deux se disputeraient la page : changer d'ecran
  // programmait un retour en haut, et la reprise differee du rendu precedent le
  // defaisait une frame plus tard.
  function allerEnHaut() { scrollRendre(0); }

  function render() {
    try {
      appliqueTheme();
      renderInner();
      renderedDay = todayKey();
    } catch (e) {
      renderFailure(e);
    }
  }

  function renderFailure(e) {
    var msg = e && e.message ? e.message : String(e);
    root.innerHTML =
      '<div class="container">' +
        '<div class="brandmark"><span class="brandmark-text">LEMMON<b>FIT</b></span></div>' +
        '<div class="banner banner-error">Affichage impossible : ' + esc(msg) + '.<br>' +
        'Tes données sont intactes. Exporte-les, puis réinitialise si l\'écran ne revient pas.</div>' +
        '<div class="backup-row">' +
          '<button type="button" class="backup-btn" data-action="export-data">⬇ Exporter</button>' +
          '<button type="button" class="backup-btn" data-action="reset">↺ Réinitialiser</button>' +
        '</div>' +
        '<div class="footer-row"><button type="button" class="update-btn" data-action="update-app">⟳ Mettre à jour l\'appli</button>' +
        '<div class="version-tag">v' + esc(APP_VERSION) + ' · ' + esc(APP_BUILD) + '</div></div>' +
      '</div>';
  }

  function renderInner() {
    // Tant qu'aucun programme n'existe, il n'y a rien a afficher d'autre que le
    // diagnostic : l'ecran de seance n'aurait aucun exercice a montrer.
    if (state.ob) { renderOnboarding(); return; }

    var activeId = document.activeElement ? document.activeElement.id : null;
    // Meme endroit, meme paire capture/restitution que le focus : le mandat
    // demande de poser le defilement LA, pas ailleurs.
    var scrollAvant = scrollCourant();

    var tKey = todayKey();
    // Tant qu'aucune date n'a été choisie à la main, on colle au jour réel :
    // l'appli laissée ouverte toute la nuit basculera d'elle-même au premier
    // rendu, sans écrire sur la veille.
    if (!state.editDatePinned) state.editDate = tKey;
    if (!DATE_RE.test(state.editDate) || state.editDate > tKey) {
      state.editDate = tKey; state.editDatePinned = false;
    }
    var floorKey = fmt(addDays(new Date(), -MAX_BACKDAYS));
    if (state.editDate < floorKey) state.editDate = floorKey;

    var editKey = state.editDate;
    NUTRITION = nutriPlanDuJour(profile, editKey);
    var isToday = editKey === tKey;
    var editDateObj = dateFromKey(editKey);
    var log = state.log;
    var entry = log[editKey] || {};
    var progKey = progKeyFor(editKey, entry);
    var program = progKey ? PROGRAM[progKey] : null;
    // Programme naturel du jour, et signalement d'une séance forcée à la main.
    var naturalDow = dayKey(editDateObj.getDay());
    // On compare le programme RÉELLEMENT affiché au programme naturel du jour.
    // Comparer entry.prog produisait une phrase tautologique — « séance choisie à
    // la main, le mercredi c'est normalement LEGS » alors que LEGS est affiché —
    // dès qu'un prog pointait vers un jour absent du plan, ce que la validation
    // de forme de cleanProg rend désormais possible.
    // Le garde `PROGRAM[naturalDow]` a quitte la CONDITION pour rejoindre la
    // PHRASE : il empechait l'alerte de sortir les jours de repos, c'est-a-dire
    // exactement quand on choisit une seance a la main.
    var overriddenProg = !!(entry.prog && progKey !== naturalDow);
    var accentFond = program ? "var(--accent)" : "var(--vert)";
    var accentTxt = program ? "var(--accent-txt)" : "var(--vert-txt)";
    var entryNutri = entry.nutri || {};

    // --- Statistiques globales ---
    var allKeys = [], k0;
    for (k0 in log) { if (has(log, k0)) allKeys.push(k0); }
    allKeys.sort();
    var firstKey = allKeys.length ? allKeys[0] : null;

    // Le dénominateur de l'assiduité part de la première trace d'ENTRAÎNEMENT,
    // pas de la première entrée quelconque : une pesée faite trois semaines
    // avant la première séance faisait chuter le taux sans raison.
    var firstTrainKey = null, dk;
    for (var ai = 0; ai < allKeys.length; ai++) {
      var ek0 = log[allKeys[ai]];
      if (ek0 && (ek0.done || ek0.sets || ek0.prog)) { firstTrainKey = allKeys[ai]; break; }
    }

    var totalDone = 0, doneWeekdays = 0, totalTonnage = 0, totalKm = 0;
    for (dk in log) {
      if (!has(log, dk)) continue;
      var e0 = log[dk];
      if (e0 && e0.done) {
        totalDone++;
