  // Les machines ne se comptent que si la salle est cochee : sans salle, les
  // treize cases ne sont pas posees et annoncer « 0 machine » serait faux.
  function nbMachines() {
    var i, n = 0;
    if (!state.obEquip[0]) return 0;
    for (i = 0; i < GEAR.length; i++) { if (state.obGear[i]) n++; }
    return n;
  }

  function resumeMateriel() {
    var e = nbMateriel(), m = nbMachines();
    var s = e + (e > 1 ? " catégories" : " catégorie");
    if (state.obEquip[0]) {
      s += " · " + m + (m > 1 ? " machines" : " machine");
    }
    return s;
  }

  /* -------------------------------------------------------------------------
     PROFIL — chaque ligne mene a l'etape qui la definit
     -------------------------------------------------------------------------
     Le numero d'etape voyage AVEC la ligne. Sans lui, « Jour de pesée »
     renverrait au debut du diagnostic et il faudrait traverser huit ecrans
     pour corriger une reponse.
     ------------------------------------------------------------------------- */
  function profilHtml() {
    var p = profilDepuisEtat(), d = deriver(), h = "", i, noms = [];
    for (i = 0; i < d.progJours.length; i++) noms.push(d.progJours[i].nom.slice(0, 3));

    var cours = [], run = [];
    for (i = 0; i < d.slotsCours.length; i++) cours.push(d.slotsCours[i].a.nom || "Cours");
    for (i = 0; i < d.slotsRun.length; i++) run.push(d.slotsRun[i].nom.slice(0, 3));

    // LE SOUS-TITRE MANQUAIT. Il dit a quoi servent ces reponses, donc pourquoi
    // les corriger change quelque chose.
    h += '<p class="ob-lead">Tout ce que le programme et les repères caloriques ' +
         "utilisent pour se calculer.</p>";
    h += groupeHtml("Toi", [
      { t: "Prénom", s: state.obPrenom || "non renseigné", a: "ob-etape", v: "0" },
      { t: "Âge", s: state.obAge ? state.obAge + " ans" : "non renseigné", a: "ob-etape", v: "0" },
      { t: "Taille", s: state.obTaille ? state.obTaille + " cm" : "non renseignée", a: "ob-etape", v: "0" }
    ]);
    h += groupeHtml("Poids", [
      { t: "Poids de départ", s: fmtVal(p.startWeight) + " kg", a: "ob-etape", v: "1" },
      { t: "Poids cible", s: fmtVal(p.targetWeight) + " kg", a: "ob-etape", v: "1" },
      { t: "Jour de pesée", s: JOURS[state.obPeseeJour] + " · " + PESEE_MOMENTS[state.obPeseeMoment].t,
        a: "ob-etape", v: "8" }
    ]);
    // Meme regle que sur l'ecran Moi : la duree d'une seance en salle ne se
    // montre que s'il y a des seances de salle.
    var lignesProfilProg = [
      { t: "Tes jours", s: noms.length ? noms.join(", ") : "aucun", a: "ob-etape", v: "4" },
      { t: "Tes cours collectifs", s: cours.length ? cours.join(", ") : "aucun", a: "ob-etape", v: "4" },
      { t: "Tes sorties running", s: run.length ? run.join(", ") : "aucune", a: "ob-etape", v: "4" }
    ];
    if (deriver().slotsSalle.length) {
      lignesProfilProg.push({ t: "Durée par séance", s: dureeLibelle(), a: "ob-etape", v: "5" });
    }
    h += groupeHtml("Programme", lignesProfilProg);
    h += groupeHtml("Nutrition", [
      { t: "Objectif", s: ["Perdre du gras", "Maintenir", "Prendre du muscle"][state.obObjectif],
        a: "ob-etape", v: "2" },
      { t: "Compléments", s: nbSupps() + " retenus", a: "ob-etape", v: "8" },
      { t: "Habitudes", s: resumeHabitudes(), a: "ob-etape", v: "8" }
    ]);
    // LE GROUPE « MES DONNEES » VIT ICI, PAS DANS MOI. C'est la maquette qui le
    // place sur le Profil, avec le poids du journal, les deux sens de
    // l'echange, et l'avertissement sur le remplacement. Je l'avais reduit a
    // une ligne d'export perdue dans l'ecran Moi.
    var journal = state.hist || [], octets = 0;
    try { octets = JSON.stringify(journal).length; } catch (e) {}
    var taille = octets > 1024 ? Math.round(octets / 1024) + " Ko" : octets + " o";

    h += '<div class="mo-g"><div class="mo-g-t">Mes données</div><div class="mo-g-c">';
    h += '<div class="mo-l mo-l-msg"><span class="mo-n">Ton journal</span>' +
         '<span class="mo-s num">' + journal.length + " séances · " + taille + "</span></div>";
    h += '<button type="button" class="mo-l" data-action="exporter">' +
         '<span class="mo-n">Exporter le journal<span class="mo-fmt">format JSON</span></span>' +
         '<span class="mo-c" aria-hidden="true">›</span></button>';
    h += '<label class="mo-l mo-l-file">' +
         '<span class="mo-n">Importer une sauvegarde<span class="mo-fmt">' +
         "fichier JSON exporté par l'appli</span></span>" +
         '<span class="mo-c" aria-hidden="true">›</span>' +
         '<input type="file" accept="application/json,.json" class="moi-file"' +
         ' data-action="importer" aria-label="Choisir un fichier de journal"></label>';
    if (state.importMsg) {
      h += '<div class="mo-l mo-l-msg"><span class="mo-n">' + esc(state.importMsg) + "</span></div>";
    }
    if (state.dernierExport) {

  /* -------------------------------------------------------------------------
     ACTIONS
     ------------------------------------------------------------------------- */
  // LA PHOTO EST REDUITE, PUIS ENREGISTREE.
  //
  // La premiere version posait l'adresse rendue par createObjectURL, celle de
  // la maquette. Elle ne s'affichait JAMAIS dans le livrable : la maquette n'a
  // pas de politique de securite, le livrable en a une, et elle n'autorise les
  // images qu'en 'self' et en data:. Le navigateur refusait donc de charger
  // l'image, sans rien dire a l'utilisateur, qui voyait le choix de photo se
  // derouler entierement pour rien. Signale par Olivier.
  //
  // On passe donc par data:, deja autorise, et on en profite pour REDUIRE :
  // une photo d'iPhone brute pese 2 a 4 Mo, et son ecriture en texte encore un
  // tiers de plus, alors que le telephone n'accorde a l'appli que 5 Mo pour
  // tout ce qu'elle garde. 320 px de cote suffisent a une pastille de 60 px sur
  // un ecran Retina et tiennent dans quelques dizaines de kilo-octets.
  //
  // On recadre AU CARRE depuis le centre, sinon une photo verticale rentre
  // deformee dans une pastille ronde.
  var PHOTO_COTE = 320;

  // Au-dela, on ne tente meme pas la lecture : FileReader chargerait le fichier
  // entier en memoire, puis sa transcription en texte qui pese un tiers de plus,
  // avant le moindre controle. Un onglet ferme pour memoire epuisee ne se
  // rattrape pas, et 40 Mo laissent passer toutes les photos d'un telephone.
  var PHOTO_POIDS_MAX = 40 * 1024 * 1024;

  function photoChoisir(input) {
    var f = input && input.files && input.files[0];
    if (!f) return;
    if (f.size > PHOTO_POIDS_MAX) {
      poser({ photoMsg: "Cette image est trop lourde pour être utilisée ici." });
      return;
    }
    var lecteur = new window.FileReader();
    lecteur.onload = function () {
      var img = new window.Image();
      img.onload = function () {
        var c, ctx, cote, sx, sy, url;
        try {
          cote = Math.min(img.width, img.height);
          sx = Math.round((img.width - cote) / 2);
          sy = Math.round((img.height - cote) / 2);
          c = document.createElement("canvas");
          c.width = PHOTO_COTE; c.height = PHOTO_COTE;
          ctx = c.getContext("2d");
          // Le JPEG ne connait pas la transparence : sans ce fond, une image
          // detouree ressortirait sur du NOIR, ce qui est la couleur d'un canvas
          // vierge une fois aplati.
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, PHOTO_COTE, PHOTO_COTE);
          ctx.drawImage(img, sx, sy, cote, cote, 0, 0, PHOTO_COTE, PHOTO_COTE);
          url = c.toDataURL("image/jpeg", 0.82);
          // Une surface de canvas trop grande pour iOS rend une image vide sans
          // lever d'erreur : on refuse ce qui ne ressemble pas a une photo
          // plutot que d'enregistrer un rectangle blanc.
          if (!photoValide(url)) {
            poser({ photoMsg: "Cette image n'a pas pu être réduite." });
            return;
          }
        } catch (e) {
          // Un fichier illisible ne doit pas laisser l'ecran muet : on le dit
          // la ou l'import de journal dit deja ses erreurs.
          poser({ photoMsg: "Cette image n'a pas pu être lue." });
          return;
        }
        poser({ photo: url, photoMsg: "" });
      };
      img.onerror = function () {
        poser({ photoMsg: "Ce fichier n'est pas une image." });
      };
      img.src = lecteur.result;
    };
    lecteur.onerror = function () {
      poser({ photoMsg: "Lecture du fichier impossible." });
    };
    lecteur.readAsDataURL(f);
  }

  function photoRetirer() {
    // On efface AUSSI le message : sinon un « ce fichier n'est pas une image »
    // reste affiche sous une carte qui n'a plus de photo, sans plus rien
    // designer.
    poser({ photo: null, photoMsg: "" });
  }

  function exporterJournal() {
    var o = {}, i, k, b, url, a;
    for (i = 0; i < CLES_SAUVEES.length; i++) { k = CLES_SAUVEES[i]; o[k] = state[k]; }
    o._version = APP_VERSION;
    o._export = cleDate(new Date());
    try {
      b = new window.Blob([JSON.stringify(o, null, 1)], { type: "application/json" });
      url = window.URL.createObjectURL(b);
      a = document.createElement("a");
      a.href = url;
      a.download = "lemmonfit-" + cleDate(new Date()) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(function () { try { window.URL.revokeObjectURL(url); } catch (e) {} }, 1000);
      // LA DATE DU DERNIER EXPORT MANQUAIT. C'est la seule facon de savoir si
      // sa sauvegarde date d'hier ou de trois mois, et donc ce qu'on perdrait.
      poser({ dernierExport: cleDate(new Date()) });
    } catch (e) {}
  }

  // L'IMPORT PASSE PAR LA MEME PORTE QUE LA LECTURE DU STOCKAGE : seules les
  // cles connues sont reinjectees, les autres ignorees. Un fichier exporte par
  // une version future ne peut donc pas imposer un champ que ce code ne sait
  // pas traiter, et un fichier bricole a la main ne peut pas injecter n'importe
  // quoi dans l'etat.
  //
  // IL REMPLACE, IL NE FUSIONNE PAS. Fusionner deux journaux demanderait de
  // trancher les conflits date par date, sans que personne puisse verifier le
  // resultat. On le dit dans le libelle.
  function importerJournal(input) {
    var f = input && input.files && input.files[0];
    if (!f) return;
    var lecteur = new window.FileReader();
    lecteur.onload = function () {
      var o, i, k, repris = 0, maj = {};
      try { o = JSON.parse(String(lecteur.result)); }
      catch (e) { poser({ importMsg: "Fichier illisible : ce n'est pas du JSON." }); return; }
      if (!o || typeof o !== "object") {
        poser({ importMsg: "Fichier illisible." }); return;
      }
      for (i = 0; i < CLES_SAUVEES.length; i++) {
        k = CLES_SAUVEES[i];
        if (has(o, k)) { maj[k] = o[k]; repris++; }
      }
      if (!repris) { poser({ importMsg: "Aucune donnée reconnue dans ce fichier." }); return; }
      maj.importMsg = "Importé : " + repris + " réglages, " +
                      ((o.hist && o.hist.length) || 0) + " séances.";
      poser(maj);
      state.actFaits = faitsSemaine();
      rendre();
    };
    lecteur.onerror = function () { poser({ importMsg: "Lecture du fichier impossible." }); };
    lecteur.readAsText(f);
  }

  // Vide les caches du service worker puis recharge. C'est la seule sortie
  // pour qui a l'appli en ecran d'accueil : sans ca, iOS resert sa copie.
  function rechargerMaj() {
    var fini = function () {
      window.location.href = window.location.pathname + "?v=" + jourNumero() + "-" + (state.hist || []).length;
    };
    try {
      if (window.caches && window.caches.keys) {
        window.caches.keys().then(function (ks) {
          var i, p = [];
          for (i = 0; i < ks.length; i++) p.push(window.caches.delete(ks[i]));
          return window.Promise.all(p);
        }).then(fini)["catch"](fini);
        return;
      }
    } catch (e) {}
    fini();
  }

  function resetConfirmer() {
    try { window.localStorage.removeItem(CLE); } catch (e) {}
    window.location.reload();
  }

  function exoRetirer(si, nom) {
    var S = SEANCES[si], i, cle = null, maj = {}, k;
    for (i = 0; i < S.exos.length; i++) { if (S.exos[i].nom === nom) cle = S.code + "-" + i; }
    if (!cle) return;
    for (k in state.obRetires) { if (has(state.obRetires, k)) maj[k] = state.obRetires[k]; }
    maj[cle] = 1;
    // Retirer annule un ajout precedent : sinon les deux drapeaux se
    // contrediraient et `obRetires`, prioritaire, gagnerait sans qu'on
    // comprenne pourquoi le bouton Ajouter ne fait plus rien.
    var aj = {}, k2;
    for (k2 in state.obAjouts) { if (has(state.obAjouts, k2) && k2 !== cle) aj[k2] = state.obAjouts[k2]; }
    poser({ obRetires: maj, obAjouts: aj });
  }

  function exoAjouter(cle) {
    var maj = {}, k, ret = {}, k2;
    for (k in state.obAjouts) { if (has(state.obAjouts, k)) maj[k] = state.obAjouts[k]; }
    maj[cle] = 1;
    for (k2 in state.obRetires) { if (has(state.obRetires, k2) && k2 !== cle) ret[k2] = state.obRetires[k2]; }
    poser({ obAjouts: maj, obRetires: ret });
  }

  /* =========================================================================
     ASSISTANT IA ET NUTRITION
     ========================================================================= */

  /* -------------------------------------------------------------------------
     LES DEUX PROMPTS
     -------------------------------------------------------------------------
     LEUR STRUCTURE EST RECOPIEE DU PROTOTYPE, LEUR CONTENU NON, ET C'EST
     DELIBERE. Les deux fonctions du prototype sont ecrites EN DUR : un homme de
     38 ans, 78,4 kg pour 1,78 m, un developpe couche a 37,5 kg, 2 340 kcal,
     « pas de porc ». Seuls le nombre de jours et la duree y varient.

     La spec demande deux choses incompatibles : « recopie ces deux fonctions
     verbatim » et « composent le prompt depuis les charges reelles des 4
     dernieres semaines, le materiel, le poids, l'objectif ». On ne peut pas
     satisfaire les deux. Recopier verbatim enverrait a l'IA le corps de
     quelqu'un d'autre, et le modele repondrait pour une personne qui n'existe
     pas — sur un ecran dont TOUT l'interet est que la reponse soit personnelle.

     On garde donc les intitules de section mot pour mot, et on les alimente
     avec l'etat et le journal.
     ------------------------------------------------------------------------- */

  // Les charges reellement soulevees sur les 4 dernieres semaines, par
  // exercice : premiere valeur, derniere valeur, et le signalement d'une
  // stagnation. C'est CE bloc qui rend la question utile.
  // =========================================================================
  // LE NOM AFFICHE ET L'IDENTIFIANT DU MOTEUR
  // -------------------------------------------------------------------------
  // LE DEFAUT QUE CE BLOC CORRIGE. Le prompt listait les exercices par leur nom
  // affiche (« Développé couché barre »), et le validateur du moteur, lui,
  // compare des IDENTIFIANTS de catalogue (« developpe-couche-barre »). Une IA
  // qui repond en recopiant ce qu'elle a lu se faisait donc ecarter a tous les
  // coups, avec « n'est pas un exercice chargé de mon programme ».
  //
  // Verifie en collant les deux formes : le nom est refuse, l'identifiant est
  // reconnu. Le prompt donne donc maintenant LES DEUX, et demande l'identifiant
  // en retour.
  var _idsParNom = null;

  function idMoteurDe(nom) {
    var k, e;
    if (!_idsParNom) {
      _idsParNom = {};
      try {
        for (k in MOTEUR.CAT_BY_ID) {
          if (!has(MOTEUR.CAT_BY_ID, k)) continue;
          e = MOTEUR.CAT_BY_ID[k];
          if (e && e.name) _idsParNom[e.name] = k;
        }
      } catch (err) {}
    }
    return has(_idsParNom, nom) ? _idsParNom[nom] : null;
  }

  // L'identifiant SEULEMENT si le validateur l'acceptera, c'est-a-dire si
  // l'exercice est dans le plan que le moteur a construit.
  //
  // Le journal et le plan ne disent pas la meme chose : le journal garde ce qui
  // a ete fait, y compris des mouvements qui ne sont plus au programme. Mesure
  // faite : le prompt annoncait « Développé militaire barre
  // [developpe-militaire-barre] » et le validateur repondait « n'est pas un
  // exercice chargé de mon programme » sur ce meme identifiant. L'ecran
  // invitait donc a une proposition qu'il allait refuser.
  function idProposableDe(nom) {
    var id = idMoteurDe(nom);
    if (!id) return null;
    try {
      return MOTEUR.planExercices(id).length ? id : null;
    } catch (e) { return null; }
  }

  function chargesRecentes() {
    var h = histTrie(), i, j, k, par = {}, ordre = [], auj = new Date(), d, e;
    auj.setHours(0, 0, 0, 0);

    for (i = h.length - 1; i >= 0; i--) {
      if (h[i].t !== "salle" || !h[i].ex) continue;
      d = dateDepuisCle(h[i].d);
      if (!d || jourEcart(auj, d) > 28) continue;
      for (j = 0; j < h[i].ex.length; j++) {
        e = h[i].ex[j];
        if (e.unite === "min" || !e.sets.length) continue;
        var meilleure = 0;
        for (k = 0; k < e.sets.length; k++) { if (e.sets[k].kg > meilleure) meilleure = e.sets[k].kg; }
        if (!par[e.nom]) { par[e.nom] = { prem: meilleure, der: meilleure, n: 0, reps: e.sets[0].reps, series: e.sets.length, stagne: 0 }; ordre.push(e.nom); }
        else {
          if (meilleure === par[e.nom].der) par[e.nom].stagne++;
          else par[e.nom].stagne = 0;
          par[e.nom].der = meilleure;
          par[e.nom].series = e.sets.length;
          par[e.nom].reps = e.sets[0].reps;
        }
        par[e.nom].n++;
      }
    }
    return { par: par, ordre: ordre };
  }

  function materielTexte() {
    var out = [], i;
    for (i = 0; i < EQUIP.length; i++) { if (state.obEquip[i]) out.push(EQUIP[i].t); }
    // Les machines ne se comptent QUE si la salle est cochee. Sans salle, les
    // treize cases ne sont jamais posees, et annoncer « PAS de : machine a
    // mollets » a quelqu'un qui s'entraine chez lui parle d'un materiel dont il
    // n'a jamais ete question. Meme garde que dans l'ecran Moi et dans le
    // profil envoye au moteur.
    var absentes = [];
    if (state.obEquip[0]) {
      for (i = 0; i < GEAR.length; i++) { if (!state.obGear[i]) absentes.push(GEAR[i].t); }
    }
    var l = [];
    l.push(out.length ? out.join(", ") + "." : "Poids du corps uniquement.");
    // CE QUI MANQUE COMPTE PLUS QUE CE QUI EST LA. Sans cette ligne, un modele
    // propose un developpe epaules a la machine a quelqu'un qui n'en a pas, et
    // la reponse entiere devient inapplicable.
    if (absentes.length) l.push("PAS de : " + absentes.join(", ") + ".");
    l.push("Haltères jusqu'à " + state.obHalt + " kg.");
    return l;
  }

  function promptProgramme(nJours, duree) {
    var p = profilDepuisEtat(), c = chargesRecentes(), i, nom, x, L = [];
    // Le plan doit exister AVANT qu'on demande a idProposableDe si un exercice
    // en fait partie. C'est le meme pont que la lecture de la reponse ; le
    // poser deux fois est sans effet, cleanProfile et buildPlan sont purs.
    try { MOTEUR.__poserProfil(p); } catch (e) {}
    var obj = ["perte de gras", "maintien", "prise de muscle"][state.obObjectif] || "perte de gras";
    var d = deriver(), tonnage = 0, hj = histDepuis(28);

    for (i = 0; i < hj.length; i++) { if (hj[i].t === "salle") tonnage += hj[i].tonnage || 0; }

    L.push("Tu es préparateur physique. Je suis en " + obj + ", " +
           fmtVal(p.startWeight) + " kg pour" );
    L.push((state.obTaille ? state.obTaille + " cm" : "taille non précisée") +
           (state.obAge ? ", " + state.obAge + " ans" : "") + ", " +
           nJours + " séance" + (nJours > 1 ? "s" : "") + " par semaine en salle, " +
           duree + " par séance.");
    L.push("");

    L.push("== CE QUE J'AI FAIT SUR 4 SEMAINES ==");
    if (!c.ordre.length) {
      L.push("Aucune séance enregistrée pour l'instant : je démarre.");
    } else {
      for (i = 0; i < c.ordre.length; i++) {
        nom = c.ordre[i];
        x = c.par[nom];
        var idm = idProposableDe(nom);
        // L'identifiant entre crochets, a cote du nom. C'est LUI que le
        // validateur reconnait, et le donner ici est la seule facon d'obtenir
        // une reponse exploitable.
        //
        // ⚠️ SEULS LES EXERCICES DU PLAN EN RECOIVENT UN. Le journal garde des
        // mouvements qui ne sont plus au programme ; leur donner un identifiant
        // reviendrait a inviter l'IA a proposer un changement que le validateur
        // ecarterait ensuite. Ils restent listes, parce qu'ils racontent ce qui
        // a ete fait, mais sans identifiant on ne peut pas les viser.
        L.push(nom + (idm ? " [" + idm + "]" : "") + " : " +
               (x.prem === x.der ? fmtVal(x.der) + " kg"
                : fmtVal(x.prem) + " → " + fmtVal(x.der) + " kg") +
               ", " + x.series + "×" + x.reps +
               (x.stagne >= 2 ? " (bloqué depuis " + (x.stagne + 1) + " séances)" : ""));
      }
      L.push("Volume sur 4 semaines : " + fmtVal(Math.round(tonnage / 100) / 10) + " t.");
    }
    L.push("");

    L.push("== MON MATÉRIEL ==");
    L = L.concat(materielTexte());
    L.push("");

    L.push("== CE QUE JE VEUX SAVOIR ==");
    L.push("1. Mon programme est-il suffisant, ou trop simple pour mon niveau ?");
    L.push("   Est-il assez progressif, ou est-ce que je piétine ?");
    L.push("2. Qu'est-ce qui explique mes stagnations ?");
    L.push("3. Quoi changer sur les 4 prochaines semaines ?");
    L.push("");
    // LE FORMAT DE REPONSE EST IMPOSE PARCE QU'UN VALIDATEUR LE RELIT. Ce n'est
    // pas une preference de mise en forme : ce qui ne suit pas cette grammaire
    // est ecarte a la lecture, et l'utilisateur voit pourquoi.
    L.push("Une ligne par changement, séparateur barre verticale :");
    L.push("CHARGE | identifiant | kg | raison courte");
    L.push("VOLUME | identifiant | +1 ou -1 série | raison courte");
    L.push("REPOS | identifiant | secondes | raison courte");
    // SANS CETTE PHRASE, LES REPONSES SONT INEXPLOITABLES. Le validateur
    // compare des identifiants ; un modele qui recopie le nom se fait ecarter.
    L.push("L'identifiant est celui entre crochets ci-dessus, recopié à l'identique.");
    L.push("N'invente pas d'exercice absent de mon matériel.");
    return L.join("\n");
  }

  function promptNutrition(nJours) {
    var p = profilDepuisEtat(), t = ciblesNutrition(), i, s, L = [];
    var obj = ["perte de gras", "maintien", "prise de muscle"][state.obObjectif] || "perte de gras";
    var prot = 0, kcal = 0;

    // CE QUE LES COMPLEMENTS APPORTENT DEJA doit sortir de la cible demandee :
    // sans ca, le plan les compterait une seconde fois et l'utilisateur
    // mangerait au-dessus de sa cible en croyant la suivre.
    //
    // MAIS LA TABLE DE LA v1.21.0 NE PORTE PAS LES MACROS TOUTES FAITES. Celle
    // du prototype avait `prot: 24, kcal: 114` ecrits dans la ligne ; celle-ci
    // pose `alim` et calcule depuis une table d'aliments qui n'est pas exposee
    // par la facade du moteur. Lire `s.prot` y rend donc undefined.
    //
    // ON NE COMBLE PAS PAR UN ZERO. Annoncer « je ne prends aucun complement »
    // a quelqu'un qui en prend deux ferait composer un plan qui les ignore,
    // donc un plan faux. Tant que le calcul n'est pas branche, on NOMME les
    // complements retenus et on laisse le dieteticien en tenir compte.
    var noms = [];
    for (i = 0; i < MOTEUR.SUPPS.length; i++) {
      if (!state.obSupps[i]) continue;
      s = MOTEUR.SUPPS[i];
      noms.push(s.label);
      if (typeof s.prot === "number") prot += s.prot;
      if (typeof s.kcal === "number") kcal += s.kcal;
    }

    L.push("Tu es diététicien. Écris-moi le plan alimentaire d'UNE journée,");
    L.push("en français, pour " + (p.sex === "f" ? "une femme" : "un homme") +
           (state.obAge ? " de " + state.obAge + " ans" : "") + ", " +
           fmtVal(p.startWeight) + " kg" +
           (state.obTaille ? ", " + state.obTaille + " cm" : "") + ", en " + obj);
    L.push("avec " + nJours + " séance" + (nJours > 1 ? "s" : "") + " par semaine.");
    L.push("");

    L.push("== MES CIBLES, CALCULÉES PAR L'APPLI ==");
    L.push(t.kcal + " kcal et " + t.prot + " g de protéines pour la journée entière.");
    if (prot || kcal) {
      L.push("Mes compléments en apportent déjà " + prot + " g et " + kcal + " kcal, et l'appli");
      L.push("les ajoutera elle-même : tes lignes doivent donc totaliser");
      L.push("environ " + (t.kcal - kcal) + " kcal et " + (t.prot - prot) + " g.");
    } else if (noms.length) {
      L.push("Je prends déjà : " + noms.join(", ") + ".");
      L.push("Tiens-en compte dans le total, l'appli les ajoute de son côté.");
    } else {
      L.push("Je ne prends aucun complément : tes lignes doivent couvrir la cible entière.");
    }
    L.push("");

    L.push("== CONTRAINTES ==");
    var prises = [];
    if (state.obPetitDej) prises.push("petit-déjeuner");
    prises.push("déjeuner");
    if (state.obCollation) prises.push("collation");
    prises.push("dîner");
    L.push(prises.length + " prises : " + prises.join(", ") + ".");
    L.push(state.obCuisine ? "Je cuisine, mais simple : moins de 20 min par repas."
                           : "Je cuisine peu : privilégie ce qui se prépare sans cuisson.");
    // L'ALCOOL COMPTE MAINTENANT. La question etait posee au diagnostic depuis
    // toujours dans les defauts, mais sa reponse n'etait lue nulle part. Elle
    // est transmise ici : c'est une source de calories liquides qui change ce
    // qu'un dieteticien propose.
    if (state.obAlcool === 0) {
      L.push("Je ne bois pas d'alcool.");
    } else if (state.obAlcool === 2) {
      L.push("Je bois de l'alcool souvent : tiens compte de ces calories liquides.");
    } else {
      L.push("Je bois de l'alcool de temps en temps.");
    }
    L.push("");
    L.push("Une ligne par prise, exactement dans cette forme, séparateur");
    L.push("barre verticale :");
    L.push("repas | clé | ce que je mange, avec les quantités | protéines g | kcal");
    return L.join("\n");
  }

  /* -------------------------------------------------------------------------
     L'ECRAN ASSISTANT
     ------------------------------------------------------------------------- */

         (onglet === 0 ? "Ta question sur le programme" : "Ta question sur les repas") + "</div>";
    h += '<p class="ob-lead">L\'appli a écrit la question à partir de tes données. ' +
         "Copie-la, colle-la dans ton assistant, puis reviens coller sa réponse.</p>";

      ' aria-pressed="' + (actif === i ? "true" : "false") + '"' +
      ' data-action="ia-onglet" data-v="' + i + '">' +
      '<span class="ia-ong-t">' + esc(t) + "</span>" +
      '<span class="ia-ong-s">' + esc(s) + "</span></button>";
  }

  /* -------------------------------------------------------------------------
     LA ZONE DE COLLAGE — ET LE VALIDATEUR
     -------------------------------------------------------------------------
     LA SPEC NE MENTIONNE QUE « une zone ou coller la reponse ». Ce serait un
     tuyau : l'appli ecrirait dans le programme ce qu'un modele a dit, sans
     rien verifier. Or c'est exactement ce que l'architecture de la v1.21.0
     interdit — le mandat vit dans le VALIDATEUR, jamais dans le prompt, parce
     qu'un prompt se contourne.

     Le collage passe donc par iaLire(), greffe avec le moteur. Il revalide
     chaque ligne contre le plan et le materiel declares, borne chaque
     proposition a plus ou moins 20 % et plafonne les hausses par salve.
     ET LES REJETS SONT MONTRES : les avaler laisserait croire que l'IA n'a
     rien propose, alors qu'elle a propose quelque chose d'irrecevable.
     ------------------------------------------------------------------------- */
  function iaCollerHtml() {
    var h = '<div class="carte-t" style="margin-top:20px">Colle la réponse ici</div>';
    h += '<textarea class="ia-zone" rows="5" placeholder="Colle la réponse de ton assistant…"' +
         ' data-action="ia-coller">' + esc(state.iaTexte || "") + "</textarea>";
    h += '<button type="button" class="cs-cta cs-cta-clair" data-action="ia-lire">' +
         "Lire la réponse</button>";

    if (!state.iaRes) return h;

    var r = state.iaRes, i;
    h += '<div class="ia-res">';
    if (r.rien) {
      h += '<p class="cr-p">Ton assistant ne propose aucun changement.</p>';
    }
    if (r.props && r.props.length) {
      // CHAQUE CHANGEMENT SE DECIDE SEPAREMENT, comme dans la maquette.
      // Avant, la liste etait en lecture seule et l'ecran disait lui-meme que
      // rien n'avait ete applique : on pouvait lire l'avis de son assistant,
      // pas s'en servir.
      h += '<div class="carte-t">' + r.props.length + " changement" +
           (r.props.length > 1 ? "s" : "") + " retenu" +
           (r.props.length > 1 ? "s" : "") + "</div>";
      h += '<div class="ia-props">';
      for (i = 0; i < r.props.length; i++) {
        h += '<div class="ia-prop">' +
             '<div class="ia-prop-t">' + esc(r.props[i].texte || r.props[i].ex || "") + "</div>" +
             (r.props[i].raison ? '<div class="ia-prop-r">' + esc(r.props[i].raison) + "</div>" : "") +
             '<div class="ia-prop-b">' +
             '<button type="button" class="ia-appl" data-action="ia-appliquer" data-i="' + i + '">' +
             "Appliquer</button>" +
             '<button type="button" class="ia-ign" data-action="ia-ignorer" data-i="' + i + '">' +
             "Ignorer</button></div></div>";
      }
      h += "</div>";
    }
    if (r.faits && r.faits.length) {
      h += '<div class="carte-t">Appliqué · ' + r.faits.length + "</div><ul class=\"ia-rejets\">";
      for (i = 0; i < r.faits.length; i++) h += "<li>" + esc(r.faits[i]) + "</li>";
      h += "</ul>";
    }
    if (r.rejets && r.rejets.length) {
      h += '<div class="carte-t" style="color:var(--cours-encre)">Écarté · ' + r.rejets.length + "</div>";
      h += '<ul class="ia-rejets">';
      for (i = 0; i < r.rejets.length; i++) h += "<li>" + esc(r.rejets[i]) + "</li>";
      h += "</ul>";
      h += '<p class="moi-note">Ces lignes n\'ont pas été appliquées. L\'appli ne recopie ' +
           "pas une réponse sans la relire.</p>";
    }
    if (!r.rien && (!r.props || !r.props.length) && (!r.rejets || !r.rejets.length)) {
      h += '<p class="cr-p">Rien d\'exploitable dans ce texte.</p>';
    }
    return h + "</div>";
  }

  // LE MOTEUR NE CONNAIT PAS TES CHARGES, IL FAUT LES LUI DONNER.
  //
  // Deuxieme defaut corrige ici. Meme avec le bon identifiant, iaLire refusait
  // avec « Pas de charge de référence : proposition non vérifiable ». Sa regle
  // iaChargeRef cherche soit une cible posee sur l'exercice du plan, soit une
  // serie dans SON propre historique — et le moteur greffe n'a ni l'une ni
  // l'autre : le pont ne lui transmettait que le profil.
  //
  // On lui pose donc la charge la plus recente du JOURNAL comme cible, par sa
  // PROPRE fonction d'ecriture. Pas de pont supplementaire, pas de champ ecrit
  // a la main : `kgCible` veut precisement dire « la charge que l'utilisateur a
  // trouvee », et c'est ce que le journal dit.
  function poserChargesDansLeMoteur() {
    var c = chargesRecentes(), i, nom, id, n = 0;
    for (i = 0; i < c.ordre.length; i++) {
      nom = c.ordre[i];
      id = idMoteurDe(nom);
      if (!id || !c.par[nom].der) continue;
      try {
        if (MOTEUR.appliquerProposition({ type: "charge", ex: id, kg: c.par[nom].der }, true)) n++;
      } catch (e) {}
    }
    return n;
  }

  // =========================================================================
  // APPLIQUER OU IGNORER UN CHANGEMENT
  // -------------------------------------------------------------------------
  // Un changement accepte est ecrit A DEUX ENDROITS, et il faut les deux :
  //   - `state.iaPlan`, cote refonte, PERSISTE. C'est lui qui fait que la
  //     seance de demain propose la nouvelle charge. Le plan du moteur, lui,
  //     ne survit pas a un rechargement.
  //   - le plan du moteur, par sa propre fonction appliquerProposition, pour
  //     que la PROCHAINE lecture d'une reponse se valide contre l'etat a jour
  //     et non contre l'ancien.
  // =========================================================================
  function nomAfficheDe(id) {
    try {
      var e = has(MOTEUR.CAT_BY_ID, id) ? MOTEUR.CAT_BY_ID[id] : null;
      return e && e.name ? e.name : null;
    } catch (err) { return null; }
  }

  // L'exercice tel que la refonte le prescrit aujourd'hui. Sert au VOLUME, qui
  // est un delta : « une serie de moins » a besoin de savoir combien il y en a.
  function exoRefonteParNom(nom) {
    var i, j;
    for (i = 0; i < SEANCES.length; i++) {
      for (j = 0; j < SEANCES[i].exos.length; j++) {
        if (SEANCES[i].exos[j].nom === nom) return SEANCES[i].exos[j];
      }
    }
    return null;
  }

  function iaAppliquer(idx) {
    var r = state.iaRes, p, nom, plan = {}, k, m, base, faits;
    if (!r || !r.props || !r.props[idx]) return;
    p = r.props[idx];
    nom = nomAfficheDe(p.ex);
    if (!nom) return;

    // Copie du plan existant : on n'ecrase pas les changements deja acceptes
    // sur d'autres exercices.
    for (k in (state.iaPlan || {})) {
      if (has(state.iaPlan, k)) plan[k] = state.iaPlan[k];
    }
    m = {};
    for (k in (plan[nom] || {})) { if (has(plan[nom], k)) m[k] = plan[nom][k]; }

    if (p.type === "charge") {
      m.kg = p.kg;
    } else if (p.type === "volume") {
      base = m.n || (exoRefonteParNom(nom) ? exoRefonteParNom(nom).n : 3);
      // Bornes assumees : au moins une serie, au plus six. Un delta repete ne
      // doit pas pouvoir vider ou gonfler une seance sans limite.
      m.n = Math.max(1, Math.min(6, base + p.delta));
    } else if (p.type === "repos") {
      m.repos = p.rest;
    } else if (p.type === "remplacer") {
      var neuf = has(MOTEUR.CAT_BY_ID, p.par) ? MOTEUR.CAT_BY_ID[p.par] : null;
      if (!neuf) return;
      m.remp = { nom: neuf.name, mat: neuf.mat || "", lines: neuf.lines || [] };
    } else {
      return;
    }
    plan[nom] = m;

    // Le moteur, pour que la prochaine lecture se valide contre l'etat a jour.
    try { MOTEUR.appliquerProposition(p, true); } catch (e) {}

    faits = (r.faits || []).slice();
    faits.push(p.texte || nom);
    poser({ iaPlan: plan,
            iaRes: { props: sansIndice(r.props, idx), rejets: r.rejets,
                     rien: r.rien, faits: faits } });
  }

  function iaIgnorer(idx) {
    var r = state.iaRes;
    if (!r || !r.props || !r.props[idx]) return;
    poser({ iaRes: { props: sansIndice(r.props, idx), rejets: r.rejets,
                     rien: r.rien, faits: r.faits || [] } });
  }

  function sansIndice(liste, idx) {
    var out = [], i;
    for (i = 0; i < liste.length; i++) { if (i !== idx) out.push(liste[i]); }
    return out;
  }

  function iaLireReponse() {
    var p = profilDepuisEtat(), res;
    // Le moteur a besoin d'un profil ACTIF pour valider contre le plan. Sans ce
    // pont, iaLire rejette tout avec « aucun programme actif ».
    try { MOTEUR.__poserProfil(p); } catch (e) {}
    poserChargesDansLeMoteur();
    try { res = MOTEUR.iaLire(state.iaTexte || ""); }
    catch (e) { res = { props: [], rejets: ["La lecture a échoué : " + e.message], rien: false }; }
    poser({ iaRes: res });
  }

  function iaCopier() {
    var n = document.getElementById("ia-prompt"), t = n ? n.textContent : "";
    try {
      if (window.navigator && window.navigator.clipboard) {
        window.navigator.clipboard.writeText(t);
      } else {
        // Repli pour les navigateurs sans presse-papier moderne, dont Safari
        // hors contexte securise.
        var ta = document.createElement("textarea");
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      poser({ iaCopie: true });
    } catch (e) {}
  }

  /* -------------------------------------------------------------------------
     NUTRITION — EN CHANTIER
     -------------------------------------------------------------------------
     ON LIVRE EXACTEMENT CE QUE MONTRE LA MAQUETTE, ET RIEN DE PLUS. Aucun
     suivi alimentaire, aucune base d'aliments, aucune jauge de progression :
     une jauge qui se remplit quand on coche un repas mesurerait des coches,
     pas des calories, et l'utilisateur croirait suivre sa cible.
     ------------------------------------------------------------------------- */
  function nutriHtml() {
    var d = deriver(), auj = jourIndexAujourdhui(), i, jr = null, acts = [];
    for (i = 0; i < d.progJours.length; i++) { if (d.progJours[i].ji === auj) jr = d.progJours[i]; }
    if (jr) { for (i = 0; i < jr.acts.length; i++) acts.push(DISC[jr.acts[i].t].t); }

    var p = profilDepuisEtat(), t = ciblesNutrition(), h = "";

    // LE SOUS-TITRE DIT POURQUOI LES CHIFFRES SONT CEUX-LA AUJOURD'HUI. Ma
    // version se contentait de nommer l'activite ; celle de la maquette relie
    // l'activite aux reperes, ce qui est toute la raison d'etre de l'ecran.
    var nomsActs = [], jr2 = null, k2;
    for (k2 = 0; k2 < d.progJours.length; k2++) { if (d.progJours[k2].ji === auj) jr2 = d.progJours[k2]; }
    if (jr2) {
      for (k2 = 0; k2 < jr2.acts.length; k2++) {
        var aa = jr2.acts[k2];
        nomsActs.push(aa.t === "salle" ? SEANCES[aa.si].code
          : (aa.t === "cours" ? (aa.nom || "Cours") : "Running"));
      }
    }
    h += '<div class="nu-date">' + esc(dateLongue(new Date())) + "</div>";
    h += '<p class="nu-tete">' + (nomsActs.length
      ? "Jour d'entraînement — " + esc(nomsActs.join(" et ")) +
        ". Tes repères montent avec le volume."
      : "Jour de repos. Tes repères tiennent compte de ta semaine, pas de la journée.") + "</p>";

    // LES CIBLES EN LIGNES, CHACUNE AVEC SA JUSTIFICATION. En deux vignettes
    // cote a cote, elles n'avaient la place de rien expliquer — et un chiffre
    // sans sa raison ne se verifie pas.
    var parKilo = Math.round((t.prot / (p.startWeight || 1)) * 10) / 10;
    h += '<section class="carte-sombre"><div class="cs-code">Tes cibles du jour</div>';
    h += '<div class="cs-sur">Ce que tu as réellement mangé n\'est pas encore suivi.</div>';
    h += '<div class="nu-l"><span class="nu-l-t">Protéines</span>' +
         '<span class="nu-l-v num">' + t.prot + " g</span></div>";
    h += '<div class="nu-l-s">environ ' + esc(fmtVal(parKilo)) + " g par kilo de poids de corps</div>";
    h += '<div class="nu-l"><span class="nu-l-t">Calories</span>' +
         '<span class="nu-l-v num">' + t.kcal + " kcal</span></div>";
    h += '<div class="nu-l-s">' + (t.deficit > 0
      ? "soit " + t.deficit + " kcal sous ton maintien estimé"
      : (t.deficit < 0 ? "soit " + Math.abs(t.deficit) + " kcal au-dessus de ton maintien estimé"
                       : "au niveau de ton maintien estimé")) + "</div></section>";

    // LES TROIS VIGNETTES manquaient : elles montrent d'ou sort la cible, en
    // posant le maintien et l'ecart a cote d'elle.
    h += '<div class="vign">' +
         '<div class="vg"><span class="vg-n num">' + t.maintain + '</span>' +
         '<span class="vg-l">maintien estimé kcal/j</span></div>' +
         '<div class="vg"><span class="vg-n num">' + t.kcal + '</span>' +
         '<span class="vg-l">cible pour avancer</span></div>' +
         '<div class="vg"><span class="vg-n num">' +
         (t.deficit > 0 ? "− " + t.deficit : (t.deficit < 0 ? "+ " + Math.abs(t.deficit) : "0")) +
         '</span><span class="vg-l">' + (t.deficit >= 0 ? "déficit" : "surplus") +
         ' kcal/j</span></div></div>';

    h += '<section class="nu-chantier">';
    h += '<div class="nu-ch-tete"><span class="nu-badge">EN CHANTIER</span></div>';
    h += '<div class="carte-t">Les prises</div>';
    // TEXTE COMPLET DE LA MAQUETTE. J'en avais garde la premiere moitie : elle
    // dit que rien n'est mesure, mais pas que les repas affiches SONT un
    // exemple. Sans cette seconde moitie, on les prend pour un plan.
    h += '<p class="cr-p">Cocher un repas ne mesure rien : l\'appli n\'a pas de base ' +
         "d'aliments derrière. Cette partie attend une vraie référence " +
         "nutritionnelle — d'ici là, les repas ci-dessous sont un exemple, pas un suivi.</p>";
    h += '<ul class="nu-repas">';
    for (i = 0; i < REPAS.length; i++) {
      h += '<li class="nu-r"><span class="nu-box" aria-hidden="true"></span>' +
           '<span class="nu-r-t">' + esc(REPAS[i].t || REPAS[i].nom || "") + "</span>" +
           (REPAS[i].h ? '<span class="nu-r-h num">' + esc(REPAS[i].h) + "</span>" : "") + "</li>";

    h += '<div class="carte-t">Tes compléments</div>';

    // MISE EN PAGE PROPRE AU COMPLEMENT, PAS CELLE DES LIGNES DE REGLAGE.
    //
    // Je reutilisais `.mo-l`, dont la valeur de droite est en `flex: 0 0 auto`
    // parce qu'elle porte normalement un chiffre court. Ici elle portait le
    // texte long du complement : il refusait de retrecir et passait PAR-DESSUS
    // le libelle. Vu par Olivier a l'ecran.
    //
    // Le libelle et sa raison sont donc empiles, chacun sur sa ligne.
    h += '<ul class="nu-supps">';
    for (i = 0; i < MOTEUR.SUPPS.length; i++) {
      if (!state.obSupps[i]) continue;
      pris++;
      h += '<li class="nu-supp"><span class="nu-supp-n">' + esc(MOTEUR.SUPPS[i].label) + "</span>" +
           '<span class="nu-supp-w">' + esc(MOTEUR.SUPPS[i].why) + "</span></li>";
    }
    h += "</ul>";
    // L'ETAT VIDE MANQUAIT SA MOITIE UTILE : il constatait l'absence sans dire
    // ou la corriger. Celui de la maquette nomme l'etape a rouvrir.
    if (!pris) {
      h += '<p class="cr-p">Tu n\'as retenu aucun complément au diagnostic. ' +
           "Rien n'est ajouté à ton plan — reviens sur l'étape Habitudes si tu " +
           "changes d'avis.</p>";
    }

    // L'HORIZON MANQUAIT, et c'est le seul bloc qui relie les cibles a une
    // date. Sans lui, l'ecran annonce deux nombres sans dire ou ils menent.
    // Signale par Olivier a l'usage.
    //
    // Les valeurs sortent de nutritionTargets : la maquette les ecrit en dur
    // (78,4 -> 75 kg en 11 semaines, 460 kcal), ce qui ne vaut que pour son
    // profil d'exemple.
    if (t.weeks && t.deficit) {
      var parSem = Math.round((Math.abs(t.deficit) * 7 / 7700) * 100) / 100;
      h += '<section class="nu-horizon"><div class="nu-h-t">Horizon</div>' +
           '<div class="nu-h-p">À ce rythme, <b>' + esc(fmtVal(p.startWeight)) + " → " +
           esc(fmtVal(p.targetWeight)) + " kg en " + t.weeks + " semaines</b>. Le " +
           (t.losing ? "déficit" : "surplus") + " est de " + Math.abs(t.deficit) +
           " kcal par jour, soit environ " + esc(fmtVal(parSem)) + " kg par semaine.</div></section>";
    }

    // Le meme avertissement que l'etape 10 du diagnostic, aux memes mots : deux
    // formulations differentes pour la meme reserve donneraient l'impression
    // que ce ne sont pas les memes chiffres.
    h += '<div class="nu-reperes">Ces chiffres sont des <b>repères</b>, pas une ' +
         "prescription. Ils sortent d'une estimation à partir de ton poids et de ton " +
         "volume d'entraînement, sans mesurer ton métabolisme. Ajuste-les d'après ce " +
         "que fait la balance sur trois semaines.</div>";

    h += '<button type="button" class="cs-cta cs-cta-clair" data-action="aller-ia-nutri">' +
         "Demander un plan repas à une IA</button>";
    return h;
  }

    // Glisser vers la GAUCHE (_sens = -1) amene l'ecran suivant, qui entre donc
    // par la droite. L'inverse pour l'autre sens.
    cls = _sens < 0 ? "ec-de-droite" : "ec-de-gauche";
    _sens = 0;
    n = document.getElementById("ecran");
    if (n && n.classList) n.classList.add(cls);
  }

  // =========================================================================
  // GLISSEMENT LATERAL — LE DOIGT ENTRAINE L'ECRAN
  // -------------------------------------------------------------------------
  // Ce qu'il y avait avant : touchstart, touchend, et rien entre les deux. Le
  // geste basculait bien d'onglet, mais RIEN NE SUIVAIT LE DOIGT — l'ecran
  // sortant ne bougeait jamais et l'ecran entrant arrivait apres coup, 26 px en
  // 160 ms, soit 7 % de la largeur. Ca se lit comme un on/off, pas comme un
  // glissement. Olivier l'a signale deux fois.
  //
  // Ce qu'il y a maintenant : les deux ecrans sont montes cote a cote dans une
  // PISTE posee par-dessus la page, et la piste suit le doigt en direct. Au
  // relacher, elle finit le mouvement si le seuil est franchi et revient en
  // arriere sinon.
  //
  // L'OBJECTION QUE J'AVAIS ECRITE ICI — « garder deux arbres DOM montes, avec
  // leurs ecouteurs et leurs chronos » — NE TIENT PAS. Tous les evenements
  // passent par delegation sur `document` (voir la section EVENEMENTS) : un
  // volet n'emporte aucun ecouteur, il n'y en a jamais eu sur les noeuds. Il ne
  // restait que deux prises reelles, et elles sont traitees :
  //   - les identifiants, que getElementById resoudrait sur le decor : les
  //     volets sont depouilles (voir depouiller) ;
  //   - le seul chrono qui vit dans le DOM, `chrono-v`, qui n'existe que dans
  //     le mode entrainement — ou le glissement est fige.
  //
  // Seuils. GLISSE_RATIO 1,8 vient du README section 5 : sans lui un
  // defilement un peu oblique monterait la piste. GLISSE_MS 800 ne sert plus
  // qu'au rattrapage : un glissement suivi n'a pas de duree maximale, et c'est
  // volontaire — une limite de duree fait taire les gestes lents sans rien
  // dire, ce qui est une des pistes du swipe muet sur l'iPhone d'Olivier.
  // =========================================================================
  var GLISSE_MS = 800, GLISSE_DX = 55, GLISSE_RATIO = 1.8;
  // Deplacement a partir duquel on decide que le geste est horizontal et qu'on
  // monte la piste. Assez petit pour que l'ecran parte tot sous le doigt.
  var GLISSE_PRISE = 10;
  // Part de la largeur au-dela de laquelle on commet le changement...
  var GLISSE_PART = 0.28;
  // ... ou vitesse, en pixels par milliseconde, qui le commet aussi. Sans elle,
  // un petit coup sec — le geste naturel pour changer d'onglet — reviendrait en
  // arriere alors qu'il etait franc.
  var GLISSE_VITESSE = 0.45;
  // Duree de la fin de course, au relacher. Elle ne s'ajoute pas au geste :
  // elle le termine.
  var GLISSE_FIN_MS = 210;
  // Resistance quand il n'y a plus rien de ce cote : l'ecran suit au tiers,
  // ce qui dit « c'est fini » sans afficher un vide.
  var GLISSE_BUTEE = 3.2;

  var _tx = null, _ty = 0, _tt = 0;
  // 0 indecis · 1 piste montee, le doigt entraine · -1 abandonne pour ce geste
  var _pris = 0;
  var _piste = null, _sortant = null, _entrant = null;
  var _cible = null, _dir = 0, _larg = 0, _dxCourant = 0;
  // La fin de course en vol : sa fonction de pose et son minuteur, pour pouvoir
  // la solder si un nouveau geste part avant qu'elle ne soit arrivee.
  var _finEnCours = null, _finMinuteur = null;
  // Receptacle de la lecture de mise en page forcee, voir pisteFinir.
  var _reflow = 0;

  function reduitMouvement() {
    try {
      return !!(window.matchMedia &&
                window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    } catch (e) { return false; }
  }

  // dir vaut 1 pour un doigt qui part vers la DROITE, ce qui ramene vers
  // l'onglet PRECEDENT, comme une page qu'on repousse. Rend null quand il n'y a
  // rien a montrer de ce cote : pas de bouclage aux extremites, et depuis un
  // sous-ecran seul le retour au parent existe.
  function cibleDe(dir) {
    var e = state.ecran, i, n;
    if (FIGES[e]) return null;
    if (has(PARENT, e)) return dir > 0 ? PARENT[e] : null;
    i = ONGLETS.indexOf(e);
    if (i < 0) return null;
    n = i - dir;
    if (n < 0 || n >= ONGLETS.length) return null;
    return ONGLETS[n];
  }

  // Un volet est un DECOR. Il ne doit repondre a aucune recherche par
  // identifiant tant qu'il est monte : `ia-prompt`, `run-km` et `run-min`
  // existent dans des ecrans glissables, et getElementById rend le PREMIER
  // trouve, pas le vivant.
  function depouiller(n) {
    var l, i;
    if (!n || !n.querySelectorAll) return;
    if (n.removeAttribute) n.removeAttribute("id");
    l = n.querySelectorAll("[id]");
    for (i = 0; i < l.length; i++) { l[i].removeAttribute("id"); }
  }

  // Un geste qui repart AVANT la fin de course du precedent. Sans ce solde, le
  // nouveau volet sortant serait le clone de l'ecran d'AVANT la bascule, et la
  // bascule tomberait dessous : au relacher, l'ecran sauterait. On termine donc
  // la course en cours tout de suite, et le nouveau geste part d'un etat pose.
  function solderFin() {
    var f = _finEnCours;
    if (!f) return;
    _finEnCours = null;
    if (_finMinuteur) { window.clearTimeout(_finMinuteur); _finMinuteur = null; }
    f();
  }

  function pisteMonter(dir) {
    var ec, clone, c;
    solderFin();
    ec = document.getElementById("ecran");
    if (!ec || !document.body) return false;

    _cible = cibleDe(dir);
    _dir = dir;
    _dxCourant = 0;
    _larg = window.innerWidth || document.documentElement.clientWidth || 320;

    _piste = document.createElement("div");
    _piste.className = "glisse-piste";

    // LE VOLET SORTANT EST UN CLONE, pas l'ecran vivant. Deplacer l'ecran reel
    // le sortirait de son flux au moment ou la page est defilee, et le
    // defilement sauterait sous le doigt. Le clone est remonte de la position
    // de defilement : il montre exactement ce que l'utilisateur a sous les yeux.
    // La page ne defile pas pendant le geste — `touch-action: pan-y` laisse le
    // vertical au navigateur, qui l'a deja ecarte puisqu'on est horizontal.
    clone = ec.cloneNode(true);
    depouiller(clone);
    // On repose la classe a la main : le style du chassis tient a `#ecran`, que
    // depouiller vient de retirer, et une classe d'animation restee accrochee
    // se rejouerait a l'insertion.
    clone.className = "ecran";
    _sortant = document.createElement("div");
    _sortant.className = "glisse-volet";
    _sortant.style.top = (-(window.pageYOffset || 0)) + "px";
    _sortant.appendChild(clone);
    _piste.appendChild(_sortant);

    if (_cible) {
      c = corpsDe(_cible);
      _entrant = document.createElement("div");
      _entrant.className = "glisse-volet";
      _entrant.innerHTML = envelopper(c, false);
      depouiller(_entrant);
      // Il attend hors champ, du cote d'ou il doit venir. L'ecran entrant sera
      // pose en haut par aller(), donc il commence en haut.
      _entrant.style.transform = "translateX(" + (dir > 0 ? -_larg : _larg) + "px)";
      _piste.appendChild(_entrant);
    } else {
      _entrant = null;
    }

    document.body.appendChild(_piste);
    return true;
  }

  function pisteDemonter() {
    if (_piste && _piste.parentNode) _piste.parentNode.removeChild(_piste);
    _piste = null; _sortant = null; _entrant = null;
    _cible = null; _dir = 0; _dxCourant = 0;
  }

  function pisteSuivre(dx) {
    var d;
    if (!_piste) return;
    d = _cible ? dx : dx / GLISSE_BUTEE;
    _dxCourant = d;
    _sortant.style.transform = "translateX(" + d + "px)";
    if (_entrant) {
      _entrant.style.transform = "translateX(" + ((_dir > 0 ? -_larg : _larg) + d) + "px)";
    }
  }

  // Fin de course. On rend d'abord le nouvel ecran DERRIERE la piste, puis on
  // retire la piste : elle est opaque et couvre tout, donc on ne voit jamais
  // l'ecran se reconstruire.
  function pisteFinir(valide) {
    var piste = _piste, sortant = _sortant, entrant = _entrant,
        cible = _cible, dir = _dir, larg = _larg, fait = false, arrivee;

    if (!piste) return;
    _piste = null; _sortant = null; _entrant = null;
    _cible = null; _dir = 0; _dxCourant = 0;

    arrivee = valide ? (dir > 0 ? larg : -larg) : 0;

    function poser() {
      if (fait) return;
      fait = true;
      _finEnCours = null;
      _finMinuteur = null;
      if (valide && cible) aller(cible, 0);
      if (piste.parentNode) piste.parentNode.removeChild(piste);
    }
    _finEnCours = poser;

    sortant.className = "glisse-volet glisse-fin";
    if (entrant) entrant.className = "glisse-volet glisse-fin";
    // Lecture forcee de la mise en page. Sans elle, le navigateur groupe la
    // pose de la transition et le changement de transform dans le meme lot :
    // il ne voit qu'un etat, et rien ne s'anime. La valeur ne sert a rien
    // d'autre qu'a obliger la lecture.
    _reflow = piste.offsetWidth;
    sortant.style.transform = "translateX(" + arrivee + "px)";
    if (entrant) {
      entrant.style.transform = "translateX(" +
        (valide ? 0 : (dir > 0 ? -larg : larg)) + "px)";
    }
    // Un minuteur plutot que transitionend : quand le doigt relache pile a
    // l'arrivee, la transition ne demarre pas et l'evenement ne vient jamais.
    _finMinuteur = window.setTimeout(poser, GLISSE_FIN_MS);
  }

  function tStart(ev) {
    var t = ev.touches && ev.touches[0];
    _pris = 0;
    if (!t) { _tx = null; return; }
    // Deux doigts, c'est un pincement ou un appui parasite, pas un glissement.
    if (ev.touches.length > 1) { _tx = null; _pris = -1; return; }
    _tx = t.clientX; _ty = t.clientY; _tt = new Date().getTime();
  }

  function tMove(ev) {
    var t, dx, dy;
    if (_tx === null || _pris < 0) return;
    if (ev.touches && ev.touches.length > 1) { _pris = -1; pisteDemonter(); return; }
    t = ev.touches && ev.touches[0];
    if (!t) return;
    dx = t.clientX - _tx;
    dy = t.clientY - _ty;

    if (_pris === 0) {
      // Le vertical gagne d'abord : on ecarte le geste avant meme d'avoir
      // parcouru la distance de prise, sinon un defilement un peu oblique
      // monterait la piste et bloquerait la page.
      if (Math.abs(dy) > GLISSE_PRISE && Math.abs(dx) < Math.abs(dy) * GLISSE_RATIO) {
        _pris = -1; return;
      }
      if (Math.abs(dx) < GLISSE_PRISE) return;
      if (Math.abs(dx) < Math.abs(dy) * GLISSE_RATIO) { _pris = -1; return; }
      if (FIGES[state.ecran]) { _pris = -1; return; }
      // Qui demande moins d'animation ne recoit pas de piste du tout : le geste
      // est rattrape au relacher, et la bascule reste instantanee.
      if (reduitMouvement()) { _pris = -1; return; }
      if (!pisteMonter(dx > 0 ? 1 : -1)) { _pris = -1; return; }
      _pris = 1;
    }

    // Le doigt peut repartir de l'autre cote en cours de geste. On remonte
    // alors la piste avec l'autre voisin, dans la meme image : rien n'est
    // peint entre les deux.
    if ((dx > 0 ? 1 : -1) !== _dir && Math.abs(dx) > GLISSE_PRISE) {
      pisteDemonter();
      if (!pisteMonter(dx > 0 ? 1 : -1)) { _pris = -1; return; }
    }

    pisteSuivre(dx);
  }

  function tEnd(ev) {
    var t, dx, dy, dt, vit, valide, cible;
    if (_tx === null && _pris !== 1) { _pris = 0; return; }
    t = ev.changedTouches && ev.changedTouches[0];
    dt = new Date().getTime() - _tt;
    dx = (t && _tx !== null) ? t.clientX - _tx : _dxCourant;
    dy = (t && _tx !== null) ? t.clientY - _ty : 0;
    _tx = null;

    if (_pris === 1) {
      _pris = 0;
      cible = _cible;
      vit = dt > 0 ? Math.abs(dx) / dt : 0;
      valide = !!cible && (Math.abs(dx) >= _larg * GLISSE_PART ||
                           (vit >= GLISSE_VITESSE && Math.abs(dx) >= GLISSE_DX));
      pisteFinir(valide);
      return;
    }

    // RATTRAPAGE. La piste n'a pas ete montee — mouvement reduit, ecran fige,
    // ou geste ecarte comme vertical puis redresse. On retombe sur la regle
    // d'avant : bref, franc, nettement horizontal.
    _pris = 0;
    if (!t) return;
    if (dt > GLISSE_MS) return;
    if (Math.abs(dx) < GLISSE_DX) return;
    if (Math.abs(dx) < Math.abs(dy) * GLISSE_RATIO) return;
    glisser(dx > 0 ? 1 : -1);
  }

  // iOS coupe le geste sur un appel, une notification, un bord de systeme. Sans
  // ca la piste resterait montee par-dessus l'appli, muette et opaque.
  function tCancel() {
    _tx = null;
    if (_pris === 1) { _pris = 0; pisteFinir(false); return; }
    _pris = 0;
  }

  // La bascule sans geste : nav basse, bancs, et le rattrapage ci-dessus.
  function glisser(dir) {
    var c = cibleDe(dir);
    if (!c) return;
    aller(c, dir > 0 ? 1 : -1);
  }

  // =========================================================================
  // THEME
  // -------------------------------------------------------------------------
  // 0 clair, 1 sombre, 2 systeme. Le mode systeme est RESOLU vers une valeur
  // concrete posee sur <html> : le JavaScript peut alors lire la couleur
  // effective, ce qu'une cascade de media queries ne permet pas.
  // =========================================================================
  function themeResolu() {
    if (state.theme === 0) return "clair";
    if (state.theme === 1) return "sombre";
    try {
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "sombre";
    } catch (e) {}
    return "clair";
  }

  // Appele au DEBUT de chaque rendu, donc auto-correcteur. Une PWA iOS mise en
  // veille ne recoit pas toujours l'evenement « change » de matchMedia ;
  // dependre de lui laissait le theme systeme bloque sur son ancienne valeur.
  function appliqueTheme() {
    try { document.documentElement.setAttribute("data-theme", themeResolu()); } catch (e) {}
  }

  // =========================================================================
  // NAV BASSE
  // -------------------------------------------------------------------------
  // Traces SVG repris de la source du prototype. Deux `path` par icone,
  // stroke-width 2, bouts arrondis, 22 x 22.
  // =========================================================================
  var NAV_DEF = [
    { k: "jour",  t: "Jour",        d1: "M4 12h16", d2: "M6 8v8M18 8v8M3 10v4M21 10v4" },
    { k: "nutri", t: "Nutrition",   d1: "M7 3v8a3 3 0 0 0 6 0V3", d2: "M10 11v10M18 3c-1.5 2-2 4-2 6s.5 3 2 3 2-1 2-3-.5-4-2-6zm0 12v6" },
    { k: "histo", t: "Historique",  d1: "M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9z", d2: "M12 7v5l3 2" },
    { k: "prog",  t: "Progrès",     d1: "M4 19V5m0 14h16", d2: "M7 15l3.5-4 3 2.5L19 8" },
    { k: "moi",   t: "Moi",         d1: "M12 4.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z", d2: "M5 20c0-3.5 3.1-5.5 7-5.5s7 2 7 5.5" }
  ];

  // Un onglet reste allume quand on est sur l'un de ses ecrans de detail :
  // consulter une fiche, c'est encore etre dans l'Historique.
  var NAV_GROUPE = {
    jour:  ["jour"],
    nutri: ["nutri"],
    histo: ["histo", "fiche"],
    prog:  ["prog"],
    moi:   ["moi", "profil", "monprog", "exos", "theme", "ia"]
  };

  function navActif(k) { return NAV_GROUPE[k].indexOf(state.ecran) >= 0; }

  function navHtml() {
    var h = "", i, d, on;
    for (i = 0; i < NAV_DEF.length; i++) {
      d = NAV_DEF[i];
      on = navActif(d.k);
      h += '<button type="button" class="nav-btn' + (on ? " nav-btn-on" : "") + '"' +
           ' data-action="onglet" data-ecran="' + d.k + '"' +
           ' aria-current="' + (on ? "page" : "false") + '">' +
             '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"' +
             ' stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
               '<path d="' + d.d1 + '"></path><path d="' + d.d2 + '"></path>' +
             '</svg>' +
             '<span>' + esc(d.t) + '</span>' +
           '</button>';
