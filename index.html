        if (etaitJourPrevu(dateFromKey(dk))) doneWeekdays++;
      }
      totalTonnage += sessionTonnage(dk, e0);
      totalKm += sessionDistance(e0);
    }

    var attendance = null;
    if (firstTrainKey) {
      var wd = 0, cur = dateFromKey(firstTrainKey), stop = dateFromKey(tKey);
      while (cur <= stop) { if (etaitJourPrevu(cur)) wd++; cur = addDays(cur, 1); }
      if (wd > 0) attendance = Math.min(100, Math.round((doneWeekdays / wd) * 100));
    }

    var currentStreak = 0;
    (function () {
      var cursor = new Date(), ck = fmt(cursor), i, dKey, e;
      if (etaitJourPrevu(cursor) && !(log[ck] && log[ck].done)) cursor = addDays(cursor, -1);
      for (i = 0; i < 400; i++) {
        dKey = fmt(cursor);
        if (firstKey && dKey < firstKey) break;
        if (etaitJourPrevu(cursor)) {
          e = log[dKey];
          if (e && e.done) currentStreak++; else break;
        }
        cursor = addDays(cursor, -1);
      }
    })();

    var weightSeries = [], wk;
    for (wk in log) {
      if (has(log, wk) && log[wk] && typeof log[wk].weight === "number") {
        weightSeries.push({ date: wk, poids: log[wk].weight });
      }
    }
    weightSeries.sort(function (a, b) { return a.date > b.date ? 1 : -1; });

    // ⚠️ LE POIDS DECLARE AU DIAGNOSTIC OUVRE LA COURBE, DES LE PREMIER JOUR.
    //
    // Demande d'Olivier : « on avait dit qu'on voulait voir le graphe de pesee des
    // le premier jour ». Ce n'etait pas le cas : la serie ne se construisait qu'a
    // partir des pesees du JOURNAL, donc a zero pesee la carte n'existait pas du
    // tout. Le cas « une seule pesee » avait ete repare en v1.9.1 parce que le
    // silence se lisait comme une perte ; le cas ZERO avait ete oublie.
    //
    // ⚠️ CE POINT N'EST PAS UNE MESURE, ET TOUT LE RESTE EN DECOULE. C'est un poids
    // donne de memoire pendant le diagnostic. Il est donc :
    //   - dessine CREUX, jamais plein, et la carte dit ce qu'il est ;
    //   - exclu de la TENDANCE — une tendance lissee est faite de mesures ;
    //   - exclu du « depuis le depart » — sinon le premier jour annoncerait
    //     « 0 kg depuis le depart », ce qui est exact et absurde.
    //
    // Il n'entre pas si une vraie pesee porte deja cette date ou une date plus
    // ancienne : une mesure vaut toujours mieux qu'une declaration.
    var peseesN = weightSeries.length;
    var declareLe = (profile && typeof profile.createdAt === "string" &&
                     DATE_RE.test(profile.createdAt)) ? profile.createdAt : null;
    if (declareLe && START_WEIGHT > 0 &&
        (!peseesN || weightSeries[0].date > declareLe)) {
      weightSeries.unshift({ date: declareLe, poids: START_WEIGHT, declare: true });
    }
    var aDeclare = weightSeries.length > peseesN;

    // LA TENDANCE NE VOIT QUE LES MESURES. C'est la reserve que j'avais posee sur
    // ce chantier, et c'est ici qu'elle est neutralisee : un poids de memoire qui
    // entrerait dans le lissage a sept jours deplacerait le premier segment de la
    // tendance sans que rien ne le dise.
    var mesures = [], wsi;
    for (wsi = 0; wsi < weightSeries.length; wsi++) {
      if (!weightSeries[wsi].declare) mesures.push(weightSeries[wsi]);
    }
    var trend = weightTrend(mesures, TREND_WINDOW_DAYS);

    // LE DELTA SE COMPTE SUR LA DERNIERE MESURE, jamais sur le point declare.
    var derniereMesure = mesures.length ? mesures[mesures.length - 1] : null;
    var weightDelta = derniereMesure
      ? +(derniereMesure.poids - START_WEIGHT).toFixed(1) : 0;

    // --- Séance du jour saisi ---
    // ALLÈGEMENT : une propriété de la JOURNÉE, pas du programme. Le plan n'est
    // pas modifié, il est seulement PRESCRIT plus court ce jour-là. Les blocs de
    // course sont hors sujet : ils se comptent en kilomètres.
    var seanceAllegee = !!(program && profile && profile.allegeLe === editKey);
    var exerciseProgress = program ? program.exercises.map(function (ex) {
      var total = setsCountOf(ex);
      if (seanceAllegee && total > 1 && (ex.track || "none") !== "run") total--;
      var done = Math.min(setsDone(entry, ex.id), MAX_SETS);
      return {
        ex: ex, total: total, done: done,
        isDone: done >= total,
        isPartial: done > 0 && done < total,
        loadable: ex.load === true,
        track: ex.track || (ex.load === true ? "load" : "none"),
        distance: exerciseDistance(entry, ex.id),
        tonnage: exerciseTonnage(entry, ex.id)
      };
    }) : [];
    var exercisesDoneCount = 0, totalExercises = exerciseProgress.length;
    for (var pi = 0; pi < exerciseProgress.length; pi++) {
      if (exerciseProgress[pi].isDone) exercisesDoneCount++;
    }
    var nutriDoneCount = 0;
    for (var ni = 0; ni < NUTRITION.length; ni++) { if (entryNutri[ni]) nutriDoneCount++; }
    var todayTonnage = sessionTonnage(editKey, entry);

    var lastKey = lastSessionKeyFor(editKey, progKey);
    var lastEntry = lastKey ? log[lastKey] : null;
    var lastTonnage = lastKey ? sessionTonnage(lastKey, lastEntry) : 0;
    var tonnageDiff = (todayTonnage > 0 && lastTonnage > 0)
      ? Math.round(todayTonnage - lastTonnage) : null;

    // Détection de plateau : on compare la tendance lissée d'aujourd'hui à celle
    // d'environ deux semaines avant. Sert au message le plus utile de tous, celui
    // qui explique une balance immobile alors que les charges montent.
    var trendNow = trend.length ? trend[trend.length - 1].poids : null;
    var trend14 = null;
    if (trend.length >= 2) {
      var refT = addDays(dateFromKey(trend[trend.length - 1].date), -14).getTime();
      var best = null, bi2, gap;
      for (bi2 = 0; bi2 < trend.length - 1; bi2++) {
        gap = Math.abs(dateFromKey(trend[bi2].date).getTime() - refT);
        if (best === null || gap < best.gap) best = { gap: gap, v: trend[bi2].poids };
      }
      // Comparaison refusée si le point de référence est trop loin de J-14.
      if (best && best.gap <= 6 * 86400000) trend14 = trendNow - best.v;
    }
    var badgeHit = false, bi;
    for (bi = 0; bi < BADGES.length; bi++) { if (BADGES[bi].n === totalDone) badgeHit = true; }

    var motivation = motivationFor({
      dateKey: tKey,
      totalDone: totalDone,
      streak: currentStreak,
      attendance: attendance,
      weightDelta: weightDelta,
      toGo: trendNow === null ? null : trendNow - TARGET_WEIGHT,
      plateau: trend14 !== null && Math.abs(trend14) < 0.4,
      tonnageDiff: tonnageDiff === null ? 0 : tonnageDiff,
      badgeHit: badgeHit,
      isTrainingDay: isTrainingDay(new Date()),
      doneToday: !!(log[tKey] && log[tKey].done)
    });

    // --- Bannières ---
    var bannersHtml = "";
    if (!state.storageOk) {
      bannersHtml += '<div class="banner banner-error">Stockage indisponible (navigation privée, ou mémoire pleine). Tes taps s\'affichent mais rien n\'est gardé : exporte tes données dès que possible.</div>';
    }
    // APRES le stockage indisponible, qui est plus grave — ce qu'on tape n'y est
    // pas garde —, et AVANT la notification passagere, qui disparait au bout de
    // sept secondes. L'ordre suit la duree de vie de l'information.
    bannersHtml += majBandeauHtml();
    if (state.notice) {
      bannersHtml += '<div class="banner banner-' + esc(state.notice.kind || "info") + '">' + esc(state.notice.text) + '</div>';
    }
    if (!isToday) {
      bannersHtml +=
        '<div class="banner banner-warn">Tu saisis la séance du <strong>' + esc(longDate(editKey)) + '</strong>, pas celle d\'aujourd\'hui.' +
          '<button type="button" class="banner-btn" data-action="goto-today">Revenir à aujourd\'hui</button>' +
        '</div>';
    }

    // --- En-tête, choix du jour, choix de la séance ---
    // Ordre chronologique : on lit de gauche à droite. Les boutons portent un
    // DÉCALAGE et non une date : une date calculée au rendu devient fausse après
    // minuit si la page reste ouverte.
    var quick = [
      { off: -2, label: "Avant-hier" },
      { off: -1, label: "Hier" },
      { off: 0, label: "Aujourd'hui" }
    ];
    var dayBtns = quick.map(function (q) {
      var kq = fmt(addDays(new Date(), q.off));
      var active = kq === editKey;
      return '<button type="button" class="day-btn ' + (active ? "day-btn-active" : "") + '"' +
        ' aria-pressed="' + (active ? "true" : "false") + '"' +
        ' data-action="set-edit-day" data-off="' + q.off + '">' + q.label + '</button>';
    }).join("");

    var progPickerHtml = "";
    if (state.showProgPicker || !program) {
      progPickerHtml = '<div class="prog-picker" role="group" aria-label="Choisir la séance effectuée">' +
        PROGRAM_ORDER.map(function (pk) {
          var active = progKey === pk;
          return '<button type="button" class="prog-btn ' + (active ? "prog-btn-active" : "") + '"' +
            ' aria-pressed="' + (active ? "true" : "false") + '"' +
            ' data-action="set-prog" data-prog="' + pk + '">' + esc(PROGRAM[pk].label) + '</button>';
        }).join("") + '</div>';
    }

    var showDateField = state.showDatePicker || !isToday;

    var headerHtml =
      '<header class="header">' +
        '<div class="header-date">' + esc(longDate(editKey)) + (isToday ? "" : " (rattrapage)") + '</div>' +
        (program
          ? '<h1 class="header-title" style="color:' + accentTxt + '">' + esc(program.label) + '</h1>'
          : '<h1 class="header-title header-title-rest">REPOS</h1>') +
        '<div class="header-sub">' + (program ? esc(program.sub) : "Choisis une séance ci-dessous si tu en as fait une") + '</div>' +
        // Sans cette mention, rien ne signale qu'on regarde une séance forcée :
        // on voit PULL un mercredi et on croit à un bug de l'appli.
        (overriddenProg
          ? '<div class="header-override">Séance choisie à la main. ' +
            (PROGRAM[naturalDow]
              ? 'Le ' + esc(weekdayName(editKey)) + ', c\'est normalement ' +
                esc(PROGRAM[naturalDow].label) + '.'
              : 'Le ' + esc(weekdayName(editKey)) + ' n\'est pas un jour prévu.') +
            ' <button type="button" class="header-override-btn" data-action="prog-reset">' +
            'Revenir au programme du jour</button></div>'
          : "") +
      '</header>' +
      // « Changer de séance » juste sous le titre : c'est ce titre qu'il change,
      // les deux doivent se toucher.
      (program
        ? '<button type="button" class="prog-toggle" data-action="toggle-prog-picker" aria-expanded="' + (state.showProgPicker ? "true" : "false") + '">⇄ ' +
            (state.showProgPicker ? "Masquer le choix de séance" : "Changer de séance") + '</button>'
        : "") +
      progPickerHtml +
      '<div class="day-row">' + dayBtns + '</div>' +
      // Le champ date sert au RATTRAPAGE d'une séance oubliée, pas à changer le
      // jour courant, qui vient du téléphone. Rare, donc replié par défaut : il
      // n'a pas à occuper le haut de l'écran de séance en permanence. Il s'ouvre
      // tout seul dès qu'on n'est plus sur aujourd'hui, pour pouvoir ajuster.
      (showDateField
        ? '<input type="date" class="weight-input day-date" data-action="set-edit-date" max="' + tKey + '" min="' + floorKey + '" value="' + esc(editKey) + '" aria-label="Saisir une autre date">'
        : '<button type="button" class="date-link" data-action="toggle-date-picker">Saisir un autre jour…</button>');

    // --- Hero streak ---
    var glowCls = currentStreak >= 10 ? "glow-strong" : (currentStreak > 0 ? "glow-soft" : "");

    // Grille des 4 dernières semaines : une ligne par semaine, une colonne par
    // jour ouvré. Le motif des trous se lit d'un coup d'œil.
    // Une colonne par jour d'entrainement, dans l'ordre de la semaine. Les cles
    // de PROGRAM_ORDER valent deja 1 pour lundi a 7 pour dimanche, donc leur
    // ordre naturel est le bon et le decalage depuis lundi vaut cle - 1.
    var gridKeys = PROGRAM_ORDER.length ? PROGRAM_ORDER : [1, 2, 3, 4, 5];
    var nCols = gridKeys.length;
    var gridDone = 0, gridMiss = 0, gridHors = 0, missByDay = [], mzi;
    for (mzi = 0; mzi < nCols; mzi++) missByDay.push(0);
    var gridCells = '<span class="wg-head" aria-hidden="true"></span>' +
      gridKeys.map(function (pk2) {
        return '<span class="wg-head" aria-hidden="true">' + DAY_INITIALS[pk2 === 7 ? 0 : pk2] + '</span>';
      }).join("");
    // Cases antérieures à la première trace d'entraînement : ni faites, ni
    // manquées. L'appli n'était pas encore sur le téléphone.
    var gridPre = 0;
    var thisMonday = mondayOf(new Date());
    for (var wi = 3; wi >= 0; wi--) {
      var wMon = addDays(thisMonday, -wi * 7);
      gridCells += '<span class="wg-label" aria-hidden="true">' +
        wMon.getDate() + "/" + (wMon.getMonth() + 1) + '</span>';
      for (var dj = 0; dj < nCols; dj++) {
        var cd = addDays(wMon, gridKeys[dj] - 1), ck2 = fmt(cd);
        var isDone = !!(log[ck2] && log[ck2].done);
        var cls;
        // AUJOURD'HUI se teste AVANT « avant tes débuts », sans quoi le jour
        // courant disparaissait sur une installation neuve : firstTrainKey est
        // nul tant qu'aucune séance n'a laissé de trace, toutes les cases
        // passaient en pointillés, et l'écran de premier lancement — celui qui a
        // le plus besoin du repère « c'est aujourd'hui, vas-y » — n'en avait
        // aucun. Même chose pour qui commence par se peser.
        if (ck2 > tKey) { cls = "wg-future"; }
        else if (ck2 === tKey) { cls = isDone ? "wg-today-done" : "wg-today"; if (isDone) gridDone++; }
        else if (!firstTrainKey || ck2 < firstTrainKey) { cls = "wg-pre"; gridPre++; }
        else if (isDone) { cls = "wg-done"; gridDone++; }
        // APRES isDone, AVANT wg-miss. Une seance faite un jour non prevu a bien
        // eu lieu : elle reste comptee. Un jour non prevu SANS seance n'a rien
        // manque, et c'est la tout le defaut corrige ici.
        else if (!etaitJourPrevu(cd)) { cls = "wg-hors"; gridHors++; }
        else { cls = "wg-miss"; gridMiss++; missByDay[dj]++; }
        gridCells += '<span class="wg-cell ' + cls + '" aria-hidden="true"></span>';
      }
    }
    // Si un jour de la semaine ressort nettement, on le nomme : c'est la seule
    // information que le compteur de streak est incapable de donner.
    var worstDay = -1, worstCount = 0, sameMax = 0, mi;
    for (mi = 0; mi < nCols; mi++) {
      if (missByDay[mi] > worstCount) { worstCount = missByDay[mi]; worstDay = mi; sameMax = 1; }
      else if (missByDay[mi] === worstCount && worstCount > 0) { sameMax++; }
    }
    var gridNote = (worstCount >= 2 && sameMax === 1)
      ? '<div class="wg-legend"><span>Jour le plus manqué sur 4 semaines : <b style="color:var(--texte-1b)">le ' +
          DAY_FULL[gridKeys[worstDay] === 7 ? 0 : gridKeys[worstDay]] + '</b></span></div>'
      : '<div class="wg-legend">' +
          '<span><i class="wg-swatch" style="background:var(--accent)"></i> faite</span>' +
          '<span><i class="wg-swatch" style="border:1.5px solid var(--bord-fort)"></i> manquée</span>' +
          '<span><i class="wg-swatch" style="border:1.5px dashed var(--bord-discret)"></i> à venir</span>' +
          (gridPre ? '<span><i class="wg-swatch" style="border:1.5px dotted var(--bord-moyen)"></i> avant tes débuts</span>' : '') +
          (gridHors ? '<span><i class="wg-swatch" style="background:var(--fond-pill)"></i> pas encore prévu</span>' : '') +
        '</div>';

    var heroHtml =
      '<section class="hero">' +
        '<div class="hero-flame-wrap ' + glowCls + '" style="--glow:var(--accent)">' +
          '<div class="hero-flame"><span aria-hidden="true">🔥</span><span class="hero-number" style="' + (currentStreak === 0 ? "color:var(--texte-2)" : "") + '">' + currentStreak + '</span></div>' +
        '</div>' +
        '<div class="hero-label">séances d\'affilée, sur tes jours prévus</div>' +
        '<div class="weekgrid" role="img" style="grid-template-columns:30px repeat(' + nCols + ',1fr);max-width:' + (30 + nCols * 44) + 'px"' +
          ' aria-label="4 dernières semaines : ' + gridDone + ' séances faites, ' + gridMiss + ' manquées">' +
          gridCells +
        '</div>' +
        gridNote +
      '</section>';

    var motivationHtml =
      '<section class="card motivation-card">' +
        '<div class="motivation-head">' + esc(motivation.head) + '</div>' +
        '<div class="motivation-sub">' + esc(motivation.sub) + '</div>' +
      '</section>';

    function LEVELS_ROW(label, field, value) {
      var groupId = "level-" + field;
      var btns = LEVELS.map(function (l) {
        var active = value === l.v;
        return '<button type="button" class="level-btn ' + (active ? "level-btn-active" : "") + '"' +
          ' aria-pressed="' + (active ? "true" : "false") + '"' +
          ' data-action="set-level" data-field="' + field + '" data-val="' + l.v + '">' + esc(l.label) + '</button>';
      }).join("");
      return '<div class="field">' +
        '<div class="field-label" id="' + groupId + '">' + esc(label) + '</div>' +
        '<div class="level-row" role="group" aria-labelledby="' + groupId + '">' + btns + '</div></div>';
    }

    // --- Carte séance ---
    var seanceHtml = "";
    if (program) {
      var exListHtml = "";
      if (state.showExercises) {
        exListHtml = '<ol class="exercise-list">' + exerciseProgress.map(function (p, i) {
          var ex = p.ex;
          var itemCls = "exercise-item" + (p.isDone ? " exercise-item-done" : "");
          var borderStyle = (p.isPartial && !p.isDone) ? ' style="border-left-color:' + accentFond + '"' : "";
          var body = "";

          if (p.track === "run") {
            // Un bloc de course se note en une ligne : la distance et le temps.
            // L'allure en decoule et s'affiche a cote, c'est le chiffre que
            // regarde un coureur, comme le tonnage pour quelqu'un qui souleve.
            var s0 = setsOf(entry, ex.id)[0] || {};
            var allure = frAllure(s0.km, s0.min);
            body =
              '<div class="serie-table">' +
                '<div class="serie-line' + ((s0.km && s0.min) ? " serie-line-filled" : "") + '">' +
                  '<input id="km-' + ex.id + '" class="serie-input" type="text" inputmode="decimal" autocomplete="off"' +
                    ' placeholder="km" value="' + esc(s0.km != null ? frDec(s0.km) : "") + '"' +
                    ' data-action="set-km" data-ex="' + ex.id + '" data-set="0"' +
                    ' aria-label="Distance en kilomètres, ' + esc(ex.name) + '">' +
                  '<span class="serie-unit" aria-hidden="true">km</span>' +
                  '<span class="serie-x" aria-hidden="true">en</span>' +
                  '<input id="min-' + ex.id + '" class="serie-input" type="text" inputmode="numeric" autocomplete="off"' +
                    ' placeholder="min" value="' + esc(s0.min != null ? s0.min : "") + '"' +
                    ' data-action="set-min" data-ex="' + ex.id + '" data-set="0"' +
                    ' aria-label="Durée en minutes, ' + esc(ex.name) + '">' +
                  '<span class="serie-unit" aria-hidden="true">min</span>' +
                  (allure ? '<span class="serie-sub">' + esc(allure) + '/km</span>' : '') +
                '</div>' +
              '</div>';
            var pRun = lastRunFor(editKey, ex.id, progKey);
            var cmpRun = "";
            if (pRun && s0.km) {
              var dk = Math.round((s0.km - pRun.km) * 10) / 10;
              cmpRun = (dk === 0)
                ? '<span class="tonnage-label">même distance</span>'
                : (dk > 0 ? '<span class="load-up">+' + frDec(String(dk)) + ' km</span>'
                          : '<span class="load-down">-' + frDec(String(-dk)) + ' km</span>');
            }
            body +=
              '<div class="exo-compare">' +
                '<span class="exo-today">Aujourd\'hui <b>' + (s0.km ? frDec(String(s0.km)) + ' km' : '—') + '</b></span>' +
                (pRun
                  ? '<span>La dernière fois (' + esc(shortDate(pRun.date)) + ') <b>' + frDec(String(Math.round(pRun.km * 10) / 10)) + ' km</b></span>'
                  : '<span>Première sortie sur ce bloc</span>') +
                (cmpRun ? '<span>' + cmpRun + '</span>' : '') +
              '</div>';

          } else if (p.loadable) {
            // Une ligne par série : la charge peut monter ou descendre en cours
            // de séance, un seul couple pour tout l'exercice ne suffit pas.
            var arr = setsOf(entry, ex.id);
            var rows = Math.max(p.total, arr.length);
            var lines = "", si, s, sub;
            for (si = 0; si < rows; si++) {
              s = arr[si] || {};
              sub = (s.kg && s.reps) ? (s.kg * s.reps) : 0;
              lines +=
                '<div class="serie-line' + (sub > 0 ? " serie-line-filled" : "") + '">' +
                  '<span class="serie-num" aria-hidden="true">' + (si + 1) + '</span>' +
                  '<input id="kg-' + ex.id + '-' + si + '" class="serie-input" type="text" inputmode="decimal" autocomplete="off"' +
                    ' placeholder="kg" value="' + esc(s.kg != null ? frDec(s.kg) : "") + '"' +
                    ' data-action="set-kg" data-ex="' + ex.id + '" data-set="' + si + '"' +
                    ' aria-label="Série ' + (si + 1) + ', charge en kilos, ' + esc(ex.name) + '">' +
                  '<span class="serie-unit" aria-hidden="true">kg</span>' +
                  '<span class="serie-x" aria-hidden="true">×</span>' +
                  '<input id="reps-' + ex.id + '-' + si + '" class="serie-input" type="text" inputmode="numeric" autocomplete="off"' +
                    ' placeholder="reps" value="' + esc(s.reps != null ? s.reps : "") + '"' +
                    ' data-action="set-reps" data-ex="' + ex.id + '" data-set="' + si + '"' +
                    ' aria-label="Série ' + (si + 1) + ', répétitions, ' + esc(ex.name) + '">' +
                  (sub > 0 ? '<span class="serie-sub">' + frNum(sub) + ' kg</span>' : '') +
                '</div>';
            }
            body = (ex.kgCible
              ? '<div class="ana-cible">Charge vis\u00e9e : <b>' + frDec(String(ex.kgCible)) + ' kg</b></div>'
              : '') + '<div class="serie-table">' + lines + '</div>';

            // Comparaison en KILOS, exercice par exercice : c'est ce qui donne
            // envie de monter ou de réduire la charge à la série suivante. Un
            // pourcentage demande un calcul mental ; un écart en kilos se lit.
            var prev = lastTonnageFor(editKey, ex.id, progKey);
            var cmp = "";
            if (prev && p.tonnage > 0) {
              var d = Math.round(p.tonnage - prev.tonnage);
              cmp = (d === 0)
                ? '<span class="tonnage-label">à égalité</span>'
                : (d > 0 ? '<span class="load-up">+' + frNum(d) + ' kg</span>'
                         : '<span class="load-down">-' + frNum(-d) + ' kg</span>');
            }
            body +=
              '<div class="exo-compare">' +
                '<span class="exo-today">Aujourd\'hui <b>' + frNum(p.tonnage) + ' kg</b></span>' +
                (prev
                  ? '<span>La dernière fois (' + esc(shortDate(prev.date)) + ') <b>' + frNum(prev.tonnage) + ' kg</b></span>'
                  : '<span>Première fois sur cet exercice</span>') +
                (cmp ? '<span>' + cmp + '</span>' : '') +
              '</div>';

          } else {
            // Exercice chronométré : pas de charge, on garde les pastilles.
            var dotsHtml = "", di, filled, dotStyle, nextVal;
            for (di = 0; di < p.total; di++) {
              filled = di < p.done;
              dotStyle = filled ? ' style="background:' + accentFond + ';border-color:' + accentFond + ';color:var(--sur-accent)"' : "";
              nextVal = (di + 1 === p.done) ? di : di + 1;
              dotsHtml += '<button type="button" class="set-dot" data-action="set-sets" data-ex="' + ex.id + '" data-val="' + nextVal + '"' + dotStyle +
                ' aria-label="' + esc(ex.name) + ', série ' + (di + 1) + ' sur ' + p.total + (filled ? ", faite" : ", à faire") + '">' + (di + 1) + '</button>';
            }
            body = '<div class="set-row">' + dotsHtml +
              '<span class="set-remaining">' + p.done + '/' + p.total + (p.total > 1 ? " séries" : "") + '</span></div>';
          }

          // Deux commandes distinctes sur la ligne de titre : le nom replie ou
          // déplie l'exercice, le « ? » ouvre la fiche technique. Replié, il ne
          // reste qu'un résumé d'une ligne, ce qui raccourcit l'écran à mesure
          // que la séance avance.
          var howtoOpen = state.openExo === ex.id;
          var folded = state.exoFolded[ex.id] === true;
          return '<li class="' + itemCls + (folded ? " exercise-item-folded" : "") + '"' + borderStyle + '>' +
            '<div class="exercise-item-top">' +
              '<button type="button" class="exercise-item-name" data-action="toggle-exo" data-ex="' + ex.id + '"' +
                ' aria-expanded="' + (folded ? "false" : "true") + '">' +
                '<span class="exo-caret" aria-hidden="true">' + (folded ? "▸" : "▾") + '</span>' +
                (i + 1) + '. ' + esc(ex.name) +
              '</button>' +
              '<button type="button" class="howto-btn" data-action="toggle-howto" data-ex="' + ex.id + '"' +
                ' aria-expanded="' + (howtoOpen ? "true" : "false") + '"' +

      var lastSessionHtml;
      if (lastEntry) {
        var lsParts = [], lbl;

        lbl = levelLabel(lastEntry.energy);   if (lbl) lsParts.push("énergie " + lbl.toLowerCase());
        lbl = levelLabel(lastEntry.sleep);    if (lbl) lsParts.push("sommeil " + lbl.toLowerCase());

      } else {

      }

      seanceHtml =
        '<section class="card">' +
          '<div class="card-title">Séance ' + (isToday ? "du jour" : "du " + esc(shortDate(editKey))) +
            '<span class="duration-pill">' + esc(program.duration) + '</span></div>' +
          lastSessionHtml +
          (seanceAllegee
            ? '<div class="allege-note">' +
                '<b>Séance allégée</b> — une série de moins sur chaque exercice qui en compte ' +

              '</div>'
            : '') +
          '<button type="button" class="detail-toggle" data-action="toggle-exercises" aria-expanded="' + (state.showExercises ? "true" : "false") + '">' +
            (state.showExercises ? "Masquer" : "Voir le détail") + ' · ' + exercisesDoneCount + '/' + totalExercises + ' faits ' + (state.showExercises ? "▲" : "▼") +
          '</button>' +
          foldBtnHtml + exListHtml + allDoneHint + tonnageHtml +
          '<div class="field" style="margin-top:16px">' +
            '<label class="field-label" for="weight-input">Poids du jour (kg)</label>' +
            '<input id="weight-input" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done"' +
              ' placeholder="ex. ' + START_WEIGHT + '" class="weight-input" data-action="set-weight"' +
              ' value="' + esc(entry.weight != null ? frDec(entry.weight) : "") + '">' +

    } else {
      seanceHtml =
        '<section class="card">' +
          '<div class="card-title">Pesée du jour</div>' +
          '<div class="field">' +
            '<label class="field-label" for="weight-input">Poids du jour (kg)</label>' +

          '</div>' +
        '</section>';

    // --- Nutrition ---
    var nutriListHtml = "";
    // JOURNEE D'UN AUTRE PLAN. Les cases cochees du journal sont indexees par
    // POSITION dans nutriPlan ; un rediagnostic reconstruit le plan et decale
    // toutes les positions. nutriBilan ECARTE ces journees pour cette raison —
    // il les juge illisibles — mais render() les affichait comme si elles ne
    // l'etaient pas : les coches 0/3/4 d'un plan a 8 lignes se retrouvaient en
    // face d'un plan a 6, avec un « 3/6 faites » qui ne veut rien dire. Les deux
    // lisent maintenant la meme date, et la comparent de la meme facon.
    var nutriVieux = !!(profile && profile.nutriPlanLe && DATE_RE.test(profile.nutriPlanLe) &&
                        editKey < profile.nutriPlanLe);
    // Combien de cases etaient cochees ce jour-la, quel qu'ait ete le plan. Ce
    // compte-la reste VRAI : c'est le seul chiffre qu'on ait le droit d'afficher
    // pour une journee illisible.
    var nutriVieuxN = 0;
    if (nutriVieux) {
      var nvK;
      for (nvK in entryNutri) { if (has(entryNutri, nvK) && entryNutri[nvK]) nutriVieuxN++; }
    }
    if (nutriVieux) {
      // Ni case, ni coche, ni bouton de correction : rien ici ne peut etre mis en
      // face de ce plan sans mentir. On dit ce qu'on sait, et on s'arrete la.
      nutriListHtml =
        '<div class="nutri-bilan">Ce jour-là, ton plan n\'était pas celui-ci. ' +
        (nutriVieuxN
          ? ('Tu y avais coché ' + nutriVieuxN + ' prise' + (nutriVieuxN > 1 ? 's' : '') + '.')

        'et rien n\'en est tiré.</div>';
    } else {
      // Le rendu d'une ligne vit dans nutriLigneHtml, pas ici : c'est lui qui
      // sait qu'une ligne peut porter une correction, ou une fiche de
      // complement, et qui garantit qu'un plan v1.3.0 sans champ chiffre
      // s'affiche exactement comme avant.
      var nlh = "", nli, nlCorr = 0;
      for (nli = 0; nli < NUTRITION.length; nli++) {

      }
      nutriListHtml =
        '<div class="field-hint">Touche une ligne quand tu as pris ton complément : ' +

        '<ul class="nutrition-list">' + nlh + '</ul>';
      // Le bilan du plan est recalcule a l'affichage, jamais stocke : fige, il
      // deviendrait faux au premier changement de poids ou de correction, sans
      // prevenir. Meme regle que les pastilles chiffrees juste au-dessus.
      // ⚠️ LE JUGEMENT DU PLAN EST REBRANCHE, MAIS SEULEMENT POUR UN PLAN D'IA.

      //

      // reviendrait a ne pas relire un plan venu de l'exterieur — l'inverse de ce
      // que ce chantier existe pour faire.
      //

      if (profile && profile.nutriPlanIA) {

          '<button type="button" class="btn-ghost" data-action="nutri-tout-retablir">' +
          'Revenir au plan proposé (' + nlCorr + ' prise' + (nlCorr > 1 ? 's' : '') + ' corrigée' +

    var nutriTargetsHtml = "";
    if (profile) {

        '<div class="nutri-targets">' +
          '<div class="nutri-target"><div class="nutri-target-num">' + frNum(nt.kcal) + '</div>' +
            '<div class="nutri-target-label">kcal / jour<br>repère</div></div>' +
          '<div class="nutri-target"><div class="nutri-target-num">' + nt.prot + ' g</div>' +
            '<div class="nutri-target-label">protéines<br>par jour</div></div>' +
          (nt.deficit > 0
            ? '<div class="nutri-target"><div class="nutri-target-num">-' + frNum(nt.deficit) + '</div>' +
              '<div class="nutri-target-label">déficit<br>visé</div></div>'
            : '') +
          (nt.surplus > 0
            ? '<div class="nutri-target"><div class="nutri-target-num">+' + frNum(nt.surplus) + '</div>' +
              '<div class="nutri-target-label">surplus<br>visé</div></div>'
            : '') +
        '</div>';
    }
    var nutritionHtml =
      carteEntete("nutrition",
        'Nutrition ' + (isToday ? "du jour" : "du " + esc(shortDate(editKey))),
        NUTRITION.length
          ? (nutriVieux
               ? (nutriVieuxN + " coché" + (nutriVieuxN > 1 ? "es" : "e") + " · autre plan")
               : (nutriDoneCount + "/" + NUTRITION.length + " pris"))
          : "aucun complément") +
        nutriMigreHtml() +
        // D'OU VIENT CE PLAN, ET PAR OU EN SORTIR. Sans cette ligne, rien a
        // l'ecran ne distingue un plan ecrit par une IA du plan de l'appli — et le
        // retour arriere n'existerait nulle part.
        (profile && profile.nutriPlanIA
          ? '<div class="nutri-remise">' +
              '<span>Plan écrit par une IA le ' + esc(shortDate(profile.nutriPlanIA)) + '.</span>' +
              '<button type="button" class="btn-ghost" data-action="nutri-plan-appli">' +
                'Revenir au plan de l\'appli</button>' +
            '</div>'
          : '') +
        nutriTargetsHtml +
        // LA MISE EN GARDE SUIT LES CHIFFRES QU'ELLE QUALIFIE. Elle vivait tout en
        // bas de la carte, derriere la liste et les reperes : personne ne relie une
        // phrase de bas de carte a deux nombres poses en haut. Elle est desormais
        // collee a eux.
        (profile
          ? '<div class="field-hint">Des repères estimés à partir de ton poids et de ton ' +
            'volume d\'entraînement, pas une prescription : aucun métabolisme n\'est mesuré ' +
            'ici. Ajuste d\'après ce que fait la balance sur trois semaines.</div>'
          : '') +
        // LE CAS VIDE EST TRAITE, et il est frequent : c'est celui de quiconque ne
        // coche aucun complement. Un bouton qui deplie une liste sans rien
        // dedans est un bouton qui se moque de l'utilisateur ; on dit ce qu'il
        // en est, et ou aller pour que ca change.
        (NUTRITION.length
          ? nutriListHtml
          : '<div class="ob-note">Tu n\'as coché aucun complément, il n\'y a donc rien à suivre ici. ' +
            'Tes deux repères chiffrés restent au-dessus. Pour en ajouter un, touche ' +
            '<b>Nutrition</b> dans ta carte de profil.</div>') +
        // LA CARTE DES REPERES ET L'AVEU SONT SORTIS EN v1.18.0.
        //
        // Decision d'Olivier, sur capture annotee : « tu peux supprimer tout ce bloc
        // totalement raye, qui est pejoratif pour l'appli ». Il visait les deux
        // phrases qui parlaient de l'appli en mal — celle qui la declarait incapable
        // de composer des assiettes mangeables, et celle qui annoncait ce retrait —
        // ainsi que la carte qui les portait.
        //
        // ⚠️ CES DEUX PHRASES NE SONT PAS RECOPIEES ICI, meme pour memoire : le
        // garde-fou de fin de chaine refuse le build si elles subsistent, commentaires
        // compris. Il a mordu sur celui-ci. C'est la troisieme fois de la journee
        // qu'un commentaire fait echouer un retrait, et les trois fois il avait
        // raison — une raison se paraphrase, elle ne se cite pas.
        //
        // CE QUI RESTE EST LA MISE EN GARDE SUR L'ESTIMATION, et elle a change de
        // place : elle est passee sous les deux cibles, la ou elle porte. Elle ne
        // parle pas de l'appli, elle parle de physiologie — aucun metabolisme n'est
        // mesure ici — et retirer le caveat de deux chiffres caloriques n'etait pas
        // ce qui etait demande.
      '</section>';

    // --- Graphique de poids ---
    var chartHtml = "";
    // AUCUNE PESEE : le cadre, pas le silence. La carte existe des le premier jour
    // et elle porte ce que l'appli SAIT — le poids declare, l'objectif, l'ecart a
    // couvrir — plus le geste a faire. C'est le cas qui n'existait pas : a zero
    // pesee, aucune carte de poids ne s'affichait, et l'appli se taisait le jour ou
    // elle est la plus fragile.
    //
    // ⚠️ ON NE TRACE PAS DE COURBE ICI, et ce n'est pas un manque de volonte : un
    // seul point ne fait pas une ligne. Le point declare ouvre la courbe des la
    // PREMIERE vraie pesee, ce qui est exactement ce qui etait demande.
    if (!mesures.length) {
      var ecartCible = +(START_WEIGHT - TARGET_WEIGHT).toFixed(1);
      chartHtml =
        carteEntete("poids", "⚖️ Poids", "aucune pesée") +
          '<div class="total-line">Départ déclaré : <b>' + frDec(String(START_WEIGHT)) +
            ' kg</b> · objectif <b>' + frDec(String(TARGET_WEIGHT)) + ' kg</b>' +
            (ecartCible !== 0
              ? ' · ' + frDec(String(Math.abs(ecartCible))) + ' kg ' +
                (ecartCible > 0 ? 'à perdre' : 'à prendre')
              : '') +
          '</div>' +
          '<div class="ob-note">Ces deux chiffres viennent de ton diagnostic : ils sont ' +
            '<b>déclarés</b>, pas mesurés. <b>Pèse-toi une première fois</b> — au réveil, ' +
            'avant de manger — et la courbe apparaîtra ici, avec ta ligne d\'objectif. ' +
            'Il faudra une deuxième pesée pour une tendance : sur un seul point, elle ' +
            'n\'existe pas.</div>' +
        '</section>';
    }
    // LA COURBE. Elle s'ouvre des la PREMIERE vraie pesee, parce que le point
    // declare lui donne son second point — c'est tout l'objet du chantier.
    if (mesures.length >= 1) {
      var w = 300, h = 150, padX = 10, padY = 16;

      // --- Borne basse de l'echelle des dates ------------------------------
      // Mesure du defaut sur 280 px utiles : 30 pesees quotidiennes tiennent
      // dans 280 px seules, dans 24 px des qu'UNE pesee vieille de 340 jours
      // existe — 0,80 px entre deux points, les jours se touchent.
      // On borne le DESSIN, jamais les chiffres, et on ECRIT ce qu'on borne.
      var chartBorne = false, chartAnciennes = 0, cbi;
      var chartDepuis = fmt(addDays(dateFromKey(tKey), -CHART_MAX_DAYS));
      for (cbi = 0; cbi < weightSeries.length; cbi++) {
        if (weightSeries[cbi].date < chartDepuis) chartAnciennes++;
      }
      var serieVue = weightSeries, trendVu = trend;
      // Moins de deux pesees dans la fenetre : on ne borne pas. Une courbe a un
      // point ne se lit pas, et la borne aurait cache tout pour ne rien montrer.
      if (state.chartSpan !== "tout" && chartAnciennes > 0 &&
          (weightSeries.length - chartAnciennes) >= 2) {
        chartBorne = true;
        serieVue = []; trendVu = [];
        for (cbi = 0; cbi < weightSeries.length; cbi++) {
          if (weightSeries[cbi].date >= chartDepuis) serieVue.push(weightSeries[cbi]);
        }
        // La tendance est DECOUPEE, pas recalculee : weightTrend rend un point
        // par pesee, et un lissage a 7 jours reparti de zero au 1er de la
        // fenetre poserait un premier point faux.
        for (cbi = 0; cbi < trend.length; cbi++) {
          if (trend[cbi].date >= chartDepuis) trendVu.push(trend[cbi]);
        }
      }

      var values = serieVue.map(function (d) { return d.poids; });
      var bornes = [TARGET_WEIGHT, START_WEIGHT].concat(values);
      var yMin = Math.min.apply(null, bornes) - 2;
      var yMax = Math.max.apply(null, bornes) + 2;
      var ySpan = (yMax - yMin) || 1;
      var t0 = dateFromKey(serieVue[0].date).getTime();
      var t1 = dateFromKey(serieVue[serieVue.length - 1].date).getTime();
      var tSpan = (t1 - t0) || 1;
      var showRaw = state.chartMode !== "trend";

      // Sans cette condition, une premiere pesee affichait un trait de tendance
      // calcule sur un seul poids — un lissage a sept jours d'un point unique, qui
      // vaut ce point : une ligne droite qui a l'air d'une information.
      var showTrend = state.chartMode !== "raw" && mesures.length >= 2;

      function xScale(key) { return padX + ((dateFromKey(key).getTime() - t0) / tSpan) * (w - padX * 2); }
      function yScale(v) { return h - padY - ((v - yMin) / ySpan) * (h - padY * 2); }
      function pathOf(list) {
        return list.map(function (d, i) {
          return (i === 0 ? "M" : "L") + xScale(d.date).toFixed(1) + "," + yScale(d.poids).toFixed(1);
        }).join(" ");
      }

      var last = serieVue[serieVue.length - 1];
      var lastTrend = trendVu[trendVu.length - 1];
      var rawDotR = showTrend ? 2.6 : 3.4;
      var rawSvg = showRaw
        ? '<path d="' + pathOf(serieVue) + '" fill="none" style="stroke:var(--accent)" stroke-width="' + (showTrend ? 1.5 : 2.4) + '" opacity="' + (showTrend ? 0.75 : 1) + '" stroke-linejoin="round"/>' +
          serieVue.map(function (d) {
            // ⚠️ LE POINT DECLARE EST CREUX, ET CE N'EST PAS COSMETIQUE. Plein, il
            // se lirait comme une pesee : un poids donne de memoire au diagnostic
            // prendrait l'apparence d'une mesure faite sur une balance. Le cercle
            // ouvert le distingue au premier regard, et la phrase sous la courbe le
            // nomme — les deux, parce qu'une convention graphique que rien
            // n'explique n'est pas une information.
            if (d.declare) {
              return '<circle cx="' + xScale(d.date).toFixed(1) + '" cy="' + yScale(d.poids).toFixed(1) +
                '" r="' + (rawDotR + 0.8) + '" fill="none" style="stroke:var(--accent)" stroke-width="1.6"/>';
            }
            return '<circle cx="' + xScale(d.date).toFixed(1) + '" cy="' + yScale(d.poids).toFixed(1) + '" r="' + rawDotR + '" style="fill:var(--accent)"/>';

      var trendSvg = showTrend
        ? '<path d="' + pathOf(trendVu) + '" fill="none" style="stroke:var(--bleu)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'
        : "";

      // Échelle verticale. Sans repère chiffré, une courbe ne dit rien : on ne
      // sait pas à quelle hauteur on est. Les valeurs sont en HTML et non dans
      // le SVG, parce que preserveAspectRatio="none" étire le dessin en largeur
      // et déformerait tout texte placé dedans. Les lignes horizontales, elles,
      // restent horizontales quel que soit l'étirement.
      var TICK_STEP = 5;
      var ticks = [], tv;
      for (tv = Math.ceil(yMin / TICK_STEP) * TICK_STEP; tv <= yMax; tv += TICK_STEP) ticks.push(tv);
      var gridSvg = ticks.map(function (v) {
        var y = yScale(v).toFixed(1);

      }).join("");
      var yLabels = ticks.map(function (v) {
        return '<span class="chart-ytick" style="top:' + ((yScale(v) / h) * 100).toFixed(2) + '%">' + v + '</span>';

      var modeBtns = CHART_MODES.map(function (m) {

      // MASQUER SANS LE DIRE N'EST PAS ACCEPTABLE : quand la courbe est bornee,
      // l'ecran ecrit combien de pesees sont hors cadre et depuis quand, et

      // ⚠️ ET LA CARTE DIT CE QU'EST LE PREMIER POINT. Le cercle creux le distingue,

      var declareNoteHtml = aDeclare
        ? '<div class="chart-span"><span>Le premier point est le poids que tu as ' +

      var chartSpanHtml = "";
      if (chartAnciennes > 0) {
        chartSpanHtml = '<div class="chart-span">' + (chartBorne
          ? '<span>' + chartAnciennes + ' pesée' + (chartAnciennes > 1 ? 's' : '') +

            '<button type="button" class="chart-span-btn" data-action="set-chart-span"' +
              ' data-span="tout">Tout afficher</button>'
          : '<span>Toutes tes pesées sont sur la courbe, depuis le ' +
              esc(ptFinal(shortDate(weightSeries[0].date))) + '</span>' +
            '<button type="button" class="chart-span-btn" data-action="set-chart-span"' +
              ' data-span="6mois">6 derniers mois</button>') +
          '</div>';
      }

      var legend = '<span class="chart-target-label">ligne verte : objectif ' + TARGET_WEIGHT + ' kg</span>';
      if (showRaw) legend = '<span><i class="legend-swatch" style="background:var(--accent)"></i> pesées</span>' + legend;
      if (showTrend) legend = '<span><i class="legend-swatch" style="background:var(--bleu)"></i> tendance ' + TREND_WINDOW_DAYS + ' j</span>' + legend;

      chartHtml =
        carteEntete("poids",
          '📉 Poids : ' + frDec(weightDelta <= 0 ? weightDelta : "+" + weightDelta) + ' kg depuis le départ',
          mesures.length + " pesée" + (mesures.length > 1 ? "s" : "")) +
          '<div class="chart-modes" role="group" aria-label="Ce qui est affiché sur la courbe">' + modeBtns + '</div>' +
          '<div class="chart-wrap">' +
            '<div class="chart-yaxis" aria-hidden="true">' + yLabels + '</div>' +
            '<svg viewBox="0 0 ' + w + ' ' + h + '" class="weight-svg" preserveAspectRatio="none" role="img"' +
              ' aria-label="Courbe de poids de ' + frDec(serieVue[0].poids) + ' à ' + frDec(last.poids) +
              ' kg, tendance lissée à ' + frDec(lastTrend.poids.toFixed(1)) + ' kg, objectif ' + TARGET_WEIGHT + ' kg">' +
              gridSvg +
              '<line x1="0" y1="' + targetY.toFixed(1) + '" x2="' + w + '" y2="' + targetY.toFixed(1) + '" style="stroke:var(--vert)" stroke-dasharray="4 4" stroke-width="1.5"/>' +
              rawSvg + trendSvg +
            '</svg>' +
          '</div>' +
          // Dates ET poids aux deux bouts : c'est ce qui permet de lire un point.
          '<div class="chart-labels">' +
            '<span>' + esc(shortDate(serieVue[0].date)) + ' · <b>' + frDec(serieVue[0].poids) + ' kg</b></span>' +
            '<span>' + esc(shortDate(last.date)) + ' · <b>' + frDec(last.poids) + ' kg</b></span>' +
          '</div>' +
          chartSpanHtml + declareNoteHtml +
          '<div class="chart-legend">' + legend + '</div>' +
        '</section>';
    }

    // --- Progression ---
    var statHtml =
      '<div class="stat-grid">' +
        '<div class="stat-box"><div class="stat-num">' + totalDone + '</div><div class="stat-label">' +
          (totalDone > 1 ? "séances" : "séance") + '</div></div>' +
        '<div class="stat-box"><div class="stat-num">' + (attendance === null ? "-" : attendance + " %") + '</div><div class="stat-label">assiduité<br>jours prévus</div></div>' +
        // La troisieme case suit la discipline. Afficher « 0 kg soulevé » a un
        // coureur donnerait une appli cassee ; lui cacher ses kilometres aussi.
        (totalKm > 0 || (profile && profile.discipline === "course")
          ? '<div class="stat-box"><div class="stat-num">' + frDec(String(Math.round(totalKm * 10) / 10)) + ' km</div>' +
            '<div class="stat-label">parcourus<br>au total</div></div>'
          : '') +
        (totalTonnage > 0 || !(profile && profile.discipline === "course")
          ? '<div class="stat-box"><div class="stat-num">' + frPoids(totalTonnage) + '</div>' +
            '<div class="stat-label">soulevé<br>au total</div></div>'
          : '') +

    var badgesHtml = BADGES.map(function (b) {
      var unlocked = totalDone >= b.n;
      return '<div class="badge ' + (unlocked ? "badge-unlocked" : "") + '">' +
        '<div class="badge-num">' + b.n + '×</div>' +
        '<div class="badge-label">' + esc(b.label) + '</div>' +
        '<span class="sr-only">' + (unlocked ? "palier atteint" : "pas encore atteint") + '</span></div>';
    }).join("");

    // CE QUE L'HISTORIQUE NE SAIT PAS, DIT A VOIX HAUTE. Avant la premiere
    // epoque connue, l'appli n'a aucune trace des jours qui etaient prevus : elle
    // applique les plus anciens qu'elle connaisse. Le taire laisserait croire que
    // le pourcentage remonte aussi loin que le journal, ce qui est faux.
    var histoDepuisKey = joursHistoDepuis(profile);
    var histoNoteHtml = (histoDepuisKey && firstTrainKey && firstTrainKey < histoDepuisKey)
      ? '<div class="histo-note">Tes jours prévus ne sont suivis que depuis le ' +
          esc(ptFinal(shortDate(histoDepuisKey))) + ' Avant cette date, l\'assiduité est mesurée avec ' +
          'ces mêmes jours : l\'appli ne sait pas ce qui était prévu plus tôt.</div>'
      : "";

    var badgesSectionHtml =
      carteEntete("progression", "🏆 Progression",
        totalDone + " séance" + (totalDone > 1 ? "s" : "")) +
        statHtml +
        '<div class="badges">' + badgesHtml + '</div>' +
        '<div class="total-line">' +
          (firstKey ? "Depuis le " + esc(shortDate(firstKey)) : "Aucune séance enregistrée pour l'instant") +
        '</div>' + histoNoteHtml +
      '</section>';

    // Sauvegarde descendue en bas : c'est de la maintenance, on y touche une fois
    // par mois. Elle occupait la première place uniquement parce qu'elle
    // partageait sa carte avec le mode test et la date de début, tous deux
    // supprimés depuis.
    var profileHtml = "";
    if (profile) {
      var pDays = [], pdi;
      for (pdi = 0; pdi < PROGRAM_ORDER.length; pdi++) {
        pDays.push(DAY_LABELS[PROGRAM_ORDER[pdi] === 7 ? 0 : PROGRAM_ORDER[pdi]]);
      }
      var pEquip = [], pei, peq;
      for (pei = 0; pei < EQUIP_OPTIONS.length; pei++) {

      }
      if (!pEquip.length) pEquip.push("Poids de corps");
      // Une ligne = un libelle, une valeur, et l'etape qui la porte.
      //
      // EXPRESSION et non declaration : on est dans un BLOC (`if (profile)`), et
      // une declaration de fonction dans un bloc est hors specification en ES5
      // strict. Le livrable en porte deja trois — xScale, yScale, pathOf, dans
      // le meme renderInner — et Safari les accepte ; ce n'est pas une raison
      // d'en ajouter une quatrieme.
      var pRow = function (label, valeur, etape) {
        return '<button type="button" class="profile-row profile-row-btn"' +

          '<span>' + esc(label) + '</span>' +

      var pDisc = "Musculation", pdj;

      }
      var pPratique = pDisc + (profile.discipline === "muscu"
        ? "" : " · " + runLevel(profile.runLevel).label.toLowerCase());
      var pNutri = profile.nutri.meals + " repas" + (profile.nutri.supps.length
        ? ", " + profile.nutri.supps.length + " complément" + (profile.nutri.supps.length > 1 ? "s" : "")
        : "");
      profileHtml =
        carteEntete("profil",
          '👤 Mon profil' + (profile.name ? ' · ' + esc(profile.name) : ''),
          profile.days.length + " j/sem · " + profile.minutes + " min") +
          '<div class="profile-rows">' +
            pRow("Prénom", profile.name || "non renseigné", "Toi") +
            pRow("Objectif", frDec(profile.startWeight) + " → " + frDec(profile.targetWeight) + " kg", "Poids") +
            pRow("Objectif d'entraînement", objResume(profile), "Objectif") +
            // LE RANG 2 ETAIT INATTEIGNABLE. Sans cette ligne, passer de la
            // musculation seule a la course imposait de refaire tout le
            // diagnostic. Le niveau de course ne merite pas sa propre ligne : il
            // ne s'affiche que si la pratique en comporte, et il vit sur la meme
            // etape — on le pose donc en valeur, a la suite de la pratique.
            pRow("Pratique", pPratique, "Pratique") +
            pRow("Jours", pDays.join(", "), "Rythme") +
            pRow("Durée", profile.minutes + " min par séance", "Rythme") +
            pRow("Matériel", pEquip.join(", "), "Matériel") +
            (profile.noGear && profile.noGear.length
              ? pRow("Machines absentes", profile.noGear.length + " famille" +
                     (profile.noGear.length > 1 ? "s" : ""), "Matériel") : '') +
            pRow("Exercices refusés",
                 profile.excluded.length ? String(profile.excluded.length) : "aucun",
                 "Programme") +
            pRow("Nutrition", pNutri, "Nutrition") +
          '</div>' +
          '<div class="nutri-disclaimer">Touche une ligne pour la modifier. Avant d\'enregistrer, ' +
            'l\'écran te dit si ton programme ou ton plan nutrition vont être refaits.</div>' +
          '<button type="button" class="profile-btn" data-action="redo-diagnostic">↻ Refaire le diagnostic</button>' +
          '<div class="nutri-disclaimer">Refaire le diagnostic reconstruit le programme et le plan nutrition. ' +
            'Ton historique de séances n\'est pas touché : il vit dans un autre emplacement.</div>' +
        '</section>';
    }

    var THEME_OPTIONS = [
      { v: "sombre",  label: "Sombre" },
      { v: "clair",   label: "Clair" },
      { v: "systeme", label: "Système" }
    ];
    var themeBtns = "", thi;
    for (thi = 0; thi < THEME_OPTIONS.length; thi++) {
      themeBtns +=
        '<button type="button" class="chart-mode-btn' +
          (state.theme === THEME_OPTIONS[thi].v ? " chart-mode-active" : "") +
          '" data-action="set-theme" data-theme="' + THEME_OPTIONS[thi].v + '"' +
          ' aria-pressed="' + (state.theme === THEME_OPTIONS[thi].v ? "true" : "false") + '">' +
          THEME_OPTIONS[thi].label + '</button>';
    }
    var themeHtml =
      carteEntete("apparence", "Apparence",
        (state.theme === "systeme" ? "système" : (state.theme === "clair" ? "clair" : "sombre"))) +
        '<div class="chart-modes" role="group" aria-label="Thème de l\'application">' + themeBtns + '</div>' +
        '<div class="field-hint" style="margin-top:8px">' +
          (state.theme === "systeme"
            ? 'Suit le réglage de ton téléphone — actuellement ' +
              (themeSysteme() === "clair" ? "clair" : "sombre") + '.'
            : 'Choix fixe, quel que soit le réglage du téléphone.') +
        '</div>' +
      '</section>';

    var settingsHtml =
      carteEntete("sauvegarde", "Sauvegarde", "", "settings-card") +
        '<div class="field" style="margin-bottom:0">' +
          '<div class="field-label" id="backup-label">' + countKeys(log) + ' jour(s) enregistré(s) sur cet appareil' +
            (profile && profile.done ? ', plus ton profil et ton programme' : '') + '</div>' +
          '<div class="backup-row">' +
            '<button type="button" class="backup-btn" data-action="export-data" aria-describedby="backup-label">⬇ Exporter</button>' +
            '<button type="button" class="backup-btn" data-action="import-data" aria-describedby="backup-label">⬆ Importer</button>' +
          '</div>' +
          '<input type="file" id="import-file-input" accept="application/json,.json" class="sr-only">' +
        '</div>' +
      '</section>';

    var footerHtml =
      '<div class="footer-row">' +
        '<button type="button" class="update-btn" data-action="update-app">⟳ Mettre à jour l\'appli</button><br>' +
        '<button type="button" class="reset-btn" data-action="reset">↺ Réinitialiser les données</button>' +
        '<div class="version-tag">v' + esc(APP_VERSION) + ' · ' + esc(APP_BUILD) + '</div>' +
      '</div>';

    // Deux écrans : FAIRE d'un côté, REGARDER de l'autre.
    // Entre deux séries on ne consulte ni son tonnage cumulé sur trois mois ni sa
    // courbe de poids : ce sont des objets de bilan, pas des outils de séance.
    // L'écran 1 reste donc court et opérationnel.
    var isAnnexe = state.page === "annexe";
    var tabsHtml =
      '<div class="tabs" role="tablist">' +
        '<button type="button" class="tab ' + (isAnnexe ? "" : "tab-active") + '" role="tab"' +
          ' aria-selected="' + (isAnnexe ? "false" : "true") + '" data-action="set-page" data-page="seance">Séance</button>' +
        '<button type="button" class="tab ' + (isAnnexe ? "tab-active" : "") + '" role="tab"' +
          ' aria-selected="' + (isAnnexe ? "true" : "false") + '" data-action="set-page" data-page="annexe">Bilan &amp; réglages</button>' +
      '</div>' +
      '<div class="swipe-hint">' + (isAnnexe ? "← glisse vers la droite pour revenir à la séance" : "glisse vers la gauche pour le bilan →") + '</div>';

    var pageHtml = isAnnexe
      ? (nutritionHtml + iaAssistantHtml() + chartHtml + badgesSectionHtml +
         analyseHtml() + profileHtml + themeHtml + settingsHtml + footerHtml)
      : (state.bravo === editKey
          ? bravoHtml(editKey, entry, program)
          : headerHtml + heroHtml + motivationHtml + seanceHtml);

    var animCls = state.pageAnim ? " page-from-" + state.pageAnim : "";
    state.pageAnim = null;   // l'animation ne joue qu'au changement d'écran

    root.innerHTML =
      '<div class="container">' +
        '<div class="brandmark"><img src="' + ICON_DATA_URI + '" alt="" class="brandmark-icon"><span class="brandmark-text">LEMMON<b>FIT</b></span></div>' +
        tabsHtml + bannersHtml +
        '<div class="page' + animCls + '" role="tabpanel">' + pageHtml + '</div>' +
      '</div>';

    if (activeId) {
      var again = document.getElementById(activeId);
      if (again && typeof again.focus === "function") {
        again.focus();
        if (again.setSelectionRange && again.type === "text") {
          try { again.setSelectionRange(again.value.length, again.value.length); } catch (e) {}
        }
      }
    }

    // APRES le focus, et c'est voulu : rendre le focus a un champ le fait
    // defiler dans la vue. Poser la position ensuite ecrase ce deplacement par
    // celle d'avant le rendu — celle ou l'utilisateur regardait, et ou le champ
    // etait donc deja visible.
    scrollRendre(scrollAvant);
  }


  // ===========================================================================
  // DIAGNOSTIC DE PREMIÈRE UTILISATION
  // ---------------------------------------------------------------------------
  // Sept étapes, une question par écran. Le brouillon vit dans state.ob et n'est
  // écrit dans les réglages qu'à la validation finale : abandonner en cours de
  // route ne laisse rien derrière.
  // Le journal n'est JAMAIS touché, ni pendant, ni à la fin. Refaire le
  // diagnostic change le programme à venir, pas une seule séance passée.
  // ===========================================================================
  // Les etapes sont designees par leur NOM et non par leur rang : inserer
  // « Pratique » au milieu aurait sinon oblige a renumeroter chaque branche du
  // rendu, et une seule oubliee affiche la mauvaise question.
  var OB_STEPS = ["Toi", "Poids", "Objectif", "Pratique", "Rythme", "Matériel", "Programme", "Nutrition", "C'est parti"];
  // 45 EST DANS LA LISTE PARCE QUE C'EST LA VALEUR PAR DEFAUT. Sans elle, le
  // premier ecran que voit un nouvel utilisateur affichait cinq boutons dont
  // AUCUN n'etait selectionne, sous une phrase qui annonce « de 45 minutes ».
  // Le lien est tenu par un controle de banc : toute valeur par defaut doit
  // etre offerte, sinon elle est invisible.
  var MINUTE_CHOICES = [30, 40, 45, 50, 60, 75];
  var DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];   // la semaine française commence lundi

  function obStart(fromProfile, etape) {
    var d = fromProfile ? cleanProfile(fromProfile) : defaultProfile();
    if (!d) d = defaultProfile();
    d.done = false;
    state.ob = { step: 0, draft: d, error: null, hasLog: countKeys(state.log) > 0,
                 direct: false, avant: null };
    // RETOUCHE D'UNE SEULE ETAPE. `avant` garde le profil TEL QU'IL EST avant
    // modification : c'est lui qui permet de dire ce qui va changer avant la
    // validation, et de ne reconstruire que ce qui a reellement bouge. Sans
    // profil de depart il n'y a rien a retoucher — on reste sur le diagnostic
    // complet, qui est le chemin du premier lancement.
    if (fromProfile && typeof etape === "number" &&
        etape >= 0 && etape < OB_STEPS.length) {
      state.ob.step = etape;
      state.ob.direct = true;
      state.ob.avant = cleanProfile(fromProfile);
    }
  }

  // Rang d'une etape par son NOM. Les rangs ne sont ecrits nulle part a la main :
  // inserer une etape dans OB_STEPS ferait sinon pointer chaque ligne de la carte
  // profil sur l'etape d'a cote, en silence.
  function obEtapeRang(nom) {
    var i;
    for (i = 0; i < OB_STEPS.length; i++) { if (OB_STEPS[i] === nom) return i; }
    return 0;
  }

  // CE QUI COMMANDE QUOI. Un champ peut commander les deux (les jours : le
  // programme ET les besoins), un seul (le materiel ne change pas l'assiette, le
  // poids cible ne change pas le programme), ou aucun (le prenom).
  var OB_CHAMPS = [
    { c: "name",         l: "ton prénom",                   plan: false, nutri: false },
    { c: "sex",          l: "ton sexe",                      plan: false, nutri: true },
    { c: "startWeight",  l: "ton poids",                     plan: false, nutri: true },
    { c: "targetWeight", l: "ton objectif",                  plan: false, nutri: true },
    { c: "objectif",     l: "ton objectif d'entraînement",   plan: true,  nutri: false },
    { c: "zones",        l: "tes zones à développer",        plan: true,  nutri: false },
    { c: "minutes",      l: "la durée des séances",          plan: true,  nutri: false },
    { c: "days",         l: "tes jours",                     plan: true,  nutri: true },
    { c: "discipline",   l: "ta pratique",                   plan: true,  nutri: true },
    { c: "runLevel",     l: "ton niveau de course",          plan: true,  nutri: false },
    { c: "dayKinds",     l: "la répartition muscu / course", plan: true,  nutri: true },
    { c: "equipment",    l: "ton matériel",                  plan: true,  nutri: false },
    { c: "noGear",       l: "les machines absentes",         plan: true,  nutri: false },
    { c: "excluded",     l: "les exercices refusés",         plan: true,  nutri: false },
    { c: "nutri",        l: "tes habitudes alimentaires",    plan: false, nutri: true }
  ];

  // Egalite de VALEUR, en profondeur. Ecrite a la main plutot que par un
  // aller-retour JSON.stringify : l'ordre des cles d'un objet n'est pas garanti,
  // et `dayKinds` est justement construit par ajouts et suppressions successifs
  // au fil des taps. Deux profils identiques ressortiraient differents.
  function memeValeur(a, b) {
    var k, na = 0, nb = 0, i, sa, sb, plats;
    if (a === b) return true;
    if (a === null || b === null || a === undefined || b === undefined) return false;
    if (typeof a !== "object" || typeof b !== "object") return false;
    if (isArray(a) !== isArray(b)) return false;
    if (isArray(a)) {
      if (a.length !== b.length) return false;
      sa = a.slice(); sb = b.slice(); plats = true;
      for (i = 0; i < sa.length; i++) { if (sa[i] && typeof sa[i] === "object") plats = false; }
      // L'ORDRE D'UNE LISTE DE CHOIX NE VEUT RIEN DIRE. Decocher puis recocher
      // « haltères » le renvoie en fin de tableau. Comparer l'ordre ferait
      // reconstruire le programme pour un aller-retour qui n'a rien change, donc
      // perdre des charges visees pour rien.
      if (plats) { sa.sort(); sb.sort(); }
      for (i = 0; i < sa.length; i++) { if (!memeValeur(sa[i], sb[i])) return false; }
      return true;
    }
    for (k in a) { if (has(a, k)) { na++; if (!memeValeur(a[k], b[k])) return false; } }
    for (k in b) { if (has(b, k)) nb++; }
    return na === nb;
  }

  // Rend { plan, nutri, champs } : ce qu'il faut reconstruire, et les libelles de
  // ce qui a bouge pour pouvoir le DIRE.
  function obDiff(avant, apres) {
    var res = { plan: false, nutri: false, champs: [] }, i, c;
    if (!avant || !apres) return { plan: true, nutri: true, champs: [] };
    for (i = 0; i < OB_CHAMPS.length; i++) {
      c = OB_CHAMPS[i];
      if (memeValeur(avant[c.c], apres[c.c])) continue;
      res.champs.push(c.l);
      if (c.plan) res.plan = true;
      if (c.nutri) res.nutri = true;
    }
    return res;
  }

  // CE QUI VA CHANGER, DIT AVANT LA VALIDATION. Recalcule a chaque rendu : la
  // phrase bouge pendant qu'on touche aux boutons. « Modifier mes jours va
  // refaire mon programme » doit se lire AVANT le tap, pas se decouvrir apres.
  function obAvertissement(d) {
    var diff = obDiff(state.ob.avant, d), quoi;
    if (!diff.champs.length) {
      return '<div class="ob-note">Rien n\'a changé pour l\'instant. Enregistrer ne touchera à rien.</div>';
    }
    quoi = "Tu changes " + diff.champs.join(", ") + ".";
    if (diff.plan) {
      return '<div class="ob-warn ob-warn-soft"><b>' + esc(quoi) + '</b><br>' +
        'Ton programme va être <b>refait</b> : les charges visées que l\'analyse avait ' +
        'ajustées sont recalculées. Ton plan nutrition est refait avec lui, et les prises ' +
        'cochées avant aujourd\'hui ne comptent plus dans le bilan. ' +
        'Ton historique de séances, lui, n\'est pas touché.</div>';
    }
    if (diff.nutri) {
      return '<div class="ob-warn ob-warn-soft"><b>' + esc(quoi) + '</b><br>' +
        'Ton <b>plan nutrition</b> va être refait ; tes corrections de prises sont reportées ' +
        'quand le créneau existe encore. Ton programme et ton historique ne bougent pas.</div>';
    }
    return '<div class="ob-note"><b>' + esc(quoi) + '</b><br>' +
      'Ni ton programme ni ton plan nutrition ne changent.</div>';
  }

  // LA PHRASE DE PIED, TIREE DU MEME DIFF QUE L'AVERTISSEMENT. Elle promettait
  // « le reste de ton profil ne bouge pas » deux lignes sous un avertissement
  // qui annonçait le contraire. Ce qu'elle a de vrai — on n'édite qu'un réglage
  // — est gardé ; ce qu'elle avait de faux est calculé au lieu d'être écrit en
  // dur.
  function obRassurance(d) {
    var diff = obDiff(state.ob.avant, d);
    if (diff.plan) {
      return 'Tu ne modifies que ce réglage : les autres étapes de ton diagnostic ' +
             'restent telles quelles. Ce sont ton programme et ton plan nutrition, ' +
             'eux, qui en découlent et sont refaits.';
    }
    if (diff.nutri) {
      return 'Tu ne modifies que ce réglage : les autres étapes de ton diagnostic ' +
             'restent telles quelles. Seul ton plan nutrition en découle et est refait.';
    }
    return 'Seul ce réglage est modifié. Le reste de ton profil ne bouge pas.';
  }

  function obDraft() { return state.ob.draft; }

  // Programme d'aperçu, reconstruit à chaque rendu de l'étape 4 pour que le
  // remplacement d'un exercice refusé soit visible immédiatement.
  function obPreview() {
    try { return buildPlan(obDraft()); } catch (e) { return {}; }
  }

  function obCanAdvance(step) {
    var d = obDraft(), nom = OB_STEPS[step];
    if (nom === "Poids") return d.startWeight > 0 && d.targetWeight > 0;
    if (nom === "Objectif") return obObjectifOk(d);
    if (nom === "Rythme") return d.days.length >= 1 && obMixteOk(d);
    if (nom === "Pratique") return obMixteOk(d);
    return true;
  }

  // Jours affectes a la course, dans l'ordre de la semaine.
  function obJoursCourse(d) {
    var out = [], i;
    for (i = 0; i < d.days.length; i++) {
      if (kindOfDay(d, d.days[i]) === "course") out.push(d.days[i]);
    }
    return out;
  }

  // LE SELECTEUR « QUEL JOUR FAIT QUOI », EN UN SEUL EXEMPLAIRE.
  //
  // Il vivait en ligne dans la branche « Rythme » du rendu, et c'est pour ca
  // que l'etape « Pratique » ne l'avait pas : choisir « Les deux » depuis le
  // profil menait a un profil mixte a zero jour de course, enregistre, annonce
  // comme une reussite. En sortir une fonction plutot que d'en ecrire un second
  // est la seule facon d'etre sur que les deux ecrans montrent la MEME chose —
  // deux copies divergent, toujours, et c'est celle qu'on n'a pas touchee qui
  // rouvre le trou.
  //
  // LE COMPTEUR DIT AUSSI QUAND ÇA NE VA PAS. A zero jour de course, ce n'est
  // plus une information neutre mais la raison pour laquelle le bouton
  // « Enregistrer » est gris : il le DIT, au lieu de laisser chercher.
  function obMixHtml(d) {
    if (d.discipline !== "mixte" || !d.days.length) return "";
    var jours = d.days.slice().sort(function (a, b) { return dayKey(a) - dayKey(b); });
    var mixBtns = "", i, jc;
    for (i = 0; i < jours.length; i++) {
      jc = kindOfDay(d, jours[i]) === "course";
      mixBtns +=
        '<button type="button" class="ob-kind' + (jc ? " ob-kind-run" : "") + '"' +
          ' data-action="ob-daykind" data-d="' + jours[i] + '"' +
          ' aria-label="' + DAY_FULL[jours[i]] + ' : ' + (jc ? "course" : "musculation") + ', toucher pour changer">' +
          '<span class="ob-kind-day">' + DAY_LABELS[jours[i]] + '</span>' +
          '<span class="ob-kind-what">' + (jc ? "course" : "muscu") + '</span>' +
        '</button>';
    }
    var nb = d.days.length, nCourse = obJoursCourse(d).length;
    return '<div class="ob-gear">' +
      '<div class="field-label">Quel jour fait quoi ?</div>' +
      '<div class="field-hint" style="margin-bottom:10px">Touche un jour pour le basculer.</div>' +
      '<div class="ob-kinds">' + mixBtns + '</div>' +
      (nCourse === 0
        ? '<div class="ob-warn">' + nb + ' en salle, <b>0 en course</b>. Tu as choisi ' +
            '« les deux » : touche au moins un jour pour en faire une sortie, sinon ton ' +
            'programme n\'aurait que de la musculation.</div>'
        : '<div class="ob-note">' + (nb - nCourse) + ' en salle, ' + nCourse + ' en course.</div>') +
      '</div>';
  }

  // UN PROFIL MIXTE SANS UNE SEULE SORTIE N'EST PAS UN REGLAGE, C'EST UNE
  // CONTRADICTION. Mesure des trois chemins avant correction — edition depuis
  // « Pratique », edition depuis « Rythme », diagnostic complet : les trois
  // enregistraient discipline="mixte" avec dayKinds vide et zero seance de
  // course. Le defaut n'etait donc pas dans un ecran, il etait dans l'absence
  // de cette question-la.
  //
  // Le cas « aucun jour choisi » n'est PAS traite ici : « Rythme » le bloque
  // deja par lui-meme. Le rattraper une seconde fois enfermerait l'utilisateur
  // a l'etape « Pratique », d'ou les jours ne se choisissent pas.
  function obMixteOk(d) {
    if (d.discipline !== "mixte") return true;
    if (!d.days.length) return true;
    return obJoursCourse(d).length > 0;
  }
  var OB_ERR_MIXTE = "Tu as choisi « les deux », mais aucun jour n'est en course : " +
    "ton programme n'aurait que de la musculation. Touche au moins un jour pour " +
    "en faire une sortie.";

  function obBtn(action, label, extra, active) {
    return '<button type="button" class="ob-chip' + (active ? " ob-chip-on" : "") + '"' +
      ' data-action="' + action + '"' + (extra || "") +
      ' aria-pressed="' + (active ? "true" : "false") + '">' + esc(label) + '</button>';
  }

  // ===========================================================================
  // L'ETAPE « OBJECTIF » DU DIAGNOSTIC
  // ---------------------------------------------------------------------------
  // Elle vient JUSTE APRES « Poids », et pas ailleurs : la question porte sur
  // les deux nombres qu'on vient de saisir, et les relire une page plus loin
  // demanderait de se souvenir de ce qu'on a tape.
  //
  // CE N'EST PAS UN CHOIX LIBRE, C'EST UNE CONFIRMATION. La branche est proposee
  // par l'ecart entre les deux poids ; les deux autres restent atteignables,
  // mais elles sont ecrites comme ce qu'elles sont — un desaccord avec les
  // chiffres saisis — et l'ecran DIT alors quoi corriger. Sans cette phrase,
  // quelqu'un pouvait enregistrer « prendre de la masse » avec une cible cinq
  // kilos plus bas et recevoir un plan nutrition en deficit sous un programme de
  // prise, sans qu'aucun ecran ne signale la contradiction.
  //
  // LES ZONES NE SORTENT QU'EN PRISE, et le bouton reste gris tant qu'aucune
  // n'est choisie. Une prise de masse sans zone visee est un objectif valable —
  // « tout le corps » — mais alors la question n'aurait servi a rien ; on demande
  // donc au moins une zone, et « tout le corps » se dit en les cochant toutes.
  // ===========================================================================

  // Une zone se coche et se decoche. Rien d'autre a savoir, mais ca vit ICI :
  // le repartiteur d'evenements ne doit connaitre que le nom du geste.
  function obZoneBascule(d, v) {
    if (!zoneDef(v)) return;
    if (!isArray(d.zones)) d.zones = [];
    var i = d.zones.indexOf(v);
    if (i >= 0) d.zones.splice(i, 1); else d.zones.push(v);
  }

  // CHANGER D'OBJECTIF NE VIDE PAS LES ZONES. Quelqu'un qui hesite entre prise
  // et tonification fait l'aller-retour deux fois ; lui effacer ses sept coches
  // a chaque passage serait une punition. Elles dorment — zonesDe les ignore
  // hors prise — et se reveillent s'il revient.
  function obObjectifChoisir(d, v) {
    if (!objectifDef(v)) return;
    d.objectif = v;
  }

  // La regle d'avancement de l'etape. Elle est ICI et pas dans obCanAdvance pour
  // la meme raison que tout le reste : c'est une regle metier.
  function obObjectifOk(d) {
    if (!objectifDef(d.objectif)) return false;
    if (d.objectif !== "prise") return true;
    return zonesDe(d).length > 0;
  }

  // ===========================================================================
  // LA DIRECTION SE LIT SUR L'ECRAN OU L'ON SAISIT LES DEUX POIDS
  // ---------------------------------------------------------------------------
  // Demande d'Olivier, mot pour mot : « quand je renseigne le poids avant et
  // apres, c'est sur cet ecran que je dois voir si je suis en train de chercher
  // une perte, une prise ou une tonification ».
  //
  // IL AVAIT RAISON, ET LE CAS LE PLUS PARLANT NE DISAIT RIEN DU TOUT. L'ecran
  // « Poids » affichait bien une note quand les deux nombres different — « 7 kg
  // a perdre, compte 12 a 20 semaines » —, mais il ne NOMMAIT jamais la
  // direction, et a poids EGAL il n'affichait strictement rien : capture d'ecran
  // a l'appui, 80 kg pour 80 kg rendait une carte muette. Le seul ecran ou l'on
  // decide de son objectif ne disait pas quel objectif on venait de decrire.
  //
  // ET LA REGLE ELLE-MEME EST ECRITE. Ce n'est pas seulement « voila ta
  // direction » : c'est « voila comment les trois se lisent », pour qu'on puisse
  // corriger un nombre en sachant ce que ca change AVANT de passer a la suite.
  //
  // UNE SEULE SOURCE POUR LES DEUX ECRANS. La direction vient d'objectifSuggere,
  // exactement comme l'etape « Objectif » qui suit. Deux calculs auraient
  // diverge, et l'appli aurait annonce une perte a une etape et proposerait une
  // prise a la suivante.
  function obCapHtml(d) {
    var sugg = objectifSuggere(d.startWeight, d.targetWeight);
    var dit;
    if (sugg === "perte") {
      dit = "Tes deux nombres décrivent une <b>perte de poids</b> : garder le muscle " +
            "pendant que la balance descend.";
    } else if (sugg === "prise") {
      dit = "Tes deux nombres décrivent une <b>prise de masse</b> : tu choisiras à l'étape " +
            "suivante quelles zones musculaires développer.";
    } else {
      dit = "Tes deux nombres sont les mêmes : c'est une <b>tonification</b> — garder ce poids, " +
            "gagner du muscle et perdre du gras. C'est un objectif à part entière, pas une absence d'objectif.";
    }
    return '<div class="ob-note">' + dit + '</div>' +
      '<div class="ob-gear">' +
        '<div class="field-label">Les trois parcours, et comment ils se lisent</div>' +
        '<div class="field-hint">' +
          'Objectif <b>plus bas</b> que ton poids d\'aujourd\'hui → perte de poids.<br>' +
          'Objectif <b>plus haut</b> → prise de masse, et tu choisis les zones à développer.<br>' +
          'Les deux à moins de ' + esc(frDec(OBJ_ECART_NUL)) + ' kg d\'écart → tonification à poids constant.<br>' +
          'Tu confirmes à l\'étape suivante, et <b>c\'est ce choix qui construit ton programme</b> : ' +
          'les séances ne sont pas les mêmes dans les trois cas.' +
        '</div>' +
      '</div>';
  }

  function obObjectifHtml(d) {
    var sugg = objectifSuggere(d.startWeight, d.targetWeight);
    var ecart = Math.round(Math.abs(d.startWeight - d.targetWeight) * 10) / 10;
    var i, btns = "", o, on;

    // L'ENTETE DIT LES CHIFFRES QU'ON VIENT DE SAISIR. C'est ce qui transforme
    // la question en confirmation : on ne demande pas « que veux-tu faire ? »
    // dans le vide, on demande « c'est bien ce que disent tes deux nombres ? »
    var lead;
    if (sugg === "perte") {
      lead = "Tu as saisi <b>" + esc(frDec(d.startWeight)) + " kg</b> aujourd'hui pour <b>" +
        esc(frDec(d.targetWeight)) + " kg</b> visés, soit <b>" + esc(frDec(ecart)) +
        " kg à perdre</b>. Confirme, ou change ton choix si ce n'est pas ça.";
    } else if (sugg === "prise") {
      lead = "Tu as saisi <b>" + esc(frDec(d.startWeight)) + " kg</b> aujourd'hui pour <b>" +
        esc(frDec(d.targetWeight)) + " kg</b> visés, soit <b>" + esc(frDec(ecart)) +
        " kg à prendre</b>. Confirme, ou change ton choix si ce n'est pas ça.";
    } else {
      lead = "Ton poids d'aujourd'hui et ton objectif sont les mêmes, à moins de " +
        esc(frDec(OBJ_ECART_NUL)) + " kg près. Ce n'est pas rien : c'est un objectif à part entière.";
    }

    for (i = 0; i < OBJECTIFS.length; i++) {
      o = OBJECTIFS[i];
      on = d.objectif === o.v;
      btns +=
        '<button type="button" class="ob-equip' + (on ? " ob-equip-on" : "") + '"' +
          ' data-action="ob-objectif" data-v="' + o.v + '" aria-pressed="' + (on ? "true" : "false") + '">' +
          '<span class="ob-equip-box" aria-hidden="true">' + (on ? "✓" : "") + '</span>' +
          '<span class="ob-equip-text"><b>' + esc(o.label) +
            (o.v === sugg ? " · proposé" : "") + '</b><span>' + esc(o.hint) + '</span></span>' +
        '</button>';
    }

    // LE DESACCORD SE DIT, ET IL DIT QUOI FAIRE. Confirmer « prise » avec une
    // cible plus basse n'est pas interdit — c'est peut-etre la cible qui est
    // fausse — mais alors les deux ecrans doivent se parler.
    var contra = "";
    if (objectifDef(d.objectif) && d.objectif !== sugg) {
      if (d.objectif === "prise" && sugg === "perte") {
        contra = '<div class="ob-warn">Tu confirmes une <b>prise de masse</b> alors que ton objectif de poids est ' +
          'plus BAS que ton poids d\'aujourd\'hui. Le programme sera bien construit pour la prise, mais l\'assiette ' +
          'restera calculée en déficit. Reviens à l\'étape précédente pour relever ton objectif de poids.</div>';
      } else if (d.objectif === "perte" && sugg === "prise") {
        contra = '<div class="ob-warn">Tu confirmes une <b>perte de poids</b> alors que ton objectif de poids est ' +
          'plus HAUT que ton poids d\'aujourd\'hui. L\'assiette sera calculée en surplus. Reviens à l\'étape ' +
          'précédente pour baisser ton objectif de poids.</div>';
      } else {
        contra = '<div class="ob-note">Ce n\'est pas ce que disent tes deux poids, et c\'est ton droit. ' +
          'L\'assiette suit les kilos ; le programme suit ce choix-ci.</div>';
      }
    }

    // LES ZONES. Elles ne sortent qu'en prise, et l'ecran dit ce qu'elles font —
    // sans quoi on coche au hasard.
    var zonesHtml = "";
    if (d.objectif === "prise") {
      var zb = "", z, zon, nz = zonesDe(d).length;
      for (i = 0; i < ZONES.length; i++) {
        z = ZONES[i];
        zon = isArray(d.zones) && d.zones.indexOf(z.v) >= 0;
        zb += obBtn("ob-zone", z.label, ' data-v="' + z.v + '"', zon);
      }
      zonesHtml =
        '<div class="ob-gear">' +
          '<div class="field-label">Quelles zones veux-tu développer ?</div>' +
          '<div class="field-hint" style="margin-bottom:10px">Les exercices qui servent ces zones gagnent une série ' +
            'et ne sont plus les premiers retirés quand la séance déborde. Coche tout si tu veux du volume partout.</div>' +
          '<div class="ob-row ob-row-wrap">' + zb + '</div>' +
          (nz
            ? '<div class="ob-note">' + nz + ' zone' + (nz > 1 ? "s" : "") + ' visée' + (nz > 1 ? "s" : "") + '.</div>'
            : '<div class="ob-warn">Choisis au moins une zone pour continuer.</div>') +
        '</div>';
    }

    // CE QUE LE PROGRAMME VA FAIRE, ECRIT AVANT DE LE CONSTRUIRE. C'est la
    // reponse a « la question est-elle decorative ? », et elle est a l'ecran.
    var effet = "";
    if (d.objectif === "prise") {
      effet = '<div class="ob-note">Les journées de HIIT et de cardio sont remplacées par du travail avec charges, ' +
        'les répétitions descendent et le repos s\'allonge.</div>';
    } else if (d.objectif === "tonifier") {
      effet = '<div class="ob-note">Mêmes exercices, plus de répétitions et moins de repos : c\'est le repos raccourci ' +
        'qui fait le travail ici.</div>';
    } else if (d.objectif === "perte") {
      effet = '<div class="ob-note">Le repos raccourcit d\'un cran — c\'est la densité qui compte en déficit, pas la ' +
        'charge maximale — et le temps ainsi libéré garde le gainage et le cardio dans la séance, au lieu ' +
        'd\'en faire les premiers retirés.</div>';
    }

    return '<p class="ob-lead">' + lead + '</p>' +
      '<div class="ob-equip-list">' + btns + '</div>' +
      contra + zonesHtml + effet;
  }

  function renderOnboarding() {
    var d = obDraft(), step = state.ob.step, body = "", i;
    var etape = OB_STEPS[step];

    var dots = "";
    for (i = 0; i < OB_STEPS.length; i++) {
