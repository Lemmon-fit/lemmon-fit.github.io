          ? '<div class="stat-box"><div class="stat-num">' +
            frDec(String(Math.round(km * 10) / 10)) + ' km</div>' +
            '<div class="stat-label">parcourus</div></div>'
          : '') +
      '</div>';

    return '<section class="card">' +
      '<div class="card-title">✓ Séance validée</div>' +
      '<div class="total-line">' + esc(program ? program.label : "Séance libre") +
        ' · ' + esc(longDate(dateKey)) + '</div>' +
      chiffres +
      '<div class="ob-note">' + esc(phrase) + '</div>' +
      '<div class="total-line">' +
        (suivant
          ? 'Prochaine séance : ' + esc(longDate(suivant))
          : 'Aucune séance prévue dans les huit prochains jours.') +
      '</div>' +
      '<button type="button" class="btn-primary" data-action="bravo-fermer">Continuer</button>' +
    '</section>';
  }

  function analyseHtml() {
    if (!profile || !profile.done || !profile.plan) return "";

    // LE TITRE EST L'ENTETE, et le repliage a remplace la bascule « Analyser mes
    // seances ». Le corps est donc construit inconditionnellement : voir l'en-tete
    // de la chaine sur ce que ce choix coute et pourquoi il est fait.
    var a = analyser();
    var entete = carteEntete("analyse", "📊 Analyse de tes séances",
      a.propositions.length
        ? (a.propositions.length + " proposition" + (a.propositions.length > 1 ? "s" : ""))
        : "rien à changer");
    var corps = "";

    // --- Ce qui n'est PLUS dans la liste, et pourquoi --------------------------
    // Sans cette phrase, un exercice remplacé par un chronométré disparaissait
    // du constat sans un mot, et n'y revenait pas. Elle est calculée ici et
    // rendue par les TROIS sorties de cette carte : la ligne manque tout autant
    // quand il n'y a pas encore de quoi conclure.
    var horsHtml = "";
    if (a.horsAnalyse.length) {
      var horsNoms = "", hi;
      for (hi = 0; hi < a.horsAnalyse.length; hi++) {
        horsNoms += (hi ? ", " : "") + a.horsAnalyse[hi].nom;
      }
      var plusieurs = a.horsAnalyse.length > 1;
      horsHtml =
        '<div class="ob-note">' +
          (plusieurs ? 'Ces exercices ne sont plus dans la liste : <b>'
                     : 'Cet exercice n\'est plus dans la liste : <b>') +
          esc(horsNoms) + '</b>. ' +
          (plusieurs ? 'Ils se tiennent' : 'Il se tient') +
          ' au chronomètre depuis leur remplacement, et cette analyse ne compare ' +
          'que des charges. ' + (plusieurs ? 'Ils restent' : 'Il reste') +
          ' dans ta séance et se coche' + (plusieurs ? 'nt' : '') + ' comme avant.' +
        '</div>';
    }

    if (!a.exploitables) {
      // Un programme 100 % course ne contient AUCUN exercice en track "load" :
      // analyser() n'a rien à balayer et exploitables vaut 0 pour toujours.
      // Répondre « pas encore assez de séances » à quelqu'un qui a couru dix-sept
      // fois est doublement faux — il en a, et il en aura toujours plus. On
      // nomme la vraie raison au lieu de lui promettre un verdict qui ne viendra
      // jamais.
      //
      // On ne rend délibérément PAS la carte du pont IA ici : pour un plan sans
      // fonte, le bilan envoyé se réduirait à « aucune séance avec charge
      // enregistrée », c'est-à-dire un appel facturé sans donnée.
      var aDeLaFonte = false, axk, axi;
      for (axk in PROGRAM) {
        if (!has(PROGRAM, axk)) continue;
        for (axi = 0; axi < PROGRAM[axk].exercises.length; axi++) {
          if (PROGRAM[axk].exercises[axi].track === "load") { aDeLaFonte = true; break; }
        }
        if (aDeLaFonte) break;
      }
      if (!aDeLaFonte) {
        corps =
          '<div class="ob-note">Ton programme est <b>100 % course</b>. Cette analyse ne porte ' +
          'que sur les exercices avec charge : elle n\'a rien à dire sur des kilomètres. ' +
          'Tes sorties se comparent à la précédente dans l\'écran de la séance, et tes ' +
          'kilomètres sont totalisés juste au-dessus.</div>';
        return entete + horsHtml + corps + '</section>';
      }
      // Exactement ce que demandait le cahier des charges : pas de verdict tant
      // qu'il n'y a pas de quoi en tirer un.
      //
      // ... MAIS ON ANNONCE CE QUI VIENDRA. Mesure avant correction : avec un
      // journal vide, cette carte rendait 414 caracteres et RIEN du pont IA —
      // pas de bouton de copie, pas de zone de collage, pas meme son titre,
      // parce que la fonction sort ici, avant de les construire (`iaHtml()` est
      // appele tout en bas de analyseHtml). Consequence : impossible de savoir
      // que la fonctionnalite existe avant de l'avoir meritee. Le proprietaire
      // de l'appli l'a cherchee sans la trouver.
      //
      // ON DECRIT, ON N'AFFICHE PAS. Un bouton de copie rendu ici serait un
      // bouton qui ne marche pas — il n'y a rien a copier. La phrase dit donc
      // ce qui APPARAITRA, a cet endroit precis (le pont se rend bien dans
      // cette carte-ci), et rien de plus : aucune promesse sur ce que l'IA
      // repondra, aucun geste propose qui echouerait.
      //
      // Elle redit aussi que l'abonnement suffit — meme information que la
      // carte « Reglages avances », a l'endroit ou la question se pose vraiment.
      //
      // CETTE PHRASE N'EST PAS DANS LA BRANCHE « 100 % COURSE », juste au-dessus,
      // et ce n'est pas un oubli : pour un plan sans fonte le pont ne s'ouvrira
      // JAMAIS — `exploitables` y vaut zero pour toujours. L'annoncer serait
      // promettre un ecran qui ne viendra pas. Voir le commentaire de cette
      // branche, qui refuse deja de rendre le pont pour la meme raison.
      var manque = ANA_MIN_SEANCES;
      corps = anaPropsBlocHtml(a.propositions) +
        '<div class="ob-note">Pas encore de quoi conclure. Il faut au moins <b>' + manque +
        ' séances par exercice</b> pour qu\'une tendance veuille dire quelque chose. ' +
        'Reviens quand tu en auras fait quelques-unes de plus. ' +
        'Pour faire relire ton bilan par une IA, la carte <b>Assistant IA</b> est ' +
        'plus bas — elle ne t\'attend pas, elle marche dès maintenant. Ton abonnement ' +
        'habituel suffit, il n\'y a rien à installer.</div>';
      return entete + horsHtml + corps + '</section>';
    }

    // --- Propositions ---------------------------------------------------------
    if (a.propositions.length) {
      corps += anaPropsBlocHtml(a.propositions);
    } else {
      corps += '<div class="ob-note">Rien à changer pour l\'instant. Continue comme ça.</div>';
    }

    // --- Constat par exercice -------------------------------------------------
    var lignes = "", ei;
    for (ei = 0; ei < a.exercices.length; ei++) {
      var x = a.exercices[ei];
      var et = ETATS[x.etat] || ETATS.ok;
      lignes +=
        '<div class="ana-ligne">' +
          '<span class="ana-pastille ' + et.cls + '" aria-hidden="true">' + et.pastille + '</span>' +
          '<span class="ana-ligne-texte">' +
            '<b>' + esc(x.nom) + '</b>' +
            '<span>' + esc(x.texte) + '</span>' +
          '</span>' +
        '</div>';
    }
    corps +=
      '<div class="ana-bloc">' +
        '<div class="field-label">Exercice par exercice</div>' + lignes +
      '</div>';

    // --- Honnêteté sur les seuils ---------------------------------------------
    corps +=
      '<div class="nutri-disclaimer">' +
        'Les règles de charge suivent la règle des 2-pour-2 et la position de l\'ACSM. ' +
        'En revanche <b>aucune définition validée du plateau n\'existe</b> : le seuil de ' +
        'stagnation utilisé ici est une convention, pas un résultat de recherche. ' +
        'Ces propositions ne remplacent pas l\'œil d\'un coach.' +
      '</div>';

    // --- Pont vers une IA -----------------------------------------------------
    // Place APRES le constat déterministe, et ce n'est pas un détail de mise en
    // page : ce qui se calcule hors ligne se lit d'abord, l'avis extérieur
    // vient en complément. L'inverse ferait passer le moteur pour un lot de
    // consolation.

    // --- Journal des ajustements ----------------------------------------------
    if (profile.journal && profile.journal.length) {
      var jl = "", ji, jrn = profile.journal.slice(-6).reverse();
      for (ji = 0; ji < jrn.length; ji++) {
        jl += '<div class="ana-jrn"><span>' + esc(shortDate(jrn[ji].date)) + '</span>' +
              esc(jrn[ji].texte) + '</div>';
      }
      corps += '<div class="ana-bloc"><div class="field-label">Derniers ajustements</div>' + jl + '</div>';
    }

    return entete + horsHtml + corps + '</section>';
  }


  // ===========================================================================
  // PONT PRESSE-PAPIER VERS UNE IA
  // ---------------------------------------------------------------------------
  // Pourquoi un presse-papier et pas une connexion. Se brancher sur le compte IA
  // grand public déjà installé sur le téléphone est IMPOSSIBLE : chez les cinq
  // fournisseurs, l'abonnement et l'API sont deux produits à facturation
  // étanche, « Sign in with ChatGPT » ne rend que l'identité, et Anthropic
  // interdit explicitement l'usage tiers d'un jeton consommateur. Le
  // presse-papier n'est donc pas un pis-aller en attendant mieux : c'est le seul
  // chemin qui marche sans rien demander à personne, et il marche hors ligne
  // jusqu'au moment du collage.
  //
  // LE TEXTE QUI PART EST MONTRÉ. Ces données quittent l'appli pour un service
  // tiers ; les afficher avant l'envoi n'est pas une politesse, c'est la seule
  // façon de décider en connaissance de cause.
  //
  // LA RÉPONSE EST TRAITÉE COMME HOSTILE. Un modèle de langage se trompe, invente
  // des identifiants, et le texte collé peut ne pas venir de lui du tout. Rien
  // n'est appliqué sur sa parole : chaque ligne est revalidée contre le mandat
  // par iaLire(), et ce qui ne passe pas est compté et montré, jamais avalé en
  // silence. Le mandat n'est pas dans le prompt — un prompt se contourne — il est
  // dans le validateur.
  //
  // CE PROMPT EST DU TEXTE AFFICHE, DONC IL EST ACCENTUE. Il a longtemps ete en
  // ASCII nu ; ce n'etait pas un choix, c'etait un oubli. La carte le presente
  // elle-meme comme « affiche en entier pour que tu voies exactement ce que tu
  // envoies » : c'est le seul texte que l'appli demande de LIRE avant de decider
  // d'envoyer ses donnees a un tiers, il se lit donc comme le reste de l'appli.
  // Les quatre API acceptent l'UTF-8.
  //
  // DEUX EXCEPTIONS, VOLONTAIRES, a ne pas « corriger » :
  //   1. Les marqueurs de structure EN CAPITALES — « == FORMAT DE REPONSE == »,
  //      « REMPLACEMENTS AUTORISES », « RIEN D'AUTRE ». L'omission de l'accent
  //      sur une capitale est une convention typographique recue, et ces
  //      marqueurs servent de repere au modele.
  //   2. Les JETONS DE FORMAT : « CHARGE|identifiant|kilos », les mots-cles
  //      CHARGE / VOLUME / REPOS / REMPLACER, et « RIEN ». Ce sont des CLES,
  //      relues telles quelles par iaLire() (comparaison stricte apres
  //      toUpperCase, et /^RIEN\b/i). Les accentuer casserait la lecture en
  //      silence, et test_livrable_ia.js les cherche a la sous-chaine.
  // ===========================================================================

  // Un modèle ne peut pas dépasser ce ratio sur une charge. Le moteur
  // déterministe monte de 5 % ; on laisse de la marge à un avis extérieur, mais
  // pas au point qu'une hallucination pose 300 kg sur une extension quadriceps.
  var IA_RATIO_MAX = 1.2;
  var IA_RATIO_MIN = 0.6;
  var IA_MAX_PROPS = 12;         // au-delà, ce n'est plus un conseil, c'est un déluge
  var IA_MAX_RAISON = 160;
  var IA_SEP = "|";

  // Plafond de HAUSSES de charge par salve.
  //
  // Le ratio de 1,2 borne chaque proposition prise séparément, pas la
  // trajectoire : douze hausses à +19 % acceptées chaque semaine doublent les
  // charges en un mois, et chaque pas aura paru raisonnable. C'est le seul
  // garde-fou de ce fichier dont l'enjeu est le corps et non les données —
  // d'où un plafond franchement bas.
  var IA_MAX_HAUSSES = 4;

  // --- Ce que l'appli sait dire d'elle-même ---------------------------------
  function iaMaterielTexte() {
    var out = [], i;
    for (i = 0; i < EQUIP_OPTIONS.length; i++) {
      if (profile.equipment.indexOf(EQUIP_OPTIONS[i].v) >= 0) out.push(EQUIP_OPTIONS[i].label);
    }
    if (!out.length) out.push("Poids de corps uniquement");
    var txt = out.join(", ");
    if (profile.noGear && profile.noGear.length) {
      var abs = [], k, g;
      for (k = 0; k < profile.noGear.length; k++) {
        for (g = 0; g < GEAR_OPTIONS.length; g++) {
          if (GEAR_OPTIONS[g].v === profile.noGear[k]) abs.push(GEAR_OPTIONS[g].label);
        }
      }
      if (abs.length) txt += " (machines absentes : " + abs.join(", ") + ")";
    }
    return txt;
  }

  // Charge de référence d'un exercice : la cible posée si elle existe, sinon la
  // dernière charge réellement soulevée. Sans référence, une proposition de
  // charge n'est pas validable et sera refusée.
  function iaChargeRef(ex, seances) {
    if (ex.kgCible) return ex.kgCible;
    var i, d;
    for (i = 0; i < seances.length; i++) {
      d = derniereSerie(seances[i].sets);
      if (d && d.kg) return d.kg;
    }
    return null;
  }

  // Tous les exercices chargés du plan, dédoublonnés, avec leur historique.
  // Dédoublonnés parce qu'un même exercice vit souvent dans plusieurs jours :
  // l'envoyer deux fois inviterait le modèle à proposer deux charges différentes
  // pour le même mouvement.
  function iaExercices() {
    var out = [], vus = {}, pk, i, ex;
    for (pk in PROGRAM) {
      if (!has(PROGRAM, pk)) continue;
      for (i = 0; i < PROGRAM[pk].exercises.length; i++) {
        ex = PROGRAM[pk].exercises[i];
        if (ex.track !== "load" || vus[ex.id]) continue;
        vus[ex.id] = true;
        out.push({ ex: ex, seances: seancesDe(ex.id, todayKey()) });
      }
    }
    return out;
  }

  function iaPrompt() {
    if (!profile || !profile.plan) return "";
    var L = [], tous = iaExercices(), liste = [], i, j;

    // Seuls les exercices AVEC historique partent. Un exercice jamais fait
    // n'apprend rien au modèle et gonfle le texte : sur un programme de cinq
    // jours à peine commencé, vingt lignes sur vingt-cinq disaient « aucune
    // séance enregistrée ». Le texte doit rester collable dans une application
    // mobile, et chaque ligne inutile dilue les vraies données.
    for (i = 0; i < tous.length; i++) {
      if (tous[i].seances.length) liste.push(tous[i]);
    }

    L.push("Tu es coach de musculation. Voici mes données d'entraînement réelles.");
    L.push("Propose-moi des ajustements de programme, en respectant strictement le");
    L.push("cadre et le format décrits plus bas.");
    L.push("");

    L.push("== MON PROFIL ==");
    L.push((profile.sex === "f" ? "Femme" : "Homme") + ", " + frDec(profile.startWeight) +
           " kg, objectif " + frDec(profile.targetWeight) + " kg.");
    L.push(profile.days.length + " séances par semaine, " + profile.minutes + " min par séance.");
    L.push("Matériel : " + iaMaterielTexte() + ".");
    L.push("");

    L.push("== MES EXERCICES ==");
    L.push("Format : Nom [identifiant] - séries x fourchette de répétitions - repos - charge visée");
    L.push("puis mes dernières séances, de la plus récente à la plus ancienne.");
    L.push("");
    if (!liste.length) {
      L.push("(aucune séance avec charge enregistrée pour l'instant)");
    }
    for (i = 0; i < liste.length; i++) {
      var e = liste[i].ex, ss = liste[i].seances;
      var ref = iaChargeRef(e, ss);
      L.push("- " + e.name + " [" + e.id + "] - " + e.sets + " x " + e.repsLo + "-" + e.repsHi +
             " reps - repos " + (e.rest || 60) + "s" +
             (ref ? " - charge actuelle " + frDec(String(ref)) + " kg" : " - charge inconnue"));
      for (j = 0; j < ss.length; j++) {
        var series = [], k, s;
        for (k = 0; k < ss[j].sets.length; k++) {
          s = ss[j].sets[k];
          if (!s) { continue; }
          if (s.kg && s.reps) series.push(frDec(String(s.kg)) + "kg x " + s.reps);
          else if (s.reps) series.push(s.reps + " reps");
          else series.push("série faite");
        }
        L.push("    " + shortDate(ss[j].date) + " : " + (series.length ? series.join(", ") : "rien de noté"));
      }
    }
    L.push("");

    // Les remplacements LEGAUX sont donnes d'avance. Laisser le modele choisir
    // librement dans un catalogue qu'il ne connait pas produirait des
    // identifiants inventes, refuses ensuite un par un. Autant lui donner la
    // liste : ce qu'il propose a alors une chance d'etre applicable.
    L.push("== REMPLACEMENTS AUTORISES ==");
    L.push("Uniquement ceux-ci : même pattern de mouvement, faisables avec mon matériel.");
    var auMoinsUn = false;
    for (i = 0; i < liste.length; i++) {
      var ex2 = liste[i].ex;
      var pat = CAT_BY_ID[ex2.id] ? CAT_BY_ID[ex2.id].pat : "";
      var cands = analyseCandidats(ex2, pat), noms = [];
      for (j = 0; j < cands.length && j < 5; j++) noms.push(cands[j].id);
      if (noms.length) {
        auMoinsUn = true;
        L.push("- à la place de " + ex2.id + " : " + noms.join(", "));
      }
    }
    if (!auMoinsUn) L.push("(aucun remplacement possible avec le matériel déclaré)");
    L.push("");

    L.push("== CE QUE TU AS LE DROIT DE CHANGER ==");
    L.push("La charge visée, le nombre de séries, le temps de repos, et le remplacement");
    L.push("d'un exercice par un autre de la liste ci-dessus. RIEN D'AUTRE : ni mes jours,");
    L.push("ni la structure de mes séances, ni ma nutrition, ni ma façon de m'entraîner.");
    L.push("Une hausse de charge ne dépasse pas 20 % de la charge actuelle.");
    L.push("");

    L.push("== FORMAT DE REPONSE ==");
    L.push("Une ligne par proposition, exactement dans cette forme, séparateur barre verticale :");
    L.push("CHARGE" + IA_SEP + "identifiant" + IA_SEP + "kilos" + IA_SEP + "raison courte");
    L.push("VOLUME" + IA_SEP + "identifiant" + IA_SEP + "+1 ou -1" + IA_SEP + "raison courte");
    L.push("REPOS" + IA_SEP + "identifiant" + IA_SEP + "secondes" + IA_SEP + "raison courte");
    L.push("REMPLACER" + IA_SEP + "identifiant" + IA_SEP + "identifiant de remplacement" + IA_SEP + "raison courte");
    L.push("");
    L.push("Exemple :");
    L.push("CHARGE" + IA_SEP + "leg-press" + IA_SEP + "105" + IA_SEP + "Tu dépasses la cible depuis deux séances.");
    L.push("");
    L.push("N'invente aucun identifiant : reprends exactement ceux entre crochets.");
    L.push("Douze propositions au maximum. Si rien ne doit changer, écris RIEN.");

    return L.join("\n");
  }

  // ===========================================================================
  // LECTURE DE LA REPONSE
  // ---------------------------------------------------------------------------
  // Le texte colle est une entree hostile, au meme titre qu'un fichier importe.
  // On ne cherche pas a comprendre la prose autour : on balaie les lignes, on
  // garde celles qui ont la forme attendue, et chacune doit ensuite franchir le
  // mandat. Ce qui echoue est COMPTE et MONTRE — un rejet silencieux laisserait
  // croire que le modele n'a rien propose.
  // ===========================================================================
  function iaNettoieRaison(s) {
    // Le texte du modele finira dans du HTML : il passera par esc() a
    // l'affichage, mais on le borne des maintenant, et on retire les retours a
    // la ligne qui casseraient la mise en page.
    //
    // Les adresses web sont retirees : une raison d'ajustement d'entrainement
    // n'a aucun motif d'en contenir, et ce champ est le seul texte libre venu
    // de l'exterieur qu'on affiche. Fermer ce canal coute une ligne.
    return String(s || "").replace(/[\r\n\t]+/g, " ")
             .replace(/\b(?:https?:\/\/|www\.)\S+/gi, "[lien retiré]")
             .replace(/\s+/g, " ")
             .replace(/^\s+|\s+$/g, "").slice(0, IA_MAX_RAISON);
  }

  // L'exercice doit etre dans le plan ET porter une charge. Un identifiant du
  // catalogue qui n'est pas au programme n'a rien a faire ici.
  function iaExerciceDuPlan(id) {
    var liste = iaExercices(), i;
    for (i = 0; i < liste.length; i++) { if (liste[i].ex.id === id) return liste[i]; }
    return null;
  }

  function iaLire(texte) {
    var res = { props: [], rejets: [], rien: false };
    if (!profile || !profile.plan) {
      res.rejets.push("Aucun programme actif.");
      return res;
    }
    var brut = String(texte || "");
    if (!brut.replace(/^\s+|\s+$/g, "")) {
      res.rejets.push("Rien n'a été collé.");
      return res;
    }

    var lignes = brut.split(/\r?\n/), i, vus = {}, hausses = 0;
    for (i = 0; i < lignes.length; i++) {
      var ligne = lignes[i].replace(/^\s+|\s+$/g, "");
      if (!ligne) continue;
      // Les modeles encadrent volontiers leur reponse de ``` ou de puces.
      ligne = ligne.replace(/^[`>\-\*\s]+/, "").replace(/`+$/, "");
      if (/^RIEN\b/i.test(ligne)) { res.rien = true; continue; }
      if (ligne.indexOf(IA_SEP) < 0) continue;         // de la prose, on l'ignore

      var parts = ligne.split(IA_SEP), t, p;
      for (t = 0; t < parts.length; t++) parts[t] = parts[t].replace(/^\s+|\s+$/g, "");
      var type = parts[0].toUpperCase().replace(/[^A-Z]/g, "");
      var id = parts[1] || "";
      var val = parts[2] || "";
      var raison = iaNettoieRaison(parts.slice(3).join(" "));

      // Egalite stricte, jamais une recherche de sous-chaine : « CHAR » ou
      // « REPO » passeraient un test par indexOf sur une liste concatenee.
      if (type !== "CHARGE" && type !== "VOLUME" && type !== "REPOS" && type !== "REMPLACER") {
        continue;                                      // ligne qui n'est pas une proposition
      }

      // Le plafond ne se compte qu'une fois la ligne reconnue comme
      // proposition : sinon de la prose contenant une barre verticale
      // declencherait le message de surplus.
      if (res.props.length >= IA_MAX_PROPS) {
        res.rejets.push("Plus de " + IA_MAX_PROPS + " propositions : le surplus est ignoré.");
        break;
      }

      var cible = iaExerciceDuPlan(id);
      if (!cible) {
        res.rejets.push("« " + id + " » n'est pas un exercice chargé de mon programme.");
        continue;
      }
      if (vus[type + ":" + id]) {
        res.rejets.push("Deuxième proposition " + type.toLowerCase() + " sur " + cible.ex.name + " : ignorée.");
        continue;
      }

      var ex = cible.ex;

      if (type === "CHARGE") {
        var kg = cleanNumber(val, MIN_KG, MAX_KG, 1);
        if (kg === null) {
          res.rejets.push("Charge illisible pour " + ex.name + " (« " + val + " »).");
          continue;
        }
        var ref = iaChargeRef(ex, cible.seances);
        if (!ref) {
          res.rejets.push("Pas de charge de référence pour " + ex.name + " : proposition non vérifiable.");
          continue;
        }
        // Le garde-fou qui compte. Un modele qui se trompe d'unite ou
        // d'exercice produit des chiffres plausibles a l'ecran et dangereux
        // sous une barre.
        if (kg > ref * IA_RATIO_MAX || kg < ref * IA_RATIO_MIN) {
          res.rejets.push("Écart trop grand sur " + ex.name + " : " + frDec(String(kg)) +
                          " kg pour " + frDec(String(ref)) + " kg actuels.");
          continue;
        }
        // Ne rien changer n'est pas une proposition, mais ce n'est pas non plus
        // une ligne illisible : on le DIT. Sans ça le filet de fin attribuait un
        // motif faux — « aucune ligne au format attendu » — et le modèle passait
        // pour muet alors qu'il avait répondu, exactement ce que le contrat de
        // ce module interdit.
        if (kg === ref) {
          res.rejets.push("Charge inchangée pour " + ex.name + " (" +
                          frDec(String(ref)) + " kg) : rien à appliquer.");
          continue;
        }
        // Plafond de HAUSSES, pas de baisses : redescendre n'a jamais blessé
        // personne. Le refus est montré, pour qu'une salve tronquée ne passe
        // pas pour l'avis complet du modèle.
        if (kg > ref) {
          if (hausses >= IA_MAX_HAUSSES) {
            res.rejets.push("Plus de " + IA_MAX_HAUSSES + " hausses de charge d'un coup : " +
                            ex.name + " est écarté. Monte par étapes.");
            continue;
          }
          hausses++;
        }
        vus[type + ":" + id] = true;
        res.props.push({ type: "charge", ex: id, kg: kg, ia: true,
          texte: "Viser " + frDec(String(kg)) + " kg sur " + ex.name,
          raison: raison || "Proposé par l'IA." });

      } else if (type === "VOLUME") {
        var delta = cleanNumber(val.replace(/^\+/, ""), -3, 3, 0);
        if (delta === null || delta === 0) {
          res.rejets.push("Variation de séries illisible pour " + ex.name + " (« " + val + " »).");
          continue;
        }
        // Un exercice chargé vit souvent dans PLUSIEURS jours, à des volumes
        // différents — le générateur le produit tout seul. iaExerciceDuPlan ne
        // rend que la PREMIÈRE place : la phrase « passer à 6 séries » était
        // vraie pour le mardi et fausse pour le vendredi, qui partait à 7. Et le
        // refus « hors bornes : 0 séries » désignait le mauvais jour.
        //
        // On vérifie donc les bornes sur TOUTES les places, et on ne cite un
        // nombre absolu que si elles y arrivent toutes ; sinon on parle en
        // delta, qui est ce qui sera réellement appliqué.
        var pl = planExercices(id), pi2, sN, sMin = null, sMax = null, encaisse = 0;
        for (pi2 = 0; pi2 < pl.length; pi2++) {
          sN = pl[pi2].liste[pl[pi2].rang].sets + delta;
          if (sMin === null || sN < sMin) sMin = sN;
          if (sMax === null || sN > sMax) sMax = sN;
          if (sN >= 1 && sN <= MAX_SETS) encaisse++;
        }
        if (sMin === null) {
          sMin = ex.sets + delta; sMax = sMin;
          encaisse = (sMin >= 1 && sMin <= MAX_SETS) ? 1 : 0;
        }
        // On ne refuse que si AUCUNE place n'encaisse le delta. Refuser des que
        // l'UNE d'elles deborde jetait un « une serie de moins » parfaitement
        // applicable au jour qui en fait quatre, sous pretexte qu'un autre jour
        // est deja au plancher. appliquerProposition borne deja place par place.
        if (!encaisse) {
          res.rejets.push("Volume hors bornes pour " + ex.name + " : " +
                          (sMin === sMax ? sMin + " séries."
                                         : sMin + " à " + sMax + " séries selon le jour."));
          continue;
        }
        var texteVol;
        if (sMin === sMax) {
          texteVol = "Passer " + ex.name + " à " + sMin + " séries";
        } else if (delta > 0) {
          texteVol = "Ajouter " + delta + " série" + (delta > 1 ? "s" : "") + " à " + ex.name;
        } else {
          texteVol = "Retirer " + (-delta) + " série" + ((-delta) > 1 ? "s" : "") + " à " + ex.name;
        }
        vus[type + ":" + id] = true;
        res.props.push({ type: "volume", ex: id, delta: delta, ia: true,
          texte: texteVol,
          raison: raison || "Proposé par l'IA." });

      } else if (type === "REPOS") {
        var sec = cleanNumber(val, 20, 300, 0);
        if (sec === null) {
          res.rejets.push("Temps de repos illisible pour " + ex.name + " (« " + val + " »).");
          continue;
        }
        if (sec === (ex.rest || 60)) {
          res.rejets.push("Repos inchangé pour " + ex.name + " (" +
                          fmtRest(sec) + ") : rien à appliquer.");
          continue;
        }
        vus[type + ":" + id] = true;
        res.props.push({ type: "repos", ex: id, rest: sec, ia: true,
          texte: "Repos de " + ex.name + " à " + fmtRest(sec),
          raison: raison || "Proposé par l'IA." });

      } else if (type === "REMPLACER") {
        var pat = CAT_BY_ID[id] ? CAT_BY_ID[id].pat : "";
        // On revalide contre la MEME liste que celle envoyee dans le prompt.
        // C'est elle qui porte le mandat : meme pattern, materiel disponible,
        // pas d'exercice refuse, pas de doublon dans le programme.
        var cands = analyseCandidats(ex, pat), okC = null, ci;
        for (ci = 0; ci < cands.length; ci++) { if (cands[ci].id === val) okC = cands[ci]; }
        if (!okC) {
          res.rejets.push("« " + val + " » n'est pas un remplaçant autorisé pour " + ex.name + ".");
          continue;
        }
        vus[type + ":" + id] = true;
        res.props.push({ type: "remplacer", ex: id, par: okC.id, ia: true,
          texte: "Remplacer " + ex.name + " par " + okC.name,
          raison: raison || "Proposé par l'IA." });
      }
    }

    if (!res.props.length && !res.rejets.length && !res.rien) {
      res.rejets.push("Aucune ligne au format attendu n'a été trouvée.");
    }
    return res;
  }

  // Une proposition appliquee peut rendre les suivantes caduques : remplacer un
  // exercice le fait sortir du plan, et une proposition de charge qui le visait
  // n'a plus de cible. Sans ce filtre, le bouton restait a l'ecran et ne faisait
  // plus rien au tap suivant — appliquerProposition ne trouvant aucune place,
  // il retournait vrai sans avoir rien change.
  function iaRevalider(props) {
    var out = [], i, p, cible;
    for (i = 0; i < props.length; i++) {
      p = props[i];
      cible = iaExerciceDuPlan(p.ex);
      if (!cible) continue;
      if (p.type === "charge") {
        var ref = iaChargeRef(cible.ex, cible.seances);
        if (!ref || p.kg === ref) continue;
        if (p.kg > ref * IA_RATIO_MAX || p.kg < ref * IA_RATIO_MIN) continue;
      } else if (p.type === "volume") {
        // Même balayage que dans iaLire : sinon les deux divergent, et une
        // proposition acceptée à la lecture serait écartée à la revalidation.
        var plR = planExercices(p.ex), pr, nR, encaisseR = 0;
        for (pr = 0; pr < plR.length; pr++) {
          nR = plR[pr].liste[plR[pr].rang].sets + p.delta;
          if (nR >= 1 && nR <= MAX_SETS) encaisseR++;
        }
        if (!plR.length) {
          nR = cible.ex.sets + p.delta;
          encaisseR = (nR >= 1 && nR <= MAX_SETS) ? 1 : 0;
        }
        if (!encaisseR) continue;
      } else if (p.type === "repos") {
        if (p.rest === (cible.ex.rest || 60)) continue;
      } else if (p.type === "remplacer") {
        var pat2 = CAT_BY_ID[p.ex] ? CAT_BY_ID[p.ex].pat : "";
        var cands2 = analyseCandidats(cible.ex, pat2), trouve = false, ci2;
        for (ci2 = 0; ci2 < cands2.length; ci2++) { if (cands2[ci2].id === p.par) trouve = true; }
        if (!trouve) continue;
      }
      out.push(p);
    }
    return out;
  }


  // ===========================================================================
  // PONT IA NUTRITION — IL LIT, IL JUGE, IL N'ECRIT RIEN
  // ---------------------------------------------------------------------------
  // POURQUOI CE BLOC EXISTE. L'appli a cessé de composer des repas en v1.13.0,
  // sur une mesure : 9,87 % des prises servaient un laitage en trois pots ou
  // plus, jusqu'à quatre pots de 500 g. La cause était architecturale et pas une
  // liste de bogues — un assembleur de rôles qui met les grammes à l'échelle
  // produit TOUTES les combinaisons qui satisfont les nombres, y compris celles
  // que personne ne mange. Ce qui manque depuis, c'est le plan alimentaire
  // lui-même. Une IA sait l'écrire. Elle ne sait pas se retenir.
  //
  // LE MANDAT VIT DANS LE VALIDATEUR, JAMAIS DANS LE PROMPT. C'est la règle du
  // pont des charges et elle vaut ici davantage encore : un prompt se contourne,
  // se dilue dans un contexte long, et n'existe plus du tout quand la réponse
  // vient d'une conversation menée ailleurs. Le texte collé est une entrée
  // HOSTILE, au même titre qu'un fichier importé.
  //
  // LES JETONS SONT DISJOINTS DE CEUX DU PONT DES CHARGES, dans les deux sens.
  // « PRISE| » n'est pas lu par iaLire, « CHARGE| » n'est pas lu par
  // iaLireNutrition, et les deux lecteurs comparent leur type par ÉGALITÉ
  // STRICTE sur une chaîne réduite à [A-Z] — jamais par sous-chaîne, qui
  // laisserait passer « CHAR » ou « PRIS ». Coller la réponse du mauvais pont
  // dans l'autre zone ne produit donc pas un demi-plan : ça produit un refus.
  //
  // QUI ÉCRIT QUOI, ET C'EST LE PARTAGE QUI FAIT LA SÛRETÉ :
  //   l'IA écrit    la COMPOSITION d'une prise, et ce qu'elle prétend y apporter ;
  //   l'appli tient l'heure, le nom et la clé du créneau — donc le NOMBRE de
  //                 prises, qui vient de ce que l'utilisateur a déclaré ;
  //   l'appli tient aussi ses COMPLÉMENTS : leurs doses sont vérifiées et leurs
  //                 fiches écrites, une IA n'a rien à y ajouter.
  //
  // CE QUE CETTE VERSION NE FAIT PAS : écrire. Rien n'est enregistré, et la
  // carte le dit en toutes lettres. Le validateur expose `complet`, et c'est lui
  // que le droit d'écrire consommera.
  // ===========================================================================

  // Le jeton de format. DISJOINT de CHARGE / VOLUME / REPOS / REMPLACER, et la
  // chaîne de build refuse de publier si ça cessait d'être vrai.
  var NUTRI_IA_TYPE = "PRISE";
  // Le refus. « RIEN » appartient déjà au pont des charges (/^RIEN\b/i) : lui
  // donner le même mot ferait qu'une seule réponse vaudrait pour les deux ponts,
  // et un plan alimentaire annulerait des propositions de charge.
  var NUTRI_IA_RIEN = "AUCUNPLAN";
  // Même borne que le stockage. MAX_NUTRI_ITEMS est la borne FIXE de
  // cleanProfile : accepter plus de lignes que ce que le stockage garde rendrait
  // le plan faux dès le rechargement. On relit la constante, on n'en écrit pas
  // une seconde qui divergerait.
  var NUTRI_IA_MAX_LIGNES = MAX_NUTRI_ITEMS;

  // TOLÉRANCE ENTRE CE QU'UNE LIGNE ANNONCE ET CE QUE L'APPLI Y LIT.
  //
  // Elle est LARGE à dessein. La table d'aliments donne des ordres de grandeur :
  // elle ignore la cuisson, la marque, le gras de cuisson et la découpe. 8 g de
  // protéines valent un œuf et demi, 150 kcal une cuillère d'huile — c'est le
  // bruit de l'estimation, des deux côtés de la comparaison.
  //
  // Au-delà de 35 %, ce n'est plus un arrondi : la ligne décrit autre chose que
  // ce qu'elle chiffre. Et une IA qui se trompe sur l'addition d'une assiette
  // que l'appli sait lire ne mérite pas confiance sur celles qu'elle ne sait pas
  // lire — c'est le seul endroit où son arithmétique est vérifiable, donc c'est
  // là qu'on regarde.
  var NUTRI_IA_ECART_PROT_G = 8;
  var NUTRI_IA_ECART_PROT_PCT = 0.35;
  var NUTRI_IA_ECART_KCAL = 150;
  var NUTRI_IA_ECART_KCAL_PCT = 0.35;

  // Plafond des calories ANNONCÉES, en multiple de la cible. Un plan à moitié
  // au-dessus n'est pas un plan pour cette personne. Le plancher, lui, n'a pas
  // besoin d'une constante de plus : nutritionTargets et nutriBilanPlan le
  // portent déjà, et AV_KCAL_BRUIT dit depuis la v1.5.0 à partir de quel écart
  // un total calorique cesse d'être du bruit.
  var NUTRI_IA_KCAL_SUR_MAX = 1.5;

  // LES CRÉNEAUX QU'UNE IA A LE DROIT DE REMPLIR, ET LA SEULE SOURCE DE CETTE
  // LISTE. Le prompt les annonce, le validateur les exige, la carte les compte :
  // trois lecteurs, une fonction. C'est la leçon de « REMPLACEMENTS AUTORISÉS »
  // du pont des charges, où la liste envoyée et la liste revalidée sont déjà la
  // même — deux listes auraient divergé à la première correction, et une
  // proposition acceptée à la lecture serait écartée à la validation.
  //
  // Ils viennent de ce que l'utilisateur a DÉCLARÉ : nutriSlotsFor rend les
  // créneaux d'une journée à n repas, avec ou sans petit-déjeuner, avec ou sans
  // collation. Une IA ne décide donc pas combien de fois on mange.
  function nutriCreneauxIA(prof) {
    if (!prof) return [];
    var keys = nutriSlotsFor(prof.nutri || {}), out = [], i, s;
    for (i = 0; i < keys.length; i++) {
      s = SLOT_BY_K[keys[i]];
      if (s) out.push({ k: s.k, h: s.h, nom: s.nom });
    }
    return out;
  }

  // CE QUE L'APPLI SAIT DE L'ENTRAÎNEMENT RÉELLEMENT FAIT. Un plan écrit sur les
  // séances DÉCLARÉES serait un plan pour quelqu'un d'autre : trois séances par
  // semaine promises et une seule faite, ce n'est pas la même dépense, donc pas
  // la même journée. C'est aussi la seule partie du bilan que l'utilisateur n'a
  // pas saisie lui-même, donc la seule qu'il ne peut pas dire à l'IA sans nous.
  function iaNutriSeancesTexte() {
    var g = analyseGlobale(todayKey());
    if (!g.seances) return "Aucune séance enregistrée pour l'instant.";
    var txt = g.seances + " séance" + (g.seances > 1 ? "s" : "") + " enregistrée" +
              (g.seances > 1 ? "s" : "");
    if (g.semaines > 0) {
      txt += " sur " + g.semaines + " semaine" + (g.semaines > 1 ? "s" : "") +
             ", soit " + frDec(String(Math.round(g.seances / g.semaines * 10) / 10)) +
             " par semaine";
    }
    return txt + ".";
  }

  // Ce que les compléments apportent DÉJÀ, retiré de la cible confiée à l'IA.
  // Sans ça, un plan viserait 135 g de protéines aux repas quand la protéine en
  // poudre et la barre en apportent 43 : la journée finirait au-dessus de
  // 2,2 g/kg, et l'appli reprocherait ensuite à l'utilisateur un dépassement
  // qu'elle a elle-même commandé. C'est exactement ce que faisait nutriRepartir
  // avant la réduction, et c'est la raison pour laquelle nutriMacrosFixes en est
  // sortie pour lui survivre.
  //
  // ON LIT buildNutrition, PAS UNE SECONDE TABLE : les lignes de complément que
  // le prompt retire de la cible sont les lignes EXACTES que le validateur
  // recollera au plan.
  function iaNutriSupps(prof) {
    var out = { lignes: [], prot: 0, kcal: 0 }, t;
    try { out.lignes = buildNutrition(prof); } catch (e) { out.lignes = []; }
    if (!isArray(out.lignes)) out.lignes = [];
    t = nutriTotaux(out.lignes, -1);
    out.prot = t.prot; out.kcal = t.kcal;
    return out;
  }

  // ===========================================================================
  // LE PROMPT
  // ---------------------------------------------------------------------------
  // Même contrat que celui du pont des charges : il est AFFICHÉ EN ENTIER avant
  // d'être copié, parce que ces données partent chez un tiers et que c'est la
  // condition pour décider en connaissance de cause.
  //
  // Il ne contient aucune donnée de santé qui ne soit déjà dans le bilan des
  // charges : sexe, deux poids, séances, et ce que l'utilisateur a déclaré de ses
  // habitudes alimentaires. Pas de prénom — il ne sert à rien à un modèle et
  // c'est la seule donnée nominative du profil.
  // ===========================================================================
  function iaPromptNutrition() {
    if (!profile || !profile.done) return "";
    var L = [], cr = nutriCreneauxIA(profile), nt = nutritionTargets(profile);
    var n = profile.nutri || {}, sup = iaNutriSupps(profile);
    var i, jours = [], noms = [], disc = "Musculation";
    var cibleP = Math.max(0, nt.prot - Math.round(sup.prot));
    var cibleK = Math.max(0, nt.kcal - sup.kcal);

    L.push("Tu es diététicien. Écris-moi le plan alimentaire d'UNE journée, en");
    L.push("respectant strictement le cadre et le format décrits plus bas.");
    L.push("");

    L.push("== MON PROFIL ==");
    L.push((profile.sex === "f" ? "Femme" : "Homme") + ", " + frDec(profile.startWeight) +
           " kg, objectif " + frDec(profile.targetWeight) + " kg (" + objResume(profile) + ").");
    for (i = 0; i < DISCIPLINES.length; i++) {
      if (DISCIPLINES[i].v === profile.discipline) disc = DISCIPLINES[i].label;
    }
    for (i = 0; i < profile.days.length; i++) jours.push(DAY_LABELS[profile.days[i]]);
    L.push(profile.days.length + " séances par semaine (" + jours.join(", ") + "), " +
           profile.minutes + " min par séance, " + disc + ".");
    L.push(iaNutriSeancesTexte());
    L.push("");

    L.push("== MES CIBLES, CALCULÉES PAR L'APPLI ==");
    L.push(frNum(nt.kcal) + " kcal et " + nt.prot + " g de protéines pour la journée entière.");
    if (sup.prot > 0 || sup.kcal > 0) {
      L.push("Mes compléments en apportent déjà " + Math.round(sup.prot) + " g et " +
             frNum(sup.kcal) + " kcal, et l'appli les ajoutera elle-même : tes lignes");
      L.push("doivent donc totaliser environ " + frNum(cibleK) + " kcal et " + cibleP + " g.");
    }
    L.push("Ce sont des repères estimés à partir de mon poids et de mon volume");
    L.push("d'entraînement, pas une mesure de métabolisme.");
    L.push("");

    L.push("== MES PRISES ALIMENTAIRES ==");
    L.push("Je mange " + cr.length + " fois par jour, et pas autrement. Chaque prise porte");
    L.push("sa clé entre crochets : c'est celle-là qu'il faut reprendre, telle quelle.");
    for (i = 0; i < cr.length; i++) {
      L.push("- " + cr[i].h + " " + cr[i].nom + " [" + cr[i].k + "]");
    }
    L.push("");

    L.push("== CE QUE JE PEUX FAIRE ==");
    L.push(n.cook === false
             ? "Je ne cuisine pas : rien qui demande une casserole ou un four."
             : "Je cuisine.");
    L.push(n.alcohol === "non"
             ? "Je ne bois pas d'alcool."
             : (n.alcohol === "souvent"
                  ? "Je bois de l'alcool souvent."
                  : "Je bois de l'alcool de temps en temps."));
    L.push("");

    L.push("== MES COMPLÉMENTS, DÉJÀ DANS MON PLAN ==");
    for (i = 0; i < SUPPS.length; i++) {
      if ((n.supps || []).indexOf(SUPPS[i].v) >= 0) noms.push(SUPPS[i].label);
    }
    if (noms.length) {
      L.push(noms.join(", ") + ".");
      L.push("L'appli tient leurs doses et leurs horaires, et les remettra dans le plan");
      L.push("elle-même. Ne les écris pas dans tes lignes.");
    } else {
      L.push("Aucun.");
    }
    L.push("");

    L.push("== FORMAT DE REPONSE ==");
    L.push("Une ligne par prise, exactement dans cette forme, séparateur barre verticale :");
    L.push(NUTRI_IA_TYPE + IA_SEP + "clé" + IA_SEP + "ce que je mange, avec les quantités" +
           IA_SEP + "grammes de protéines" + IA_SEP + "kcal");
    L.push("");
    L.push("Exemple :");
    L.push(NUTRI_IA_TYPE + IA_SEP + "dej" + IA_SEP +
           "1 filet de poulet (150 g) + 200 g de riz complet + brocolis" +
           IA_SEP + "46" + IA_SEP + "620");
    L.push("");
    L.push("EXACTEMENT une ligne par clé ci-dessus, ni plus ni moins, et rien d'autre :");
    L.push("l'appli refuse un plan qui saute une prise ou qui en ajoute une.");
    L.push("Des grammes pour ce qui se pèse, des unités pour ce qui se compte : ni");
    L.push("« 2 bols de flocons », ni « 110 g d'œufs ».");
    L.push("Des portions qu'un adulte mange vraiment. L'appli relit chaque ligne et");
    L.push("refuse tout ce qui atteint trois fois une portion courante : « 3 pizzas »");
    L.push("ou « 500 g de kiwi » sont écartés, quelle que soit l'arithmétique.");
    L.push("Les chiffres que tu annonces sont confrontés à ce que l'appli lit dans ta");
    L.push("ligne : une ligne qui ne s'additionne pas est écartée elle aussi.");
    L.push("Si tu ne peux pas répondre dans ce format, écris " + NUTRI_IA_RIEN + ".");

    return L.join("\n");
  }

  // ===========================================================================
  // LE LECTEUR
  // ---------------------------------------------------------------------------
  // Il ne juge PAS ce qu'il y a dans l'assiette : il ne fait que reconnaître la
  // forme, résoudre la clé de créneau, et borner les champs. Le jugement vit dans
  // nutriValiderPlanIA, en dessous. La séparation n'est pas cosmétique — elle
  // permet au banc d'attaquer les deux séparément, et à la carte de dire « la
  // forme est bonne, le contenu ne l'est pas », qui est le cas le plus fréquent.
  //
  // Rend { lignes, rejets, rien } :
  //   lignes  les lignes de FORME valide, dans l'ordre du texte
  //   rejets  les refus, COMPTÉS et destinés à être montrés
  //   rien    le modèle a déclaré qu'il ne proposait pas de plan
  // ===========================================================================
  function iaLireNutrition(texte) {
    var res = { lignes: [], rejets: [], rien: false };
    if (!profile || !profile.done) {
      res.rejets.push("Aucun profil actif : il n'y a pas de créneau à remplir.");
      return res;
    }
    var cr = nutriCreneauxIA(profile);
    if (!cr.length) {
      res.rejets.push("Aucune prise alimentaire déclarée dans ton profil.");
      return res;
    }
    var brut = String(texte || "");
    if (!brut.replace(/^\s+|\s+$/g, "")) {
      res.rejets.push("Rien n'a été collé.");
      return res;
    }

    var lignes = brut.split(/\r?\n/), i, vus = {};
    for (i = 0; i < lignes.length; i++) {
      var ligne = lignes[i].replace(/^\s+|\s+$/g, "");
      if (!ligne) continue;
      // Les modèles encadrent volontiers leur réponse de ``` ou de puces.
      ligne = ligne.replace(/^[`>\-\*\s]+/, "").replace(/`+$/, "");
      if (ligne.toUpperCase().replace(/[^A-Z]/g, "").indexOf(NUTRI_IA_RIEN) === 0) {
        res.rien = true; continue;
      }
      if (ligne.indexOf(IA_SEP) < 0) continue;      // de la prose, on l'ignore

      var parts = ligne.split(IA_SEP), t;
      for (t = 0; t < parts.length; t++) parts[t] = parts[t].replace(/^\s+|\s+$/g, "");
      // ÉGALITÉ STRICTE, jamais une recherche de sous-chaîne : « PRIS » ou
      // « PRISES » passeraient un test par indexOf, et « CHARGE » ne doit rien
      // déclencher ici. C'est la même règle que iaLire, et c'est elle qui rend
      // les deux ponts réellement disjoints.
      if (parts[0].toUpperCase().replace(/[^A-Z]/g, "") !== NUTRI_IA_TYPE) continue;

      // Le plafond ne se compte qu'une fois la ligne reconnue comme prise :
      // sinon de la prose contenant une barre verticale déclencherait le
      // message de surplus.
      if (res.lignes.length >= NUTRI_IA_MAX_LIGNES) {
        res.rejets.push("Plus de " + NUTRI_IA_MAX_LIGNES + " prises : le surplus est ignoré.");
        break;
      }

      // La clé est réduite comme le fait cleanProfile sur le même champ : c'est
      // une clé, pas du texte. Le libellé brut est gardé pour le message de
      // refus — dire « « brunch » n'est pas un créneau » demande de citer ce qui
      // a été écrit, pas sa forme nettoyée.
      var brutCle = String(parts[1] || "").slice(0, 40);
      var k = brutCle.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 16);
      var item = String(parts[2] || "").replace(/\s+/g, " ").replace(/^ | $/g, "");
      var slot = null, ci;
      for (ci = 0; ci < cr.length; ci++) { if (cr[ci].k === k) slot = cr[ci]; }
      if (!slot) {
        res.rejets.push("« " + brutCle + " » n'est pas une de mes prises : cette ligne est écartée.");
        continue;
      }
      if (vus[k]) {
        res.rejets.push("Deuxième ligne pour " + slot.nom + " : elle est écartée.");
        continue;
      }
      if (item.length < 3) {
        res.rejets.push("Rien de lisible à manger pour " + slot.nom + ".");
        continue;
      }
      // ⚠️ UN CHAMP ABSENT ET UN CHAMP ILLISIBLE NE SONT PAS LA MEME CHOSE, et les
      // confondre ouvrait un trou mesure au navigateur.
      //
      // cleanNumber rend null dans les DEUX cas : quand le champ est vide, et
      // quand la valeur est hors bornes. Premiere ecriture : les deux devenaient
      // « rien d'annonce ». Consequence — une ligne annoncant « 400 » grammes de
      // proteines (au-dela de NUTRI_PROT_MAX) etait lue comme n'annoncant RIEN,
      // donc elle echappait a la confrontation avec la lecture, ET elle annulait
      // le total annonce du plan entier, donc le plafond calorique ne pouvait plus
      // mordre. Un modele pouvait desarmer le controle du plan en ecrivant UN
      // nombre absurde.
      //
      // Une valeur absente est un silence, et un silence est admis : l'appli met
      // alors ses propres chiffres. Une valeur ECRITE mais impossible est une
      // affirmation fausse, et elle se refuse — comme « Charge illisible » le fait
      // depuis toujours dans le pont des charges.
      var pBrut = String(parts[3] === undefined ? "" : parts[3]);
      var kBrut = String(parts[4] === undefined ? "" : parts[4]);
      var pNum = cleanNumber(pBrut, 0, NUTRI_PROT_MAX, 0);
      var kNum = cleanNumber(kBrut, 0, NUTRI_KCAL_MAX, 0);
      if (pBrut !== "" && pNum === null) {
        res.rejets.push(slot.nom + " : protéines illisibles ou impossibles (« " +
                        pBrut.slice(0, 20) + " »).");
        continue;
      }
      if (kBrut !== "" && kNum === null) {
        res.rejets.push(slot.nom + " : calories illisibles ou impossibles (« " +
                        kBrut.slice(0, 20) + " »).");
        continue;
      }
      vus[k] = true;
      res.lignes.push({ k: k, nom: slot.nom, time: slot.h,
                        item: item.slice(0, NUTRI_LIGNE_MAX),
                        protIA: pNum, kcalIA: kNum });
    }

    if (!res.lignes.length && !res.rejets.length && !res.rien) {
      res.rejets.push("Aucune ligne au format attendu n'a été trouvée.");
    }
    return res;
  }

  // ===========================================================================
  // LE VALIDATEUR — UNE LIGNE
  // ---------------------------------------------------------------------------
  // Il s'adosse à alimentLireLibre, le moteur du lecteur de texte libre gardé en
  // v1.12.0 pour ce jour précis. Ce moteur porte déjà tout ce qu'il faut :
  //   - il lit une composition écrite en français et la chiffre ;
  //   - il refuse de chiffrer PARTIELLEMENT (tout ou rien), donc il ne fait
  //     jamais mentir un total vers le bas ;
  //   - il porte le seuil d'excès depuis la v1.7.0 : trois fois la portion que la
  //     table déclare elle-même, seuil ATTEINT et pas dépassé. « 3 pizzas » et
  //     « 500 g de kiwi » sont les deux exemples nommés par le propriétaire de
  //     l'appli, et ce sont exactement les deux que ce seuil attrape.
  //
  // Rend { ligne, refus, absurde, illisible }. `ligne` est prête à entrer dans un
  // nutriPlan : elle porte l'heure, le nom et la clé de l'appli, la composition
  // de l'IA, et des chiffres dont on sait d'où ils viennent.
  // ===========================================================================
  function nutriJugerLigneIA(src, slot) {
    var out = { ligne: null, refus: "", absurde: false, illisible: false };
    if (!src || !slot) { out.refus = "Ligne vide."; return out; }
    var lu = alimentLireLibre(src.item);

    // 1. L'ABSURDE D'ABORD, ET C'EST LE REFUS QUI NE SE DISCUTE PAS. « n'ignore
    //    pas les imbécilités de nutrition que l'app pourrait imaginer » — la
    //    consigne visait le générateur, elle vaut mot pour mot pour une IA, qui
    //    en est capable avec beaucoup plus d'aplomb.
    if (lu.exces) {
      out.absurde = true;
      out.refus = slot.nom + " : « " + src.item + " » fait " +
        frDec(String(Math.round(lu.exces.fois * 10) / 10)) + " fois une portion de " +
        lu.exces.al.nom + " (" + frNum(lu.exces.g) + " g). Ce n'est plus une grosse " +
        "portion, c'est une aberration.";
      return out;
    }

    // 2. UNE LIGNE QUE L'APPLI NE SAIT PAS LIRE N'EST PAS UNE LIGNE FAUSSE.
    //    Sa table couvre cent vingt aliments : « blanquette de veau » n'y est
    //    pas, et ce n'est pas une raison de refuser un dîner. On garde la ligne
    //    et on laisse ses chiffres à NULL — la valeur qui dit « non chiffré », que
    //    nutriTotaux compte comme une inconnue déclarée et jamais comme un zéro.
    //
    //    ON NE RECOPIE SURTOUT PAS LES CHIFFRES DE L'IA À LA PLACE. Ce serait
    //    ouvrir exactement le tuyau que ce validateur existe pour fermer : un
    //    modèle écrirait un texte que l'appli ne sait pas lire — ce qui est
    //    facile — et ses chiffres entreraient sans contrôle dans le total de la
    //    journée. Le nombre d'inconnues est COMPTÉ et montré.
    if (!lu.reconnu) {
      out.illisible = true;
      out.ligne = { time: slot.h, nom: slot.nom, key: slot.k,
                    item: src.item.slice(0, NUTRI_LIGNE_MAX),
                    note: "quantités non vérifiées par l'appli",
                    prot: null, kcal: null };
      return out;
    }

    // 3. CE QUE LA LIGNE ANNONCE CONTRE CE QUE L'APPLI Y LIT. C'est le seul
    //    endroit où l'arithmétique d'un modèle est vérifiable, donc c'est là
    //    qu'on regarde. Une ligne qui ne s'additionne pas est écartée.
    var tolP = Math.max(NUTRI_IA_ECART_PROT_G, lu.prot * NUTRI_IA_ECART_PROT_PCT);
    var tolK = Math.max(NUTRI_IA_ECART_KCAL, lu.kcal * NUTRI_IA_ECART_KCAL_PCT);
    if (src.protIA !== null && Math.abs(src.protIA - lu.prot) > tolP) {
      out.refus = slot.nom + " : la ligne annonce " + frDec(String(src.protIA)) +
        " g de protéines, l'appli en lit " + frDec(String(lu.prot)) +
        ". L'écart est trop grand pour un arrondi.";
      return out;
    }
    if (src.kcalIA !== null && Math.abs(src.kcalIA - lu.kcal) > tolK) {
      out.refus = slot.nom + " : la ligne annonce " + frNum(src.kcalIA) +
        " kcal, l'appli en lit " + frNum(lu.kcal) +
        ". L'écart est trop grand pour un arrondi.";
      return out;
    }

    // LES CHIFFRES RETENUS SONT CEUX DE L'APPLI, jamais ceux de l'IA. Ils sont
    // déterministes : la même ligne relue depuis le stockage retrouve exactement
    // la même valeur, donc rien ne dérive au rechargement. C'est la règle de
    // cleanNutriCorr, au même endroit et pour la même raison.
    out.ligne = { time: slot.h, nom: slot.nom, key: slot.k,
                  item: src.item.slice(0, NUTRI_LIGNE_MAX),
                  note: nutriNote(lu.prot, lu.kcal),
                  prot: lu.prot, kcal: lu.kcal };
    return out;
  }

  // ===========================================================================
  // LE VALIDATEUR — LE PLAN ENTIER
  // ---------------------------------------------------------------------------
  // ON REPART DES CRÉNEAUX, JAMAIS DE L'ORDRE DU TEXTE, et c'est structurel :
  // les cases cochées du journal sont indexées par POSITION dans le plan. Un
  // modèle qui écrit le dîner avant le petit-déjeuner produirait un plan dont
  // l'ordre dépend de sa rédaction, donc un plan dont les positions changent
  // d'une réponse à l'autre. En balayant nutriCreneauxIA, l'ordre du plan est
  // celui de la journée, toujours, et le nombre de lignes ne peut pas dépasser
  // le nombre de prises déclarées.
  //
  // LE PLAN JUGÉ EST LE PLAN QUI SERAIT ÉCRIT : repas de l'IA, puis compléments
  // de l'appli. Juger les seuls repas puis écrire autre chose ferait diverger le
  // verdict et le contenu — le défaut exact corrigé en v1.9.0, où le bilan
  // totalisait la proposition stockée pendant que l'écran montrait la journée.
  //
  // Rend { repas, plan, rejets, manquants, absurdes, illisibles, complet,
  //        bilan, annonce, creneaux }.
  // `complet` est la seule question qui décidera du droit d'écrire : un plan
  // incomplet, ou dont une ligne a été refusée, n'est pas un plan.
  // ===========================================================================
  function nutriValiderPlanIA(prof, lu) {
    var res = { repas: [], plan: [], rejets: [], manquants: [], absurdes: 0,
                illisibles: 0, complet: false, bilan: null, annonce: null,
                creneaux: 0 };
    if (!prof || !prof.done) {
      res.rejets.push("Aucun profil actif : il n'y a pas de créneau à remplir.");
      return res;
    }
    var cr = nutriCreneauxIA(prof);
    var src = (lu && isArray(lu.lignes)) ? lu.lignes : [];
    var fmt = (lu && isArray(lu.rejets)) ? lu.rejets.length : 0;
    var i, j, trouve, v;
    res.creneaux = cr.length;

    for (i = 0; i < cr.length; i++) {
      trouve = null;
      for (j = 0; j < src.length; j++) { if (src[j].k === cr[i].k) trouve = src[j]; }
      if (!trouve) { res.manquants.push(cr[i].nom); continue; }
      v = nutriJugerLigneIA(trouve, cr[i]);
      if (v.refus) {
        res.rejets.push(v.refus);
        if (v.absurde) res.absurdes++;
        continue;
      }
      if (v.illisible) res.illisibles++;
      res.repas.push(v.ligne);
    }

    // UN PLAN QUI SAUTE UNE PRISE N'EST PAS UN PLAN, et le dire ne suffit pas :
    // il faut le compter. C'est ce compte qui interdira l'écriture, parce qu'un
    // plan plus court décalerait toutes les positions suivantes du journal.
    if (res.manquants.length) {
      res.rejets.push("Il manque " + res.manquants.length + " prise" +
        (res.manquants.length > 1 ? "s" : "") + " sur " + cr.length + " : " +
        res.manquants.join(", ") + ".");
    }

    var sup = iaNutriSupps(prof);
    res.plan = res.repas.concat(sup.lignes);
    if (res.plan.length > MAX_NUTRI_ITEMS) {
      // Ne peut pas mordre aujourd'hui — sept créneaux au maximum et six
      // compléments contre vingt places — mais la borne reste : cleanProfile
      // tronque au même endroit, et un plan plus long que ce que le stockage
      // garde serait faux dès le rechargement.
      res.rejets.push("Le plan ferait " + res.plan.length + " lignes : le stockage " +
                      "n'en garde que " + MAX_NUTRI_ITEMS + ".");
    }

    // CE QUE L'IA ANNONCE, ET C'EST ATTRIBUÉ À L'IA. On ne le présente jamais
    // comme un chiffre de l'appli : il n'est vérifié par rien. Il n'est calculé
    // que si TOUTES les lignes en portent un — un total partiel se lirait comme
    // un total, et c'est le mode d'échec que ce fichier ferme partout ailleurs.
    var aP = 0, aK = 0, tous = src.length > 0;
    for (i = 0; i < src.length; i++) {
      if (src[i].protIA === null || src[i].kcalIA === null) { tous = false; break; }
      aP += src[i].protIA; aK += src[i].kcalIA;
    }
    if (tous) res.annonce = { prot: Math.round(aP), kcal: Math.round(aK) };

    // LE PLANCHER MORD SUR L'ANNONCE, ET PAS SEULEMENT SUR CE QU'ON SAIT LIRE.
    // C'est ce qui donne des dents au validateur sur un plan que la table ne
    // couvre pas : un modèle qui annonce lui-même 1 100 kcal pour quelqu'un dont
    // le plancher est à 1 600 a écrit un mauvais plan de son propre aveu, et
    // aucune lecture d'aliment n'est nécessaire pour le voir.
    //
    // La marge de AV_KCAL_BRUIT n'est pas de la complaisance : nutritionTargets
    // borne déjà la cible AU plancher, donc un plan qui vise correctement peut
    // tomber quelques kilocalories dessous par arrondi. 100 kcal font 4 % d'une
    // journée à 2 500 — la constante dit depuis la v1.5.0 que c'est sous la
    // barre d'erreur du repère lui-même.
    if (res.annonce) {
      var nt = nutritionTargets(prof);
      var plancher = (prof.sex === "f") ? 1400 : 1600;
      if (res.annonce.kcal < plancher - AV_KCAL_BRUIT) {
        res.rejets.push("L'IA annonce " + frNum(res.annonce.kcal) +
          " kcal, sous le plancher de " + frNum(plancher) +
          " kcal. En dessous, la fatigue arrive avant les résultats.");
      } else if (res.annonce.kcal > nt.kcal * NUTRI_IA_KCAL_SUR_MAX) {
        res.rejets.push("L'IA annonce " + frNum(res.annonce.kcal) + " kcal pour " +
          frNum(nt.kcal) + " visées, soit plus de la moitié en trop.");
      }
    }

    // LE PLAN EST COMPLET QUAND RIEN N'A ÉTÉ ÉCARTÉ, à aucun des deux étages.
    // Les refus de FORME comptent autant que les refus de CONTENU : une ligne
    // portant une clé inconnue veut dire que le modèle a proposé une prise de
    // plus, et un plan de sept prises pour six déclarées est un plan dont le
    // nombre de lignes diffère.
    res.complet = !!(cr.length && !fmt && !res.rejets.length &&
                     res.repas.length === cr.length &&
                     res.plan.length <= MAX_NUTRI_ITEMS);

    // LE JUGEMENT DU PLAN, PAR LA FONCTION GARDÉE POUR ÇA. nutriBilanPlan compare
    // un plan à une cible QUOTIDIENNE : débranché de la carte en v1.13.0 parce
    // qu'un plan de compléments ne prétendait plus couvrir une journée, il
    // retrouve ici son sens exact — une journée complète est bien proposée.
    //
    // ⚠️ ET IL NE SE PRONONCE QUE SUR UN PLAN COMPLET. TROUVÉ AU NAVIGATEUR, PAR
    // AUCUN BANC, ET C'EST LE MÊME DÉFAUT QUE CELUI DE LA v1.13.0 SOUS UN AUTRE
    // VISAGE. Réponse hostile réelle : deux prises retenues sur cinq, trois lignes
    // écartées — une pizza en triple, une clé inventée, des chiffres impossibles.
    // La carte affichait alors, sous la liste des refus :
    //
    //     « Le plan apporte 94 g de protéines pour 140 g visés. »
    //
    // L'arithmétique était juste et la phrase fausse. Elle se lit comme un
    // jugement DU PLAN, alors que le manque vient des lignes que l'appli venait
    // elle-même de jeter : elle reprochait à l'utilisateur un trou qu'elle avait
    // creusé. C'est mot pour mot le défaut mesuré et corrigé en v1.5.0, puis
    // retrouvé en v1.13.0 — et deux fois sur trois c'est le navigateur qui l'a vu.
    //
    // LA RÈGLE EST DÉJÀ ÉCRITE AILLEURS DANS CE FICHIER, il suffisait de
    // l'appliquer ici : nutriBilanPlan refuse de conclure dès qu'UNE prise n'est
    // pas chiffrée (« on ne conclut pas »), et nutriTotaux compte les inconnues
    // pour cette raison exacte. Un plan dont trois lignes ont été refusées n'est
    // pas moins amputé qu'un plan dont trois lignes sont non chiffrées.
    //
    // On ne juge donc qu'un plan complet. Sur un plan incomplet, le message utile
    // est la LISTE DES REFUS — c'est elle qui dit quoi redemander à l'IA — et un
    // verdict de plus ne ferait que la brouiller.
    res.bilan = res.complet ? nutriBilanPlan(prof, res.plan) : null;
    return res;
  }

  // ===========================================================================
  // CARTE « DEMANDER A UNE IA »
  // ---------------------------------------------------------------------------
  // Deux zones de texte plutot qu'un bouton magique, et c'est un choix.
  //
  // En sortie : le texte est MONTRE avant d'etre copie. Ces donnees partent vers
  // un service tiers, les afficher est la condition pour decider en connaissance
  // de cause. Le bouton de copie tente navigator.clipboard, puis execCommand ;
  // si les deux echouent, le texte est deja a l'ecran et reste selectionnable a
  // la main. Aucun chemin ne laisse l'utilisateur sans solution.
  //
  // En entree : on ne lit PAS le presse-papier. navigator.clipboard.readText
  // demande une permission a chaque appel sur iOS et echoue en standalone plus
  // souvent qu'a son tour ; un champ ou l'on colle marche partout, toujours.
  // ===========================================================================
  function iaHtml() {
    if (!profile || !profile.done || !profile.plan) return "";

    var entete =
      '<div class="ana-bloc">' +
        '<div class="field-label">Un avis sur mes charges et mon programme</div>' +
        '<button type="button" class="detail-toggle" data-action="toggle-ia" aria-expanded="' +
          (state.iaOuvert ? "true" : "false") + '">' +
          (state.iaOuvert
            ? "Masquer ▲"
            : "Faire relire mes séances · charges, séries, repos ▼") +
        '</button>';

    if (!state.iaOuvert) return entete + '</div>';

    var prompt = iaPrompt();
    var avecCle = iaClePrete();

    var corps =
      '<div class="ia-note">' +
        (avecCle
          ? 'Une clé est enregistrée : l\'appli peut interroger ' + esc(iaFournisseur().label) +
            ' directement. Le presse-papier reste disponible si tu préfères. '
          : 'L\'appli ne se connecte à rien. Tu copies le texte ci-dessous, tu le colles ' +
            'dans l\'appli IA de ton choix, puis tu rapportes sa réponse ici. ') +
        '<b>Ce texte part vers un service tiers</b> : il est affiché en entier pour que ' +
        'tu voies exactement ce que tu envoies.' +
      '</div>';

    // Appel direct : proposé EN PREMIER quand une clé existe, parce que c'est
    // alors le chemin court. Sans clé la section n'apparaît pas du tout —
    // annoncer un bouton qu'on ne peut pas utiliser n'aide personne.
    if (avecCle) {
      corps +=
        '<button type="button" class="ia-btn ia-btn-fort" data-action="ia-demander"' +
          (state.iaOccupe ? ' disabled' : '') + '>' +
          (state.iaOccupe ? '… Analyse en cours' : '✦ Demander à ' + esc(iaFournisseur().label)) +
        '</button>' +
        '<div class="ia-ou">ou passe par le presse-papier</div>';
    }

    corps +=
      '<div class="ia-etape">1 · Copie ce bilan</div>' +
      '<textarea class="ia-zone" id="ia-prompt" readonly rows="7" ' +
        'aria-label="Bilan à copier vers l\'IA">' + esc(prompt) + '</textarea>' +
      '<button type="button" class="ia-btn" data-action="ia-copier">⧉ Copier le bilan</button>' +

      '<div class="ia-etape">2 · Colle la réponse de l\'IA</div>' +
      '<textarea class="ia-zone" id="ia-reponse" rows="5" ' +
        'placeholder="Colle ici la réponse de l\'IA, telle quelle." ' +
        'data-action="ia-saisie" aria-label="Réponse de l\'IA">' + esc(state.iaTexte || "") + '</textarea>' +
      '<button type="button" class="ia-btn" data-action="ia-lire">✓ Lire la réponse</button>';

    // --- Resultat de la lecture -----------------------------------------------
    if (state.iaRes) {
      var r = state.iaRes, k;

      if (r.props.length) {
        var props = "";
        for (k = 0; k < r.props.length; k++) {
          var p = r.props[k];
          props +=
            '<div class="ana-prop ia-prop">' +
              '<div class="ana-prop-texte">' + esc(p.texte) + '</div>' +
              '<div class="ana-prop-raison">' + esc(p.raison) + '</div>' +
              '<div class="ana-prop-actes">' +
                '<button type="button" class="ana-ok-btn" data-action="ia-appliquer" data-i="' + k + '">Appliquer</button>' +
                '<button type="button" class="ana-non-btn" data-action="ia-ignorer" data-i="' + k + '">Ignorer</button>' +
              '</div>' +
            '</div>';
        }
        corps += '<div class="ia-resultat"><div class="field-label">' + r.props.length +
                 ' proposition' + (r.props.length > 1 ? "s" : "") + ' retenue' +
                 (r.props.length > 1 ? "s" : "") + '</div>' + props + '</div>';
      } else if (r.rien) {
        corps += '<div class="ob-note">L\'IA ne propose aucun changement.</div>';
      }

      // Les rejets sont MONTRES. Les avaler en silence laisserait croire que
      // l'IA n'a rien propose, alors qu'elle a propose quelque chose que le
      // mandat refuse — et c'est precisement ce qu'il faut savoir.
      if (r.rejets.length) {
        var rj = "";
        for (k = 0; k < r.rejets.length; k++) rj += '<li>' + esc(r.rejets[k]) + '</li>';
        corps +=
          '<div class="ia-rejets">' +
            '<div class="field-label">' + r.rejets.length + ' écartée' +
              (r.rejets.length > 1 ? "s" : "") + '</div>' +
            '<ul>' + rj + '</ul>' +
            '<div class="ia-rejets-pourquoi">L\'appli ne s\'en remet pas à l\'IA : ' +
              'chaque proposition est revérifiée contre ton programme et ton matériel. ' +
              'Ce qui sort du cadre est écarté ici, pas appliqué.</div>' +
          '</div>';
      }
    }

    corps +=
      '<div class="nutri-disclaimer">' +
        'Une IA se trompe avec aplomb. Elle ne te voit pas, ne connaît ni tes ' +
        'douleurs ni ta technique, et n\'a aucun moyen de vérifier ce qu\'elle avance. ' +
        'Ses propositions ne remplacent pas l\'œil d\'un coach.' +
      '</div>';

    return entete + corps + '</div>';
  }

  // ===========================================================================
  // CARTE « DEMANDER UN PLAN ALIMENTAIRE A UNE IA »
  // ---------------------------------------------------------------------------
  // Même montage que le pont des charges, et pour les mêmes raisons : le texte
  // envoyé est MONTRÉ en entier avant d'être copié, l'entrée se fait par un champ
  // où l'on colle et jamais par une lecture du presse-papier, et l'appel direct
  // n'apparaît que si une clé est enregistrée — annoncer un bouton qu'on ne peut
  // pas utiliser n'aide personne.
  //
  // CE QUE CETTE CARTE NE FAIT PAS, ET ELLE LE DIT : enregistrer. Un écran qui
  // laisse croire qu'il a sauvegardé quelque chose est pire qu'un écran qui ne
  // sauvegarde pas.
  // ===========================================================================
  function iaNutriHtml() {
    if (!profile || !profile.done) return "";
    var cr = nutriCreneauxIA(profile);
    if (!cr.length) return "";

    // SOUS-BLOC, plus une carte : voir iaAssistantHtml, qui reunit les trois
    // morceaux de l'assistant. Le bouton n'est pas un economiseur de scroll — c'est
    // un CHOIX D'OUTIL entre deux ponts qu'on n'utilise pas en meme temps — et son
    // libelle dit ce que l'outil fait, ce qui manquait.
    var entete =
      '<div class="ana-bloc">' +
        '<div class="field-label">Un plan alimentaire pour la journée</div>' +
        '<button type="button" class="detail-toggle" data-action="toggle-ia-nutri" aria-expanded="' +
          (state.iaNutriOuvert ? "true" : "false") + '">' +
          (state.iaNutriOuvert
            ? "Masquer ▲"
            : "Demander un plan · " + cr.length + " prises attendues ▼") +
        '</button>';

    if (!state.iaNutriOuvert) return entete + '</div>';

    var avecCle = iaClePrete();
    var corps =
      '<div class="ia-note">' +
        (avecCle
          ? 'Une clé est enregistrée : l\'appli peut interroger ' + esc(iaFournisseur().label) +
            ' directement. Le presse-papier reste disponible si tu préfères. '
          : 'L\'appli ne se connecte à rien. Tu copies le texte ci-dessous, tu le colles ' +
            'dans l\'appli IA de ton choix, puis tu rapportes sa réponse ici. ') +
        '<b>Ce texte part vers un service tiers</b> : il est affiché en entier pour que ' +
        'tu voies exactement ce que tu envoies.' +
      '</div>';

    if (avecCle) {
      corps +=
        '<button type="button" class="ia-btn ia-btn-fort" data-action="ia-nutri-demander"' +
          (state.iaOccupe ? ' disabled' : '') + '>' +
          (state.iaOccupe ? '… Demande en cours' : '✦ Demander à ' + esc(iaFournisseur().label)) +
        '</button>' +
        '<div class="ia-ou">ou passe par le presse-papier</div>';
    }

    corps +=
      '<div class="ia-etape">1 · Copie ta demande</div>' +
      '<textarea class="ia-zone" id="ia-nutri-prompt" readonly rows="7" ' +
        'aria-label="Demande de plan alimentaire à copier">' + esc(iaPromptNutrition()) + '</textarea>' +
      '<button type="button" class="ia-btn" data-action="ia-nutri-copier">⧉ Copier la demande</button>' +

      '<div class="ia-etape">2 · Colle la réponse de l\'IA</div>' +
      '<textarea class="ia-zone" id="ia-nutri-reponse" rows="5" ' +
        'placeholder="Colle ici la réponse de l\'IA, telle quelle." ' +
        'data-action="ia-nutri-saisie" aria-label="Réponse de l\'IA">' +
        esc(state.iaNutriTexte || "") + '</textarea>' +
      '<button type="button" class="ia-btn" data-action="ia-nutri-lire">✓ Relire et juger</button>';

    corps += iaNutriResultatHtml();

    corps +=
      '<div class="nutri-disclaimer">' +
        'Une IA se trompe avec aplomb, et sur la nourriture plus facilement ' +
        'qu\'ailleurs : elle ne pèse rien, ne voit pas ce qu\'il y a dans ton ' +
        'placard, et n\'a aucun moyen de vérifier ce qu\'elle avance. L\'appli ne ' +
        's\'en remet donc pas à elle — chaque ligne est relue, chiffrée quand elle ' +
        'peut l\'être, et écartée quand elle est aberrante. Ce qui reste n\'est pas ' +
        'un avis médical.' +
      '</div>';

    return entete + corps + '</div>';
  }

  // Le résultat, séparé de la carte parce qu'il est la seule partie qui bouge, et
  // parce que c'est lui que la v1.15.0 complétera d'un bouton d'enregistrement.
  function iaNutriResultatHtml() {
    if (!state.iaNutriRes) return "";
    var r = state.iaNutriRes, v = state.iaNutriVal, out = "", k;

    if (r.rien && !r.lignes.length) {
      out += '<div class="ob-note">L\'IA n\'a pas proposé de plan.</div>';
    }

    if (v && v.repas.length) {
      var lignes = "";
      for (k = 0; k < v.repas.length; k++) {
        lignes +=
          '<div class="ana-prop ia-prop">' +
            '<div class="ana-prop-texte">' + esc(v.repas[k].nom) + ' · ' +
              esc(v.repas[k].time) + '</div>' +
            '<div class="ana-prop-raison">' + esc(v.repas[k].item) + '</div>' +
            '<div class="ana-prop-raison">' + esc(v.repas[k].note) + '</div>' +
          '</div>';
      }
      out += '<div class="ia-resultat"><div class="field-label">' + v.repas.length +
             ' prise' + (v.repas.length > 1 ? "s" : "") + ' retenue' +
             (v.repas.length > 1 ? "s" : "") + ' sur ' + v.creneaux + '</div>' +
             lignes + '</div>';
    }

    // LE JUGEMENT DE L'APPLI SUR LE PLAN. C'est le travail de cette version, et
    // c'est nutriBilanPlan qui le rend — la fonction gardée en v1.13.0 pour ce
    // jour-là. Le plan jugé inclut les compléments, comme celui qui serait écrit.
    //
    // ⚠️ IL N'Y A DE VERDICT QUE SUR UN PLAN COMPLET. Voir nutriValiderPlanIA :
    // juger un plan dont l'appli vient de jeter trois lignes reviendrait à
    // reprocher à l'utilisateur un trou qu'elle a creusé. Sur un plan incomplet on
    // DIT qu'on ne juge pas, plutôt que de se taire — un silence se lirait comme
    // une approbation.
    if (v && v.bilan && v.bilan.texte) {
      out += '<div class="nutri-bilan' + (v.bilan.niveau === 2 ? ' nutri-bilan-2' : '') +
             '">' + esc(v.bilan.texte) + '</div>';
    } else if (v && !v.complet && (v.repas.length || v.rejets.length)) {
      out += '<div class="nutri-bilan">L\'appli ne juge pas ce plan : il est ' +
             'incomplet. Les lignes écartées ci-dessous manquent à la journée, et ' +
             'un total calculé sans elles ne voudrait rien dire. Redemande un plan ' +
             'à l\'IA en lui rappelant ce qui a été refusé.</div>';
    }

    // CE QUE L'IA ANNONCE, NOMMÉ COMME TEL. Il n'est vérifié par rien, donc il
    // n'est jamais présenté comme un chiffre de l'appli.
    if (v && v.annonce) {
      out += '<div class="ob-note">L\'IA annonce ' + frNum(v.annonce.kcal) +
             ' kcal et ' + v.annonce.prot + ' g de protéines sur ses lignes' +
             (v.illisibles
               ? '. L\'appli n\'a pas su chiffrer ' + v.illisibles + ' prise' +
                 (v.illisibles > 1 ? 's' : '') + ' : ces chiffres-là ne sont ' +
                 'vérifiés par rien.'
               : '.') +
             '</div>';
    }

    // LES REJETS SONT MONTRÉS, des deux étages, avec leur compte. Les avaler
    // laisserait croire que l'IA n'a rien proposé alors qu'elle a proposé quelque
    // chose que le mandat refuse — et c'est précisément ce qu'il faut savoir.
    var tous = [], i;
    for (i = 0; i < r.rejets.length; i++) tous.push(r.rejets[i]);
    if (v) { for (i = 0; i < v.rejets.length; i++) tous.push(v.rejets[i]); }
    if (tous.length) {
      var rj = "";
      for (k = 0; k < tous.length; k++) rj += '<li>' + esc(tous[k]) + '</li>';
      out +=
        '<div class="ia-rejets">' +
          '<div class="field-label">' + tous.length + ' écartée' +
            (tous.length > 1 ? "s" : "") + '</div>' +
          '<ul>' + rj + '</ul>' +
          '<div class="ia-rejets-pourquoi">' +
            (v && v.absurdes
              ? 'Dont ' + v.absurdes + ' portion' + (v.absurdes > 1 ? 's' : '') +
                ' aberrante' + (v.absurdes > 1 ? 's' : '') + '. '
              : '') +
            'L\'appli ne s\'en remet pas à l\'IA : chaque ligne est revérifiée contre ' +
            'tes prises déclarées et contre sa table d\'aliments. Ce qui sort du cadre ' +
            'est écarté ici.' +
          '</div>' +
        '</div>';
    }

    // ⚠️ v1.14.0 N'ENREGISTRE RIEN, ET C'EST ÉCRIT. Un écran qui laisse croire
    // qu'il a sauvegardé est pire qu'un écran qui ne sauvegarde pas. Cette phrase
    // est le seul endroit du fichier qui promet la suite, et c'est le bouton
    // d'enregistrement de la v1.15.0 qui la remplacera.
    // ⚠️ LE BOUTON N'APPARAIT QUE SI LE PLAN EST COMPLET, et ce n'est PAS la
    // protection : nutriEcrirePlanIA recompte les lignes de son cote. Voir son
    // commentaire — une protection qui ne vit que dans un gabarit protege l'ecran,
    // pas les donnees.
    if (v && v.complet) {
      out +=
        '<div class="ia-resultat">' +
          '<button type="button" class="ia-btn ia-btn-fort" data-action="ia-nutri-ecrire">' +
            '✓ Enregistrer ce plan' +
          '</button>' +
          '<div class="ia-rejets-pourquoi">Il <b>remplacera</b> ton plan actuel, comme ' +
            'un rediagnostic. Tes séances, tes charges et tes pesées ne sont pas ' +
            'touchées ; les cases de nutrition cochées avant aujourd\'hui ne se ' +
            'liront plus en face de ce plan, et les journées concernées le diront. ' +
            'Tu pourras revenir au plan de l\'appli d\'un bouton.</div>' +
        '</div>';
    } else if (v && (v.repas.length || v.rejets.length)) {
      out += '<div class="ob-note"><b>Ce plan n\'est pas enregistrable</b> tant qu\'il ' +
             'n\'est pas complet : il manque des prises, ou des lignes ont été ' +
             'écartées. Les cases cochées de ton journal sont repérées par leur ' +
             'POSITION dans le plan — un plan plus court les ferait toutes ' +
             'désigner autre chose.</div>';
    }

    return out;
  }

  // ===========================================================================
  // LE DROIT D'ECRIRE — ET SES DEUX VERROUS
  // ---------------------------------------------------------------------------
  // LE PLAN REMPLACE LE PLAN, COMME UN REDIAGNOSTIC. Arbitrage du propriétaire de
  // l'appli : le plan de l'IA ne vit pas à côté dans sa propre carte, il prend la
  // place du plan. Le mécanisme existe et il est testé depuis la v1.5.0 — on
  // repose nutriPlanLe, nutriBilan écarte les journées antérieures au lieu de les
  // mal lire, et render() les étiquette « Ce jour-là, ton plan n'était pas
  // celui-ci ». On ne crée donc aucun mécanisme ici : on branche un cas de plus
  // sur celui qu'un rediagnostic emprunte depuis toujours.
  //
  // ⚠️ PREMIER VERROU : ON RECOMPTE, ON NE CROIT PAS LE DRAPEAU. `complet` a été
  // calculé au moment de la LECTURE. Entre la lecture et le clic, le profil a pu
  // changer — une retouche du nombre de repas dans un autre onglet, un
  // rediagnostic. Le nombre de lignes est donc recompté contre les créneaux
  // déclarés À L'INSTANT d'écrire.
  //
  // ⚠️ SECOND VERROU : IL VIT DANS L'ÉCRITURE, PAS DANS LE GABARIT. Le bouton
  // n'apparaît que si le plan est complet — et ça ne suffit pas. C'est la leçon
  // payée sur nutriCorriger : le crayon était caché pour les lignes de complément,
  // mais la fonction d'écriture ne testait jamais `n.supp`, et une correction
  // « 3 portions de kebab » a fini écrite sur la ligne CRÉATINE. Une protection
  // qui ne vit que dans un gabarit protège l'écran, pas les données.
  //
  // POURQUOI LE NOMBRE DE LIGNES EST LA RÈGLE. entry.nutri est indexé par
  // POSITION : { "0": true, "3": true }. Un plan plus court ou plus long décale
  // toutes les positions, et chaque journée passée parlerait d'autres lignes que
  // celles qu'on avait montrées. Reposer nutriPlanLe protège l'HISTORIQUE ; ça ne
  // rend pas acceptable un plan qui saute le dîner.
  //
  // Rend { ecrit, lignes, reportees, perdues, refus }. `refus` non vide veut dire
  // que RIEN n'a été touché.
