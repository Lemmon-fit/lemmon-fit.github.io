  }

  // =========================================================================
  // SPLASH
  // -------------------------------------------------------------------------
  // Il ne sert qu'au PREMIER lancement, avant le diagnostic. Une fois `vu`
  // pose, il ne revient plus : reafficher un ecran de marque a chaque
  // ouverture ferait perdre une seconde et demie a chaque seance.
  // =========================================================================
  var SPLASH_MS = 1700;
  var _splashFini = false;

  function splashHtml() {
    return '<div class="splash" data-action="splash-passer" role="img"' +
             ' aria-label="LEMMON FIT, chargement">' +
             '<img class="splash-logo" src="icon-512.png" alt="">' +
             '<div class="splash-mot">LEMMON<i>FIT</i></div>' +
           '</div>';
  }

  function splashSortir() {
    if (_splashFini) return;
    _splashFini = true;
    aller(state.vu ? "jour" : "onb");
  }

  // =========================================================================
  // RENDU
  // -------------------------------------------------------------------------
  // ETAPE 1 : aucun ecran n'a de contenu. Chaque vue rend son titre, et un
  // bloc d'echafaudage qui rend le routage verifiable a la main. Ce bloc
  // disparait a l'etape 3.
  // =========================================================================
  function echafaudageHtml() {
    var e = state.ecran, h = "", i, k, cible, dest = [];

    if (has(PARENT, e)) {
      dest.push({ k: PARENT[e], t: "◂ Remonter à " + TITRES[PARENT[e]] });
    }
    for (k in PARENT) {
      if (has(PARENT, k) && PARENT[k] === e) dest.push({ k: k, t: TITRES[k] + " ▸" });
    }
    if (e === "jour") {
      dest.push({ k: "salle", t: "Mode entraînement ▸" });
    }
    if (e === "salle") {
      dest.push({ k: "trans", t: "Enchaînement ▸" });
      dest.push({ k: "jour", t: "◂ Quitter" });
    }
    if (e === "trans") {
      dest.push({ k: "salle", t: "◂ Retour séance" });
    }
    if (e === "onb") {
      dest.push({ k: "__ouvrir", t: "Ouvrir l'appli (pose vu)" });
    }
    if (e === "moi") {
      dest.push({ k: "__onb", t: "Refaire le diagnostic" });
      dest.push({ k: "__reset", t: "Effacer mes données" });
    }

    for (i = 0; i < dest.length; i++) {
      cible = dest[i];
      h += '<button type="button" class="echaf-btn" data-action="echaf"' +
           ' data-ecran="' + cible.k + '">' + esc(cible.t) + '</button>';
    }

    return '<div class="echaf">' +
             '<div class="echaf-t">Échafaudage · étape 1</div>' +
             '<div class="echaf-liste">' + h + '</div>' +
             '<div class="echaf-note">Écran <b>' + esc(state.ecran) + '</b>' +
               ' · glissement ' + (FIGES[state.ecran] ? "figé" : "actif") +
               ' · nav ' + (NAV_CACHEE[state.ecran] ? "masquée" : "visible") +
               ' · diagnostic ' + (state.vu ? "terminé" : "non fait") +
             '</div>' +
           '</div>';
  }

  // =========================================================================
  // LE HTML D'UN ECRAN, SANS LE COMMITTER
  // -------------------------------------------------------------------------
  // rendreCorps() sortait par une dizaine de `return` qui ecrivaient chacun
  // dans racine.innerHTML. On ne pouvait donc demander le HTML que de l'ecran
  // affiche, et seulement en l'affichant. Le glissement a besoin de l'inverse :
  // construire l'ecran VOISIN, le poser a cote du sortant, et ne decider qu'au
  // relacher s'il devient l'ecran courant.
  //
  // corpsDe() ne touche a rien. Elle rend un descripteur :
  //   plein      le HTML complet quand l'ecran pose sa propre enveloppe
  //              (splash, mode entrainement, enchainement) ; null sinon
  //   interieur  le contenu du <div id="ecran">, pour tous les autres
  //   nav        si la nav basse doit etre posee sous l'ecran
  //
  // Elle lit `state` mais JAMAIS `state.ecran` : c'est ce qui lui permet de
  // rendre un ecran qui n'est pas celui affiche. La seule exception est la
  // sortie de secours du bas, qui appelle echafaudageHtml() — elle est
  // inatteignable, les quinze ecrans de TITRES ayant chacun sa branche.
  // =========================================================================
  function corpsDe(e) {
    var nav = !NAV_CACHEE[e], titre, bandeau;

    if (e === "splash") return { plein: splashHtml(), interieur: null, nav: false };

    // Le mode entrainement et l'enchainement sont des PLEINS ECRANS poses
    // par-dessus : ils ne vivent pas dans la gouttiere commune, et la nav basse
    // n'y a pas sa place. On ne sort que par leurs propres boutons.
    if (e === "salle") return { plein: salleHtml(), interieur: null, nav: false };
    if (e === "trans") return { plein: transHtml(), interieur: null, nav: false };

    if (e === "onb") {
      return { plein: null, interieur: onboardingHtml(), nav: nav };
    }
    if (e === "histo") {
      return { plein: null, nav: nav,
               interieur: '<h1 class="ecran-titre">Historique</h1>' + histoHtml() };
    }
    if (e === "fiche") {
      return { plein: null, interieur: ficheHtml(), nav: nav };
    }
    if (e === "prog") {
      return { plein: null, nav: nav,
               interieur: '<h1 class="ecran-titre">Progrès</h1>' + progHtml() };
    }
    if (e === "ia") {
      return { plein: null, nav: nav,
               interieur: retourHtml(e) + '<h1 class="ecran-titre-2">Assistant IA</h1>' + iaHtml() };
    }
    if (e === "nutri") {
      return { plein: null, nav: nav,
               interieur: '<h1 class="ecran-titre">Nutrition</h1>' + nutriHtml() };
    }
    if (e === "moi") {
      return { plein: null, nav: nav,
               interieur: '<h1 class="ecran-titre">Moi</h1>' + moiHtml() };
    }
    if (e === "profil") {
      return { plein: null, nav: nav,
               interieur: retourHtml(e) + '<h1 class="ecran-titre-2">Profil</h1>' + profilHtml() };
    }
    if (e === "monprog") {
      return { plein: null, nav: nav,
               interieur: retourHtml(e) + '<h1 class="ecran-titre-2">Mon programme</h1>' + monProgHtml() };
    }
    if (e === "exos") {
      return { plein: null, nav: nav,
               interieur: retourHtml(e) + '<h1 class="ecran-titre-2">Mes exercices</h1>' + exosCatalogueHtml() };
    }
    if (e === "theme") {
      return { plein: null, nav: nav,
               interieur: retourHtml(e) + '<h1 class="ecran-titre-2">Apparence</h1>' + themeHtml() };
    }
    if (e === "jour") {
      return { plein: null, interieur: jourHtml(), nav: nav };
    }

    titre = TITRES[e] || "";
    // LE BANDEAU DE VALIDATION. Il est pose ici en attendant l'ecran
    // Historique, a l'etape 5. Il ne remplace PAS la ligne dans la liste : une
    // seance validee doit apparaitre dans l'historique, pas seulement dans un
    // bandeau qu'on ferme et qui emporte la preuve avec lui.
    bandeau = "";
    if (e === "histo" && state.archive) {
      bandeau = '<div class="bandeau-ok"><span class="bo-t">Séance enregistrée' +
                '<span class="bo-s">' + esc(state.archive) + "</span></span>" +
                '<button type="button" class="bo-x" data-action="fermer-bandeau"' +
                ' aria-label="Fermer">✕</button></div>';
    }

    return { plein: null, nav: nav,
             interieur: '<h1 class="' + (has(PARENT, e) ? "ecran-titre-2" : "ecran-titre") + '">' +
                          esc(titre) + '</h1>' + bandeau + echafaudageHtml() };
  }

  // Le meme descripteur, mais monte : l'enveloppe que corpsDe ne pose pas.
  // Le glissement s'en sert aussi, avec une CLASSE au lieu de l'identifiant,
  // pour ne jamais avoir deux `#ecran` dans le document.
  function envelopper(c, avecId) {
    if (c.plein !== null) return c.plein;
    return '<div ' + (avecId ? 'id="ecran"' : 'class="ecran"') + '>' + c.interieur + "</div>";
  }

  // ENVELOPPE. rendre() appelle l'animation d'entree UNE fois, apres coup :
  // la repartir dans corpsDe inviterait a en oublier une branche.
  function rendre() {
    rendreCorps();
    animerEntree();
  }

  function rendreCorps() {
    var e, c, racine;

    appliqueTheme();

    e = state.ecran;
    racine = document.getElementById("app");
    if (!racine) return;

    c = corpsDe(e);
    document.body.className = c.nav ? "a-nav" : "";
    racine.innerHTML = envelopper(c, true) + (c.nav ? navHtml() : "");
  }

  // =========================================================================
  // EVENEMENTS
  // -------------------------------------------------------------------------
  // Delegation unique sur le document. Le DOM est reconstruit a chaque rendu :
  // attacher les ecouteurs aux elements les perdrait au rendu suivant, et
  // garder une reference a un noeud detache est le piege classique.
  // =========================================================================
  function cible(ev) {
    var n = ev.target;
    while (n && n !== document) {
      if (n.getAttribute && n.getAttribute("data-action")) return n;
      n = n.parentNode;
    }
    return null;
  }

  function basculerTableau(cle, i) {
    var v = state[cle].slice(), o = {};
    v[i] = v[i] ? 0 : 1;
    o[cle] = v;
    poser(o);
  }

  function borner(v, mini, maxi) {
    return v < mini ? mini : (v > maxi ? maxi : v);
  }

  // `exclus` est indexe par POSITION dans le catalogue. Un objet, pas un
  // tableau : seules les exclusions sont stockees, donc un catalogue qui
  // grandit n'oblige a rien migrer.
  function basculerExclu(i) {
    var maj = {}, k;
    for (k in state.exclus) { if (has(state.exclus, k)) maj[k] = state.exclus[k]; }
    if (maj[i]) delete maj[i]; else maj[i] = 1;
    poser({ exclus: maj });
  }

  function onClick(ev) {
    var n = cible(ev), action, ec, o = {};
    if (!n) return;
    action = n.getAttribute("data-action");
    ec = n.getAttribute("data-ecran");

    // --- Diagnostic ---
    if (action === "ob-next") { obSuivant(); return; }
    if (action === "ob-prev") { obPrecedent(); return; }
    if (action === "ob-aller") {
      poser({ obStep: parseInt(n.getAttribute("data-v"), 10) || 0 });
      window.scrollTo(0, 0); return;
    }
    if (action === "ob-jour") { basculerTableau("obJours", parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "ob-second") { basculerSecond(parseInt(n.getAttribute("data-ji"), 10)); return; }
    // L'accordeon de l'etape Programme. UNE journee ouverte a la fois : rouvrir
    // celle qui l'est deja la referme, sinon le bouton n'aurait pas d'effet
    // visible et on croirait au bug.
    if (action === "ob-jour-ouvrir") {
      var cj = n.getAttribute("data-cle");
      poser({ obJourOuvert: state.obJourOuvert === cj ? "" : cj });
      return;
    }
    // « Non merci » sur un exercice. Ecrit enfin obRefus, que la derivation
    // lisait depuis toujours sans que rien ne le remplisse.
    if (action === "ob-refuser") { basculerRefus(n.getAttribute("data-cle")); return; }
    // Le memo technique du mode entrainement. `tech` etait declare dans les
    // defauts depuis le debut et n'etait lu nulle part : il attendait ce
    // bouton-la.
    if (action === "basculer-tech") { poser({ tech: !state.tech }); return; }
    if (action === "ia-appliquer") { iaAppliquer(parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "ia-ignorer") { iaIgnorer(parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "ob-equip") {
      var iEq = parseInt(n.getAttribute("data-i"), 10);
      basculerTableau("obEquip", iEq);
      // COCHER « MACHINES DE SALLE » DEROULE UNE LISTE DE TREIZE CASES, ET
      // ELLE S'OUVRE SOUS LA DERNIERE CASE DE L'ECRAN, DONC SOUS LA LIGNE DE
      // FLOTTAISON. Sans ce defilement, on coche et il ne se passe rien de
      // visible : c'est exactement ce qu'Olivier decrivait, et aucun des
      // chemins de rendu n'appelait scrollTo. On amene donc le bloc a l'ecran.
      // Defilement INSTANTANE, pas « smooth » : un defilement anime se dispute
      // le doigt de l'utilisateur, et il ne se verifie pas ici, ou le panneau
      // ne peint pas. On amene le bloc a 12 px du haut plutot qu'a ras bord,
      // pour qu'on voie qu'il y a quelque chose au-dessus.
      if (iEq === I_MACHINES && state.obEquip[I_MACHINES]) { montrerLesMachines(); }
      return;
    }
    if (action === "ob-gear") { basculerTableau("obGear", parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "ob-supp") { basculerTableau("obSupps", parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "ob-single") {
      o[n.getAttribute("data-cle")] = parseInt(n.getAttribute("data-v"), 10);
      poser(o); return;
    }
    if (action === "ob-sexe") { poser({ obSexe: parseInt(n.getAttribute("data-v"), 10) }); return; }
    if (action === "ob-bascule") {
      var c = n.getAttribute("data-cle");
      o[c] = state[c] ? 0 : 1;
      poser(o); return;
    }
    if (action === "ob-halt") {
      poser({ obHalt: borner(state.obHalt + parseInt(n.getAttribute("data-d"), 10), 2, 60) });
      return;
    }
    if (action === "ob-cours-min") {
      var ji = parseInt(n.getAttribute("data-ji"), 10), k = parseInt(n.getAttribute("data-k"), 10);
      var acte = (state.obAct[ji] || [])[k];
      if (acte) majCours(ji, k, "min", borner(acte.min + parseInt(n.getAttribute("data-d"), 10), 15, 180));
      return;
    }
    if (action === "ob-cours-nat") {
      majCours(parseInt(n.getAttribute("data-ji"), 10),
               parseInt(n.getAttribute("data-k"), 10),
               "nat", parseInt(n.getAttribute("data-v"), 10));
      return;
    }

    // --- Aujourd'hui ---
    if (action === "creneau") {
      // Changer de creneau annule le remplacement : il valait pour l'activite
      // qu'on vient de quitter.
      poser({ slotAuj: parseInt(n.getAttribute("data-i"), 10), remplaceJour: "" });
      return;
    }
    if (action === "demarrer-seance") { demarrerSeance(); return; }
    if (action === "autre-seance") {
      poser({ remplaceJour: "salle", seance: (state.seance + 1) % SEANCES.length });
      return;
    }
    // Choisir NOMMEMENT une seance dans la liste des cinq, au lieu de faire
    // defiler a l'aveugle.
    if (action === "choisir-seance") {
      poser({ remplaceJour: "salle", seance: parseInt(n.getAttribute("data-i"), 10) || 0 });
      return;
    }
    // REMPLACER L'ACTIVITE DU JOUR par une autre discipline, pour aujourd'hui
    // seulement. Le programme de la semaine n'est pas touche.
    if (action === "remplacer-jour") {
      var t = n.getAttribute("data-t");
      poser({ remplaceJour: t,
              // Passer a la salle sans avoir choisi de seance ouvrirait sur
              // celle du jour precedent : on repart de la rotation.
              seance: t === "salle" ? (deriver().siDepart || 0) : state.seance });
      return;
    }
    if (action === "reprendre-prevu") { poser({ remplaceJour: "" }); return; }
    if (action === "basculer-liste") { poser({ listeFermee: !state.listeFermee }); return; }
    if (action === "ouvrir-exo") { ouvrirExercice(parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "valider-act") {
      validerActivite(parseInt(n.getAttribute("data-ji"), 10), parseInt(n.getAttribute("data-k"), 10));
      return;
    }
    if (action === "run-lieu") {
      majCours(parseInt(n.getAttribute("data-ji"), 10), parseInt(n.getAttribute("data-k"), 10),
               "lieu", parseInt(n.getAttribute("data-v"), 10));
      poser({ runLieu: parseInt(n.getAttribute("data-v"), 10) });
      return;
    }
    if (action === "pesee-faite") { noterPesee(); return; }
    // « Corriger » rouvre la saisie du jour. Se peser deux fois de suite est
    // banal ; figer la journee obligerait a attendre sept jours pour rectifier
    // un chiffre tape de travers.
    if (action === "pesee-corriger") { poser({ peseeFaite: false }); return; }

    // --- Mode entrainement ---
    if (action === "valider-serie") { validerSerie(); return; }
    // Reprendre la precedente : on pose les deux valeurs, PUIS on valide par le
    // meme chemin que la saisie a la main. Ecrire directement dans `faits`
    // court-circuiterait le passage en repos et la detection de fin
    // d'exercice, et la serie ne compterait pas comme les autres.
    if (action === "reprendre-serie") {
      var fr = faitsOu()[state.tIdx], pr = fr && fr.length ? fr[fr.length - 1] : null;
      if (!pr) return;
      state.kg = pr.kg;
      state.reps = pr.reps;
      validerSerie();
      return;
    }
    if (action === "kg-pas") {
      // Le pas suit l'unite : 2,5 kg sur une barre, 1 minute sur un bloc
      // chronometre. Un pas unique obligerait a taper huit fois pour monter de
      // 20 kg, ou ferait sauter une minute et demie sur un echauffement.
      var exo = exosDe(state.seance)[state.tIdx];
      var pas = (exo && exo.unite === "min") ? 1 : 2.5;
      poser({ kg: Math.max(0, Math.round((state.kg + parseInt(n.getAttribute("data-d"), 10) * pas) * 10) / 10) });
      return;
    }
    if (action === "reps-pas") {
      poser({ reps: Math.max(1, state.reps + parseInt(n.getAttribute("data-d"), 10)) });
      return;
    }
    if (action === "repos-regler") {
      // Allonger le repos allonge AUSSI la reference de l'anneau, sinon l'arc
      // depasserait le tour complet et ne voudrait plus rien dire.
      var nouveau = borner(state.repos + parseInt(n.getAttribute("data-d"), 10), 15, 300);
      poser({ repos: nouveau,
              reposTotal: nouveau > state.reposTotal ? nouveau : state.reposTotal });
      return;
    }
    if (action === "repos-passer") { poser({ phase: "set", repos: 90, reposTotal: 90 }); return; }
    if (action === "annuler-serie") { annulerSerie(); return; }
    if (action === "aller-trans") { poser({ ecran: "trans", phase: "transition", finiIdx: state.tIdx }); return; }
    if (action === "finir-seance") { poser({ ecran: "salle", phase: "fin" }); return; }
    if (action === "enregistrer-seance") { enregistrerSeance(); return; }
    if (action === "quitter-seance") { quitterSeance(); return; }
    if (action === "fermer-bandeau") { poser({ archive: null }); return; }
    if (action === "mode-chart") { poser({ modeChart: parseInt(n.getAttribute("data-v"), 10) }); return; }

    // --- Branche Moi ---
    if (action === "aller-profil") { aller("profil"); return; }
    if (action === "aller-monprog") { aller("monprog"); return; }
    if (action === "aller-exos") { aller("exos"); return; }
    if (action === "aller-theme") { aller("theme"); return; }
    if (action === "aller-ia") { poser({ iaOnglet: 0, iaCopie: false, ecran: "ia" }); window.scrollTo(0,0); return; }
    if (action === "aller-ia-nutri") { poser({ iaOnglet: 1, iaCopie: false, ecran: "ia" }); window.scrollTo(0,0); return; }
    if (action === "ia-onglet") { poser({ iaOnglet: parseInt(n.getAttribute("data-v"), 10), iaCopie: false }); return; }
    if (action === "ia-copier") { iaCopier(); return; }
    if (action === "ia-lire") { iaLireReponse(); return; }
    if (action === "ob-etape") {
      // Chaque ligne du Profil porte SON etape : on y retourne directement au
      // lieu de rouvrir le diagnostic au debut. Et on RETIENT d'ou l'on vient,
      // sans quoi on ne saurait pas ou rendre la main.
      var etape = parseInt(n.getAttribute("data-v"), 10) || 0;
      poser({ ecran: "onb", obStep: etape, retourDe: state.ecran });
      window.scrollTo(0, 0);
      // « Ce dont je dispose » annonce un nombre de machines : on ouvre donc sur
      // les machines, pas sur les cinq cases qui les precedent.
      if (etape === ETAPE_MATERIEL && state.obEquip[I_MACHINES]) { montrerLesMachines(); }
      return;
    }
    if (action === "ob-quitter") { obQuitter(false); return; }
    if (action === "ob-refaire") {
      poser({ ecran: "onb", obStep: 0, vu: false, retourDe: "" });
      window.scrollTo(0, 0);
      return;
    }
    if (action === "photo-retirer") { photoRetirer(); return; }
    if (action === "exporter") { exporterJournal(); return; }
    if (action === "recharger-maj") { rechargerMaj(); return; }
    if (action === "reset-demander") { poser({ resetDemande: true }); return; }
    if (action === "reset-annuler") { poser({ resetDemande: false }); return; }
    if (action === "reset-confirmer") { resetConfirmer(); return; }
    if (action === "exclu") { basculerExclu(parseInt(n.getAttribute("data-i"), 10)); return; }
    if (action === "theme-choisir") { poser({ theme: parseInt(n.getAttribute("data-v"), 10) }); return; }
    if (action === "ajout-ouvrir") {
      var si = n.getAttribute("data-si");
      poser({ ajoutOuvert: state.ajoutOuvert === si ? "" : si });
      return;
    }
    if (action === "exo-retirer") {
      exoRetirer(parseInt(n.getAttribute("data-si"), 10), n.getAttribute("data-nom"));
      return;
    }
    if (action === "exo-ajouter") { exoAjouter(n.getAttribute("data-cle")); return; }
    if (action === "fiche") { poser({ ficheEx: n.getAttribute("data-nom"), ecran: "fiche" }); window.scrollTo(0,0); return; }
    if (action === "fiche-seance") { ouvrirFicheSeance(n.getAttribute("data-d")); return; }

    if (action === "splash-passer") {
      splashSortir();

    } else if (action === "onglet") {
      aller(ec);

    } else if (action === "echaf") {
      if (ec === "__ouvrir") {
        // Le bouton final du diagnostic. `seance` ne doit JAMAIS valoir null :
        // c'est ce qui vidait l'ecran quand le jour courant etait un cours.
        // A l'etape 3 il vaudra siDepart ; ici on garde simplement un entier.
        poser({ vu: true, ecran: "jour", seance: state.seance || 0 });
      } else if (ec === "__onb") {
        poser({ ecran: "onb", obStep: 0 });
      } else if (ec === "__reset") {
        try { window.localStorage.removeItem(CLE); } catch (e) {}
        window.location.reload();
      } else {
        aller(ec);
      }
    }
  }

  // Les champs de saisie du diagnostic. Ils ecrivent SANS redessiner : voir
  // poserSansRendre. Le champ affiche deja ce que l'utilisateur tape, le
  // reconstruire ne servirait qu'a lui reprendre le curseur.
  var CHAMPS_TEXTE = {
    "ob-prenom": "obPrenom", "ob-age": "obAge", "ob-taille": "obTaille",
    "ob-poids": "obPoids", "ob-cible": "obPoidsCible",
    "ob-duree-libre": "obDureeLibre",
    "run-km": "runKm", "run-min": "runMin", "recherche": "recherche",
    "ia-coller": "iaTexte"
  };

  function onSaisie(ev) {
    var n = cible(ev), action, o = {}, ji, k, liste, copie2, kk, acte, p, neuf;
    if (!n) return;
    action = n.getAttribute("data-action");

    if (has(CHAMPS_TEXTE, action)) {
      o[CHAMPS_TEXTE[action]] = n.value;
      poserSansRendre(o);
      return;
    }

    if (action === "ob-cours-nom") {
      ji = parseInt(n.getAttribute("data-ji"), 10);
      k = parseInt(n.getAttribute("data-k"), 10);
      liste = (state.obAct[ji] || []).slice();
      acte = liste[k];
      if (!acte) return;
      neuf = {};
      for (p in acte) { if (has(acte, p)) neuf[p] = acte[p]; }
      neuf.nom = n.value;
      liste[k] = neuf;
      copie2 = {};
      for (kk in state.obAct) { if (has(state.obAct, kk)) copie2[kk] = state.obAct[kk]; }
      copie2[ji] = liste;
      poserSansRendre({ obAct: copie2 });
    }
  }

  // Le changement de discipline, lui, DOIT redessiner : il fait apparaitre ou
  // disparaitre le second creneau et le bloc de reglage du cours.
  function onChangement(ev) {
    var n = cible(ev), action;
    if (!n) return;
    action = n.getAttribute("data-action");

    // Un input file n'emet pas de clic exploitable : c'est « change » qui dit
    // qu'un fichier a ete choisi.
    if (action === "photo-choisir") { photoChoisir(n); return; }
    if (action === "importer") { importerJournal(n); return; }

    // LA DUREE LIBRE SE REDESSINE AU MOMENT OU L'ON QUITTE LE CHAMP, pas a
    // chaque frappe : c'est la seule facon d'eteindre le repere de 45 min
    // pendant qu'on tape 50, sans reconstruire le champ sous le curseur.
    // La valeur, elle, est deja enregistree par CHAMPS_TEXTE a la frappe.
    if (action === "ob-duree-libre") { poser({ obDureeLibre: n.value }); return; }

    if (action !== "ob-slot") return;
    poserSlot(parseInt(n.getAttribute("data-ji"), 10),
              parseInt(n.getAttribute("data-k"), 10),
              n.value);
  }

  // =========================================================================
  // DEMARRAGE
  // =========================================================================
  function demarrer() {
    var sauve, k;

    poserDefauts();

    // La lecture se fait AVANT le premier rendu, sans exception. Rendre puis
    // relire produirait un battement visible et, pire, un ecran construit sur
    // des valeurs par defaut que l'utilisateur n'a jamais choisies.
    sauve = lire();
    if (sauve) {
      for (k in sauve) { if (has(sauve, k)) state[k] = sauve[k]; }
    }
    _dernier = null;

    // `actFaits` est RECALCULE depuis le journal a chaque demarrage. Il decrit
    // la semaine courante ; le laisser tel qu'il a ete sauve afficherait lundi
    // matin les coches de la semaine passee, et le selecteur de creneau
    // annoncerait « fait » sur une seance qui ne l'est pas.
    state.actFaits = faitsSemaine();

    appliqueTheme();

    // LE SERVICE WORKER N'ETAIT ENREGISTRE NULLE PART, et personne ne le
    // demandait : le prompt 1 ne le mentionne pas, aucun autre non plus. Il est
    // pourtant la condition du « hors-ligne d'abord » du README, et sans lui le
    // bouton « Recharger la derniere version » vide un cache qui n'a jamais ete
    // rempli. Trouve a la recette, parcours 12.
    //
    // On enregistre APRES le chargement : le faire pendant retarderait le
    // premier rendu pour un service qui ne sert qu'aux visites suivantes.
    try {
      if (window.navigator && window.navigator.serviceWorker) {
        window.addEventListener("load", function () {
          window.navigator.serviceWorker.register("sw.js")["catch"](function () {
            // Un echec d'enregistrement n'est pas fatal : l'appli marche en
            // ligne. On l'avale plutot que de sortir une erreur que
            // l'utilisateur ne peut pas traiter.
          });
        }, false);
      }
    } catch (e) {}

    armerChrono();

    document.addEventListener("click", onClick, false);
    document.addEventListener("input", onSaisie, false);
    document.addEventListener("change", onChangement, false);
    // touchmove est PASSIF, comme touchstart : on n'appelle jamais
    // preventDefault. Ce qui reserve l'horizontale, c'est `touch-action: pan-y`
    // sur l'ecran, declare en CSS ; un ecouteur non passif ne servirait qu'a
    // faire attendre le defilement vertical a chaque image.
    document.addEventListener("touchstart", tStart, { passive: true });
    document.addEventListener("touchmove", tMove, { passive: true });
    document.addEventListener("touchend", tEnd, false);
    document.addEventListener("touchcancel", tCancel, false);
    window.addEventListener("pagehide", ecrireAvantDeQuitter, false);

    // Le systeme peut changer de theme pendant que l'appli est ouverte.
    try {
      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        if (mq.addEventListener) {
          mq.addEventListener("change", function () { if (state.theme === 2) rendre(); });
        } else if (mq.addListener) {
          mq.addListener(function () { if (state.theme === 2) rendre(); });
        }
      }
    } catch (e) {}

    if (state.vu) {
      // Diagnostic deja fait : pas de splash du tout.
      _splashFini = true;
      state.ecran = "jour";
      rendre();
    } else {
      state.ecran = "splash";
      rendre();
      window.setTimeout(splashSortir, SPLASH_MS);
    }
  }

  // Pilotage depuis les bancs. Sans ces trois portes, un test ne peut ni lire
  // ni forcer l'etat interne, et il ne resterait qu'a tester le DOM rendu.
  window.__lf = {
    version: APP_VERSION,
    lire: function (k) { return state[k]; },
    poser: function (k, v) { state[k] = v; rendre(); },
    etat: function () { return state; },
    defauts: DEFAUTS,
    clesSauvees: CLES_SAUVEES,
    cle: CLE,
    onglets: ONGLETS,
    parent: PARENT,
    figes: FIGES,
    titres: TITRES,
    glisser: glisser,
    aller: aller,
    // Le glissement, pour les bancs. Sans ces portes, un banc ne peut verifier
    // que la bascule finale — c'est-a-dire exactement ce qui marchait deja, et
    // pas le mouvement, qui est tout le sujet.
    cibleDe: cibleDe,
    glissePiste: function () { return _piste; },
    glisseDx: function () { return _dxCourant; },
    glisseCible: function () { return _cible; },
    corpsDe: corpsDe,
    ecrireMaintenant: ecrireMaintenant,
    // Derivation. Exposee entiere : un banc doit pouvoir verifier la rotation
    // sans passer par le DOM, sinon il mesure le rendu et pas la regle.
    deriver: deriver,
    exosDe: exosDe,
    exosDisponibles: exosDisponibles,
    nbTravail: nbTravail,
    // La duree en salle, ses trois lectures. Un banc doit pouvoir verifier que
    // le champ libre donne le meme nombre d'exercices que le repere voisin.
    dureeMinutes: dureeMinutes,
    dureeLibelle: dureeLibelle,
    nbTravailPour: nbTravailPour,
    // Le modele calorique de la refonte. Expose entier : un banc doit pouvoir
    // verifier le detail (metabolisme de base, vie courante, sport) et pas
    // seulement le total, sinon deux erreurs qui se compensent passeraient.
    cibles: ciblesNutrition,
    mbDeBase: mbDeBase,
    kcalSeance: kcalSeance,
    jourIndexAujourdhui: jourIndexAujourdhui,
    jours: JOURS,
    // Le moteur greffe de la v1.21.0. Il reste enferme dans sa propre portee ;
    // cette porte sert aux bancs et au raccordement des ecrans, pas a le
    // publier sur window.
    moteur: MOTEUR
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", demarrer, false);
  } else {
    demarrer();
  }
})();
</script>
</body>
</html>
