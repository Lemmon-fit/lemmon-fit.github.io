  function seancesDeExercice(nom, n) {
    var h = histTrie(), out = [], i, j, ex, meilleure;
    for (i = 0; i < h.length && out.length < n; i++) {
      if (h[i].t !== "salle" || !h[i].ex) continue;
      for (j = 0; j < h[i].ex.length; j++) {
        ex = h[i].ex[j];
        if (ex.nom !== nom || !ex.sets.length) continue;
        meilleure = 0;
        for (var k = 0; k < ex.sets.length; k++) {
          if (ex.sets[k].kg > meilleure) meilleure = ex.sets[k].kg;
        }
        out.push({ d: h[i].d, kg: meilleure, sets: ex.sets });
        break;
      }
    }
    return out.reverse();
  }

  // Douze semaines de valeurs hebdomadaires, pour les courbes de l'ecran
  // Progres. Une semaine sans rien vaut 0 et n'est pas trouee : un trou ferait
  // sauter la ligne d'un point a l'autre en cachant l'absence.
  function serieHebdo(mode) {
    var h = state.hist || [], i, s, out = [], lundi = lundiDe(new Date()), sem, val, d, e;
    var seaux = [];
    for (i = 0; i < 12; i++) seaux.push(0);

    for (i = 0; i < h.length; i++) {
      s = h[i];
      d = dateDepuisCle(s.d);
      if (!d) continue;
      e = Math.floor(jourEcart(lundi, lundiDe(d)) / 7);
      if (e < 0 || e > 11) continue;
      sem = 11 - e;
      if (mode === "tonnage") val = s.t === "salle" ? (s.tonnage || 0) : 0;
      else if (mode === "distance") val = s.t === "run" ? nombreOu(s.km, 0) : 0;
      else if (mode === "seances") val = 1;
      else val = 0;
      seaux[sem] += val;
    }

    if (mode === "poids") {
      // Le poids n'est pas un CUMUL : on prend la derniere pesee connue de
      // chaque semaine, et on reporte la precedente sur les semaines sans
      // pesee. Sommer des poids ne voudrait rien dire.
      var pes = state.pesees || [], dernier = 0;
      for (i = 0; i < 12; i++) seaux[i] = null;
      for (i = 0; i < pes.length; i++) {
        d = dateDepuisCle(pes[i].d);
        if (!d) continue;
        e = Math.floor(jourEcart(lundi, lundiDe(d)) / 7);
        if (e < 0 || e > 11) continue;
        seaux[11 - e] = pes[i].kg;
      }
      for (i = 0; i < 12; i++) {
        if (seaux[i] === null) seaux[i] = dernier;
        else dernier = seaux[i];
      }
      // Les semaines d'avant la premiere pesee valent la premiere connue,
      // sinon la courbe partirait de zero et transformerait deux kilos perdus
      // en effondrement.
      var premier = 0;
      for (i = 0; i < 12; i++) { if (seaux[i]) { premier = seaux[i]; break; } }
      for (i = 0; i < 12; i++) { if (!seaux[i]) seaux[i] = premier; else break; }
    }

    for (i = 0; i < 12; i++) out.push(seaux[i]);
    return out;
  }

  // Quels modes la semaine DECLAREE peut produire. Proposer « Distance » a
  // quelqu'un qui ne court pas afficherait une courbe plate a zero, et
  // laisserait croire a une regression.
  // Chaque mode porte SA teinte et SON libelle. La maquette colore la serie
  // avec la couleur de sa discipline — bleu en Distance, citron en Tonnage —
  // et nomme ce qu'elle mesure au-dessus de la courbe. Sans ca, quatre modes
  // rendaient quatre courbes identiques a l'oeil.
  var T_SALLE = { trait: "var(--citron-courbe)", aire: "var(--salle-pale)", encre: "var(--citron-encre)" };
  var T_RUN   = { trait: "var(--run-bg)",        aire: "var(--run-pale)",   encre: "var(--run-encre)" };
  var T_VERT  = { trait: "var(--vert-bg)",       aire: "var(--vert-pale)",  encre: "var(--vert-encre)" };

  function modesDisponibles() {
    var d = deriver(), out = [];
    // LE POIDS EST LA PREMIERE CHOSE QU'ON VIENT REGARDER, et son onglet
    // disparaissait tant qu'aucune pesee n'etait notee. Il s'affichait donc
    // exactement quand on en avait le moins besoin : au debut. Signale par
    // Olivier.
    //
    // Il suffit maintenant d'un poids declare au diagnostic, ce que tout le
    // monde a. Sans pesee, l'ecran ne dessine PAS de courbe plate : il dit
    // qu'il n'y a rien a tracer et ou aller le noter. Une ligne horizontale au
    // poids declare se lirait comme douze semaines sans le moindre progres.
    if ((state.pesees || []).length || nombreOu(state.obPoids, 0) > 0) {
      out.push({ v: "poids", t: "Poids", u: "kg",
                 l: "ton poids semaine après semaine", c: T_VERT });
    }
    // EN PREMIER, comme la maquette, et parce que c'est ce qu'on vient
    // regarder. `modeChart` est un INDICE enregistre : le reordonnancement
    // designera donc une autre serie une fois, chez qui avait deja choisi un
    // onglet. Sans consequence, un toucher remet le bon.
    if (d.slotsSalle.length) {
      out.push({ v: "tonnage", t: "Tonnage", u: "kg",
                 l: "kilos soulevés par semaine", c: T_SALLE });
    }
    if (d.slotsRun.length) {
      out.push({ v: "distance", t: "Distance", u: "km",
                 l: "kilomètres courus par semaine", c: T_RUN });
    }
    if (d.slots.length) {
      out.push({ v: "seances", t: "Séances", u: "",
                 l: "séances faites par semaine", c: T_SALLE });
    }
    return out;
  }

  /* =========================================================================
     LES REPERES CALORIQUES — LE MODELE
     -------------------------------------------------------------------------
     CE QU'IL Y AVAIT AVANT, ET POURQUOI IL A CHANGE.

     Le moteur de la v1.21.0 calcule un maintien journalier ainsi :

         maintien = poids x (28 + nombre de jours d'entrainement)

     Deux choses n'y entrent pas, et Olivier les a relevees a la revue :
       - LA MORPHOLOGIE. Seul le poids compte. Taille et age sont demandes au
         diagnostic et ne servent a rien ici ; le sexe ne sert que de plancher.
       - LA NATURE ET LA DUREE DE L'EFFORT. Un jour de pilates et un jour de
         cross training valent exactement la meme chose : une unite de plus.
         La duree du cours est enregistree, elle ne sert qu'a l'affichage.

     CE MODELE-CI FAIT ENTRER LES DEUX, en trois termes :

       1. METABOLISME DE BASE, par Mifflin-St Jeor. Quatre entrees : poids,
          taille, age, sexe. C'est la que passe la morphologie.
       2. VIE COURANTE = metabolisme de base x 1,30. Volontairement bas :
          l'entrainement est compte a part, et un facteur d'activite plus
          genereux le compterait deux fois.
       3. ENTRAINEMENT, SEANCE PAR SEANCE, sur la semaine, puis rapporte au
          jour. C'est la que passent la nature et la duree.

     ---------------------------------------------------------------------
     D'OU VIENNENT LES CHIFFRES

     Les MET sont des valeurs de reference du Compendium of Physical
     Activities : un MET vaut la depense au repos, et une activite a 6 MET
     coute six fois cela. La conversion usuelle est

         kcal = MET x poids(kg) x heures

     LA MORPHOLOGIE ENTRE DONC UNE SECONDE FOIS ICI, par le poids : a effort
     egal, un corps plus lourd depense davantage.

     ⚠️ CE SONT DES MOYENNES DE POPULATION, PAS UNE MESURE. Deux personnes au
     meme cours de zumba ne depensent pas la meme chose : l'intensite reelle,
     l'efficacite gestuelle et le niveau d'entrainement font varier le chiffre
     sans que l'appli puisse le savoir. Les ecrans continuent donc de dire
     « reperes », jamais « depense mesuree ».

     ⚠️ CE BLOC N'EST PAS LE MOTEUR. Le moteur reste greffe VERBATIM de la
     v1.21.0 et reste rejouable par greffer_moteur.py ; l'y retoucher aurait
     ete efface au prochain rejeu. Verifie avant d'ecrire ce bloc :
     `nutritionTargets` n'est appelee NULLE PART a l'interieur du moteur, elle
     ne l'est que par l'interface. La remplacer ici suffit donc a changer le
     modele partout, sans laisser le moteur travailler sur l'ancien.

     Les regles d'aval — deficit, surplus, plancher, proteines, horizon —
     sont REPRISES du moteur a l'identique, et c'est delibere : seul le
     maintien change. Elles sont commentees une a une plus bas pour qu'on voie
     qu'elles disent la meme chose que lui.
     ========================================================================= */

  // Le cout d'un effort, en MET. Cinq valeurs, parce que l'appli ne connait
  // que cinq sortes de seances. Une table de plusieurs centaines d'activites
  // n'aurait rien a decrire de plus : le diagnostic ne propose pas de choisir
  // parmi des centaines.
  var MET_SALLE = 5.0;          // musculation, effort modere a soutenu
  var MET_COURS = [7.5, 6.0, 3.0];  // index de NATURES : Cardio, Renforcement, Mobilite

  // LE RUNNING SE COMPTE EN DISTANCE, PAS EN DUREE. Le cout d'une course est
  // a peu pres proportionnel aux kilometres et peu sensible a l'allure :
  // environ 1 kcal par kilo et par kilometre. Courir 8 km coute a peu pres
  // autant en une heure qu'en cinquante minutes ; c'est la distance qui paie.
  var KCAL_PAR_KG_ET_KM = 1.0;

  // Quand aucune sortie n'a encore ete enregistree, il faut bien partir de
  // quelque chose. 6 km, et l'allure de repli sert a convertir des minutes en
  // kilometres quand une sortie a ete notee sans distance.
  var RUN_KM_DEFAUT = 6;
  var RUN_MIN_PAR_KM = 6;

  var FACTEUR_VIE_COURANTE = 1.30;

  // -------------------------------------------------------------------------
  // METABOLISME DE BASE — Mifflin-St Jeor
  // -------------------------------------------------------------------------
  // Retenue plutot que Harris-Benedict : plus recente, et plus juste sur les
  // profils qui s'ecartent de la moyenne, ce qui est precisement le cas ou
  // l'ancienne formule de l'appli se trompait le plus.
  function mbDeBase(poids, taille, age, sexeFeminin) {
    var v = 10 * poids + 6.25 * taille - 5 * age + (sexeFeminin ? -161 : 5);
    return v > 0 ? v : 0;
  }

  // Les kilometres d'une sortie type, lus dans le JOURNAL de l'utilisateur
  // plutot que supposes : ses propres sorties disent mieux que nous ce qu'il
  // court. On prend la mediane des cinq dernieres, moins sensible qu'une
  // moyenne a une sortie longue isolee.
  function kmHabituelsRunning() {
    var h = state.hist || [], vals = [], i, km, m;
    for (i = h.length - 1; i >= 0 && vals.length < 5; i--) {
      if (h[i].t !== "run") continue;
      km = parseFloat(String(h[i].km).replace(",", "."));
      if (!isNaN(km) && km > 0) { vals.push(km); continue; }
      m = parseFloat(String(h[i].minutes).replace(",", "."));
      if (!isNaN(m) && m > 0) vals.push(m / RUN_MIN_PAR_KM);
    }
    if (!vals.length) return RUN_KM_DEFAUT;
    vals.sort(function (a, b) { return a - b; });
    return vals[Math.floor(vals.length / 2)];
  }

  // Ce que coute UNE seance, en kilocalories.
  function kcalSeance(a, poids) {
    var met;
    if (!a) return 0;
    if (a.t === "run") return KCAL_PAR_KG_ET_KM * poids * kmHabituelsRunning();
    if (a.t === "cours") {
      met = MET_COURS[a.nat] !== undefined ? MET_COURS[a.nat] : MET_COURS[1];
      return met * poids * ((a.min || 60) / 60);
    }
    // Salle : la duree est celle repondue au diagnostic, champ libre compris.
    return MET_SALLE * poids * (dureeMinutes() / 60);
  }

  // La depense d'entrainement de la SEMAINE, creneau par creneau. On parcourt
  // `slots` et pas `progJours` : deux seances le meme jour comptent deux fois,
  // alors que l'ancien modele ne comptait le jour qu'une seule.
  function depenseHebdo(poids) {
    var d = deriver(), total = 0, i;
    for (i = 0; i < d.slots.length; i++) total += kcalSeance(d.slots[i].a, poids);
    return total;
  }

  // -------------------------------------------------------------------------
  // LES CIBLES
  // -------------------------------------------------------------------------
  // Meme forme de retour que MOTEUR.nutritionTargets, pour que les ecrans qui
  // l'appelaient n'aient qu'un nom a changer.
  function ciblesNutrition() {
    var poids = nombreOu(state.obPoids, 80);
    var cible = nombreOu(state.obPoidsCible, 75);
    var taille = nombreOu(state.obTaille, 175);
    var age = nombreOu(state.obAge, 35);
    var feminin = state.obSexe === 1;

    var base = mbDeBase(poids, taille, age, feminin);
    var vie = base * FACTEUR_VIE_COURANTE;
    var sport = depenseHebdo(poids) / 7;
    // Arrondi a la dizaine, comme le moteur : afficher 2 547 kcal donnerait a
    // une estimation la precision d'une mesure.
    var maintain = Math.round((vie + sport) / 10) * 10;

    var losing = cible < poids;
    var gaining = cible > poids;
    // Deficit de 20 %, plafonne a 500 kcal. Repris du moteur.
    var deficit = losing ? Math.min(500, Math.round(maintain * 0.2)) : 0;
    // Surplus de 15 %, plafonne a 400 kcal. Repris du moteur : au-dela, la
    // part de gras prise augmente sans que le muscle suive.
    var surplus = gaining ? Math.min(400, Math.round(maintain * 0.15)) : 0;
    var plancher = feminin ? 1400 : 1600;
    var kcal = Math.max(plancher, maintain - deficit + surplus);
    var bute = losing && (maintain - deficit) < plancher;

    // Proteines calees sur le poids le PLUS BAS des deux. Repris du moteur.
    var prot = Math.round((Math.min(poids, cible) * 1.8) / 5) * 5;

    // Horizon dans les deux sens. 7 700 kcal valent environ un kilo.
    var ecart = losing ? deficit : surplus;
    var semaines = ecart > 0
      ? Math.ceil((Math.abs(poids - cible) * 7700) / (ecart * 7)) : null;

    return {
      maintain: maintain, kcal: kcal,
      deficit: maintain - kcal,
      surplus: kcal - maintain,
      prot: prot, floored: bute, weeks: semaines,
      losing: losing, gaining: gaining,
      // Le detail du modele, pour les bancs et pour l'ecran Nutrition : sans
      // lui, on ne pourrait verifier que le total, pas ce qui le compose.
      mb: Math.round(base), vieCourante: Math.round(vie),
      sportParJour: Math.round(sport), hebdo: Math.round(sport * 7)
    };
  }

  /* =========================================================================
     DIAGNOSTIC — 11 etapes
     -------------------------------------------------------------------------
     Les titres et sous-titres viennent de la constante OB, extraite verbatim
     du prototype. Ce fichier ne les reecrit pas : il les REND.

     Les VALEURS, elles, ne viennent pas de OB. Le prototype y range un prenom,
     un age, deux poids et « 2 800 kcal/j » ecrits en dur, pour peupler ses
     captures. Ici, elles sortent de l'etat et du moteur.
     ========================================================================= */

  var OB_DISC_OPTS = [
    { v: "",      t: "— rien —" },
    { v: "salle", t: "Salle" },
    { v: "cours", t: "Cours collectif" },
    { v: "run",   t: "Running" }
  ];

  // OB_DUREE_MIN a demenage a cote de DUREES, dans les catalogues : la regle
  // du nombre d'exercices en a besoin, et la page de controle de la derivation
  // n'assemble pas ce bloc-ci.

  var OB_SEXES = ["Homme", "Femme"];

  // Les trois reponses de la maquette sur l'alcool. `obAlcool` est un INDICE
  // dans cette liste, et son defaut vaut 1, « De temps en temps ».
  var OB_ALCOOL = ["Jamais", "De temps en temps", "Souvent"];

  // -------------------------------------------------------------------------
  // LE PONT VERS LE MOTEUR
  // -------------------------------------------------------------------------
  // Le diagnostic parle en `ob*`, le moteur greffe parle en profil. Cette
  // fonction est le SEUL endroit qui connait les deux vocabulaires. Sans elle,
  // chaque ecran traduirait dans son coin et les traductions divergeraient.
  //
  // `days` ne retient que les jours qui portent AU MOINS une activite : un jour
  // coche mais vide est legitime cote diagnostic, mais il n'a rien a faire dans
  // le calcul des calories, qui compte des seances.
  function profilDepuisEtat() {
    var d = deriver(), jours = [], kinds = {}, i, j, aSalle, aRun;

    for (i = 0; i < d.progJours.length; i++) {
      j = d.progJours[i];
      if (j.vide) continue;
      // Les jours du moteur vont de 1 (lundi) a 7 (dimanche) ; les notres de
      // 0 a 6. dayKey() du moteur attend le format de getDay(), ou dimanche
      // vaut 0 : notre index 6 doit donc devenir 0, et les autres +1.
      jours.push(j.ji === 6 ? 0 : j.ji + 1);
      aSalle = false; aRun = false;
      for (var k = 0; k < j.acts.length; k++) {
        if (j.acts[k].t === "salle") aSalle = true;
        if (j.acts[k].t === "run") aRun = true;
      }
      if (aRun && !aSalle) kinds[j.ji === 6 ? 0 : j.ji + 1] = "course";
    }

    // CE QUI EST COCHE DOIT ARRIVER AU MOTEUR SOUS SON VRAI NOM.
    //
    // Trois des six lignes se trompaient de destination : « Barre et disques »
    // partait en halteres, « Halteres » partait en barre, et « Cardio » partait
    // en poids du corps, alors que le moteur a bien une famille cardio et
    // qu'il se donne le poids du corps d'office (`avail = { bw: true }`).
    // Consequence : cocher Cardio n'ouvrait aucun appareil de cardio, et les
    // deux premieres lignes ouvraient chacune le materiel de l'autre.
    //
    // C'etait masque tant que « Machines de salle » restait coche, parce que la
    // salle donne d'office halteres, barre, traction et cardio. Ca ne mordait
    // que sur quelqu'un qui s'entraine chez lui. C'est justement le cas d'usage
    // qu'Olivier a demande de rendre reglable.
    //
    // L'ORDRE DE CETTE TABLE SUIT CELUI DE `EQUIP`, PAS CELUI DE L'ECRAN.
    // L'affichage a son propre ordre (`EQUIP_ORDRE`) et n'y touche pas.
    var equip = [];
    var CORRESP = ["mach", "barre", "halt", "trac", "elast", "cardio"];
    for (i = 0; i < state.obEquip.length && i < CORRESP.length; i++) {
      if (state.obEquip[i]) equip.push(CORRESP[i]);
    }

    // LES MACHINES DECOCHEES, ENFIN TRANSMISES.
    //
    // `obGear` etait enregistre depuis le debut et n'atteignait jamais le
    // moteur : decocher une machine ne changeait rien, alors que l'ecran promet
    // « je ne proposerai jamais un exercice qui demande une machine absente ».
    // Le moteur attend la liste des familles ABSENTES, et il porte deja les
    // treize memes entrees, avec leur code.
    //
    // LA CORRESPONDANCE SE FAIT PAR LIBELLE, PAS PAR RANG. Les deux listes sont
    // aujourd'hui dans le meme ordre, mais s'y fier aurait recree exactement le
    // couplage par index qui a fait partir trois categories de materiel a la
    // mauvaise adresse. Par libelle, reordonner l'une des deux listes reste sans
    // effet. `controle/verifier_gear.py` refuse la construction si un libelle de
    // GEAR ne trouve plus son jumeau chez le moteur, sans quoi la machine
    // cesserait d'etre transmise en silence.
    var noGear = [], gearOpts = (MOTEUR && MOTEUR.GEAR_OPTIONS) || [], gi, gj;
    if (state.obEquip[0]) {
      for (gi = 0; gi < GEAR.length; gi++) {
        if (state.obGear[gi]) continue;
        for (gj = 0; gj < gearOpts.length; gj++) {
          if (gearOpts[gj].label === GEAR[gi].t) { noGear.push(gearOpts[gj].v); break; }
        }
      }
    }

    var nCourse = 0, nSalle = 0;
    for (i = 0; i < d.slotsRun.length; i++) nCourse++;
    for (i = 0; i < d.slotsSalle.length; i++) nSalle++;

    return {
      name: state.obPrenom,
      sex: state.obSexe === 1 ? "f" : "h",
      startWeight: nombreOu(state.obPoids, 80),
      targetWeight: nombreOu(state.obPoidsCible, 75),
      minutes: dureeMinutes(),
      days: jours,
      dayKinds: kinds,
      discipline: nSalle && nCourse ? "mixte" : (nCourse && !nSalle ? "course" : "muscu"),
      equipment: equip,
      noGear: noGear,
      objectif: ["perte", "maintien", "prise"][state.obObjectif] || "perte"
    };
  }

  function nombreOu(txt, defaut) {
    var v = parseFloat(String(txt).replace(",", "."));
    return isNaN(v) ? defaut : v;
  }

  // -------------------------------------------------------------------------
  // ETAPE 5 — LE BLOC DISCIPLINE
  // -------------------------------------------------------------------------
  // Une LISTE DEROULANTE NATIVE par creneau, jamais un bouton a taper
  // plusieurs fois : avec un bouton, on ne sait pas combien de fois appuyer
  // pour atteindre « Running », et on decouvre les options en les traversant.
  //
  // LE POINT DELICAT EST DANS `poserSlot` : on ne reecrit le creneau QUE si le
  // type change. Reecrire a chaque selection effacerait le nom deja saisi
  // (« Pilates ») des qu'on rouvre la liste sans rien changer.
  function poserSlot(ji, k, v) {
    var liste = (state.obAct[ji] || []).slice(), copie2 = {}, kk;

    if (!v) {
      liste.splice(k, 1);
    } else if (!liste[k] || liste[k].t !== v) {
      liste[k] = v === "cours" ? { t: "cours", nom: "", min: 60, nat: 1 }
               : v === "run"   ? { t: "run", lieu: 0 }
               : { t: "salle" };
    }

    for (kk in state.obAct) { if (has(state.obAct, kk)) copie2[kk] = state.obAct[kk]; }
    copie2[ji] = liste;
    poser({ obAct: copie2, slotAuj: 0 });
  }

  function majCours(ji, k, champ, valeur) {
    var liste = (state.obAct[ji] || []).slice(), copie2 = {}, kk, o = {}, p;
    if (!liste[k]) return;
    for (p in liste[k]) { if (has(liste[k], p)) o[p] = liste[k][p]; }
    o[champ] = valeur;
    liste[k] = o;
    for (kk in state.obAct) { if (has(state.obAct, kk)) copie2[kk] = state.obAct[kk]; }
    copie2[ji] = liste;
    poser({ obAct: copie2 });
  }

  function selectSlotHtml(ji, k, act, libre) {
    var i, o, sel, style = "";
    if (!libre && act) {
      style = "background:" + DISC[act.t].bg + ";border-color:" + DISC[act.t].bd +
              ";color:" + DISC[act.t].fg + ";";
    }
    var h = '<select class="ob-select' + (libre ? " ob-select-libre" : "") + '"' +
            ' style="' + style + '"' +
            ' data-action="ob-slot" data-ji="' + ji + '" data-k="' + k + '"' +
            ' aria-label="Activité du ' + esc(JOURS[ji]) + (k > 0 ? ", 2e séance" : "") + '">';
    for (i = 0; i < OB_DISC_OPTS.length; i++) {
      o = OB_DISC_OPTS[i];
      sel = (libre ? o.v === "" : o.v === act.t);
      h += '<option value="' + o.v + '"' + (sel ? " selected" : "") + '>' + esc(o.t) + "</option>";
    }
    return h + "</select>";
  }

  function blocCoursHtml(ji, k, act) {
    var i, h = "";
    h += '<div class="ob-cours">';
    h += '<div class="ob-cours-t">' + esc(JOURS[ji]) + (k > 0 ? " · 2e séance" : "") + "</div>";
    h += '<div class="ob-champ"><label class="ob-champ-l" for="c' + ji + "-" + k + '">Nom du cours</label>' +
         '<input id="c' + ji + "-" + k + '" class="ob-input ob-input-txt" type="text"' +
         ' placeholder="Pilates, body barre…" value="' + esc(act.nom || "") + '"' +
         ' data-action="ob-cours-nom" data-ji="' + ji + '" data-k="' + k + '"></div>';
    h += '<div class="ob-champ"><span class="ob-champ-l">Durée</span><div class="ob-step">' +
         '<button type="button" class="ob-step-btn" data-action="ob-cours-min" data-ji="' + ji +
         '" data-k="' + k + '" data-d="-5" aria-label="Moins 5 minutes">−</button>' +
         '<span class="ob-step-v">' + act.min + ' min</span>' +
         '<button type="button" class="ob-step-btn" data-action="ob-cours-min" data-ji="' + ji +
         '" data-k="' + k + '" data-d="5" aria-label="Plus 5 minutes">+</button></div></div>';
    h += '<div class="ob-champ"><span class="ob-champ-l">Plutôt</span><div class="ob-natures">';
    for (i = 0; i < NATURES.length; i++) {
      h += '<button type="button" class="ob-nature' + (act.nat === i ? " ob-nature-on" : "") + '"' +
           ' aria-pressed="' + (act.nat === i ? "true" : "false") + '"' +
           ' data-action="ob-cours-nat" data-ji="' + ji + '" data-k="' + k + '" data-v="' + i + '">' +
           esc(NATURES[i].t) + "</button>";
    }
    h += "</div></div></div>";
    return h;
  }

  // Les jours dont le deuxieme creneau a ete ouvert a la main. Une CHAINE
  // plutot qu'un objet, pour rester sur la forme de `obJourOuvert` et
  // `ajoutOuvert` voisins, et bornee par des virgules des deux cotes pour
  // qu'un indice ne se trouve pas dans un autre.
  function secondOuvert(ji) {
    return (state.obSecondOuvert || "").indexOf("," + ji + ",") >= 0;
  }

  // Refuser un exercice, ou le remettre. On RECOPIE la table au lieu d'ecrire
  // dedans : `state.obRefus` est enregistre tel quel, et le muter en place
  // sauterait la comparaison qui decide d'un rendu.
  function basculerRefus(cle) {
    var maj = {}, k;
    if (!cle) return;
    for (k in state.obRefus) { if (has(state.obRefus, k) && k !== cle) maj[k] = state.obRefus[k]; }
    if (!state.obRefus[cle]) maj[cle] = 1;
    poser({ obRefus: maj });
  }

  function basculerSecond(ji) {
    var s = state.obSecondOuvert || ",", cle = "," + ji + ",";
    poser({ obSecondOuvert: s.indexOf(cle) >= 0 ? s.replace(cle, ",") : s + ji + "," });
  }

  function etapeJoursHtml() {
    var h = "", i, d, j, acts, k;

    h += '<div class="ob-days">';
    for (i = 0; i < 7; i++) {
      h += '<button type="button" class="ob-day' + (state.obJours[i] ? " ob-day-on" : "") + '"' +
           ' aria-pressed="' + (state.obJours[i] ? "true" : "false") + '"' +
           ' data-action="ob-jour" data-i="' + i + '">' + esc(JOURS[i].slice(0, 3)) + "</button>";
    }
    h += "</div>";

    d = deriver();
    if (!d.progJours.length) {
      return h + '<p class="ob-lead">Coche au moins un jour pour choisir ce que tu y fais.</p>';
    }

    h += '<h2 class="ob-titre" style="font-size:19px;margin-top:4px">Choisis ton entraînement pour chaque jour</h2>';
    h += '<p class="ob-lead">Touche un jour et choisis ton activité entre <b>running</b>, ' +
         '<b>cours collectif</b> et <b>salle</b>. Tu peux en mettre deux le même jour, ou laisser vide.</p>';

    for (i = 0; i < d.progJours.length; i++) {
      j = d.progJours[i];
      acts = j.acts;
      h += '<div class="ob-jour"><div class="ob-jour-t">' + esc(j.nom) + "</div>";
      for (k = 0; k < acts.length; k++) {
        if (k > 0) h += '<div class="ob-rang">2e séance du jour</div>';
        h += selectSlotHtml(j.ji, k, acts[k], false);
        // L'ENCART DU COURS SUIT SON CRENEAU.
        //
        // Il etait rassemble tout en bas de l'etape, apres les sept jours : on
        // choisissait « cours collectif » le mardi, et le champ qui demande son
        // nom apparaissait a un ecran de defilement de la. Le titre du jour
        // dans l'encart etait alors la seule facon de savoir de quel jour il
        // parlait. Demande d'Olivier a la revue.
        //
        // On passe `acts[k].k` et non l'indice de boucle : c'est le rang du
        // creneau dans `obAct`, celui que majCours ecrira. Ils coincident
        // aujourd'hui, la derivation ne filtrant rien, mais c'est le rang qui
        // fait foi.
        if (acts[k].t === "cours") h += blocCoursHtml(j.ji, acts[k].k, acts[k]);
      }
      // LA DEUXIEME SEANCE NE S'OUVRE QUE SI ON LA DEMANDE.
      //
      // Avant, remplir le premier creneau faisait apparaitre sous chaque jour
      // un second menu vide, en pointilles. Sept jours coches donnaient sept
      // menus « rien » a lire et a ecarter, et l'ecran se perdait dans ses
      // propres champs. Demande d'Olivier a la revue.
      //
      // Le menu du PREMIER creneau, lui, reste toujours visible : c'est la
      // question posee par l'etape, pas une option.
      if (acts.length < 2) {
        if (acts.length === 0) {
          h += selectSlotHtml(j.ji, 0, null, true);
        } else if (secondOuvert(j.ji)) {
          h += '<div class="ob-rang">2e séance du jour</div>';
          h += selectSlotHtml(j.ji, acts.length, null, true);
        } else {
          // Le libelle reprend « 2e seance », le meme mot que le rang affiche
          // une fois le creneau ouvert : deux ecritures pour la meme chose
          // feraient hesiter. Pas de « aujourd'hui » : on regle un jour de la
          // semaine, pas la journee en cours.
          h += '<button type="button" class="ob-ajout-seance" data-action="ob-second"' +
               ' data-ji="' + j.ji + '">+ Ajouter une 2e séance</button>';
        }
      }
      h += "</div>";
    }

    return h;
  }

  // -------------------------------------------------------------------------
  // LES AUTRES TYPES D'ETAPE
  // -------------------------------------------------------------------------
  // `exemple` remplit le champ vide d'une valeur grise. Il est arrive avec le
  // retrait des unites du libelle : sans « (cm) » ni valeur, plus rien ne
  // disait s'il fallait taper 178 ou 1,78. Un nombre nu suffit a le dire, et
  // il vaut mieux qu'un « 178 cm » qu'on serait tente de recopier tel quel
  // dans un champ qui n'attend qu'un nombre.
  function champHtml(id, libelle, valeur, action, suffixe, texte, exemple) {
    return '<div class="ob-champ"><label class="ob-champ-l" for="' + id + '">' + esc(libelle) +
      (suffixe ? " (" + esc(suffixe) + ")" : "") + "</label>" +
      '<input id="' + id + '" class="ob-input' + (texte ? " ob-input-txt" : "") + '"' +
      ' type="text"' + (texte ? "" : ' inputmode="decimal"') + ' autocomplete="off"' +
      (exemple ? ' placeholder="' + esc(exemple) + '"' : "") +
      ' value="' + esc(valeur) + '" data-action="' + action + '"></div>';
  }

  function etapeChampsHtml(step) {
    var h = "";
    if (step === 0) {
      // PAS D'UNITE ENTRE PARENTHESES SUR CETTE ETAPE. Olivier a barre
      // « (ans) » a la revue ; la maquette ne met d'unite sur aucun des trois
      // libelles de l'etape 1, elle la porte dans la valeur du champ.
      // « (cm) » part avec, sans quoi la meme etape aurait deux ecritures.
      // L'etape 2 (poids) garde les siennes tant qu'elle n'est pas revue.
      h += champHtml("ob-prenom", "Prénom", state.obPrenom, "ob-prenom", "", true);
      h += champHtml("ob-age", "Âge", state.obAge, "ob-age", "", false, "38");
      h += champHtml("ob-taille", "Taille", state.obTaille, "ob-taille", "", false, "178");
      h += '<div class="ob-champ"><span class="ob-champ-l">Tu es</span><div class="ob-natures">';
      for (var i = 0; i < OB_SEXES.length; i++) {
        h += '<button type="button" class="ob-nature' + (state.obSexe === i ? " ob-nature-on" : "") +
             '" style="' + (state.obSexe === i ? "background:var(--salle-bg);border-color:var(--salle-bg);color:var(--salle-fg)" : "") + '"' +
             ' aria-pressed="' + (state.obSexe === i ? "true" : "false") + '"' +
             ' data-action="ob-sexe" data-v="' + i + '">' + esc(OB_SEXES[i]) + "</button>";
      }
      h += "</div></div>";
    } else {
      h += champHtml("ob-poids", "Poids actuel", state.obPoids, "ob-poids", "kg");
      h += champHtml("ob-cible", "Poids cible", state.obPoidsCible, "ob-cible", "kg");
    }
    return h;
  }

  function etapeChipsHtml(ob) {
    var h = '<div class="ob-chips">', i, on, val = state[ob.single];
    for (i = 0; i < ob.chips.length; i++) {
      on = val === i;
      h += '<button type="button" class="ob-chip' + (on ? " ob-chip-on" : "") + '"' +
           ' aria-pressed="' + (on ? "true" : "false") + '"' +
           ' data-action="ob-single" data-cle="' + esc(ob.single) + '" data-v="' + i + '">' +
           "<span>" + esc(ob.chips[i].t) + "</span>" +
           '<span class="ob-chip-s">' + esc(ob.chips[i].s) + "</span></button>";
    }
    return h + "</div>";
  }

  function etapeDureeHtml() {
    var h = '<div class="ob-chips">', i, on, libre = dureeLibreValide(), n;
    for (i = 0; i < DUREES.length; i++) {
      // Un des quatre reperes n'est allume que si le champ libre est vide :
      // sinon deux reponses seraient cochees en meme temps pour une seule
      // question.
      on = !libre && state.obDuree === i;
      h += '<button type="button" class="ob-chip' + (on ? " ob-chip-on" : "") + '"' +
           ' aria-pressed="' + (on ? "true" : "false") + '"' +
           ' data-action="ob-single" data-cle="obDuree" data-v="' + i + '">' +
           "<span>" + esc(DUREES[i].t) + "</span>" +
           '<span class="ob-chip-s">' + esc(DUREES[i].s) + "</span></button>";
    }
    h += "</div>";

    // LA DUREE A SOI. Demande d'Olivier : 50 min, 130 min, ce que dure vraiment
    // sa seance. Le champ prend la main sur les quatre reperes des qu'il porte
    // un nombre tenable ; le vider les rend actifs.
    h += '<div class="ob-champ ob-duree-libre">' +
         '<label class="ob-champ-l" for="ob-duree-libre">Ou la durée que tu as vraiment</label>' +
         '<input id="ob-duree-libre" class="ob-input" type="text" inputmode="numeric"' +
         ' autocomplete="off" placeholder="50" value="' + esc(state.obDureeLibre) + '"' +
         ' aria-describedby="ob-duree-aide" data-action="ob-duree-libre">' +
         '<div class="ob-duree-aide" id="ob-duree-aide">';
    if (libre) {
      n = nbTravailPour(libre) + 1;
      // « jusqu'a » et pas un compte ferme : exosDe s'arrete a ce que la seance
      // contient, et les plus courtes en ont moins que les longues n'en
      // demandent. Annoncer un nombre sec ferait promettre a l'ecran ce que le
      // catalogue ne peut pas tenir.
      h += esc(dureeLibelle() + " · jusqu'à " + n + " exercices, échauffement compris");
    } else {
      h += "En minutes. À partir de " + DUREE_MIN + ", et jusqu'à " + DUREE_MAX + ".";
    }
    h += "</div></div>";
    return h;
  }

  // `chevron` et `deplie` ne servent qu'a la case qui commande une liste : le
  // chevron annonce qu'il y a quelque chose dessous, et `aria-expanded` le dit
  // aux lecteurs d'ecran, que `aria-pressed` seul laisserait dans le noir.
  function caseHtml(action, i, on, titre, sous, chevron, deplie) {
    return '<button type="button" class="ob-case' + (on ? " ob-case-on" : "") + '"' +
      ' aria-pressed="' + (on ? "true" : "false") + '"' +
      (chevron ? ' aria-expanded="' + (deplie ? "true" : "false") + '"' : "") +
      ' data-action="' + action + '" data-i="' + i + '">' +
      '<span class="ob-case-box" aria-hidden="true">✓</span>' +
      '<span class="ob-case-txt"><span class="ob-case-t">' + esc(titre) + "</span>" +
      (sous ? '<span class="ob-case-s">' + esc(sous) + "</span>" : "") + "</span>" +
      (chevron ? '<span class="ob-case-ch" aria-hidden="true">' + chevron + "</span>" : "") +
      "</button>";
  }

  // LA LISTE DES MACHINES SE DEROULE SOUS SA CASE.
  //
  // Elle formait avant une seconde section, sous son propre titre, apres les six
  // cases : la case qui la commande et son contenu etaient separes de 356 px, et
  // cocher ne declenchait aucun defilement. « Machines de salle » descend donc en
  // dernier (voir EQUIP_ORDRE) et sa liste s'ouvre juste dessous, en retrait.
  //
  // Il n'y a pas d'etat d'ouverture separe, et c'est voulu : ce qui ouvre, c'est
  // la case elle-meme. Un troisieme etat « cochee mais repliee » ajouterait un
  // champ a tenir pour un besoin que personne n'a exprime.
  var I_MACHINES = 0;

  // Le rang de l'etape Materiel dans les onze, et le rang de la case
  // « Machines de salle » dans EQUIP. Nommes UNE fois : ces deux nombres etaient
  // ecrits en clair dans trois fichiers, et c'est exactement ce genre de
  // constante recopiee qui a fait partir trois categories de materiel a la
  // mauvaise adresse.
  var ETAPE_MATERIEL = 6;

  // Amener le bloc des machines a 12 px du haut, sans animation.
  //
  // Deux appelants : le toucher qui coche la case, et l'arrivee sur l'etape
  // depuis « Ce dont je dispose » dans Moi. Le second compte autant que le
  // premier : la case est desormais la DERNIERE des six, donc arriver sur cette
  // etape avec les machines deja cochees ouvrait sur cinq cases et laissait les
  // treize machines entierement sous la ligne de flottaison, alors que la ligne
  // de Moi annonce justement leur nombre.
  //
  // Un defilement anime ne se verifie pas dans le panneau de mesure, qui ne
  // peint pas, et il se dispute le doigt de l'utilisateur. Instantane, donc.
  function montrerLesMachines() {
    var bloc = document.querySelector(".ob-mach");
    if (!bloc) return;
    var y = (window.pageYOffset || document.documentElement.scrollTop || 0) +
            bloc.getBoundingClientRect().top - 12;
    window.scrollTo(0, y > 0 ? y : 0);
  }

  function etapeMaterielHtml() {
    var h = '<div class="ob-liste">', i, e, ouvert = !!state.obEquip[I_MACHINES];

    for (i = 0; i < EQUIP_ORDRE.length; i++) {
      e = EQUIP_ORDRE[i];
      if (e !== I_MACHINES) {
        h += caseHtml("ob-equip", e, !!state.obEquip[e], EQUIP[e].t, EQUIP[e].s);
        continue;
      }

      // La case des machines et sa liste ne font qu'un bloc : c'est ce qui les
      // relie a l'oeil, le retrait seul ne suffisait pas.
      h += '<div class="ob-mach' + (ouvert ? " ob-mach-on" : "") + '">';
      h += caseHtml("ob-equip", e, ouvert, EQUIP[e].t, EQUIP[e].s,
                    ouvert ? "▴" : "▾", ouvert);
      if (ouvert) {
        h += '<div class="ob-mach-c">';
        h += '<p class="ob-mach-l">Décoche ce que tu n\'as pas. Je ne proposerai jamais ' +
             "un exercice qui demande une machine absente.</p>";
        h += '<div class="ob-liste">';
        for (var g = 0; g < GEAR.length; g++) {
          h += caseHtml("ob-gear", g, !!state.obGear[g], GEAR[g].t, GEAR[g].s);
        }
        h += "</div></div>";
      }
      h += "</div>";
    }
    h += "</div>";

    h += '<div class="ob-champ" style="margin-top:18px"><span class="ob-champ-l">' +
         'Haltère le plus lourd</span><div class="ob-step">' +
         '<button type="button" class="ob-step-btn" data-action="ob-halt" data-d="-2" aria-label="Moins 2 kg">−</button>' +
         '<span class="ob-step-v">' + state.obHalt + ' kg</span>' +
         '<button type="button" class="ob-step-btn" data-action="ob-halt" data-d="2" aria-label="Plus 2 kg">+</button>' +
         "</div></div>";
    return h;
  }

  // =========================================================================
  // ETAPE 8 — LE PROGRAMME, REPLIE PAR DEFAUT
  // -------------------------------------------------------------------------
  // Il s'affichait entierement deplie : cinq journees et leurs quarante et
  // quelques exercices d'un coup, sur un ecran ou l'on vient VERIFIER un plan,
  // pas le lire ligne a ligne. La maquette montre une ligne compacte par
  // journee, avec sa pastille de discipline, son volume et un chevron, et on
  // ouvre celle qu'on veut inspecter. Demande d'Olivier.
  //
  // `obJourOuvert` existait dans les defauts depuis le debut sans etre lu
  // nulle part : il attendait ce repli. UNE seule journee ouverte a la fois,
  // sinon on retombe sur l'ecran a tout deplier.
  //
  // « NON MERCI » PAR EXERCICE, l'autre manque. `obRefus` est lu par la
  // derivation depuis toujours, mais AUCUN ecran ne l'ecrivait : le refus etait
  // une regle sans porte d'entree. Le bouton la fournit, et la ligne refusee
  // reste visible en annoncant son remplacant, plutot que de disparaitre sans
  // dire ce qui la remplace.
  // =========================================================================
  function etapeProgrammeHtml() {
    var d = deriver(), h = "", i, j, ex, k, dd, ouvert, total = 0, journees = 0;
    if (!d.slots.length) {
      return '<p class="ob-lead">Aucune activité déclarée. Reviens à l\'étape Rythme.</p>';
    }

    for (i = 0; i < d.slots.length; i++) {
      j = d.slots[i];
      dd = DISC[j.a.t];
      ouvert = state.obJourOuvert === j.a.cle;
      ex = j.a.t === "salle" ? exosDe(j.a.si) : [];
      if (j.a.t === "salle") { total += ex.length; journees++; }

      h += '<div class="ob-sess' + (ouvert ? " ob-sess-on" : "") +
           '" style="border-left:4px solid ' + dd.bd + '">';

      // LA LIGNE REPLIEE. Elle porte tout ce qu'il faut pour decider si on
      // l'ouvre : le jour, la discipline, et le volume.
      h += '<button type="button" class="ob-sess-h" aria-expanded="' + (ouvert ? "true" : "false") +
           '" data-action="ob-jour-ouvrir" data-cle="' + esc(j.a.cle) + '">' +
           '<span class="ob-sess-pill" style="background:' + dd.pale + ";color:" + dd.encre + '">' +
           esc(j.a.t === "salle" ? SEANCES[j.a.si].code : dd.court) + "</span>" +
           '<span class="ob-sess-c"><span class="ob-sess-t">' + esc(j.nom) +
           (j.a.k > 0 ? " · 2e séance" : "") + "</span>" +
           '<span class="ob-sess-s">' + esc(resumeSlot(j.a, ex)) + "</span></span>" +
           '<span class="ob-sess-ch" aria-hidden="true">' + (ouvert ? "▴" : "▾") + "</span>" +
           "</button>";

      if (ouvert) {
        if (j.a.t === "salle") {
          h += '<ul class="ob-exos">';
          for (k = 0; k < ex.length; k++) {
            h += '<li class="ob-exo"><span class="ob-exo-c">' +
                 '<span class="ob-exo-n">' + esc(ex[k].nom) + "</span>" +
                 '<span class="ob-exo-d num">' + esc(ex[k].n + " × " + ex[k].reps +
                 (ex[k].unite ? " " + ex[k].unite : "")) + "</span>" +
                 (ex[k].remplace
                   ? '<span class="ob-exo-r">remplace ' + esc(ex[k].remplace) + "</span>"
                   : "") +
                 "</span>";
            // L'ECHAUFFEMENT NE SE REFUSE PAS : il est toujours la, par regle,
            // et un bouton sans effet vaut moins que pas de bouton.
            if (ex[k].rang > 0) {
              h += '<button type="button" class="ob-non' + (ex[k].refuse ? " ob-non-on" : "") +
                   '" data-action="ob-refuser" data-cle="' + esc(ex[k].cle) + '">' +
                   (ex[k].refuse ? "Remis" : "Non merci") + "</button>";
            }
            h += "</li>";
          }
          h += "</ul>";
        } else if (j.a.t === "cours") {
          h += '<p class="ob-sess-p">Ton coach mène la séance. Tu la valides en sortant.</p>';
        } else {
          h += '<p class="ob-sess-p">Tu notes la distance et la durée au retour.</p>';
        }
      }
      h += "</div>";
    }

    // LE PIED DE PAGE DE LA MAQUETTE. Il dit le volume total et ou revenir
    // dessus plus tard : refuser un exercice n'est pas une decision a prendre
    // une fois pour toutes le jour du diagnostic.
    if (journees) {
      h += '<p class="ob-prog-pied"><span class="num">' + total + "</span> exercices sur " +
           '<span class="num">' + journees + "</span> journée" + (journees > 1 ? "s" : "") +
           ", échauffements compris. Refuse ce qui ne te va pas maintenant, ou plus tard " +
           "depuis Moi › Mes exercices : le programme se réécrit avec ce qui reste.</p>";
    }
    return h;
  }

  // Ce qu'une journee annonce quand elle est repliee.
  function resumeSlot(a, ex) {
    if (a.t === "salle") {
      return SEANCES[a.si].sub + " · " + ex.length + " exercices · " +
             dureeLibelle().replace(" minutes", " min");
    }
    if (a.t === "cours") {
      return (a.nom || "Cours") + " · " + NATURES[a.nat].t + " · " + a.min + " min";
    }
    return "Running · " + LIEUX[a.lieu].t;
  }

  function etapeNutriHtml() {
    var h = "", i, on;
    // LES TROIS HABITUDES SONT DES JETONS, PAS DES CARTES.
    //
    // Elles etaient rendues en cartes pleine largeur, titre plus sous-titre :
    // trois blocs pour trois questions binaires, la ou la maquette pose trois
    // jetons qui tiennent sur deux lignes. Et le libelle est a la PREMIERE
    // PERSONNE, comme la maquette : on repond de soi, on ne coche pas une
    // rubrique.
    var HAB = [
      { c: "obPetitDej", t: "Je petit-déjeune", large: true },
      { c: "obCollation", t: "J'ajoute une collation" },
      { c: "obCuisine", t: "Je cuisine" }
    ];
    h += '<div class="ob-sect">Quelques habitudes</div>';
    h += '<div class="ob-hab">';
    for (i = 0; i < HAB.length; i++) {
      on = !!state[HAB[i].c];
      h += '<button type="button" class="ob-h' + (on ? " ob-h-on" : "") +
           (HAB[i].large ? " ob-h-large" : "") + '"' +
           ' aria-pressed="' + (on ? "true" : "false") + '"' +
           ' data-action="ob-bascule" data-cle="' + HAB[i].c + '">' +
           '<span class="ob-h-c" aria-hidden="true">' + (on ? "✓ " : "") + "</span>" +
           esc(HAB[i].t) + "</button>";
    }
    h += "</div>";

    // L'ALCOOL N'AVAIT AUCUNE INTERFACE. `obAlcool` etait declare dans les
    // defauts et enregistre parmi les cles sauvees, mais aucun ecran ne le
    // demandait et aucune regle ne le lisait : une reponse fantome.
    // Il est demande ici, comme dans la maquette, ET il compte : le prompt
    // nutrition le transmet. Poser la question sans s'en servir aurait ete
    // pire que ne pas la poser.
    h += '<div class="ob-sect">Alcool</div>';
    h += '<div class="ob-natures">';
    for (i = 0; i < OB_ALCOOL.length; i++) {
      on = state.obAlcool === i;
      h += '<button type="button" class="ob-nature' + (on ? " ob-nature-on" : "") +
           '" style="' + (on ? "background:var(--salle-bg);border-color:var(--salle-bg);color:var(--salle-fg)" : "") + '"' +
           ' aria-pressed="' + (on ? "true" : "false") + '"' +
           ' data-action="ob-single" data-cle="obAlcool" data-v="' + i + '">' +
           esc(OB_ALCOOL[i]) + "</button>";
    }
    h += "</div>";

    // « Compléments », le mot de la maquette, et la phrase qui dit ce que
    // cocher DECLENCHE. « Ce que tu prends » nommait la rubrique sans dire ce
    // qu'elle produit.
    h += '<div class="ob-sect">Compléments</div>';
    h += '<p class="ob-lead">Coche ce que tu prends, ou ce que tu veux prendre. ' +
         "L'appli ajoutera la ligne au plan et comptera ses macros.</p>";
    h += '<div class="ob-liste">';
    for (i = 0; i < MOTEUR.SUPPS.length; i++) {
      on = !!state.obSupps[i];
      h += caseHtml("ob-supp", i, on, MOTEUR.SUPPS[i].label, MOTEUR.SUPPS[i].why);
    }
    h += "</div>";

    // LE RENDEZ-VOUS DE PESEE VIT ICI, a l'etape 9, et pas dans son propre
    // ecran : il tient en deux reponses, et une etape de plus pour deux
    // reponses allonge le diagnostic sans rien clarifier.
    h += '<h2 class="ob-titre" style="font-size:17px;margin-top:22px">Ton rendez-vous de pesée</h2>';
    h += '<p class="ob-lead">Une pesée par semaine, toujours le même jour et dans les mêmes ' +
         'conditions. C\'est ce qui rend la courbe lisible.</p>';
    h += '<div class="ob-champ"><span class="ob-champ-l">Quel jour</span><div class="ob-days">';
    for (i = 0; i < 7; i++) {
      h += '<button type="button" class="ob-day' + (state.obPeseeJour === i ? " ob-day-on" : "") + '"' +
           ' aria-pressed="' + (state.obPeseeJour === i ? "true" : "false") + '"' +
           ' data-action="ob-single" data-cle="obPeseeJour" data-v="' + i + '">' +
           esc(JOURS[i].slice(0, 3)) + "</button>";
    }
    h += "</div></div>";
    h += '<div class="ob-champ"><span class="ob-champ-l">À quel moment</span><div class="ob-natures">';
    for (i = 0; i < PESEE_MOMENTS.length; i++) {
      h += '<button type="button" class="ob-nature' + (state.obPeseeMoment === i ? " ob-nature-on" : "") +
           '" style="' + (state.obPeseeMoment === i ? "background:var(--salle-bg);border-color:var(--salle-bg);color:var(--salle-fg)" : "") + '"' +
           ' aria-pressed="' + (state.obPeseeMoment === i ? "true" : "false") + '"' +
           ' data-action="ob-single" data-cle="obPeseeMoment" data-v="' + i + '">' +
           esc(PESEE_MOMENTS[i].t) + "</button>";
    }
    h += "</div></div>";

    // LE BLOC DES CONDITIONS MANQUAIT ENTIEREMENT a cette etape.
    //
    // Les quatre conditions vivent dans PESEE_COND depuis le debut et servent
    // deja sur l'accueil, le jour de la pesee. Elles n'etaient nulle part ici,
    // au moment ou l'on CHOISIT son rendez-vous : c'est pourtant la que savoir
    // dans quelles conditions se peser change la reponse qu'on donne.
    h += '<section class="cond"><div class="cond-t">Les mêmes conditions, chaque fois</div>';
    for (i = 0; i < PESEE_COND.length; i++) {
      h += '<div class="cond-l">' + esc(PESEE_COND[i]) + "</div>";
    }
    h += '<p class="cond-p">Change une seule de ces conditions et le chiffre bouge de ' +
         "300 g à 1 kg, plus que ce qu'une semaine de déficit fait vraiment.</p>";
    h += "</section>";
    return h;
  }

  // Le recap est CALCULE. Le prototype ecrit « 2 800 kcal/j » et « ~11
  // semaines » en dur dans OB ; ici les chiffres sortent de nutritionTargets,
  // donc ils suivent le poids, l'objectif et le nombre de seances declarees.
  function recapLignes(step) {
    var d = deriver(), p = profilDepuisEtat(), out = [], i, noms = [];

    if (step === 9) {
      var t = ciblesNutrition();
      out.push({ l: "Maintien estimé", v: t.maintain + " kcal/j" });
      out.push({ l: "Cible pour avancer", v: t.kcal + " kcal/j" });
      out.push({ l: "Protéines", v: t.prot + " g/j" });
      out.push({ l: "Horizon " + p.targetWeight + " kg",
                 v: t.weeks ? "~" + t.weeks + " semaines" : "—" });
      return out;
    }

    for (i = 0; i < d.progJours.length; i++) noms.push(d.progJours[i].nom.slice(0, 3));
    out.push({ l: "Profil", v: (state.obPrenom || "—") + (state.obAge ? " · " + state.obAge + " ans" : "") });
    out.push({ l: "Objectif", v: p.startWeight + " → " + p.targetWeight + " kg" });
    out.push({ l: "Rythme", v: noms.length ? noms.join(", ") : "—" });
    out.push({ l: "Programme", v: d.slots.length + " séance" + (d.slots.length > 1 ? "s" : "") +
               " sur " + d.progJours.length + " jour" + (d.progJours.length > 1 ? "s" : "") });
    return out;
  }

  function etapeRecapHtml(step, ob) {
    var lignes = recapLignes(step), h = '<div class="ob-recap">', i;
    for (i = 0; i < lignes.length; i++) {
      h += '<div class="ob-recap-l"><span class="ob-recap-t">' + esc(lignes[i].l) + "</span>" +
           '<span class="ob-recap-v">' + esc(lignes[i].v) + "</span></div>";
    }
    h += "</div>";
    if (ob.note) h += '<div class="ob-note">' + esc(ob.note) + "</div>";
    return h;
  }

  // -------------------------------------------------------------------------
  // RENDU DE L'ETAPE
  // -------------------------------------------------------------------------
  function onboardingHtml() {
    var step = state.obStep, ob = OB[step], h = "", i, cls;
    if (!ob) { step = 0; ob = OB[0]; }

    h += '<div class="ob">';

    // Chaque pastille vit DANS un bouton de 44 px. La barre reste fine a
    // l'oeil, mais la cible tactile fait la taille reglementaire.
    // Les pastilles ne montrent que les etapes VISIBLES : une pastille qu'on ne
    // peut pas atteindre laisserait croire qu'on a saute une reponse.
    var vis = etapesVisibles(), rang = vis.indexOf(step);
    if (rang < 0) rang = 0;

    h += '<div class="ob-dots" role="group" aria-label="Progression du diagnostic">';
    for (i = 0; i < vis.length; i++) {
      cls = vis[i] === step ? "ob-dot ob-dot-on" : (i < rang ? "ob-dot ob-dot-past" : "ob-dot");
      h += '<button type="button" class="ob-dot-btn" data-action="ob-aller" data-v="' + vis[i] + '"' +
           ' aria-label="Étape ' + (i + 1) + ", " + esc(OB[vis[i]].nom) + '"' +
           ' aria-current="' + (vis[i] === step ? "step" : "false") + '">' +
           '<span class="' + cls + '"></span></button>';
    }
    h += "</div>";

    // LA PREMIERE ETAPE SEULE NE PORTE PAS SON NOM. Demande d'Olivier a la
    // revue : « Toi » redisait le titre juste en dessous, « On commence par
    // toi ». Les autres etapes le gardent, parce que la leur ajoute quelque
    // chose : « Objectif » sous « Tu cherches quoi ? ».
    h += '<div class="ob-step-label">Étape ' + (rang + 1) + " sur " + vis.length +
         (rang > 0 ? " · " + esc(ob.nom) : "") + "</div>";
    h += '<h1 class="ob-titre">' + esc(ob.titre) + "</h1>";
    h += '<p class="ob-lead">' + esc(ob.sous) + "</p>";

    if (ob.type === "champs") h += etapeChampsHtml(step);
    else if (ob.type === "chips") h += etapeChipsHtml(ob);
    else if (ob.type === "jours") h += etapeJoursHtml();
    else if (ob.type === "duree") h += etapeDureeHtml();
    else if (ob.type === "materiel") h += etapeMaterielHtml();
    else if (ob.type === "programme") h += etapeProgrammeHtml();
    else if (ob.type === "nutri") h += etapeNutriHtml();
    else if (ob.type === "recap") h += etapeRecapHtml(step, ob);

    h += '<div class="ob-nav">';
    if (step > 0) {
      h += '<button type="button" class="ob-prev" data-action="ob-prev">Retour</button>';
    }
    h += '<button type="button" class="ob-next" data-action="ob-next">' +
         (state.vu ? "Enregistrer" : (rang >= vis.length - 1 ? "Ouvrir l'appli" : "Continuer")) +
         "</button>";
    h += "</div>";

    // LA SORTIE DU DIAGNOSTIC QUAND ON Y REVIENT POUR CORRIGER UNE REPONSE.
    //
    // Signale par Olivier : depuis Moi › Durée par séance, on tombait dans le
    // diagnostic et il fallait REPONDRE A TOUTES LES ETAPES SUIVANTES pour en
    // sortir. Le glissement est fige ici — a raison, on ne quitte pas un
    // questionnaire par erreur — mais rien ne remplacait cette issue.
    //
    // La regle : un diagnostic DEJA FAIT (`vu`) se corrige, il ne se refait pas.
    // Le bouton principal enregistre et rend la main ; le lien du dessous
    // permet de repartir sans rien changer.
    if (state.vu) {
      h += '<button type="button" class="ob-quitter" data-action="ob-quitter">' +
           "Annuler et revenir</button>";
    }
    h += "</div>";
    return h;
  }

  // -------------------------------------------------------------------------
  // SORTIE DU DIAGNOSTIC
  // -------------------------------------------------------------------------
  // `seance` NE DOIT JAMAIS VALOIR null : SEANCES[null] vaut undefined et vide
  // tout l'ecran. Le cas se produisait quand le jour courant portait un cours
  // ou une sortie, donc qu'il n'y avait pas de « seance du jour » a designer.
  // siDepart retombe alors sur la premiere seance de la rotation, sinon zero.
  function ouvrirLAppli() {
    var d = deriver();
    poser({
      vu: true, ecran: "jour", seance: d.siDepart,
      faits: null, demarre: false, phase: "set", chrono: 0, tIdx: 0, finiIdx: 0
    });
    window.scrollTo(0, 0);
  }

  // UN DIAGNOSTIC DEJA FAIT SE CORRIGE, IL NE SE REFAIT PAS. Quand on arrive
  // ici depuis une ligne de reglage, valider rend la main tout de suite : on
  // etait venu changer UNE reponse, pas reprendre les onze etapes.
  //
  // « Refaire le diagnostic », depuis Moi, remet `vu` a false et retrouve donc
  // le parcours complet.
  function obSuivant() {
    if (state.vu) { obQuitter(true); return; }
    var suiv = etapeApres(state.obStep);
    if (suiv === null) { ouvrirLAppli(); return; }
    poser({ obStep: suiv });
    window.scrollTo(0, 0);
  }

  function obQuitter(enregistre) {
    var dest = state.retourDe || "moi";
    // Le plan depend des reponses : on le laisse se rederiver, et on remet la
    // seance courante dans les clous au cas ou la rotation aurait change.
    var d = deriver();
    poser({ ecran: dest, retourDe: "", obStep: 0,
            seance: (state.seance < SEANCES.length ? state.seance : d.siDepart) });
    window.scrollTo(0, 0);
    return enregistre;
  }

  function obPrecedent() {
    var prec = etapeAvant(state.obStep);
    poser({ obStep: prec === null ? 0 : prec });
    window.scrollTo(0, 0);
  }

  // =========================================================================
  // LES ETAPES QUI NE SE POSENT PAS A TOUT LE MONDE
  // -------------------------------------------------------------------------
  // « Combien de temps pour une séance en salle ? » et « Tu t'entraînes où,
  // avec quoi ? » n'ont aucun sens pour qui ne declare que des cours
  // collectifs ou des sorties running : on demanderait le temps passe dans un
  // endroit ou l'on ne met jamais les pieds, puis le materiel qu'on y trouve.
  // Signale par Olivier a la revue.
  //
  // LES ETAPES NE SONT PAS RETIREES DE `OB`, ELLES SONT SAUTEES. Retirer une
  // entree decalerait tous les index, et ceux-ci sont ecrits en dur dans les
  // raccourcis de Moi (« Durée par séance » vise l'etape 5). Un tableau qui
  // change de longueur selon les reponses ferait pointer ces raccourcis
  // ailleurs, sans que rien ne le signale.
  //
  // Le compteur « Étape X sur Y » compte les etapes VISIBLES, pas les onze :
  // annoncer onze etapes et n'en traverser que neuf se remarque tout de suite.
  // =========================================================================
  function aDeLaSalle() {
    return deriver().slotsSalle.length > 0;
  }

  function etapePertinente(i) {
    var ob = OB[i];
    if (!ob) return false;
    if (ob.type === "duree" || ob.type === "materiel") return aDeLaSalle();
    return true;
  }

  function etapesVisibles() {
    var out = [], i;
    for (i = 0; i < OB.length; i++) { if (etapePertinente(i)) out.push(i); }
    return out;
  }

  function etapeApres(i) {
    var j;
    for (j = i + 1; j < OB.length; j++) { if (etapePertinente(j)) return j; }
    return null;
  }

  function etapeAvant(i) {
    var j;
    for (j = i - 1; j >= 0; j--) { if (etapePertinente(j)) return j; }
    return null;
  }

  /* =========================================================================
     ECRAN « AUJOURD'HUI »
     -------------------------------------------------------------------------
     Ordre impose par le README section 9, et respecte ligne pour ligne :
       1. date longue + titre + serie
       2. bande de la semaine, coloree par discipline, suffixe « +1 »
       3. phrase de motivation
       4. selecteur de creneau, seulement si la journee porte deux activites
       5. la carte du jour, dans une de ses quatre variantes
       6. resume nutrition
       7. carte de pesee
     ========================================================================= */

  var JOURS_LONGS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
  var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
              "août", "septembre", "octobre", "novembre", "décembre"];

  function dateLongue(d) {
    var s = JOURS_LONGS[(d.getDay() + 6) % 7] + " " + d.getDate() + " " + MOIS[d.getMonth()];
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  // NUMERO DE JOUR REEL, PAS UNE CONSTANTE. Le prototype ecrit `jour = 20690`,
  // le numero du 24 aout 2026, pour que ses captures ne bougent pas. Recopier ce
  // nombre figerait la variante de motivation pour toujours : la meme phrase
  // tous les jours, a vie. On le calcule depuis la date LOCALE, pour que le
  // changement se fasse a minuit chez l'utilisateur et pas a minuit UTC.
  function jourNumero() {
    var d = new Date();
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  // -------------------------------------------------------------------------
  // MOTIVATION
  // -------------------------------------------------------------------------
  // Premier contexte dont la condition passe, du plus specifique au plus
  // general. La variante est choisie par un hachage du nom du contexte combine
  // au numero du jour : meme phrase toute la journee, une autre demain. Un
  // tirage aleatoire changerait de phrase a chaque rendu, donc a chaque
  // toucher, et l'ecran paraitrait instable.
  function motivation(ctx) {
    var i, k, m, h, p, val;
    var jour = jourNumero();
    for (i = 0; i < MOTIV.length; i++) {
      m = MOTIV[i];
      if (!m.si(ctx)) continue;
      h = 0;
      for (k = 0; k < m.k.length; k++) { h = (h * 31 + m.k.charCodeAt(k)) % 9973; }
      p = m.v[(jour + h) % m.v.length];
      val = function (x) { return typeof x === "function" ? x(ctx) : x; };
      return { cle: m.k, head: val(p.head), sub: val(p.sub) };
    }
    return { cle: "", head: "", sub: "" };
  }

  // Le contexte est bati sur des donnees REELLES, jamais sur des valeurs
  // d'exemple. Ce qui manque encore vaut null ou zero, et les conditions de
  // MOTIV sont ecrites pour le supporter : un contexte incomplet retombe sur
  // « default », il n'invente pas.
  //
  // Le contexte lit le JOURNAL DATE, donc il dit vrai au-dela de la semaine
  // courante. `palier` compare le total aux paliers de BADGES ; `plateau` et
  // `tonnageDiff` comparent les deux dernieres seances de salle du meme code.
  function contexteMotivation() {
    var d = deriver(), h = histTrie(), i, total = h.length;
    var p = profilDepuisEtat();
    var reste = (p.startWeight && p.targetWeight) ? (p.startWeight - p.targetWeight) : null;
    var auj = jourIndexAujourdhui(), jourSeance = false;
    for (i = 0; i < d.progJours.length; i++) { if (d.progJours[i].ji === auj) jourSeance = true; }

    var palier = false;
    for (i = 0; i < MOTEUR.BADGES.length; i++) { if (MOTEUR.BADGES[i].n === total) palier = true; }

    // Tonnage : ecart entre les deux dernieres seances de salle de MEME code.
    // Comparer un PUSH a un LEGS ne voudrait rien dire.
    var tonnageDiff = 0, vues = {}, prem = null, sec = null;
    for (i = 0; i < h.length; i++) {
      if (h[i].t !== "salle") continue;
      if (!prem) { prem = h[i]; continue; }
      if (!sec && h[i].code === prem.code) { sec = h[i]; break; }
    }
    if (prem && sec) tonnageDiff = (prem.tonnage || 0) - (sec.tonnage || 0);

    // Plateau : le poids n'a pas bouge de plus de 300 g sur deux semaines.
    var pes = state.pesees || [], plateau = false;
    if (pes.length >= 2) {
      var dernier = pes[pes.length - 1], avant = pes[0], j;
      for (j = pes.length - 1; j >= 0; j--) {
        if (jourEcart(dateDepuisCle(dernier.d), dateDepuisCle(pes[j].d)) >= 14) { avant = pes[j]; break; }
      }
      plateau = Math.abs(dernier.kg - avant.kg) < 0.3;
    }

    var perdu = pes.length ? (pes[0].kg - pes[pes.length - 1].kg) : 0;

    return {
      total: total,
      streak: serieCourante(),
      assiduite: assiduite(),
      reste: reste,
      resteTxt: reste === null ? "" : frDec(reste),
      kgTxt: frDec(perdu > 0 ? perdu : 0),
      palier: palier,
      plateau: plateau,
      tonnageDiff: tonnageDiff,
      tonTxt: frDec(Math.abs(tonnageDiff)),
      avance: false,
      jourSeance: jourSeance
    };
  }

  function frDec(n) {
    var s = String(Math.round(n * 10) / 10);
    return s.replace(".", ",");
  }

  // -------------------------------------------------------------------------
  // BANDE DE LA SEMAINE
  // -------------------------------------------------------------------------
  // Sept cases, une par jour. Chacune porte l'initiale et le CODE de son
  // activite, suffixe « +1 » quand la journee en porte deux — sinon la seconde
  // seance serait invisible sur l'ecran qui sert justement a lire la semaine.
  function bandeSemaineHtml() {
    var d = deriver(), auj = jourIndexAujourdhui(), h = "", i, j, jr, code, dd, fait, cle;

    h += '<div class="sem" role="img" aria-label="Ta semaine">';
    for (i = 0; i < 7; i++) {
      jr = null;
      for (j = 0; j < d.progJours.length; j++) { if (d.progJours[j].ji === i) jr = d.progJours[j]; }

      if (!jr || jr.vide) {
        h += '<div class="sem-c' + (i === auj ? " sem-auj" : "") + '">' +
             '<span class="sem-i">' + esc(JOURS[i].charAt(0)) + "</span>" +
             '<span class="sem-t sem-repos">repos</span></div>';
        continue;
      }

      dd = DISC[jr.acts[0].t];
      code = jr.acts[0].t === "salle" ? SEANCES[jr.acts[0].si].code : dd.court;
      cle = i + "-0";
      fait = !!state.actFaits[cle];
      h += '<div class="sem-c' + (i === auj ? " sem-auj" : "") + '"' +
           ' style="background:' + dd.pale + ";color:" + dd.encre + '">' +
           '<span class="sem-i">' + esc(JOURS[i].charAt(0)) + "</span>" +
           '<span class="sem-t">' + esc(code) + (jr.acts.length > 1 ? " +1" : "") + "</span>" +
           (fait ? '<span class="sem-ok" aria-label="faite">✓</span>' : "") +
           "</div>";
    }
    return h + "</div>";
  }

  // -------------------------------------------------------------------------
  // SELECTEUR DE CRENEAU
  // -------------------------------------------------------------------------
  // MUET tant que la journee n'en porte qu'un : deux boutons pour un seul choix
  // ne sont pas un choix, ils sont du bruit.
  function selecteurCreneauHtml(acts) {
    if (acts.length < 2) return "";
    // LE TITRE MANQUAIT. Deux boutons sans en-tete ne disent pas ce qu'ils
    // sont : on les prend pour un filtre. La maquette les annonce.
    var h = '<div class="creneaux-t">Deux séances aujourd\'hui</div>';
    h += '<div class="creneaux" role="group" aria-label="Choisir le créneau">';
    var i, a, dd, fait;
    for (i = 0; i < acts.length; i++) {
      a = acts[i];
      dd = DISC[a.t];
      fait = !!state.actFaits[a.ji + "-" + a.k];
      h += '<button type="button" class="creneau' + (state.slotAuj === i ? " creneau-on" : "") + '"' +
           ' style="' + (state.slotAuj === i ? "border-color:" + dd.bd + ";background:" + dd.pale + ";color:" + dd.encre : "") + '"' +
           ' aria-pressed="' + (state.slotAuj === i ? "true" : "false") + '"' +
           ' data-action="creneau" data-i="' + i + '">' +
           '<span class="creneau-r">' + (i === 0 ? "1re séance" : "2e séance") + "</span>" +
           '<span class="creneau-d">' + esc(dd.t) + (fait ? " ✓" : "") + "</span></button>";
    }
    return h + "</div>";
  }

  // -------------------------------------------------------------------------
  // LES QUATRE VARIANTES DE LA CARTE DU JOUR
  // -------------------------------------------------------------------------
  function carteSalleHtml(a) {
    var ex = exosDe(a.si), i, series = 0, fait = !!state.actFaits[a.ji + "-" + a.k];
    for (i = 0; i < ex.length; i++) series += ex[i].n;

    // LA CARTE SOMBRE NE PORTE PLUS QUE LA SEANCE DU JOUR ET SES TROIS BOUTONS.
    //
    // Elle contenait aussi la liste des cinq seances et la liste des exercices :
    // trois choses de nature differente dans un seul bloc noir, qu'on parcourait
    // en se demandant ou l'une finissait. La maquette sort la liste des cinq
    // seances dans son PROPRE encart clair, borde de citron.
    //
    // L'en-tete suit aussi la maquette : « SÉANCE PULL · prévue jeudi » sur une
    // ligne discrete, et le vrai titre est ce que la seance travaille.
    var d = deriver(), jourPrevu = d.jourDe(a.si);
    var h = '<section class="carte-sombre">';
    h += '<div class="cs-haut"><span class="cs-code">Séance ' + esc(SEANCES[a.si].code) + "</span>" +
         '<span class="cs-quand"> · ' +
         esc(jourPrevu ? "prévue " + jourPrevu : "hors rotation") + "</span></div>";
    h += '<div class="cs-sub">' + esc(SEANCES[a.si].sub) + "</div>";
    h += '<div class="cs-det"><span class="num">' + ex.length + "</span> exercices · " +
         '<span class="num">' + series + '</span> séries · <span class="num">' +
         esc(dureeLibelle().replace(" minutes", " min")) + "</span></div>";
    h += '<button type="button" class="cs-cta" data-action="demarrer-seance">' +
         (fait ? "Refaire la séance" : "Démarrer la séance") + "</button>";

    // LES DEUX AUTRES BOUTONS DE LA MAQUETTE, en bloc et non en lien souligne.
    // « Fermer la liste » replie l'encart des cinq seances ; « Revenir au cours
    // du jour » n'existe QUE si l'on a effectivement remplace l'activite prevue,
    // sinon il proposerait de revenir a l'endroit ou l'on se trouve deja.
    h += '<button type="button" class="cs-btn" data-action="basculer-liste">' +
         (state.listeFermee ? "Voir les cinq séances" : "Fermer la liste") + "</button>";
    // « Revenir au ... du jour » n'est PAS ici : il vit avec le bloc de
    // remplacement, sous toutes les cartes. Pose ici, il disparaissait des
    // qu'on remplacait par un running ou un cours, et il n'y avait plus aucune
    // issue pour revenir a ce qui etait prevu. Trouve en le mesurant.
    h += "</section>";

    // L'ENCART DES CINQ SEANCES, HORS DE LA CARTE SOMBRE.
    //
    // La maquette les montre TOUTES avec leur jour prevu a droite, et c'est ce
    // jour-la qui rend le choix informe : prendre la seance de vendredi
    // aujourd'hui, c'est savoir qu'il faudra faire autre chose vendredi.
    if (!state.listeFermee) {
      h += '<section class="cs-toutes">';
      h += '<div class="cs-toutes-t">Les cinq séances de ton programme</div>';
      h += '<div class="cs-toutes-s">Le jour prévu est indiqué à droite. Si tu prends ' +
           "celle d'un autre jour, tu sauras quoi faire ce jour-là.</div>";
      h += '<ul class="cs-liste">';
      var jourDeS, exS, faitS;
      for (i = 0; i < SEANCES.length; i++) {
        jourDeS = d.jourDe(i);
        exS = exosDe(i);
        faitS = i === a.si && fait;
        h += '<li><button type="button" class="cs-s" data-action="choisir-seance" data-i="' + i + '">' +
             '<span class="cs-s-p">' + esc(SEANCES[i].code) + "</span>" +
             '<span class="cs-s-c"><span class="cs-s-n">' + esc(SEANCES[i].sub) + "</span>" +
             '<span class="cs-s-d num">' + exS.length + " exercices · " +
             esc(dureeLibelle().replace(" minutes", " min")) + "</span></span>" +
             '<span class="cs-s-j">' + esc(jourDeS || "hors rotation") +
             '<span class="cs-s-e" aria-hidden="true">' + (faitS ? "✓" : "›") + "</span></span>" +
             "</button></li>";
      }
      h += "</ul></section>";
    }

    // La liste des exercices garde sa carte sombre a elle : c'est le contenu de
    // la seance du jour, pas un choix de seance.
    h += '<section class="carte-sombre">';

    // ORDRE LIBRE : toucher un exercice demarre DESSUS. Sans ca, il faudrait
    // traverser la seance pour atteindre le troisieme mouvement.
    h += '<div class="cs-libre-t">Ordre libre</div>';
    h += '<div class="cs-libre-s">Touche un exercice pour démarrer la séance dessus.</div>';
    h += '<ul class="cs-exos">';
    for (i = 0; i < ex.length; i++) {
      h += '<li><button type="button" class="cs-exo" data-action="ouvrir-exo" data-i="' + i + '">' +
           '<span class="cs-exo-n">' + esc(ex[i].nom) + "</span>" +
           '<span class="cs-exo-d num">' + esc(ex[i].n + " × " + ex[i].reps +
           (ex[i].unite ? " " + ex[i].unite : "")) + "</span></button></li>";
    }
    h += "</ul></section>";
    return h;
  }

  function carteCoursHtml(a) {
    var fait = !!state.actFaits[a.ji + "-" + a.k];
    var h = '<section class="carte-sombre carte-cours">';
    h += '<div class="cs-code">' + esc(a.nom || "Cours collectif") + "</div>";
    h += '<div class="cs-sur">' + esc(NATURES[a.nat].t) + " · prévu aujourd'hui" +
         ' <span class="cs-pill num">' + a.min + " min</span></div>";
    // UNE FOIS VALIDE, LA CARTE LE DIT ET DIT CE QUE CA COMPTE. Ma version se
    // contentait de cocher le bouton : rien ne confirmait que le cours entrait
    // dans la serie et dans l'assiduite, ce qui est justement la question qu'on
    // se pose en validant un cours qu'on n'a pas fait dans l'appli.
    h += '<p class="cs-txt">' + (fait
      ? "Cours validé. Il compte dans ta série et dans ton assiduité."
      : "Ton coach mène la séance. Tu la valides en sortant.") + "</p>";
    h += '<button type="button" class="cs-cta cs-cta-cours"' +
         ' data-action="valider-act" data-ji="' + a.ji + '" data-k="' + a.k + '">' +
         (fait ? "✓ Cours validé" : "J'ai fait le cours") + "</button>";
    // Le lien « Faire une séance en salle à la place » est remplacé par le bloc
    // commun des trois disciplines, pose sous la carte par jourHtml.
    return h + "</section>";
  }

  function carteRunHtml(a) {
    var fait = !!state.actFaits[a.ji + "-" + a.k], i;
    var h = '<section class="carte-sombre carte-run">';
    h += '<div class="cs-code">Running</div>';
    h += '<div class="cs-sur">' + esc(LIEUX[a.lieu].t) + " · prévue aujourd'hui</div>";
    // LE TITRE DE SAISIE ET SA PHRASE MANQUAIENT. Deux champs nus n'expliquent
    // pas qu'on les remplit AU RETOUR : la sortie est declarative, elle ne se
    // chronometre pas dans l'appli.
    h += '<div class="run-t">' + (fait ? "Sortie notée" : "Note ta sortie") + "</div>";
    h += '<p class="cs-txt">Au retour, deux chiffres suffisent.</p>';
    h += '<div class="run-champs">';
    h += '<div class="run-c"><label class="run-l" for="run-km">Distance</label>' +
         '<input id="run-km" class="run-in num" type="text" inputmode="decimal" placeholder="0,0"' +
         ' value="' + esc(state.runKm) + '" data-action="run-km"><span class="run-u">km</span></div>';
    h += '<div class="run-c"><label class="run-l" for="run-min">Durée</label>' +
         '<input id="run-min" class="run-in num" type="text" inputmode="numeric" placeholder="0"' +
         ' value="' + esc(state.runMin) + '" data-action="run-min"><span class="run-u">min</span></div>';
    h += "</div>";
    h += '<div class="run-lieux">';
    for (i = 0; i < LIEUX.length; i++) {
      h += '<button type="button" class="run-lieu' + (a.lieu === i ? " run-lieu-on" : "") + '"' +
           ' aria-pressed="' + (a.lieu === i ? "true" : "false") + '"' +
           ' data-action="run-lieu" data-ji="' + a.ji + '" data-k="' + a.k + '" data-v="' + i + '">' +
           esc(LIEUX[i].t) + "</button>";
    }
    h += "</div>";
    // AUCUNE ALLURE, AUCUNE CALORIE. L'appli ne les mesure pas ; les afficher
    // serait une precision qu'elle n'a pas.
    h += '<button type="button" class="cs-cta cs-cta-run"' +
         ' data-action="valider-act" data-ji="' + a.ji + '" data-k="' + a.k + '">' +
         (fait ? "✓ Sortie enregistrée" : "Enregistrer la sortie") + "</button>";
    // LA MEME PORTE DE SORTIE QUE SUR LA CARTE DE COURS. Elle manquait ici :
    // un jour de running ne laissait aucun moyen de basculer sur de la fonte,
    // alors qu'un jour de cours l'offrait. Deux cartes qui font le meme metier
    // doivent offrir les memes issues. C'est maintenant le bloc commun des
    // trois disciplines qui s'en charge, pose sous la carte par jourHtml.
    return h + "</section>";
  }

  function carteReposHtml() {
    var d = deriver(), auj = jourIndexAujourdhui(), i, prochain = null, jr;
    for (i = 0; i < d.progJours.length; i++) {
      jr = d.progJours[i];
      if (jr.ji > auj && !prochain) prochain = jr;
    }
    if (!prochain && d.progJours.length) prochain = d.progJours[0];

    // TEXTES REPRIS DE LA MAQUETTE, mot pour mot. Ma version disait « Repos »
    // et une phrase de mon cru : trois libelles de moins, et le ton n'etait pas
    // le meme. La maquette explique POURQUOI c'est un jour de repos, au lieu de
    // le constater.
    var h = '<section class="carte-repos">';
    h += '<div class="cr-t">Jour de repos</div>';
    if (prochain) {
      var quoi = prochain.vide ? "rien de déclaré"
        : (prochain.acts[0].t === "salle" ? SEANCES[prochain.acts[0].si].code
          : DISC[prochain.acts[0].t].court);
      h += '<p class="cr-p">Rien de prévu aujourd\'hui. Prochaine séance : ' +
           esc(prochain.nom.toLowerCase()) + " · <b>" + esc(quoi) + "</b>" +
           ". La récupération fait partie du programme — mais tu peux prendre " +
           "une séance d'avance ci-dessous.</p>";
      h += '<button type="button" class="cr-btn" data-action="autre-seance">' +
           "Prendre une séance d'avance</button>";
    } else {
      h += '<p class="cr-p">Rien de prévu aujourd\'hui.</p>';
    }
    return h + "</section>";
  }

  // -------------------------------------------------------------------------
  // NUTRITION ET PESEE
  // -------------------------------------------------------------------------
  function resumeNutritionHtml() {
    var t = ciblesNutrition(), i, pris = 0;
    for (i = 0; i < state.obSupps.length; i++) { if (state.obSupps[i]) pris++; }
    return '<button type="button" class="carte-lien" data-action="onglet" data-ecran="nutri">' +
      '<span class="cl-t">Nutrition du jour</span>' +
      '<span class="cl-v num">' + t.kcal + " kcal · " + t.prot + " g</span>" +
      '<span class="cl-s">' + pris + " complément" + (pris > 1 ? "s" : "") + " retenu" +
      (pris > 1 ? "s" : "") + "</span></button>";
  }

  // TROIS ETATS, PAS DEUX. Ma premiere version ne rendait RIEN hors du jour de
  // pesee : l'ecran se terminait sur la nutrition et le rendez-vous
  // disparaissait six jours sur sept. La maquette montre un rappel « Prochaine
  // pesée », et c'est lui qui fait tenir le rendez-vous — un rendez-vous qu'on
  // ne voit jamais n'en est pas un.
  //
  //   1. le jour dit, pas encore faite  -> la carte de saisie
  //   2. le jour dit, deja faite        -> l'accuse de reception
  //   3. les autres jours               -> le rappel
  // LE POIDS DU MOMENT. Ce bloc manquait entierement.
  //
  // L'ecran passait directement des repas a « Prochaine pesée » : il disait
  // QUAND se peser sans jamais dire OU l'on en est. C'est pourtant le chiffre
  // qu'on vient chercher. Signale par Olivier.
  //
  // La valeur affichee est la DERNIERE PESEE, pas le poids du diagnostic, et la
  // ligne de droite dit de quand elle date. Sans pesee, on le dit : afficher le
  // poids declare sous l'etiquette « poids » laisserait croire a une mesure.
  function cartePoidsHtml() {
    var pes = state.pesees || [], derniere = pes.length ? pes[pes.length - 1] : null;
    var d = derniere ? dateDepuisCle(derniere.d) : null;
    var valeur = derniere ? derniere.kg : nombreOu(state.obPoids, 0);
    if (!valeur) return "";

    var quand = d
      ? "dernière pesée " + JOURS_LONGS[(d.getDay() + 6) % 7] + " " + d.getDate()
      : "poids déclaré au diagnostic";

    return '<section class="poids-c">' +
      '<div class="poids-h"><span class="poids-l">Poids</span>' +
      '<span class="poids-q">' + esc(quand) + "</span></div>" +
      '<div class="poids-v num">' + esc(fmtVal(valeur)) +
      '<span class="poids-u">kg</span></div></section>';
  }

  function cartePeseeHtml() {
    var auj = jourIndexAujourdhui();

    if (auj !== state.obPeseeJour) {
      var dans = (state.obPeseeJour - auj + 7) % 7;
      var quand = JOURS[state.obPeseeJour] + ", " +
                  PESEE_MOMENTS[state.obPeseeMoment].t.toLowerCase();
      return '<section class="pesee-suite">' +
        '<div class="ps-t">Prochaine pesée</div>' +
        '<div class="ps-q">' + esc(quand) + "</div>" +
        '<div class="ps-p">Une seule fois par semaine, dans ' + dans + " jour" +
        (dans > 1 ? "s" : "") + ". Se peser tous les jours ne mesure que l'eau " +
        "et le contenu de l'estomac.</div></section>";
    }

    // ETAT « NOTEE » : la maquette laisse une porte de sortie, « Corriger », au
    // lieu de figer la journee. Se peser deux fois de suite en cinq minutes est
    // banal, et bloquer la saisie obligerait a attendre sept jours pour
    // rectifier un chiffre tape de travers.
    var h = '<section class="carte">';
    if (state.peseeFaite) {
      h += '<div class="carte-t">Pesée notée</div>';
      h += '<p class="cr-p">Prochaine dans sept jours, ' +
           esc(PESEE_MOMENTS[state.obPeseeMoment].t.toLowerCase()) + ".</p>";
      h += '<button type="button" class="cr-btn" data-action="pesee-corriger">Corriger</button>';
      return h + "</section>";
    }
    h += '<div class="carte-t">Pesée de la semaine</div>';
    // LA PHRASE DE LA MAQUETTE DIT POURQUOI, avec un ordre de grandeur. La
    // mienne se contentait d'une consigne ; celle-ci donne la raison de la
    // consigne, ce qui la rend tenable.
    h += '<p class="cr-p">Une pesée ne vaut que comparée à la précédente. ' +
         "Change une seule condition et le chiffre bouge de 300 g à 1 kg — assez " +
         "pour croire à une progression qui n'existe pas.</p>";
    h += '<ul class="pesee-cond">';
    for (var i = 0; i < PESEE_COND.length; i++) {
      h += "<li>" + esc(PESEE_COND[i].t) + "</li>";
    }
    h += "</ul>";
    h += '<div class="run-c"><input class="run-in num" type="text" inputmode="decimal"' +
         ' placeholder="0,0" value="' + esc(state.obPoids) + '" data-action="ob-poids">' +
         '<span class="run-u">kg</span></div>';
    h += '<button type="button" class="cs-cta cs-cta-clair" data-action="pesee-faite">' +
         "Noter mon poids</button>";
    return h + "</section>";
  }
