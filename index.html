  function grBornerProt(a, g, plafond, plancher) {
    if (!(plafond > 0) || a.libre || !(a.prot100 > 0)) return g;
    var max = alimentArrondiG(plafond * 100 / a.prot100);
    var mini = plancher > GR_MIN_SERVI ? plancher : GR_MIN_SERVI;
    if (max < mini) max = mini;
    return g > max ? max : g;
  }

  // --- Vivier -----------------------------------------------------------------
  function alimCandidats(role, motif, cook) {
    var ids = NUTRI_POOL[role + "|" + motif], out = [], i, a;
    if (!ids) return out;
    for (i = 0; i < ids.length; i++) {
      a = aliment(ids[i]);
      if (!a) continue;                    // entree renommee : on l'ignore
      if (!cook && a.cuisson) continue;    // « je ne cuisine pas »
      // Un gras qui n'a rien a faire dans ce type de plat ne rentre meme pas
      // dans le vivier : le tirage ne peut donc pas tomber dessus, et la graine
      // n'a pas a le savoir. C'est le meme geste qu'`exclu` un cran plus bas —
      // une INTERDICTION, pas une preference qui se replie.
      if (role === "gras" && !grasVaAvecPlat(a, motif)) continue;
      out.push(a);
    }
    return out;
  }

  // `exclu` retire un identifiant OU UNE LISTE d'identifiants du vivier AVANT
  // tout tirage. La liste est ce qui permet d'interdire une FAMILLE entiere —
  // voir fecMemeFamille — sans que alimPick ait a savoir ce qu'est une famille.
  //
  // Ce n'est pas la
  // meme chose que ctx.dejaVu : dejaVu est une PREFERENCE — quand tout le vivier
  // y est deja, on repart du vivier complet plutot que de ne rien servir —, et
  // c'est precisement ce repli qui produisait « 4 tranches de pain complet
  // (160 g) + 2 noisettes de beurre + 4 tranches de pain complet (160 g) » : au
  // diner, apres un dejeuner qui avait deja consomme les deux seuls feculents
  // sans cuisson, le second tirage repartait du vivier complet et retombait sur
  // le premier. `exclu` est une INTERDICTION, elle ne se replie pas. La graine
  // n'est pas touchee : c'est la liste qui perd une case, jamais le hachage.
  // OU LA ROTATION S'APPLIQUE. Un creneau qui sert trois ou quatre pieces n'a
  // pas besoin d'elle : meme si le feculent revient, le reste de l'assiette a
  // change et la journee ne se lit pas comme la veille. LA COLLATION N'A PAS
  // CETTE CHANCE — elle sert UNE piece, et cette piece EST la prise. Mesure sur
  // 96 profils x 28 journees, avant correction : la meme collation d'un seul
  // aliment revenait a la veille dans 6,4 % des cas et dans les trois jours dans
  // 20,7 %, avec des viviers qui comptent pourtant six entrees de chaque cote.
  var COL_TOURNE = true;
  // UNE ROTATION, PAS UNE MEMOIRE. Premiere ecriture de ce correctif, mesuree et
  // jetee : elle marquait les cases tirees les derniers jours et
  // avancait d'un cran tant que la case etait marquee. Elle a rendu le defaut
  // PIRE — collation identique a la veille sur 8,4 % des prises contre 6,4 %
  // avant, mesure sur 96 profils x 28 journees. La raison : on compare des
  // CASES et non des aliments, or `libre` change de taille d'un jour a l'autre
  // au gre de dejaVu ; le balayage vers l'avant concentrait alors les tirages au
  // lieu de les etaler.
  //
  // CE QUI MARCHE EST PLUS SIMPLE : faire AVANCER le tirage d'un cran par jour.
  // Le hachage choisit le point de depart, le numero du jour fait tourner. Deux
  // journees voisines ne peuvent alors pas tomber sur la meme case tant que le
  // vivier n'a pas ete parcouru, et le vivier est parcouru en entier avant de se
  // repeter. Reproductible — cela ne depend que de la date —, sans historique a
  // stocker et sans recursion.
  //
  // `tourne` demande cette rotation. Absent, le tirage garde EXACTEMENT le
  // comportement d'avant, nudge sur la veille compris : les creneaux qui servent
  // trois ou quatre pieces n'ont pas ce probleme, leur assiette entiere change
  // meme quand une piece revient.
  function alimPick(role, motif, ctx, sel, exclu, tourne) {
    var cand0 = alimCandidats(role, motif, ctx.cook), cand = [], libre = [], i, idx, hier, cle;
    var ex = exclu ? (isArray(exclu) ? exclu : [exclu]) : [];
    for (i = 0; i < cand0.length; i++) if (ex.indexOf(cand0[i].id) < 0) cand.push(cand0[i]);
    if (!cand.length) return null;
    for (i = 0; i < cand.length; i++) if (!has(ctx.dejaVu, cand[i].id)) libre.push(cand[i]);
    if (!libre.length) libre = cand;
    cle = sel + "|" + role + "|" + motif;
    if (tourne) {
      // LA ROTATION PORTE SUR `cand`, PAS SUR `libre`. Deuxieme mesure, et c'est
      // elle qui a tranche : tourner sur `libre` ne garantit rien, parce que
      // `libre` change de taille d'un jour a l'autre au gre de dejaVu — le pas de
      // un se lit alors modulo une longueur differente, et deux jours voisins
      // peuvent retomber sur le meme aliment. `cand` est le vivier COMPLET, il
      // ne depend que du role, du motif et de la cuisson : il ne bouge pas d'un
      // jour a l'autre, et un pas de un par jour le parcourt en entier avant de
      // revenir. Le hachage ne sert plus qu'a choisir OU l'on entre dans le
      // cycle, pour que deux creneaux ne marchent pas au pas.
      //
      // dejaVu reste une PREFERENCE et s'applique APRES : on avance dans l'ordre
      // tourne jusqu'a un aliment que la journee n'a pas deja servi, et si toute
      // la liste y est on sert quand meme le premier — c'est le repli d'origine,
      // inchange.
      var dep = (nutriSeed("rotation", cle) + jourNumero(ctx.dateKey)) % cand.length, z, pris = null;
      for (z = 0; z < cand.length; z++) {
        var c2 = cand[(dep + z) % cand.length];
        if (!has(ctx.dejaVu, c2.id)) { pris = c2; break; }
      }
      if (!pris) pris = cand[dep];
      ctx.dejaVu[pris.id] = true;
      return pris;
    }
    idx = nutriSeed(ctx.dateKey, cle) % libre.length;
    // Anti-repetition d'un jour sur l'autre : si le hachage de la veille tombe
    // sur la meme case, on avance d'un cran. Un cran suffit, reste reproductible,
    // et ne coute qu'un hachage — pas de recursion, pas d'historique a stocker.
    if (libre.length > 1) {
      hier = nutriSeed(veilleDe(ctx.dateKey), cle) % libre.length;
      if (hier === idx) idx = (idx + 1) % libre.length;
    }
    ctx.dejaVu[libre[idx].id] = true;
    return libre[idx];
  }

  // UNE ASSIETTE QUI DOIT PORTER BEAUCOUP DE CALORIES NE PEUT PAS ETRE AQUEUSE.
  // C'est ici que le plafond de masse et la cible calorique se rencontrent, et
  // sans cette regle le plafond coupe sans rien proposer a la place.
  //
  // LA MESURE QUI L'A IMPOSEE. MASSE_MAX_PRISE seul faisait tomber le profil du
  // banc M3 — h 90 kg, deux repas — a 78 % de sa cible calorique, contre 85 %
  // exiges : ses deux assiettes butaient sur le plafond en servant « 6 pommes de
  // terre (600 g) » et s'arretaient la. 1 450 kcal dans 950 g demandent 153 kcal
  // aux 100 g en moyenne sur TOUTE l'assiette ; une pomme de terre en porte 85,
  // une patate douce 90, le mais 100. Avec eux, la seule facon d'atteindre la
  // cible etait de servir 1,4 kg — c'est-a-dire exactement ce que le plafond
  // vient d'interdire. Des pates en portent 150, du riz 130, du taboule 145 : la
  // meme assiette, au meme poids, tient alors sa cible.
  //
  // ON NE REMPLACE PAS LE TIRAGE PAR UN CHOIX, on RETRECIT LE VIVIER : le
  // hachage reste le meme, la composition reste reproductible et l'anti-
  // repetition continue de jouer sur ce qui reste. Le retrecissement passe par
  // `exclu`, qui existe deja, qui prend une liste et qui NE SE REPLIE PAS —
  // contrairement a dejaVu, dont le repli est justement ce qu'on ne veut pas ici.
  //
  // QUAND LA REGLE PARLE : c'est le plafond de masse lui-meme qui le dit, ce
  // n'est pas un seuil de plus. Une assiette a qui on demande plus de kcal
  // qu'elle n'a le droit de peser de grammes vise plus d'une kcal par gramme.
  // En dessous, la regle se tait et le vivier reste entier — c'est le cas de
  // l'immense majorite des creneaux, a trois repas et au-dela.
  //
  // A QUELLE DENSITE : 140 kcal aux 100 g, et le chiffre est MESURE, pas choisi.
  // Il faut viser bien au-dessus de la moyenne demandee a l'assiette, parce que
  // les deux autres pieces tirent cette moyenne vers le bas et qu'on ne touche
  // ni a l'une ni a l'autre : la source de proteines pese 1,1 kcal/g, et le
  // legume, servi a volonte, 0,25 kcal/g pour 200 g de l'enveloppe. Le feculent
  // est le seul levier, il doit donc porter plus que sa part.
  // Balayage du couple (plafond, seuil) sur 96 profils x 28 journees, juge sur
  // la couverture calorique du banc M3 et sur le taux d'assiettes au kilo :
  //   950 / 120 -> M3 a 79 % (refuse), 0 % d'assiettes au kilo
  //   950 / 130 -> M3 a 84 % (refuse), 0 %
  //   950 / 140 -> M3 a 88 %, 0 %          <- retenu
  //   950 / 150 -> M3 a 86 %, 0 %
  //  1050 / 120 -> M3 a 85 %, mais 4,1 % d'assiettes au kilo : le plafond ne
  //                sert plus a rien des qu'on le desserre assez pour s'en passer.
  // Le seuil ecarte la pomme de terre (85), la patate douce (90), le mais (100),
  // la semoule et le quinoa (120), le riz (130) ; il garde les pates (150), le
  // taboule (145), le pain (250) et le wrap (300). Uniquement dans les assiettes
  // qui depassent le seuil de calories, et jamais ailleurs.
  // UN EN-CAS NE DOIT PAS DEFAIRE L'ALLEGEMENT QU'ON VIENT DE POSER.
  //
  // CE CONTROLE EST NE D'UNE MESURE, ET C'EST LA MEME QUE CELLE QUI A TUE
  // `slotGardeSaSource`. Premiere ecriture du vivier `encas` : amandes, noix de
  // cajou et abricots secs a egalite. Resultat mesure sur 8 profils x 70
  // journees — la pire journee passe de 2,729 a 2,896 g/kg, c'est-a-dire
  // AU-DESSUS de la borne de 2,75 que le banc A4 tient depuis trois passes, et
  // les depassements du plafond montent de 12,9 % a 15,7 % des journees.
  //
  // LA CAUSE, ET ELLE EST EXACTEMENT CELLE QU'ON CHERCHAIT A EVITER. Une
  // poignee d'amandes porte 21 g de proteines aux 100 g, une poignee de cajou
  // 18. Servie dans une collation ORDINAIRE, cette part est absorbee : la passe
  // 2 de nutriAjuster la compte dans protAcc et retaille la source d'autant.
  // Mais dans une collation ALLEGEE il n'y a plus de source a retailler, et ces
  // 6 g s'ajoutent en pur. Or un creneau n'est allege que lorsque la journee
  // depasse deja son plafond : on remettait donc des proteines precisement la
  // ou l'appli venait d'en retirer. C'est la meme erreur structurelle que
  // « exiger une source quand deux creneaux se suivent », en plus discret.
  //
  // LA REGLE, ET ELLE EST ETROITE : quand la prise n'a PAS de source proteinee,
  // l'en-cas ne peut pas en etre une deguisee. Ailleurs — l'immense majorite des
  // collations — le vivier reste entier et les trois en-cas tournent
  // normalement. On ne retire pas un aliment de l'appli, on l'ecarte d'un cas.
  //
  // 10 g AUX 100 g SEPARE LES DEUX GROUPES SANS LES DEPARTAGER DE JUSTESSE :
  // les abricots secs en portent 3, les amandes 21, les noix de cajou 18. Le
  // seuil tombe dans un trou de la table, il ne coupe pas un continuum.
  //
  // ON NE VIDE JAMAIS LE VIVIER — meme precaution que fecTropLegers, et pour la
  // meme raison : `exclu` ne se replie pas, c'est donc a l'appelant de ne pas
  // tout interdire. Si tout le rayon etait proteine, mieux vaut un en-cas
  // proteine qu'une prise vide.
  var ENCAS_PROT_MAX = 10;
  function encasTropProteines(motif, cook) {
    var out = [], cand = alimCandidats("encas", motif, cook), i;
    for (i = 0; i < cand.length; i++) {
      if (cand[i].prot100 >= ENCAS_PROT_MAX) out.push(cand[i].id);
    }
    return out.length < cand.length ? out : [];
  }

  var FEC_DENSE_MIN = 140;
  function fecTropLegers(motif, cook, kcalCible) {
    var out = [], cand, i;
    if (!(kcalCible > MASSE_MAX_PRISE)) return out;
    cand = alimCandidats("fec", motif, cook);
    for (i = 0; i < cand.length; i++) {
      if (cand[i].kcal100 < FEC_DENSE_MIN) out.push(cand[i].id);
    }
    // ON NE VIDE JAMAIS LE VIVIER. Si tout le rayon disponible est leger — un
    // profil sans cuisson dont le vivier se reduirait a rien —, mieux vaut une
    // assiette aqueuse qu'une assiette sans feculent. `exclu` ne se replie pas :
    // c'est a l'appelant de ne pas tout interdire, et c'est ce que fait ce test.
    return out.length < cand.length ? out : [];
  }

  // --- Repartition de la journee sur les creneaux ------------------------------
  // ⚠️ VIVANTE DEPUIS LA v1.14.0 : nutriCreneauxIA l'appelle pour savoir quels
  // creneaux le pont IA nutrition a le droit de remplir. Voir le commentaire de
  // NUTRI_SLOTS.
  function nutriSlotsFor(n) {
    var meals = n.meals || 3, out = [], extras = ["pre", "soir"], i = 0, ordre = [], j;
    if (n.breakfast) out.push("pdj");
    else if (meals >= 3) out.push("mat");
    out.push("dej"); out.push("din");
    // LA BOUCLE NE SAVAIT QU'AJOUTER. « 2 repas » + petit-dejeuner empilait
    // pdj, dej et din : TROIS prises pour deux demandees, et l'utilisateur
    // recevait un plan qui ne repondait pas a ce qu'il avait declare. On retire
    // donc aussi, et par le MILIEU : le petit-dejeuner a ete demande
    // explicitement, le diner ne se saute pas, c'est le dejeuner qu'on perd
    // dans la vraie vie. `meals` etant borne a [2, 5] par cleanProfile, ce
    // retrait ne joue que pour meals = 2 avec petit-dejeuner.
    while (out.length > meals && out.length > 2) out.splice(out.length - 2, 1);
    while (out.length < meals && i < extras.length) { out.push(extras[i]); i++; }
    if (n.snack) out.push("col");
    for (j = 0; j < NUTRI_SLOTS.length; j++) if (out.indexOf(NUTRI_SLOTS[j].k) >= 0) ordre.push(NUTRI_SLOTS[j].k);
    return ordre;
  }

  function nutriRepartir(t, slotKeys, fixe) {
    var restP = Math.max(0, t.prot - (fixe ? fixe.prot : 0));
    var restK = Math.max(0, t.kcal - (fixe ? fixe.kcal : 0));
    var sk = 0, sp = 0, i, s, parts = [], sumP = 0, sumK = 0, gros = 0, ecart;
    for (i = 0; i < slotKeys.length; i++) { s = SLOT_BY_K[slotKeys[i]]; sk += s.wk; sp += s.wp; }
    if (!sk || !sp) return parts;
    // LE PLAFOND PAR CRENEAU SUIT LE NOMBRE DE CRENEAUX. 55 g est juste pour une
    // journee a quatre ou cinq prises ; a DEUX creneaux et 160 g vises, il
    // condamne la journee a 110 g quoi qu'il arrive — et l'utilisateur qui coche
    // tout se faisait ensuite reprocher le manque. Deux repas a 80 g, c'est
    // exactement ce que « 160 g en deux repas » veut dire. Le plafond d'origine
    // reste la borne BASSE : a trois creneaux et plus, restP / n reste sous 55
    // et rien ne change.
    var plafond = Math.max(PROT_MAX_SLOT, Math.ceil(restP / slotKeys.length));
    for (i = 0; i < slotKeys.length; i++) {
      s = SLOT_BY_K[slotKeys[i]];
      parts.push({ k: s.k, kcal: Math.round(restK * s.wk / sk / 10) * 10,
                            prot: Math.round(restP * s.wp / sp / 5) * 5 });
    }
    for (i = 0; i < parts.length; i++) {
      if (parts[i].prot > plafond) parts[i].prot = plafond;
      if (parts[i].prot < PROT_MIN_SLOT) parts[i].prot = PROT_MIN_SLOT;
    }
    for (i = 0; i < parts.length; i++) {
      sumP += parts[i].prot; sumK += parts[i].kcal;
      if (parts[i].kcal > parts[gros].kcal) gros = i;
    }
    ecart = restP - sumP;
    if (ecart) parts[gros].prot = Math.max(PROT_MIN_SLOT, Math.min(plafond, parts[gros].prot + ecart));
    ecart = restK - sumK;
    if (ecart) parts[gros].kcal = Math.max(80, parts[gros].kcal + ecart);
    return parts;
  }

  // --- Composition d'une prise -------------------------------------------------
  // UNE PRISE LAITIERE GARDE SON LAITAGE, MEME ALLEGEE.
  //
  // « Avant le coucher » est declare `forme: "laitier"` et sert un vivier de
  // QUATRE laitages — c'est toute sa raison d'etre a 22h. Mais il figure aussi
  // dans SLOTS_ALLEGEABLES, et l'allegement etait binaire : `sans[slot]` retirait
  // la SOURCE, pas seulement sa cible. Le creneau tombait alors sur son seul
  // accompagnement, un fruit, et le coucher se lisait « 2 oranges (360 g) »,
  // 4 g de proteines — six fois sur quatorze chez un profil. Mesure avant
  // correction : 69 creneaux « soir » sur 140 servis sans le moindre laitage,
  // tous sous 8 g.
  //
  // CE QU'IL FALLAIT ALLEGER ETAIT LA CIBLE, PAS LA SOURCE. `sans` met deja
  // cible.prot a zero, et grPourProt sur une cible nulle rend la portion
  // MINIMALE servable, jamais rien : un pot, pas deux. Le creneau s'allege donc
  // pour de vrai — il perd ce qu'il portait au-dela d'une portion courante — et
  // garde le laitage qui lui donne son nom. Les calories, elles, n'ont jamais
  // ete touchees par `sans`, et l'accompagnement continue de les depenser.
  //
  // POURQUOI PAS LE RETIRER DE SLOTS_ALLEGEABLES, l'autre correctif possible :
  // slotDeStructure() est ecrit comme le COMPLEMENT de cette liste — voir son
  // commentaire, deux listes auraient diverge. L'en sortir aurait fait du
  // coucher un REPAS DE STRUCTURE aux yeux de la boucle 4, qui lui aurait
  // impose un plancher de proteines de repas. Un laitage du soir n'est ni un
  // appoint qu'on vide, ni un diner.
  //
  // La regle porte sur la FORME, pas sur la cle : un second creneau laitier
  // ajoute demain heriterait du bon comportement sans qu'on y pense.
  // `cible` n'est lue que pour SA CIBLE CALORIQUE, et seulement par la regle de
  // densite des feculents (fecTropLegers). Absente — un appelant qui ne l'a pas
  // sous la main —, la regle se tait et le vivier reste entier : c'est le
  // comportement d'avant, a l'identique.
  // ===========================================================================
  // LES REPERES PNNS DANS LE GENERATEUR DE REPAS
  // ---------------------------------------------------------------------------
  // CE SONT DES REGLES DE SANTE PUBLIQUE, ET ELLES ONT ETE RELUES A LA SOURCE
  // AVANT D'ETRE ECRITES ICI. Chaque chiffre de la table ci-dessous vient d'une
  // page de mangerbouger.fr — le site du Programme national nutrition sante,
  // edite par Sante publique France — consultee le 16 aout 2026. Aucun n'a ete
  // pose de memoire : c'etait la condition posee par le proprietaire, et elle
  // vaut pour toute modification future de cette table.
  //
  //   legumes secs .......... au moins 2 fois par semaine
  //     .../augmenter/augmenter-les-legumes-secs
  //   poisson ............... 2 fois par semaine, dont un poisson gras
  //     .../aller-vers/aller-vers-les-poissons-gras-et-maigres-en-alternance
  //   feculents complets .... au moins une fois par jour
  //     .../aller-vers/aller-vers-les-feculents-complets
  //   fruits a coque ........ une petite poignee par jour, non sales
  //     .../augmenter/augmenter-les-fruits-a-coque-non-sales-noix-noisettes-amandes-etc
  //   viande hors volaille .. 500 g par semaine au maximum ; privilegier la volaille
  //     .../reduire/reduire-la-viande-porc-baeuf-veau-mouton-agneau-abats
  //   charcuterie ........... 150 g par semaine au maximum, soit environ 3 tranches
  //     .../reduire/reduire-la-charcuterie
  //   fruits et legumes ..... au moins 5 par jour, une portion valant 80 a 100 g
  //     .../augmenter/augmenter-les-fruits-et-legumes
  //
  // CE QUI EST REPRIS ET CE QUI NE L'EST PAS. On reprend les SEUILS — des
  // frequences et des grammages, c'est-a-dire des faits — et on les reecrit dans
  // les mots de l'appli. On ne reprend NI les textes NI les recettes du site :
  // c'est son contenu editorial, meme regle que pour les planches du guide
  // Delavier. Et la Fabrique a menus reste ecartee : l'appli est statique, sans
  // serveur, sa CSP `connect-src` est close, et le site n'expose pas d'API.
  //
  // COMMENT UN REPERE HEBDOMADAIRE ENTRE DANS UN GENERATEUR QUOTIDIEN. nutriJour
  // est DETERMINISTE par date : la meme date et le meme profil rendent la meme
  // journee, et rouvrir hier redonne ce qu'on y avait lu. On peut donc etaler un
  // repere sur la semaine sans stocker le moindre historique — c'est le meme
  // mecanisme que la rotation d'alimPick, qui fait deja avancer le tirage d'un
  // cran par jour.
  //
  // ON NE TIRE PAS AU SORT PUIS ON NE CORRIGE PAS : ON RETRECIT LE VIVIER, comme
  // fecTropLegers et encasTropProteines. Le hachage reste le meme, la
  // composition reste reproductible, l'anti-repetition continue de jouer sur ce
  // qui reste. Et comme `exclu` NE SE REPLIE PAS, chaque regle verifie qu'elle
  // ne vide pas le vivier avant de mordre — sinon elle se tait. Un profil qui ne
  // cuisine pas perd le saumon et les lentilles, qui demandent une cuisson : il
  // lui reste les sardines et le saumon fume pour le poisson gras, les pois
  // chiches et les haricots pour les legumes secs. Le jour ou il ne resterait
  // rien, la regle s'efface au lieu de rendre une assiette vide.
  // ===========================================================================

  // LES FAMILLES, EN IDENTIFIANTS. Meme choix que NUTRI_POOL, et pour la meme
  // raison : la table ALIMENTS decrit des aliments, pas des categories
  // reglementaires. Une entree renommee disparait proprement de ces listes au
  // lieu de casser la composition.
  var PNNS_LEGSEC   = ["lentilles", "poischiche", "harirouges", "hariblancs"];
  var PNNS_POISSON  = ["saumon", "cabillaud", "thon", "sardines", "saumonfume"];
  // Poisson GRAS au sens du repere : les especes riches en omega 3. Le drapeau
  // `gras` de la table dit exactement ca et il est deja pose sur les trois.
  var PNNS_POIS_GRAS = ["saumon", "sardines", "saumonfume"];
  // Viande HORS VOLAILLE. Le poulet, la dinde et les tranches de dinde n'y sont
  // pas : ce sont eux que le repere invite au contraire a privilegier.
  var PNNS_VIANDE   = ["boeuf", "porc"];
  var PNNS_CHARCUT  = ["jambon"];
  // Feculents COMPLETS. Le pain de la table est deja « pain complet » ; le riz,
  // les pates et la semoule sont passes a leur forme complete dans cette version,
  // parce que le repere porte precisement sur ces trois-la. Les autres feculents
  // ne sont pas concernes : une pomme de terre n'a pas de version complete.
  var PNNS_FEC_COMPLET = ["pain", "riz", "pates", "semoule"];
  // Fruits a COQUE. Le repere nomme les noix, noisettes, amandes et pistaches ;
  // l'appli sert des amandes et des noix de cajou. Les abricots secs sont un
  // fruit sec, pas un fruit a coque : ils restent au vivier mais ne comptent pas.
  var PNNS_COQUE    = ["amandes", "cajou"];

  // --- LE CALENDRIER DE LA SEMAINE --------------------------------------------
  // 0 vaut LUNDI. jourNumero est un compte de jours julien, dont le modulo 7
  // vaut 6 un lundi : le decalage de un remet la semaine a l'endroit. Verifie
  // sur huit dates consecutives autour du 16 aout 2026.
  //
  // POURQUOI DES JOURS FIXES ET NON UN COMPTE. Un compteur demanderait de savoir
  // ce qui a ete servi les jours precedents, donc de garder un historique — et
  // l'historique du plan nutrition est deja le point le plus delicat de l'appli
  // (les cases cochees sont indexees par POSITION). Un calendrier fixe rend le
  // meme service, se lit d'un coup d'oeil, et se verifie par un banc qui compte
  // les services sur sept jours au lieu de croire un compteur.
  //
  // POURQUOI UN CRENEAU PAR REGLE ET NON LA JOURNEE. Une regle posee sur la
  // journee entiere s'appliquerait au dejeuner ET au diner : deux services de
  // viande le meme jour, c'est jusqu'a 520 g pour un plafond hebdomadaire de
  // 500. Le creneau est l'unite qui permet de compter.
  function pnnsJour(dateKey) {
    return (jourNumero(dateKey) + 1) % 7;
  }

  // Les creneaux ou un repere IMPOSE une famille. Le vivier y est reduit a cette
  // famille, et a rien d'autre.
  //   lundi    dejeuner  legumes secs   |  jeudi     diner     legumes secs
  //   mardi    diner     poisson gras   |  vendredi  dejeuner  poisson
  // Deux services de legumes secs et deux de poisson dont un gras : les deux
  // reperes sont tenus a l'exact, sans en faire plus que ce qu'ils demandent.
  var PNNS_IMPOSE = [
    { j: 0, slot: "dej", garder: PNNS_LEGSEC,    quoi: "legsec" },
    { j: 3, slot: "din", garder: PNNS_LEGSEC,    quoi: "legsec" },
    { j: 1, slot: "din", garder: PNNS_POIS_GRAS, quoi: "poisgras" },
    { j: 4, slot: "dej", garder: PNNS_POISSON,   quoi: "poisson" }
  ];

  // Les creneaux ou une famille PLAFONNEE est autorisee. Partout ailleurs elle
  // est retiree du vivier. Deux services de viande hors volaille par semaine, un
  // seul de charcuterie : voir le banc, qui MESURE les grammes servis plutot que
  // de compter les autorisations.
  var PNNS_FENETRE = [
    { fam: PNNS_VIANDE,  j: 2, slot: "din" },
    { fam: PNNS_VIANDE,  j: 5, slot: "dej" },
    { fam: PNNS_CHARCUT, j: 6, slot: "dej" }
  ];

  // LE FECULENT COMPLET, TOUS LES JOURS. Il s'accroche a un repas de structure,
  // et il ALTERNE entre le dejeuner et le diner : le poser toujours au meme
  // repas aurait reduit ce repas-la a quatre feculents pour toute la vie du
  // profil, alors que l'autre en garde dix. Quand un seul des deux repas existe
  // — deux prises par jour —, c'est celui-la qui le porte.
  //
  // ET IL EVITE LE REPAS QUI PORTE DEJA UN REPERE, PARCE QUE LES DEUX SE SONT
  // MARCHE DESSUS. Mesure de la premiere ecriture, le jeudi : le diner portait
  // l'imposition « legumes secs » ET le feculent complet, et il est sorti
  // « 450 g de haricots rouges egouttes + 200 g de brocolis » — SANS AUCUN
  // feculent. La cause est le plafond de masse : une legumineuse est peu dense,
  // le generateur en sert beaucoup, et il ne restait plus de grammes pour le
  // feculent. Deux reperes dans la meme assiette en annulent un.
  //
  // Il n'y a rien a arbitrer : l'autre repas de la journee est libre, et le
  // repere « au moins une fois par jour » ne dit pas dans quel repas.
  function pnnsSlotImpose(ctx) {
    var j = pnnsJour(ctx.dateKey), i;
    for (i = 0; i < PNNS_IMPOSE.length; i++) {
      if (PNNS_IMPOSE[i].j === j) return PNNS_IMPOSE[i].slot;
    }
    return null;
  }
  function pnnsSlotComplet(ctx) {
    var slots = (ctx && isArray(ctx.slots)) ? ctx.slots : [];
    var aDej = slots.indexOf("dej") >= 0, aDin = slots.indexOf("din") >= 0;
    if (aDej && aDin) {
      var pris = pnnsSlotImpose(ctx);
      if (pris === "dej") return "din";
      if (pris === "din") return "dej";
      return (pnnsJour(ctx.dateKey) % 2 === 0) ? "dej" : "din";
    }
    if (aDej) return "dej";
    if (aDin) return "din";
    return null;
  }

  // LES FRUITS A COQUE : LE SEUL REPERE QUE CE GENERATEUR NE TIENT PAS, ET LE
  // CHIFFRE EXACT EST ECRIT DANS LA CARTE.
  //
  // Le repere dit « une petite poignee par jour ». Cinq jours sur sept sont
  // marques jours a coque — le vivier de l'en-cas y est reduit aux amandes et
  // aux noix de cajou —, mais la MESURE dit deux a trois services par semaine.
  // La cause n'est ni le vivier ni l'ordre : c'est le BUDGET de la collation.
  // Trois jours sur sept, sa source est une barre proteinee a 60 g, qui prend
  // toute la prise — l'appli ecrit alors « seul aliment de la prise », ce qui
  // est vrai.
  //
  // CE QU'ON A REFUSE DE FAIRE POUR GAGNER TROIS SERVICES : ecarter la barre
  // proteinee du vivier de collation les jours a coque. Ca aurait marche, et ca
  // aurait DEFAIT un correctif delibere de la v1.9.0 — les barres proteinees
  // n'etaient servies nulle part, et c'est la collation qui les bloquait. On ne
  // reprend pas d'une main ce qu'on a corrige de l'autre pour faire monter un
  // chiffre, surtout quand le repere decrit une habitude quotidienne et non un
  // seuil sanitaire comme les 500 g de viande.
  //
  // Les deux jours restants gardent le vivier entier : les abricots secs ne
  // disparaissent pas de l'appli pour autant.
  var PNNS_COQUE_REPOS = [2, 5];
  function pnnsJourCoque(ctx) {
    return !!(ctx && ctx.dateKey && PNNS_COQUE_REPOS.indexOf(pnnsJour(ctx.dateKey)) < 0);
  }

  // RETRECIR LE VIVIER NE SUFFISAIT PAS, ET LA MESURE L'A DIT. Premiere
  // ecriture : l'en-cas etait bien restreint aux fruits a coque cinq jours sur
  // sept, et il n'etait servi AUCUN de ces jours. Sur sept collations, six
  // sortaient « 1 barre proteinee, seul aliment » ou « 2 oeufs durs + 1 pomme ».
  // La cause n'est pas le vivier mais l'ORDRE : l'en-cas est le dernier servi de
  // la collation, et le budget calorique etait deja parti dans la source et le
  // fruit. Un repere restreint a un tirage qui n'aboutit pas est un repere
  // decoratif — exactement ce que ce projet refuse.
  //
  // ON REUTILISE LE MECANISME QUI EXISTE DEJA. `encasDabord` a ete ecrit en
  // v1.9.0 pour la meme forme de probleme — deux prises de fruit nu qui se
  // suivent —, et il fait exactement ce qu'il faut : il sert l'accompagnement
  // SEC avant le fruit, sans toucher a la cible calorique de la prise ni
  // imposer un gramme de proteines de plus. Le fruit se contente de ce qui
  // reste, comme il le fait deja dans l'autre cas.

  // --- LA REGLE, EN UN SEUL POINT D'ENTREE -------------------------------------
  // Rend la liste des identifiants a RETIRER du vivier pour ce role, ce creneau
  // et cette date. Elle se concatene a ce que choisirPourSlot excluait deja.
  //
  // `second` distingue la SOURCE de la SECONDE source d'une assiette. Les
  // reperes qui IMPOSENT une famille ne portent que sur la source : la seconde
  // n'est servie que lorsque la premiere ne peut pas atteindre la cible du
  // creneau, et lui imposer la meme famille reviendrait a servir deux fois des
  // lentilles. Les PLAFONDS, eux, portent sur les deux : c'est le grammage
  // hebdomadaire qu'ils tiennent, et il compte les deux pieces.
  function pnnsExclu(role, motif, slotK, ctx, second) {
    var out = [], dispo, j, i, k, id;
    if (!ctx || !ctx.dateKey) return out;

    if (role === "encas") {
      if (!pnnsJourCoque(ctx)) return out;
      return pnnsGarder(alimCandidats("encas", motif, ctx.cook), PNNS_COQUE);
    }

    if (role === "fec" && motif === "repas") {
      if (slotK !== pnnsSlotComplet(ctx)) return out;
      return pnnsGarder(alimCandidats("fec", "repas", ctx.cook), PNNS_FEC_COMPLET);
    }

    if (role !== "prot" || motif !== "repas") return out;

    j = pnnsJour(ctx.dateKey);
    dispo = alimCandidats("prot", "repas", ctx.cook);

    if (!second) {
      for (i = 0; i < PNNS_IMPOSE.length; i++) {
        if (PNNS_IMPOSE[i].j !== j || PNNS_IMPOSE[i].slot !== slotK) continue;
        // Une regle qui impose REMPLACE les plafonds : la famille imposee ne
        // contient ni viande ni charcuterie, il n'y a donc rien a plafonner en
        // plus, et cumuler les deux listes ne ferait que risquer de vider le
        // vivier pour rien.
        return pnnsGarder(dispo, PNNS_IMPOSE[i].garder);
      }
    }

    // Les plafonds. Une famille est retiree sauf si le couple (jour, creneau)
    // est dans sa fenetre.
    for (i = 0; i < PNNS_FENETRE.length; i++) {
      if (PNNS_FENETRE[i].j === j && PNNS_FENETRE[i].slot === slotK) continue;
      for (k = 0; k < PNNS_FENETRE[i].fam.length; k++) {
        id = PNNS_FENETRE[i].fam[k];
        if (out.indexOf(id) < 0) out.push(id);
      }
    }
    // Une fenetre ouverte ce jour-la rend sa famille, meme si une autre entree
    // de la table l'avait retiree : la boucle ci-dessus voit trois lignes, et
    // deux d'entre elles concernent la meme famille.
    for (i = 0; i < PNNS_FENETRE.length; i++) {
      if (PNNS_FENETRE[i].j !== j || PNNS_FENETRE[i].slot !== slotK) continue;
      for (k = 0; k < PNNS_FENETRE[i].fam.length; k++) {
        var p = out.indexOf(PNNS_FENETRE[i].fam[k]);
        if (p >= 0) out.splice(p, 1);
      }
    }
    return pnnsSurNonVide(dispo, out);
  }

  // Traduit « ne garder que ceux-ci » en « retirer tous les autres », qui est le
  // seul langage que comprend `exclu`. Rend une liste VIDE — donc aucune
  // restriction — si le vivier disponible n'en contient aucun : mieux vaut une
  // assiette qui ne tient pas le repere qu'une assiette qui n'existe pas.
  function pnnsGarder(dispo, gardes) {
    var out = [], reste = 0, i;
    for (i = 0; i < dispo.length; i++) {
      if (gardes.indexOf(dispo[i].id) >= 0) reste++;
    }
    if (!reste) return [];
    for (i = 0; i < dispo.length; i++) {
      if (gardes.indexOf(dispo[i].id) < 0) out.push(dispo[i].id);
    }
    return out;
  }

  // Meme precaution, dans l'autre sens : une liste d'exclusions qui emporterait
  // tout le vivier est abandonnee en bloc.
  function pnnsSurNonVide(dispo, exclus) {
    var reste = 0, i;
    for (i = 0; i < dispo.length; i++) {
      if (exclus.indexOf(dispo[i].id) < 0) reste++;
    }
    return reste ? exclus : [];
  }

  // --- CE QUE L'ECRAN EN DISAIT, ET QUI EST SORTI EN v1.18.0 -------------------
  // Une table de six lignes et la fonction qui les rendait affichaient ici la carte
  // « les reperes de la semaine » : six reperes du Programme national nutrition
  // sante, relus a la source sur mangerbouger.fr le 16 aout 2026. Olivier les a
  // fait retirer — la carte s'ouvrait sur une phrase qui disait l'appli incapable
  // de composer des repas, et ce ton lui deplaisait sur l'ecran qu'il regarde tous
  // les jours.
  //
  // ⚠️ LEURS NOMS NE SONT PAS ECRITS ICI, et ce n'est pas une coquetterie : le
  // garde-fou de fin de chaine refuse le build s'ils subsistent, y compris dans un
  // commentaire. Il a mordu la — la deuxieme fois dans la meme journee, apres le
  // meme refus sur le champ d'etat retire en v1.17.0. La raison survit au nom.
  //
  // ⚠️ LES SEUILS EUX-MEMES NE SONT PAS PERDUS : les constantes de seuil et les
  // fonctions de retrecissement du vivier restent plus bas dans le fichier. Elles
  // ne sont plus lues par personne depuis la reduction de la v1.13.0, et ce menage
  // est reste mecanique — meme arbitrage que pour le generateur.
  //
  // Ce qui est perdu, et il faut le savoir : plus rien a l'ecran ne rappelle les
  // reperes de sante publique. C'est une decision du proprietaire, pas un oubli.


  function choisirPourSlot(s, ctx, slotK, cible) {
    var c = {}, kCible = (cible && cible.kcal > 0) ? cible.kcal : 0;
    // La SOURCE d'une collation reçoit la meme memoire longue que son fruit :
    // « 3 oeufs durs (165 g), seul aliment de la prise » six fois en quatorze
    // jours, c'est elle qu'on relisait, pas l'accompagnement. Voir COL_TOURNE.
    if (!(ctx.sans && ctx.sans[slotK]) || slotGardeSaSource(slotK)) {
      c.prot = alimPick("prot", s.motif, ctx, slotK,
                        pnnsExclu("prot", s.motif, slotK, ctx, false),
                        s.forme === "collation" ? COL_TOURNE : false);
    }
    if (s.forme === "assiette") {
      // UNE SECONDE SOURCE DE PROTEINES, tiree comme le second feculent :
      // toujours, servie rarement. Voir nutriAjuster — elle ne se pose que si la
      // premiere ne peut pas atteindre la cible du creneau. Tirer ici garde la
      // composition reproductible, exactement pour la raison dite plus bas.
      // La FAMILLE de la premiere source est ecartee, pas seulement son
      // identifiant : deux legumineuses en conserve dans la meme assiette, ce
      // sont deux fois la meme chose et 750 g de bocal. Voir PROT_FAM.
      // LA SECONDE SOURCE NE RECOIT QUE LES PLAFONDS, pas les reperes qui
      // imposent une famille : elle ne sert qu'a combler une cible que la
      // premiere n'atteint pas, et lui imposer les lentilles reviendrait a en
      // servir deux fois. Voir pnnsExclu, parametre `second`.
      if (c.prot) c.prot2 = alimPick("prot", s.motif, ctx, slotK + "p2",
                                     protMemeFamille(c.prot.id).concat(
                                       pnnsExclu("prot", s.motif, slotK, ctx, true)));
      c.leg = alimPick("leg", "repas", ctx, slotK);
      // Le vivier des feculents se retrecit aux DENSES quand l'assiette doit
      // porter plus de kcal qu'elle n'a le droit de peser de grammes. Voir
      // fecTropLegers : en dessous du seuil, `legers` est vide et rien ne change.
      var legers = fecTropLegers("repas", ctx.cook, kCible);
      // LE PLAFOND DE MASSE L'EMPORTE SUR LE REPERE, ET LA MESURE L'A IMPOSE.
      // Les deux interdictions se recouvrent : `legers` ecarte le riz, la
      // semoule, le quinoa, la pomme de terre ; le repere du feculent complet ne
      // garde que le pain, le riz, les pates et la semoule. Les cumuler sur une
      // assiette dense laisse DEUX candidats — le pain, plafonne a 160 g, et les
      // pates —, et l'assiette n'atteint plus sa cible.
      // Mesure sur le profil le plus dur de l'appli (deux creneaux, homme de
      // 90 kg), couverture calorique moyenne de la semaine : 79 % en cumulant
      // les deux, 75 % apres le correctif du feculent complet, 79 % en laissant
      // la densite trancher. Le repere est une habitude quotidienne ; le plafond
      // de masse est une contrainte physique de l'assiette. La contrainte gagne,
      // et elle ne gagne QUE la ou elle mord : `legers` est vide dans l'immense
      // majorite des creneaux, a trois repas et au-dela.
      c.fec = alimPick("fec", "repas", ctx, slotK,
                       legers.length ? legers
                                     : pnnsExclu("fec", "repas", slotK, ctx, false));
      c.gras = alimPick("gras", "repas", ctx, slotK + "g");
      // Le second feculent est TOUJOURS tire, jamais toujours servi :
      // nutriAjuster ne le pose que s'il reste une vraie portion a combler.
      // Le tirer ici garde la composition reproductible — un tirage
      // conditionnel decalerait la graine et changerait le reste de l'assiette
      // selon la cible.
      // La FAMILLE du premier feculent est ecartee, pas seulement son
      // identifiant : « pain + wrap » dans la meme assiette, ce sont deux pains.
      // Le second feculent subit les DEUX interdictions : la famille du premier
      // et, si l'assiette est calorique, les trop legers. Deux listes qui se
      // concatenent, `exclu` sachant deja en prendre une.
      c.fec2 = alimPick("fec", "repas", ctx, slotK + "2",
                        (c.fec ? fecMemeFamille(c.fec.id) : []).concat(legers));
    } else if (s.forme === "pdj") {
      // La boisson se tire comme les autres composants, avec sa propre graine :
      // elle tourne d'un jour a l'autre sans decaler le reste de l'assiette.
      c.boisson = alimPick("boisson", "pdj", ctx, slotK + "b");
      c.fec = alimPick("fec", "pdj", ctx, slotK);
      c.fruit = alimPick("fruit", "tout", ctx, slotK + "f");
      // LA OU LA CACAHUETE A SA PLACE. Elle est sortie du vivier sale par
      // GRAS_ACCORD ; l'y laisser sans lui rendre un creneau reviendrait a la
      // retirer de l'appli, alors qu'une cuillere sur une tartine ou une banane
      // est exactement ce qu'on en fait. Le beurre suit le meme chemin, et sa
      // regle « exige un feculent » vaut aussi ici : sur du pain, pas sur un kiwi.
      c.gras = alimPick("gras", s.motif, ctx, slotK + "g");
    } else if (s.forme === "collation") {
      // MEMOIRE LONGUE ICI, ET SEULEMENT ICI. La collation sert une ou deux
      // pieces : la piece EST la prise, et la repetition s'y voit comme nulle
      // part ailleurs. Voir COL_TOURNE.
      c.fruit = alimPick("fruit", "tout", ctx, slotK + "f", null, COL_TOURNE);
      // Sans source posee, l'en-cas ne peut pas en etre une deguisee : voir
      // encasTropProteines. Avec source, le vivier reste entier.
      c.encas = alimPick("encas", s.motif, ctx, slotK + "e",
                         (c.prot ? [] : encasTropProteines(s.motif, ctx.cook))
                           .concat(pnnsExclu("encas", s.motif, slotK, ctx, false)), COL_TOURNE);
      c.gras = alimPick("gras", s.motif, ctx, slotK + "g", null, COL_TOURNE);
    } else if (s.forme === "legere") {
      c.fec = alimPick("fec", "pdj", ctx, slotK);
      c.fruit = alimPick("fruit", "tout", ctx, slotK + "f");
      c.encas = alimPick("encas", s.motif, ctx, slotK + "e",
                         (c.prot ? [] : encasTropProteines(s.motif, ctx.cook))
                           .concat(pnnsExclu("encas", s.motif, slotK, ctx, false)), COL_TOURNE);
    } else if (s.forme === "laitier") {
      c.fruit = alimPick("fruit", "tout", ctx, slotK + "f");
    }
    // DEUX PRISES DE FRUIT NU QUI SE SUIVENT : ON CHANGE L'ORDRE, PAS LA CIBLE.
    //
    // C'est le second releve du proprietaire — « 2 oranges » a 16h puis « 1
    // banane » a 17h30 — et c'est exactement la plainte qu'une passe precedente
    // avait tente de traiter par `slotGardeSaSource`, en EXIGEANT une source
    // proteinee sur l'un des deux creneaux. Cette regle-la a ete mesuree et
    // retiree : elle faisait passer 45,4 % des journees au-dessus du plafond de
    // 2,2 g/kg et rendait 59 repas de structure sous 15 g. Son commentaire, une
    // centaine de lignes plus haut, explique pourquoi la cause etait
    // structurelle et non reglable — « col » est le DERNIER de
    // SLOTS_ALLEGEABLES, donc les deux creneaux ne sont vides ensemble que dans
    // les journees ou il n'y a deja plus rien a rendre.
    //
    // ON NE REFAIT DONC PAS CA. La regle ecrite ici ne demande AUCUNE proteine
    // supplementaire et ne touche a AUCUNE cible : elle change seulement
    // L'ORDRE dans lequel la prise se compose. Quand la prise d'appoint
    // precedente etait du fruit nu, l'accompagnement sec passe devant le fruit,
    // et le fruit se contente de ce qui reste. La prise cesse d'etre « un fruit
    // et rien d'autre » sans qu'un seul gramme de proteines ait ete impose, et
    // le budget calorique du creneau est rigoureusement le meme qu'avant.
    //
    // `encasDabord` est pose sur la COMPOSITION et non lu depuis ctx dans
    // nutriAjuster : celle-ci ne recoit pas le contexte, et le lui passer pour
    // un seul booleen aurait ouvert la porte a tout le reste du contexte.
    // Les jours de fruits a coque, l'en-cas passe devant le fruit — sinon il ne
    // reste plus de budget quand vient son tour, et le repere ne serait servi
    // aucun jour. Meme mecanisme, meme absence d'effet sur la cible.
    c.encasDabord = !!(ctx && (ctx.fruitNuPrec || pnnsJourCoque(ctx)));
    return c;
  }

  // Une prise ENTIEREMENT composee de fruit. C'est ce que la regle ci-dessus
  // surveille d'une prise a l'autre, et c'est lu sur les pieces REELLEMENT
  // servies : une prise dont le fruit a ete tire mais pas pose n'en est pas une.
  // Une prise vide n'en est pas une non plus — sinon deux creneaux sans rien a
  // servir se declencheraient l'un l'autre.
  function priseEstFruitNu(r) {
    var i;
    if (!r || !r.pieces || !r.pieces.length) return false;
    for (i = 0; i < r.pieces.length; i++) {
      if (r.pieces[i].a.cat !== "fruit") return false;
    }
    return true;
  }

  // Ajustement en DEUX passes. Passe 1 : la source de proteines est calee sur la
  // cible moins une reserve forfaitaire d'accompagnement, les accompagnements
  // sont cales sur les calories qui restent. Passe 2 : on connait maintenant les
  // proteines REELLES de l'accompagnement, on recale la source dessus, et on
  // recale les accompagnements sur les calories que la nouvelle source laisse.
  // Deux passes suffisent : la source ne pese quasi rien en calories du feculent.
  function nutriAjuster(c, cible, s) {
    var res = null, passe, amp = cible.amp > 1 ? cible.amp : 1;
    for (passe = 0; passe < 2; passe++) {
      var pieces = [], prot = 0, kcal = 0, reste, protAcc = 0;
      // Ce que la prise pese DEJA, en grammes annonces. C'est la somme que
      // l'utilisateur lit dans la ligne, donc la seule qui compte : voir
      // MASSE_MAX_PRISE et grBornerMasse. Elle se remet a zero a chaque passe,
      // comme `prot` et `kcal` — la passe 2 recompose l'assiette entiere.

      // Sous-total des seules pieces `cat:"prot"`. Voir grBornerMasseProt.

      // Poser une piece : elle passe par le plafond de MASSE, puis compte pour
      // tout le monde. Un seul chemin — les `pieces.push` etaient disperses sur
      // huit branches, et un plafond qu'on oublie sur une branche est un plafond
      // qui n'existe pas.
      // `acc` dit si la piece est un ACCOMPAGNEMENT, c'est-a-dire si ses
      // proteines comptent dans protAcc : la source et la seconde source n'en
      // sont pas, voir le commentaire de PROT_SOURCE2_MIN.
      // Une EXPRESSION de fonction, pas une declaration : une declaration dans
      // un bloc n'est pas de l'ES5 valide en mode strict, et test_es5 la refuse
      // a juste titre. Elle est recreee a chaque passe, ce qui est exactement ce
      // qu'on veut — elle ferme sur les compteurs de la passe en cours.

        // plafonds. Vers le bas : remonter annulerait le plafond de masse.

      };
      // Ce qui est DEJA dans la prise, role par role. GRAS_ACCORD s'interroge
      // dessus, pas sur ce qui a ete tire : un feculent tire mais pas servi ne
      // justifie pas une noisette de beurre.
      // `fruit` est une CHAINE — l'identifiant du fruit servi — la ou les trois
      // autres sont des booleens. Voir grasVaAvecPrise : le beurre de cacahuete

      // jetee elle aussi : elle bornait la source sur protMax directement, et
      // ne coupait rien. Le releve le disait — au petit-dejeuner de Marie, la
      // source apporte 18 g et la prise en sert 26 : les 8 g d'ecart viennent
      // du bol de flocons. Un plafond de 22 g compare a 18 ne coupe rien, et le
      // creneau sort quand meme a 26.
      //
      // L'accompagnement n'est pas negociable — c'est lui qui porte les
      // calories, et le plafond ne touche pas aux calories. Ce qui reste sous
      // le plafond une fois l'accompagnement paye est donc ce que la SOURCE a
      // le droit d'apporter. On ne le sait qu'a la passe 2, quand protAcc est
      // mesure : a la passe 1 on borne sur le plafond plein, ce qui suffit a
      // amorcer, et la passe 2 corrige.
      var capSource = 0;
      if (cible.protMax > 0) {
        capSource = passe === 0 ? cible.protMax : cible.protMax - res.protAcc;

        // disparaitre la source : grBornerProt la ramene a GR_MIN_SERVI et le
        // depassement residuel se voit, ce qui vaut mieux qu'une assiette sans
        // proteines.
        if (capSource < 1) capSource = 1;
      }
      if (c.prot) {
        // Sans plafond pose, grBornerProt rend le grammage inchange : les
        // journees qui tenaient deja ne bougent pas d'un gramme.
        // Le PLANCHER n'est pose que sur les repas de structure : dans un
        // creneau d'appoint, une petite source est exactement ce qu'on veut, et
        // GR_MIN_SERVI continue d'y regner comme avant. Voir grPlancherStruct.
        var gp = grBornerProt(c.prot, grPourProt(c.prot, viseSource, amp), capSource,
                              slotDeStructure(cible.k) ? grPlancherStruct(c.prot) : 0);
        // UNE COLLATION SERT UNE PORTION DE SA SOURCE. Le fruit et l'en-cas y
        // sont deja bornes ; la source ne l'etait pas, d'ou « 2 barres
        // protéinées (120 g), seul aliment de la prise ». Sur un repas de
        // structure, rien ne change : la borne ne vaut que pour la collation.
        if (s.forme === "collation") gp = grPorAppoint(c.prot, gp);
        // La SOURCE passe la premiere, donc sur une assiette vide : le plafond de
        // masse ne peut pas la rogner, et c'est voulu. Elle est la raison d'etre
        // du repas ; ce qui doit ceder, ce sont les accompagnements.

      // bornee a trois unites servables (alimPorMax) : quatre tranches de
      // saumon fume portent 26 g, et quand le creneau en vise 57 il en manque
      // 30. Jusqu'ici c'est l'ACCOMPAGNEMENT qui comblait — le pain apporte
      // 9 g de proteines aux 100 g, et l'assiette finissait a 340 g de farine.
      // Le geste juste, dans une vraie assiette froide, est d'ajouter du thon
      // a coté du jambon, pas une troisieme tranche de pain.
      //
      // Elle ne compte PAS dans protAcc : c'est une source, pas une garniture.
      // L'y mettre ferait retomber viseSource a la passe 2, qui reduirait la
      // premiere source d'autant — les deux se contrediraient a chaque tour.
      // La seconde source ne s'ajoute pas SOUS plafond : le geste qu'elle sert —
      // ajouter du thon a cote du jambon pour atteindre la cible — n'a aucun
      // sens dans un creneau dont on est justement en train de faire redescendre
      // les proteines.

        poser(c.prot2, grPourProt(c.prot2, viseSource - prot, amp), false);
      }

        if (poser(c.leg, grPourProt(c.leg, 0, amp), true)) pose.leg = true;
      }

      if (s.forme === "assiette") {
        reste = cible.kcal - kcal - reserveGras(c, cible.kcal - kcal, 40);
        if (c.fec && reste > 40) {

          // depasse le plafond n'est pas depense. L'aveu « à resservir selon la
          // faim » existe deja pour le dire.
          if (poser(c.fec, grPlafondPortion(c.fec, grPourKcal(c.fec, reste, amp)), true)) pose.fec = true;
        }
        if (c.gras && grasVaAvecPrise(c.gras, pose) && !priseDejaGrasse(pieces) &&
            cible.kcal - kcal >= 60) {
          poser(c.gras, grPourKcal(c.gras, cible.kcal - kcal, amp), true);
        }
        // UN ACCOMPAGNEMENT DE PLUS. Quand tous les composants sont deja a leur
        // maximum et qu'il manque encore de quoi manger, un second feculent
        // vaut mieux qu'un aveu : c'est ce qu'on ferait dans une vraie assiette.
        // Il n'arrive QUE s'il reste de la place pour une vraie portion, sinon
        // on ecrirait une ligne de plus pour 40 kcal.
        // Une assiette DEJA GRASSE ne rattrape pas ses calories avec un second
        // feculent. Sans ce garde, supprimer l'huile des sardines rendait ses
        // calories a du pain — donc des proteines en plus, et 8 journees de
        // plus au-dessus du plafond de 2,2 g/kg. Mesure : 14 journees avec, 6
        // sans, sur les 4 032 du balayage.
        // UN SEUL FECULENT PAR ASSIETTE. Le second est toujours TIRE — le retirer
        // decalerait la graine et changerait tout le reste de la composition —
        // mais il n'est plus SERVI. « 4 tranches de pain complet + 200 g de
        // taboulé » etait le cas type des 7 assiettes sur 288 concernees.
        if (false && c.fec2 && !priseDejaGrasse(pieces) && cible.kcal - kcal >= 150) {
          poser(c.fec2, grPourKcal(c.fec2, cible.kcal - kcal, amp), true);
        }
      } else if (s.forme === "pdj") {
        // LA RESERVE TIENT JUSQU'AU GRAS. Premiere ecriture : elle n'etait
        // retiree que du budget du FECULENT, et le fruit, dimensionne juste
        // apres sur « tout ce qui reste », la reprenait aussitot. Resultat
        // mesure : la cuillere de beurre de cacahuete ne sortait plus JAMAIS —
        // ni au petit-dejeuner ni en collation —, l'aliment avait simplement
        // disparu de l'appli. On garde donc `budget` sous le plafond pendant
        // TOUTE la composition de l'accompagnement, et on ne le relache qu'a la
        // ligne du gras.
        // LA BOISSON D'ABORD, A SA PORTION COURANTE. Elle ne se dimensionne pas
        // sur la cible — un cafe ne s'agrandit pas parce qu'il reste des
        // calories, et un jus qui mangerait le budget des flocons serait un
        // petit-dejeuner liquide. Ses calories comptent, elles, comme tout le
        // reste : c'est ce qui empeche le verre de jus d'etre gratuit.
        if (c.boisson) poser(c.boisson, c.boisson.nPor * c.boisson.gPor, true);
        var resG = reserveGras(c, cible.kcal - kcal, 45);
        var budget = cible.kcal - resG;
        reste = budget - kcal;
        if (c.fec && reste > 40) {
          if (poser(c.fec, grPlafondPortion(c.fec, grPourKcal(c.fec, reste, amp)), true)) pose.fec = true;
        }
        if (c.fruit && budget - kcal >= 45) {
          if (poser(c.fruit, grPourKcal(c.fruit, budget - kcal, amp), true)) pose.fruit = c.fruit.id;
        }
        if (c.gras && grasVaAvecPrise(c.gras, pose) && !priseDejaGrasse(pieces) &&
            cible.kcal - kcal >= 60) {
          poser(c.gras, grPourKcal(c.gras, cible.kcal - kcal, amp), true);
        }
      } else if (s.forme === "collation") {

        // que s'il reste la place d'un fruit ENTIER — sinon la ligne dit « seule ».
        // Meme reserve qu'au petit-dejeuner, et pour la meme raison.
        //
        // LES DEUX ACCOMPAGNEMENTS SONT BORNES A UNE PORTION COURANTE — voir
        // grPorAppoint. C'est ce qui remplace « le fruit mange tout le budget »
        // par « le fruit est une portion, et l'en-cas prend la suite ».

        // L'EN-CAS D'UN CRENEAU ALLEGE DOIT GAGNER SA PLACE.
        //

        // porte 1,2 g de proteines : negligeable une fois, mais un profil leger

        // 2,4 g sur 48 kg font 0,05 g/kg — assez pour repasser au-dessus de la
        // borne que le banc A4 tient depuis trois passes (2,729 g/kg avant la
        // passe, 2,771 avec l'en-cas partout, 2,729 en le reservant a ce cas).
        //

        // normalement — sa part est absorbee par la passe 2, qui retaille la
        // source d'autant. Dans un creneau ALLEGE, il ne se sert que s'il a
        // quelque chose a corriger, c'est-a-dire si la prise precedente etait
        // deja du fruit nu. Une prise d'appoint isolee reste alors ce qu'elle

            }
          }
        };
        if (c.encasDabord) { colEncas(); colFruit(); } else { colFruit(); colEncas(); }
        if (c.gras && grasVaAvecPrise(c.gras, pose) && cible.kcal - kcal >= 60) {
          poser(c.gras, grPourKcal(c.gras, cible.kcal - kcal, amp), true);
        }
      } else if (s.forme === "legere" || s.forme === "laitier") {
        // MEME REGLE QUE LA COLLATION : ces creneaux sont eux aussi des prises
        // d'appoint — « Premiere prise », « Avant la seance », « Avant le
        // coucher » —, et c'est chez « pre » qu'on lisait « 1 banane » juste
        // apres « 2 oranges ». Le fruit y est borne a une portion courante, et
        // le feculent sec ou l'en-cas passe devant lui quand la prise
        // precedente etait deja du fruit nu.
        var legFruit = function () {
          if (c.fruit && cible.kcal - kcal >= 45) {

            }

          // Meme raison qu'encasTropProteines, et c'est la seconde moitie de la
          // meme mesure : les deux feculents du matin portent 13 g (flocons) et
          // 9 g (pain) de proteines aux 100 g. Une fois le fruit borne a une
          // portion, le budget calulaire libere tombait sur eux, et « pre »
          // servait « 1 gourde de compote + 1 tranche de pain complet » la ou
          // il n'avait le droit de servir aucune proteine — 3,6 g rendus a une
          // journee dont on venait justement de retirer la source. Releve sur la
          // pire journee du balayage (f48, prise de masse, 5 repas) : 2,729
          // g/kg avant la passe, 2,813 avec le feculent, 2,729 sans lui.
          //

          // son feculent exactement comme avant.
          if (c.prot && c.fec && r2 >= 60) {

          // se sert que s'il a une repetition a casser. Voir colEncas.
          if (c.encas && (c.prot || c.encasDabord) && r2 >= 55) {

        };
        if (c.encasDabord) { legSec(); legFruit(); } else { legFruit(); legSec(); }
      }
      res = { pieces: pieces, prot: prot, kcal: kcal, protAcc: protAcc };
    }
    return res;
  }

  // LE NOM DU CRENEAU SUIT LA JOURNEE. nutriSlotsFor ajoute « pre » des que le
  // nombre de repas depasse les creneaux de base, sans regarder profile.days :
  // quelqu'un qui s'entraine trois jours sur sept recevait « Avant la seance —
  // 17h30 » les quatre autres jours, et la cafeine accrochee dessus contredisait
  // sa propre note sur la meme carte. On ne RETIRE pas le creneau — la structure
  // du plan indexe les cases cochees et doit rester la meme tous les jours —, on
  // l'appelle par son vrai nom : c'est une prise de fin d'apres-midi, et elle
  // n'est « avant la seance » que les jours ou il y a une seance.
  var PRE_NOM_REPOS = "Fin d'après-midi";
  function nutriNomSlot(s, ctx) {
    if (s.k === "pre" && ctx && ctx.seance === false) return PRE_NOM_REPOS;
    return s.nom;
  }

  // Jour d'entrainement ou pas, pour une date donnee. Par defaut VRAI : quand on
  // ne sait pas — profil sans jours declares, date illisible —, on garde le
  // libelle que l'utilisateur a configure plutot que d'inventer un jour de repos.
  function nutriEstSeance(prof, dateKey) {
    if (!prof || !isArray(prof.days) || !prof.days.length) return true;
    if (!DATE_RE.test(String(dateKey))) return true;
    var d = dateFromKey(dateKey);
    if (!d || isNaN(d.getTime())) return true;
    return prof.days.indexOf(dayKey(d.getDay())) >= 0;
  }

  // LE TEXTE D'UNE PRISE, un seul endroit. Il est partage par la composition du
  // plan et, jusqu'a la v1.12.0, par les remplacants du tiroir de correction —
  // deux ecritures separees
  // auraient diverge des la premiere retouche, et l'utilisateur aurait lu deux
  // grammaires differentes pour la meme assiette sur le meme ecran.
  function nutriTextePrise(r, s, cible, nomSlot) {
    var i, txt = [], manque = cible.kcal - r.kcal, texte, assais = [], titre = "";
    // UN FECULENT « CONTENANT » DONNE SON NOM AU PLAT. Il n'y a de plat que s'il
    // y a de quoi le garnir : sans source de proteines, un wrap reste un wrap.
    var aSource = false;
    for (i = 0; i < r.pieces.length; i++) {
      if (r.pieces[i].a && r.pieces[i].a.cat === "prot") aSource = true;
    }
    if (aSource) {
      for (i = 0; i < r.pieces.length; i++) {
        var ct = r.pieces[i].a;
        if (!ct || !ct.contenant) continue;
        titre = ct.contenant;
        // LE TITRE COMPTE CE QU'IL ANNONCE. Quatre tranches ne font pas « un
        // sandwich », elles en font deux. Un contenant qui va par unites
        // (`parUnite`) dit combien il y en a des qu'il y en a plus d'une.
        if (ct.parUnite > 1 && ct.gPor > 0) {
          var nu = Math.round(r.pieces[i].g / (ct.parUnite * ct.gPor));
          if (nu > 1) titre = nu + " " + (ct.contenantPl || (ct.contenant + "s"));
        }
        break;
      }
    }
    for (i = 0; i < r.pieces.length; i++) {
      // CE QUI ASSAISONNE NE SE COMPTE PAS COMME UN PLAT. « + 2 cuillères à
      // soupe d'huile d'olive (20 g) », au même rang que les sardines et le
      // pain, se lit comme quelque chose qu'on mange à côté. On l'écrit comme ce
      // que c'est : une incise, après les aliments.
      if (r.pieces[i].a && r.pieces[i].a.assaisonne) {
        assais.push(alimentTexte(r.pieces[i].a, r.pieces[i].g));
        continue;
      }
      // Le contenant ouvre la liste : c'est lui qui structure le plat.
      if (titre && r.pieces[i].a && r.pieces[i].a.contenant) {
        txt.unshift(alimentTexte(r.pieces[i].a, r.pieces[i].g));
        continue;
      }
      txt.push(alimentTexte(r.pieces[i].a, r.pieces[i].g));
    }
    texte = txt.join(" + ");
    if (texte && titre) texte = titre + " : " + texte;
    if (texte && assais.length) texte += ", assaisonné de " + assais.join(" et ");
    if (!texte) texte = nomSlot + " libre";
    // « seule » etait ecrit en dur et invariable : le mot visait la COLLATION
    // mais se lisait comme un accord avec l'aliment, d'ou « 1 pot de yaourt grec
    // (150 g) seule » et « 3 oeufs durs seule ». On ecrit desormais une suite
    // qui ne s'accorde avec rien et reste juste quel que soit le composant.
    // « et rien d'autre » se lisait comme une interdiction — l'appli ne decide
    // pas de l'assiette. « seul aliment de la prise » CONSTATE la composition
    // proposee sans rien defendre, et ne s'accorde toujours avec rien.
    //
    // LES DEUX AVEUX NE S'ARTICULAIENT PAS. Ils s'ajoutaient sans se connaitre,
    // et quand les deux tombaient ensemble la ligne se lisait « 2 gourdes de
    // compote sans sucre (180 g), seul aliment de la prise + resservir selon la
    // faim » : l'apposition est fermee par une virgule, puis un « + » relance la
    // liste d'aliments — l'aveu se lit comme un ingredient de plus.
    //
    // LE « + » APPARTIENT A LA LISTE D'ALIMENTS, ET A ELLE SEULE. C'est la seule
    // regle a retenir ici, et elle vaut aussi pour l'aveu quand il sort tout
    // seul : les deux deviennent des INCISES separees par des virgules, qui se
    // lisent a la suite sans jamais se faire passer pour quelque chose qu'on
    // mange.
    //   « ..., seul aliment de la prise, a resservir selon la faim »
    //   « ..., a resservir selon la faim »
    // Une liste plutot que deux `if` qui concatenent : l'ordre des incises est
    // alors une propriete visible du code, et un troisieme aveu ajoute demain
    // s'inserera sans rouvrir la question de la ponctuation.
    var incises = [];
    if (s.forme === "collation" && r.pieces.length === 1) incises.push("seul aliment de la prise");
    // Aveu honnete plutot que faux chiffre : quand tous les composants sont a
    // leur maximum raisonnable et qu'il manque encore de quoi manger, on le dit.
    if (manque > cible.kcal * TOL_PRISE && manque >= 120) incises.push("à resservir selon la faim");
    if (incises.length) texte += ", " + incises.join(", ");

  }

  function nutriComposerPrise(slotK, cible, ctx) {

    // composes dans l'ordre de la journee par nutriComposerJournee, donc ce
    // drapeau se lit toujours sur la prise qui PRECEDE reellement.
    //
    // Un repas de structure remet le compteur a zero tout seul, sans qu'on ait a
    // l'ecrire : une assiette n'est jamais entierement composee de fruit, donc
    // priseEstFruitNu y rend faux. La regle ne rapproche donc que des prises
    // d'appoint voisines — « Collation 16h » et « Avant la seance 17h30 » —,
    // c'est-a-dire exactement les deux que le releve met en cause.
    //
    // ctx peut manquer : le tiroir de correction composait une prise isolee, hors
    // journee. Sans contexte il n'y a pas de « prise precedente », et la regle
    // se tait — c'est le comportement d'avant, a l'identique.
    if (ctx) ctx.fruitNuPrec = priseEstFruitNu(r);
    return { slot: slotK, nom: nom, h: s.h, texte: nutriTextePrise(r, s, cible, nom),
             prot: Math.round(r.prot), kcal: Math.round(r.kcal),
             cibleProt: cible.prot, cibleKcal: cible.kcal };
  }

  // Les cles de creneau d'une journee, dans l'ordre. Sortie en fonction plutot
  // qu'ecrite en ligne : le contexte est construit dans une declaration `var`
  // multiple, ou une boucle ne rentre pas.
  function nutriClesDe(parts) {
    var out = [], i;
    for (i = 0; i < parts.length; i++) out.push(parts[i].k);
    return out;
  }

  function nutriComposerJournee(parts, n, dateKey, facteur, sans, amp, seance) {
    var ctx = { cook: n.cook !== false, dateKey: dateKey, dejaVu: {}, sans: sans,
                seance: seance !== false, slots: nutriClesDe(parts) },
        out = [], i, cible, kc = 0, pr = 0, r;
    for (i = 0; i < parts.length; i++) {
      cible = { k: parts[i].k, prot: (sans && sans[parts[i].k]) ? 0 : parts[i].prot,
                kcal: Math.round(parts[i].kcal * facteur / 10) * 10,
                amp: amp > 1 ? amp : 1,
                // Absent tant que la boucle 1 bis n'a pas eu a poser de plafond,
                // c'est-a-dire dans l'immense majorite des journees.
                protMax: parts[i].protMax > 0 ? parts[i].protMax : 0 };
      r = nutriComposerPrise(parts[i].k, cible, ctx);
      r.cibleKcal = parts[i].kcal;
      kc += r.kcal; pr += r.prot;
      out.push(r);
    }
    return { prises: out, kcal: kc, prot: pr };
  }

  // --- La journee entiere ------------------------------------------------------
  function nutriJour(prof, targets, dateKey) {
    var n = prof.nutri || {}, keys = nutriSlotsFor(n), i, supps = {}, fixe = { prot: 0, kcal: 0 };
    for (i = 0; i < (n.supps || []).length; i++) supps[n.supps[i]] = true;
    // La proteine en poudre n'est pas un creneau : c'est un apport FIXE qu'on
    // retire de la cible avant de repartir le reste. Sinon les repas seraient
    // dimensionnes comme si elle n'existait pas, et la journee deborderait.
    if (supps.whey) {
      var pp = aliment("poudreprot");
      if (pp) {
        var apw = alimentApport(pp, pp.nPor * pp.gPor);
        fixe.prot += Math.round(apw.prot); fixe.kcal += apw.kcal;
      }
    }
    var parts = nutriRepartir(targets, keys, fixe);
    var viseK = Math.max(0, targets.kcal - fixe.kcal);
    var viseP = Math.max(0, targets.prot - fixe.prot);
    var sans = {}, essai, tour, seance = nutriEstSeance(prof, dateKey);

    // BOUCLE 1 — les proteines. On compose, on MESURE, et si le total depasse la
    // cible de plus de 20 %, on retire la source proteinee d'une prise d'appoint
    // (avant seance, coucher, premiere prise) qui redevient une prise d'energie.
    // On mesure au lieu d'estimer : la portion minimale servable d'un aliment ne
    // dit pas ce que l'algorithme choisira reellement.
    //
    // ET LE PLAFOND QUE L'APPLI DOCUMENTE ELLE-MEME. Le seuil de 20 % de
    // depassement et le plafond de 2,2 g/kg tombent presque au meme endroit —
    // la cible vaut 1,8 g/kg, et 2,2 / 1,8 fait 1,22 —, et il suffisait de
    // tomber ENTRE LES DEUX pour que l'appli propose un plan puis lui reproche
    // d'en proposer trop, sur la meme carte, a six lignes d'ecart (6 % des
    // profils mesures). On traite la CAUSE — un creneau porteur de proteines de
    // moins — plutot que de commenter l'effet. Le plafond porte sur le TOTAL du
    // plan, donc complements compris : c'est ce que nutriBilanPlan totalise.
    var plafondJour = (prof.startWeight > 0 && typeof AV_PROT_PLAFOND_GKG === "number")
      ? AV_PROT_PLAFOND_GKG * prof.startWeight : 0;
    var partsJour = parts;
    essai = nutriComposerJournee(partsJour, n, dateKey, 1, sans, 1, seance);
    for (tour = 0; tour < SLOTS_ALLEGEABLES.length; tour++) {
      if (essai.prot <= viseP * PROT_MAX_DEPASSEMENT &&
          (!plafondJour || essai.prot + fixe.prot <= plafondJour)) break;
      var vise = null, z;
      for (z = 0; z < SLOTS_ALLEGEABLES.length; z++) {
        if (keys.indexOf(SLOTS_ALLEGEABLES[z]) >= 0 && !sans[SLOTS_ALLEGEABLES[z]]) { vise = SLOTS_ALLEGEABLES[z]; break; }
      }
      if (!vise) break;
      sans[vise] = true;
      // La part du creneau qu'on vient de vider retourne aux repas de structure.
      // Sans cette ligne, l'allegement ne faisait pas que baisser le total : il
      // AMAIGRISSAIT L'ASSIETTE, en laissant 10 a 20 g du budget dans un creneau
      // qui n'en sert plus rien. Voir nutriRendreAuxRepas.
      partsJour = nutriRendreAuxRepas(parts, sans);
      essai = nutriComposerJournee(partsJour, n, dateKey, 1, sans, 1, seance);
    }


    // BOUCLE 2 — L'AMPLEUR. Avant de rattraper l'ecart par un facteur, on
    // regarde si la journee tient VRAIMENT dans ses creneaux. A deux prises, les
    // plafonds « jamais plus du double d'une portion courante » condamnaient la
    // journee a 1 909 kcal / 95 g quelle que soit la cible : le plan plafonnait,
    // et c'est l'utilisateur qui s'entendait ensuite reprocher le manque.
    //
    // On monte l'ampleur par crans, on RECOMPOSE et on RE-MESURE a chaque cran,
    // et on s'arrete des que la cible est atteinte : on ne gonfle jamais une
    // journee qui tenait deja. Mesurer plutot qu'estimer, comme la boucle des
    // proteines juste au-dessus — la portion servable d'un aliment ne dit pas ce
    // que l'algorithme choisira reellement une fois les deux passes jouees.
    var amp = 1, ai, cand;
    for (ai = 0; ai < AMP_CRANS.length; ai++) {
      if (essai.kcal >= viseK * 0.95 && essai.prot >= viseP * 0.95) break;
      cand = nutriComposerJournee(partsJour, n, dateKey, 1, sans, AMP_CRANS[ai], seance);
      // Un cran qui n'apporte rien ne se paie pas : on garde le precedent.
      if (cand.kcal <= essai.kcal && cand.prot <= essai.prot) break;
      amp = AMP_CRANS[ai];
      essai = cand;
    }

    // BOUCLE 3 — les calories. Ce qui reste apres l'ampleur est un ecart
    // d'arrondi. On le mesure, on en tire un facteur BORNE, on recompose une
    // fois. Borne, parce qu'au-dela ce n'est plus un arrondi qu'on rattrape :
    // c'est une cible que la table ne sait pas servir, et il vaut mieux l'avouer
    // que gonfler les portions dans le vide.
    var f = 1, fin = essai;
    if (essai.kcal > 0) {
      f = viseK / essai.kcal;
      if (f < CORR_MIN) f = CORR_MIN;
      if (f > CORR_MAX) f = CORR_MAX;
      if (f < 0.98 || f > 1.02) fin = nutriComposerJournee(partsJour, n, dateKey, f, sans, amp, seance);
    }

    // BOUCLE 4 — LE PLAFOND, ET IL VIENT EN DERNIER. Ce n'est pas un detail
    // d'ordonnancement : c'est la seule position ou il ne se bat pas contre les
    // trois boucles precedentes.
    //
    // PREMIERE ECRITURE, MESUREE ET JETEE. Le plafond etait tenu juste apres
    // l'allegement, et les boucles 2 et 3 recevaient chacune un verrou pour ne
    // pas le repasser. Les verrous marchaient — 0 journee au-dessus du plafond —
    // mais ils marchaient EN COUPANT LES CALORIES : la boucle d'ampleur voyait
    // une journee courte, tentait un cran, constatait qu'il repassait le plafond
    // proteique et renoncait. Une journee de Marie sortait a 1 182 kcal pour
    // 1 400 visees, avec un diner sans le moindre feculent. On avait remplace un
    // defaut visible par un pire.
    //
    // Ici, les calories sont DEJA calees — ampleur et facteur ont fait leur
    // travail sans entrave, exactement comme avant ce correctif — et on ne
    // touche plus qu'a la densite proteique des repas de structure. Baisser la
    // source laisse d'ailleurs plus de place a l'accompagnement, qui est
    // dimensionne sur les calories restantes : l'assiette ne maigrit pas, elle
    // se recompose.
    if (plafondJour && fin.prot + fixe.prot > plafondJour) {
      var sc, base = fin;
      for (sc = 0; sc < STRUCT_CRANS.length; sc++) {
        var pBas = nutriPlafonnerStructure(partsJour, base, STRUCT_CRANS[sc]);
        var eBas = nutriComposerJournee(pBas, n, dateKey, f, sans, amp, seance);
        // Un cran qui n'abaisse plus rien ne se paie pas : les portions ont
        // touche GR_MIN_SERVI, et serrer le plafond d'un cran de plus ne ferait
        // que mentir sur ce que le plan vise sans rien retirer de l'assiette.
        if (eBas.prot >= fin.prot) break;
        fin = eBas;
        partsJour = pBas;
        if (fin.prot + fixe.prot <= plafondJour) break;
      }

      // RENDRE LES CALORIES QUE LA COUPE A EMPORTEES. Le facteur de la boucle 3
      // a ete calcule AVANT le plafonnement ; reduire la source retire aussi ses
      // calories, et plus rien ne les remettait. Mesure : une journee de Marie
      // tombait a 1 142 kcal pour 1 400 visees, avec un diner sans le moindre
      // feculent — il s'en fallait de 3 kcal pour que le seuil de 40 laisse
      // passer une portion. Un plafond proteique tenu au prix d'un diner vide,
      // c'est un defaut pire que celui qu'on corrigeait.
      //
      // ET CE N'EST PAS LA BOUCLE 2 QUI RECOMMENCE. La source reste bornee par
      // protMax dans partsJour : ce qui grossit ici, ce sont les
      // ACCOMPAGNEMENTS, dimensionnes sur les calories restantes. Du feculent,
      // pas de la viande — c'est exactement l'echange que le plafond demande.
      // LE DEPASSEMENT EST-IL ASSUME ? Depuis que la source d'un repas de
      // structure ne descend plus sous une portion courante (voir
      // grPorCourante), les crans peuvent s'arreter AVANT d'avoir tenu le
      // plafond : c'est le prix voulu, et il est paye par un « A savoir », pas
      // par une alerte.
      //
      // Mais il ne doit pas etre paye DEUX FOIS. Le garde-fou ci-dessous
      // refusait le rattrapage calorique des que le plafond n'etait pas tenu —
      // c'est-a-dire exactement dans les journees ou il ne pouvait plus l'etre.
      // L'utilisateur aurait recu le depassement ET l'assiette maigre : le pire
      // des deux mondes, et precisement le « diner sans le moindre feculent »
      // que le paragraphe du dessus raconte avoir deja produit une fois.
      // Quand le plafond n'est plus tenable, il cesse d'etre la contrainte qui
      // decide, et ce sont les calories qui reprennent la main.
      var assume = fin.prot + fixe.prot > plafondJour;
      if (fin.kcal > 0) {
        var f2 = f * viseK / fin.kcal;
        if (f2 < CORR_MIN) f2 = CORR_MIN;
        if (f2 > CORR_MAX) f2 = CORR_MAX;
        if (f2 > f) {
          var rec = nutriComposerJournee(partsJour, n, dateKey, f2, sans, amp, seance);
          // Le rattrapage ne rouvre pas la porte au depassement : si le feculent
          // en plus repassait le plafond, on garde la journee plus maigre. Sauf
          // quand le depassement est deja la, voir juste au-dessus — la source
          // reste bornee par protMax dans partsJour, ce qui grossit ici est du
          // feculent, et il ne peut pas emballer les proteines.
          if (assume || rec.prot + fixe.prot <= plafondJour) { fin = rec; f = f2; }
        }
      }
    }
    return { prises: fin.prises, facteur: f, ampleur: amp, slots: keys, sans: sans, fixe: fixe,
             total: { prot: fin.prot + fixe.prot, kcal: fin.kcal + fixe.kcal } };
  }

  // --- Note chiffree d'une ligne ----------------------------------------------
  // Un seul endroit ecrit cette phrase, et elle porte les deux nombres que le
  // reste de l'appli relira — y compris sur un plan d'avant la v1.5.0, ou aucune
  // ligne n'a de champ chiffre et ou le total ne peut venir que de la note.
  function nutriNote(prot, kcal) {
    var t = "";
    if (prot > 0) t = Math.round(prot) + " g prot";
    if (kcal > 0) t += (t ? " · " : "") + frNum(kcal) + " kcal";
    return t;
  }

  // --- Remplacants et composition manuelle, pour l'editeur de correction -------
  // Attendus par block_nutri_correction_ui.js. Ils degradent proprement : sans
  // eux l'editeur ne propose que du texte libre, avec eux il propose une tape.

  // UN REMPLACANT EST UNE PRISE, PAS UN ALIMENT NU.
  //
  // Le premier jet ne calibrait que sur les PROTEINES et ne rendait qu'un
  // aliment seul. Mesure sur un dejeuner « mozzarella + epinards + pain » a
  // 550 kcal : les cinq options offertes valaient 132 a 260 kcal, et nutriAvis
  // — le juge de l'appli, sur le meme ecran — les condamnait TOUTES LES CINQ,
  // parce qu'elles faisaient perdre 300 a 400 kcal a la journee. Une appli qui
  // propose cinq choix et desapprouve les cinq ne propose rien.
  //
  // On compose donc le remplacant comme le generateur compose une prise : meme
  // creneau, meme forme, meme cible PROTEIQUE **ET** CALORIQUE, meme
  // accompagnement. Ce qui change d'une option a l'autre est la SOURCE de
  // proteines — c'est la question posee (« a la place, j'ai pris quoi ? »), et
  // c'est la seule qui merite cinq reponses. La garniture, elle, est tiree une
  // fois, avec la meme graine que le plan : le feculent et le legume restent.
  //
  // AUCUNE OPTION N'EST L'ALIMENT DEJA PRESENT dans la ligne : proposer de
  // remplacer du poulet par du poulet est une case perdue sur cinq.
  var REMPL_MAX = 5, REMPL_MIN = 3;
  // Part de la cible calorique de la ligne remplacee qu'un remplacant doit tenir
  // avant qu'on cesse de monter l'ampleur. 0,9 laissait passer des options a
  // -10 % : sur une journee qui frole deja le plancher calorique, ce seul ecart
  // suffit a faire dire a l'appli « la journee passerait sous 1 600 kcal » de la
  // proposition qu'elle vient d'ecrire.
  var REMPL_KCAL_TENU = 0.97;
  var REMPL_KCAL_PAR_PROT = 15;   // repli d'ordre de grandeur pour un plan v1.3.0



  // ===========================================================================
  // CE BLOC EST CONSERVE DELIBEREMENT — NE PAS LE SUPPRIMER
  // ---------------------------------------------------------------------------
  // L'ECRAN qui l'appelait est parti en v1.12.0 : le tiroir de correction n'a
  // plus d'objet quand l'appli ne propose plus de repas. Le MOTEUR, lui, reste,
  // et il n'a temporairement AUCUN appelant vivant. C'est voulu.
  //
  // POURQUOI. alimentLireLibre sait lire un texte alimentaire et dire qu'il est
  // aberrant — « 3 pizzas », « 500 g de kiwi ». C'est la seule piece de l'appli
  // qui sache ca, et c'est elle qui deviendra le VALIDATEUR du plan ecrit par
  // une IA en v1.14.0. Sans elle, l'appli enregistrerait ce qu'une IA a ecrit
  // sans jamais le regarder : un tuyau, pas une application qui sait ce qu'elle
  // propose.
  //
  // Un validateur sans appelant se fait supprimer par la premiere personne qui
  // fait du menage. Ce commentaire est sa seule protection, avec test_c_libre —
  // qui reste vert sans avoir ete touche par le retrait de l'ecran, et c'est
  // precisement ce qui prouve que moteur et interface etaient bien separes.
  // ===========================================================================

  // ===========================================================================
  // CORRECTION D'UNE PRISE, ET AVIS DE L'APPLI
  // ---------------------------------------------------------------------------
  // Le plan nutrition est une PROPOSITION. Personne ne mange le lundi ce qu'un
  // generateur a decide le mois dernier. Deux choix de fond decoulent de la :
  //
  //   1. La correction ne remplace JAMAIS la proposition dans le stockage : elle
  //      se pose A COTE, dans `corr`. `item` et `note` continuent de porter le
  //      texte d'origine. C'est ce qui rend « revenir en arriere » gratuit — un
  //      delete — et ce qui permet de reporter les corrections quand un
  //      rediagnostic reconstruit le plan.
  //
  //   2. Une correction NE CHANGE NI L'ORDRE NI LA LONGUEUR de nutriPlan. Les
  //      cases cochees du journal sont indexees par la POSITION de la prise
  //      (entry.nutri = { "0": true, "3": true }). Inserer ou retirer une ligne
  //      decalerait des mois d'historique en silence. On remplace en place, on
  //      n'ajoute pas, on ne supprime pas.
  //
  // L'appli DONNE UN AVIS et ALERTE. Elle n'interdit rien. Une seule chose est
  // refusee, et ce n'est pas un jugement nutritionnel : une correction sans
  // texte, parce qu'il n'y a alors rien a enregistrer.
  // ===========================================================================

  // --- Bornes de stockage ----------------------------------------------------
  // Volontairement LARGES. Le role du nettoyage est d'empecher un stockage abime
  // de casser l'ecran, pas de juger l'assiette : le jugement est le travail de
  // nutriAvis(), et lui n'efface rien. Une saisie aberrante doit donc etre
  // ENREGISTRABLE pour pouvoir etre COMMENTEE.
  //
  // DEUX bornes de texte, et non une, parce que les deux textes n'ont pas la
  // meme origine. NUTRI_LIGNE_MAX borne ce que le GENERATEUR ecrit : une
  // composition complete. NUTRI_ITEM_MAX borne ce que l'UTILISATEUR tape dans le
  // champ « Autre chose », dont le maxlength vaut 90 : lui laisser 300 ne servi-
  // rait qu'a stocker un paragraphe illisible sur une ligne de liste.
  //
  // LA MESURE, ET POURQUOI ELLE A ETE REFAITE. Ce commentaire annoncait « 194
  // caracteres sur l'ensemble des profils possibles » : FAUX, et faux deux fois.
  // Le proprietaire avait mesure 223 sur 97 496 remplacants (5 poids, 14 dates,
  // plafond a 110 kg) ; un agent avait annonce 254, jamais reproduit. Balayage
  // refait, plus large que les deux :
  //   - large   : 16 poids (40 a 180 kg), 5 objectifs, 2 sexes, 2 a 5 repas,
  //               petit-dejeuner, collation, cuisine, 4 jeux de complements,
  //               3 niveaux d'alcool, 28 dates -> 61 440 profils,
  //               1 159 051 remplacants ;
  //   - profond : la famille lourde que l'agent designe (h/130 kg/2 repas) et
  //               tout son voisinage, avec les 28 dates POUR CHAQUE profil ->
  //               3 371 136 remplacants.
  // Soit 4 530 187 remplacants. MAXIMUM REEL = 235, ni 223 ni 254. Il est
